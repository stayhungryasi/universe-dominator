name: Daily Universe Dominator Update

on:
  schedule:
    # 정각은 GitHub 부하로 자주 건너뜀 → 정각 회피, 하루 3회 (아침·점심·저녁)
    # ※ GitHub 예약은 best-effort라 불안정 — 확실한 실행은 외부 스케줄러(cron-job.org)가 담당
    - cron: '17 23 * * *'   # 08:17 KST (다음날)
    - cron: '17 3 * * *'    # 12:17 KST
    - cron: '17 9 * * *'    # 18:17 KST
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 — quick: 빌드·배포만(2~3분, 업로드 반영용) / full: 전체 수집 포함(~10분)'
        type: choice
        default: quick
        options: [quick, full]

# 동시 실행 방지 — 새 실행이 시작되면 진행 중이던 이전 실행은 자동 취소
concurrency:
  group: daily-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    env:
      FULL_RUN: ${{ github.event_name == 'schedule' || inputs.mode == 'full' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'   # 검증 환경(Claude 샌드박스 3.12)과 일치 — f-string 문법 사고 재발 방지
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 자가진단 — 핵심 로직 회귀 테스트. 실패 시 수집 중단 (오염 방지, 2026-07 AMD 사고 이후)
      - name: Selftest (core logic regression)
        run: python scripts/selftest.py
        continue-on-error: false

      - name: Fetch latest market cap data (+ daily snapshot)
        if: env.FULL_RUN == 'true'
        run: python scripts/fetch_data.py
        continue-on-error: false

      # 데이터 무결성 검증 — 종목 수·중복·정렬·전일 대비 실종 감시 → quality_report.json
      - name: Validate data integrity
        if: env.FULL_RUN == 'true'
        run: python scripts/validate_data.py
        continue-on-error: true
      
      # 잠재지배자 후보 자동 생성 (완전 자동)
      # ⚠️ 첫 출시: --preview = 사이트 미반영, data/latent_auto_preview.json 만 생성.
      #    결과 확인 후 아래 --preview 를 지우면 라이브(latest.json 직접 갱신).
      # 실패해도 파이프라인 중단 안 됨(continue-on-error) → latent 기존값 유지.
      - name: Generate latent candidates (auto)
        if: env.FULL_RUN == 'true'
        run: python scripts/generate_candidates.py
        continue-on-error: true

      # 종목 리서치·분석 기사 자동 수집 (Google News RSS)
      # 실패해도 파이프라인 중단 안 됨 → 기존 research.json 유지
      - name: Fetch research articles (auto)
        if: env.FULL_RUN == 'true'
        run: python scripts/fetch_research.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true

      # 시장 주요일정 수집 (FOMC 고정 + Finnhub 실적 + 뉴스 이벤트)
      # 신호 관측소 — 실리콘밸리 고신호 담론·발표 포착
      - name: Fetch silicon valley signals (auto)
        if: env.FULL_RUN == 'true'
        run: python scripts/fetch_signals.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true

      # 🔬 필독 해부실 — 필독 신호 원문을 문단별 한국어 브리핑으로 재서술
      # (전문 번역이 아님 — 저작권 원칙은 fetch_translations.py 상단 참조)
      # 항목별 continue-on-error 구조라 유료벽·404가 있어도 나머지는 계속 해부된다
      - name: Dissect must-read signals (auto)
        if: env.FULL_RUN == 'true'
        run: python scripts/fetch_translations.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true

      # 필독 신호 → 관측일지 자동 심층 칼럼 (하루 1편)
      - name: Signal deep-dive column (auto)
        if: env.FULL_RUN == 'true'
        run: python scripts/signal_column.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true

      - name: Fetch market calendar (auto)
        if: env.FULL_RUN == 'true'
        run: python scripts/fetch_calendar.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        continue-on-error: true
      
      # 거인의 어깨 — 투자 거인 13F 포트폴리오 (SEC EDGAR, 키 불필요)
      # 실패해도 파이프라인 중단 안 됨 → 기존 gurus.json 유지
      - name: Fetch guru portfolios (13F)
        if: env.FULL_RUN == 'true'
        run: python scripts/fetch_gurus.py
        continue-on-error: true

      # 개척자 — 세상을 바꾸는 인물들의 최신 신호 (Google News RSS + Haiku)
      # 실패해도 파이프라인 중단 안 됨 → 기존 pioneers.json 유지
      - name: Fetch pioneers signals (auto)
        if: env.FULL_RUN == 'true'
        run: python scripts/fetch_pioneers.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true

      # 토요일(KST)에만 주간 History 자동 생성
      # cron이 23:00 UTC = 다음날 08:00 KST 이므로,
      # 금요일 23:00 UTC 실행분이 토요일 08:00 KST가 됨 → KST 요일로 판정
      - name: Weekly history (Saturdays KST only)
        if: env.FULL_RUN == 'true'
        run: |
          DOW=$(TZ='Asia/Seoul' date +%u)   # 1=월 ... 6=토, 7=일
          if [ "$DOW" -eq 6 ]; then
            echo "토요일 — 주간 History 생성"
            python scripts/weekly_history.py
            python scripts/weekly_column.py
          else
            echo "토요일 아님 (요일=$DOW) — 주간 History 건너뜀"
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 시차 관측 — 판단층(buffett_config.json)에 오늘 시세를 곱해 괴리 측정
      # config 는 사람이 취재한 판단층이라 어떤 경우에도 재생성되지 않는다.
      # 실패해도 파이프라인 중단 안 됨 → 기존 buffett.json 유지 (탭은 어제 값으로 뜬다)
      - name: Measure Buffett multiple gap (parallax)
        if: env.FULL_RUN == 'true'
        run: python scripts/fetch_buffett.py || echo "::warning::fetch_buffett 실패 — 시차 관측은 기존 값 유지"
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        continue-on-error: true

      # 존 전이(탐색·본격·정당선 교차)만 관측노트에 기록 — 변화 없으면 침묵
      - name: Record parallax zone crossings to journal
        id: parallax
        if: env.FULL_RUN == 'true'
        # `|| echo` 로 끝내면 스텝 outcome 이 항상 success 가 되어 sentinel 이
        # '실행 흔적 없음'을 영영 못 본다 → 경고를 남기되 실패는 실패로 보고하고,
        # continue-on-error 가 파이프라인을 계속 굴린다 (기존 동작 그대로).
        run: python scripts/parallax_journal.py || { echo "::warning::parallax_journal 실패 — 이번 회차 기록 생략"; exit 1; }
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        continue-on-error: true

      # 🧭 동행 관측 — 3사 10년 논제를 관찰로 쌓는 에세이 엔진
      # build_site 앞에 둔다: essays.json 이 journal.html 에 주입되기 때문.
      # 논제 원장이 플레이스홀더인 회사는 수집조차 하지 않고 "관찰 대기" 로그만 남긴다.
      - name: Companion essays (3-company thesis observation)
        id: companion
        if: env.FULL_RUN == 'true'
        run: python scripts/companion_essays.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        continue-on-error: true

      - name: Build all site pages
        run: python scripts/build_site.py
      
      # 관제탑 봇 — 사이트 변동을 커뮤니티에 자동 공지 (변동 없으면 침묵)
      - name: Community notice bot
        id: notice
        if: env.FULL_RUN == 'true'
        run: python scripts/post_community_notice.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        continue-on-error: true

      # 텔레그램 모닝브리핑 — 하루 1회, 매일 첫 실행에서 채널로 발사
      - name: Telegram morning briefing
        if: env.FULL_RUN == 'true'
        run: python scripts/send_telegram_briefing.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        continue-on-error: true

      # ── 정비 관제탑 — 침묵 실패 감시 (관측자, 커밋 직전 마지막 관문) ──
      # 우아한 저하 덕에 파이프라인은 죽지 않는다. 대신 조용히 비어간다.
      # 이 스텝이 산출물을 읽어 '비어가는 중'을 텔레그램으로 시끄럽게 만든다.
      # !cancelled() — 앞 스텝이 일부 실패해도 실행한다(그때가 가장 알아야 할 때).
      #   always() 대신 쓰는 이유: concurrency cancel-in-progress로 취소된 회차는
      #   판정 대상이 아니다(오탐 방지).
      # SENTINEL_STEPS — 봇의 '실행 흔적'은 CI에서 파일 mtime으로 알 수 없다
      #   (fresh checkout이라 전부 방금 갱신된 것처럼 보인다). 스텝 결과만이 진실.
      - name: Pipeline sentinel (silent-failure alarm)
        if: ${{ !cancelled() && env.FULL_RUN == 'true' }}
        run: python scripts/pipeline_sentinel.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          SENTINEL_STEPS: >-
            parallax_journal=${{ steps.parallax.outcome }},community_notice=${{ steps.notice.outcome }},companion_essays=${{ steps.companion.outcome }}
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "Auto update: $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')"
            # 동시 실행 충돌 대비: 최대 3회 rebase 후 push 재시도
            for i in 1 2 3; do
              if git push; then
                echo "push 성공"
                break
              fi
              echo "push 거부 — 원격 변경 반영 후 재시도 ($i/3)"
              git pull --rebase origin main || git rebase --abort
              sleep $((i * 3))
            done
          fi

      # ── 경성 실패 경보 — sentinel조차 못 도는 대참사용 ──
      # sentinel과 완전 독립(파이썬·스크립트 무관, curl 한 줄). 워크플로 자체가
      # 죽으면 이 스텝만이 유일한 목소리다.
      # ⚠️ 수용 리스크 (2026-08-21 선장님 승인): 이 curl 경로만은 실전 미검증이다.
      #    파이프라인이 실제로 경성 실패해야 처음 도는 코드라 평시에 검증할 길이
      #    없다(고의로 실패시키지 않는 한). sentinel 본체의 발송부는 매일 실전
      #    발송되는 모닝브리핑과 같은 경로를 재사용하므로 사실상 매일 검증된다 —
      #    미검증으로 남는 것은 여기 curl 한 줄뿐이며, 그 대가로 '파이썬이
      #    안 도는 상황'까지 커버한다는 이득을 얻는다.
      # ⚠️ 수용 리스크 ②: 경성 실패 회차는 아래 commit 스텝이 건너뛰어져
      #    sentinel의 연속 0건 카운터가 유실될 수 있다(경보가 하루 늦어짐).
      #    경성 실패 자체는 이 스텝이 즉시 잡으므로 감수한다.
      - name: Hard failure alarm (workflow died)
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT_ID || secrets.TELEGRAM_CHAT_ID || '@stayhungryasi' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ]; then
            echo "::warning::[정비] TELEGRAM_BOT_TOKEN 없음 — 경성 실패 경보 발송 불가"
            exit 0
          fi
          MSG="🚨 UNIVERTRIX 워크플로 경성 실패: $RUN_URL"
          API="https://api.telegram.org/bot$TG_TOKEN/sendMessage"
          curl -sS -m 30 -o /dev/null -X POST "$API" --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$MSG" || echo "::warning::[정비] 경보 발송 실패 (curl)"
