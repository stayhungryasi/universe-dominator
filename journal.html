<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관측노트 · UNIVERTRIX</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root, [data-theme="light"] {
  --bg: #FAF6EC; --bg-card: #FFFFFF; --header-bg: rgba(250, 246, 236, 0.95);
  --text: #1A2438; --text-secondary: #525F7E; --text-muted: #8590AA;
  --gold: #9C7A3A; --gold-bg: #F0E6CC;
  --line: #E8DFC9; --line-strong: #C9BC9A;
}
[data-theme="dark"] {
  --bg: #0A0E14; --bg-card: #1C2330; --header-bg: rgba(10, 14, 20, 0.95);
  --text: #FFFFFF; --text-secondary: #B5BFD6; --text-muted: #6F7E9E;
  --gold: #D4A658; --gold-bg: #2A2519;
  --line: #2A3142; --line-strong: #3A4458;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard Variable', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  font-feature-settings: 'tnum', 'ss01'; line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  min-height: 100vh; display: flex; flex-direction: column;
}
.container { max-width: 720px; margin: 0 auto; padding: 0 20px; width: 100%; }

.site-header { background: var(--header-bg); border-bottom: 1px solid var(--line); }
.site-header-inner { max-width: 720px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; color: var(--text); }
.brand a { text-decoration: none; color: inherit; display: flex; gap: 8px; align-items: center; }
.brand-star { color: var(--gold); }
.brand-tag { font-size: 13px; font-weight: 500; color: var(--text-muted); }
.header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.update-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: var(--gold-bg);
  border-radius: 100px; font-size: 12px; font-weight: 700;
  color: var(--gold); font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .update-badge { border: 1px solid rgba(212,166,88,0.3); }
.update-badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); animation: pulse 2s ease-in-out infinite;
}
[data-theme="dark"] .update-badge::before { box-shadow: 0 0 8px var(--gold); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.rate-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 12px; background: var(--bg-card);
  border: 1px solid var(--line); border-radius: 100px;
  font-size: 12px; font-weight: 700; color: var(--text-secondary);
  font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.rate-badge:hover { border-color: var(--gold); }
.rate-badge:hover #usdKrwDisplay, .rate-badge:hover .rate-badge-arrow { color: var(--gold); }
.rate-badge-arrow { font-size: 10px; margin-left: 2px; color: var(--text-muted); opacity: 0.7; transition: color 0.2s, opacity 0.2s; }
.rate-badge:hover .rate-badge-arrow { opacity: 1; }
.rate-badge #usdKrwDisplay { color: var(--text); font-weight: 800; }
@media (max-width: 480px) { .rate-badge { font-size: 11px; padding: 5px 10px; } .update-badge { font-size: 11px; padding: 5px 10px; } }
@media (max-width: 380px) { .update-badge::before { display: none; } }

.theme-toggle {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--bg-card);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
}
.theme-toggle svg { width: 18px; height: 18px; }
.icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: none; }
[data-theme="dark"] .icon-sun { display: inline; }

.site-nav { position: sticky; top: 0; z-index: 50; background: var(--header-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
.site-nav-inner { max-width: 720px; margin: 0 auto; display: flex; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
.site-nav-inner::-webkit-scrollbar { display: none; }
.nav-tab { flex-shrink: 0; padding: 14px 18px; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-muted); text-decoration: none; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
.nav-tab:hover { color: var(--text-secondary); }
.nav-tab.active { color: var(--text); border-bottom-color: var(--gold); }

main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 0; }

.placeholder-card {
  text-align: center;
  padding: 56px 32px;
  border: 1px dashed var(--line-strong);
  border-radius: 16px;
  background: var(--bg-card);
  max-width: 480px;
  width: 100%;
}
.placeholder-icon { font-size: 56px; margin-bottom: 16px; }
.placeholder-eyebrow {
  font-size: 11px; font-weight: 800; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
}
.placeholder-title {
  font-size: 30px; font-weight: 800; letter-spacing: -0.03em;
  color: var(--text); margin-bottom: 12px;
}
.placeholder-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.6; }
.placeholder-note { font-size: 12px; color: var(--text-muted); margin-top: 18px; }

.site-footer { padding: 24px 0 40px; border-top: 1px solid var(--line); text-align: center; }
.footer-brand { display: flex; justify-content: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text-secondary); }
.footer-link { color: var(--text-secondary); text-decoration: none; font-weight: 700; }
.footer-link:hover { color: var(--gold); }
.footer-divider { color: var(--text-muted); font-weight: 400; }

@media (max-width: 480px) { .nav-tab { padding: 12px 14px; font-size: 13px; } .placeholder-title { font-size: 24px; } }

.nt-hero { padding: 36px 0 8px; }
.nt-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.14em; color: var(--gold); }
.nt-title { font-size: 30px; font-weight: 800; margin: 4px 0 6px; }
.nt-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
.nt-box { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 20px; }
.nt-box textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; font-family: inherit; font-size: 14.5px; color: var(--text); box-sizing: border-box; min-height: 64px; resize: vertical; }
.nt-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.nt-row input { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-family: inherit; font-size: 13px; color: var(--text); }
.btn-gold { background: var(--gold); color: #fff; border: none; border-radius: 10px; padding: 10px 22px; font-weight: 800; font-size: 14px; cursor: pointer; font-family: inherit; }
.nt-count { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
.nt-item { background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin-bottom: 10px; }
.nt-meta { font-size: 11.5px; color: var(--text-muted); margin-bottom: 6px; display: flex; gap: 10px; align-items: center; }
.nt-text { font-size: 14.5px; line-height: 1.75; white-space: pre-wrap; }
.nt-tag { font-size: 10.5px; font-weight: 800; color: var(--gold); }
.nt-del { background: none; border: none; color: var(--text-muted); font-size: 11.5px; cursor: pointer; margin-left: auto; font-family: inherit; }
.nt-login { text-align: center; margin-top: 26px; }
.nt-login button { background: none; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; text-decoration: underline; font-family: inherit; }

/* ── 동행 관측 ── 한 기업의 10년 항로를 관찰로 쌓는 탭. 논제(고정) 위에 에세이(누적).

   ⚠️ 타이포는 **눈금 하나**만 쓴다. 논제 원장과 에세이는 같은 화면에 나란히
   놓이므로 본문 크기가 다르면 한쪽이 부록처럼 읽힌다(2026-08-23 통일 전:
   원장 14px/1.8 · 에세이 15.5px/1.85 로 갈라져 있었다).
   개별 요소에 px 를 다시 박지 말고 아래 변수만 참조할 것.
     위계: 제목(--note-title) > 섹션(--note-h) > 본문(--note-body) > 메타(--note-meta)
   한줄 노트(.nt-*)는 이 눈금 밖이다 — 짧은 호흡이 그 탭의 정체성이라 건드리지 않는다. */
:root {
  --note-title: 20px;      /* 에세이 제목 · 원장 카드 이름 */
  --note-title-lh: 1.35;
  --note-h: 17px;          /* 섹션 제목 — 에세이 h3 = 원장 h2 (같은 층) */
  --note-h-weight: 700;
  --note-body: 15.5px;     /* 본문 — 원장·에세이 동일 */
  --note-body-lh: 1.7;
  --note-meta: 12.5px;     /* 날짜·배지·버튼·출처·면책 */
}

.ce-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.ce-tabs::-webkit-scrollbar { display: none; }
.ce-tab { flex-shrink: 0; padding: 10px 14px; font-size: 13.5px; font-weight: 700; color: var(--text-muted); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-family: inherit; white-space: nowrap; transition: color .2s, border-color .2s; }
.ce-tab:hover { color: var(--text-secondary); }
.ce-tab.active { color: var(--text); border-bottom-color: var(--gold); }

/* 논제 원장 = 📌 고정 공지. 카드 뼈대는 공용 .ud-acc + .ud-pin 이 맡는다.
   접힌 높이는 3줄 이내 — 배지 줄 1 + 한 문장 2줄(클램프). */
.ce-thesis { margin-bottom: 22px; }
.ce-thesis .ud-acc-head { flex-direction: column; align-items: stretch; gap: 8px; padding: 16px 20px; }
.ce-thesis-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ce-thesis-name { font-size: var(--note-title); line-height: var(--note-title-lh); font-weight: 800; letter-spacing: -0.02em; }
.ce-thesis-ver { font-size: var(--note-meta); font-weight: 700; color: var(--gold); background: var(--gold-bg); border-radius: 100px; padding: 3px 10px; white-space: nowrap; }
.ce-thesis-more { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: var(--note-meta); font-weight: 700; color: var(--text-muted); white-space: nowrap; }
.ce-thesis-one { font-size: var(--note-body); line-height: var(--note-body-lh); color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* 좁은 폭에서는 라벨을 줄여 배지 줄이 한 줄로 남게 한다 — 접힌 카드는 어디서나 3줄 이내 */
.ce-narrow-only { display: none; }
@media (max-width: 560px) {
  .ce-thesis .ud-acc-head { padding: 14px 16px; }
  .ce-thesis-head { gap: 7px; flex-wrap: nowrap; }
  .ce-wide-only { display: none; }
  .ce-narrow-only { display: inline; }
  .ce-thesis-name { font-size: var(--note-h); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ce-thesis-ver { font-size: 11px; padding: 2px 8px; }
  .ce-thesis-more { margin-left: auto; }
}
.ce-thesis-body { font-size: var(--note-body); line-height: var(--note-body-lh); color: var(--text); }
.ce-thesis-body h1 { font-size: var(--note-h); font-weight: 800; color: var(--text); margin: 12px 0 6px; letter-spacing: -0.02em; }
.ce-thesis-body h2 { font-size: var(--note-h); font-weight: var(--note-h-weight); color: var(--gold); margin: 20px 0 6px; letter-spacing: -0.02em; }
.ce-thesis-body ul, .ce-thesis-body ol { margin: 8px 0 8px 20px; }
.ce-thesis-body li { margin: 6px 0; }
.ce-thesis-body p { margin: 8px 0; }
.ce-thesis-body blockquote { border-left: 3px solid var(--line-strong); padding: 2px 0 2px 12px; margin: 10px 0; color: var(--text-muted); font-size: var(--note-meta); line-height: 1.65; }
.ce-waiting { text-align: center; padding: 8px 0 4px; }
.ce-waiting-icon { font-size: 34px; }
.ce-waiting-text { font-size: var(--note-meta); color: var(--text-muted); margin-top: 6px; }

/* 에세이 본문 조판 = 관측일지 칼럼과 같은 급. 다만 헤더에는 칼럼의 비주얼
   블록(makeColViz)을 넣지 않는다 — 에세이는 칼럼보다 호흡이 짧아 회사 아이콘 ·
   날짜 · 판정만으로 충분하고, 그림은 본문 안 수치 차트가 맡는다. */
/* 아코디언 구조·동작은 공용 .ud-acc-* 에 있다 (build_site.py 의 ud-accordion-v1).
   여기에는 이 탭의 '눈금'만 둔다 — 구조를 다시 적으면 그 순간 두 벌이 된다. */
.ce-essay .ud-acc-title { font-size: var(--note-title); line-height: var(--note-title-lh); }
.ce-essay .ud-acc-meta { font-size: var(--note-meta); }
.ce-essay .ud-acc-caret { font-size: var(--note-meta); }
@media (max-width: 480px) { .ce-essay .ud-acc-title { font-size: var(--note-h); } }
.ce-essay-body { font-size: var(--note-body); line-height: var(--note-body-lh); color: var(--text); letter-spacing: -0.003em; }
.ce-essay-body h3 { font-size: var(--note-h); font-weight: var(--note-h-weight); color: var(--gold); margin: 20px 0 6px; letter-spacing: -0.02em; }
.ce-essay-body h3:first-child { margin-top: 4px; }
.ce-essay-body p { margin: 8px 0; }
.ce-essay-body b { font-weight: 800; }
.ce-essay-body ul, .ce-essay-body ol { margin: 8px 0 8px 20px; }
.ce-essay-body li { margin: 6px 0; }
.ce-essay-body .col-chart { margin: 18px 0; }
.ce-essay-body .col-chart svg { width: 100%; height: auto; display: block; border-radius: 10px; }
/* 차트 패널(#10141f)은 밤 테마 카드 배경과 명도가 가까워 그림의 경계가 사라진다.
   낮에는 저절로 '개체'로 읽히지만 밤에는 실선 하나가 있어야 그림으로 읽힌다. */
[data-theme="dark"] .ce-essay-body .col-chart svg { border: 1px solid var(--line-strong); }
/* 에세이 목차는 필독 해부실 목록을 **그대로** 쓴다 (공용 .ud-index-*).
   이 파일에 목차 전용 규칙을 두지 않는다 — 한 줄이라도 더하는 순간 두 목록이 갈라진다. */

.ce-share { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.ce-share button { background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--text-muted); font-size: var(--note-meta); padding: 5px 11px; cursor: pointer; font-family: inherit; font-weight: 700; }
.ce-share button:hover { border-color: var(--gold); color: var(--gold); }
.ce-essay-body .ce-src { font-size: var(--note-meta); word-break: break-all; }
/* 근거의 두께를 숨기지 않는다 — 전문을 못 읽은 출처는 그 사실을 옆에 적는다 */
.ce-src-note { color: var(--text-muted); font-weight: 700; }
.ce-essay-body .ce-src a { color: var(--gold); }
.ce-essay-body .ce-disc, .ce-essay-body .ce-coi { font-size: var(--note-meta); color: var(--text-muted); margin-top: 10px; line-height: 1.6; }
/* 판정 배지 — 약화도 숨기지 않는다. 반증의 기록이 있어야 확신의 기록이 신뢰를 얻는다. */
.ce-verdict { font-size: var(--note-meta); font-weight: 800; padding: 3px 10px; border-radius: 100px; border: 1px solid var(--line-strong); }
.ce-v-강화 { color: #fff; background: linear-gradient(120deg, #565CE8, #3EC8D8); border-color: transparent; }
[data-theme="dark"] .ce-v-강화 { background: linear-gradient(120deg, #8B93FF, #4FE0EF); color: #0A0B0F; }
.ce-v-불변 { color: var(--text-secondary); }
.ce-v-약화 { color: var(--text-muted); background: var(--bg); }
.ce-v-보류 { color: var(--text-muted); border-style: dashed; }
.ce-origin { font-size: var(--note-meta); font-weight: 800; color: var(--gold); }

.ce-inbox { background: var(--bg-card); border: 1px dashed var(--line-strong); border-radius: 14px; padding: 16px 18px; margin-bottom: 20px; }
.ce-inbox-title { font-size: 13px; font-weight: 800; color: var(--gold); margin-bottom: 10px; }
.ce-inbox input, .ce-inbox textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-family: inherit; font-size: 13.5px; color: var(--text); box-sizing: border-box; margin-bottom: 7px; }
.ce-inbox textarea { min-height: 80px; resize: vertical; }
.ce-mode { display: flex; gap: 6px; margin-bottom: 8px; }
.ce-mode button { flex: 1; padding: 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--text-muted); font-weight: 700; font-size: 12.5px; cursor: pointer; font-family: inherit; }
.ce-mode button.on { border-color: var(--gold); color: var(--gold); background: var(--gold-bg); }
.ce-inbox-note { font-size: 11.5px; color: var(--text-muted); margin-top: 8px; line-height: 1.6; }
.ce-mat { font-size: 12px; color: var(--text-secondary); border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 10px; }
.ce-mat-item { padding: 5px 0; border-bottom: 1px solid var(--line); }
</style>
<style>
/* 헤더 모바일 일관성 + 실시간 날짜·시계 (전 페이지 공통 — build_site.py 주입) */
@media (max-width: 480px) {
  .site-header-inner { flex-wrap: wrap; }
  .brand { flex-shrink: 0; }
}
.update-badge .ud-clock { margin-left: 6px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
/* UNIVERTRIX 로고 (build_site.py 주입) */
.brand.ud-logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
/* ── UNIVERTRIX 종합 로고 (오로라×궤도×호흡×서예) ── */
.uvx{display:inline-flex;align-items:center;gap:13px;text-decoration:none}
.uvx-lat{position:relative;display:inline-block}
.uvx-word{font-size:20px;letter-spacing:.3em;font-weight:400;line-height:1;
  background:linear-gradient(95deg,var(--text) 12%,var(--gold) 46%,var(--aurora2) 62%,var(--text) 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-variation-settings:'wght' 528}
.uvx-orbit{position:absolute;inset:-12px -11px -8px -7px;width:calc(100% + 18px);height:calc(100% + 20px);pointer-events:none;overflow:visible}
.uvx-orbit path{stroke:var(--gold);opacity:.9}
.uvx-orbit circle{fill:var(--aurora2)}
.uvx-kr{font-family:'Nanum Brush Script',cursive;font-size:26px;line-height:1;padding-left:13px;border-left:1px solid var(--text-muted);white-space:nowrap;
  background:linear-gradient(95deg,var(--text) 10%,var(--gold) 42%,var(--aurora2) 60%,var(--text) 90%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent}
@media(prefers-reduced-motion:no-preference){
  .uvx-word{animation:uvbreath 6s ease-in-out infinite}
  .uvx-kr{animation:krbreath 6s ease-in-out infinite}
  @keyframes uvbreath{0%,100%{font-variation-settings:'wght' 340}50%{font-variation-settings:'wght' 800}}
  @keyframes krbreath{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
}

<script>
document.addEventListener('DOMContentLoaded', function () {
  var badge = document.querySelector('.update-badge');
  if (!badge) return;
  badge.innerHTML = '<span class="ud-date"></span><span class="ud-clock"></span>';
  var dt = badge.querySelector('.ud-date');
  var clk = badge.querySelector('.ud-clock');
  function tick() {
    var now = new Date();
    dt.textContent = now.toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' }).replace(/-/g, '.');
    clk.textContent = now.toLocaleTimeString('en-GB', { hour12: false, timeZone: 'Asia/Seoul' });
  }
  tick();
  setInterval(tick, 1000);
});

const CE = {"companies": [{"slug": "spacex", "ko": "SpaceX", "emoji": "🚀", "thesis": {"placeholder": false, "version": "1.0", "updated": "2026-08-22", "one": "지구 저궤도를 물류망으로 바꾼 회사가, 그 물류망 위에 통신(Starlink)·컴퓨트(Colossus)· 이동(Starship)을 쌓아 우주 경제의 수직 통합 플랫폼이 된다.", "html": "<h1>SpaceX (SPCX) — 10년 논제 원장</h1><h2>10년 논제</h2><p>지구 저궤도를 물류망으로 바꾼 회사가, 그 물류망 위에 통신(Starlink)·컴퓨트(Colossus)· 이동(Starship)을 쌓아 우주 경제의 수직 통합 플랫폼이 된다. 우리는 로켓 회사가 아니라 \"궤도의 건물주\"가 되어가는 과정을 관측한다.</p><h2>핵심 가설</h2><ol><li><b>Starlink가 현금 엔진이 된다</b> [확신도: 상] 근거: 2026 2Q 매출 $4.3B(전체의 55%), 영업이익 $1.66B 흑자, 위성 ~11,000기, 모바일(EchoStar 스펙트럼) 진입 — 통신사가 아니라 통신 인프라 그 자체. 반증 조건: 가입자 성장 정체 + ARPU 하락이 2분기 연속, 또는 Kuiper 등 경쟁 별자리의 실질 점유 침투.</li><li><b>Starship이 단위 경제를 다시 한 번 부순다</b> [확신도: 중] 근거: Falcon이 발사 비용을 10분의 1로 만든 전례. V2 위성·화성 로드맵이 전부 이 배 위에 있다. 반증 조건: 상용 페이로드 정기 운항이 2028년까지도 미달성, 또는 발사 단가 개선이 Falcon 대비 유의미하지 않음이 확인될 때.</li><li><b>AI 세그먼트(xAI·X·Colossus)는 옵션이되, 검증 전이다</b> [확신도: 하] 근거: 네오클라우드 매출 7배 성장, 구글 월 $920M 딜, Anthropic의 Colossus 사용 계약 — 단 2Q 영업손실 $1.26B, 15~20GW 목표는 캐펙스 블랙홀. 반증 조건: AI 부문 손실이 Starlink 흑자를 2년 연속 잠식, 또는 외부 고객 이탈로 자가 소비용 인프라로 전락.</li><li><b>키맨 리스크는 상수다</b> [확신도: —] 머스크의 집중과 분산은 동전의 양면. 관측 대상이지 베팅 대상이 아니다.</li></ol><h2>버핏 눈금과의 관계</h2><p>시차 관측에서 추정불가(too hard) — 10년 쿠폰 칸이 백지인 건 사실이다. 그래서 이 원장이 존재한다: 에세이가 쌓일수록 백지가 숫자로 바뀌는지, 영영 백지인지를 기록한다. 상장 후 고점 대비 -40%, 목표가 스프레드 $115~401 — 시장도 쿠폰을 못 적고 있다는 증거.</p><h2>다음 관측 포인트</h2><ul><li>3Q 실적: Starlink 성장률과 AI 부문 손실 궤적 (11월 초 예상)</li><li>보호예수 해제 물량(8/20 319M주) 소화 — 수급이 아니라 내부자 행동으로 읽는다</li><li>Starlink 모바일 V2 위성의 Starship 탑재 발사 (2027 상용 목표의 선행 지표)</li></ul>"}}, {"slug": "alphabet", "ko": "Alphabet", "emoji": "🔭", "thesis": {"placeholder": false, "version": "1.0", "updated": "2026-08-22", "one": "'의도에 대한 통행료'(검색)를 지키면서, AI 풀스택(TPU→Gemini→제품)과 현실 세계 에이전트(Waymo)라는 두 번째·세 번째 통행료를 건설 중인 회사.", "html": "<h1>Alphabet (GOOG) — 10년 논제 원장</h1><h2>10년 논제</h2><p>'의도에 대한 통행료'(검색)를 지키면서, AI 풀스택(TPU→Gemini→제품)과 현실 세계 에이전트(Waymo)라는 두 번째·세 번째 통행료를 건설 중인 회사. 캐펙스 공포에 싸인 프랜차이즈가 공포를 하나씩 반증하는 과정을 관측한다 — 버크셔가 우리보다 먼저 같은 결론에 도달했다($366억, 3단 매수).</p><h2>핵심 가설</h2><ol><li><b>검색 해자는 침식이 아니라 변태 중이다</b> [확신도: 상] 근거: AI 검색 확산 속에서도 검색 광고 +17%(2026 2Q), 쇼핑 광고 관련성 +20%, 11분기 연속 두 자릿수 성장. \"검색 사망론\"은 아직 실적에 나타난 적이 없다. 반증 조건: 검색 매출 성장률이 한 자릿수로 2분기 연속 감속하며 Gemini 대체 효과가 광고 단가에 나타날 때.</li><li><b>클라우드+TPU가 두 번째 통행료가 된다</b> [확신도: 상] 근거: 클라우드 +82%, 수주잔고 $514B, TPU 외부 데이터센터 판매 개시(매출 인식 시작), 토큰 처리 22B/분(1분기 만에 +37%), 공급 제약 지속. 반증 조건: 수주잔고 전환율 둔화 + TPU 외부 수요가 자사 소비 대비 미미한 수준에 머물 때.</li><li><b>캐펙스는 공포가 아니라 씨즈급 재투자다</b> [확신도: 중] 근거: 2026 가이던스 $175~185B — 버핏 프레임의 최대 시험대. 증분 자본이 증분 통행료로 돌아오는지가 이 논제의 심장. 반증 조건: 클라우드 마진 개선 정체 + ROIC 하락 추세 2년 지속 — 그때는 씨즈형이 아니라 플라이트세이프티형으로 강등하고 정당 멀티플을 낮춘다.</li><li><b>Waymo는 공짜로 얹힌 세 번째 통행료 후보다</b> [확신도: 중] 근거: 주 50만 회 완전 자율주행(1년 내 2배), 11개 도시, 영국·일본 확장 — 상업성 입증 단계 진입. 반증 조건: 도시당 단위 경제가 공개됐을 때 구조적 적자이거나, 확장 속도가 규제로 3년 이상 정체.</li></ol><h2>버핏 눈금과의 관계</h2><p>시차 관측 존 편입: 정당 MAX 32 · 현재 괴리 +35% 안팎(관망, 본격선 부근). 버크셔 기준선(+40%)이 다시 열리는 순간 — 다음 공포 이벤트(반독점 판결, 캐펙스 추가 증액) — 이 이 원장의 최고 관측 시점이다.</p><h2>다음 관측 포인트</h2><ul><li>3Q 실적(10월 말): 클라우드 성장률·TPU 외부 매출 라인·캐펙스 가이던스 변화</li><li>Gemini 4 공개 (사전훈련 진행 중 공식 언급됨)</li><li>애드테크 반독점 구제안 판결 — \"검증 가능한 공포\"의 실물</li></ul>"}}, {"slug": "anthropic", "ko": "Anthropic", "emoji": "⚛️", "thesis": {"placeholder": false, "version": "1.0", "updated": "2026-08-22", "one": "\"안전하게 만든 지능이 가장 비싸게 팔린다\"는 명제의 실증 실험.", "html": "<h1>Anthropic — 10년 논제 원장</h1><blockquote>⚠ 이해관계 고지: 이 사이트의 에세이는 Anthropic의 모델(Claude)로 작성된다. 본 원장과 모든 에세이는 공식 발표·제3자 보도만을 근거로 하며, 칭찬과 비판에 같은 증거 기준을 적용한다.</blockquote><h2>10년 논제</h2><p>\"안전하게 만든 지능이 가장 비싸게 팔린다\"는 명제의 실증 실험. 엔터프라이즈가 신뢰를 이유로 지불하는 프리미엄이 지속 가능한 해자인지 — 프론티어 모델 경쟁 속에서 기업용 통행료형 사업이 성립하는지를 관측한다.</p><h2>핵심 가설</h2><ol><li><b>엔터프라이즈 통행료는 실재한다</b> [확신도: 상] 근거: ARR $47B(5월)→$65B(7월말), 기업 LLM 지출 점유 40%(Menlo, 1위), $1M+ 고객 1,000곳(반년 새 2배), 포춘10 중 8곳, 2026 2Q 첫 조정영업이익 흑자. 반증 조건: 점유율이 30% 아래로 꺾이며 가격 경쟁이 마진을 잠식할 때 — 통행료가 아니라 커머디티였다는 증거.</li><li><b>Claude Code = 씨즈캔디 순간</b> [확신도: 상] 근거: 코딩 특화 LLM 지출의 54% — 단일 제품이 만든 해자. $500M(2025.9)에서 $23.5B 기여 전망(2027.5)까지의 궤적. 반증 조건: 경쟁 에이전트에 점유 절반 잠식, 또는 코딩 자동화 단가의 급락으로 시장 자체가 디플레이션.</li><li><b>멀티클라우드 중립성이 구조적 우위다</b> [확신도: 중] 근거: AWS·Google·Azure 전 클라우드 유통 + SpaceX Colossus 컴퓨트 계약 — 어느 제국에도 종속되지 않은 유일한 프론티어 랩. 반증 조건: 특정 클라우드 의존도가 매출 절반을 넘어서며 협상력이 역전될 때.</li><li><b>규제·지정학은 실존 변수다</b> [확신도: —] 근거: 2026.6 수출통제로 Fable/Mythos 3일 오프라인 → 해제 복귀 — 프론티어 모델이 국가 전략 자산으로 취급되는 시대의 예고편. 관측 대상.</li></ol><h2>버핏 눈금과의 관계</h2><p>비상장(10월 나스닥 IPO 예정, S-1 제출 완료·$965B 밸류·2028 매출 $190~200B 기준 인수단 산정 보도). 상장되면 시차 관측 유니버스 편입을 검토하되, 초기 멀티플은 거의 확실히 추정불가 영역 — 이 원장이 쿠폰 칸을 채워가는 유일한 도구다.</p><h2>다음 관측 포인트</h2><ul><li>IPO 일정·공모 조건 (10월 예상) — 밸류에이션의 첫 공개 시험</li><li>3Q ARR 궤적 ($65B 이후의 기울기)</li><li>차기 모델 사이클과 기업 점유율 방어 (Gemini 4·GPT 차기작과의 3파전)</li></ul>"}}], "essays": [{"company": "anthropic", "date": "2026-08-25", "title": "통행료의 증거: $65B ARR, 엔터프라이즈 프리미엄의 첫 공개 검증", "verdict": "강화", "html": "<h3>무슨 일이 있었나</h3><p>Anthropic의 연간경상수익률(ARR)이 7월 말 기준 $65B에 도달했다고 로이터·월스트리트저널이 8월 18일 보도했다. 이는 5월 $47B 이후 불과 3개월간 $18B 증가한 수치다. 같은 시기 OpenAI의 2분기 성장률이 이보다 둔화했다는 보도와 대조를 이룬다. 상장 직전(10월 IPO 예정) 공개되는 마지막 비공식 성과다.</p><h3>10년 논제와의 연결</h3><p>이 수치는 논제 원장의 핵심 가설 1번 \"엔터프라이즈 통행료는 실재한다\"를 구체적으로 입증하는 첫 번째 공개 마일스톤이다. 원장이 제시한 반증 조건은 \"점유율이 30% 아래로 꺾이며 가격 경쟁이 마진을 잠식할 때\"인데, 현재는 정반대 방향으로 움직이고 있다: 기업 LLM 지출 시장점유 40% 유지, $1M+ 고객 1,000곳 달성(반년 새 2배), 포춘10 중 8곳 확보라는 집중도 지표들이 함께 흐르고 있기 때문이다. 이는 단순한 스케일이 아니라 가격 책정력의 증거다. OpenAI와의 성장률 대비를 통해 시장이 이미 두 플레이어를 구분하고 있음을 암시한다 — Claude는 \"더 비싼 쪽\"으로 선택되고 있다는 뜻이다.</p><h3>논제 판정</h3><p><strong>강화.</strong> ARR 성장 가속(3개월 $18B 증가)과 시점 통제(IPO 직전 이 수치를 공개한 것)는 엔터프라이즈 프리미엄 가설이 단순 추측이 아니라 검증된 현상임을 시장에 신호한다. 경쟁사 대비 성장 둔화 보도는 해자의 구조적 차이가 실행되고 있다는 추가 증거로 작동한다.</p><h3>무엇이 틀릴 수 있나</h3><p>ARR은 모수가 크지만 실현 확률이 아직 투명하지 않다. 고객당 순 팽창율(NRR), 고객 이탈률, 장기 계약 잠금 비율 같은 엔터프라이즈 SaaS의 기본 체질을 아직 공개하지 않았다. 또한 $65B는 \"연간경상 기준\"으로, 실제 현금 수취 일정과 환율·지정학 위험 등 무시할 수 없는 변수들이 남아 있다. 클라우드 파트너(AWS·Google·Azure)의 협상력 변화나, 규제 리스크(수출통제, EU AI Act 준수 비용)가 마진에 미치는 영향도 여전히 검증 대상이다. 마지막으로, 프론티어 모델 경쟁이 격화되면서 지금의 기술 우위가 12~18개월 뒤에도 가격 프리미엄을 정당화할 만큼 지속될지는 별개의 질문이다.</p><h3>다음 관측 포인트</h3><ul><li>10월 IPO 공개 이후 첫 공식 분기 결과(2026 3Q)에서 ARR, NRR, 고객 유지율 공시 — 통행료 구조가 재무제표로 검증되는 순간</li><li>10월 중순 S-1 수정본 제출 시 마진율 공시 및 장기 고객 계약의 잠금 기간 공개 — $65B가 얼마나 \"고착\"되어 있는지 판별</li><li>2026년 4분기~2027년 1분기 경쟁 모델 출시(Gemini 4·GPT-5 후속 등)와 동시 고객 이동 모니터링 — 프리미엄이 모델 주기에 따라 흔들리는지 확인</li></ul><div class=\"col-chart\"><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"700\" height=\"216\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"18\" font-weight=\"800\">Anthropic ARR 궤적</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12\" font-weight=\"600\">5월 → 7월말, 분기 성장</text><line x1=\"210\" y1=\"76\" x2=\"210\" y2=\"170\" stroke=\"#3a4568\"/><text x=\"26\" y=\"105.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">2026년 5월</text><rect x=\"216\" y=\"90.0\" width=\"261.8\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"486.8\" y=\"106.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">47B</text><text x=\"26\" y=\"151.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">2026년 7월말</text><rect x=\"216\" y=\"136.0\" width=\"362.0\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"587.0\" y=\"152.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">65B</text><text x=\"26\" y=\"202\" fill=\"#5a648a\" font-size=\"10\">자료: 원문 기사에서 추출 (자동)</text><text x=\"674\" y=\"202\" text-anchor=\"end\" fill=\"#9c7a3a\" font-size=\"11.5\" font-weight=\"800\">UNIVERTRIX · univertrix.com</text></svg></div><div class=\"ce-tail\"><h3>출처</h3><ul class='ce-src'><li><a href=\"https://www.reuters.com/technology/anthropic-revenue-run-rate-tops-65-billion-source-says-2026-08-17/\" target=\"_blank\" rel=\"noopener\">https://www.reuters.com/technology/anthropic-revenue-run-rate-tops-65-billion-source-says-</a><span class='ce-src-note'> (제목·요약 기반)</span></li><li><a href=\"https://www.wsj.com/tech/ai/openais-second-quarter-sales-show-tepid-growth-compared-with-anthropic-5cb42998\" target=\"_blank\" rel=\"noopener\">https://www.wsj.com/tech/ai/openais-second-quarter-sales-show-tepid-growth-compared-with-a</a><span class='ce-src-note'> (제목·요약 기반)</span></li></ul><p class='ce-coi'>이해관계 고지: 이 사이트의 자동 분석은 Anthropic 의 모델로 작성됩니다. Anthropic 에세이는 공식 발표와 제3자 보도만을 근거로 쓰며, 칭찬과 비판에 같은 증거 기준을 적용합니다.</p><p class='ce-disc'>본 동행 관측은 정보 제공 목적의 기록이며 특정 종목의 매수·매도 권유가 아닙니다. 판단과 손익은 독자 본인에게 귀속됩니다.</p></div>", "sources": [{"url": "https://www.reuters.com/technology/anthropic-revenue-run-rate-tops-65-billion-source-says-2026-08-17/", "full": false, "attempted": false}, {"url": "https://www.wsj.com/tech/ai/openais-second-quarter-sales-show-tepid-growth-compared-with-anthropic-5cb42998", "full": false, "attempted": false}], "origin": "auto", "slug": "anthropic-d89c096f"}, {"company": "alphabet", "date": "2026-08-24", "title": "재투자의 증명 — $205B 캐펙스가 $514B 수주로 돌아오다", "verdict": "강화", "html": "<h3>무슨 일이 있었나</h3><p>Sundar Pichai는 2026 2분기 실적 발표와 동시에 연간 캐펙스 가이던스를 $175~185B에서 $205B로 상향 조정했다. 같은 시점 Google Cloud 수주잔고가 $514B에 도달했고, 성장률은 +82%를 기록했다. 이는 전년 동기(가이던스 기준 증분 캐펙스) 대비 약 30B 상향이며, 동시에 클라우드 부문이 전체 캐펙스 증액분의 주요 수익 채널이 되고 있음을 시사한다.</p><h3>10년 논제와의 연결</h3><p>논제 원장의 핵심 가설 3번 — \"캐펙스는 공포가 아니라 씨즈급 재투자다\"의 가장 중요한 검증 지점이 지금이다. 버핏의 \"10년 쿠폰\" 프레임에서 이 캐펙스 증액이 단순 비용이 아니라 자본수익률 재투자인지를 판단할 구체적 수치가 나왔기 때문이다.</p><p>$205B 캐펙스가 정당화되려면, 그 증분(약 $30B)이 수익 창출 자산으로 얼마나 빠르게 전환되는가가 핵심이다. 현재 관찰되는 신호는 긍정적이다: (1) 클라우드 매출 +82% 성장 속에서 수주잔고가 $514B로 확대 → 이는 배분 파이프라인이 생성 속도보다 빠르다는 뜻. (2) 외부 TPU 판매 개시(매출 인식 시작) + 토큰 처리 속도 22B/분(1분기 만에 +37%) → 공급 제약이 원재료 가격을 지탱하는 구조. (3) 캐펙스 증액 타이밍이 클라우드 수주 급증과 일치 → \"공포\"가 아니라 \"제약 해제 재투자\"로 해석된다.</p><p>만약 이 시나리오가 2~3년 지속되면(수주를 매출로 전환하는 주기), 캐펙스의 ROIC는 버크셔 기준선(정당 멀티플 기준)을 정당화할 수 있다. 지금은 그 확신을 쌓는 시기다.</p><h3>논제 판정</h3><p><strong>[강화]</strong> 캐펙스 상향이 가이던스 인상이 아닌 \"제약 해제 신호\"로 작동하고 있으며, 클라우드 수주잔고 급증이 실시간 수익화 파이프라인 존재를 증명했기 때문. 다만 강화의 폭은 중간 정도 — 아직 실제 매출 전환 속도와 마진 개선이 공개되지 않았으므로.</p><h3>무엇이 틀릴 수 있나</h3><p>반대 해석: 캐펙스 상향은 \"공포 신호\"일 수 있다. 즉, 클라우드 수주잔고는 늘어나도 실제 전환율(backlog-to-revenue ratio)이 악화하고 있고, TPU 외부 수요는 자사 소비 대비 미미한 수준으로 머물러 있을 가능성이다. 그렇다면 $205B 캐펙스는 과도한 공급 비축(oversupply)을 의미하며, 향후 마진 압박과 ROIC 하락으로 이어질 수 있다. 또한 규제(반독점 구제안)가 Google Cloud 판매 채널을 제한하면 수주 전환 속도가 크게 둔화할 위험이 존재한다.</p><h3>다음 관측 포인트</h3><ul><li><strong>3Q 실적 (10월 말): </strong>클라우드 성장률 유지 여부, 수주잔고 전환율(잔고 대비 신규 매출 증분), TPU 외부 매출 구체적 규모. 현재는 \"기계적 증가\"일 가능성을 배제할 수 없다.</li><li><strong>Gemini 4 공개 및 통합 타이밍: </strong>검색 해자 침식 우려와 클라우드 선택 유도 메커니즘이 동시에 작동하는지 확인. \"의도에 대한 통행료\" → \"AI 완성도에 대한 통행료\"의 전환이 실제인지.</li><li><strong>반독점 구제안 판결 (Q4 예상): </strong>\"검증 가능한 공포\"의 스트레스 테스트. 만약 Google Cloud 배분 제약이 정해지면, 수주 전환율 가정을 대폭 하향 조정해야 한다.</li></ul><div class=\"col-chart\"><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"700\" height=\"216\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"18\" font-weight=\"800\">Google Cloud 성장 모멘텀</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12\" font-weight=\"600\">수주잔고(Backlog)와 전년비 매출 성장률</text><line x1=\"210\" y1=\"76\" x2=\"210\" y2=\"170\" stroke=\"#3a4568\"/><text x=\"26\" y=\"105.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">수주잔고 $514B</text><rect x=\"216\" y=\"90.0\" width=\"362.0\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"587.0\" y=\"106.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">514B / %</text><text x=\"26\" y=\"151.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">매출 성장률 +82%</text><rect x=\"216\" y=\"136.0\" width=\"57.8\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"282.8\" y=\"152.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">82B / %</text><text x=\"26\" y=\"202\" fill=\"#5a648a\" font-size=\"10\">자료: 원문 기사에서 추출 (자동)</text><text x=\"674\" y=\"202\" text-anchor=\"end\" fill=\"#9c7a3a\" font-size=\"11.5\" font-weight=\"800\">UNIVERTRIX · univertrix.com</text></svg></div><div class=\"col-chart\"><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"700\" height=\"216\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"18\" font-weight=\"800\">Alphabet 캐펙스 가이던스 상향</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12\" font-weight=\"600\">기존 가이던스 vs 2026년 신규 가이던스</text><line x1=\"210\" y1=\"76\" x2=\"210\" y2=\"170\" stroke=\"#3a4568\"/><text x=\"26\" y=\"105.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">기존 상단선 $185B</text><rect x=\"216\" y=\"90.0\" width=\"326.7\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"551.7\" y=\"106.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">185B</text><text x=\"26\" y=\"151.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">신규 가이던스 $205B</text><rect x=\"216\" y=\"136.0\" width=\"362.0\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"587.0\" y=\"152.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">205B</text><text x=\"26\" y=\"202\" fill=\"#5a648a\" font-size=\"10\">자료: 원문 기사에서 추출 (자동)</text><text x=\"674\" y=\"202\" text-anchor=\"end\" fill=\"#9c7a3a\" font-size=\"11.5\" font-weight=\"800\">UNIVERTRIX · univertrix.com</text></svg></div><div class=\"ce-tail\"><h3>출처</h3><ul class='ce-src'><li><a href=\"https://www.fool.com/investing/2026/08/16/sundar-pichai-raised-alphabets-capex-guidance-to-2/\" target=\"_blank\" rel=\"noopener\">https://www.fool.com/investing/2026/08/16/sundar-pichai-raised-alphabets-capex-guidance-to</a></li></ul><p class='ce-disc'>본 동행 관측은 정보 제공 목적의 기록이며 특정 종목의 매수·매도 권유가 아닙니다. 판단과 손익은 독자 본인에게 귀속됩니다.</p></div>", "sources": [{"url": "https://www.fool.com/investing/2026/08/16/sundar-pichai-raised-alphabets-capex-guidance-to-2/", "full": true, "attempted": true}], "origin": "auto", "slug": "alphabet-83aa9851"}, {"company": "alphabet", "date": "2026-08-23", "title": "5.9B의 침묵 — 캐펙스 공포가 현금 이야기가 되는 순간", "verdict": "강화", "html": "<h3>무슨 일이 있었나</h3><p>Alphabet은 Q2 2026에서 역사상 처음으로 분기 현금 유출 $5.9B를 기록했다. 동시에 2026년 전체 캐펙스 가이던스를 $15B 상향하여 $175~185B 범위로 재설정했다(연간 매출 대비 약 19~20%). 이는 7월 23일 Reuters 보도 이후 시장에 'AI 인프라'가 더 이상 성장 스토리가 아니라 현금흐름 관리 이슈로 인식되는 전환점을 만들었다.</p><h3>10년 논제와의 연결</h3><p>논제 원장의 핵심 가설 3('캐펙스는 공포가 아니라 씨즈급 재투자')은 이 숫자 하나에 가장 심하게 시험받고 있다. 원장은 명시했다: \"증분 자본이 증분 통행료로 돌아오는지가 이 논제의 심장\"이고, 반증 조건은 \"클라우드 마진 개선 정체 + ROIC 하락 추세 2년 지속\"이다. 현재 상황은 그 중간 지점이다.</p><p>현금유출 자체는 아직 반증이 아니다. Alphabet의 영업현금흐름(Operating CF)은 여전히 Q2에 $26.4B(전년 동기 $24.1B, +9.5%)이므로, 유출은 '캐펙스 투자 속도'가 현금 생성을 앞서간다는 뜻일 뿐이다. 버크셔가 $36.6B을 3단 매수한 논리가 정확히 이것이다: 현금을 쓰는 회사가 현금을 생성하는 회사보다 위험하지 않다면, 그 차이가 곧 '기회'다.</p><p>그러나 $15B 상향은 신호다. 이는 CFO가 초기 가이던스($160~170B로 추정)를 재평가했다는 뜻이며, 그 이유는 두 가지 중 하나다: (a) TPU/데이터센터 수요가 초기 예상을 크게 초과했거나, (b) 공급 제약이 생각보다 오래 지속될 것으로 예상되어 선제적 증설이 필요하거나. 어느 쪽이든 이는 두 번째 통행료(클라우드+TPU)의 규모가 실적에서 '정량화되기 시작했다'는 뜻이다.</p><h3>논제 판정</h3><p><strong>[강화]</strong> 현금유출은 자본효율 우려의 신호이지만, 동시에 TPU 외부 수요(두 번째 통행료)의 규모가 충분히 크다는 것을 간접 증명한다. 원장이 경고한 '반증 조건'(마진 개선 정체, ROIC 하락)은 아직 나타나지 않았으며, 오히려 클라우드 성장률 +82%와 수주잔고 $514B는 투자의 선행성을 뒷받침한다.</p><h3>무엇이 틀릴 수 있나</h3><p>현금유출이 구조적 신호일 수도 있다. 만약 클라우드의 마진 개선이 3Q~4Q에도 정체되고, 1년 뒤 ROIC(자본이익률)이 하락 추세로 돌아선다면, 이 캐펙스는 '씨즈급'이 아니라 '과잉투자'로 재평가될 것이다. 특히 생성형 AI의 실제 상용화 ROI가 기대치 아래로 내려올 경우, 이 $175~185B는 '낙관의 기록'이 될 수 있다. 또한 반독점 판결이나 규제 강화로 클라우드 외부 매출(예: TPU OEM 판매)이 제한될 경우, 투자의 회수 경로 자체가 차단될 수 있다.</p><h3>다음 관측 포인트</h3><ul><li><strong>3Q 실적 (10월 말)</strong>: 클라우드 마진(Google Cloud 영업이익률) 추이, TPU 외부 판매 매출 공개 여부 또는 수치 단서, 영업현금흐름 대비 캐펙스 비율이 $5.9B 유출 수준으로 지속되는가.</li><li><strong>4Q 2026 가이던스 (10월 말)</strong>: 2027년 캐펙스 가이던스 유지·축소·추가 증액 여부 — 이것이 '공포가 정당화되는가'의 최종 신호.</li><li><strong>버크셔 추가 매수 또는 매도 (분기 보고서 기준, 9월·12월)</strong>: 현금유출이 지속되는 상황에서 버핏의 다음 움직임이 곧 '기관 투자자의 확신 갱신 여부'를 나타낼 것.</li></ul><div class=\"col-chart\"><svg viewBox=\"0 0 700 262\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"700\" height=\"262\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"18\" font-weight=\"800\">Alphabet 현금흐름 구조 변화</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12\" font-weight=\"600\">Q2 2026: 영업현금흐름 vs 자본지출 (B)</text><line x1=\"210\" y1=\"76\" x2=\"210\" y2=\"216\" stroke=\"#3a4568\"/><text x=\"26\" y=\"105.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">Operating Cash Flow</text><rect x=\"216\" y=\"90.0\" width=\"295.9\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"520.9\" y=\"106.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">26.4B</text><text x=\"26\" y=\"151.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">Capital Expenditure (추정)</text><rect x=\"216\" y=\"136.0\" width=\"362.0\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"587.0\" y=\"152.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">32.3B</text><text x=\"26\" y=\"197.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">Free Cash Flow (추정)</text><rect x=\"216\" y=\"182.0\" width=\"66.1\" height=\"22\" rx=\"6\" fill=\"#5b8def\"/><text x=\"291.1\" y=\"198.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">-5.9B</text><text x=\"26\" y=\"248\" fill=\"#5a648a\" font-size=\"10\">자료: 원문 기사에서 추출 (자동)</text><text x=\"674\" y=\"248\" text-anchor=\"end\" fill=\"#9c7a3a\" font-size=\"11.5\" font-weight=\"800\">UNIVERTRIX · univertrix.com</text></svg></div><div class=\"col-chart\"><svg viewBox=\"0 0 700 262\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"700\" height=\"262\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"18\" font-weight=\"800\">2026 캐펙스 가이던스 재상향</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12\" font-weight=\"600\">초기 vs 재상향 (B)</text><line x1=\"210\" y1=\"76\" x2=\"210\" y2=\"216\" stroke=\"#3a4568\"/><text x=\"26\" y=\"105.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">초기 가이던스 (중값)</text><rect x=\"216\" y=\"90.0\" width=\"331.8\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"556.8\" y=\"106.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">165B</text><text x=\"26\" y=\"151.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">재상향 가이던스 (중값)</text><rect x=\"216\" y=\"136.0\" width=\"362.0\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"587.0\" y=\"152.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">180B</text><text x=\"26\" y=\"197.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">상향폭</text><rect x=\"216\" y=\"182.0\" width=\"30.2\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"255.2\" y=\"198.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">15B</text><text x=\"26\" y=\"248\" fill=\"#5a648a\" font-size=\"10\">자료: 원문 기사에서 추출 (자동)</text><text x=\"674\" y=\"248\" text-anchor=\"end\" fill=\"#9c7a3a\" font-size=\"11.5\" font-weight=\"800\">UNIVERTRIX · univertrix.com</text></svg></div><div class=\"ce-tail\"><h3>출처</h3><ul class='ce-src'><li><a href=\"https://www.marketscale.com/industries/software-and-technology/alphabets-59b-q2-cash-burn-is-turning-ai-infrastructure-into-a-cfo-led-capex-fight-in-2026\" target=\"_blank\" rel=\"noopener\">https://www.marketscale.com/industries/software-and-technology/alphabets-59b-q2-cash-burn-</a></li><li><a href=\"https://ncdoj.gov/some-north-carolinians-to-receive-payments-as-part-of-700-million-settlement-in-google-play-store-antitrust-lawsuit/\" target=\"_blank\" rel=\"noopener\">https://ncdoj.gov/some-north-carolinians-to-receive-payments-as-part-of-700-million-settle</a></li></ul><p class='ce-disc'>본 동행 관측은 정보 제공 목적의 기록이며 특정 종목의 매수·매도 권유가 아닙니다. 판단과 손익은 독자 본인에게 귀속됩니다.</p></div>", "sources": [{"url": "https://www.marketscale.com/industries/software-and-technology/alphabets-59b-q2-cash-burn-is-turning-ai-infrastructure-into-a-cfo-led-capex-fight-in-2026", "full": true, "attempted": true}, {"url": "https://ncdoj.gov/some-north-carolinians-to-receive-payments-as-part-of-700-million-settlement-in-google-play-store-antitrust-lawsuit/", "full": true, "attempted": true}], "origin": "auto", "slug": "alphabet-0ea8ae9f"}, {"company": "spacex", "date": "2026-08-23", "title": "정부가 궤도를 건설 허가했다 — 트럼프 우주 수송 정책과 Starship의 경제학", "verdict": "강화", "html": "<h3>무슨 일이 있었나</h3><p>도널드 트럼프 미국 대통령은 8월 20일 '국가 우주 수송 정책' 메모에 서명했다. 미국 정부는 2030년까지 상업 우주발사·재진입을 연간 1000회 수준으로 확대하겠다는 목표를 공식화했다. 신규 재진입장 후보지 식별(90일 이내), 개발계획 수립(240일 이내)이 연방 부처에 지시되었으며, 민간 우주수송 활동을 배제하거나 저해하는 정부 차원의 경쟁을 금지했다. 발사장 인프라 건설 공간 확보, 무선주파수 대역 확보, 인허가·환경 검토 신속화가 포함되었다.</p><p>배경: 지난해 미국 상업 우주발사 178회 중 170회를 SpaceX가 담당했으며, 이는 Falcon 9 165회, Starship 5회로 구성되었다. FAA 수장 브라이언 베드포드는 5월 Gwynne Shotwell SpaceX 사장으로부터 5년 내 연간 1만 회 발사 목표를 청취했다고 밝혔다.</p><h3>10년 논제와의 연결</h3><p>이 정책은 SpaceX 10년 논제의 핵심 가설 2번 「Starship이 단위 경제를 다시 한 번 부순다」의 거시 환경 조건을 근본적으로 강화한다. 논제는 Falcon이 발사 비용을 10분의 1로 내렸듯이, Starship이 현재 기술-경제학의 임계치를 재설정할 것이라 추정한다. 하지만 그 가설의 입증에는 단순한 로켓 성능을 넘어, 운영 환경의 구조 변화가 필수다.</p><p>정부 정책이 명시적으로 규정한 2030년 연 1000회 발사 목표는 ① 인허가 병목을 제거하고 ② 인프라 투자(재진입장 건설)를 공식 책임으로 전환하고 ③ 정부 경쟁을 배제함으로써, SpaceX가 순수 로켓 성능만이 아니라 정부-민간 협력 구조 안에서 발사 빈도를 확대할 조건을 제도적으로 보장한다. 이는 단순한 '지지' 신호를 넘어, Starship 위성 배치(현재 논제에서 V2 위성이 11,000기 배치 이후 단계), 달·화성 물류(정책에서 명시한 아르테미스 상업 수송, 화성 로봇 탐사 지원) 등 상위 사업의 경제성 가정을 1년 단위로 당겨준다.</p><p>2025년 논제 원장에서 「반증 조건: 상용 페이로드 정기 운항이 2028년까지도 미달성」이라 기록했는데, 이 정책은 그 기한을 규제 차원에서 가속할 명시적 인센티브를 제공한 것이다. 논제의 쿠폰 칸 — \"10년 뒤 Starship의 궤도 로그가 기록되는가\" — 의 검증 기한과 정부 정책 목표가 2028~2030년에서 수렴한다.</p><h3>논제 판정</h3><p><strong>[강화]</strong> 규제·인프라 토대가 확실해져 Starship 단위경제 가설의 반증 조건(상용 운항 미달성)이 정부 정책과 충돌하게 되었다. 2030년 1000회 발사 목표는 그 중 대다수가 SpaceX(현재 시장점유율 ~95%)여야 수학적으로 성립하므로, 미달성은 단순 기술 실패를 넘어 정부 정책 후퇴 선언이 되는 명분적 부담을 부여했다.</p><h3>무엇이 틀릴 수 있나</h3><p>이 정책 메모는 법적 구속력이 아닌 행정 지시(memo)다. 실제 예산 배정, 환경 규제 승인(특히 텍사스 재진입장, 동부 해상 발사장), 연방-주(state) 협의에서 지연이 2년 이상 누적될 가능성이 있다. 또한 '연 1000회' 목표는 소형 재사용 로켓(Virgin Orbit 같은 수평 발사), 중국 상업 우주사 진출 등 경쟁자 성장을 암묵적으로 무시한다. SpaceX가 목표의 절반만 달성해도 정부는 '성공'이라 선언할 유인이 있고, 이 경우 실제 Starship 활용률과는 괴리가 생길 수 있다. 마지막으로 화성·달 수송은 여전히 상용성이 입증되지 않았으며, 정책이 진술한 '상업 방안 검토'는 자금 투입이 아니라 검토일 뿐이다.</p><h3>다음 관측 포인트</h3><ul><li><strong>Starship V3 설계 공개 및 상용 페이로드 계약</strong> (2026년 Q4 예상) — 정부 정책이 발표된 직후 SpaceX가 구체적 상용 일정(Starlink V3 위성, 외부 고객 화물)을 공시하는지 추적. 정책이 실제로 내부 로드맵에 반영되었는가의 신호.</li><li><strong>재진입장 후보지 지정 및 인프라 투자 발표</strong> (2026년 11월 20일까지 — 90일 기한 만료) — FAA와 연방정부가 구체적 장소와 예산(2027년 예산안)을 공개하는지. 정책이 구속력을 갖는가의 분기점.</li><li><strong>2026년 3Q·4Q 실적에서 Starship 발사 회수 및 비용 공개</strong> (11월·2월) — 현재 '발사 5회' 기록이 2026년 말까지 월평균 3회 이상으로 가속하는지 여부. 정책이 기술 개발 속도에 영향을 미치고 있는지의 물증.</li></ul><div class=\"ce-tail\"><h3>출처</h3><ul class='ce-src'><li><a href=\"https://www.hellot.net/news/article.html?no=114491\" target=\"_blank\" rel=\"noopener\">https://www.hellot.net/news/article.html?no=114491</a></li><li>https://www.reuters.com (White House National Space Transportation Policy memo, 2026.08.20 — 한국 보도 기반 추적)<span class='ce-src-note'> (링크 불가 — 주소 형식 아님)</span></li></ul><p class='ce-disc'>본 동행 관측은 정보 제공 목적의 기록이며 특정 종목의 매수·매도 권유가 아닙니다. 판단과 손익은 독자 본인에게 귀속됩니다.</p></div>", "sources": [{"url": "https://www.hellot.net/news/article.html?no=114491", "full": true, "attempted": true}, {"url": "https://www.reuters.com (White House National Space Transportation Policy memo, 2026.08.20 — 한국 보도 기반 추적)", "full": true, "attempted": true}], "origin": "소재", "slug": "spacex-99a259ab"}, {"company": "anthropic", "date": "2026-08-22", "title": "Claude의 단백질 설계 능력, 새로운 엔터프라이즈 수직시장 증거", "verdict": "강화", "html": "<h3>무슨 일이 있었나</h3><p>Anthropic은 8월 18일 Claude(Mythos Preview·Opus 4.8)의 생명과학 능력을 공개했다. 단백질 바인더 설계에서 15개 타겟 중 14개 성공, 개별 설계의 22~35%가 바인딩에 성공했다(산업 표준 10~15% 대비). 별도로 Opus 5는 NMR·LC-MS 분석 데이터를 19~23분 내 완성했으며, 계약 연구소의 결과와 96.4% vs 96.33% 수준으로 일치했다.</p><h3>10년 논제와의 연결</h3><p>이번 공개는 논제 핵심①의 범위를 확장하는 신호다. 기존 가설은 \"엔터프라이즈 통행료\"를 기업 IT·소프트웨어 부문으로 한정했으나, 생명과학·신약 개발은 단가 매우 높은 새로운 수직시장이다. 단백질 설계는 \"역사적으로 전문가가 주당 몇 주~몇 달 소요\"하던 작업으로, 지금까지 AI의 미지 영역이었다. 성공률 2배 이상 달성은 \"안전하게 만든 지능이 가장 비싸게 팔린다\"는 명제가 단순 코드 자동화를 넘어 R&D 가속 자체로 통행료화할 수 있다는 실물 증거다. 이는 $1M+ 고객 확대의 새로운 진입점이면서, 동시에 제약사·바이오테크의 에디션에 특화된 가격책정 모델을 정당화할 근거를 제공한다.</p><h3>논제 판정</h3><p><strong>강화</strong> — 엔터프라이즈 통행료의 수직 범위가 소프트웨어 부문을 넘어 실험과학 R&D로 확장될 수 있음을 보여줬다. 단백질 설계 성공률이 산업 표준의 2배 이상이라는 수치는 의약학적 실질 가치(time-to-market 단축, 실패율 감소)를 객관화하는 첫 단서다.</p><h3>무엇이 틀릴 수 있나</h3><p>이번 발표는 Anthropic의 공식 블로그 게재이며, 외부 피어리뷰·재현 없이 사내 자료만 포함된다. 단백질 설계의 14/15 성공은 선별된 타겟일 수 있으며, 22~35% 바인딩 성공률도 \"비교 그룹\"의 정의(어느 실험실의 표준? 언제 측정?)가 명확하지 않다. 또한 생명과학이 검증(동물실험, 임상시험)에 걸리는 시간이 매우 길어, 단기간에 Claude의 \"실용적 영향\"을 판단하기 어렵다. 경쟁사(OpenAI, Google)도 같은 길을 걷고 있으며, 생명과학 AI 시장 자체가 아직 초기 단계라 단가 경쟁이 발생할 가능성도 존재한다.</p><h3>다음 관측 포인트</h3><ul><li>3Q 2026 ARR 추이 — 생명과학 부문이 별도 코호트로 추적되는가, 성장률이 가속되는가</li><li>제약·바이오테크 고객 수 공시 — 현재 \"Fortune 10 중 8곳\" 클레임 이후 명시적 산업별 고객 수 발표</li><li>Mythos/Opus 계열 생명과학 에디션의 가격책정 발표 (2026년 9월~10월) — 통행료 프리미엄이 구체화되는 시점</li></ul><div class=\"ce-tail\"><h3>출처</h3><ul class='ce-src'><li><a href=\"https://www.anthropic.com/research/Claude-accelerates-protein-design\" target=\"_blank\" rel=\"noopener\">https://www.anthropic.com/research/Claude-accelerates-protein-design</a></li><li><a href=\"https://www-cdn.anthropic.com/30bf50e22a01388bb29bf077ee3f244531594b7a.pdf\" target=\"_blank\" rel=\"noopener\">https://www-cdn.anthropic.com/30bf50e22a01388bb29bf077ee3f244531594b7a.pdf</a></li></ul><p class='ce-coi'>이해관계 고지: 이 사이트의 자동 분석은 Anthropic 의 모델로 작성됩니다. Anthropic 에세이는 공식 발표와 제3자 보도만을 근거로 쓰며, 칭찬과 비판에 같은 증거 기준을 적용합니다.</p><p class='ce-disc'>본 동행 관측은 정보 제공 목적의 기록이며 특정 종목의 매수·매도 권유가 아닙니다. 판단과 손익은 독자 본인에게 귀속됩니다.</p></div>", "sources": [{"url": "https://www.anthropic.com/research/Claude-accelerates-protein-design", "full": true, "attempted": true}, {"url": "https://www-cdn.anthropic.com/30bf50e22a01388bb29bf077ee3f244531594b7a.pdf", "full": true, "attempted": true}], "origin": "auto", "slug": "anthropic-bfa29070"}]};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let app, auth, db, me = null, cfg = null;

const fmtWhen = ts => {
  try { const d = ts && ts.toDate ? ts.toDate() : null; if (!d) return '';
    return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0')
      + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  } catch(e){ return ''; }
};
const isAdmin = () => me && cfg && cfg.adminUid && me.uid === cfg.adminUid;

/* ────────────────── 동행 관측 ──────────────────
   탭: 한줄 노트 · 기업 3사. 해시 딥링크는 확립된 패턴을 따른다 —
   #spacex/#alphabet/#anthropic 은 탭 해시, #essay-{slug} 는 에세이 영구 슬러그.
   (research 의 #dx- / observatory 의 #log- 과 같은 문법)                     */
let ceTab = 'notes', ceMode = 'essay';

function renderTabs(){
  const tabs = [{ id: 'notes', label: '한줄 노트' }].concat(
    (CE.companies || []).map(c => ({ id: c.slug, label: c.emoji + ' ' + c.ko })));
  $('ceTabs').innerHTML = tabs.map(t =>
    '<button class="ce-tab' + (t.id === ceTab ? ' active' : '') + '" data-tab="' + t.id + '">' +
    esc(t.label) + '</button>').join('');
  document.querySelectorAll('.ce-tab').forEach(b => b.onclick = () => setTab(b.dataset.tab, true));
}

function setTab(id, push){
  ceTab = id;
  renderTabs();
  const isNotes = (id === 'notes');
  $('paneNotes').style.display = isNotes ? '' : 'none';
  $('paneCompanion').style.display = isNotes ? 'none' : '';
  if (!isNotes) renderCompany(id);
  renderInbox();
  if (push) history.replaceState(null, '', isNotes ? location.pathname : '#' + id);
}

function companyOf(slug){ return (CE.companies || []).find(c => c.slug === slug); }

// 판단층이 바뀐 사실은 눈에 띄어야 한다 — 갱신 7일 이내면 배지에 점을 붙인다.
// 브라우저 시계로 재는 이유: 빌드 시점에 굳히면 캐시된 페이지가 며칠 뒤에도
// 'NEW' 를 달고 있게 된다 (거짓말이 된다).
function isRecent(updated, days){
  if (!updated) return false;
  const t = Date.parse(updated + 'T00:00:00+09:00');
  if (isNaN(t)) return false;
  return (Date.now() - t) <= (days || 7) * 86400000 && Date.now() >= t - 86400000;
}

function renderCompany(slug){
  const c = companyOf(slug) || { ko: slug, emoji: '', thesis: {} };
  const th = c.thesis || {};
  // 논제 원장 = 📌 고정 공지. 헌법은 맨 위에 있어야 하고, 접힌 채로도
  // '무엇을 믿고 있는가' 한 문장은 늘 보여야 한다. 전문은 클릭으로 편다.
  const fresh = isRecent(th.updated);
  $('ceThesis').innerHTML = '<div class="ce-thesis ud-acc ud-pin" id="thesisCard">' +
    '<button class="ud-acc-head" id="thesisHead" aria-expanded="false" aria-controls="thesisBody">' +
      '<span class="ce-thesis-head">' +
        '<span class="ud-pin-badge">📌<span class="ce-wide-only"> 논제 원장</span></span>' +
        '<span class="ce-thesis-name">' + esc(c.emoji + ' ' + c.ko) + '</span>' +
        (th.placeholder
          ? '<span class="ce-thesis-ver">논제 취재 중 🔭</span>'
          : '<span class="ce-thesis-ver' + (fresh ? ' ud-new-dot' : '') + '"' +
            (fresh ? ' title="최근 7일 안에 갱신된 판단층입니다"' : '') + '>' +
            '<span class="ce-wide-only">논제 </span>v' + esc(th.version) +
            ' · <span class="ce-wide-only">갱신 </span>' +
            '<span class="ce-wide-only">' + esc(th.updated) + '</span>' +
            '<span class="ce-narrow-only">' + esc(String(th.updated).slice(5)) + '</span>' +
            '</span>') +
        '<span class="ce-thesis-more"><span class="ce-wide-only">원장 전문 </span>' +
          '<span class="ud-acc-caret" aria-hidden="true">▸</span></span>' +
      '</span>' +
      '<span class="ce-thesis-one">' +
        (th.placeholder
          ? '10년 논제를 취재하는 중입니다. 논제가 서기 전까지는 에세이를 쓰지 않습니다 — 논제 없는 기록은 스크랩이기 때문입니다.'
          : esc(th.one || '')) +
      '</span>' +
    '</button>' +
    '<div class="ud-acc-detail" id="thesisBody">' +
      (th.placeholder
        ? '<div class="ce-waiting"><div class="ce-waiting-icon">🔭</div>' +
          '<div class="ce-waiting-text">논제가 서면 이 자리에 핵심 가설과 반증 조건이 들어섭니다.</div></div>'
        : '<div class="ce-thesis-body">' + (th.html || '') + '</div>') +
    '</div>' +
  '</div>';
  $('thesisHead').onclick = () => {
    const card = $('thesisCard');
    const open = !card.classList.contains('open');
    card.classList.toggle('open', open);
    $('thesisHead').setAttribute('aria-expanded', String(open));
  };

  // 아코디언 — 연표가 먼저, 전문은 클릭. 한 항로에 에세이가 쌓일수록
  // 전문을 다 펼쳐 두면 '언제 무슨 판정이 났는가'라는 시간의 축이 보이지 않는다.
  // 기본은 최신 1편만 펼침. 독립 토글이라 여러 편을 동시에 열어 비교할 수 있다.
  const list = (CE.essays || []).filter(e => e.company === slug);
  $('ceEssays').innerHTML = list.length ? list.map((e, i) => {
    const open = (i === 0);
    return '<div class="ce-essay ud-acc' + (open ? ' open' : '') + '" id="essay-' + esc(e.slug) + '">' +
      '<button class="ud-acc-head" data-toggle="' + esc(e.slug) + '"' +
        ' aria-expanded="' + open + '" aria-controls="detail-' + esc(e.slug) + '">' +
        '<span class="ud-acc-meta">' +
          '<span>' + esc(e.date) + '</span>' +
          '<span class="ce-verdict ce-v-' + verdictClass(e.verdict) + '">' + esc(e.verdict) + '</span>' +
          (e.origin === '직접' ? '<span class="ce-origin">소장 직접</span>' : '') +
        '</span>' +
        '<span class="ud-acc-title">' + esc(e.title) + '</span>' +
        '<span class="ud-acc-caret" aria-hidden="true">▸</span>' +
      '</button>' +
      '<div class="ud-acc-detail" id="detail-' + esc(e.slug) + '">' +
        '<div class="ce-share">' +
          '<button data-copy="' + esc(e.slug) + '">🔗 링크 복사</button>' +
          '<button data-copytext="' + i + '">📄 본문 복사</button>' +
        '</div>' +
        '<div class="ce-essay-body">' + (e.html || '') + '</div>' +
      '</div>' +
    '</div>';
  }).join('')
    : '<div class="nt-count">아직 이 항로의 관측 기록이 없습니다.</div>';

  // 목차 — 필독 해부실의 '해부 목록'을 그대로 복제한다(마크업·클래스·행 구성 동일).
  // 링크(<a href="#essay-…">)라서 클릭하면 해시가 바뀌고, 해시 처리기가 펼치고 스크롤한다
  // — 해부실이 openDissectFromHash 로 하는 일과 같은 경로다.
  // 1편이어도 띄운다(연표의 시작점이다). 0편만 미표시.
  $('ceToc').innerHTML = list.length
    ? '<div class="ud-index"><div class="ud-index-title">관측 기록 ' + list.length + '편</div>' +
      list.map(e => '<a class="ud-index-row" href="#essay-' + esc(e.slug) + '">' +
        '<span class="ud-index-date">' + esc(e.date) + '</span>' +
        esc(e.title) + '</a>').join('') + '</div>'
    : '';

  document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => toggleEssay(b.dataset.toggle));
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyEssayLink(b));
  document.querySelectorAll('[data-copytext]').forEach(b => b.onclick = () => copyEssayText(b, list));
  openEssayFromHash();
}

// 독립 토글 — 한 편만 여는 단일 모드가 아니다(두 판정을 나란히 놓고 읽을 수 있게)
function setEssayOpen(slug, open){
  const card = document.getElementById('essay-' + slug);
  if (!card) return false;
  card.classList.toggle('open', open);
  const head = card.querySelector('.ud-acc-head');
  if (head) head.setAttribute('aria-expanded', String(open));
  return true;
}

function toggleEssay(slug){
  const card = document.getElementById('essay-' + slug);
  if (card) setEssayOpen(slug, !card.classList.contains('open'));
}


// 약화도 회색으로 '명시'한다 — 숨기지 않는 것이 이 노트의 신뢰 조건이다
function verdictClass(v){
  return v === '강화' ? '강화' : v === '불변' ? '불변' : v === '약화' ? '약화' : '보류';
}

function essayUrl(slug){
  return location.origin + location.pathname + '#essay-' + slug;
}

// 복사 장치는 관측일지 칼럼(copyColLink/copyColText)과 같은 문법이다
function copyToClip(text, btn){
  const done = () => { const o = btn.textContent; btn.textContent = '✓ 복사됨'; setTimeout(() => { btn.textContent = o; }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => window.prompt('아래 내용을 복사하세요 (Ctrl+C):', text.slice(0, 2000)));
  } else { window.prompt('아래 내용을 복사하세요 (Ctrl+C):', text.slice(0, 2000)); }
}

function copyEssayLink(btn){ copyToClip(essayUrl(btn.dataset.copy), btn); }

// 본문 복사 — 차트(SVG)는 텍스트로 옮길 수 없으므로 걷어내고 주소를 끝에 붙인다
function copyEssayText(btn, list){
  const e = list[Number(btn.dataset.copytext)];
  if (!e) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = e.html || '';
  tmp.querySelectorAll('svg, .col-chart').forEach(n => n.remove());
  const nl = String.fromCharCode(10);
  const body = (tmp.innerText || tmp.textContent || '').replace(/\n{3,}/g, nl + nl).trim();
  copyToClip(e.title + nl + nl + body + nl + nl + essayUrl(e.slug), btn);
}

// 목차 클릭은 해시를 바꾼다 — 같은 해시 처리기가 펼치고 스크롤한다
window.addEventListener('hashchange', openEssayFromHash);

function openEssayFromHash(){
  const h = location.hash.replace('#', '');
  if (!h.startsWith('essay-')) return;
  const card = document.getElementById(h);
  if (!card) return;
  setEssayOpen(h.slice(6), true);   // 링크로 들어온 편은 접힌 채로 두지 않는다
  setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
}

/* ── 소재 투입함 — 소장 로그인 시에만 노출 ── */
function renderInbox(){
  if (!isAdmin() || ceTab === 'notes') { $('ceInbox').innerHTML = ''; return; }
  $('ceInbox').innerHTML = '<div class="ce-inbox">' +
    '<div class="ce-inbox-title">📮 소재 투입함 — ' + esc((companyOf(ceTab) || {}).ko || '') + '</div>' +
    '<input id="ceUrl" placeholder="링크 (선택)">' +
    '<input id="ceTitle" placeholder="제목 (선택 — 직접 게재 시 에세이 제목이 됩니다)">' +
    '<textarea id="ceMemo" placeholder="메모 — 에세이화라면 관점·지시, 직접 게재라면 본문 전체"></textarea>' +
    '<div class="ce-mode">' +
      '<button data-mode="essay" class="' + (ceMode === 'essay' ? 'on' : '') + '">에세이화</button>' +
      '<button data-mode="direct" class="' + (ceMode === 'direct' ? 'on' : '') + '">직접 게재</button>' +
    '</div>' +
    '<button class="btn-gold" id="ceSend" style="width:100%">소재 투입</button>' +
    '<div class="ce-inbox-note">다음 발사(하루 3회) 때 집필됩니다 — 즉시 반영되지 않습니다. ' +
      '직접 게재는 AI가 손대지 않고 그대로 실립니다.</div>' +
    '<div class="ce-mat" id="ceMats">내 소재를 불러오는 중…</div>' +
  '</div>';
  document.querySelectorAll('.ce-mode button').forEach(b => b.onclick = () => { ceMode = b.dataset.mode; renderInbox(); loadMaterials(); });
  $('ceSend').onclick = sendMaterial;
  loadMaterials();
}

async function sendMaterial(){
  const memo = $('ceMemo').value.trim(), url = $('ceUrl').value.trim();
  if (!memo && !url) { alert('링크나 메모 중 하나는 필요합니다.'); return; }
  if (ceMode === 'direct' && !memo) { alert('직접 게재는 본문(메모)이 필요합니다.'); return; }
  try {
    await addDoc(collection(db, 'materials'), {
      uid: me.uid, company: ceTab, mode: ceMode, url, memo,
      title: $('ceTitle').value.trim(), consumed: false, created: serverTimestamp() });
    $('ceMemo').value = ''; $('ceUrl').value = ''; $('ceTitle').value = '';
    loadMaterials();
  } catch(e){ alert('투입 실패: ' + e.message); }
}

// consumed 필터를 클라이언트에서 건다 — where+orderBy 복합 색인을 요구하지 않기 위해서다
async function loadMaterials(){
  const box = $('ceMats');
  if (!box) return;
  try {
    const snap = await getDocs(query(collection(db, 'materials'), orderBy('created', 'desc'), limit(30)));
    const mine = snap.docs.map(d => d.data()).filter(m => !m.consumed);
    box.innerHTML = mine.length
      ? '<b>대기 중인 소재 ' + mine.length + '건</b>' + mine.map(m =>
          '<div class="ce-mat-item">' + esc((companyOf(m.company) || {}).ko || m.company) +
          ' · ' + (m.mode === 'direct' ? '직접 게재' : '에세이화') + ' — ' +
          esc((m.title || m.memo || m.url || '').slice(0, 60)) + '</div>').join('')
      : '<b>대기 중인 소재 없음</b> — 모두 집필됐거나 판정이 끝났습니다.';
  } catch(e){ box.innerHTML = '소재 목록을 불러오지 못했습니다 (보안 규칙 확인 필요).'; }
}

async function init(){
  try { cfg = await (await fetch('data/firebase_config.json?v=' + Date.now())).json(); } catch(e){ cfg = null; }
  renderTabs();
  // 해시 딥링크: #essay-{slug} 는 슬러그 접두사에서 회사를 되찾아 그 탭을 연다
  const h = location.hash.replace('#', '');
  if (h.startsWith('essay-')) {
    const target = (CE.essays || []).find(e => e.slug === h.slice(6));
    if (target) setTab(target.company, false);
  } else if (companyOf(h)) {
    setTab(h, false);
  }
  if (!cfg || !cfg.apiKey) { $('ntBody').innerHTML = '<div class="nt-count">관측노트 개설 준비 중입니다.</div>'; return; }
  app = initializeApp(cfg); auth = getAuth(app); db = getFirestore(app);
  onAuthStateChanged(auth, async u => { me = u; renderCompose(); renderLogin(); renderInbox(); });
  await loadList();
}

function renderCompose(){
  $('ntCompose').innerHTML = isAdmin()
    ? '<div class="nt-box">' +
        '<textarea id="ntText" placeholder="오늘의 생각 — 한 줄이면 충분합니다"></textarea>' +
        '<div class="nt-row"><input id="ntTags" placeholder="태그 (선택, 쉼표 구분)">' +
        '<button class="btn-gold" id="ntSave">기록</button></div></div>'
    : '';
  if (isAdmin()) $('ntSave').onclick = save;
}

function renderLogin(){
  $('ntLogin').innerHTML = me
    ? (isAdmin() ? '<button id="ntOut">로그아웃</button>' : '<span style="font-size:12px;color:var(--text-muted)">읽기 전용 — 기록은 관측소장만 남깁니다</span> · <button id="ntOut">로그아웃</button>')
    : '<button id="ntIn">관측소장 로그인</button>';
  const bIn = $('ntIn'), bOut = $('ntOut');
  if (bIn) bIn.onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert(e.message));
  if (bOut) bOut.onclick = () => signOut(auth);
}

async function loadList(){
  try {
    const snap = await getDocs(query(collection(db, 'judgments'), orderBy('created', 'desc'), limit(100)));
    const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    let html = '<div class="nt-count">총 ' + items.length + '개의 기록</div>';
    html += items.map(i =>
      '<div class="nt-item">' +
        '<div class="nt-meta"><span>' + fmtWhen(i.created) + '</span>' +
        (i.tags && i.tags.length ? '<span class="nt-tag">#' + i.tags.map(esc).join(' #') + '</span>' : '') +
        (isAdmin() ? '<button class="nt-del" data-del="' + i.id + '">삭제</button>' : '') + '</div>' +
        '<div class="nt-text">' + esc(i.text) + '</div>' +
      '</div>').join('') || '<div class="nt-count">첫 기록을 기다리는 중입니다.</div>';
    $('ntBody').innerHTML = html;
    document.querySelectorAll('.nt-del').forEach(b => b.onclick = async () => {
      if (!confirm('이 기록을 삭제할까요?')) return;
      await deleteDoc(doc(db, 'judgments', b.dataset.del)); loadList();
    });
  } catch(e) {
    $('ntBody').innerHTML = '<div class="nt-count">노트를 불러오지 못했습니다 — 잠시 후 새로고침해 주세요.</div>';
  }
}

async function save(){
  const text = $('ntText').value.trim();
  if (!text) return;
  await addDoc(collection(db, 'judgments'), {
    uid: me.uid, text,
    tags: $('ntTags').value.split(',').map(t => t.trim()).filter(Boolean).slice(0, 3),
    created: serverTimestamp() });
  $('ntText').value = ''; $('ntTags').value = '';
  loadList();
}

init();
</script>
<!-- uv-presence -->
<script type="module">
(async () => {
  try {
    const cfg = await (await fetch('data/firebase_config.json?v=' + Date.now())).json();
    if (!cfg || !cfg.apiKey) return;
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const { getFirestore, doc, setDoc, collection, query, where, Timestamp, serverTimestamp, getCountFromServer } =
      await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const db = getFirestore(initializeApp(cfg, 'presence'));

    let pid = localStorage.getItem('uv_pid');
    if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem('uv_pid', pid); }

    const beat = () => setDoc(doc(db, 'presence', pid), { t: serverTimestamp() }).catch(() => {});
    const count = async () => {
      try {
        const cutoff = Timestamp.fromMillis(Date.now() - 2 * 60 * 1000);
        const snap = await getCountFromServer(query(collection(db, 'presence'), where('t', '>', cutoff)));
        const n = snap.data().count;
        if (n > 0) {
          let el = document.getElementById('uvPresence');
          if (!el) {
            const ft = document.querySelector('.site-footer') || document.querySelector('footer');
            if (!ft) return;
            el = document.createElement('div');
            el.id = 'uvPresence';
            el.style.cssText = 'margin-top:8px;font-size:12px;color:var(--text-muted,#8a8577);';
            ft.appendChild(el);
          }
          el.innerHTML = '<span style="color:var(--gold,#9C7A3A)">✦</span> 지금 ' + n + '명이 우주를 관측 중';
        }
      } catch (e) {}
    };
    await beat(); await count();
    setInterval(beat, 60 * 1000 + Math.floor(Math.random() * 5000));
    setInterval(count, 60 * 1000 + Math.floor(Math.random() * 5000));
  } catch (e) {}
})();
</script>
</body>
</html>
