<style>
:root, [data-theme="light"] {
  --bg: #FAF6EC; --bg-card: #FFFFFF; --header-bg: rgba(250, 246, 236, 0.95);
  --text: #1A2438; --text-secondary: #525F7E; --text-muted: #8590AA;
  --gold: #9C7A3A; --gold-bg: #F0E6CC;
  --line: #E8DFC9; --line-strong: #C9BC9A;
}
[data-theme="dark"] {
  --bg: #0A0E14; --bg-card: #1C2330; --header-bg: rgba(10, 14, 20, 0.95);
  --text: #FFFFFF; --text-secondary: #B5BFD6; --text-muted: #6F7E9E;
  --gold: #D4A658; --gold-bg: #2A2519;
  --line: #2A3142; --line-strong: #3A4458;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard Variable', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  font-feature-settings: 'tnum', 'ss01'; line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  min-height: 100vh; display: flex; flex-direction: column;
}
.container { max-width: 720px; margin: 0 auto; padding: 0 20px; width: 100%; }

.site-header { background: var(--header-bg); border-bottom: 1px solid var(--line); }
.site-header-inner { max-width: 720px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; color: var(--text); }
.brand a { text-decoration: none; color: inherit; display: flex; gap: 8px; align-items: center; }
.brand-star { color: var(--gold); }
.brand-tag { font-size: 13px; font-weight: 500; color: var(--text-muted); }
.header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.update-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: var(--gold-bg);
  border-radius: 100px; font-size: 12px; font-weight: 700;
  color: var(--gold); font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .update-badge { border: 1px solid rgba(212,166,88,0.3); }
.update-badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); animation: pulse 2s ease-in-out infinite;
}
[data-theme="dark"] .update-badge::before { box-shadow: 0 0 8px var(--gold); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.rate-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 12px; background: var(--bg-card);
  border: 1px solid var(--line); border-radius: 100px;
  font-size: 12px; font-weight: 700; color: var(--text-secondary);
  font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.rate-badge:hover { border-color: var(--gold); }
.rate-badge:hover #usdKrwDisplay, .rate-badge:hover .rate-badge-arrow { color: var(--gold); }
.rate-badge-arrow { font-size: 10px; margin-left: 2px; color: var(--text-muted); opacity: 0.7; transition: color 0.2s, opacity 0.2s; }
.rate-badge:hover .rate-badge-arrow { opacity: 1; }
.rate-badge #usdKrwDisplay { color: var(--text); font-weight: 800; }
@media (max-width: 480px) { .rate-badge { font-size: 11px; padding: 5px 10px; } .update-badge { font-size: 11px; padding: 5px 10px; } }
@media (max-width: 380px) { .update-badge::before { display: none; } }

.theme-toggle {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--bg-card);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
}
.theme-toggle svg { width: 18px; height: 18px; }
.icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: none; }
[data-theme="dark"] .icon-sun { display: inline; }

.site-nav { position: sticky; top: 0; z-index: 50; background: var(--header-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
.site-nav-inner { max-width: 720px; margin: 0 auto; display: flex; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
.site-nav-inner::-webkit-scrollbar { display: none; }
.nav-tab { flex-shrink: 0; padding: 14px 18px; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-muted); text-decoration: none; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
.nav-tab:hover { color: var(--text-secondary); }
.nav-tab.active { color: var(--text); border-bottom-color: var(--gold); }

main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 0; }

.placeholder-card {
  text-align: center;
  padding: 56px 32px;
  border: 1px dashed var(--line-strong);
  border-radius: 16px;
  background: var(--bg-card);
  max-width: 480px;
  width: 100%;
}
.placeholder-icon { font-size: 56px; margin-bottom: 16px; }
.placeholder-eyebrow {

  text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
}
.placeholder-title {
  font-size: 30px; font-weight: 800; letter-spacing: -0.03em;
  color: var(--text); margin-bottom: 12px;
}
.placeholder-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.6; }
.placeholder-note { font-size: 12px; color: var(--text-muted); margin-top: 18px; }

.site-footer { padding: 24px 0 40px; border-top: 1px solid var(--line); text-align: center; }
.footer-brand { display: flex; justify-content: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text-secondary); }
.footer-link { color: var(--text-secondary); text-decoration: none; font-weight: 700; }
.footer-link:hover { color: var(--gold); }
.footer-divider { color: var(--text-muted); font-weight: 400; }

@media (max-width: 480px) { .nav-tab { padding: 12px 14px; font-size: 13px; } .placeholder-title { font-size: 24px; } }

.jr-hero { padding: 36px 0 8px; }
.jr-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.14em; color: var(--gold); }
.jr-title { font-size: 30px; font-weight: 800; margin: 4px 0 6px; }
.jr-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 18px; }
.jr-stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.jr-stat { background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 20px; min-width: 130px; }
.jr-stat b { display: block; font-size: 22px; }
.jr-stat span { font-size: 12px; color: var(--text-muted); }
.jr-stat .gap-warn { color: #c05555; } .jr-stat .gap-ok { color: var(--gold); }
.jr-box { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
.jr-box textarea, .jr-box input[type=text], .jr-box input[type=date], .jr-box select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: inherit; font-size: 14px; color: var(--text); box-sizing: border-box; margin-bottom: 8px; }
.jr-box textarea { min-height: 70px; resize: vertical; }
.jr-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.jr-quick { padding: 6px 12px; border-radius: 100px; border: 1px solid var(--line); background: var(--bg); font-size: 12px; font-weight: 700; cursor: pointer; color: var(--text-secondary); font-family: inherit; }
.jr-quick.on, .jr-quick:hover { border-color: var(--gold); color: var(--gold); }
.btn-gold { background: var(--gold); color: #fff; border: none; border-radius: 10px; padding: 10px 20px; font-weight: 800; font-size: 14px; cursor: pointer; font-family: inherit; }
.jr-sec-title { font-size: 15px; font-weight: 800; margin: 22px 0 10px; }
.jr-item { background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin-bottom: 10px; }
.jr-item.due { border-color: #c05555; }
.jr-meta { font-size: 11.5px; color: var(--text-muted); margin-bottom: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
.jr-text { font-size: 14.5px; line-height: 1.7; }
.jr-basis { font-size: 12.5px; color: var(--text-secondary); margin-top: 6px; line-height: 1.6; }
.jr-badge { font-size: 10.5px; font-weight: 800; border-radius: 100px; padding: 2px 9px; }
.b-open { background: var(--gold-bg); color: var(--gold); }
.b-due { background: #c05555; color: #fff; }
.b-hit { background: #17915e; color: #fff; } .b-partial { background: var(--gold); color: #fff; } .b-miss { background: #6a7390; color: #fff; }
.jr-score { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
.jr-lesson { font-size: 13px; color: var(--text-secondary); margin-top: 8px; border-left: 3px solid var(--gold); padding-left: 10px; line-height: 1.65; }
.jr-lock { text-align: center; padding: 70px 20px; color: var(--text-muted); }
.jr-del { background:none; border:none; color: var(--text-muted); font-size: 11.5px; cursor: pointer; float: right; }
</style>

<script>
const savedTheme = localStorage.getItem('ud-theme');
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
function toggleTheme() {
  const c = document.documentElement.getAttribute('data-theme') || 'light';
  const n = c === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', n); localStorage.setItem('ud-theme', n);
}

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, query, orderBy, limit, getDocs, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let app, auth, db, me = null, cfg = null, items = [], dueChoice = 30;

const todayStr = () => { const n = new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); };
const plusDays = d => { const n = new Date(Date.now() + d*86400000); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); };

async function init(){
  try { cfg = await (await fetch('data/firebase_config.json?v=' + Date.now())).json(); } catch(e){ return; }
  if (!cfg || !cfg.apiKey) return;
  app = initializeApp(cfg); auth = getAuth(app); db = getFirestore(app);
  $('btnIn').style.display = '';
  $('btnIn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert(e.message));
  onAuthStateChanged(auth, async u => { me = u; await render(); });
}

async function loadItems(){
  const snap = await getDocs(query(collection(db, 'judgments'), orderBy('created', 'desc'), limit(200)));
  items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

function stats(){
  const scored = items.filter(i => i.status === 'scored');
  const score = v => v === 'hit' ? 1 : v === 'partial' ? 0.5 : 0;
  const hitRate = scored.length ? scored.reduce((s, i) => s + score(i.verdict), 0) / scored.length * 100 : null;
  const avgConf = scored.length ? scored.reduce((s, i) => s + (i.conf || 70), 0) / scored.length : null;
  const dueCnt = items.filter(i => i.status === 'open' && i.due <= todayStr()).length;
  return { total: items.length, scored: scored.length, hitRate, avgConf, dueCnt };
}

async function render(){
  const body = $('jrBody');
  if (!me) { body.innerHTML = '<div class="jr-lock">🔭 관측자 전용 공간입니다.<br><br><button class="btn-gold" id="btnIn2">구글로 입장</button></div>';
    $('btnIn2').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert(e.message)); return; }
  if (!cfg.adminUid || me.uid !== cfg.adminUid) {
    body.innerHTML = '<div class="jr-lock">이곳은 관측소장의 개인 기록실입니다.<br>일반 교신은 관제센터를 이용해 주세요.</div>'; return; }

  await loadItems();
  const st = stats();
  const gap = (st.hitRate !== null && st.avgConf !== null) ? (st.avgConf - st.hitRate) : null;

  let html = '<div class="jr-stats">' +
    '<div class="jr-stat"><b>' + st.total + '</b><span>총 기록</span></div>' +
    '<div class="jr-stat"><b>' + (st.hitRate === null ? '—' : st.hitRate.toFixed(0) + '%') + '</b><span>적중률 (채점 ' + st.scored + '건)</span></div>' +
    '<div class="jr-stat"><b>' + (st.avgConf === null ? '—' : st.avgConf.toFixed(0) + '%') + '</b><span>평균 확신도</span></div>' +
    '<div class="jr-stat"><b class="' + (gap === null ? '' : (gap > 10 ? 'gap-warn' : 'gap-ok')) + '">' + (gap === null ? '—' : (gap > 0 ? '+' : '') + gap.toFixed(0) + '%p') + '</b><span>과신 지표 (확신−적중)</span></div>' +
    (st.dueCnt ? '<div class="jr-stat" style="border-color:#c05555"><b style="color:#c05555">' + st.dueCnt + '건</b><span>채점 대기 ⏰</span></div>' : '') +
    '</div>';

  html += '<div class="jr-box">' +
    '<textarea id="jText" placeholder="판단 — 무엇이 어떻게 될 것인가 (예: 9월 말까지 왕좌는 NVIDIA가 지킨다)"></textarea>' +
    '<textarea id="jBasis" placeholder="근거 — 왜 그렇게 보는가" style="min-height:52px"></textarea>' +
    '<div class="jr-row"><span style="font-size:12.5px;color:var(--text-muted)">확신도</span>' +
    '<select id="jConf" style="width:auto">' + [55,60,65,70,75,80,85,90,95].map(c => '<option' + (c===75?' selected':'') + '>' + c + '</option>').join('') + '</select><span style="font-size:12.5px;color:var(--text-muted)">%&nbsp;&nbsp;채점일</span>' +
    [7,30,90].map(d => '<button type="button" class="jr-quick' + (d===30?' on':'') + '" data-d="' + d + '">D+' + d + '</button>').join('') +
    '<input type="date" id="jDue" style="width:auto" value="' + plusDays(30) + '">' +
    '<input type="text" id="jTags" placeholder="태그 (선택)" style="width:150px;margin:0">' +
    '<button class="btn-gold" id="jSave" style="margin-left:auto">기록</button></div></div>';

  const due = items.filter(i => i.status === 'open' && i.due <= todayStr());
  const open = items.filter(i => i.status === 'open' && i.due > todayStr());
  const done = items.filter(i => i.status === 'scored');

  const card = (i, kind) => {
    let badge = kind === 'due' ? '<span class="jr-badge b-due">채점 대기</span>'
      : kind === 'open' ? '<span class="jr-badge b-open">관측 중 · ' + esc(i.due) + ' 채점</span>'
      : '<span class="jr-badge b-' + i.verdict + '">' + (i.verdict === 'hit' ? '⭕ 적중' : i.verdict === 'partial' ? '🔺 부분' : '❌ 빗나감') + '</span>';
    let h = '<div class="jr-item' + (kind === 'due' ? ' due' : '') + '">' +
      '<button class="jr-del" data-del="' + i.id + '">삭제</button>' +
      '<div class="jr-meta">' + badge + '<span>확신 ' + (i.conf || '—') + '%</span>' +
      (i.tags && i.tags.length ? '<span>#' + i.tags.map(esc).join(' #') + '</span>' : '') + '</div>' +
      '<div class="jr-text">' + esc(i.text) + '</div>' +
      (i.basis ? '<div class="jr-basis">근거: ' + esc(i.basis) + '</div>' : '');
    if (kind === 'due') h += '<div class="jr-score jr-row">' +
      '<button class="jr-quick" data-v="hit" data-id="' + i.id + '">⭕ 적중</button>' +
      '<button class="jr-quick" data-v="partial" data-id="' + i.id + '">🔺 부분</button>' +
      '<button class="jr-quick" data-v="miss" data-id="' + i.id + '">❌ 빗나감</button>' +
      '<input type="text" id="ls-' + i.id + '" placeholder="배운 점 한 줄" style="flex:1;min-width:180px;margin:0"></div>';
    if (kind === 'done' && i.lesson) h += '<div class="jr-lesson">' + esc(i.lesson) + '</div>';
    return h + '</div>';
  };

  if (due.length) html += '<div class="jr-sec-title">⏰ 채점 대기 — 기한이 도래했습니다</div>' + due.map(i => card(i, 'due')).join('');
  html += '<div class="jr-sec-title">🔭 관측 중 (' + open.length + ')</div>' + (open.map(i => card(i, 'open')).join('') || '<div class="jr-basis">진행 중인 판단이 없습니다 — 위에서 첫 기록을 남겨 보세요.</div>');
  if (done.length) html += '<div class="jr-sec-title">📓 채점 완료 (' + done.length + ')</div>' + done.map(i => card(i, 'done')).join('');
  body.innerHTML = html;

  document.querySelectorAll('.jr-quick[data-d]').forEach(b => b.onclick = () => {
    document.querySelectorAll('.jr-quick[data-d]').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); $('jDue').value = plusDays(+b.dataset.d);
  });
  $('jSave').onclick = saveItem;
  document.querySelectorAll('.jr-quick[data-v]').forEach(b => b.onclick = () => scoreItem(b.dataset.id, b.dataset.v));
  document.querySelectorAll('.jr-del').forEach(b => b.onclick = async () => {
    if (!confirm('이 기록을 삭제할까요?')) return;
    await deleteDoc(doc(db, 'judgments', b.dataset.del)); render();
  });
}

async function saveItem(){
  const text = $('jText').value.trim();
  if (text.length < 5) { alert('판단을 조금 더 구체적으로 적어 주세요.'); return; }
  await addDoc(collection(db, 'judgments'), {
    uid: me.uid, text, basis: $('jBasis').value.trim(),
    conf: +$('jConf').value, due: $('jDue').value,
    tags: $('jTags').value.split(',').map(t => t.trim()).filter(Boolean).slice(0, 3),
    status: 'open', created: serverTimestamp() });
  render();
}

async function scoreItem(id, verdict){
  const lesson = ($('ls-' + id) ? $('ls-' + id).value.trim() : '');
  await updateDoc(doc(db, 'judgments', id), { status: 'scored', verdict, lesson, scoredAt: serverTimestamp() });
  render();
}

init();
</script>
