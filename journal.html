<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관측노트 · UNIVERTRIX</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root, [data-theme="light"] {
  --bg: #FAF6EC; --bg-card: #FFFFFF; --header-bg: rgba(250, 246, 236, 0.95);
  --text: #1A2438; --text-secondary: #525F7E; --text-muted: #8590AA;
  --gold: #9C7A3A; --gold-bg: #F0E6CC;
  --line: #E8DFC9; --line-strong: #C9BC9A;
}
[data-theme="dark"] {
  --bg: #0A0E14; --bg-card: #1C2330; --header-bg: rgba(10, 14, 20, 0.95);
  --text: #FFFFFF; --text-secondary: #B5BFD6; --text-muted: #6F7E9E;
  --gold: #D4A658; --gold-bg: #2A2519;
  --line: #2A3142; --line-strong: #3A4458;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard Variable', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  font-feature-settings: 'tnum', 'ss01'; line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  min-height: 100vh; display: flex; flex-direction: column;
}
.container { max-width: 720px; margin: 0 auto; padding: 0 20px; width: 100%; }

.site-header { background: var(--header-bg); border-bottom: 1px solid var(--line); }
.site-header-inner { max-width: 720px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; color: var(--text); }
.brand a { text-decoration: none; color: inherit; display: flex; gap: 8px; align-items: center; }
.brand-star { color: var(--gold); }
.brand-tag { font-size: 13px; font-weight: 500; color: var(--text-muted); }
.header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.update-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: var(--gold-bg);
  border-radius: 100px; font-size: 12px; font-weight: 700;
  color: var(--gold); font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .update-badge { border: 1px solid rgba(212,166,88,0.3); }
.update-badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); animation: pulse 2s ease-in-out infinite;
}
[data-theme="dark"] .update-badge::before { box-shadow: 0 0 8px var(--gold); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.rate-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 12px; background: var(--bg-card);
  border: 1px solid var(--line); border-radius: 100px;
  font-size: 12px; font-weight: 700; color: var(--text-secondary);
  font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.rate-badge:hover { border-color: var(--gold); }
.rate-badge:hover #usdKrwDisplay, .rate-badge:hover .rate-badge-arrow { color: var(--gold); }
.rate-badge-arrow { font-size: 10px; margin-left: 2px; color: var(--text-muted); opacity: 0.7; transition: color 0.2s, opacity 0.2s; }
.rate-badge:hover .rate-badge-arrow { opacity: 1; }
.rate-badge #usdKrwDisplay { color: var(--text); font-weight: 800; }
@media (max-width: 480px) { .rate-badge { font-size: 11px; padding: 5px 10px; } .update-badge { font-size: 11px; padding: 5px 10px; } }
@media (max-width: 380px) { .update-badge::before { display: none; } }

.theme-toggle {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--bg-card);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
}
.theme-toggle svg { width: 18px; height: 18px; }
.icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: none; }
[data-theme="dark"] .icon-sun { display: inline; }

.site-nav { position: sticky; top: 0; z-index: 50; background: var(--header-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
.site-nav-inner { max-width: 720px; margin: 0 auto; display: flex; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
.site-nav-inner::-webkit-scrollbar { display: none; }
.nav-tab { flex-shrink: 0; padding: 14px 18px; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-muted); text-decoration: none; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
.nav-tab:hover { color: var(--text-secondary); }
.nav-tab.active { color: var(--text); border-bottom-color: var(--gold); }

main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 0; }

.placeholder-card {
  text-align: center;
  padding: 56px 32px;
  border: 1px dashed var(--line-strong);
  border-radius: 16px;
  background: var(--bg-card);
  max-width: 480px;
  width: 100%;
}
.placeholder-icon { font-size: 56px; margin-bottom: 16px; }
.placeholder-eyebrow {
  font-size: 11px; font-weight: 800; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
}
.placeholder-title {
  font-size: 30px; font-weight: 800; letter-spacing: -0.03em;
  color: var(--text); margin-bottom: 12px;
}
.placeholder-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.6; }
.placeholder-note { font-size: 12px; color: var(--text-muted); margin-top: 18px; }

.site-footer { padding: 24px 0 40px; border-top: 1px solid var(--line); text-align: center; }
.footer-brand { display: flex; justify-content: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text-secondary); }
.footer-link { color: var(--text-secondary); text-decoration: none; font-weight: 700; }
.footer-link:hover { color: var(--gold); }
.footer-divider { color: var(--text-muted); font-weight: 400; }

@media (max-width: 480px) { .nav-tab { padding: 12px 14px; font-size: 13px; } .placeholder-title { font-size: 24px; } }

.nt-hero { padding: 36px 0 8px; }
.nt-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.14em; color: var(--gold); }
.nt-title { font-size: 30px; font-weight: 800; margin: 4px 0 6px; }
.nt-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
.nt-box { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 20px; }
.nt-box textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; font-family: inherit; font-size: 14.5px; color: var(--text); box-sizing: border-box; min-height: 64px; resize: vertical; }
.nt-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.nt-row input { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-family: inherit; font-size: 13px; color: var(--text); }
.btn-gold { background: var(--gold); color: #fff; border: none; border-radius: 10px; padding: 10px 22px; font-weight: 800; font-size: 14px; cursor: pointer; font-family: inherit; }
.nt-count { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
.nt-item { background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin-bottom: 10px; }
.nt-meta { font-size: 11.5px; color: var(--text-muted); margin-bottom: 6px; display: flex; gap: 10px; align-items: center; }
.nt-text { font-size: 14.5px; line-height: 1.75; white-space: pre-wrap; }
.nt-tag { font-size: 10.5px; font-weight: 800; color: var(--gold); }
.nt-del { background: none; border: none; color: var(--text-muted); font-size: 11.5px; cursor: pointer; margin-left: auto; font-family: inherit; }
.nt-login { text-align: center; margin-top: 26px; }
.nt-login button { background: none; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; text-decoration: underline; font-family: inherit; }

/* ── 동행 관측 ── 한 기업의 10년 항로를 관찰로 쌓는 탭. 논제(고정) 위에 에세이(누적).

   ⚠️ 타이포는 **눈금 하나**만 쓴다. 논제 원장과 에세이는 같은 화면에 나란히
   놓이므로 본문 크기가 다르면 한쪽이 부록처럼 읽힌다(2026-08-23 통일 전:
   원장 14px/1.8 · 에세이 15.5px/1.85 로 갈라져 있었다).
   개별 요소에 px 를 다시 박지 말고 아래 변수만 참조할 것.
     위계: 제목(--note-title) > 섹션(--note-h) > 본문(--note-body) > 메타(--note-meta)
   한줄 노트(.nt-*)는 이 눈금 밖이다 — 짧은 호흡이 그 탭의 정체성이라 건드리지 않는다. */
:root {
  --note-title: 20px;      /* 에세이 제목 · 원장 카드 이름 */
  --note-title-lh: 1.35;
  --note-h: 17px;          /* 섹션 제목 — 에세이 h3 = 원장 h2 (같은 층) */
  --note-h-weight: 700;
  --note-body: 15.5px;     /* 본문 — 원장·에세이 동일 */
  --note-body-lh: 1.7;
  --note-meta: 12.5px;     /* 날짜·배지·버튼·출처·면책 */
}

.ce-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.ce-tabs::-webkit-scrollbar { display: none; }
.ce-tab { flex-shrink: 0; padding: 10px 14px; font-size: 13.5px; font-weight: 700; color: var(--text-muted); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-family: inherit; white-space: nowrap; transition: color .2s, border-color .2s; }
.ce-tab:hover { color: var(--text-secondary); }
.ce-tab.active { color: var(--text); border-bottom-color: var(--gold); }

/* 논제 원장 = 📌 고정 공지. 카드 뼈대는 공용 .ud-acc + .ud-pin 이 맡는다.
   접힌 높이는 3줄 이내 — 배지 줄 1 + 한 문장 2줄(클램프). */
.ce-thesis { margin-bottom: 22px; }
.ce-thesis .ud-acc-head { flex-direction: column; align-items: stretch; gap: 8px; padding: 16px 20px; }
.ce-thesis-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ce-thesis-name { font-size: var(--note-title); line-height: var(--note-title-lh); font-weight: 800; letter-spacing: -0.02em; }
.ce-thesis-ver { font-size: var(--note-meta); font-weight: 700; color: var(--gold); background: var(--gold-bg); border-radius: 100px; padding: 3px 10px; white-space: nowrap; }
.ce-thesis-more { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: var(--note-meta); font-weight: 700; color: var(--text-muted); white-space: nowrap; }
.ce-thesis-one { font-size: var(--note-body); line-height: var(--note-body-lh); color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* 좁은 폭에서는 라벨을 줄여 배지 줄이 한 줄로 남게 한다 — 접힌 카드는 어디서나 3줄 이내 */
.ce-narrow-only { display: none; }
@media (max-width: 560px) {
  .ce-thesis .ud-acc-head { padding: 14px 16px; }
  .ce-thesis-head { gap: 7px; flex-wrap: nowrap; }
  .ce-wide-only { display: none; }
  .ce-narrow-only { display: inline; }
  .ce-thesis-name { font-size: var(--note-h); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ce-thesis-ver { font-size: 11px; padding: 2px 8px; }
  .ce-thesis-more { margin-left: auto; }
}
.ce-thesis-body { font-size: var(--note-body); line-height: var(--note-body-lh); color: var(--text); }
.ce-thesis-body h1 { font-size: var(--note-h); font-weight: 800; color: var(--text); margin: 12px 0 6px; letter-spacing: -0.02em; }
.ce-thesis-body h2 { font-size: var(--note-h); font-weight: var(--note-h-weight); color: var(--gold); margin: 20px 0 6px; letter-spacing: -0.02em; }
.ce-thesis-body ul, .ce-thesis-body ol { margin: 8px 0 8px 20px; }
.ce-thesis-body li { margin: 6px 0; }
.ce-thesis-body p { margin: 8px 0; }
.ce-thesis-body blockquote { border-left: 3px solid var(--line-strong); padding: 2px 0 2px 12px; margin: 10px 0; color: var(--text-muted); font-size: var(--note-meta); line-height: 1.65; }
.ce-waiting { text-align: center; padding: 8px 0 4px; }
.ce-waiting-icon { font-size: 34px; }
.ce-waiting-text { font-size: var(--note-meta); color: var(--text-muted); margin-top: 6px; }

/* 에세이 본문 조판 = 관측일지 칼럼과 같은 급. 다만 헤더에는 칼럼의 비주얼
   블록(makeColViz)을 넣지 않는다 — 에세이는 칼럼보다 호흡이 짧아 회사 아이콘 ·
   날짜 · 판정만으로 충분하고, 그림은 본문 안 수치 차트가 맡는다. */
/* 아코디언 구조·동작은 공용 .ud-acc-* 에 있다 (build_site.py 의 ud-accordion-v1).
   여기에는 이 탭의 '눈금'만 둔다 — 구조를 다시 적으면 그 순간 두 벌이 된다. */
.ce-essay .ud-acc-title { font-size: var(--note-title); line-height: var(--note-title-lh); }
.ce-essay .ud-acc-meta { font-size: var(--note-meta); }
.ce-essay .ud-acc-caret { font-size: var(--note-meta); }
@media (max-width: 480px) { .ce-essay .ud-acc-title { font-size: var(--note-h); } }
.ce-essay-body { font-size: var(--note-body); line-height: var(--note-body-lh); color: var(--text); letter-spacing: -0.003em; }
.ce-essay-body h3 { font-size: var(--note-h); font-weight: var(--note-h-weight); color: var(--gold); margin: 20px 0 6px; letter-spacing: -0.02em; }
.ce-essay-body h3:first-child { margin-top: 4px; }
.ce-essay-body p { margin: 8px 0; }
.ce-essay-body b { font-weight: 800; }
.ce-essay-body ul, .ce-essay-body ol { margin: 8px 0 8px 20px; }
.ce-essay-body li { margin: 6px 0; }
.ce-essay-body .col-chart { margin: 18px 0; }
.ce-essay-body .col-chart svg { width: 100%; height: auto; display: block; border-radius: 10px; }
/* 차트 패널(#10141f)은 밤 테마 카드 배경과 명도가 가까워 그림의 경계가 사라진다.
   낮에는 저절로 '개체'로 읽히지만 밤에는 실선 하나가 있어야 그림으로 읽힌다. */
[data-theme="dark"] .ce-essay-body .col-chart svg { border: 1px solid var(--line-strong); }
/* 에세이 목차는 필독 해부실 목록을 **그대로** 쓴다 (공용 .ud-index-*).
   이 파일에 목차 전용 규칙을 두지 않는다 — 한 줄이라도 더하는 순간 두 목록이 갈라진다. */

.ce-share { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.ce-share button { background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--text-muted); font-size: var(--note-meta); padding: 5px 11px; cursor: pointer; font-family: inherit; font-weight: 700; }
.ce-share button:hover { border-color: var(--gold); color: var(--gold); }
.ce-essay-body .ce-src { font-size: var(--note-meta); word-break: break-all; }
/* 근거의 두께를 숨기지 않는다 — 전문을 못 읽은 출처는 그 사실을 옆에 적는다 */
.ce-src-note { color: var(--text-muted); font-weight: 700; }
.ce-essay-body .ce-src a { color: var(--gold); }
.ce-essay-body .ce-disc, .ce-essay-body .ce-coi { font-size: var(--note-meta); color: var(--text-muted); margin-top: 10px; line-height: 1.6; }
/* 판정 배지 — 약화도 숨기지 않는다. 반증의 기록이 있어야 확신의 기록이 신뢰를 얻는다. */
.ce-verdict { font-size: var(--note-meta); font-weight: 800; padding: 3px 10px; border-radius: 100px; border: 1px solid var(--line-strong); }
.ce-v-강화 { color: #fff; background: linear-gradient(120deg, #565CE8, #3EC8D8); border-color: transparent; }
[data-theme="dark"] .ce-v-강화 { background: linear-gradient(120deg, #8B93FF, #4FE0EF); color: #0A0B0F; }
.ce-v-불변 { color: var(--text-secondary); }
.ce-v-약화 { color: var(--text-muted); background: var(--bg); }
.ce-v-보류 { color: var(--text-muted); border-style: dashed; }
.ce-origin { font-size: var(--note-meta); font-weight: 800; color: var(--gold); }

.ce-inbox { background: var(--bg-card); border: 1px dashed var(--line-strong); border-radius: 14px; padding: 16px 18px; margin-bottom: 20px; }
.ce-inbox-title { font-size: 13px; font-weight: 800; color: var(--gold); margin-bottom: 10px; }
.ce-inbox input, .ce-inbox textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-family: inherit; font-size: 13.5px; color: var(--text); box-sizing: border-box; margin-bottom: 7px; }
.ce-inbox textarea { min-height: 80px; resize: vertical; }
.ce-mode { display: flex; gap: 6px; margin-bottom: 8px; }
.ce-mode button { flex: 1; padding: 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--text-muted); font-weight: 700; font-size: 12.5px; cursor: pointer; font-family: inherit; }
.ce-mode button.on { border-color: var(--gold); color: var(--gold); background: var(--gold-bg); }
.ce-inbox-note { font-size: 11.5px; color: var(--text-muted); margin-top: 8px; line-height: 1.6; }
.ce-mat { font-size: 12px; color: var(--text-secondary); border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 10px; }
.ce-mat-item { padding: 5px 0; border-bottom: 1px solid var(--line); }
</style>
<style>
/* 헤더 모바일 일관성 + 실시간 날짜·시계 (전 페이지 공통 — build_site.py 주입) */
@media (max-width: 480px) {
  .site-header-inner { flex-wrap: wrap; }
  .brand { flex-shrink: 0; }
}
.update-badge .ud-clock { margin-left: 6px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
/* UNIVERTRIX 로고 (build_site.py 주입) */
.brand.ud-logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
/* ── UNIVERTRIX 종합 로고 (오로라×궤도×호흡×서예) ── */
.uvx{display:inline-flex;align-items:center;gap:13px;text-decoration:none}
.uvx-lat{position:relative;display:inline-block}
.uvx-word{font-size:20px;letter-spacing:.3em;font-weight:400;line-height:1;
  background:linear-gradient(95deg,var(--text) 12%,var(--gold) 46%,var(--aurora2) 62%,var(--text) 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-variation-settings:'wght' 528}
.uvx-orbit{position:absolute;inset:-12px -11px -8px -7px;width:calc(100% + 18px);height:calc(100% + 20px);pointer-events:none;overflow:visible}
.uvx-orbit path{stroke:var(--gold);opacity:.9}
.uvx-orbit circle{fill:var(--aurora2)}
.uvx-kr{font-family:'Nanum Brush Script',cursive;font-size:26px;line-height:1;padding-left:13px;border-left:1px solid var(--text-muted);white-space:nowrap;
  background:linear-gradient(95deg,var(--text) 10%,var(--gold) 42%,var(--aurora2) 60%,var(--text) 90%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent}
@media(prefers-reduced-motion:no-preference){
  .uvx-word{animation:uvbreath 6s ease-in-out infinite}
  .uvx-kr{animation:krbreath 6s ease-in-out infinite}
  @keyframes uvbreath{0%,100%{font-variation-settings:'wght' 340}50%{font-variation-settings:'wght' 800}}
  @keyframes krbreath{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
}

<script>
document.addEventListener('DOMContentLoaded', function () {
  var badge = document.querySelector('.update-badge');
  if (!badge) return;
  badge.innerHTML = '<span class="ud-date"></span><span class="ud-clock"></span>';
  var dt = badge.querySelector('.ud-date');
  var clk = badge.querySelector('.ud-clock');
  function tick() {
    var now = new Date();
    dt.textContent = now.toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' }).replace(/-/g, '.');
    clk.textContent = now.toLocaleTimeString('en-GB', { hour12: false, timeZone: 'Asia/Seoul' });
  }
  tick();
  setInterval(tick, 1000);
});

const CE = {"companies": [{"slug": "spacex", "ko": "SpaceX", "emoji": "🚀", "thesis": {"placeholder": false, "version": "1.0", "updated": "2026-08-22", "one": "지구 저궤도를 물류망으로 바꾼 회사가, 그 물류망 위에 통신(Starlink)·컴퓨트(Colossus)· 이동(Starship)을 쌓아 우주 경제의 수직 통합 플랫폼이 된다.", "html": "<h1>SpaceX (SPCX) — 10년 논제 원장</h1><h2>10년 논제</h2><p>지구 저궤도를 물류망으로 바꾼 회사가, 그 물류망 위에 통신(Starlink)·컴퓨트(Colossus)· 이동(Starship)을 쌓아 우주 경제의 수직 통합 플랫폼이 된다. 우리는 로켓 회사가 아니라 \"궤도의 건물주\"가 되어가는 과정을 관측한다.</p><h2>핵심 가설</h2><ol><li><b>Starlink가 현금 엔진이 된다</b> [확신도: 상] 근거: 2026 2Q 매출 $4.3B(전체의 55%), 영업이익 $1.66B 흑자, 위성 ~11,000기, 모바일(EchoStar 스펙트럼) 진입 — 통신사가 아니라 통신 인프라 그 자체. 반증 조건: 가입자 성장 정체 + ARPU 하락이 2분기 연속, 또는 Kuiper 등 경쟁 별자리의 실질 점유 침투.</li><li><b>Starship이 단위 경제를 다시 한 번 부순다</b> [확신도: 중] 근거: Falcon이 발사 비용을 10분의 1로 만든 전례. V2 위성·화성 로드맵이 전부 이 배 위에 있다. 반증 조건: 상용 페이로드 정기 운항이 2028년까지도 미달성, 또는 발사 단가 개선이 Falcon 대비 유의미하지 않음이 확인될 때.</li><li><b>AI 세그먼트(xAI·X·Colossus)는 옵션이되, 검증 전이다</b> [확신도: 하] 근거: 네오클라우드 매출 7배 성장, 구글 월 $920M 딜, Anthropic의 Colossus 사용 계약 — 단 2Q 영업손실 $1.26B, 15~20GW 목표는 캐펙스 블랙홀. 반증 조건: AI 부문 손실이 Starlink 흑자를 2년 연속 잠식, 또는 외부 고객 이탈로 자가 소비용 인프라로 전락.</li><li><b>키맨 리스크는 상수다</b> [확신도: —] 머스크의 집중과 분산은 동전의 양면. 관측 대상이지 베팅 대상이 아니다.</li></ol><h2>버핏 눈금과의 관계</h2><p>시차 관측에서 추정불가(too hard) — 10년 쿠폰 칸이 백지인 건 사실이다. 그래서 이 원장이 존재한다: 에세이가 쌓일수록 백지가 숫자로 바뀌는지, 영영 백지인지를 기록한다. 상장 후 고점 대비 -40%, 목표가 스프레드 $115~401 — 시장도 쿠폰을 못 적고 있다는 증거.</p><h2>다음 관측 포인트</h2><ul><li>3Q 실적: Starlink 성장률과 AI 부문 손실 궤적 (11월 초 예상)</li><li>보호예수 해제 물량(8/20 319M주) 소화 — 수급이 아니라 내부자 행동으로 읽는다</li><li>Starlink 모바일 V2 위성의 Starship 탑재 발사 (2027 상용 목표의 선행 지표)</li></ul>"}}, {"slug": "alphabet", "ko": "Alphabet", "emoji": "🔭", "thesis": {"placeholder": false, "version": "1.0", "updated": "2026-08-22", "one": "'의도에 대한 통행료'(검색)를 지키면서, AI 풀스택(TPU→Gemini→제품)과 현실 세계 에이전트(Waymo)라는 두 번째·세 번째 통행료를 건설 중인 회사.", "html": "<h1>Alphabet (GOOG) — 10년 논제 원장</h1><h2>10년 논제</h2><p>'의도에 대한 통행료'(검색)를 지키면서, AI 풀스택(TPU→Gemini→제품)과 현실 세계 에이전트(Waymo)라는 두 번째·세 번째 통행료를 건설 중인 회사. 캐펙스 공포에 싸인 프랜차이즈가 공포를 하나씩 반증하는 과정을 관측한다 — 버크셔가 우리보다 먼저 같은 결론에 도달했다($366억, 3단 매수).</p><h2>핵심 가설</h2><ol><li><b>검색 해자는 침식이 아니라 변태 중이다</b> [확신도: 상] 근거: AI 검색 확산 속에서도 검색 광고 +17%(2026 2Q), 쇼핑 광고 관련성 +20%, 11분기 연속 두 자릿수 성장. \"검색 사망론\"은 아직 실적에 나타난 적이 없다. 반증 조건: 검색 매출 성장률이 한 자릿수로 2분기 연속 감속하며 Gemini 대체 효과가 광고 단가에 나타날 때.</li><li><b>클라우드+TPU가 두 번째 통행료가 된다</b> [확신도: 상] 근거: 클라우드 +82%, 수주잔고 $514B, TPU 외부 데이터센터 판매 개시(매출 인식 시작), 토큰 처리 22B/분(1분기 만에 +37%), 공급 제약 지속. 반증 조건: 수주잔고 전환율 둔화 + TPU 외부 수요가 자사 소비 대비 미미한 수준에 머물 때.</li><li><b>캐펙스는 공포가 아니라 씨즈급 재투자다</b> [확신도: 중] 근거: 2026 가이던스 $175~185B — 버핏 프레임의 최대 시험대. 증분 자본이 증분 통행료로 돌아오는지가 이 논제의 심장. 반증 조건: 클라우드 마진 개선 정체 + ROIC 하락 추세 2년 지속 — 그때는 씨즈형이 아니라 플라이트세이프티형으로 강등하고 정당 멀티플을 낮춘다.</li><li><b>Waymo는 공짜로 얹힌 세 번째 통행료 후보다</b> [확신도: 중] 근거: 주 50만 회 완전 자율주행(1년 내 2배), 11개 도시, 영국·일본 확장 — 상업성 입증 단계 진입. 반증 조건: 도시당 단위 경제가 공개됐을 때 구조적 적자이거나, 확장 속도가 규제로 3년 이상 정체.</li></ol><h2>버핏 눈금과의 관계</h2><p>시차 관측 존 편입: 정당 MAX 32 · 현재 괴리 +35% 안팎(관망, 본격선 부근). 버크셔 기준선(+40%)이 다시 열리는 순간 — 다음 공포 이벤트(반독점 판결, 캐펙스 추가 증액) — 이 이 원장의 최고 관측 시점이다.</p><h2>다음 관측 포인트</h2><ul><li>3Q 실적(10월 말): 클라우드 성장률·TPU 외부 매출 라인·캐펙스 가이던스 변화</li><li>Gemini 4 공개 (사전훈련 진행 중 공식 언급됨)</li><li>애드테크 반독점 구제안 판결 — \"검증 가능한 공포\"의 실물</li></ul>"}}, {"slug": "anthropic", "ko": "Anthropic", "emoji": "⚛️", "thesis": {"placeholder": false, "version": "1.0", "updated": "2026-08-22", "one": "\"안전하게 만든 지능이 가장 비싸게 팔린다\"는 명제의 실증 실험.", "html": "<h1>Anthropic — 10년 논제 원장</h1><blockquote>⚠ 이해관계 고지: 이 사이트의 에세이는 Anthropic의 모델(Claude)로 작성된다. 본 원장과 모든 에세이는 공식 발표·제3자 보도만을 근거로 하며, 칭찬과 비판에 같은 증거 기준을 적용한다.</blockquote><h2>10년 논제</h2><p>\"안전하게 만든 지능이 가장 비싸게 팔린다\"는 명제의 실증 실험. 엔터프라이즈가 신뢰를 이유로 지불하는 프리미엄이 지속 가능한 해자인지 — 프론티어 모델 경쟁 속에서 기업용 통행료형 사업이 성립하는지를 관측한다.</p><h2>핵심 가설</h2><ol><li><b>엔터프라이즈 통행료는 실재한다</b> [확신도: 상] 근거: ARR $47B(5월)→$65B(7월말), 기업 LLM 지출 점유 40%(Menlo, 1위), $1M+ 고객 1,000곳(반년 새 2배), 포춘10 중 8곳, 2026 2Q 첫 조정영업이익 흑자. 반증 조건: 점유율이 30% 아래로 꺾이며 가격 경쟁이 마진을 잠식할 때 — 통행료가 아니라 커머디티였다는 증거.</li><li><b>Claude Code = 씨즈캔디 순간</b> [확신도: 상] 근거: 코딩 특화 LLM 지출의 54% — 단일 제품이 만든 해자. $500M(2025.9)에서 $23.5B 기여 전망(2027.5)까지의 궤적. 반증 조건: 경쟁 에이전트에 점유 절반 잠식, 또는 코딩 자동화 단가의 급락으로 시장 자체가 디플레이션.</li><li><b>멀티클라우드 중립성이 구조적 우위다</b> [확신도: 중] 근거: AWS·Google·Azure 전 클라우드 유통 + SpaceX Colossus 컴퓨트 계약 — 어느 제국에도 종속되지 않은 유일한 프론티어 랩. 반증 조건: 특정 클라우드 의존도가 매출 절반을 넘어서며 협상력이 역전될 때.</li><li><b>규제·지정학은 실존 변수다</b> [확신도: —] 근거: 2026.6 수출통제로 Fable/Mythos 3일 오프라인 → 해제 복귀 — 프론티어 모델이 국가 전략 자산으로 취급되는 시대의 예고편. 관측 대상.</li></ol><h2>버핏 눈금과의 관계</h2><p>비상장(10월 나스닥 IPO 예정, S-1 제출 완료·$965B 밸류·2028 매출 $190~200B 기준 인수단 산정 보도). 상장되면 시차 관측 유니버스 편입을 검토하되, 초기 멀티플은 거의 확실히 추정불가 영역 — 이 원장이 쿠폰 칸을 채워가는 유일한 도구다.</p><h2>다음 관측 포인트</h2><ul><li>IPO 일정·공모 조건 (10월 예상) — 밸류에이션의 첫 공개 시험</li><li>3Q ARR 궤적 ($65B 이후의 기울기)</li><li>차기 모델 사이클과 기업 점유율 방어 (Gemini 4·GPT 차기작과의 3파전)</li></ul>"}}], "essays": [{"company": "alphabet", "date": "2026-08-30", "title": "공포가 씨즈가 되는 순간 — $205B 캐펙스와 $514B 수주의 비율", "verdict": "강화", "html": "<h3>무슨 일이 있었나</h3><p>Alphabet은 2026 2분기 실적 공시에서 연간 캐펙스 가이던스를 $205B로 상향 조정했다(이전 가이던스 대비). 동 분기 Google Cloud 수주잔고는 $514B에 도달했으며, 클라우드 부문 성장률은 82%를 유지했다. 매출은 $119.8B로 전년 대비 24.2% 증가하며 애널리스트 컨센서스를 2.2% 상회했다. 별도로 EU는 Google의 스팸 정책 변경을 승인하며 대규모 반독점 과징금 위험을 일부 해소했다.</p><h3>10년 논제와의 연결</h3><p>이 숫자들은 논제 원장의 3번 가설(\"캐펙스는 공포가 아니라 씨즈급 재투자\")을 직접 검증하는 첫 번째 실물 증거다. $205B 캐펙스는 2026년 역사상 최대 규모이며, 동시에 그것이 $514B 클라우드 수주로 얼마나 효율적으로 전환되고 있는지를 보여준다. 버핏이 본 것은 바로 이 비율이다 — 증분 자본이 정말로 증분 해자를 만드는가, 아니면 단순 용량 경쟁인가.</p><p>검색 광고는 여전히 11분기 연속 두 자릿수 성장 중이고(+17% 지속), 쇼핑 광고 관련성은 +20%다. \"AI 검색 대체\" 우려는 2년 전 가설인데, 실적에 나타난 침식은 아직 없다. 오히려 검색이 변태하는 중으로 보인다. EU 규제 양보는 첫 번째 통행료(검색)의 해자 방어가 현실화된 신호다.</p><h3>논제 판정</h3><p><strong>강화</strong>. 캐펙스 투입이 동기 수주 전환율과 함께 공시되었을 때 처음으로 \"재투자 효율성\"을 수치로 관측할 수 있는 국면에 진입했다. $514B는 높은 수치지만, 더 중요한 것은 Q2만 $205B를 쏟아부었음에도 수주 잔고 증가율이 정체하지 않았다는 점이다. TPU 외부 판매가 이제 매출 인식 단계에 진입했다는 공시도 두 번째 통행료의 구체화 신호다.</p><h3>무엇이 틀릴 수 있나</h3><p>비평가의 관점: $514B 수주잔고는 \"예약된 매출\"이지 현금이 아니다. 클라우드 마진이 실제로 개선되고 있는지, 아니면 저마진 대용량 계약으로 부풀려 있는 건 아닌지 불명확하다. 특히 캐펙스 상향($205B)이 클라우드 마진 개선과 동반되지 않는다면, 이는 \"공포에서 벗어난 것\"이 아니라 \"자본 집약도가 높아지는 것\"일 수 있다. TPU 외부 매출도 아직 선적 규모가 공시되지 않았으므로, 정말로 \"세 번째 통행료\"인지 아니면 \"자사 수요에 못 미친 여분\"인지 판단하기 어렵다. EU 규제 양보 역시 일시적 지연일 수 있으며, 미국 내 반독점 소송(애드테크 사건)은 여전히 진행 중이다.</p><h3>다음 관측 포인트</h3><ul><li><strong>3Q 실적 공시(2026년 10월 말)</strong> — 클라우드 마진율 추이, TPU 외부 판매 매출 규모와 성장률, 캐펙스-수주 간 시차 단축 증거 여부</li><li><strong>Gemini 4 공식 공개</strong> — 제품-토큰 변환율(매달 활성 사용자당 토큰 처리량)이 전분기 22B/분 대비 가시적 성장 여부</li><li><strong>미국 애드테크 반독점 판결 일정(2026년 말~2027년 초 예상)</strong> — 검색 해자 방어의 규제 리스크 명확화 지점</li></ul><div class=\"col-chart\"><svg viewBox=\"0 0 700 308\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"700\" height=\"308\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"18\" font-weight=\"800\">Alphabet 분기별 매출 성장률 추이</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12\" font-weight=\"600\">Google Search, Cloud Platform, YouTube 통합 기준, YoY %</text><line x1=\"210\" y1=\"76\" x2=\"210\" y2=\"262\" stroke=\"#3a4568\"/><text x=\"26\" y=\"105.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">2Q 2026</text><rect x=\"216\" y=\"90.0\" width=\"106.8\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"331.8\" y=\"106.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">24.2%</text><text x=\"26\" y=\"151.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">검색 광고 (+17%)</text><rect x=\"216\" y=\"136.0\" width=\"75.0\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"300.0\" y=\"152.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">17%</text><text x=\"26\" y=\"197.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">클라우드 (+82%)</text><rect x=\"216\" y=\"182.0\" width=\"362.0\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"587.0\" y=\"198.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">82%</text><text x=\"26\" y=\"243.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">쇼핑 광고 관련성 (+20%)</text><rect x=\"216\" y=\"228.0\" width=\"88.3\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"313.3\" y=\"244.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">20%</text><text x=\"26\" y=\"294\" fill=\"#5a648a\" font-size=\"10\">자료: 원문 기사에서 추출 (자동)</text><text x=\"674\" y=\"294\" text-anchor=\"end\" fill=\"#9c7a3a\" font-size=\"11.5\" font-weight=\"800\">UNIVERTRIX · univertrix.com</text></svg></div><div class=\"col-chart\"><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"700\" height=\"216\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"18\" font-weight=\"800\">캐펙스 vs 클라우드 수주잔고</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12\" font-weight=\"600\">2026년 가이던스 및 실적 기준</text><line x1=\"210\" y1=\"76\" x2=\"210\" y2=\"170\" stroke=\"#3a4568\"/><text x=\"26\" y=\"105.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">연간 캐펙스 가이던스</text><rect x=\"216\" y=\"90.0\" width=\"144.4\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"369.4\" y=\"106.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">205B</text><text x=\"26\" y=\"151.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">클라우드 수주잔고</text><rect x=\"216\" y=\"136.0\" width=\"362.0\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"587.0\" y=\"152.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">514B</text><text x=\"26\" y=\"202\" fill=\"#5a648a\" font-size=\"10\">자료: 원문 기사에서 추출 (자동)</text><text x=\"674\" y=\"202\" text-anchor=\"end\" fill=\"#9c7a3a\" font-size=\"11.5\" font-weight=\"800\">UNIVERTRIX · univertrix.com</text></svg></div><div class=\"ce-tail\"><h3>출처</h3><ul class='ce-src'><li><a href=\"https://finance.yahoo.com/markets/stocks/articles/sundar-pichai-raised-alphabets-capex-154300838.html\" target=\"_blank\" rel=\"noopener\">https://finance.yahoo.com/markets/stocks/articles/sundar-pichai-raised-alphabets-capex-154</a></li><li><a href=\"https://stockstory.org/us/stocks/nasdaq/googl/news/earnings/consumer-internet-q2-earnings-alphabet-nasdaqgoogl-simply-the-best\" target=\"_blank\" rel=\"noopener\">https://stockstory.org/us/stocks/nasdaq/googl/news/earnings/consumer-internet-q2-earnings-</a></li><li><a href=\"https://www.reuters.com/legal/litigation/google-changes-spam-policy-eu-avert-antitrust-fine-2026-08-28/\" target=\"_blank\" rel=\"noopener\">https://www.reuters.com/legal/litigation/google-changes-spam-policy-eu-avert-antitrust-fin</a><span class='ce-src-note'> (제목·요약 기반)</span></li></ul><p class='ce-disc'>본 동행 관측은 정보 제공 목적의 기록이며 특정 종목의 매수·매도 권유가 아닙니다. 판단과 손익은 독자 본인에게 귀속됩니다.</p></div>", "sources": [{"url": "https://finance.yahoo.com/markets/stocks/articles/sundar-pichai-raised-alphabets-capex-154300838.html", "full": true, "attempted": true}, {"url": "https://stockstory.org/us/stocks/nasdaq/googl/news/earnings/consumer-internet-q2-earnings-alphabet-nasdaqgoogl-simply-the-best", "full": true, "attempted": true}, {"url": "https://www.reuters.com/legal/litigation/google-changes-spam-policy-eu-avert-antitrust-fine-2026-08-28/", "full": false, "attempted": false}], "origin": "auto", "slug": "alphabet-7182d387"}, {"company": "anthropic", "date": "2026-08-29", "title": "안전 자동화가 해자를 만든다 — Anthropic의 기술 편견에서 엔터프라이즈 가격책정권까지", "verdict": "강화", "html": "<h3>무슨 일이 있었나</h3><p>Anthropic은 8월 28일 자동화된 정렬 연구로 10가지 주요 안전 실패(기만, 아첨, 탈옥)를 개선하는 방법을 공개했다. Claude가 약한 모델들을 감독하는 방식으로 더 강력한 모델을 자율 학습시켜 프라이버시·기능성 저하 없이 모든 평가에서 일반화 성과를 입증했다. 동시에 8월 26일 Salesforce와의 전략적 통합(Claudeforce)을 발표했으며, 이는 CRM 내 Claude 에이전트 기본 내장을 의미한다. WSJ(8월 25일)에서 Anthropic이 투자자에게 $30조 이상의 잠재 수익(potential addressable market)을 제시했음이 보도됐다.</p><h3>10년 논제와의 연결</h3><p>이 일련의 사건들은 \"안전하게 만든 지능이 가장 비싸게 팔린다\"는 명제를 세 층위에서 동시에 강화한다.</p><p><strong>첫째, 기술적 해자의 자동화.</strong> 정렬 연구의 자동화는 Anthropic이 단순히 '더 안전한 모델을 팔기만' 하는 것이 아니라, '안전성 자체를 스케일하는 엔진'을 소유했음을 의미한다. 경쟁사들이 벤치마크를 따라잡을 때마다 Anthropic은 그 다음 세대의 안전 문제를 또 다시 자동으로 감지하고 해결한다. 이는 프론티어 모델 간 기술 성능 격차가 줄어들수록 오히려 '안전성 격차'가 더 큰 해자가 된다는 원장의 핵심 가설②를 입증한다.</p><p><strong>둘째, 수직 시장의 통행료화.</strong> Salesforce 통합은 Claude가 단순 API 제공자에서 '고객사 기업용 에이전트 기본층'으로 진화함을 의미한다. Salesforce의 1,000만+ 기업 사용자층이 내장된 Claude를 쓸 때, 그들은 Claude를 선택하는 것이 아니라 CRM 작업의 일부로서 자동으로 Claude의 신뢰성 프리미엄을 구매한다. 이는 ④자본 배분에서 제도적 플랫폼 의존성으로의 전환이다.</p><p><strong>셋째, 엔터프라이즈 점유 방어의 구조화.</strong> Salesforce 같은 엔터프라이즈급 플랫폼과의 기본 통합은 개별 구매 결정이 아니라 아키텍처 종속을 만든다. 기업이 Salesforce를 바꾸지 않는 한, Claude의 대체 가능성이 급락한다. 이는 점유율 30% 이상 유지(반증 조건의 반대) + 가격 경쟁의 회피 가능성을 동시에 강화한다.</p><h3>논제 판정: [강화]</h3><p>안전 자동화의 공개는 \"정렬 능력이 지속 가능한 경쟁 우위인가\"의 답을 기술 증거로 변환했다. Salesforce 통합은 그 우위가 단순 기술 프리미엄을 넘어 제도적 통행료로 전환 가능함을 보여준다. 원장의 핵심 가설 ①②에 대한 직접적 강화.</p><h3>무엇이 틀릴 수 있나</h3><p>비판적 해석: 자동화된 안전 개선이 개별 모델 성능 벤치마크에서 우수해도, 실제 엔터프라이즈 환경에서의 '신뢰도 차이'가 가격 프리미엄을 정당화하지 못할 수 있다. Salesforce 통합의 발표는 CRM 고객의 실제 Claude 사용률(engagement)을 아직 공개하지 않았다. 기본 내장이 실제 유료 고도 활용으로 전환되는지는 분기별 ARR 내역에서만 검증 가능하다. 또한 $30조 '잠재 수익'은 시장 존재 여부가 아니라 기하급수적 가정에 기반한 수치로, 규제·지정학·경쟁 가속화로 현저히 감소할 수 있다.</p><h3>다음 관측 포인트</h3><ul><li><strong>3Q ARR 공개 (10월 예상):</strong> $65B에서의 기울기가 Salesforce 통합 효과를 드러낼 첫 신호. 분기 성장률 40% 이상 유지 여부가 통행료 가설을 검증한다.</li><li><strong>Salesforce 실적 발표 (11월 예상):</strong> Salesforce의 AI 기능 사용률 공개 — Claude의 실제 엔드유저 engagement 데이터가 유일한 신뢰 지표.</li><li><strong>IPO S-1 밸류에이션 공개 (10월):</strong> 투자자의 현금 흐름 모델이 이 안전 자동화와 수직 통합을 어느 정도 반영했는지 암묵적 확인.</li></ul><div class=\"ce-tail\"><h3>출처</h3><ul class='ce-src'><li><a href=\"https://www.anthropic.com/research/automated-researchers-mitigate-alignment-failures\" target=\"_blank\" rel=\"noopener\">https://www.anthropic.com/research/automated-researchers-mitigate-alignment-failures</a></li><li><a href=\"https://www.wsj.com/tech/ai/anthropic-expected-to-tell-investors-it-sees-over-30-trillion-in-potential-revenue-a611efea\" target=\"_blank\" rel=\"noopener\">https://www.wsj.com/tech/ai/anthropic-expected-to-tell-investors-it-sees-over-30-trillion-</a><span class='ce-src-note'> (유료벽 — 제목·요약 기반)</span></li><li><a href=\"https://www.salesforce.com/news/press-releases/2026/08/26/salesforce-and-anthropic-announce-claudeforce/\" target=\"_blank\" rel=\"noopener\">https://www.salesforce.com/news/press-releases/2026/08/26/salesforce-and-anthropic-announc</a><span class='ce-src-note'> (제목·요약 기반)</span></li><li><a href=\"https://www.cnbc.com/2026/08/26/salesforce-anthropic-partnership-claudeforce.html\" target=\"_blank\" rel=\"noopener\">https://www.cnbc.com/2026/08/26/salesforce-anthropic-partnership-claudeforce.html</a><span class='ce-src-note'> (제목·요약 기반)</span></li></ul><p class='ce-coi'>이해관계 고지: 이 사이트의 자동 분석은 Anthropic 의 모델로 작성됩니다. Anthropic 에세이는 공식 발표와 제3자 보도만을 근거로 쓰며, 칭찬과 비판에 같은 증거 기준을 적용합니다.</p><p class='ce-disc'>본 동행 관측은 정보 제공 목적의 기록이며 특정 종목의 매수·매도 권유가 아닙니다. 판단과 손익은 독자 본인에게 귀속됩니다.</p></div>", "sources": [{"url": "https://www.anthropic.com/research/automated-researchers-mitigate-alignment-failures", "full": true, "attempted": true}, {"url": "https://www.wsj.com/tech/ai/anthropic-expected-to-tell-investors-it-sees-over-30-trillion-in-potential-revenue-a611efea", "full": false, "attempted": true}, {"url": "https://www.salesforce.com/news/press-releases/2026/08/26/salesforce-and-anthropic-announce-claudeforce/", "full": false, "attempted": false}, {"url": "https://www.cnbc.com/2026/08/26/salesforce-anthropic-partnership-claudeforce.html", "full": false, "attempted": false}], "origin": "auto", "slug": "anthropic-6c63673d"}, {"company": "alphabet", "date": "2026-08-29", "title": "검색은 죽지 않았다 — Q2 캐펙스 공포를 이기는 세 가지 신호", "verdict": "강화", "html": "<h3>무슨 일이 있었나</h3><p>Alphabet이 Q2 2026 매출 $119.8B(예상 $116.93B, +24% YoY)를 보고했다. Google Cloud는 $24.77B로 전분기 63%에서 82%로 가속했고, 캐펙스는 $44.92B로 가이던스 상단에 정착했다. 비-GAAP EPS $2.85는 합의치 $2.89에 미달했으나, 검색 광고는 +17%, 쇼핑 광고 관련성은 +20% 증가했다. 토큰 처리량은 22B/분으로 1분기 대비 +37% 상승했다.</p><h3>10년 논제와의 연결</h3><p>이 실적은 원장의 세 가설을 동시에 시험한다.</p><p><strong>첫째, 검색 해자 변태설:</strong> \"AI 검색 확산이 검색 광고를 갉아먹는가\"라는 문제에 대해 Q2는 명확한 답을 제시한다. 검색 광고 매출 성장이 11분기 연속 두 자릿수를 기록했고, Gemini 무료 서비스 확산 속에서도 광고 관련성이 개선됐다. 이는 단순 \"검색 수익 유지\"가 아니라 **AI를 통한 광고주-사용자 매칭 정밀도 향상**을 시사한다. 반대로 Gemini 유료화 장애나 광고 삽입 기술 미숙이 드러났다면 해자 침식의 신호가 됐을 것이다. 그렇지 않았다.</p><p><strong>둘째, 클라우드+TPU 두 번째 통행료설:</strong> Cloud +82%는 단순 고성장이 아니라 **공급 제약 하에서의 원가우 현상**이다. 수주잔고 $514B는 Q1 대비 구체적인 수치 변화를 기다리고 있지만, 토큰 처리량 +37% 가속은 TPU 외부 고객층이 량적으로 인정되고 있음을 암시한다. 원장이 지정한 \"반증 조건\"(수주잔고 전환율 둔화)은 아직 나타나지 않았다.</p><p><strong>셋째, 캐펙스 재투자 공포 대비설:</strong> $44.92B는 연간 $180B를 목표로 하는 2026 가이던스($175~185B)를 무섭지 않게 소화 중이다. 중요한 것은 **캐펙스가 비용처럼 처리되지 않았다**는 점이다. Cloud COGS 효율이나 GPU 가동률 같은 '반증 신호'를 확인하려면 다음 원가 분석이 필요하지만, 이번 실적은 \"캐펙스 함정\"이 아니라 \"씨즈급 재투자\"라는 가설을 한 걸음 전진시켰다.</p><h3>논제 판정</h3><p><strong>[강화]</strong> 검색 광고 회복력(+17%)과 Cloud 가속(+82%) 동시 입증, TPU 외부 수요 토큰 신호, 캐펙스 공포 불현실화. 다만 Cloud 마진 개선율과 수주잔고 전환 수치는 아직 미확인 상태로, 다음 분기 추적이 필수다.</p><h3>무엇이 틀릴 수 있나</h3><p>이 해석은 한 분기의 일회성 호실적을 트렌드로 본 것일 수 있다. Cloud +82%는 낮은 베이스(작년 Q2는 글로벌 생성형 AI 초기)의 효과일 수 있으며, 검색 광고 성장도 경기 호황의 일시적 반영이 될 수 있다. 특히 비-GAAP EPS가 컨센서스에 미달한 점은 **운영 비용 억제의 한계**를 시사할 수 있으며, 캐펙스가 $44.92B 수준에서 정체하더라도 (선택지) 그것이 투자 회피라면 \"재투자 공포\"는 여전히 유효하다. 또한 EU 스팸 정책 변화(별도 보도) 같은 규제 비용이 향후 분기에 크게 불어날 가능성도 배제할 수 없다.</p><h3>다음 관측 포인트</h3><ul><li><strong>2026 3Q 실적 (10월 말):</strong> Cloud 마진율(특히 COGS 증감), TPU 외부 매출이 별도 라인으로 공개되는지, 캐펙스 연간 가이던스 재조정 여부.</li><li><strong>Gemini 4 / Advanced 가격 책정:</strong> 유료 구독 전환율이 광고 성장을 상쇄할 수 있는 규모인지, 또는 보조적 수익원인지 판명.</li><li><strong>수주잔고 전환율 수치 (분기 발표):</strong> $514B 중 실제 분기별 인식액 추세 — 2년 연속 둔화 시 두 번째 통행료 가설 약화 신호.</li></ul><h3>이해관계 명시</h3><p>Anthropic은 Google/Alphabet의 클라우드 고객이며, Gemini 모델을 통해 기술 협력 관계가 있다. 이 에세이는 공식 실적 발표(CNBC 보도)와 제3자 애널리틱스(Webull, StreetAccount)만을 근거로 작성되었으나, 완전한 독립 해석으로 보기 어렵다. 독자는 이 점을 감안해 평가해야 한다.</p><div class=\"col-chart\"><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"700\" height=\"216\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"18\" font-weight=\"800\">Google Cloud 성장 가속도</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12\" font-weight=\"600\">Q1 2026 vs Q2 2026 YoY 성장률</text><line x1=\"210\" y1=\"76\" x2=\"210\" y2=\"170\" stroke=\"#3a4568\"/><text x=\"26\" y=\"105.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">Q1 2026</text><rect x=\"216\" y=\"90.0\" width=\"278.1\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"503.1\" y=\"106.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">63%</text><text x=\"26\" y=\"151.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">Q2 2026</text><rect x=\"216\" y=\"136.0\" width=\"362.0\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"587.0\" y=\"152.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">82%</text><text x=\"26\" y=\"202\" fill=\"#5a648a\" font-size=\"10\">자료: 원문 기사에서 추출 (자동)</text><text x=\"674\" y=\"202\" text-anchor=\"end\" fill=\"#9c7a3a\" font-size=\"11.5\" font-weight=\"800\">UNIVERTRIX · univertrix.com</text></svg></div><div class=\"col-chart\"><svg viewBox=\"0 0 700 262\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"700\" height=\"262\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"18\" font-weight=\"800\">광고 부문 회복 신호</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12\" font-weight=\"600\">Q2 2026 성장률</text><line x1=\"210\" y1=\"76\" x2=\"210\" y2=\"216\" stroke=\"#3a4568\"/><text x=\"26\" y=\"105.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">검색 광고</text><rect x=\"216\" y=\"90.0\" width=\"256.4\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"481.4\" y=\"106.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">17%</text><text x=\"26\" y=\"151.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">쇼핑 광고 관련성</text><rect x=\"216\" y=\"136.0\" width=\"301.7\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"526.7\" y=\"152.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">20%</text><text x=\"26\" y=\"197.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">전체 매출</text><rect x=\"216\" y=\"182.0\" width=\"362.0\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"587.0\" y=\"198.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">24%</text><text x=\"26\" y=\"248\" fill=\"#5a648a\" font-size=\"10\">자료: 원문 기사에서 추출 (자동)</text><text x=\"674\" y=\"248\" text-anchor=\"end\" fill=\"#9c7a3a\" font-size=\"11.5\" font-weight=\"800\">UNIVERTRIX · univertrix.com</text></svg></div><div class=\"ce-tail\"><h3>출처</h3><ul class='ce-src'><li><a href=\"https://www.webull.com/blog/294-Alphabet-Q2-2026-Earnings-Revenue-Beats-Cloud-Revenue-Surges-82\" target=\"_blank\" rel=\"noopener\">https://www.webull.com/blog/294-Alphabet-Q2-2026-Earnings-Revenue-Beats-Cloud-Revenue-Surg</a></li></ul><p class='ce-disc'>본 동행 관측은 정보 제공 목적의 기록이며 특정 종목의 매수·매도 권유가 아닙니다. 판단과 손익은 독자 본인에게 귀속됩니다.</p></div>", "sources": [{"url": "https://www.webull.com/blog/294-Alphabet-Q2-2026-Earnings-Revenue-Beats-Cloud-Revenue-Surges-82", "full": true, "attempted": true}], "origin": "auto", "slug": "alphabet-bc4abb93"}, {"company": "anthropic", "date": "2026-08-28", "title": "과학이 다음 해자다 — Anthropic의 수직시장 진입과 MHS 표준화", "verdict": "강화", "html": "<h3>무슨 일이 있었나</h3><p>Anthropic이 2026년 8월 27일 세 가지 과학 커뮤니티 프로그램을 동시 발표했다. 첫째, 10,000명의 과학자에게 1년간 무료·할인 Claude 구독 제공(프리미엄 $15/월, 5배 사용량). 둘째, 'Claude Science' 제품을 통한 통합 연구 도구 및 컴퓨팅 리소스 접근 확대. 셋째, 'Model Hardware Standard(MHS)'라는 AI 에이전트용 물리 장비 표준을 과학 및 제조 랩에 개방 — 마이크로스코프·액체 핸들러·로봇팔 등 여러 장비의 병렬 운영을 시간 단위에 통합하도록 한다. 동시에 'AI for Science 프로그램'을 생물학 외 화학·수학 등으로 확대하고, 프로젝트당 최대 $50,000 크레딧 제공을 공시했다.</p><h3>10년 논제와의 연결</h3><p>이 발표는 논제 원장의 핵심 가설 1과 3을 동시에 강화한다. 먼저 가설 1('엔터프라이즈 통행료는 실재한다')의 관점에서, 과학 커뮤니티는 이제까지 포괄되지 않은 '새로운 통행료 수직시장'을 보여준다. 무료·할인 구독은 단기 LTV 희생처럼 보이지만, MHS 표준화는 그 반대 신호다. 과학 장비를 Claude 에이전트의 중추적 인터페이스로 만들면, 연구자들이 다른 LLM으로 전환하는 비용이 기술적으로 고착된다 — 기존의 'AI 안전 신뢰 프리미엄'에 '하드웨어 통합 스위칭 코스트'라는 새로운 해자층이 추가되는 것이다. 가설 3('멀티클라우드 중립성이 우위')도 강화된다. MHS는 모델 불가지론적(model-agnostic)이면서 'Model Context Protocol' 같은 개방 표준을 쓴다고 명시했다. 이는 과학 커뮤니티 내에서 Anthropic이 'AWS 같은 한 벤더에 종속되지 않은 표준 기반시설 제공자'로 자리매김하는 전략이다. 과학은 재현성과 개방성을 최고 가치로 삼는 도메인이므로, 폐쇄형 에코락인 GPT나 Gemini보다 표준화된 Anthropic 스택을 신뢰하게 할 가능성이 높다. 또한 이 전략은 $47B→$65B로 성장한 엔터프라이즈 ARR의 '다음 곡선'을 암시한다. 앞의 두 에세이가 기업 IT와 코딩 자동화 부문의 통행료를 다뤘다면, 이번은 과학·제조라는 '하드웨어 연동형 고수익 산업' 진입을 보여주는 것이다.</p><h3>논제 판정</h3><p>[강화] MHS와 과학 구독 프로그램은 단순한 브랜드 활동이 아니라 해자의 형태 변환(신뢰 프리미엄 → 기술적 스위칭 코스트)을 공시한 것. 또한 멀티클라우드 중립성을 과학 커뮤니티 선호도로 구체화하고, 엔터프라이즈 통행료의 확산 경로(기업 IT → 코딩 → 과학·제조)를 드러냈다. 다만 과학 세그먼트의 매출 기여도가 아직 공개되지 않아 규모의 실재성은 Q3 ARR에서 검증 필요.</p><h3>무엇이 틀릴 수 있나</h3><p>이 프로그램을 단순 마케팅·사회공헌으로 읽을 수 있다. 무료 구독 10,000명과 $50,000 크레딧은 매출상 미미할 수 있고, MHS도 '표준 제안' 단계로 채택률이 불명확하다. 경쟁사들도 비슷한 연구 지원 프로그램을 복제할 수 있으며, 과학 커뮤니티 자체가 LLM의 '가격 민감도'가 낮아 통행료를 주지 않을 수도 있다. 또한 MHS가 정말 하드웨어 통합 비용을 시간 단위로 낮춘다는 기술적 증거는 이 발표문에는 없다 — 'weeks→hours'라는 추정치만 있다. 마지막으로, 과학자 커뮤니티가 '안전하게 만든 AI'를 기업들보다 더 선호한다는 가정도 검증되지 않았다.</p><h3>다음 관측 포인트</h3><ul><li>Q3 2026 ARR 공시 (9월 말 예상): 과학 세그먼트가 기업 성장률에 추가 기여도를 보이는가. 특히 $65B 이후의 기울기가 둔화했는지 확인.</li><li>MHS 채택 신호 (3개월 내): 연구 랩의 도입 사례 공시. Janelia 외 대형 과학 기관(MIT·Stanford·Max Planck)의 MHS 통합 공식 발표.</li><li>과학 크레딧 소진율 (분기마다): AI for Science 프로그램의 신청 규모 및 평균 크레딧 사용량. 실제 수요가 있는지의 첫 신호.</li><li>IPO 이후 과학 세그먼트 매출 공시 (2027년 예상): 통행료 가설 검증의 필수 데이터.</li></ul><div class=\"col-chart\"><svg viewBox=\"0 0 700 308\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"700\" height=\"308\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"18\" font-weight=\"800\">Anthropic 엔터프라이즈 통행료 세그먼트 진화</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12\" font-weight=\"600\">5월→8월 ARR 성장 경로와 수직시장 확산</text><line x1=\"210\" y1=\"76\" x2=\"210\" y2=\"262\" stroke=\"#3a4568\"/><text x=\"26\" y=\"105.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">기업 IT (5월)</text><rect x=\"216\" y=\"90.0\" width=\"261.8\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"486.8\" y=\"106.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">47B</text><text x=\"26\" y=\"151.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">기업 IT (8월)</text><rect x=\"216\" y=\"136.0\" width=\"362.0\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"587.0\" y=\"152.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">65B</text><text x=\"26\" y=\"197.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">코딩 에이전트 (기여도 추정)</text><rect x=\"216\" y=\"182.0\" width=\"130.9\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"355.9\" y=\"198.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">23.5B</text><text x=\"26\" y=\"243.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">과학·제조 (파이프라인 진입)</text><rect x=\"216\" y=\"228.0\" width=\"21.7\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"246.7\" y=\"244.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">0B</text><text x=\"26\" y=\"294\" fill=\"#5a648a\" font-size=\"10\">자료: 원문 기사에서 추출 (자동)</text><text x=\"674\" y=\"294\" text-anchor=\"end\" fill=\"#9c7a3a\" font-size=\"11.5\" font-weight=\"800\">UNIVERTRIX · univertrix.com</text></svg></div><div class=\"ce-tail\"><h3>출처</h3><ul class='ce-src'><li><a href=\"https://www.anthropic.com/news/expanding-support-for-scientists\" target=\"_blank\" rel=\"noopener\">https://www.anthropic.com/news/expanding-support-for-scientists</a></li><li><a href=\"https://www.anthropic.com/news/model-hardware-standard-research-preview\" target=\"_blank\" rel=\"noopener\">https://www.anthropic.com/news/model-hardware-standard-research-preview</a></li><li><a href=\"https://www.anthropic.com/beneficial-deployments\" target=\"_blank\" rel=\"noopener\">https://www.anthropic.com/beneficial-deployments</a></li></ul><p class='ce-coi'>이해관계 고지: 이 사이트의 자동 분석은 Anthropic 의 모델로 작성됩니다. Anthropic 에세이는 공식 발표와 제3자 보도만을 근거로 쓰며, 칭찬과 비판에 같은 증거 기준을 적용합니다.</p><p class='ce-disc'>본 동행 관측은 정보 제공 목적의 기록이며 특정 종목의 매수·매도 권유가 아닙니다. 판단과 손익은 독자 본인에게 귀속됩니다.</p></div>", "sources": [{"url": "https://www.anthropic.com/news/expanding-support-for-scientists", "full": true, "attempted": true}, {"url": "https://www.anthropic.com/news/model-hardware-standard-research-preview", "full": true, "attempted": true}, {"url": "https://www.anthropic.com/beneficial-deployments", "full": true, "attempted": true}], "origin": "auto", "slug": "anthropic-5842b116"}, {"company": "spacex", "date": "2026-08-27", "title": "궤도 건설자의 선택 — $100B 루이지애나와 타워 캐치의 의미", "verdict": "강화", "html": "<h3>무슨 일이 있었나</h3><p>SpaceX가 8월 25일 루이지애나 주(Vermilion Parish, Pecan Island)에 $100B 규모의 메가스페이스포트 건설을 발표했다. 연간 수천 회의 발사를 지원할 수 있는 설계로, 회사 역사상 가장 큰 단일 시설 투자다. 동시에 머스크는 8월 20일 Starship 부스터의 타워 캐치 시도를 \"몇 개월 내\"로 일정화했으며, 이는 재사용성 혁신의 다음 단계를 공식화한 것이다.</p><p>별도로 트럼프 전 대통령이 IPO 직후 2주간 SpaceX 지분을 매입했음이 확인됐으며(8월 24일 보도), Anthropic이 SpaceX IPO($150B) 규모 이상의 자금조달을 준비 중임이 알려졌다.</p><h3>10년 논제와의 연결</h3><p>이 세 신호는 논제의 세 층을 동시에 강화한다.</p><p><strong>첫째, 궤도의 건물주 전략의 최종 확정.</strong> $100B 루이지애나 캠퍼스는 Starlink 성장에 앞서는 '공급 기반 확보'이다. 논제는 \"지구 저궤도를 물류망으로\"라고 했는데, 물류망은 터미널 없이는 존재하지 않는다. 이 투자는 '수직 통합 플랫폼'이 단순 관념이 아니라 콘크리트와 발사대라는 신호다. 회사가 이제 로켓을 파는 것이 아니라 '발사 인프라 자산'을 소유하겠다는 선언이다. 이는 AWS의 데이터센터 전략과 동형이다.</p><p><strong>둘째, Starship 타워 캐치의 시간축 구체화.</strong> \"몇 개월\"이라는 표현은 야심찬 일정이지만, 핵심은 다음이다: 이 성공이 2027~2028년의 상용 Starship 운용 단가를 결정한다. 논제 원장의 반증 조건 \"2028년까지 상용 페이로드 정기 운항 미달성\"이 이제 구체적 마일스톤으로 번역된다. 부스터 캐치 기술은 Falcon의 1차 부스터 재착륙처럼, '단위 경제의 점프'의 필수 조건이다.</p><p><strong>셋째, AI 세그먼트의 자본 흡수력 재해석.</strong> Anthropic IPO 움직임과 Colossus 계약이 활발한 와중에 SpaceX가 우주 인프라에 $100B을 먼저 투입한다는 것은, 내부 우선순위를 드러낸다. xAI와 우주가 경쟁이 아니라 분업 구조라는 신호다. AI는 '고객'이 될 예정이며, 우주는 '기반'이다.</p><h3>논제 판정</h3><p><strong>[강화]</strong> 루이지애나 투자는 '궤도 건설주' 전략의 물리적 확정이며, Starship 타워 캐치 일정은 핵심 가설 2번(단위 경제 혁신)을 2028년 이전으로 검증 시간축을 당긴다. 반증 조건이 구체화되어 관측 정밀도가 높아진다.</p><h3>무엇이 틀릴 수 있나</h3><p>반대 해석: $100B 캐펙스는 '확신'이 아니라 '야심의 증거'일 수 있다. 루이지애나 시설이 2030년까지 실질 운용 능력을 갖추지 못하면, 이는 과도한 설비 투자이자 자본 효율성의 악화다. 또한 Starship 타워 캐치가 \"몇 개월\"이라는 약속은 반복된 지연 패턴(우주항공의 상수) 속에서 신뢰도 할인이 필요하다. 그리고 트럼프의 지분 매입과 규제 친화성 사이의 '정치적 프리미엄'을 분리하기는 어렵다 — 인프라 투자가 순수 경제학이 아니라 정치적 기울기 위에 있을 수 있다.</p><h3>다음 관측 포인트</h3><ul><li><strong>루이지애나 시설 착공 일정 및 첫 발사대 완성 예정</strong>(2027 상반기 목표 확인) — 논제의 '건물주' 경제학이 얼마나 현실적인지의 첫 검증</li><li><strong>Starship 부스터 타워 캐치 첫 시도 결과</strong>(2026년 말~2027년 초) — 2028 상용화 반증 조건의 가장 큰 마일스톤</li><li><strong>3Q 실적(11월 초)</strong> — Starlink 성장률과 AI 부문 손실 궤적이 여전히 관리 가능 범위인지 확인. 루이지애나 투자가 자본구조에 즉각 부담이 되지 않는지 추적</li></ul><div class=\"ce-tail\"><h3>출처</h3><ul class='ce-src'><li><a href=\"https://www.opportunitylouisiana.gov/news/spacex-launches-new-era-of-commercial-spaceflight-with-100-billion-louisiana-campus\" target=\"_blank\" rel=\"noopener\">https://www.opportunitylouisiana.gov/news/spacex-launches-new-era-of-commercial-spacefligh</a></li><li><a href=\"https://www.space.com/space-exploration/launches-spacecraft/spacex-will-try-for-1st-starship-tower-catch-in-a-few-months-elon-musk-says\" target=\"_blank\" rel=\"noopener\">https://www.space.com/space-exploration/launches-spacecraft/spacex-will-try-for-1st-starsh</a></li><li><a href=\"https://techcrunch.com/2026/08/24/trump-bought-spacex-shares-two-weeks-after-blockbuster-ipo/\" target=\"_blank\" rel=\"noopener\">https://techcrunch.com/2026/08/24/trump-bought-spacex-shares-two-weeks-after-blockbuster-i</a><span class='ce-src-note'> (제목·요약 기반)</span></li><li><a href=\"https://finance.yahoo.com/technology/ai/articles/anthropic-expects-match-spacex-record-175602035.html\" target=\"_blank\" rel=\"noopener\">https://finance.yahoo.com/technology/ai/articles/anthropic-expects-match-spacex-record-175</a><span class='ce-src-note'> (제목·요약 기반)</span></li></ul><p class='ce-disc'>본 동행 관측은 정보 제공 목적의 기록이며 특정 종목의 매수·매도 권유가 아닙니다. 판단과 손익은 독자 본인에게 귀속됩니다.</p></div>", "sources": [{"url": "https://www.opportunitylouisiana.gov/news/spacex-launches-new-era-of-commercial-spaceflight-with-100-billion-louisiana-campus", "full": true, "attempted": true}, {"url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-will-try-for-1st-starship-tower-catch-in-a-few-months-elon-musk-says", "full": true, "attempted": true}, {"url": "https://techcrunch.com/2026/08/24/trump-bought-spacex-shares-two-weeks-after-blockbuster-ipo/", "full": false, "attempted": false}, {"url": "https://finance.yahoo.com/technology/ai/articles/anthropic-expects-match-spacex-record-175602035.html", "full": false, "attempted": false}], "origin": "auto", "slug": "spacex-01e0ce5b"}, {"company": "spacex", "date": "2026-08-26", "title": "궤도 건설장의 우선순위 — Starship 성숙도와 $100B의 의미", "verdict": "불변", "html": "<h3>무슨 일이 있었나</h3><p>SpaceX가 루이지애나 벰일리온 parish에 차세대 우주항 건설을 위해 향후 $100B 투자를 발표했다(8월 25일). 동시에 9월로 예정된 Starship Flight 14는 상단 포획(catch) 시도를 취소하고 위성 투기(deployment)만 수행하는 방식으로 축소되었다(8월 21일). 이는 Flight 13(7월) 이후 추진 시스템 재설계를 거친 것으로 보인다.</p><h3>10년 논제와의 연결</h3><p>이 두 신호는 서로 다른 층위에서 같은 확신을 반영한다. 루이지애나 투자는 \"Starship이 단위 경제를 다시 한 번 부문다\"는 가설(핵심 가설②)에 대한 경영진의 자금 베팅이다. 연 수천 회 발사를 감당할 우주항 건설에 $100B를 투입한다는 것은, 마진율 개선을 통해 그 자본이 회수된다는 신념 없이는 불가능하다. 반대로 Flight 14의 상단 포획 취소는, 그 신념과 현실 사이의 간격을 인정하는 신호다. 2024년 말 추진 시스템 과열 문제 이후, SpaceX가 점증적 검증(incremental validation)으로 방향을 틀었다는 의미다. 10년 논제는 이 둘을 동시에 담아야 한다: 장기 확신은 높으나, 단기 기술 숙성이 설계 목표보다 느리다는 명시적 증거가 나타났다.</p><h3>논제 판정</h3><p><strong>[불변]</strong> Starship의 단위 경제 부괴 가설은 여전히 반증되지 않았으나, 기술적 실현 경로의 난이도가 초기 예상보다 크다는 것이 확인되었다. 자본 배분 신호(루이지애나)는 강화이나, 기술 진척 속도(포획 취소)는 약화를 시사한다. 둘을 합산하면 확신의 크기는 유지되되, 시간축이 연장되었을 가능성이 높다.</p><h3>무엇이 틀릴 수 있나</h3><p>상단 포획 취소를 보수적 공학 판단으로 보는 관점도 타당하다. Falcon 9조차 상단 회수에 10년이 걸렸고, Starship은 무게와 속도가 한 차수 위다. 축소된 Flight 14가 사실은 더 견고한 기초 위에서 나머지 단계(포획, 상단 양산형 재비행)를 준비하는 것이라면, 이는 약화가 아니라 \"확신 있는 연장\"이다. 또한 $100B 투자 규모 자체가 루이지애나 주의 인센티브 풀에 포함되어 있을 수 있으며, 실제 SpaceX 자금 투입이 이보다 훨씬 작을 수도 있다. 공시 자료를 확인할 필요가 있다.</p><h3>다음 관측 포인트</h3><ul><li><strong>Flight 14 발사 결과</strong> (9월 초 예상): 위성 투기 성공률, 상단 재입장 제어 정확도, 추진 시스템 이상 여부. 포획 취소가 얼마나 보수적인 결정인지를 결정하는 신호.</li><li><strong>3Q 실적 발표</strong> (11월 초): Starship 상용 페이로드 계약 진행도, 루이지애나 자본 투입 일정, AI 부문 손실 추이. 특히 외부 고객(위성 배포 계약) 수주 현황이 핵심.</li><li><strong>루이지애나 투자 공시</strong> (SEC 또는 기업공시): $100B 중 실제 SpaceX 자금, 정부 인센티브 규모, 예상 완공 시기. 자본 배분의 신뢰도를 판정하는 데 필수.</li></ul><div class=\"ce-tail\"><h3>출처</h3><ul class='ce-src'><li><a href=\"https://www.opportunitylouisiana.gov/spacex\" target=\"_blank\" rel=\"noopener\">https://www.opportunitylouisiana.gov/spacex</a></li><li><a href=\"https://spacenews.com/spacex-scales-back-plans-for-next-starship-launch/\" target=\"_blank\" rel=\"noopener\">https://spacenews.com/spacex-scales-back-plans-for-next-starship-launch/</a></li></ul><p class='ce-disc'>본 동행 관측은 정보 제공 목적의 기록이며 특정 종목의 매수·매도 권유가 아닙니다. 판단과 손익은 독자 본인에게 귀속됩니다.</p></div>", "sources": [{"url": "https://www.opportunitylouisiana.gov/spacex", "full": true, "attempted": true}, {"url": "https://spacenews.com/spacex-scales-back-plans-for-next-starship-launch/", "full": true, "attempted": true}], "origin": "auto", "slug": "spacex-158555d4"}, {"company": "alphabet", "date": "2026-08-26", "title": "11분기 계속 — AI 공포와 현실의 거리", "verdict": "강화", "html": "<h3>무슨 일이 있었나</h3><p>Alphabet이 2026년 2분기 매출 $119.8B(전년 동기 대비 +24.2%)를 보고했다. 분석가 합의 추정치를 2.2% 상회했고, EPS 추정치도 견고하게 초과 달성했다. 이는 <strong>논제 원장이 추적하는 '11분기 연속 두 자릿수 성장'의 연속</strong>이며, AI 검색 대체 우려가 강했던 시점에서도 검색·쇼핑 광고 성장이 원장의 가설대로 진행됨을 보여준다.</p><h3>10년 논제와의 연결</h3><p>이 실적은 두 가지 핵심 가설을 동시에 강화한다.</p><ul><li><strong>가설 1 — 검색 해자는 침식이 아니라 변태 중</strong><br>시장은 Gemini 같은 AI 검색 모델이 기존 검색 광고 시장을 대체할 것으로 두려워했다. 그러나 원장이 예측했듯 실적에는 여전히 두 자릿수 성장만 나타난다. 이는 사용자의 쿼리 패턴 변화가 검색 해자를 <em>침식</em>하는 것이 아니라, 검색 자체의 정의를 <em>재규정</em>하고 있음을 시사한다. AI 답변은 단순 링크 클릭이 아닌 더 깊은 상거래 의도 포착으로 이어질 수 있다는 뜻이다.</li><li><strong>가설 2 — 클라우드+TPU가 두 번째 통행료로 성숙 중</strong><br>원장은 클라우드 +82%, 수주잔고 $514B, TPU 외부 판매 개시를 핵심 근거로 제시했다. Q2 실적이 이 추세의 지속을 보여주면, Alphabet의 '두 번째 통행료' 건설이 개념 단계를 벗어나 실물 경제로 진입했다는 뜻이다. 캐펙스 $175~185B가 정당한 씨즈 투자인지 판정하는 가장 중요한 시점이다.</li></ul><p>시장이 주가를 flat으로 반응시킨 것(원장 기술)은 <strong>충격 부재의 신호</strong>이다. 좋은 뉴스가 이미 가격에 반영된 상태에서, 실적이 그 기대를 정확히 충족했다는 해석이다. 이는 버핏 멀티플 '현재 괴리 +35% 안팎'을 설명하는 합리적 이유가 된다 — 공포 프리미엄이 아직 남아 있다는 뜻.</p><h3>논제 판정</h3><p><strong>[강화]</strong> 두 자릿수 매출 성장이 11분기 연속 지속되었고, 클라우드 부문 성장률이 원장의 $514B 수주 가설을 뒷받침한다. 검색 광고의 구조적 침식 신호는 여전히 나타나지 않으며, AI 모델 도입이 광고 단가 하락(반증 조건)으로 이어지지 않았다.</p><h3>무엇이 틀릴 수 있나</h3><p>이 실적은 '이미 가격 반영된 기대'를 충족했을 뿐 시장 구조 변화를 증명하지는 않을 수 있다. Gemini 같은 생성형 AI의 '보수적 배포'(광고 노출 최소화 정책)가 결국 검색 광고 성장을 억제할 수도 있으며, 이것이 3~4분기 뒤 점진적으로 나타날 가능성도 배제할 수 없다. 또한 클라우드 매출 성장률이 고객 획득 단계에서의 손실 선도(leading loss)를 감춘 것일 수도 있다 — 실제 수익성 개선(가설 3의 핵심)은 아직 선행 지표일 뿐이다.</p><h3>다음 관측 포인트</h3><ul><li>3Q 실적 발표 (10월 말 예정): 클라우드 성장률이 +82%에서 둔화하는지, TPU 외부 매출 라인이 구체적으로 공개되는지 추적. 이것이 캐펙스 정당성의 직접 검증 지점.</li><li>Gemini 4 공개 일정: 원장에서 언급된 '사전훈련 진행 중'이 실제 제품 출시로 이어질 때, 검색·광고 통합 전략의 구체상을 확인 가능.</li><li>애드테크 반독점 구제안 판결 (시기 미정): 원장이 지칭한 '검증 가능한 공포' 이벤트. 판결 내용이 캐펙스 재투자 전략을 제약할 가능성 모니터링.</li></ul><div class=\"col-chart\"><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"700\" height=\"216\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"18\" font-weight=\"800\">Alphabet 매출 성장률 추이</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12\" font-weight=\"600\">전년 동기 대비 성장률, %</text><line x1=\"210\" y1=\"76\" x2=\"210\" y2=\"170\" stroke=\"#3a4568\"/><text x=\"26\" y=\"105.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">Q2 2026 (최신)</text><rect x=\"216\" y=\"90.0\" width=\"362.0\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"587.0\" y=\"106.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">24.2%</text><text x=\"26\" y=\"145.0\" fill=\"#e6ebfa\" font-size=\"11\" font-weight=\"700\">원장 기준선 (11분기 연속 두</text><text x=\"26\" y=\"158.5\" fill=\"#e6ebfa\" font-size=\"11\" font-weight=\"700\">자릿수)</text><rect x=\"216\" y=\"136.0\" width=\"224.4\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"449.4\" y=\"152.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">15%</text><text x=\"26\" y=\"202\" fill=\"#5a648a\" font-size=\"10\">자료: 원문 기사에서 추출 (자동)</text><text x=\"674\" y=\"202\" text-anchor=\"end\" fill=\"#9c7a3a\" font-size=\"11.5\" font-weight=\"800\">UNIVERTRIX · univertrix.com</text></svg></div><div class=\"ce-tail\"><h3>출처</h3><ul class='ce-src'><li><a href=\"https://www.wsj.com/finance/stocks/the-121-billion-in-one-time-gains-boosting-big-techs-profits-5d2201da\" target=\"_blank\" rel=\"noopener\">https://www.wsj.com/finance/stocks/the-121-billion-in-one-time-gains-boosting-big-techs-pr</a><span class='ce-src-note'> (유료벽 — 제목·요약 기반)</span></li><li><a href=\"https://stockstory.org/us/stocks/nasdaq/googl/news/earnings/consumer-internet-q2-earnings-alphabet-nasdaqgoogl-simply-the-best?utm_source=newsSitemap&amp;utm_medium=googleNews&amp;utm_campaign=distribution\" target=\"_blank\" rel=\"noopener\">https://stockstory.org/us/stocks/nasdaq/googl/news/earnings/consumer-internet-q2-earnings-</a></li></ul><p class='ce-disc'>본 동행 관측은 정보 제공 목적의 기록이며 특정 종목의 매수·매도 권유가 아닙니다. 판단과 손익은 독자 본인에게 귀속됩니다.</p></div>", "sources": [{"url": "https://www.wsj.com/finance/stocks/the-121-billion-in-one-time-gains-boosting-big-techs-profits-5d2201da", "full": false, "attempted": true}, {"url": "https://stockstory.org/us/stocks/nasdaq/googl/news/earnings/consumer-internet-q2-earnings-alphabet-nasdaqgoogl-simply-the-best?utm_source=newsSitemap&utm_medium=googleNews&utm_campaign=distribution", "full": true, "attempted": true}], "origin": "auto", "slug": "alphabet-1fc0dd7f"}, {"company": "anthropic", "date": "2026-08-25", "title": "통행료의 증거: $65B ARR, 엔터프라이즈 프리미엄의 첫 공개 검증", "verdict": "강화", "html": "<h3>무슨 일이 있었나</h3><p>Anthropic의 연간경상수익률(ARR)이 7월 말 기준 $65B에 도달했다고 로이터·월스트리트저널이 8월 18일 보도했다. 이는 5월 $47B 이후 불과 3개월간 $18B 증가한 수치다. 같은 시기 OpenAI의 2분기 성장률이 이보다 둔화했다는 보도와 대조를 이룬다. 상장 직전(10월 IPO 예정) 공개되는 마지막 비공식 성과다.</p><h3>10년 논제와의 연결</h3><p>이 수치는 논제 원장의 핵심 가설 1번 \"엔터프라이즈 통행료는 실재한다\"를 구체적으로 입증하는 첫 번째 공개 마일스톤이다. 원장이 제시한 반증 조건은 \"점유율이 30% 아래로 꺾이며 가격 경쟁이 마진을 잠식할 때\"인데, 현재는 정반대 방향으로 움직이고 있다: 기업 LLM 지출 시장점유 40% 유지, $1M+ 고객 1,000곳 달성(반년 새 2배), 포춘10 중 8곳 확보라는 집중도 지표들이 함께 흐르고 있기 때문이다. 이는 단순한 스케일이 아니라 가격 책정력의 증거다. OpenAI와의 성장률 대비를 통해 시장이 이미 두 플레이어를 구분하고 있음을 암시한다 — Claude는 \"더 비싼 쪽\"으로 선택되고 있다는 뜻이다.</p><h3>논제 판정</h3><p><strong>강화.</strong> ARR 성장 가속(3개월 $18B 증가)과 시점 통제(IPO 직전 이 수치를 공개한 것)는 엔터프라이즈 프리미엄 가설이 단순 추측이 아니라 검증된 현상임을 시장에 신호한다. 경쟁사 대비 성장 둔화 보도는 해자의 구조적 차이가 실행되고 있다는 추가 증거로 작동한다.</p><h3>무엇이 틀릴 수 있나</h3><p>ARR은 모수가 크지만 실현 확률이 아직 투명하지 않다. 고객당 순 팽창율(NRR), 고객 이탈률, 장기 계약 잠금 비율 같은 엔터프라이즈 SaaS의 기본 체질을 아직 공개하지 않았다. 또한 $65B는 \"연간경상 기준\"으로, 실제 현금 수취 일정과 환율·지정학 위험 등 무시할 수 없는 변수들이 남아 있다. 클라우드 파트너(AWS·Google·Azure)의 협상력 변화나, 규제 리스크(수출통제, EU AI Act 준수 비용)가 마진에 미치는 영향도 여전히 검증 대상이다. 마지막으로, 프론티어 모델 경쟁이 격화되면서 지금의 기술 우위가 12~18개월 뒤에도 가격 프리미엄을 정당화할 만큼 지속될지는 별개의 질문이다.</p><h3>다음 관측 포인트</h3><ul><li>10월 IPO 공개 이후 첫 공식 분기 결과(2026 3Q)에서 ARR, NRR, 고객 유지율 공시 — 통행료 구조가 재무제표로 검증되는 순간</li><li>10월 중순 S-1 수정본 제출 시 마진율 공시 및 장기 고객 계약의 잠금 기간 공개 — $65B가 얼마나 \"고착\"되어 있는지 판별</li><li>2026년 4분기~2027년 1분기 경쟁 모델 출시(Gemini 4·GPT-5 후속 등)와 동시 고객 이동 모니터링 — 프리미엄이 모델 주기에 따라 흔들리는지 확인</li></ul><div class=\"col-chart\"><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"700\" height=\"216\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"18\" font-weight=\"800\">Anthropic ARR 궤적</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12\" font-weight=\"600\">5월 → 7월말, 분기 성장</text><line x1=\"210\" y1=\"76\" x2=\"210\" y2=\"170\" stroke=\"#3a4568\"/><text x=\"26\" y=\"105.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">2026년 5월</text><rect x=\"216\" y=\"90.0\" width=\"261.8\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"486.8\" y=\"106.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">47B</text><text x=\"26\" y=\"151.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">2026년 7월말</text><rect x=\"216\" y=\"136.0\" width=\"362.0\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"587.0\" y=\"152.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">65B</text><text x=\"26\" y=\"202\" fill=\"#5a648a\" font-size=\"10\">자료: 원문 기사에서 추출 (자동)</text><text x=\"674\" y=\"202\" text-anchor=\"end\" fill=\"#9c7a3a\" font-size=\"11.5\" font-weight=\"800\">UNIVERTRIX · univertrix.com</text></svg></div><div class=\"ce-tail\"><h3>출처</h3><ul class='ce-src'><li><a href=\"https://www.reuters.com/technology/anthropic-revenue-run-rate-tops-65-billion-source-says-2026-08-17/\" target=\"_blank\" rel=\"noopener\">https://www.reuters.com/technology/anthropic-revenue-run-rate-tops-65-billion-source-says-</a><span class='ce-src-note'> (제목·요약 기반)</span></li><li><a href=\"https://www.wsj.com/tech/ai/openais-second-quarter-sales-show-tepid-growth-compared-with-anthropic-5cb42998\" target=\"_blank\" rel=\"noopener\">https://www.wsj.com/tech/ai/openais-second-quarter-sales-show-tepid-growth-compared-with-a</a><span class='ce-src-note'> (제목·요약 기반)</span></li></ul><p class='ce-coi'>이해관계 고지: 이 사이트의 자동 분석은 Anthropic 의 모델로 작성됩니다. Anthropic 에세이는 공식 발표와 제3자 보도만을 근거로 쓰며, 칭찬과 비판에 같은 증거 기준을 적용합니다.</p><p class='ce-disc'>본 동행 관측은 정보 제공 목적의 기록이며 특정 종목의 매수·매도 권유가 아닙니다. 판단과 손익은 독자 본인에게 귀속됩니다.</p></div>", "sources": [{"url": "https://www.reuters.com/technology/anthropic-revenue-run-rate-tops-65-billion-source-says-2026-08-17/", "full": false, "attempted": false}, {"url": "https://www.wsj.com/tech/ai/openais-second-quarter-sales-show-tepid-growth-compared-with-anthropic-5cb42998", "full": false, "attempted": false}], "origin": "auto", "slug": "anthropic-d89c096f"}, {"company": "alphabet", "date": "2026-08-24", "title": "재투자의 증명 — $205B 캐펙스가 $514B 수주로 돌아오다", "verdict": "강화", "html": "<h3>무슨 일이 있었나</h3><p>Sundar Pichai는 2026 2분기 실적 발표와 동시에 연간 캐펙스 가이던스를 $175~185B에서 $205B로 상향 조정했다. 같은 시점 Google Cloud 수주잔고가 $514B에 도달했고, 성장률은 +82%를 기록했다. 이는 전년 동기(가이던스 기준 증분 캐펙스) 대비 약 30B 상향이며, 동시에 클라우드 부문이 전체 캐펙스 증액분의 주요 수익 채널이 되고 있음을 시사한다.</p><h3>10년 논제와의 연결</h3><p>논제 원장의 핵심 가설 3번 — \"캐펙스는 공포가 아니라 씨즈급 재투자다\"의 가장 중요한 검증 지점이 지금이다. 버핏의 \"10년 쿠폰\" 프레임에서 이 캐펙스 증액이 단순 비용이 아니라 자본수익률 재투자인지를 판단할 구체적 수치가 나왔기 때문이다.</p><p>$205B 캐펙스가 정당화되려면, 그 증분(약 $30B)이 수익 창출 자산으로 얼마나 빠르게 전환되는가가 핵심이다. 현재 관찰되는 신호는 긍정적이다: (1) 클라우드 매출 +82% 성장 속에서 수주잔고가 $514B로 확대 → 이는 배분 파이프라인이 생성 속도보다 빠르다는 뜻. (2) 외부 TPU 판매 개시(매출 인식 시작) + 토큰 처리 속도 22B/분(1분기 만에 +37%) → 공급 제약이 원재료 가격을 지탱하는 구조. (3) 캐펙스 증액 타이밍이 클라우드 수주 급증과 일치 → \"공포\"가 아니라 \"제약 해제 재투자\"로 해석된다.</p><p>만약 이 시나리오가 2~3년 지속되면(수주를 매출로 전환하는 주기), 캐펙스의 ROIC는 버크셔 기준선(정당 멀티플 기준)을 정당화할 수 있다. 지금은 그 확신을 쌓는 시기다.</p><h3>논제 판정</h3><p><strong>[강화]</strong> 캐펙스 상향이 가이던스 인상이 아닌 \"제약 해제 신호\"로 작동하고 있으며, 클라우드 수주잔고 급증이 실시간 수익화 파이프라인 존재를 증명했기 때문. 다만 강화의 폭은 중간 정도 — 아직 실제 매출 전환 속도와 마진 개선이 공개되지 않았으므로.</p><h3>무엇이 틀릴 수 있나</h3><p>반대 해석: 캐펙스 상향은 \"공포 신호\"일 수 있다. 즉, 클라우드 수주잔고는 늘어나도 실제 전환율(backlog-to-revenue ratio)이 악화하고 있고, TPU 외부 수요는 자사 소비 대비 미미한 수준으로 머물러 있을 가능성이다. 그렇다면 $205B 캐펙스는 과도한 공급 비축(oversupply)을 의미하며, 향후 마진 압박과 ROIC 하락으로 이어질 수 있다. 또한 규제(반독점 구제안)가 Google Cloud 판매 채널을 제한하면 수주 전환 속도가 크게 둔화할 위험이 존재한다.</p><h3>다음 관측 포인트</h3><ul><li><strong>3Q 실적 (10월 말): </strong>클라우드 성장률 유지 여부, 수주잔고 전환율(잔고 대비 신규 매출 증분), TPU 외부 매출 구체적 규모. 현재는 \"기계적 증가\"일 가능성을 배제할 수 없다.</li><li><strong>Gemini 4 공개 및 통합 타이밍: </strong>검색 해자 침식 우려와 클라우드 선택 유도 메커니즘이 동시에 작동하는지 확인. \"의도에 대한 통행료\" → \"AI 완성도에 대한 통행료\"의 전환이 실제인지.</li><li><strong>반독점 구제안 판결 (Q4 예상): </strong>\"검증 가능한 공포\"의 스트레스 테스트. 만약 Google Cloud 배분 제약이 정해지면, 수주 전환율 가정을 대폭 하향 조정해야 한다.</li></ul><div class=\"col-chart\"><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"700\" height=\"216\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"18\" font-weight=\"800\">Google Cloud 성장 모멘텀</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12\" font-weight=\"600\">수주잔고(Backlog)와 전년비 매출 성장률</text><line x1=\"210\" y1=\"76\" x2=\"210\" y2=\"170\" stroke=\"#3a4568\"/><text x=\"26\" y=\"105.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">수주잔고 $514B</text><rect x=\"216\" y=\"90.0\" width=\"362.0\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"587.0\" y=\"106.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">514B / %</text><text x=\"26\" y=\"151.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">매출 성장률 +82%</text><rect x=\"216\" y=\"136.0\" width=\"57.8\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"282.8\" y=\"152.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">82B / %</text><text x=\"26\" y=\"202\" fill=\"#5a648a\" font-size=\"10\">자료: 원문 기사에서 추출 (자동)</text><text x=\"674\" y=\"202\" text-anchor=\"end\" fill=\"#9c7a3a\" font-size=\"11.5\" font-weight=\"800\">UNIVERTRIX · univertrix.com</text></svg></div><div class=\"col-chart\"><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"700\" height=\"216\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"18\" font-weight=\"800\">Alphabet 캐펙스 가이던스 상향</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12\" font-weight=\"600\">기존 가이던스 vs 2026년 신규 가이던스</text><line x1=\"210\" y1=\"76\" x2=\"210\" y2=\"170\" stroke=\"#3a4568\"/><text x=\"26\" y=\"105.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">기존 상단선 $185B</text><rect x=\"216\" y=\"90.0\" width=\"326.7\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"551.7\" y=\"106.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">185B</text><text x=\"26\" y=\"151.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">신규 가이던스 $205B</text><rect x=\"216\" y=\"136.0\" width=\"362.0\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"587.0\" y=\"152.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">205B</text><text x=\"26\" y=\"202\" fill=\"#5a648a\" font-size=\"10\">자료: 원문 기사에서 추출 (자동)</text><text x=\"674\" y=\"202\" text-anchor=\"end\" fill=\"#9c7a3a\" font-size=\"11.5\" font-weight=\"800\">UNIVERTRIX · univertrix.com</text></svg></div><div class=\"ce-tail\"><h3>출처</h3><ul class='ce-src'><li><a href=\"https://www.fool.com/investing/2026/08/16/sundar-pichai-raised-alphabets-capex-guidance-to-2/\" target=\"_blank\" rel=\"noopener\">https://www.fool.com/investing/2026/08/16/sundar-pichai-raised-alphabets-capex-guidance-to</a></li></ul><p class='ce-disc'>본 동행 관측은 정보 제공 목적의 기록이며 특정 종목의 매수·매도 권유가 아닙니다. 판단과 손익은 독자 본인에게 귀속됩니다.</p></div>", "sources": [{"url": "https://www.fool.com/investing/2026/08/16/sundar-pichai-raised-alphabets-capex-guidance-to-2/", "full": true, "attempted": true}], "origin": "auto", "slug": "alphabet-83aa9851"}, {"company": "alphabet", "date": "2026-08-23", "title": "5.9B의 침묵 — 캐펙스 공포가 현금 이야기가 되는 순간", "verdict": "강화", "html": "<h3>무슨 일이 있었나</h3><p>Alphabet은 Q2 2026에서 역사상 처음으로 분기 현금 유출 $5.9B를 기록했다. 동시에 2026년 전체 캐펙스 가이던스를 $15B 상향하여 $175~185B 범위로 재설정했다(연간 매출 대비 약 19~20%). 이는 7월 23일 Reuters 보도 이후 시장에 'AI 인프라'가 더 이상 성장 스토리가 아니라 현금흐름 관리 이슈로 인식되는 전환점을 만들었다.</p><h3>10년 논제와의 연결</h3><p>논제 원장의 핵심 가설 3('캐펙스는 공포가 아니라 씨즈급 재투자')은 이 숫자 하나에 가장 심하게 시험받고 있다. 원장은 명시했다: \"증분 자본이 증분 통행료로 돌아오는지가 이 논제의 심장\"이고, 반증 조건은 \"클라우드 마진 개선 정체 + ROIC 하락 추세 2년 지속\"이다. 현재 상황은 그 중간 지점이다.</p><p>현금유출 자체는 아직 반증이 아니다. Alphabet의 영업현금흐름(Operating CF)은 여전히 Q2에 $26.4B(전년 동기 $24.1B, +9.5%)이므로, 유출은 '캐펙스 투자 속도'가 현금 생성을 앞서간다는 뜻일 뿐이다. 버크셔가 $36.6B을 3단 매수한 논리가 정확히 이것이다: 현금을 쓰는 회사가 현금을 생성하는 회사보다 위험하지 않다면, 그 차이가 곧 '기회'다.</p><p>그러나 $15B 상향은 신호다. 이는 CFO가 초기 가이던스($160~170B로 추정)를 재평가했다는 뜻이며, 그 이유는 두 가지 중 하나다: (a) TPU/데이터센터 수요가 초기 예상을 크게 초과했거나, (b) 공급 제약이 생각보다 오래 지속될 것으로 예상되어 선제적 증설이 필요하거나. 어느 쪽이든 이는 두 번째 통행료(클라우드+TPU)의 규모가 실적에서 '정량화되기 시작했다'는 뜻이다.</p><h3>논제 판정</h3><p><strong>[강화]</strong> 현금유출은 자본효율 우려의 신호이지만, 동시에 TPU 외부 수요(두 번째 통행료)의 규모가 충분히 크다는 것을 간접 증명한다. 원장이 경고한 '반증 조건'(마진 개선 정체, ROIC 하락)은 아직 나타나지 않았으며, 오히려 클라우드 성장률 +82%와 수주잔고 $514B는 투자의 선행성을 뒷받침한다.</p><h3>무엇이 틀릴 수 있나</h3><p>현금유출이 구조적 신호일 수도 있다. 만약 클라우드의 마진 개선이 3Q~4Q에도 정체되고, 1년 뒤 ROIC(자본이익률)이 하락 추세로 돌아선다면, 이 캐펙스는 '씨즈급'이 아니라 '과잉투자'로 재평가될 것이다. 특히 생성형 AI의 실제 상용화 ROI가 기대치 아래로 내려올 경우, 이 $175~185B는 '낙관의 기록'이 될 수 있다. 또한 반독점 판결이나 규제 강화로 클라우드 외부 매출(예: TPU OEM 판매)이 제한될 경우, 투자의 회수 경로 자체가 차단될 수 있다.</p><h3>다음 관측 포인트</h3><ul><li><strong>3Q 실적 (10월 말)</strong>: 클라우드 마진(Google Cloud 영업이익률) 추이, TPU 외부 판매 매출 공개 여부 또는 수치 단서, 영업현금흐름 대비 캐펙스 비율이 $5.9B 유출 수준으로 지속되는가.</li><li><strong>4Q 2026 가이던스 (10월 말)</strong>: 2027년 캐펙스 가이던스 유지·축소·추가 증액 여부 — 이것이 '공포가 정당화되는가'의 최종 신호.</li><li><strong>버크셔 추가 매수 또는 매도 (분기 보고서 기준, 9월·12월)</strong>: 현금유출이 지속되는 상황에서 버핏의 다음 움직임이 곧 '기관 투자자의 확신 갱신 여부'를 나타낼 것.</li></ul><div class=\"col-chart\"><svg viewBox=\"0 0 700 262\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"700\" height=\"262\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"18\" font-weight=\"800\">Alphabet 현금흐름 구조 변화</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12\" font-weight=\"600\">Q2 2026: 영업현금흐름 vs 자본지출 (B)</text><line x1=\"210\" y1=\"76\" x2=\"210\" y2=\"216\" stroke=\"#3a4568\"/><text x=\"26\" y=\"105.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">Operating Cash Flow</text><rect x=\"216\" y=\"90.0\" width=\"295.9\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"520.9\" y=\"106.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">26.4B</text><text x=\"26\" y=\"151.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">Capital Expenditure (추정)</text><rect x=\"216\" y=\"136.0\" width=\"362.0\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"587.0\" y=\"152.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">32.3B</text><text x=\"26\" y=\"197.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">Free Cash Flow (추정)</text><rect x=\"216\" y=\"182.0\" width=\"66.1\" height=\"22\" rx=\"6\" fill=\"#5b8def\"/><text x=\"291.1\" y=\"198.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">-5.9B</text><text x=\"26\" y=\"248\" fill=\"#5a648a\" font-size=\"10\">자료: 원문 기사에서 추출 (자동)</text><text x=\"674\" y=\"248\" text-anchor=\"end\" fill=\"#9c7a3a\" font-size=\"11.5\" font-weight=\"800\">UNIVERTRIX · univertrix.com</text></svg></div><div class=\"col-chart\"><svg viewBox=\"0 0 700 262\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"700\" height=\"262\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"18\" font-weight=\"800\">2026 캐펙스 가이던스 재상향</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12\" font-weight=\"600\">초기 vs 재상향 (B)</text><line x1=\"210\" y1=\"76\" x2=\"210\" y2=\"216\" stroke=\"#3a4568\"/><text x=\"26\" y=\"105.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">초기 가이던스 (중값)</text><rect x=\"216\" y=\"90.0\" width=\"331.8\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"556.8\" y=\"106.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">165B</text><text x=\"26\" y=\"151.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">재상향 가이던스 (중값)</text><rect x=\"216\" y=\"136.0\" width=\"362.0\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"587.0\" y=\"152.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">180B</text><text x=\"26\" y=\"197.0\" fill=\"#e6ebfa\" font-size=\"12.5\" font-weight=\"700\">상향폭</text><rect x=\"216\" y=\"182.0\" width=\"30.2\" height=\"22\" rx=\"6\" fill=\"#f2ba3c\"/><text x=\"255.2\" y=\"198.0\" fill=\"#ffffff\" font-size=\"14\" font-weight=\"800\">15B</text><text x=\"26\" y=\"248\" fill=\"#5a648a\" font-size=\"10\">자료: 원문 기사에서 추출 (자동)</text><text x=\"674\" y=\"248\" text-anchor=\"end\" fill=\"#9c7a3a\" font-size=\"11.5\" font-weight=\"800\">UNIVERTRIX · univertrix.com</text></svg></div><div class=\"ce-tail\"><h3>출처</h3><ul class='ce-src'><li><a href=\"https://www.marketscale.com/industries/software-and-technology/alphabets-59b-q2-cash-burn-is-turning-ai-infrastructure-into-a-cfo-led-capex-fight-in-2026\" target=\"_blank\" rel=\"noopener\">https://www.marketscale.com/industries/software-and-technology/alphabets-59b-q2-cash-burn-</a></li><li><a href=\"https://ncdoj.gov/some-north-carolinians-to-receive-payments-as-part-of-700-million-settlement-in-google-play-store-antitrust-lawsuit/\" target=\"_blank\" rel=\"noopener\">https://ncdoj.gov/some-north-carolinians-to-receive-payments-as-part-of-700-million-settle</a></li></ul><p class='ce-disc'>본 동행 관측은 정보 제공 목적의 기록이며 특정 종목의 매수·매도 권유가 아닙니다. 판단과 손익은 독자 본인에게 귀속됩니다.</p></div>", "sources": [{"url": "https://www.marketscale.com/industries/software-and-technology/alphabets-59b-q2-cash-burn-is-turning-ai-infrastructure-into-a-cfo-led-capex-fight-in-2026", "full": true, "attempted": true}, {"url": "https://ncdoj.gov/some-north-carolinians-to-receive-payments-as-part-of-700-million-settlement-in-google-play-store-antitrust-lawsuit/", "full": true, "attempted": true}], "origin": "auto", "slug": "alphabet-0ea8ae9f"}, {"company": "spacex", "date": "2026-08-23", "title": "정부가 궤도를 건설 허가했다 — 트럼프 우주 수송 정책과 Starship의 경제학", "verdict": "강화", "html": "<h3>무슨 일이 있었나</h3><p>도널드 트럼프 미국 대통령은 8월 20일 '국가 우주 수송 정책' 메모에 서명했다. 미국 정부는 2030년까지 상업 우주발사·재진입을 연간 1000회 수준으로 확대하겠다는 목표를 공식화했다. 신규 재진입장 후보지 식별(90일 이내), 개발계획 수립(240일 이내)이 연방 부처에 지시되었으며, 민간 우주수송 활동을 배제하거나 저해하는 정부 차원의 경쟁을 금지했다. 발사장 인프라 건설 공간 확보, 무선주파수 대역 확보, 인허가·환경 검토 신속화가 포함되었다.</p><p>배경: 지난해 미국 상업 우주발사 178회 중 170회를 SpaceX가 담당했으며, 이는 Falcon 9 165회, Starship 5회로 구성되었다. FAA 수장 브라이언 베드포드는 5월 Gwynne Shotwell SpaceX 사장으로부터 5년 내 연간 1만 회 발사 목표를 청취했다고 밝혔다.</p><h3>10년 논제와의 연결</h3><p>이 정책은 SpaceX 10년 논제의 핵심 가설 2번 「Starship이 단위 경제를 다시 한 번 부순다」의 거시 환경 조건을 근본적으로 강화한다. 논제는 Falcon이 발사 비용을 10분의 1로 내렸듯이, Starship이 현재 기술-경제학의 임계치를 재설정할 것이라 추정한다. 하지만 그 가설의 입증에는 단순한 로켓 성능을 넘어, 운영 환경의 구조 변화가 필수다.</p><p>정부 정책이 명시적으로 규정한 2030년 연 1000회 발사 목표는 ① 인허가 병목을 제거하고 ② 인프라 투자(재진입장 건설)를 공식 책임으로 전환하고 ③ 정부 경쟁을 배제함으로써, SpaceX가 순수 로켓 성능만이 아니라 정부-민간 협력 구조 안에서 발사 빈도를 확대할 조건을 제도적으로 보장한다. 이는 단순한 '지지' 신호를 넘어, Starship 위성 배치(현재 논제에서 V2 위성이 11,000기 배치 이후 단계), 달·화성 물류(정책에서 명시한 아르테미스 상업 수송, 화성 로봇 탐사 지원) 등 상위 사업의 경제성 가정을 1년 단위로 당겨준다.</p><p>2025년 논제 원장에서 「반증 조건: 상용 페이로드 정기 운항이 2028년까지도 미달성」이라 기록했는데, 이 정책은 그 기한을 규제 차원에서 가속할 명시적 인센티브를 제공한 것이다. 논제의 쿠폰 칸 — \"10년 뒤 Starship의 궤도 로그가 기록되는가\" — 의 검증 기한과 정부 정책 목표가 2028~2030년에서 수렴한다.</p><h3>논제 판정</h3><p><strong>[강화]</strong> 규제·인프라 토대가 확실해져 Starship 단위경제 가설의 반증 조건(상용 운항 미달성)이 정부 정책과 충돌하게 되었다. 2030년 1000회 발사 목표는 그 중 대다수가 SpaceX(현재 시장점유율 ~95%)여야 수학적으로 성립하므로, 미달성은 단순 기술 실패를 넘어 정부 정책 후퇴 선언이 되는 명분적 부담을 부여했다.</p><h3>무엇이 틀릴 수 있나</h3><p>이 정책 메모는 법적 구속력이 아닌 행정 지시(memo)다. 실제 예산 배정, 환경 규제 승인(특히 텍사스 재진입장, 동부 해상 발사장), 연방-주(state) 협의에서 지연이 2년 이상 누적될 가능성이 있다. 또한 '연 1000회' 목표는 소형 재사용 로켓(Virgin Orbit 같은 수평 발사), 중국 상업 우주사 진출 등 경쟁자 성장을 암묵적으로 무시한다. SpaceX가 목표의 절반만 달성해도 정부는 '성공'이라 선언할 유인이 있고, 이 경우 실제 Starship 활용률과는 괴리가 생길 수 있다. 마지막으로 화성·달 수송은 여전히 상용성이 입증되지 않았으며, 정책이 진술한 '상업 방안 검토'는 자금 투입이 아니라 검토일 뿐이다.</p><h3>다음 관측 포인트</h3><ul><li><strong>Starship V3 설계 공개 및 상용 페이로드 계약</strong> (2026년 Q4 예상) — 정부 정책이 발표된 직후 SpaceX가 구체적 상용 일정(Starlink V3 위성, 외부 고객 화물)을 공시하는지 추적. 정책이 실제로 내부 로드맵에 반영되었는가의 신호.</li><li><strong>재진입장 후보지 지정 및 인프라 투자 발표</strong> (2026년 11월 20일까지 — 90일 기한 만료) — FAA와 연방정부가 구체적 장소와 예산(2027년 예산안)을 공개하는지. 정책이 구속력을 갖는가의 분기점.</li><li><strong>2026년 3Q·4Q 실적에서 Starship 발사 회수 및 비용 공개</strong> (11월·2월) — 현재 '발사 5회' 기록이 2026년 말까지 월평균 3회 이상으로 가속하는지 여부. 정책이 기술 개발 속도에 영향을 미치고 있는지의 물증.</li></ul><div class=\"ce-tail\"><h3>출처</h3><ul class='ce-src'><li><a href=\"https://www.hellot.net/news/article.html?no=114491\" target=\"_blank\" rel=\"noopener\">https://www.hellot.net/news/article.html?no=114491</a></li><li>https://www.reuters.com (White House National Space Transportation Policy memo, 2026.08.20 — 한국 보도 기반 추적)<span class='ce-src-note'> (링크 불가 — 주소 형식 아님)</span></li></ul><p class='ce-disc'>본 동행 관측은 정보 제공 목적의 기록이며 특정 종목의 매수·매도 권유가 아닙니다. 판단과 손익은 독자 본인에게 귀속됩니다.</p></div>", "sources": [{"url": "https://www.hellot.net/news/article.html?no=114491", "full": true, "attempted": true}, {"url": "https://www.reuters.com (White House National Space Transportation Policy memo, 2026.08.20 — 한국 보도 기반 추적)", "full": true, "attempted": true}], "origin": "소재", "slug": "spacex-99a259ab"}, {"company": "anthropic", "date": "2026-08-22", "title": "Claude의 단백질 설계 능력, 새로운 엔터프라이즈 수직시장 증거", "verdict": "강화", "html": "<h3>무슨 일이 있었나</h3><p>Anthropic은 8월 18일 Claude(Mythos Preview·Opus 4.8)의 생명과학 능력을 공개했다. 단백질 바인더 설계에서 15개 타겟 중 14개 성공, 개별 설계의 22~35%가 바인딩에 성공했다(산업 표준 10~15% 대비). 별도로 Opus 5는 NMR·LC-MS 분석 데이터를 19~23분 내 완성했으며, 계약 연구소의 결과와 96.4% vs 96.33% 수준으로 일치했다.</p><h3>10년 논제와의 연결</h3><p>이번 공개는 논제 핵심①의 범위를 확장하는 신호다. 기존 가설은 \"엔터프라이즈 통행료\"를 기업 IT·소프트웨어 부문으로 한정했으나, 생명과학·신약 개발은 단가 매우 높은 새로운 수직시장이다. 단백질 설계는 \"역사적으로 전문가가 주당 몇 주~몇 달 소요\"하던 작업으로, 지금까지 AI의 미지 영역이었다. 성공률 2배 이상 달성은 \"안전하게 만든 지능이 가장 비싸게 팔린다\"는 명제가 단순 코드 자동화를 넘어 R&D 가속 자체로 통행료화할 수 있다는 실물 증거다. 이는 $1M+ 고객 확대의 새로운 진입점이면서, 동시에 제약사·바이오테크의 에디션에 특화된 가격책정 모델을 정당화할 근거를 제공한다.</p><h3>논제 판정</h3><p><strong>강화</strong> — 엔터프라이즈 통행료의 수직 범위가 소프트웨어 부문을 넘어 실험과학 R&D로 확장될 수 있음을 보여줬다. 단백질 설계 성공률이 산업 표준의 2배 이상이라는 수치는 의약학적 실질 가치(time-to-market 단축, 실패율 감소)를 객관화하는 첫 단서다.</p><h3>무엇이 틀릴 수 있나</h3><p>이번 발표는 Anthropic의 공식 블로그 게재이며, 외부 피어리뷰·재현 없이 사내 자료만 포함된다. 단백질 설계의 14/15 성공은 선별된 타겟일 수 있으며, 22~35% 바인딩 성공률도 \"비교 그룹\"의 정의(어느 실험실의 표준? 언제 측정?)가 명확하지 않다. 또한 생명과학이 검증(동물실험, 임상시험)에 걸리는 시간이 매우 길어, 단기간에 Claude의 \"실용적 영향\"을 판단하기 어렵다. 경쟁사(OpenAI, Google)도 같은 길을 걷고 있으며, 생명과학 AI 시장 자체가 아직 초기 단계라 단가 경쟁이 발생할 가능성도 존재한다.</p><h3>다음 관측 포인트</h3><ul><li>3Q 2026 ARR 추이 — 생명과학 부문이 별도 코호트로 추적되는가, 성장률이 가속되는가</li><li>제약·바이오테크 고객 수 공시 — 현재 \"Fortune 10 중 8곳\" 클레임 이후 명시적 산업별 고객 수 발표</li><li>Mythos/Opus 계열 생명과학 에디션의 가격책정 발표 (2026년 9월~10월) — 통행료 프리미엄이 구체화되는 시점</li></ul><div class=\"ce-tail\"><h3>출처</h3><ul class='ce-src'><li><a href=\"https://www.anthropic.com/research/Claude-accelerates-protein-design\" target=\"_blank\" rel=\"noopener\">https://www.anthropic.com/research/Claude-accelerates-protein-design</a></li><li><a href=\"https://www-cdn.anthropic.com/30bf50e22a01388bb29bf077ee3f244531594b7a.pdf\" target=\"_blank\" rel=\"noopener\">https://www-cdn.anthropic.com/30bf50e22a01388bb29bf077ee3f244531594b7a.pdf</a></li></ul><p class='ce-coi'>이해관계 고지: 이 사이트의 자동 분석은 Anthropic 의 모델로 작성됩니다. Anthropic 에세이는 공식 발표와 제3자 보도만을 근거로 쓰며, 칭찬과 비판에 같은 증거 기준을 적용합니다.</p><p class='ce-disc'>본 동행 관측은 정보 제공 목적의 기록이며 특정 종목의 매수·매도 권유가 아닙니다. 판단과 손익은 독자 본인에게 귀속됩니다.</p></div>", "sources": [{"url": "https://www.anthropic.com/research/Claude-accelerates-protein-design", "full": true, "attempted": true}, {"url": "https://www-cdn.anthropic.com/30bf50e22a01388bb29bf077ee3f244531594b7a.pdf", "full": true, "attempted": true}], "origin": "auto", "slug": "anthropic-bfa29070"}]};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let app, auth, db, me = null, cfg = null;

};
const isAdmin = () => me && cfg && cfg.adminUid && me.uid === cfg.adminUid;

   탭: 한줄 노트 · 기업 3사. 해시 딥링크는 확립된 패턴을 따른다 —
