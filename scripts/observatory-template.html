    '<b>통과</b>, 1.5~3배면 <b>성장 입증 필요</b>(지금 값으론 모자라니 성장이 실제로 와야 한다), ' +
    '1.5배 미만이면 <b>국채 열위</b> — 위험을 지고도 국채만 못하다는 뜻. 아직 취재가 안 끝나 ' +
    '계산 자체를 못 한 건물은 <b>미검정</b>이다. 미검정은 나쁨이 아니라 백지다.</dd>' +
  '<dt>PIK</dt><dd>월세를 현금이 아니라 차용증으로 받는 것. 장부에는 이익이 찍히는데 그 돈이 ' +
    '주주에게 오기 전에 다시 공사판으로 들어간다면, 건물주가 손에 쥔 것은 종이뿐이다. ' +
    '전환율(주주 손에 남은 몫 ÷ 장부 이익)이 음수인 건물에 이 배지가 붙는다.</dd>' +
  '<dt>too hard</dt><dd>10년 뒤 월세 칸이 백지인 건물. 나쁜 건물이라서가 아니라 아무도 그 칸을 ' +
    '자신 있게 못 적는 것 — 버핏은 그 경우 모든 투입은 투기라고 했다. 이 배지는 기계가 매기지 않는다. ' +
    '판단층에서 사람이 "사업 확실성 ✕"라고 적은 건물에만 붙는다.</dd>' +
  '<dt>통과 가격</dt><dd>버핏존이 열리는 주가. 1997년 주주서한의 셈법이다 — ' +
    '앞으로 주식을 <b>살</b> 사람에게 가격 하락은 손실이 아니라 세일이다. ' +
    '햄버거를 평생 사 먹을 사람이 소고기값 하락을 반길지 아쉬워할지 생각해 보라는 그 말. ' +
    '그래서 이 칸은 예측이 아니라 <b>내가 기다리는 가격표를 미리 적어 두는 자리</b>다. ' +
    '지금 눈금(g 가정) 위의 산술이므로 가정이 바뀌면 이 가격도 바뀐다.</dd>' +
  '</dl></details>';

/* 비고 — 측정층의 note 문자열을 **그대로 뿌리지 않는다.**
   그 문장은 운영자·CI 로그를 위한 것이라 기계 필드명이 들어 있다.
   여기서는 그 문자열을 번역하는 게 아니라 **상태에서 다시 만든다**: 문자열을 매핑하면
   측정층이 새 사유를 추가하는 날 그 문장이 그대로 화면으로 새어 나온다.
   상태에서 만들면 모르는 상태는 빈 칸이 될지언정 내부 용어가 나갈 길이 없다. */
/* "자동" 라벨 — 그 칸을 기계가 채웠을 때만. 사람 값에는 아무 표식도 붙이지 않는다
   (표식이 없는 것이 사람이 적었다는 뜻이다). 자동값에 사람의 권위를 씌우지 않는 것이
   이 라벨의 존재 이유다 — 공시 추출·AI 판정은 틀릴 수 있고, 화면이 그 사실을 말해야 한다. */
const LG_WEAK_TIP = '전망치만으로 세운 가정입니다 — 과거 실적 성장률로 교차 검증되지 ' +
  '않았습니다. 숫자는 나왔지만 그 숫자를 받쳐주는 실적 이력이 없다는 뜻입니다.';
const LG_AUTO_TIP = '기계가 채운 값 — 공시(SEC XBRL) 추출 또는 AI 취재입니다. ' +
  '사람이 취재해 덮어쓰면 이 표식이 사라집니다.';
function lgAuto(j, field){
  return ((j.origin || {})[field] === 'auto')
    ? '<span class="lg-auto" title="' + esc(LG_AUTO_TIP) + '">자동</span>' : '';
}

/* method 요약 — 어떤 자로 쟀는지 한 마디로. 원문 method 는 길고 태그명이 들어 있어
   그대로 쓰지 않는다(기계 필드명 화면 노출 금지 — 작업 규칙 8). */
function lgMethodKo(m){
  if (!m) return '';
  if (m.indexOf('SEC XBRL') === 0) return 'SEC XBRL 조정';
  if (m.indexOf('GAAP 미조정') === 0) return 'GAAP 미조정';
  return '';
}

function lgNote(b, j){
  if (j.guard || b.guard) return '정점 이익 함정 — 10년 쿠폰을 재지 않는 유형';
  if (b.coupon10y != null) {                      // 취재가 끝나 값이 산출된 상태
    const parts = [j.as_of, j.period].filter(Boolean);
    const how = lgMethodKo(j.method);
    if (how) parts.push(how);
    return parts.length ? '기준 ' + parts.join(' · ') : '';
  }
  if (b.eps_adj_ttm == null) return '취재 대기 — 12개월 조정이익 미확보';
  if (b.g_used == null) return '취재 대기 — 성장률 가정 미확보';
  if (b.rate10y == null) return '해당 시장 국채 금리 미연결';
  return '';
}

/* 통과 가격 — "이 가격까지 내려오면 버핏존이 열린다".
   목표가가 아니라 지금 눈금(g 가정) 위의 산술이다. 1997 주주서한의 순매수자 관점:
   앞으로 살 사람에게 하락은 손실이 아니라 세일이다. 그 세일가를 미리 적어 두는 칸. */
function lgPassPrice(x, b){
  const pp = b.pass_price, cur = b.price;
  if (pp == null || cur == null || cur <= 0) return '<span class="lg-neg">—</span>';
  const cy = (x.currency === 'USD' || !x.currency) ? '$' : '';
  const tail = cy ? '' : ' ' + esc(x.currency || '');
  const money = cy + pp.toLocaleString(undefined, {maximumFractionDigits: 2}) + tail;
  const diff = (pp - cur) / cur;
  if (b.zone_buffett === 'pass') {
    return '<span class="lg-price lg-pos">이미 통과</span>' +
      '<div class="lg-gapto">여유 ' + (diff * 100).toFixed(0) + '%</div>';
  }
  return '<span class="lg-price">' + money + '</span>' +
    '<div class="lg-gapto">현재가 ' + (diff >= 0 ? '+' : '') +
    (diff * 100).toFixed(0) + '%</div>';
}

/* 계산 전개 — 결론만 보여주면 눈금을 못 되짚는다. 한 줄로 전 과정을 편다. */
function lgCalcLine(b){
  if (b.coupon10y == null || b.ey == null) return '';
  const bar = b.rate10y == null ? null : 3 * (b.rate10y / 100);
  return 'EY ' + lgPct(b.ey) + ' × (1+g ' + lgPct(b.g_used) + ')^10 = 쿠폰 ' +
    lgPct(b.coupon10y) + ' vs 허들 ' + lgPct(bar);
}

/* 필드별 출처 — 취재 우선순위가 한눈에 보이게. 사람 값은 '취재', 자동은 '자동',
   빈 칸은 '—'. 무엇을 취재하면 이 종목이 판정에 이르는지가 이 표에서 읽힌다. */
const LG_FIELD_KO = { eps_adj_ttm: '조정 EPS', roe_tangible: '유형 ROE',
                      g_forward: '전망 성장률', g_cagr3y: '3년 성장률',
                      conversion: '전환율', risk5: '리스크 5', franchise: '프랜차이즈',
                      capalloc: '자본배분', owner_earnings: '오너어닝' };
function lgOriginKo(v){ return v === 'human' ? '취재' : v === 'auto' ? '자동' : '—'; }

function lgDissect(x, j){
  const b = x.bench || {};
  const og = j.origin || {};
  const calc = lgCalcLine(b);
  let h = '<div class="lg-dissect">';
  if (calc) h += '<div class="lg-calc">' + esc(calc) + '</div>';
  // 계산이 안 서면 **왜 안 서는지**를 그 자리에서 말한다. 측정층이 상태에서 만든
  // 문구(bench.note)를 그대로 비춘다 — 여기서 사유를 다시 해석하면 규칙이 두 벌이 되고,
  // 새 결측 상태가 생기는 날 화면만 옛말을 한다(2026-09-05 '10년물 없음' 오표기).
  else h += '<div class="lg-calc">아직 계산이 서지 않습니다' +
    (b.note ? ' — ' + esc(b.note) : ' — 아래에서 빈 칸을 보세요') + '</div>';
  h += '<div class="lg-fields">';
  Object.keys(LG_FIELD_KO).forEach(f => {
    h += '<div class="lg-fk">' + LG_FIELD_KO[f] + '</div>' +
         '<div class="lg-fv">' + lgOriginKo(og[f]) + '</div>';
  });
  h += '</div>';
  const bits = [];
  if (j.method) bits.push('측정 ' + esc(lgMethodKo(j.method) || j.method));
  if (b.g_used != null) bits.push('성장률 ' + lgPct(b.g_used) +
    (b.g_capped_from != null ? ' (캡 전 ' + lgPct(b.g_capped_from) + ')' : ''));
  if (j.as_of) bits.push('기준 ' + esc(j.as_of));
  if (j.period) bits.push(esc(j.period));
  if (bits.length) h += '<div class="lg-sub" style="margin-top:10px">' +
    bits.join(' · ') + '</div>';
  return h + '</div>';
}

function lgRow(x, lg){
  const b = x.bench || {};
  const j = lg[x.ticker] || {};
  const zone = LG_ZONE_KO[b.zone_buffett] || '미검정';
  const roe = b.roe_minus_2x10y;
  const roeCls = roe == null ? '' : (roe >= 0 ? 'lg-pos' : 'lg-neg');

  // 쿠폰 칸 — g 가정을 반드시 병기한다. 가정을 감추면 숫자가 사실처럼 보인다.
  let coupon;
  if (j.guard || b.guard) {
    coupon = '<span class="lg-neg">—</span>' +
      '<span class="lg-badge" title="' + esc(LG_TIP.peak) + '">⚠ 정점 주의</span>';
  } else if (b.coupon10y == null) {
    coupon = '<span class="lg-neg">—</span>';
  } else {
    // g 표기 — 캡을 씌웠으면 **원값을 함께 적는다**(감춘 조정은 조정이 아니다)
    const gTxt = (b.g_capped_from != null)
      ? 'g ' + lgPct(b.g_used) + ' 캡(전망 ' + lgPct(b.g_capped_from) + ')'
      : 'g ' + lgPct(b.g_used) + ' 전망';
    coupon = lgPct(b.coupon10y) + lgAuto(j, 'eps_adj_ttm') +
      '<div class="lg-sub">' + gTxt + '</div>';
  }

  // 배지는 자동값으로도 붙되 "자동" 라벨을 동반한다 — 기계가 매긴 too hard 를
  // 사람이 매긴 것처럼 보이게 두면, 근거 없는 판정에 권위가 생긴다.
  const badges =
    ((j.conv != null && j.conv < 0)
      ? '<span class="lg-badge" title="' + esc(LG_TIP.pik) + '">PIK</span>' +
        lgAuto(j, 'conversion') : '') +
    ((j.cert === '✕')
      ? '<span class="lg-badge" title="' + esc(LG_TIP.hard) + '">too hard</span>' +
        lgAuto(j, 'risk5') : '');

  const open = (lgOpenRow === x.ticker);
  const detail = open
    ? '<tr class="lg-open"><td colspan="6">' + lgDissect(x, j) + '</td></tr>' : '';
  return '<tr class="lg-clickable" onclick="lgToggleRow(\'' + esc(x.ticker) + '\')">' +
    '<td><div class="px-tk">' + esc(x.ticker) + badges + '</div>' +
      '<div class="px-name">' + esc(x.name) + '</div></td>' +
    '<td class="px-num ' + roeCls + '">' + lgPp(roe) + lgAuto(j, 'roe_tangible') + '</td>' +
    '<td class="px-num">' + coupon + '</td>' +
    '<td class="px-num lg-c-conv">' + (j.conv == null ? '—' : lgPct(j.conv, 0)) +
      (j.conv == null ? '' : lgAuto(j, 'conversion')) + '</td>' +
    '<td class="px-num lg-c-price">' + lgPassPrice(x, b) + '</td>' +
    '<td><span class="lg-zonetag">' + zone + '</span>' +
      // 과거 실적으로 교차 검증되지 않은 가정 위의 판정 — 화면이 그렇게 말한다
      (b.g_weak ? '<span class="lg-auto" title="' + esc(LG_WEAK_TIP) + '">가정 약함</span>' : '') +
      (function(){ const n = lgNote(b, j);
        return n ? '<div class="lg-sub">' + esc(n) + '</div>' : ''; })() + '</td>' +
  '</tr>' + detail;
}

function renderLegend(){
  const b = (DATA.buffett) || {};
  const items = b.items || [];
  const host = document.getElementById('obsBody');
  if (!items.length) {
    host.innerHTML = '<div class="obs-note">레전드벤치마크 준비 중 — 첫 측정이 끝나면 이곳에 실립니다.</div>';
    return;
  }
  const lg = DATA.legend || {};
  const rates = b.rates || {};

  let html = '<div class="px-notice"><b>버핏존은 서한의 눈금을 오늘 시세에 대입한 산술 결과이며 ' +
    '투자 권유가 아닙니다.</b> 10년 원가쿠폰의 g는 <b>가정</b>입니다. 가정이 바뀌면 결론도 바뀝니다 — ' +
    '표의 모든 쿠폰 옆에 그 가정을 함께 적어 둔 이유입니다. ' +
    '<b>자동 취재 값은 공시·AI 추출에 기반하며 오류가 있을 수 있습니다</b> — ' +
    '\'자동\' 표식이 붙은 값이 그것입니다. ' +
    '<b>통과 가격은 현재 눈금(g 가정) 기준 산술이며 목표가가 아닙니다.</b> ' +
    '어떤 항목도 매수·매도 신호가 아닙니다.</div>';

  // 눈금 스트립 — 미배선 국채(KTB·JGB)는 null 이면 아예 적지 않는다.
  // 0 으로 채우면 '금리 0%' 라는 거짓말이 되고, 표기하면 있는 척이 된다.
  const parts = [];
  const bar = rates.UST10 == null ? null : rates.UST10 * 3;
  parts.push('<span class="r-k">' + LG_RATE_KO.UST10 + '</span> <span class="r-v">' +
    (rates.UST10 == null ? '—' : rates.UST10.toFixed(2) + '%') + '</span>');
  ['KTB10', 'JGB10'].forEach(k => {
    if (rates[k] != null) parts.push('<span class="r-k">' + (LG_RATE_KO[k] || k) + '</span> ' +
      '<span class="r-v">' + rates[k].toFixed(2) + '%</span>');
  });
  parts.push('<span class="r-k">국채×3 허들</span> <span class="r-bar">' +
    (bar == null ? '—' : bar.toFixed(1) + '%') + '</span>');
  html += '<div class="lg-rates">' + parts.join('<span class="r-sep">·</span>') + '</div>';

  html += '<div class="px-asof">판단층 기준일 ' + esc(b.asof || '—') +
    ' · 측정 ' + esc(b.generated_label || '—') + ' KST' +
    (rates.source ? ' · 10년물 ' + esc(rates.source) : '') +
    (rates.as_of ? ' (' + esc(rates.as_of) + ')' : '') + '</div>';

  // 존 요약 스트립 — 시차 관측과 같은 4칸. 칸을 누르면 보드가 그 판정만 남긴다.
  // 숨기는 장치가 아니라 **소음을 접는** 장치다: 합계는 언제나 전 종목이다.
  const tally = {};
  LG_ORDER.forEach(k => { tally[k] = 0; });
  items.forEach(x => {
    const z = ((x.bench || {}).zone_buffett) || 'untested';
    tally[z] = (tally[z] || 0) + 1;
  });
  html += '<div class="px-strip">' + LG_ORDER.map(k =>
    '<div class="px-zone lg-pick' + (lgFilter === k ? ' lg-on' : '') +
    '" onclick="lgSetFilter(\'' + k + '\')" role="button" tabindex="0">' +
    '<div class="z-name">' + LG_ZONE_KO[k] + '</div>' +
    '<div class="z-n">' + tally[k] + '<span style="font-size:12px;font-weight:700">종</span>' +
    '</div></div>').join('') + '</div>' +
    '<div class="px-stripnote">합계 ' + items.length + '종' +
    (lgFilter ? ' · <b>' + LG_ZONE_KO[lgFilter] + '</b>만 보는 중 — ' +
       '<a href="#legend" onclick="lgSetFilter(null);return false;">전체 보기</a>' : '') +
    '</div>';

  // 버크셔 관찰 카드 — 스트립 바로 아래. 고정 3줄이고 D-day 만 오늘 기준으로 센다.
  html += '<div class="lg-watch"><div class="lg-watch-title">🔭 버크셔 관찰</div><ul>' +
    '<li>버크셔 Q3 13F: <b>11/14</b> (D-' + lgDDay() + ')</li>' +
    '<li>캐펙스/OCF &gt; <b>1.15</b> = 약세 신호</li>' +
    '<li>클라우드 성장 &lt; <b>60%</b> = 의심 신호</li>' +
    '</ul></div>';

  html += LG_GLOSSARY;

  // 판정이 있는 종목이 위, 백지(미검정·정점주의)는 아래 접힘 그룹으로.
  // 접는 것이지 숨기는 것이 아니다 — 눌러서 펼치면 34종이 다 있다.
  const judged = [], blank = [];
  items.forEach(x => {
    const z = ((x.bench || {}).zone_buffett) || 'untested';
    if (lgFilter && z !== lgFilter) return;
    (z === 'untested' ? blank : judged).push(x);
  });
  judged.sort((a, c) => LG_ORDER.indexOf((a.bench || {}).zone_buffett) -
                        LG_ORDER.indexOf((c.bench || {}).zone_buffett));

  const head = '<div class="px-wrap"><table class="px-table"><thead><tr>' +
    '<th>종목</th><th>ROE−2×국채</th><th>10년 원가쿠폰</th>' +
    '<th class="lg-c-conv">전환율</th><th class="lg-c-price">통과 가격</th>' +
    '<th>버핏존</th></tr></thead><tbody>';
  if (judged.length) {
    html += head + judged.map(x => lgRow(x, lg)).join('') + '</tbody></table></div>';
  }
  if (blank.length) {
    html += '<button class="lg-fold" onclick="lgToggleBlank()">' +
      (lgBlankOpen ? '▾' : '▸') + ' 백지·정점주의 ' + blank.length + '종' +
      (lgBlankOpen ? '' : ' — 아직 판정에 필요한 칸이 비어 있는 종목') + '</button>';
    if (lgBlankOpen) {
      html += head + blank.map(x => lgRow(x, lg)).join('') + '</tbody></table></div>';
    }
  }
  // coupon10y 스파크라인 자리 — 히스토리가 2주쯤 쌓인 뒤에 넣는다(점 2개로는 선이
  // 아니라 착시다). 자리만 표시해 두고 데이터가 모이면 여기에 붙인다.

  host.innerHTML = html;
}

function lgSetFilter(z){
  lgFilter = (lgFilter === z) ? null : z;
  renderLegend();
}

function lgToggleRow(tk){
  lgOpenRow = (lgOpenRow === tk) ? null : tk;
  renderLegend();
}

function lgToggleBlank(){
  lgBlankOpen = !lgBlankOpen;
  renderLegend();
}

/* 🛰 무인 탐사선 — 본문은 **빌드 시점에 이미 필터를 통과한 정적 HTML** 이다.
   여기서 판단층 파일을 fetch 하지 않는다: 클라이언트가 원문을 긁을 수 있으면
   준법 필터가 있으나 마나다. 이 함수는 만들어진 것을 꽂기만 한다. */
function renderAgent(){
  const host = document.getElementById('obsBody');
  const html = DATA.agent || '';
  host.innerHTML = html ||
    '<div class="obs-note">무인 탐사선 준비 중 — 첫 보고서가 들어오면 여기 실립니다.</div>';
  const h = location.hash.replace('#', '');
  if (h.indexOf('agent-') === 0) {
    const el = document.getElementById(h);
    if (el) { el.open = true; setTimeout(() => el.scrollIntoView({behavior:'smooth', block:'start'}), 80); }
  }
}

function renderColumns(){
  const cols = (DATA.columns || []);
  if (!cols.length) { document.getElementById('obsBody').innerHTML =
    '<div class="obs-note">첫 관측일지를 준비 중입니다 — 곧 기록이 시작됩니다.</div>'; return; }
  // 아코디언 — 연표가 먼저, 전문은 클릭. 기본은 최신 1편만 펼침.
  // 비주얼(col-viz)은 detail 안으로 들어간다: 접힌 목록은 날짜·유형·제목만 남아야
  // '언제 무슨 관측이 있었나'라는 시간의 축이 보인다.
  // 목차 — 필독 해부실의 '해부 목록'을 그대로 쓴다(공용 .ud-index-*, 신규 CSS 없음).
  // 링크라서 클릭하면 해시가 바뀌고, 기존 해시 처리기(openFromHash)가 펼치고 스크롤한다
  // — 이미 뿌려진 #log-{colSeed} 공유 링크와 같은 경로다.
  const toc = '<div class="ud-index"><div class="ud-index-title">관측 목록 ' + cols.length + '편</div>' +
    cols.map(c => '<a class="ud-index-row" href="#' + colSlug(c) + '">' +
      '<span class="ud-index-date">' + esc(c.date) + '</span>' +
      esc(c.title) + '</a>').join('') + '</div>';
  document.getElementById('obsBody').innerHTML = toc + cols.map((c, i) => {
    const open = (i === 0);
    return '<div class="col-card ud-acc'+(open?' open':'')+'" id="col-'+i+'" data-log="'+colSlug(c)+'">'+
      '<button class="ud-acc-head" onclick="toggleCol('+i+')" aria-expanded="'+open+'" aria-controls="colbody-'+i+'">'+
        '<span class="ud-acc-meta">'+
          '<span class="col-date">'+esc(c.date)+'</span>'+
          '<span class="col-kind">'+esc(colKind(c))+'</span>'+
        '</span>'+
        '<span class="ud-acc-title">'+esc(c.title)+'</span>'+
        '<span class="ud-acc-caret" aria-hidden="true">▸</span>'+
      '</button>'+
      '<div class="ud-acc-detail" id="colbody-'+i+'">'+
        '<div class="col-summary">'+esc(c.summary)+'</div>'+
        '<div class="col-viz">'+makeColViz(c)+'</div>'+
        '<div class="col-share">'+
          '<button onclick="copyColLink(event,'+i+')">🔗 링크 복사</button>'+
          '<button onclick="copyColText(event,'+i+')">📄 본문 복사</button>'+
          dissectBtn(c)+
        '</div>'+
        '<div class="col-body">'+c.body+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
  openFromHash();
}

// 칼럼 유형 표식 — 고정 위치에서 종류가 한눈에 잡히게.
// 이모지는 넣지 않는다: 신호 칼럼 제목이 이미 📡 로 시작해 두 번 찍힌다.
function colKind(c){
  const t = (c && c.title) || '';
  if (t.indexOf('📡') === 0) return '신호';
  if (t.indexOf('주간 관측') >= 0) return '주간';
  return '심층';
}

// 🔬 해부실 연결 — 이 칼럼의 원문이 해부돼 있을 때만 버튼을 만든다.
// DATA.dissected = {원문 URL: 해부 id} (build_site.py가 translations.json에서 주입)
function dissectBtn(c){
  const id = c && c.url && (DATA.dissected || {})[c.url];
  if (!id) return '';
  return '<a class="dx-jump" href="research.html#dx-' + esc(id) + '" onclick="event.stopPropagation()"'+
    ' title="이 신호 원문의 문단별 한국어 브리핑">🔬 해부실에서 보기 →</a>';
}

function colSlug(c){ return 'log-' + colSeed((c.title || '') + (c.date || '')); }

function colUrl(c){
  return location.origin + location.pathname.replace(/[^/]*$/, '') + 'observatory.html#' + colSlug(c);
}

async function copyToClip(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch(e) { window.prompt('아래 내용을 복사하세요 (Ctrl+C):', text.slice(0, 2000)); return; }
  if (btn) { const orig = btn.textContent; btn.textContent = '✓ 복사됨'; setTimeout(() => { btn.textContent = orig; }, 1500); }
}

function copyColLink(ev, i){
  ev.stopPropagation();
  copyToClip(colUrl((DATA.columns || [])[i]), ev.target);
}

function copyColText(ev, i){
  ev.stopPropagation();
  const c = (DATA.columns || [])[i];
  const tmp = document.createElement('div'); tmp.innerHTML = c.body;
  tmp.querySelectorAll('svg, .col-chart').forEach(n => n.remove());
  tmp.querySelectorAll('h3').forEach(n => { n.textContent = '\n■ ' + n.textContent + '\n'; });
  const text = 'UNIVERTRIX 관측일지 — ' + c.title + ' (' + c.date + ')\n' + colUrl(c) + '\n' +
    (tmp.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
  copyToClip(text, ev.target);
}

function setColOpen(card, open){
  if (!card) return;
  card.classList.toggle('open', open);
  const head = card.querySelector('.ud-acc-head');
  if (head) head.setAttribute('aria-expanded', String(open));
}
// 목차 클릭은 해시를 바꾼다 — 같은 처리기가 펼치고 스크롤한다 (경로를 둘로 만들지 않는다)
window.addEventListener('hashchange', openFromHash);

function openFromHash(){
  const h = location.hash.replace('#', '');
  if (!h.startsWith('log-')) return;
  const card = document.querySelector('.col-card[data-log="' + h + '"]');
  if (!card) return;
  // 링크로 들어온 편이 접혀 있으면 그 링크는 제 일을 못 한 것이다
  setColOpen(card, true);
  setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
}
// 독립 토글 — 두 관측을 나란히 놓고 비교해 읽을 수 있게 (기존 단일 모드에서 변경)
function toggleCol(i){
  const el = document.getElementById('col-'+i);
  if (el) setColOpen(el, !el.classList.contains('open'));
}

if (location.hash === '#agent' || location.hash.indexOf('#agent-') === 0) {
  const btn = document.querySelector('.obs-tab[data-t="agent"]');
  if (btn) setObsTab('agent', btn); else renderAgent();
} else if (location.hash === '#legend') {
  const btn = document.querySelector('.obs-tab[data-t="legend"]');
  if (btn) setObsTab('legend', btn); else renderLegend();
} else if (location.hash === '#parallax') {
  const btn = document.querySelector('.obs-tab[data-t="parallax"]');
  if (btn) setObsTab('parallax', btn); else renderParallax();
} else if (location.hash && (location.hash.indexOf('#log-') === 0 || location.hash === '#columns')) {
  const btn = document.querySelector('.obs-tab[data-t="columns"]');
  if (btn) setObsTab('columns', btn); else renderColumns();
} else {
  renderSolar();
}
</script>
</body>
</html>
