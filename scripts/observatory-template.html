<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데이터 천문대 · UNIVERTRIX</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root, [data-theme="light"] {
  --bg: #FAF6EC; --bg-card: #FFFFFF; --header-bg: rgba(250, 246, 236, 0.95);
  --text: #1A2438; --text-secondary: #525F7E; --text-muted: #8590AA;
  --gold: #9C7A3A; --gold-bg: #F0E6CC;
  --line: #E8DFC9; --line-strong: #C9BC9A;
}
[data-theme="dark"] {
  --bg: #0A0E14; --bg-card: #1C2330; --header-bg: rgba(10, 14, 20, 0.95);
  --text: #FFFFFF; --text-secondary: #B5BFD6; --text-muted: #6F7E9E;
  --gold: #D4A658; --gold-bg: #2A2519;
  --line: #2A3142; --line-strong: #3A4458;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard Variable', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  font-feature-settings: 'tnum', 'ss01'; line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  min-height: 100vh; display: flex; flex-direction: column;
}
.container { max-width: 720px; margin: 0 auto; padding: 0 20px; width: 100%; }

.site-header { background: var(--header-bg); border-bottom: 1px solid var(--line); }
.site-header-inner { max-width: 720px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; color: var(--text); }
.brand a { text-decoration: none; color: inherit; display: flex; gap: 8px; align-items: center; }
.brand-star { color: var(--gold); }
.brand-tag { font-size: 13px; font-weight: 500; color: var(--text-muted); }
.header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.update-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: var(--gold-bg);
  border-radius: 100px; font-size: 12px; font-weight: 700;
  color: var(--gold); font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .update-badge { border: 1px solid rgba(212,166,88,0.3); }
.update-badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); animation: pulse 2s ease-in-out infinite;
}
[data-theme="dark"] .update-badge::before { box-shadow: 0 0 8px var(--gold); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.rate-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 12px; background: var(--bg-card);
  border: 1px solid var(--line); border-radius: 100px;
  font-size: 12px; font-weight: 700; color: var(--text-secondary);
  font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.rate-badge:hover { border-color: var(--gold); }
.rate-badge:hover #usdKrwDisplay, .rate-badge:hover .rate-badge-arrow { color: var(--gold); }
.rate-badge-arrow { font-size: 10px; margin-left: 2px; color: var(--text-muted); opacity: 0.7; transition: color 0.2s, opacity 0.2s; }
.rate-badge:hover .rate-badge-arrow { opacity: 1; }
.rate-badge #usdKrwDisplay { color: var(--text); font-weight: 800; }
@media (max-width: 480px) { .rate-badge { font-size: 11px; padding: 5px 10px; } .update-badge { font-size: 11px; padding: 5px 10px; } }
@media (max-width: 380px) { .update-badge::before { display: none; } }

.theme-toggle {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--bg-card);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
}
.theme-toggle svg { width: 18px; height: 18px; }
.icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: none; }
[data-theme="dark"] .icon-sun { display: inline; }

.site-nav { position: sticky; top: 0; z-index: 50; background: var(--header-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
.site-nav-inner { max-width: 720px; margin: 0 auto; display: flex; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
.site-nav-inner::-webkit-scrollbar { display: none; }
.nav-tab { flex-shrink: 0; padding: 14px 18px; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-muted); text-decoration: none; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
.nav-tab:hover { color: var(--text-secondary); }
.nav-tab.active { color: var(--text); border-bottom-color: var(--gold); }

main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 0; }

.placeholder-card {
  text-align: center;
  padding: 56px 32px;
  border: 1px dashed var(--line-strong);
  border-radius: 16px;
  background: var(--bg-card);
  max-width: 480px;
  width: 100%;
}
.placeholder-icon { font-size: 56px; margin-bottom: 16px; }
.placeholder-eyebrow {
  font-size: 11px; font-weight: 800; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
}
.placeholder-title {
  font-size: 30px; font-weight: 800; letter-spacing: -0.03em;
  color: var(--text); margin-bottom: 12px;
}
.placeholder-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.6; }
.placeholder-note { font-size: 12px; color: var(--text-muted); margin-top: 18px; }

.site-footer { padding: 24px 0 40px; border-top: 1px solid var(--line); text-align: center; }
.footer-brand { display: flex; justify-content: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text-secondary); }
.footer-link { color: var(--text-secondary); text-decoration: none; font-weight: 700; }
.footer-link:hover { color: var(--gold); }
.footer-divider { color: var(--text-muted); font-weight: 400; }

@media (max-width: 480px) { .nav-tab { padding: 12px 14px; font-size: 13px; } .placeholder-title { font-size: 24px; } }

/* ── 데이터 천문대 ── */
.obs-hero { padding: 36px 0 6px; }
.obs-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.14em; color: var(--gold); }
.obs-title { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 6px; }
.obs-desc { font-size: 14.5px; color: var(--text-secondary); margin-bottom: 18px; }
.obs-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
.obs-tab { padding: 9px 18px; border-radius: 100px; border: 1px solid var(--line); background: var(--bg-card); font-size: 13.5px; font-weight: 700; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
.obs-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.solar-wrap { background: #10141f; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; position: relative; }
.solar-wrap svg { display: block; width: 100%; height: auto; }
.solar-legend { font-size: 12px; color: var(--text-muted); margin-top: 10px; text-align: center; }
.solar-tip { position: absolute; pointer-events: none; background: rgba(20,25,40,0.95); color: #f5f1e6; border: 1px solid #9C7A3A; border-radius: 10px; padding: 8px 12px; font-size: 12.5px; display: none; max-width: 220px; z-index: 5; }
.solar-tip b { color: #d4b06a; }
.pl { cursor: pointer; }
.pl:hover { stroke: #ffd873; stroke-width: 2px; }
.col-viz { border-radius: 10px; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--line); line-height: 0; }
.col-viz svg { width: 100%; height: auto; display: block; }
/* 카드 구조·동작은 공용 .ud-acc-* (build_site 의 ud-accordion-v1). 여기엔 눈금만.
   동행 관측 에세이와 같은 문법을 쓴다 — 같은 것을 두 벌 구현하지 않는다. */
.col-card .ud-acc-title { font-size: 19px; line-height: 1.4; letter-spacing: -0.02em; }
.col-card .ud-acc-meta { font-size: 12px; font-weight: 800; letter-spacing: 0.04em; }
.col-date { color: var(--gold); }
.col-kind { color: var(--text-muted); }
.col-summary { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 14px; }
.col-body { font-size: 14.5px; line-height: 1.85; }
@media (max-width: 480px) { .col-card .ud-acc-title { font-size: 17px; } }
.col-chart { margin: 16px 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); line-height: 0; }
.col-chart svg { width: 100%; height: auto; display: block; }
.col-share { display: flex; gap: 8px; margin: 0 0 14px; }
.col-share button { padding: 6px 13px; border-radius: 100px; border: 1px solid var(--line); background: var(--bg); font-size: 12px; font-weight: 700; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
.col-share button:hover { border-color: var(--gold); color: var(--gold); }
/* 🔬 해부실 연결 버튼 — 복사 버튼과 같은 형태, 강조는 골드 테두리로 */
.col-share .dx-jump { display: inline-flex; align-items: center; padding: 6px 13px; border-radius: 100px; border: 1px solid var(--gold); background: var(--bg); font-size: 12px; font-weight: 800; color: var(--gold); text-decoration: none; white-space: nowrap; }
.col-share .dx-jump:hover { background: var(--gold); color: #fff; }
@media (max-width: 480px) { .col-share { flex-wrap: wrap; } }
.col-body h3 { font-size: 15.5px; margin: 18px 0 6px; color: var(--gold); }
.col-body p { margin: 0 0 10px; }
.map-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.map-chip { padding: 7px 13px; border-radius: 100px; border: 1px solid var(--line); background: var(--bg-card); font-size: 12.5px; font-weight: 700; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
.map-chip:hover { border-color: var(--gold); }
.map-chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.map-wrap { background: #10141f; border: 1px solid var(--line); border-radius: 16px; padding: 10px; position: relative; }
.map-grid { position: relative; width: 100%; height: 740px; }
.map-tile { position: absolute; overflow: hidden; border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #eef2ff; cursor: pointer; transition: filter 0.12s, box-shadow 0.12s; background-image: radial-gradient(circle at 32% 26%, rgba(255,255,255,0.09), rgba(0,0,0,0.12)); }
.map-tile:hover { filter: brightness(1.18); box-shadow: 0 0 0 1.5px #d4a63f, 0 0 14px rgba(212,166,63,0.35); z-index: 3; }
.map-tile .tk { font-weight: 800; line-height: 1.1; text-shadow: 0 1px 2px rgba(0,0,0,0.35); max-width: 96%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map-tile .pc { font-weight: 700; opacity: 0.9; }
.map-head { position: absolute; font-size: 10.5px; font-weight: 800; color: #8a94b8; letter-spacing: 0.06em; padding: 2px 4px; z-index: 2; text-shadow: 0 1px 2px #10141f; }
.map-legend { display: flex; justify-content: center; align-items: center; gap: 2px; margin-top: 10px; font-size: 11px; color: var(--text-muted); }
.map-legend span { padding: 3px 9px; border-radius: 4px; color: #fff; font-weight: 700; }
.obs-note { background: var(--bg-card); border: 1px dashed var(--line-strong); border-radius: 14px; padding: 40px 24px; text-align: center; color: var(--text-muted); font-size: 14px; }
/* ── 시차 관측 (버핏 멀티플 괴리) ── */
.px-notice { background: var(--bg-card); border: 1px solid var(--gold); border-radius: 14px; padding: 15px 19px; margin-bottom: 16px; font-size: 12.5px; line-height: 1.75; color: var(--text-secondary); }
.px-notice b { color: var(--gold); font-weight: 800; }
.px-asof { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
.px-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.px-stripnote { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.6; }
.px-zone { flex: 1 1 130px; background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; }
.px-zone .z-name { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--text-muted); }
.px-zone .z-n { font-size: 21px; font-weight: 800; margin-top: 2px; }
.px-zone.on { border-color: var(--gold); }
.px-zone.on .z-n { color: var(--gold); }
/* 유형 용어집 — 기본 펼침 */
.px-gloss { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 20px 6px; margin-bottom: 16px; }
.px-gloss > summary { cursor: pointer; font-size: 13.5px; font-weight: 800; padding: 12px 0; list-style: none; color: var(--text); }
.px-gloss > summary::-webkit-details-marker { display: none; }
.px-gloss > summary::before { content: '▾ '; color: var(--gold); font-weight: 800; }
.px-gloss:not([open]) > summary::before { content: '▸ '; }
.px-gloss dl { margin: 0 0 8px; }
.px-gloss dt { font-size: 13px; font-weight: 800; color: var(--gold); margin-top: 12px; }
.px-gloss dd { margin: 3px 0 0; font-size: 13px; line-height: 1.7; color: var(--text-secondary); }
.px-wrap { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; overflow-x: auto; }
.px-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.px-table th { text-align: left; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: var(--text-secondary); border-bottom: 1.5px solid var(--line-strong); padding: 13px 10px; white-space: nowrap; }
.px-table td { border-bottom: 1px solid var(--line); padding: 15px 10px; vertical-align: top; }
.px-table tr:last-child td { border-bottom: 0; }
.px-tk { font-weight: 800; white-space: nowrap; font-size: 14.5px; }
.px-name { font-size: 12.5px; color: var(--text-secondary); font-weight: 600; margin-top: 1px; }
.px-type { font-size: 13.5px; color: var(--text-secondary); }
.px-num { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 14.5px; font-weight: 700; }
.px-basis { display: inline-block; font-size: 11px; font-weight: 800; border-radius: 100px; padding: 2px 8px; border: 1px solid var(--line-strong); color: var(--text-secondary); margin-left: 5px; }
.px-eps { font-size: 12px; color: var(--text-secondary); margin-top: 4px; font-weight: 600; }
.px-gap { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 17px; }
.px-gap.hot { color: var(--gold); }
.px-gap.cold { color: var(--text-muted); }
.px-gap.none { color: var(--text-muted); font-weight: 700; }
.px-zonetag { font-size: 11.5px; font-weight: 700; color: var(--text-secondary); margin-top: 3px; }
.px-peak { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 800; white-space: nowrap;
  border: 1px solid var(--line-strong); border-radius: 100px; padding: 2px 8px; color: var(--text-muted); cursor: help; }
.px-spark { display: block; width: 86px; height: 22px; margin-top: 5px; }
.px-why { font-size: 13px; color: var(--text-secondary); line-height: 1.7; min-width: 230px; }
.px-hard { margin-top: 20px; }
.px-hard-title { font-size: 15px; font-weight: 800; margin-bottom: 3px; }
.px-hard-desc { font-size: 12.5px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.6; }
/* 레전드벤치마크 — 시차 관측의 자산(.px-*)을 그대로 쓰고, 여기서만 필요한 것만 더한다.
   새 색은 만들지 않는다: 양수는 액센트(--gold), 음수·미검정은 그라파이트(--text-muted). */
.lg-rates { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 16px; margin-bottom: 14px; font-size: 13.5px; color: var(--text-secondary); }
.lg-rates .r-k { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--text-muted); }
.lg-rates .r-v { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); }
.lg-rates .r-bar { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--gold); }
.lg-rates .r-sep { color: var(--line-strong); }
.lg-badge { display: inline-block; margin-left: 5px; font-size: 11px; font-weight: 800;
  white-space: nowrap; border: 1px solid var(--line-strong); border-radius: 100px;
  padding: 2px 8px; color: var(--text-muted); cursor: help; }
.lg-pos { color: var(--gold); }
.lg-neg { color: var(--text-muted); }
.lg-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; font-weight: 600; }
/* origin 표식 — 자동값에만 붙는다. 사람 값은 표식 없음이 곧 표식이다.
   신규 색을 만들지 않는다: 뮤트 텍스트 + 기존 테두리 토큰만 쓴다. */
.lg-auto { display: inline-block; margin-left: 5px; font-size: 10.5px; font-weight: 800;
  color: var(--text-muted); border: 1px solid var(--line-strong); border-radius: 100px;
  padding: 1px 6px; vertical-align: middle; cursor: help; }
.lg-zonetag { font-weight: 800; white-space: nowrap; font-size: 14.5px; }
.lg-watch { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px;
  padding: 15px 19px; margin: 16px 0; }
.lg-watch-title { font-size: 13.5px; font-weight: 800; margin-bottom: 8px; }
.lg-watch ul { margin: 0; padding-left: 18px; }
.lg-watch li { font-size: 13px; line-height: 1.85; color: var(--text-secondary); }
.lg-watch b { color: var(--gold); font-weight: 800; }
/* 존 요약 스트립 — 시차 관측의 .px-zone 을 그대로 쓰고 클릭만 얹는다 */
.px-zone.lg-pick { cursor: pointer; }
.px-zone.lg-pick:hover { border-color: var(--gold); }
.px-zone.lg-on { border-color: var(--gold); }
.px-zone.lg-on .z-n { color: var(--gold); }
.lg-fold { width: 100%; text-align: left; margin-top: 14px; padding: 12px 16px;
  border: 1px dashed var(--line-strong); border-radius: 12px; background: var(--bg-card);
  font-family: inherit; font-size: 13.5px; font-weight: 800; color: var(--text-secondary);
  cursor: pointer; }
.lg-fold:hover { color: var(--text); }
.lg-price { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 800; }
/* 해부창 — 행을 누르면 그 아래 한 칸이 열린다. 새 색 없이 카드 배경만 쓴다. */
.px-table tr.lg-clickable { cursor: pointer; }
.px-table tr.lg-clickable:hover td { background: var(--bg-card); }
.lg-open td { padding-top: 0; padding-bottom: 0; }
.lg-dissect { padding: 14px 12px 18px; font-size: 13px; line-height: 1.8;
  color: var(--text-secondary); }
.lg-calc { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--text);
  background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 10px; overflow-x: auto; white-space: nowrap; }
.lg-fields { display: grid; grid-template-columns: 108px 1fr; gap: 4px 12px; }
.lg-fk { font-size: 12px; font-weight: 800; color: var(--text-muted); }
.lg-fv { font-size: 12.5px; }
@media (max-width: 480px) { .lg-fields { grid-template-columns: 92px 1fr; } }
.lg-gapto { font-size: 12px; color: var(--text-muted); font-weight: 700; margin-top: 2px; }
@media (max-width: 480px) {
  .lg-c-price { max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
}
/* 🛰 무인 탐사선 — 기존 테마 변수만 쓴다(신규 색 금지). 다크 전용 아님. */
.ag-notice { background: var(--bg-card); border: 1px solid var(--gold); border-radius: 14px;
  padding: 15px 19px; margin-bottom: 16px; font-size: 12.5px; line-height: 1.75;
  color: var(--text-secondary); }
.ag-notice b { color: var(--gold); font-weight: 800; }
.ag-cards { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.ag-card { flex: 1 1 150px; background: var(--bg-card); border: 1px solid var(--line);
  border-radius: 12px; padding: 11px 14px; }
.ag-card .ag-k { font-size: 11px; font-weight: 800; letter-spacing: 0.05em;
  color: var(--text-muted); }
.ag-card .ag-v { font-size: 21px; font-weight: 800; margin-top: 2px;
  font-variant-numeric: tabular-nums; }
.ag-card .ag-s { font-size: 11.5px; color: var(--text-muted); font-weight: 700; }
.ag-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
.ag-h { font-size: 15px; font-weight: 800; margin: 20px 0 8px; }

/* 절차적 텍스처 — 코드로 만드는 행성 표면 */
function glowTex(color){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0, color); gr.addColorStop(0.35, color.replace(')',',0.45)').replace('rgb','rgba'));
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
function _hex(h){ const n = parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
const __texCache = {};
function planetTex(hi, lo, seed, rocky){
  const W = 256, Hh = 128;
  const c = document.createElement('canvas'); c.width = W; c.height = Hh;
  const g = c.getContext('2d');
  let s = (seed || 1) % 2147483646 + 1; const rnd = () => (s = (s*16807) % 2147483647) / 2147483647;
  const A = _hex(hi), B = _hex(lo);
  // 값 노이즈 (가로 순환 — 구에 감아도 이음매 없음)
  const GX = 32, GY = 17, grid = [];
  for (let i = 0; i < GX*GY; i++) grid.push(rnd());
  const gv = (x, y) => grid[(((y % GY) + GY) % GY) * GX + (((x % GX) + GX) % GX)];
  const sm = t => t*t*(3-2*t);
  const nz = (x, y) => { const x0 = Math.floor(x), y0 = Math.floor(y), fx = sm(x-x0), fy = sm(y-y0);
    return gv(x0,y0)*(1-fx)*(1-fy) + gv(x0+1,y0)*fx*(1-fy) + gv(x0,y0+1)*(1-fx)*fy + gv(x0+1,y0+1)*fx*fy; };
  const fbm = (x, y) => nz(x,y)*0.5 + nz(x*2.03, y*2.03)*0.28 + nz(x*4.1, y*4.1)*0.15 + nz(x*8.2, y*8.2)*0.07;
  const phase = rnd()*6.28, bands = 6 + Math.floor(rnd()*6);
  const img = g.createImageData(W, Hh), d = img.data;
  for (let y = 0; y < Hh; y++) {
    const v = y / Hh;
    const polar = 0.58 + 0.42*Math.sin(v*Math.PI);          // 극지방 어둡게
    for (let x = 0; x < W; x++) {
      const u = x / W;
      const n = fbm(u*GX*0.55, v*GY*0.55);
      let t;
      if (rocky) {
        t = n;                                               // 대륙형 얼룩
        t = t < 0.48 ? t*0.55 : 0.35 + (t-0.48)*1.35;
      } else {
        const warp = (fbm(u*GX*0.8 + 9.7, v*GY*0.8) - 0.5) * 0.16;  // 소용돌이 워프
        t = Math.sin((v + warp)*Math.PI*bands + phase)*0.5 + 0.5;    // 흐르는 줄무늬
        t = Math.pow(t, 1.25)*0.78 + n*0.22;
      }
      const i4 = (y*W + x) * 4;
      d[i4]   = (B[0] + (A[0]-B[0])*t) * polar;
      d[i4+1] = (B[1] + (A[1]-B[1])*t) * polar;
      d[i4+2] = (B[2] + (A[2]-B[2])*t) * polar;
      d[i4+3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  if (rocky) {  // 크레이터
    for (let i = 0; i < 30; i++) {
      const cx = rnd()*W, cy = Hh*0.12 + rnd()*Hh*0.76, r = rnd()*8 + 1.5;
      g.strokeStyle = 'rgba(8,10,20,0.35)'; g.lineWidth = 1.4;
      g.beginPath(); g.arc(cx, cy, r, 0, 6.3); g.stroke();
      g.fillStyle = 'rgba(255,255,255,0.10)';
      g.beginPath(); g.arc(cx - r*0.28, cy - r*0.28, r*0.55, 0, 6.3); g.fill();
    }
  } else if (rnd() > 0.45) {  // 대적점 폭풍
    const cx = rnd()*W, cy = Hh*(0.55 + rnd()*0.2);
    for (let k = 3; k >= 1; k--) {
      g.fillStyle = 'rgba(150,60,30,' + (0.10*k).toFixed(2) + ')';
      g.beginPath(); g.ellipse(cx, cy, 15*k, 7*k, -0.25, 0, 6.3); g.fill();
    }
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping;
  if (THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
  return t;
}
function ringTex(){
  const c = document.createElement('canvas'); c.width = 256; c.height = 1;
  const g = c.getContext('2d');
  let s = 99; const rnd = () => (s = (s*16807) % 2147483647) / 2147483647;
  for (let x = 0; x < 256; x++) {
    const a = (Math.sin(x*0.22)*0.5+0.5) * (0.25 + rnd()*0.5) * (x < 18 || x > 244 ? 0.15 : 1);
    g.fillStyle = 'rgba(216,201,160,' + a.toFixed(2) + ')';
    g.fillRect(x, 0, 1, 1);
  }
  return new THREE.CanvasTexture(c);
}
function milkyTex(){
  if (__texCache.milky) return __texCache.milky;
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#07090f'; g.fillRect(0, 0, 1024, 512);
  let s = 12345; const rnd = () => (s = (s*16807) % 2147483647) / 2147483647;
  // 은하수 띠 — 겹겹의 뿌연 발광 + 갈색 성간운
  for (let i = 0; i < 420; i++) {
    const t = i / 420, x = t*1024, y = 256 + Math.sin(t*Math.PI*2)*62 + (rnd()-0.5)*130;
    const r = rnd()*26 + 5;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    const warm = rnd() > 0.75;
    gr.addColorStop(0, warm ? 'rgba(185,135,90,0.12)' : 'rgba(175,190,235,0.12)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.3); g.fill();
  }
  // 대형 발광 성운 2점 (레퍼런스의 색 포인트)
  [[0.22, 0.38, 'rgba(210,120,60,0.16)', 150], [0.72, 0.6, 'rgba(110,140,230,0.13)', 180]].forEach(([fx, fy, col2, rr]) => {
    const gr2 = g.createRadialGradient(1024*fx, 512*fy, 0, 1024*fx, 512*fy, rr);
    gr2.addColorStop(0, col2); gr2.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr2; g.beginPath(); g.arc(1024*fx, 512*fy, rr, 0, 6.3); g.fill();
  });
  // 암흑 성운 줄기
  for (let i = 0; i < 70; i++) {
    const t = rnd(), x = t*1024, y = 256 + Math.sin(t*Math.PI*2)*56 + (rnd()-0.5)*46;
    g.fillStyle = 'rgba(5,6,10,0.16)';
    g.beginPath(); g.ellipse(x, y, rnd()*36+9, rnd()*9+3, rnd()*3, 0, 6.3); g.fill();
  }
  // 별 5500개 (색 온도 섞기)
  const cols = ['#f5f1e6','#f5f1e6','#f5f1e6','#cfe0ff','#ffe0c9','#ffd0d0'];
  for (let i = 0; i < 3400; i++) {
    const band = rnd() < 0.55;
    const x = rnd()*1024;
    const y = band ? 256 + Math.sin(x/1024*Math.PI*2)*62 + (rnd()-0.5)*150 : rnd()*512;
    g.fillStyle = cols[Math.floor(rnd()*cols.length)];
    g.globalAlpha = rnd()*0.85 + 0.1;
    const r = rnd() < 0.985 ? rnd()*1.1 + 0.2 : rnd()*2.2 + 1.2;
    g.beginPath(); g.arc(x, y, r, 0, 6.3); g.fill();
  }
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  if (THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
  __texCache.milky = t;
  return t;
}
function sunTex(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#ffd873'; g.fillRect(0,0,512,256);
  let s = 42; const rnd = () => (s = (s*16807)%2147483647)/2147483647;
  for (let i = 0; i < 320; i++) {
    g.fillStyle = 'rgba(' + (rnd()>0.4? '255,250,225' : '224,140,40') + ',' + (rnd()*0.22+0.04).toFixed(2) + ')';
    g.beginPath(); g.arc(rnd()*512, rnd()*256, rnd()*16+2, 0, 6.3); g.fill();
  }
  return new THREE.CanvasTexture(c);
}
function hexToRgbStr(h){ const n = parseInt(h.slice(1),16); return 'rgb('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+')'; }

function boot3d(stocks){
  const wrap = document.getElementById('s3wrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const sun = stocks[0], planets = stocks.slice(1);
  const maxMc = sun.mc;
  const rOf = mc => 6 + Math.pow(mc / maxMc, 0.58) * 34;
  const sunR = 60;
  const orbitBase = sunR + 46, orbitStep = 31;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0d18, 0.00055);
  const camera = new THREE.PerspectiveCamera(45, W/H, 1, 6000);
  // 화면비 반응형 카메라 거리: 세로 폰(좁은 화면)은 수평 시야가 좁아지므로
  // 그만큼 멀리서 시작해야 태양계 전체가 담긴다 (PC 4:3 기준 660)
  const fitK = Math.min(1.75, Math.max(1, (4 / 3) / (W / H)));
  const introEnd = Math.min(1080, Math.round(660 * fitK));
  const maxDist = Math.max(1100, introEnd + 250);
  let camTheta = 0.35, camPhi = 1.12, camDist = introEnd - 20;
  let introT = 0;                // 진입 연출 진행도 (0→1)
  let lastTouch = performance.now();  // 마지막 조작 시각 (자동 선회용)
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));  // 레티나 4K 선명도
  renderer.setSize(W, H);
  renderer.setClearColor(0x07090f);
  if (THREE.ACESFilmicToneMapping !== undefined) {
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
  }
  if (THREE.sRGBEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
  wrap.insertBefore(renderer.domElement, wrap.firstChild);

  // 조명 — 태양이 진짜 광원
  scene.add(new THREE.AmbientLight(0x2a3350, 0.9));
  const sunLight = new THREE.PointLight(0xffe6b0, 2.1, 0, 2);
  scene.add(sunLight);

  const texQueue = [];
  // 실사 텍스처 풀 — 종목마다 서로 다른 행성 얼굴 (파일이 없으면 해당 항목만 절차적 폴백)
  const GAS_POOL = ['jupiter.jpg', 'saturn.jpg', 'uranus.jpg', 'neptune.jpg', 'venus_atm.jpg', 'gas1.jpg', 'gas2.jpg', 'ice1.jpg'];
  const ROCK_POOL = ['mars.jpg', 'mercury.jpg', 'venus.jpg', 'ceres.jpg', 'makemake.jpg', 'haumea.jpg', 'eris.jpg', 'moon.jpg', 'rock1.jpg', 'rock2.jpg'];
  // 실제 태양계 순서 — 2위부터 안쪽 궤도: 수성→금성→지구→화성→목성→토성→천왕성→해왕성→왜소행성들
  const SOLAR_ORDER = ['mercury.jpg', 'venus.jpg', 'earth.jpg', 'mars.jpg', 'jupiter.jpg',
    'saturn.jpg', 'uranus.jpg', 'neptune.jpg', 'ceres.jpg', 'moon.jpg', 'eris.jpg',
    'haumea.jpg', 'makemake.jpg', 'venus_atm.jpg', 'gas1.jpg', 'rock1.jpg', 'gas2.jpg',
    'rock2.jpg', 'ice1.jpg'];
  const __usedTex = new Set();
  function pickRealTex(pool, seed){
    for (let k = 0; k < pool.length; k++) {
      const name = pool[(seed + k) % pool.length];
      if (!__usedTex.has(name)) { __usedTex.add(name); return name; }
    }
    return pool[seed % pool.length];
  }
  // ── 실사 텍스처 (assets/textures/ 에 파일이 있으면 자동 승격, 없으면 절차적 폴백) ──
  const REAL_TEX_BASE = 'assets/textures/';
  const texLoader = new THREE.TextureLoader();
  function loadReal(name, onOk){
    texLoader.load(REAL_TEX_BASE + name, t => {
      if (THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
      onOk(t);
    }, undefined, () => {});  // 실패 시 침묵 — 절차적 유지
  }
  // 은하수 배경 — 먼저 단색으로 즉시, 텍스처는 뒤이어 장착
  const sky = new THREE.Mesh(new THREE.SphereGeometry(2800, 48, 32),
    new THREE.MeshBasicMaterial({ color: 0x0a0d1a, side: THREE.BackSide }));
  sky.material.fog = false;
  sky.rotation.z = 0.42;
  scene.add(sky);
  // ★ v11.3 배경 확정: 구체에 어떤 텍스처도 씌우지 않는다 (부장님 판정 2회 확정).
  //   절차적 은하수(milkyTex)의 발광 원 420개가 구체 확대로 '뿌연 블롭' 오염의 진범.
  //   깔끔한 우주 = 민무늬 심연(#0a0d1a) + 별 입자만. milkyTex·실사 milky 모두 봉인.
  // setTimeout(() => { try { sky.material.map = milkyTex(); sky.material.color.set(0xffffff); sky.material.needsUpdate = true; } catch(e){} }, 30);
  // ★ 은하수 배경은 절차적 고정 — 실사 milky.jpg는 2K를 구체 안에서 ~5배 확대해
  //   사진 별들이 거대 블롭으로 번짐 (2026-08-08 배경 오염 사고). 행성 실사는 유지.
  // loadReal('milky.jpg', t => { sky.material.map = t; sky.material.color.set(0xffffff); sky.material.needsUpdate = true; });

  // 별밭 — 원형 소프트 입자 (사각형 아티팩트 제거), 카메라 항로 바깥(1700+)에 배치
  const starSprite = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.25, 'rgba(255,250,235,0.85)');
    gr.addColorStop(0.6, 'rgba(230,235,255,0.25)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();
  // 별밭 배치·크기를 fitK로 함께 스케일 → 카메라:별껍질 거리 비율이 기기 무관 동일
  // (모바일은 카메라가 멀리 물러나므로, 별도 같이 밀어야 PC와 같은 안정적 우주가 된다)
  [[2000, 1900 * fitK, 3.8 * fitK, 0.8], [700, 2600 * fitK, 6 * fitK, 0.5]].forEach(([n, rad, size, op]) => {
    const pos = new Float32Array(n*3);
    for (let i = 0; i < n; i++) {
      const u = Math.random()*2-1, t = Math.random()*Math.PI*2, rr = rad + Math.random()*900*fitK;
      const sq = Math.sqrt(1-u*u);
      pos[i*3] = rr*sq*Math.cos(t); pos[i*3+1] = rr*u; pos[i*3+2] = rr*sq*Math.sin(t);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
      map: starSprite, color: 0xffffff, size, transparent: true, opacity: op,
      sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending })));
  });

  // 태양 — 발광 코어 + 이중 광륜
  const sunUni = { t: { value: 0 } };
  let sunMat;
  try {
    sunMat = new THREE.ShaderMaterial({
      uniforms: sunUni,
      vertexShader: 'varying vec3 vP; varying vec3 vNv; void main(){ vP = position; vNv = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: [
        'varying vec3 vP; varying vec3 vNv; uniform float t;',
        'float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }',
        'float noise(vec3 p){ vec3 i = floor(p); vec3 f = fract(p); f = f*f*(3.0-2.0*f);',
        '  return mix(mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x), mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),',
        '    mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x), mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z); }',
        'float fbm(vec3 p){ float v = 0.0; float a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.07; a *= 0.5; } return v; }',
        'void main(){',
        '  vec3 p = normalize(vP) * 3.2;',
        '  float n = fbm(p + vec3(t*0.055, t*0.04, t*0.05)) + 0.45 * fbm(p*2.6 - vec3(t*0.085, 0.0, t*0.06));',
        '  vec3 deep = vec3(0.66, 0.22, 0.02); vec3 mid = vec3(1.0, 0.60, 0.10); vec3 hot = vec3(1.0, 0.95, 0.74);',
        '  vec3 col = mix(deep, mid, smoothstep(0.34, 0.72, n)) * 1.25;',
        '  col = mix(col, hot, smoothstep(0.95, 1.35, n));',
        '  float rim = pow(1.0 - abs(vNv.z), 2.2);',
        '  col += rim * vec3(1.0, 0.55, 0.12) * 0.8;',
        '  gl_FragColor = vec4(col, 1.0); }'
      ].join('\n')
    });
  } catch(e) { sunMat = new THREE.MeshBasicMaterial({ map: sunTex() }); }
  const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(sunR, 64, 48), sunMat);
  loadReal('sun.jpg', t => { sunMesh.material = new THREE.MeshBasicMaterial({ map: t }); });
  sunMesh.userData.i = 0; scene.add(sunMesh);
  const glowM = new THREE.SpriteMaterial({ map: glowTex('rgb(255,240,200)'), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
  const glow0 = new THREE.Sprite(glowM); glow0.material.opacity = 1; glow0.scale.set(sunR*3.4, sunR*3.4, 1); scene.add(glow0);
  const glow1 = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex('rgb(255,205,95)'), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.85 }));
  glow1.scale.set(sunR*7, sunR*7, 1); scene.add(glow1);
  const glow2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex('rgb(255,170,60)'), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.45 }));
  glow2.scale.set(sunR*13, sunR*13, 1); scene.add(glow2);

  // 행성들
  const bodies = [sunMesh];
  const orbs = planets.map((p, i) => {
    const r = rOf(p.mc);
    const [hi, lo] = flagColor(p.flag);
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(r, 48, 32),
      new THREE.MeshStandardMaterial({ color: new THREE.Color(lo), roughness: 0.92, metalness: 0.04 }));
    mesh.userData.i = i + 1;
    scene.add(mesh); bodies.push(mesh);
    texQueue.push({ mesh, hi, lo, seed: colSeed(p.ticker), rocky: r < 13 });
    const realName = SOLAR_ORDER[i] || pickRealTex(r >= 15 ? GAS_POOL : ROCK_POOL, colSeed(p.ticker));
    loadReal(realName, t => {
      mesh.material.map = t; mesh.material.bumpMap = null;
      mesh.material.color.set(0xffffff); mesh.material.needsUpdate = true;
      mesh.userData.realTex = true;
    });
    if (i === 5 || i === 6) {  // 토성·천왕성 궤도 — 실사 고리
      const geo = new THREE.RingGeometry(r*1.45, r*2.15, 96);
      const pos = geo.attributes.position, uv = geo.attributes.uv, v3 = new THREE.Vector3();
      const inR = r*1.45, outR = r*2.15;
      for (let k = 0; k < pos.count; k++) {
        v3.fromBufferAttribute(pos, k);
        uv.setXY(k, (v3.length() - inR) / (outR - inR), 0.5);
      }
      const ring = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
        map: ringTex(), transparent: true, opacity: i === 5 ? 0.9 : 0.35, side: THREE.DoubleSide, depthWrite: false }));
      loadReal('ring.png', t => { ring.material.map = t; ring.material.needsUpdate = true; });
      ring.rotation.x = i === 5 ? Math.PI/2.35 : Math.PI/2.05;
      mesh.add(ring);
    }
    const orbR = orbitBase + orbitStep*(i+1);  // 궤도 반경 (궤도선은 표시하지 않음 — 행성이 주인공)
    // 라벨 (HTML — 항상 선명)
    const lab = document.createElement('div');
    lab.style.cssText = 'position:absolute;transform:translate(-50%,0);text-align:center;pointer-events:none;text-shadow:0 1px 4px #0a0d18,0 0 8px #0a0d18;line-height:1.25;white-space:nowrap';
    lab.innerHTML = '<span style="color:#e6ebfa;font-weight:800;font-size:12.5px">'+esc(shortName(p))+'</span>' +
      (i < 8 ? '<br><span style="color:#93a0c6;font-weight:700;font-size:10.5px">'+(p.mc>=1000?'$'+(p.mc/1000).toFixed(2)+'T':'$'+Math.round(p.mc)+'B')+'</span>' : '');
    document.getElementById('s3labels').appendChild(lab);
    return { mesh, lab, r, orbR, a: (i*137.5)*Math.PI/180, s: 0.0022/(1+i*0.22), spin: 0.002+Math.random()*0.004 };
  });
  // 태양 라벨
  const sunLab = document.createElement('div');
  sunLab.style.cssText = 'position:absolute;transform:translate(-50%,0);text-align:center;pointer-events:none;text-shadow:0 1px 4px #0a0d18;line-height:1.3;white-space:nowrap';
  sunLab.innerHTML = '<span style="color:#ffd873;font-weight:800;font-size:15px">'+esc(shortName(sun))+'</span><br><span style="color:#d4b06a;font-weight:700;font-size:11.5px">$'+(sun.mc/1000).toFixed(2)+'T</span>';
  document.getElementById('s3labels').appendChild(sunLab);

  // 조작 — 드래그 회전 · 휠 줌 · 호버 툴팁
  const tip = document.getElementById('solarTip');
  const ray = new THREE.Raycaster(), mouseV = new THREE.Vector2();
  let dragging = false, px = 0, py = 0, hovered = null;
  wrap.addEventListener('mousedown', e => { dragging = true; lastTouch = performance.now(); px = e.clientX; py = e.clientY; wrap.style.cursor = 'grabbing'; });
  window.addEventListener('mouseup', () => { dragging = false; wrap.style.cursor = 'grab'; });
  wrap.addEventListener('mousemove', e => {
    const rect = wrap.getBoundingClientRect();
    if (dragging) {
      lastTouch = performance.now();
      camTheta -= (e.clientX - px) * 0.005; camPhi -= (e.clientY - py) * 0.004;
      camPhi = Math.max(0.35, Math.min(1.45, camPhi)); px = e.clientX; py = e.clientY;
    }
    mouseV.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouseV.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    ray.setFromCamera(mouseV, camera);
    const hit = ray.intersectObjects(bodies)[0];
    if (hit) {
      const s = stocks[hit.object.userData.i];
      tip.style.display = 'block';
      tip.style.left = Math.min(e.clientX - rect.left + 14, rect.width - 230) + 'px';
      tip.style.top = (e.clientY - rect.top + 14) + 'px';
      tip.innerHTML = '<b>'+esc(s.name)+'</b> '+esc(s.flag||'')+'<br>'+(s.mc>=1000?'$'+(s.mc/1000).toFixed(2)+'T':'$'+Math.round(s.mc)+'B')+(s.desc?'<br>'+esc(s.desc):'');
      if (hovered && hovered !== hit.object && hovered.material.emissive) hovered.material.emissive.setHex(0x000000);
      hovered = hit.object;
      if (hovered.material.emissive) hovered.material.emissive.setHex(0x33290f);
    } else {
      tip.style.display = 'none';
      if (hovered && hovered.material.emissive) hovered.material.emissive.setHex(0x000000);
      hovered = null;
    }
  });
  wrap.addEventListener('wheel', e => { e.preventDefault(); lastTouch = performance.now();
    camDist = Math.max(320, Math.min(maxDist, camDist + e.deltaY * 0.5)); }, { passive: false });

  // ── 모바일 터치: 한 손가락 회전 · 두 손가락 핀치 줌 · 짧은 탭 = 행성 정보 ──
  function probeTip(cx, cy){
    const rect = wrap.getBoundingClientRect();
    mouseV.x = ((cx - rect.left) / rect.width) * 2 - 1;
    mouseV.y = -((cy - rect.top) / rect.height) * 2 + 1;
    ray.setFromCamera(mouseV, camera);
    const hit = ray.intersectObjects(bodies)[0];
    if (hit) {
      const s = stocks[hit.object.userData.i];
      tip.style.display = 'block';
      tip.style.left = Math.max(6, Math.min(cx - rect.left - 60, rect.width - 230)) + 'px';
      tip.style.top = Math.max(6, cy - rect.top - 90) + 'px';
      tip.innerHTML = '<b>'+esc(s.name)+'</b> '+esc(s.flag||'')+'<br>'+(s.mc>=1000?'$'+(s.mc/1000).toFixed(2)+'T':'$'+Math.round(s.mc)+'B')+(s.desc?'<br>'+esc(s.desc):'');
    } else {
      tip.style.display = 'none';
    }
  }
  let pinchD = 0, tapX = 0, tapY = 0, tapT = 0, tapMoved = false;
  wrap.addEventListener('touchstart', e => {
    lastTouch = performance.now();
    if (e.touches.length === 1) {
      dragging = true; tapMoved = false;
      px = e.touches[0].clientX; py = e.touches[0].clientY;
      tapX = px; tapY = py; tapT = performance.now();
    } else if (e.touches.length === 2) {
      dragging = false; tapMoved = true;
      pinchD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                          e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });
  wrap.addEventListener('touchmove', e => {
    e.preventDefault();  // 캔버스 위에서는 페이지 스크롤 대신 우주가 움직인다
    lastTouch = performance.now();
    if (e.touches.length === 1 && dragging) {
      const x = e.touches[0].clientX, y = e.touches[0].clientY;
      if (Math.abs(x - tapX) + Math.abs(y - tapY) > 8) tapMoved = true;
      camTheta -= (x - px) * 0.005; camPhi -= (y - py) * 0.004;
      camPhi = Math.max(0.35, Math.min(1.45, camPhi)); px = x; py = y;
    } else if (e.touches.length === 2) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                           e.touches[0].clientY - e.touches[1].clientY);
      if (pinchD > 0 && d > 0) {
        camDist = Math.max(320, Math.min(maxDist, camDist * (pinchD / d)));
      }
      pinchD = d;
    }
  }, { passive: false });
  wrap.addEventListener('touchend', e => {
    lastTouch = performance.now();
    if (e.touches.length === 0) {
      dragging = false;
      if (!tapMoved && performance.now() - tapT < 350) probeTip(tapX, tapY);
    } else if (e.touches.length === 1) {
      dragging = true; tapMoved = true;
      px = e.touches[0].clientX; py = e.touches[0].clientY;
    }
    pinchD = 0;
  }, { passive: true });

  const v = new THREE.Vector3();
  function place(mesh, lab, yOff){
    v.copy(mesh.position); v.y -= yOff; v.project(camera);
    if (v.z > 1) { lab.style.display = 'none'; return; }
    lab.style.display = '';
    lab.style.left = ((v.x*0.5+0.5)*W) + 'px';
    lab.style.top = ((-v.y*0.5+0.5)*H) + 'px';
    lab.style.opacity = Math.max(0.45, 1.15 - mesh.position.distanceTo(camera.position)/1400).toFixed(2);
  }
  let t0 = 0, firstFrame = true;
  function frame(t){
    const dt = Math.min(50, t - t0); t0 = t;
    if (firstFrame) { firstFrame = false; const ld = document.getElementById('s3load'); if (ld) ld.remove(); }
    // 텍스처 지연 장착 — 프레임당 1개씩 (첫 화면을 막지 않음)
    if (texQueue.length) {
      const q = texQueue.shift();
      try { if (q.mesh.userData.realTex) throw 0;
        const key = q.seed + (q.rocky ? 'r' : 'g');
        const tex = __texCache[key] || (__texCache[key] = planetTex(q.hi, q.lo, q.seed, q.rocky));
        q.mesh.material.map = tex; q.mesh.material.bumpMap = tex;
        q.mesh.material.bumpScale = q.rocky ? 0.7 : 0.35;
        q.mesh.material.color.set(0xffffff);
        q.mesh.material.needsUpdate = true; } catch(e){}
    }
    // 진입 돌리 (2.2초) + 3초 무조작 시 자동 선회
    if (introT < 1) { introT = Math.min(1, introT + dt / 2200);
      const ease = 1 - Math.pow(1 - introT, 3);
      camDist = (introEnd + 490) - 490 * ease;
      camTheta += dt * 0.00018;
    } else if (!dragging && performance.now() - lastTouch > 3000) {
      camTheta += dt * 0.00006;
    }
    orbs.forEach(o => {
      o.a += o.s * dt * 0.06;
      o.mesh.position.set(Math.cos(o.a)*o.orbR, 0, Math.sin(o.a)*o.orbR);
      o.mesh.rotation.y += o.spin;
    });
    if (sunUni) sunUni.t.value = t * 0.001;
    const pulse = 1 + Math.sin(t/900)*0.05;
    glow1.scale.set(sunR*6.5*pulse, sunR*6.5*pulse, 1);
    camera.position.set(camDist*Math.sin(camPhi)*Math.cos(camTheta), camDist*Math.cos(camPhi), camDist*Math.sin(camPhi)*Math.sin(camTheta));
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    orbs.forEach(o => place(o.mesh, o.lab, o.r + 6));
    place(sunMesh, sunLab, sunR + 6);
    solar3d.raf = requestAnimationFrame(frame);
  }
  solar3d = { renderer, raf: requestAnimationFrame(frame) };
}

function renderSolarSVG(){
  const stocks = (DATA.earth || []).slice(0, 20);
  if (!stocks.length) { document.getElementById('obsBody').innerHTML = '<div class="obs-note">데이터 수집 대기 중입니다.</div>'; return; }
  const sun = stocks[0], planets = stocks.slice(1);
  const W = 880, H = 660, cx = W/2, cy = H/2 + 10;
  const TILT = 0.62;  // 궤도 기울기 (관측 시점)
  const maxMc = sun.mc;
  const rOf = mc => 5 + Math.pow(mc / maxMc, 0.58) * 30;
  const sunR = 40;
  const orbitBase = sunR + 46, orbitStep = (W/2 - orbitBase - 36) / planets.length;
  const fmt = mc => mc >= 1000 ? '$' + (mc/1000).toFixed(2) + 'T' : '$' + Math.round(mc) + 'B';

  defs += '<linearGradient id="milky" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8a94c8" stop-opacity="0"/><stop offset="45%" stop-color="#aab4dc" stop-opacity="0.10"/><stop offset="55%" stop-color="#c8d0ea" stop-opacity="0.14"/><stop offset="100%" stop-color="#8a94c8" stop-opacity="0"/></linearGradient>';
  defs += '<radialGradient id="sunCore" cx="36%" cy="32%" r="85%"><stop offset="0%" stop-color="#fffbe8"/><stop offset="30%" stop-color="#ffd873"/><stop offset="70%" stop-color="#e0a93f"/><stop offset="100%" stop-color="#96691f"/></radialGradient>';
  defs += '<radialGradient id="sunGlow"><stop offset="0%" stop-color="#ffd873" stop-opacity="0.65"/><stop offset="42%" stop-color="#e0a93f" stop-opacity="0.2"/><stop offset="100%" stop-color="#e0a93f" stop-opacity="0"/></radialGradient>';
  defs += '<linearGradient id="flare" x1="0%" y1="50%" x2="100%" y2="50%"><stop offset="0%" stop-color="#ffd873" stop-opacity="0"/><stop offset="50%" stop-color="#fff0c8" stop-opacity="0.5"/><stop offset="100%" stop-color="#ffd873" stop-opacity="0"/></linearGradient>';
  defs += '<radialGradient id="shade" cx="74%" cy="74%" r="88%"><stop offset="0%" stop-color="#080b14" stop-opacity="0.6"/><stop offset="45%" stop-color="#080b14" stop-opacity="0.24"/><stop offset="100%" stop-color="#080b14" stop-opacity="0"/></radialGradient>';
  defs += '<radialGradient id="neb1"><stop offset="0%" stop-color="#5a4a9e" stop-opacity="0.26"/><stop offset="100%" stop-color="#5a4a9e" stop-opacity="0"/></radialGradient>';
  defs += '<radialGradient id="neb2"><stop offset="0%" stop-color="#2e6d8a" stop-opacity="0.2"/><stop offset="100%" stop-color="#2e6d8a" stop-opacity="0"/></radialGradient>';

    defs += '<clipPath id="pc'+i+'"><circle r="'+rOf(p.mc).toFixed(1)+'"/></clipPath>'; });
  defs += '</defs>';

  let svg = '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">' + defs;
  svg += '<rect width="'+W+'" height="'+H+'" fill="url(#space)"/>';
  svg += '<ellipse cx="'+(W*0.5)+'" cy="'+(H*0.5)+'" rx="'+(W*0.85)+'" ry="'+(H*0.22)+'" fill="url(#milky)" transform="rotate(-22 '+(W*0.5)+' '+(H*0.5)+')"/>';

  svg += '<ellipse cx="'+(W*0.86)+'" cy="'+(H*0.83)+'" rx="270" ry="170" fill="url(#neb2)"/>';

  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const starCol = ['#f5f1e6','#f5f1e6','#f5f1e6','#cfe0ff','#ffe0c9'];
  for (let i = 0; i < 180; i++) {
    const x=(rnd()*W).toFixed(1), y=(rnd()*H).toFixed(1), r=(rnd()*1.3+0.2).toFixed(2), o=(rnd()*0.6+0.12).toFixed(2);
    const c = starCol[Math.floor(rnd()*starCol.length)];
    if (i % 5 === 0) {
      const dur=(rnd()*3+2).toFixed(1);
      svg += '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'"><animate attributeName="opacity" values="'+o+';0.04;'+o+'" dur="'+dur+'s" repeatCount="indefinite"/></circle>';
    } else svg += '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'" opacity="'+o+'"/>';
  }
  [[0,'M -40 60 L '+(W*0.55)+' '+(H*0.32),'11s'],[1,'M '+(W+40)+' '+(H*0.14)+' L '+(W*0.35)+' '+(H*0.62),'17s']].forEach(([k,path,dur]) => {
    svg += '<g opacity="0"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.86;0.9;1" dur="'+dur+'" repeatCount="indefinite"/>' +
      '<circle r="1.6" fill="#fff"><animateMotion path="'+path+'" dur="'+dur+'" repeatCount="indefinite"/></circle></g>';
  });

  // 기울어진 궤도 (타원)
  planets.forEach((p, i) => { const orbR = orbitBase + orbitStep*(i+1);
    svg += '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+orbR.toFixed(1)+'" ry="'+(orbR*TILT).toFixed(1)+'" fill="none" stroke="#4a5578" stroke-opacity="0.5" stroke-width="0.9" stroke-dasharray="1 6"/>'; });

  // 뒤층 → 태양 → 앞층 (행성이 태양 뒤로 실제로 돌아감)
  svg += '<g id="backLayer"></g>';
  let rays = '<g opacity="0.32"><animateTransform attributeName="transform" type="rotate" from="0 '+cx+' '+cy+'" to="360 '+cx+' '+cy+'" dur="120s" repeatCount="indefinite"/>';
  for (let k = 0; k < 12; k++) { const a = k * 30 * Math.PI/180, L = sunR*2.4;
    rays += '<polygon points="'+cx+','+cy+' '+(cx+Math.cos(a-0.045)*L)+','+(cy+Math.sin(a-0.045)*L)+' '+(cx+Math.cos(a+0.045)*L)+','+(cy+Math.sin(a+0.045)*L)+'" fill="#e0a93f" opacity="0.22"/>'; }
  rays += '</g>';
  svg += rays;
  svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(sunR*2.7)+'" fill="url(#sunGlow)"><animate attributeName="r" values="'+(sunR*2.7)+';'+(sunR*3.05)+';'+(sunR*2.7)+'" dur="5s" repeatCount="indefinite"/></circle>';
  svg += '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(sunR*3.4)+'" ry="2.2" fill="url(#flare)" opacity="0.8"/>';
  svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+sunR+'" fill="url(#sunCore)" data-i="0" class="pl"/>';
  svg += '<text x="'+cx+'" y="'+(cy+sunR+22)+'" text-anchor="middle" fill="#ffd873" font-size="15.5" font-weight="800"'+halo+'>'+esc(shortName(sun))+'</text>';
  svg += '<text x="'+cx+'" y="'+(cy+sunR+39)+'" text-anchor="middle" fill="#d4b06a" font-size="12" font-weight="700"'+halo+'>'+fmt(sun.mc)+'</text>';
  svg += '<g id="frontLayer"></g>';
  svg += '</svg>';

  // 행성 노드 생성 (문자열이 아닌 DOM으로 — 층 이동을 위해)
  document.getElementById('obsBody').innerHTML =
    '<div class="solar-wrap">'+svg+'<div class="solar-tip" id="solarTip"></div></div>'+
    '<div class="solar-legend">행성 크기 = 시가총액 · 태양 = 현재 왕좌 · 행성 색 = 국적 ' +
      [...new Set(planets.map(p=>p.flag).filter(f=>FLAG_COLOR[f]))].map(f =>
        '<span style="display:inline-flex;align-items:center;gap:4px;margin:0 7px"><span style="width:9px;height:9px;border-radius:50%;background:'+flagColor(f)[0]+';display:inline-block"></span>'+f+'</span>').join('') +
    '</div><div class="solar-legend" style="margin-top:4px">행성은 태양 뒤로도 돕니다 — 매일 아침 다시 그려집니다 ('+esc(DATA.fetched||'')+' 관측)</div>';

  const NS = 'http://www.w3.org/2000/svg';
  const back = document.getElementById('backLayer'), front = document.getElementById('frontLayer');
  const orbs = planets.map((p, i) => {
    const r = rOf(p.mc);
    const [hi] = flagColor(p.flag);
    const g = document.createElementNS(NS, 'g');
    let inner = '';
    if (i === 0) inner += '<ellipse rx="'+(r*1.8)+'" ry="'+(r*0.5)+'" fill="none" stroke="#d8c9a0" stroke-opacity="0.35" stroke-width="3.5" transform="rotate(-18)"/><ellipse rx="'+(r*1.8)+'" ry="'+(r*0.5)+'" fill="none" stroke="#f0e2c0" stroke-opacity="0.7" stroke-width="1.2" transform="rotate(-18)"/>';
    if (i < 3) inner += '<circle r="'+(r+2.5)+'" fill="none" stroke="'+hi+'" stroke-opacity="0.35" stroke-width="2"/>';
    inner += '<circle r="'+r.toFixed(1)+'" fill="url(#pg'+i+')" data-i="'+(i+1)+'" class="pl"/>';
    if (r > 15) inner += '<g clip-path="url(#pc'+i+')" pointer-events="none" opacity="0.16">' +
      '<ellipse cy="'+(-r*0.34)+'" rx="'+r+'" ry="'+(r*0.14)+'" fill="#0a0d18" transform="rotate(-8)"/>' +
      '<ellipse cy="'+(r*0.08)+'" rx="'+r+'" ry="'+(r*0.11)+'" fill="#ffffff" transform="rotate(-8)"/>' +
      '<ellipse cy="'+(r*0.44)+'" rx="'+r+'" ry="'+(r*0.13)+'" fill="#0a0d18" transform="rotate(-8)"/></g>';
    inner += '<circle r="'+r.toFixed(1)+'" fill="url(#shade)" pointer-events="none"/>';
    const fs = Math.max(10, Math.min(13, r*0.62));
    inner += '<text y="'+(r+13)+'" text-anchor="middle" fill="#e6ebfa" font-size="'+fs.toFixed(1)+'" font-weight="800"'+halo+'>'+esc(shortName(p))+'</text>';
    if (i < 8) inner += '<text y="'+(r+26)+'" text-anchor="middle" fill="#93a0c6" font-size="'+(fs*0.8).toFixed(1)+'" font-weight="700"'+halo+'>'+fmt(p.mc)+'</text>';
    g.innerHTML = inner;
    front.appendChild(g);
    return { g, orbR: orbitBase + orbitStep*(i+1), a: (i * 137.5) * Math.PI/180,
             s: 0.0010/(1+i*0.24), inFront: true };
  });

  const wrap = document.querySelector('.solar-wrap');
  const tip = document.getElementById('solarTip');
  const stocksAll = stocks;
  let paused = false;
  wrap.addEventListener('mousemove', e => {
    const t = e.target;
    if (t.classList && t.classList.contains('pl')) {
      const s = stocksAll[+t.dataset.i];
      const rect = wrap.getBoundingClientRect();
      tip.style.display = 'block';
      tip.style.left = Math.min(e.clientX - rect.left + 14, rect.width - 230) + 'px';
      tip.style.top = (e.clientY - rect.top + 14) + 'px';
      tip.innerHTML = '<b>'+esc(s.name)+'</b> '+esc(s.flag||'')+'<br>'+fmt(s.mc)+(s.desc?'<br>'+esc(s.desc):'');
      paused = true;
    } else { tip.style.display = 'none'; paused = false; }
  });
  wrap.addEventListener('mouseleave', () => { tip.style.display = 'none'; paused = false; });

  const step = () => {
    if (!paused) orbs.forEach(o => {
      o.a += o.s;
      const sin = Math.sin(o.a);
      const x = cx + o.orbR * Math.cos(o.a);
      const y = cy + o.orbR * TILT * sin;
      const depth = (sin + 1) / 2;                 // 0 = 맨 뒤, 1 = 맨 앞
      const sc = 0.72 + depth * 0.42;
      o.g.setAttribute('transform', 'translate('+x.toFixed(1)+','+y.toFixed(1)+') scale('+sc.toFixed(3)+')');
      o.g.setAttribute('opacity', (0.72 + depth * 0.28).toFixed(2));
      const nowFront = sin >= 0;
      if (nowFront !== o.inFront) { (nowFront ? front : back).appendChild(o.g); o.inFront = nowFront; }
    });
    solarRAF = requestAnimationFrame(step);
  };
  step();
}

/* ── 우주 지도 (트리맵) ── */
function chgColor(chg){
  // 한국형 빛의 문법: 상승 = 금빛으로 타오름 · 하락 = 코발트로 얼어붙음 (한국 증시의 빨강/파랑 감각)
  if (chg === null || chg === undefined) return '#3a4157';
  const v = Math.max(-3, Math.min(3, chg)) / 3;
  const mix = (a, b, t) => Math.round(a + (b - a) * t);
  const base = [58, 65, 87];                          // 무풍 — 무채 슬레이트
  const to = v >= 0 ? [242, 186, 60] : [56, 110, 225]; // 발광 금빛 / 선명한 코발트
  const t = Math.pow(Math.abs(v), 0.72);
  return 'rgb(' + mix(base[0], to[0], t) + ',' + mix(base[1], to[1], t) + ',' + mix(base[2], to[2], t) + ')';
}
const chgText = chg => (chg !== null && chg >= 1.5) ? '#1c2333' : '#eef2ff';  // 밝은 금빛 위엔 남색 글씨

function squarify(items, x, y, w, h, out){
  // items: [{v, ...}] 내림차순 — 고전 squarified treemap
  if (!items.length) return;
  const total = items.reduce((s, i) => s + i.v, 0);
  let row = [], rest = items.slice(), best = Infinity;
  const vertical = w < h;
  const side = vertical ? w : h;
  while (rest.length) {
    const cand = row.concat([rest[0]]);
    const sum = cand.reduce((s, i) => s + i.v, 0);
    const area = sum / total * w * h;
    const thick = area / side;
    let worst = 0;
    cand.forEach(i => { const len = (i.v / sum) * side;
      worst = Math.max(worst, Math.max(thick / len, len / thick)); });
    if (worst <= best) { row = cand; rest.shift(); best = worst; }
    else break;
  }
  const sum = row.reduce((s, i) => s + i.v, 0);
  const thick = (sum / total * w * h) / side;
  let off = 0;
  row.forEach(i => {
    const len = (i.v / sum) * side;
    if (vertical) out.push({ ...i, x: x + off, y: y, w: len, h: thick });
    else out.push({ ...i, x: x, y: y + off, w: thick, h: len });
    off += len;
  });
  if (vertical) squarify(rest, x, y + thick, w, h - thick, out);
  else squarify(rest, x + thick, y, w - thick, h, out);
}

let mapFilter = 'all';
function setMapFilter(f){ mapFilter = f; renderMap(); }

function renderMap(){
  const all = (DATA.tiles || []).filter(t => t.mc > 0);
  if (!all.length) { document.getElementById('obsBody').innerHTML = '<div class="obs-note">지도 데이터 대기 중입니다.</div>'; return; }
  // 필터 칩 구성: 전체 · 우주지배자 · 잠재지배자 · 국가별(시총순)
  const gTotals = {};
  all.forEach(t => { gTotals[t.g] = (gTotals[t.g] || 0) + t.mc; });
  const countries = Object.entries(gTotals).sort((a, b) => b[1] - a[1]).map(([g]) => g);
  const flagOf = g => (all.find(t => t.g === g) || {}).f || '';
  const chips = [['all', '전체'], ['earth', '👑 우주지배자'], ['latent', '✦ 잠재지배자']]
    .concat(countries.map(g => ['g:' + g, flagOf(g) + ' ' + g]));
  const chipsHtml = '<div class="map-chips">' + chips.map(([k, label]) =>
    '<button class="map-chip' + (mapFilter === k ? ' active' : '') + '" onclick="setMapFilter(\'' + k + '\')">' + esc(label) + '</button>').join('') + '</div>';

  let tiles = all;
  if (mapFilter === 'earth') tiles = all.filter(t => t.e);
  else if (mapFilter === 'latent') tiles = all.filter(t => t.l);
  else if (mapFilter.startsWith('g:')) tiles = all.filter(t => t.g === mapFilter.slice(2));
  if (!tiles.length) tiles = all;
  const W = Math.min(document.getElementById('obsBody').clientWidth - 22, 1240) || 900, H = 740;
  // 국가 그룹: 시총 합 내림차순
  const groups = {};
  tiles.forEach(t => { (groups[t.g] = groups[t.g] || { name: t.g, f: t.f, v: 0, items: [] }); groups[t.g].v += t.mc; groups[t.g].items.push({ ...t, v: t.mc }); });
  const glist = Object.values(groups).sort((a, b) => b.v - a.v);
  glist.forEach(g => g.items.sort((a, b) => b.v - a.v));
  // 1단계: 국가 블록 배치 → 2단계: 블록 내 종목 배치
  const gout = [];
  squarify(glist.map(g => ({ v: g.v, g })), 0, 0, W, H, gout);
  let html = '';
  gout.forEach(gb => {
    const inner = [];
    squarify(gb.g.items, gb.x + 1, gb.y + 14, gb.w - 2, gb.h - 15, inner);
    if (gb.w > 46 && gb.h > 26)
      html += '<div class="map-head" style="left:' + (gb.x + 3) + 'px;top:' + gb.y + 'px">' + esc(gb.g.f + ' ' + gb.g.name + ' 성단') + '</div>';
    inner.forEach(t => {
      const label = (typeof shortName === 'function') ? shortName({ ticker: t.t, name: t.n }) : t.t;
      const big = t.w > 46 && t.h > 32, mid = t.w > 26 && t.h > 15;
      const fs = Math.max(8.5, Math.min(21, Math.sqrt(t.w * t.h) / 4.6, t.w / (label.length * 0.62)));
      html += '<div class="map-tile" style="left:' + (t.x + 1) + 'px;top:' + (t.y + 1) + 'px;width:' + Math.max(0, t.w - 2).toFixed(1) + 'px;height:' + Math.max(0, t.h - 2).toFixed(1) + 'px;background-color:' + chgColor(t.chg) + ';color:' + chgText(t.chg) + ';border-radius:' + (t.w > 40 ? 6 : 3) + 'px"' +
        ' data-tip="' + esc(t.n) + '|' + esc(t.f) + '|' + t.mc + '|' + (t.chg === null ? '' : t.chg) + '">' +
        (mid ? '<span class="tk" style="font-size:' + fs.toFixed(1) + 'px">' + esc(label) + '</span>' : '') +
        (big && t.chg !== null ? '<span class="pc" style="font-size:' + Math.max(8.5, fs * 0.66).toFixed(1) + 'px">' + (t.chg > 0 ? '+' : '') + t.chg + '%</span>' : '') +
      '</div>';
    });
  });
  const scale = [-3, -2, -1, 0, 1, 2, 3].map(v =>
    '<span style="background:' + chgColor(v) + ';color:' + chgText(v) + ';border-radius:100px">' + (v > 0 ? '+' : '') + v + '%</span>').join('');
  const subtitle = mapFilter === 'earth' ? '👑 우주지배자 — 지구 TOP 20'
    : mapFilter === 'latent' ? '✦ 잠재지배자 — 30~200위권 모멘텀 후보'
    : mapFilter.startsWith('g:') ? flagOf(mapFilter.slice(2)) + ' ' + mapFilter.slice(2) + ' 성단 상세'
    : '8개 권역 통합';
  document.getElementById('obsBody').innerHTML = chipsHtml +
    '<div class="map-wrap"><div class="map-grid" style="height:' + H + 'px">' + html + '</div>' +
    '<div class="solar-tip" id="mapTip"></div></div>' +
    '<div class="map-legend">' + scale + '</div>' +
    '<div class="solar-legend">빛날수록 상승, 가라앉을수록 하락 — 칸 크기 = 시가총액 · ' + subtitle + ' (' + esc(DATA.fetched || '') + ' 관측)</div>';
  const wrap = document.querySelector('.map-wrap'), tip = document.getElementById('mapTip');
  wrap.addEventListener('mousemove', e => {
    const t = e.target.closest('.map-tile');
    if (t) {
      const [n, f, mc, chg] = t.dataset.tip.split('|');
      const rect = wrap.getBoundingClientRect();
      tip.style.display = 'block';
      tip.style.left = Math.min(e.clientX - rect.left + 14, rect.width - 230) + 'px';
      tip.style.top = (e.clientY - rect.top + 14) + 'px';
      tip.innerHTML = '<b>' + esc(n) + '</b> ' + esc(f) + '<br>' + (mc >= 1000 ? '$' + (mc / 1000).toFixed(2) + 'T' : '$' + Math.round(mc) + 'B') +
        (chg !== '' ? '<br>전일 대비 ' + (chg > 0 ? '+' : '') + chg + '%' : '<br>전일 비교 데이터 없음');
    } else tip.style.display = 'none';
  });
  wrap.addEventListener('mouseleave', () => tip.style.display = 'none');
}

/* ── 관측일지 ── */
function colSeed(str){ let h = 2166136261;
  for (const ch of String(str||'')) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0; }

function makeColViz(c){
  const W = 800, H = 150;
  let seed = colSeed(c.title);
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let inner = '';
  const gid = 'cv' + colSeed(c.title) % 100000;
  let defs = '<defs><radialGradient id="'+gid+'sp" cx="50%" cy="30%" r="90%"><stop offset="0%" stop-color="#1b2244"/><stop offset="100%" stop-color="#0a0d18"/></radialGradient>' +
    '<radialGradient id="'+gid+'g"><stop offset="0%" stop-color="#ffd873"/><stop offset="60%" stop-color="#d4a63f"/><stop offset="100%" stop-color="#9c7a3a"/></radialGradient></defs>';
  inner += '<rect width="'+W+'" height="'+H+'" fill="url('+'#'+gid+'sp)"/>';
  for (let i = 0; i < 60; i++)
    inner += '<circle cx="'+(rnd()*W).toFixed(1)+'" cy="'+(rnd()*H).toFixed(1)+'" r="'+(rnd()*1.1+0.2).toFixed(2)+'" fill="#f5f1e6" opacity="'+(rnd()*0.5+0.15).toFixed(2)+'"/>';

  if (c.viz && c.viz.type === 'solar' && Array.isArray(c.viz.planets) && c.viz.planets.length) {
    // 주간 미니 태양계 — 그 주의 TOP 5 실데이터
    const ps = c.viz.planets.slice(0, 5);
    const maxMc = Math.max(...ps.map(p => p.mc || 1));
    const step = W / (ps.length + 1);
    ps.forEach((p, i) => {
      const x = step * (i + 1), r = 8 + Math.sqrt((p.mc || 1) / maxMc) * 26;
      inner += i === 0
        ? '<circle cx="'+x+'" cy="'+(H*0.44)+'" r="'+(r+6)+'" fill="url(#'+gid+'g)"/>'
        : '<circle cx="'+x+'" cy="'+(H*0.44)+'" r="'+r.toFixed(1)+'" fill="#8fa3d9" opacity="0.92"/>';
      inner += '<text x="'+x+'" y="'+(H-14)+'" text-anchor="middle" fill="#c8d0ea" font-size="11.5" font-weight="700" style="paint-order:stroke" stroke="#0a0d18" stroke-width="3">'+esc((p.n||'').split(' ')[0])+'</text>';
    });
  } else {
    const KINDS = { constellation: 0, nebula: 1, orbit: 2 };
    const kind = (c.viz && KINDS[c.viz.type] !== undefined) ? KINDS[c.viz.type] : colSeed(c.title) % 3;
    if (kind === 0) {
      // 별자리 — 별들을 잇는 금색 선, 가장 밝은 별 하나
      const pts = []; for (let i = 0; i < 7; i++) pts.push([60 + rnd()*(W-120), 25 + rnd()*(H-50)]);
      pts.sort((a,b)=>a[0]-b[0]);
      inner += '<polyline points="'+pts.map(p=>p[0].toFixed(0)+','+p[1].toFixed(0)).join(' ')+'" fill="none" stroke="#d4a63f" stroke-opacity="0.55" stroke-width="1.3"/>';
      pts.forEach((p,i)=>{ inner += '<circle cx="'+p[0].toFixed(0)+'" cy="'+p[1].toFixed(0)+'" r="'+(i===3?5:2.6)+'" fill="'+(i===3?'url(#'+gid+'g)':'#e6ebfa')+'"/>'; });
    } else if (kind === 1) {
      // 성운 — 겹치는 발광 타원
      const cols2 = ['#5a4a9e','#2e6d8a','#9c7a3a'];
      for (let i = 0; i < 3; i++)
        inner += '<ellipse cx="'+(W*(0.25+rnd()*0.5)).toFixed(0)+'" cy="'+(H*(0.3+rnd()*0.4)).toFixed(0)+'" rx="'+(120+rnd()*160).toFixed(0)+'" ry="'+(40+rnd()*50).toFixed(0)+'" fill="'+cols2[i]+'" opacity="0.22" transform="rotate('+((rnd()*40-20).toFixed(0))+')"/>';
      inner += '<circle cx="'+(W*0.5+((rnd()-0.5)*200)).toFixed(0)+'" cy="'+(H*0.5).toFixed(0)+'" r="4.5" fill="url(#'+gid+'g)"/>';
    } else {
      // 궤도 — 상승하는 행성
      for (let i = 1; i <= 4; i++)
        inner += '<ellipse cx="'+(W*0.28)+'" cy="'+(H*0.5)+'" rx="'+(i*72)+'" ry="'+(i*26)+'" fill="none" stroke="#4a5578" stroke-opacity="0.5" stroke-width="0.9" stroke-dasharray="1 6"/>';
      inner += '<circle cx="'+(W*0.28)+'" cy="'+(H*0.5)+'" r="17" fill="url(#'+gid+'g)"/>';
      inner += '<circle cx="'+(W*0.28 + 216)+'" cy="'+(H*0.5 - 55)+'" r="9" fill="#8fa3d9"/>';
      inner += '<path d="M '+(W*0.28+150)+' '+(H*0.72)+' Q '+(W*0.28+200)+' '+(H*0.45)+' '+(W*0.28+212)+' '+(H*0.5-48)+'" fill="none" stroke="#d4a63f" stroke-opacity="0.6" stroke-width="1.4" stroke-dasharray="3 4"/>';
    }
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+defs+inner+'</svg>';
}

/* ── 시차 관측 — 버핏 멀티플 괴리 (측정층: data/buffett.json) ──
   괴리 = 정당 MAX ÷ P/E − 1. 양수 = 정당선 아래. 판단층은 사람이 취재한 config. */
const PX_SKIP = ['too_hard', 'unlisted', 'float'];
const PX_BASIS = { forward: '선행', trailing: '후행 참고', '미취재': '미취재',
                   too_hard: '추정불가', unlisted: '비상장', float: '플로트형' };
const PX_ZONES = ['탐색', '본격', '관망', '고평가'];

/* 존 판정은 선행(forward)으로 잰 종목만 — 정당 MAX 가 선행 눈금이라
   후행 P/E 를 같은 자에 대면 전부 고평가로 쏠린다. 후행은 참고 수치로만 싣는다. */
function pxZoned(x){
  return x.zoned === true || (x.zoned === undefined && x.basis === 'forward');
}

function pxZone(gap, z){
  if (gap == null) return null;
  if (gap >= z.explore) return '탐색';
  if (gap >= z.commit) return '본격';
  if (gap >= 0) return '관망';
  return '고평가';
}

function pxSpark(series){
  if (!series || series.length < 2) return '';   // 2점 미만이면 선을 그리지 않는다
  const W = 86, H = 22, P = 2;
  const gs = series.map(p => p.gap);
  const mn = Math.min(...gs), mx = Math.max(...gs), span = (mx - mn) || 1;
  const pts = series.map((p, i) => {
    const x = P + (W - 2 * P) * (i / (series.length - 1));
    const y = H - P - (H - 2 * P) * ((p.gap - mn) / span);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  const rising = gs[gs.length - 1] >= gs[0];
  return '<svg class="px-spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<polyline points="' + pts + '" fill="none" stroke="' + (rising ? 'var(--gold)' : 'var(--text-muted)') +
    '" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function pxPct(g){ return (g >= 0 ? '+' : '') + (g * 100).toFixed(0) + '%'; }

/* 유형 용어집 — 표를 읽기 전에 자(尺)의 눈금을 먼저 설명한다 */

    '쓴 증축비는 고작 3,200만 달러 — 보통 건물이면 4억 달러짜리 공사였다. 건물주가 할 일은 가격표를 새로 붙이는 것뿐.</dd>' +

  '<dt>⚠ 정점 주의</dt><dd>시클리컬 전용 경고등. 정점 이익으로 나눈 P/E는 바닥처럼 보이는 천장이다 — ' +
    '하이닉스가 4.8배로 "가장 싸 보이는" 순간이 사이클의 꼭대기일 수 있다. 표의 배지가 이것.</dd>' +
  '</dl></details>';

/* 배지 툴팁은 용어집 '⚠ 정점 주의' 항목과 같은 문장을 쓴다 — 두 곳이 어긋나면 안 된다 */
const PX_PEAK_TIP = '시클리컬 전용 경고등. 정점 이익으로 나눈 P/E는 바닥처럼 보이는 천장이다 — ' +
  '하이닉스가 4.8배로 "가장 싸 보이는" 순간이 사이클의 꼭대기일 수 있다.';

function pxRow(x, z, hist){
  const zoned = pxZoned(x);
  const zone = zoned ? pxZone(x.gap, z) : null;   // 후행은 존을 매기지 않는다
  let cls = 'none', txt = '—';
  if (x.gap != null) {
    txt = pxPct(x.gap);
    cls = !zoned ? 'cold'
      : (zone === '탐색' || zone === '본격') ? 'hot'
      : (zone === '고평가') ? 'cold' : '';
  }
  const pe = x.pe != null ? x.pe.toFixed(1) : '—';
  return '<tr>' +
    '<td><div class="px-tk">' + esc(x.ticker) + '</div>' +
      '<div class="px-name">' + esc(x.name) + '</div></td>' +
    '<td class="px-type">' + esc(x.type) + '</td>' +
    '<td class="px-num">' + pe +
      '<span class="px-basis">' + esc(PX_BASIS[x.basis] || x.basis) + '</span>' +
      (x.eps_asof ? '<div class="px-eps">EPS ' + esc(x.eps_asof) + '</div>' : '') +
      (x.note ? '<div class="px-eps">' + esc(x.note) + '</div>' : '') + '</td>' +
    '<td class="px-num">' + (x.fair_max != null ? x.fair_max : '—') + '</td>' +
    '<td><span class="px-gap ' + cls + '">' + txt + '</span>' +
      (x.cyclical ? '<span class="px-peak" title="' + esc(PX_PEAK_TIP) + '">⚠ 정점 주의</span>' : '') +
      (zone ? '<div class="px-zonetag">' + zone + '</div>' : '') +
      pxSpark(hist[x.ticker]) + '</td>' +
    '<td class="px-why">' + esc(x.rationale) + '</td>' +
  '</tr>';
}

function renderParallax(){
  const b = (DATA.buffett) || {};
  const items = b.items || [];
  const host = document.getElementById('obsBody');
  if (!items.length) {
    host.innerHTML = '<div class="obs-note">시차 관측 준비 중 — 첫 측정이 끝나면 이곳에 괴리가 실립니다.</div>';
    return;
  }
  const z = b.zones || { explore: 0.60, commit: 0.40 };
  const hist = b.history || {};
  const basket = items.filter(x => PX_SKIP.indexOf(x.basis) >= 0);
  const board = items.filter(x => PX_SKIP.indexOf(x.basis) < 0)
    .sort((a, c) => (c.gap == null ? -Infinity : c.gap) - (a.gap == null ? -Infinity : a.gap));
  const measured = board.filter(x => x.gap != null);
  const zonedItems = measured.filter(pxZoned);      // 존 집계는 선행만

  let html = '<div class="px-notice"><b>버핏 프레임의 관측 실험입니다 — 투자 권유가 아닙니다.</b> ' +
    '정당 멀티플(정당 MAX)은 검증된 수치가 아니라 <b>주관적 추정</b>이며, 괴리는 그 추정에 오늘 시세를 대입한 ' +
    '산술 결과일 뿐입니다. 정당 MAX는 <b>선행</b> 눈금으로 매긴 자이므로, 존 판정과 아래 집계는 선행 기준으로 ' +
    '측정한 종목만 셉니다 — 후행(실적 EPS) 수치는 같은 자에 댈 수 없어 <b>참고 수치</b>로만 싣습니다. ' +
    'EPS 추정 기준일은 표에 함께 적었습니다. 어떤 항목도 매수·매도 신호가 아닙니다.</div>';

  html += '<div class="px-asof">판단층 기준일 ' + esc(b.asof || '—') +
    ' · 측정 ' + esc(b.generated_label || '—') + ' KST · 매일 3회 자동 측정 (예약 full) · ' +
    '탐색선 +' + Math.round(z.explore * 100) + '% / 본격선 +' + Math.round(z.commit * 100) + '%</div>';

  html += '<div class="px-strip">' + PX_ZONES.map(n => {
    const c = zonedItems.filter(x => pxZone(x.gap, z) === n).length;
    const on = (n === '탐색' || n === '본격') && c > 0;
    return '<div class="px-zone' + (on ? ' on' : '') + '">' +
      '<div class="z-name">' + n + (n === '탐색' ? ' +' + Math.round(z.explore * 100) + '%↑'
        : n === '본격' ? ' +' + Math.round(z.commit * 100) + '%↑' : '') + '</div>' +
      '<div class="z-n">' + c + '<span style="font-size:12px;font-weight:700">종</span></div></div>';
  }).join('') + '</div>' +
  '<div class="px-stripnote"><b>존 판정은 비시클리컬·선행 기준만.</b> 집계 대상 ' + zonedItems.length + '종 — ' +
  '나머지 ' + (measured.length - zonedItems.length) + '종(후행 참고 · 시클리컬)은 눈금이 달라 존을 매기지 않습니다.</div>';

  html += PX_GLOSSARY;

  html += '<div class="px-wrap"><table class="px-table"><thead><tr>' +
    '<th>티커</th><th>유형</th><th>P/E</th><th>정당 MAX</th><th>괴리</th><th>근거</th>' +
    '</tr></thead><tbody>' +
    board.map(x => pxRow(x, z, hist)).join('') + '</tbody></table></div>';

  if (basket.length) {
    // 사유 설명은 실제로 담긴 바구니만 말한다 — 없는 사유를 적어두면 표와 어긋난다
    const reasons = { too_hard: '10년 뒤 월세를 적을 수 없는 별(추정불가)',
                      float: '매력이 월세가 아니라 보증금인 별(플로트형)',
                      unlisted: '시세 자체가 없는 별(비상장)' };
    const present = Object.keys(reasons).filter(k => basket.some(x => x.basis === k))
      .map(k => reasons[k]).join(', ');
    html += '<div class="px-hard"><div class="px-hard-title">too hard 바구니 — ' + basket.length + '종</div>' +
      '<div class="px-hard-desc">낙제가 아니라 원칙입니다. ' + present + ' — 이 자로는 재지 않습니다. ' +
      '재지 못한다는 사실을 적어두는 것이 억지로 숫자를 만드는 것보다 정직합니다.</div>' +
      '<div class="px-wrap"><table class="px-table"><thead><tr>' +
      '<th>티커</th><th>유형</th><th>사유</th><th>근거</th></tr></thead><tbody>' +
      basket.map(x => '<tr><td><div class="px-tk">' + esc(x.ticker) + '</div>' +
        '<div class="px-name">' + esc(x.name) + '</div></td>' +
        '<td class="px-type">' + esc(x.type) + '</td>' +
        '<td class="px-type">' + esc(PX_BASIS[x.basis] || x.basis) + '</td>' +
        '<td class="px-why">' + esc(x.rationale) + '</td></tr>').join('') +
      '</tbody></table></div></div>';
  }
  host.innerHTML = html;
}

  return Math.ceil((due - now) / 86400000);
