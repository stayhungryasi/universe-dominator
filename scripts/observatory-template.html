    h += '<div class="pc-body ag-body" id="pcRepBody">' + (sec ? TXB('<h3>' + C(sec.title) + '</h3>' + sec.html) : '<p class="pc-sub">' + T('pc.rep.pick') + ' · ' + C(rep.title) + '</p>') + '</div></div>';
    return h;
  }
  function pChangelog(openId){
    return (D.changelog || []).map((c, i) => '<details class="ag-run" id="pc-cl-' + H(c.id) + '"' + ((openId ? openId === c.id : i === 0) ? ' open' : '') + '><summary>' + C(c.title) + '</summary><div class="ag-body">' + TXB(c.html) + '</div></details>').join('') || '<div class="pc-sub">' + T('pc.cl.none') + '</div>';
  }
  function pSources(){
    return '<div class="pc-wrap"><table class="pc-tbl"><thead><tr><th>' + T('pc.src.domain') + '</th><th>' + T('pc.src.doc') + '</th><th>' + T('pc.src.date') + '</th><th>' + T('pc.src.n') + '</th></tr></thead><tbody>' +
      (D.sources || []).map(s => '<tr><td>' + H(s.domain) + '</td><td><button type="button" class="pc-cell" data-pc-open="sources" data-pc-id="' + H(s.id) + '">' + C(s.name || s.url.slice(0, 60)) + '</button></td><td>' + H(s.date || '—') + '</td><td>' + s.n + '</td></tr>').join('') + '</tbody></table></div>';
  }
  const RENDER = { milestones: pMilestones, events: pEvents, fin: pFin, scen: pScen, report: pReport, changelog: pChangelog, sources: pSources };

  function showPanel(id, opt){
    if (!RENDER[id]) id = 'milestones';
    cur = id; safeSet(id);
    root.querySelectorAll('.pc-seg').forEach(b => b.setAttribute('aria-selected', String(b.dataset.pcPanel === id)));
    $('pcPanel').innerHTML = RENDER[id](opt || '');
    $('pcPanel').setAttribute('aria-label', (D.panels.find(p => p.id === id) || {}).ko || id);
  }

  /* ── 서랍 ── */
  function itemsOf(kind){
    if (kind === 'milestones') return (D.milestones || []).filter(m => (!mf.axis || m.axis === mf.axis) && (!mf.status || m.cls === mf.status) && (!mf.year || String(m.year) === mf.year));
    if (kind === 'events') return (D.events || []).filter(e => !evKind || e.kindKo === evKind);
    if (kind === 'sources') return D.sources || [];
    if (kind === 'triggers') return D.triggers || [];
    if (kind === 'fin') { const out = []; (D.fin.rows || []).forEach(r => r.cells.forEach((c, i) => out.push({ id: r.id + '|' + i }))); return out; }
    return [];
  }
  function dMilestone(m){
    const parts = (m.parts || []).map(p => '<div class="pc-pp"><span>' + C(p.label) + ' <span class="pc-sub">(' + H(p.op) + ' ' + fmtN(p.tgt, p.unit) + ')</span></span><b>' +
      (p.cur == null ? '—' : fmtN(p.cur, p.unit)) + ' · ' + pct(p.pct) + '</b>' + bar(p.pct) + (p.reason ? '<span class="pc-sub" style="grid-column:1/-1">' + C(p.reason) + '</span>' : '') + '</div>').join('');
    return '<p><b style="color:var(--text)">' + C(m.text) + '</b></p><p><span class="pc-chip pc-st-' + m.cls + '" style="display:inline-block;width:auto">' + T('pc.st.' + m.cls) + '</span> · ' + H(m.axisKo) + ' · ' + T('pc.d.judge_year', {y: H(m.year)}) + ' · ' + T('pc.d.overall', {p: pct(m.pct)}) + '</p>' +
      '<h4>' + T('pc.d.cur_tgt') + '</h4><p>' + (m.cur == null ? '—' : C(m.cur)) + ' → ' + (m.tgt == null ? '—' : C(m.tgt)) + ' ' + C(m.unit) + (m.asof ? ' (' + H(m.asof) + ')' : '') + (m.reason ? '<br>' + C(m.reason) : '') + '</p>' +
      '<h4>' + T('pc.d.parts') + '</h4>' + (parts || '<p>—</p>') +
      '<h4>' + T('pc.d.hit') + '</h4><p>' + (m.hit ? C(m.hit) : '—') + '</p><h4>' + T('pc.d.miss') + '</h4><p>' + (m.miss ? C(m.miss) : '—') + '</p>' + (m.method ? '<h4>' + T('pc.d.method') + '</h4><p>' + C(m.method) + '</p>' : '') +
      '<h4>' + T('pc.d.source') + '</h4><p class="pc-src">' + link(m.source) + (m.meaningSrc ? '<br><span class="pc-sub">' + T('pc.d.meaning_src', {r: H(m.meaningSrc)}) + '</span>' : '') + '</p>' +
      '<h4>' + T('pc.d.history') + '</h4><p>' + ((m.history || []).map(x => H(x.run) + ' ' + (x.cls ? T('pc.st.' + x.cls) : C(x.status))).join(' → ') || '—') + '</p>';
  }
  function dEvent(e){
    const ax = (e.axes || []).map(k => ((D.axes || []).find(a => a.key === k) || {}).ko).filter(Boolean);
    return '<p><b style="color:var(--text)">' + C(e.title) + '</b></p><p>' + H(e.date) + ' · ' + H(e.kindKo) + ' · ' + C(e.source) + (e.form ? ' · ' + C(e.form) : '') + '</p>' +
      (e.note ? '<h4>' + T('pc.d.note') + '</h4><p>' + C(e.note) + '</p>' : '') +
      '<h4>' + T('pc.d.original') + '</h4><p class="pc-src">' + link(e.url) + '</p><h4>' + T('pc.d.axes') + '</h4><p>' + (H(ax.join(' · ')) || '—') + '</p>' +
      '<h4>' + T('pc.d.triggers') + '</h4><p>' + ((e.triggers || []).map(t => '<button type="button" class="pc-f" data-pc-open="triggers" data-pc-id="' + H(t) + '">' + H(t) + '</button>').join(' ') || '—') + '</p>';
  }
  function dTrigger(t){
    return '<p><b style="color:var(--text)">' + H(t.id) + ' ' + C(t.name) + '</b></p><p>' + H(t.when) + ' · ' + C(t.statusL || t.status) + '</p><h4>' + T('pc.d.expected') + '</h4><p>' + C(t.expected) + '</p>' +
      (t.check ? '<h4>' + T('pc.d.method') + '</h4><p>' + C(t.check) + '</p>' : '') + (t.note ? '<h4>' + T('pc.d.checklog') + '</h4><p>' + C(t.note) + '</p>' : '') + (t.prev ? '<h4>' + T('pc.d.prev') + '</h4><p>' + C(t.prev) + '</p>' : '');
  }
  function dFin(key){
    const [rid, ci] = key.split('|'), r = (D.fin.rows || []).find(x => x.id === rid);
    if (!r) return '—';
    const c = r.cells[Number(ci)], s = c.src || {};
    return '<p><b style="color:var(--text)">' + H(r.label) + ' · ' + H(D.fin.cols[Number(ci)]) + '</b></p><p style="font-size:20px;font-weight:800;color:var(--text)">' + H(c.t) + '</p>' +
      '<p><span class="pc-src-badge">' + H(s.originL || s.origin) + '</span></p>' +
      (s.form ? '<h4>' + T('pc.d.filing') + '</h4><p>' + H(s.form) + (s.filed ? ' · ' + T('pc.d.filed', {d: H(s.filed)}) : '') + '</p>' : (s.filed ? '<h4>' + T('pc.d.published') + '</h4><p>' + H(s.filed) + '</p>' : '')) +
      (s.concept ? '<h4>' + T('pc.d.concept') + '</h4><p>' + H(s.concept) + '</p>' : '') + (s.how ? '<h4>' + T('pc.d.how') + '</h4><p>' + C(s.how) + '</p>' : '') +
      '<h4>' + T('pc.d.source') + '</h4><p class="pc-src">' + (s.url ? link(s.url) : (s.originId === 'auto' ? link('https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001181412', T('pc.d.edgar')) : '—')) + '</p>';
  }
  function dSource(s){
    return '<p><b style="color:var(--text)">' + C(s.name || s.domain) + '</b></p><p class="pc-src">' + link(s.url) + '</p><p>' + H(s.domain) + (s.date ? ' · ' + H(s.date) : '') + ' · ' + T('pc.d.claims_n', {n: s.n}) + '</p>' +
      '<h4>' + T('pc.d.claims') + '</h4><ul style="padding-left:16px;margin:0">' + (s.claims || []).map(c => '<li><span class="pc-sub">' + C(c.where) + '</span><br>' + C(c.text) + '</li>').join('') + '</ul>';
  }
  function openDrawer(kind, id, fromHash){
    const list = itemsOf(kind);
    let idx = list.findIndex(x => x.id === id);
    let item = list[idx];
    if (!item && kind !== 'fin') { const all = kind === 'milestones' ? D.milestones : kind === 'events' ? D.events : kind === 'sources' ? D.sources : D.triggers; item = (all || []).find(x => x.id === id); }
    if (!item && kind !== 'fin') return false;
    dKind = kind; dList = list; dIdx = idx;
    const t = kind === 'milestones' ? T('pc.dt.milestone', {id: item.id}) : kind === 'events' ? T('pc.dt.event', {d: item.date}) : kind === 'sources' ? T('pc.dt.source') : kind === 'triggers' ? T('pc.dt.trigger', {id: item.id}) : T('pc.dt.fin');
    $('pcDrawerT').textContent = t;
    $('pcDrawerB').innerHTML = kind === 'milestones' ? dMilestone(item) : kind === 'events' ? dEvent(item) : kind === 'sources' ? dSource(item) : kind === 'triggers' ? dTrigger(item) : dFin(id);
    lastFocus = lastFocus || document.activeElement;
    $('pcDrawer').classList.add('open'); $('pcDrawer').setAttribute('aria-hidden', 'false'); $('pcScrim').hidden = false;
    $('pcDrawer').focus({ preventScroll: true });
    if (!fromHash) { const hsh = '#probe/' + kind + '/' + id; if (location.hash !== hsh) history.replaceState(null, '', hsh); }
    return true;
  }
  function closeDrawer(){
    $('pcDrawer').classList.remove('open'); $('pcDrawer').setAttribute('aria-hidden', 'true'); $('pcScrim').hidden = true;
    dKind = ''; if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true }); lastFocus = null;
    if (location.hash.indexOf('#probe/') === 0) history.replaceState(null, '', '#probe/' + cur);
  }
  function step(n){ if (!dKind || !dList.length) return; const i = (dIdx + n + dList.length) % dList.length; openDrawer(dKind, dList[i].id); }

  /* ── 검색 ── */
  function search(q){
    const toks = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const box = $('pcResults');
    if (!toks.length) { box.innerHTML = ''; return []; }
    const hits = (D.search || []).filter(it => { const hay = (it.title + ' ' + it.text + ' ' + (it.full || '')).toLowerCase(); return toks.every(t => hay.indexOf(t) >= 0); }).slice(0, 20);
    const re = new RegExp('(' + toks.map(reEsc).join('|') + ')', 'gi');
    const hl = s => H(s).replace(re, '<mark>$1</mark>');
    const ko = s => (UVX.lang !== 'ko' && HAN.test(s)) ? ' lang="ko" data-uvx-pending="1"' : '';
    box.innerHTML = hits.map((it, i) => '<button type="button" class="pc-res' + (i === 0 ? ' on' : '') + '" role="option" data-pc-anchor="' + H(it.anchor) + '"' + ko(it.title + it.text) + '><span class="pc-kind">' + H(it.kind) + '</span>' + hl(it.title) + '<small>' + hl(it.text.slice(0, 140)) + '</small></button>').join('') ||
      '<div class="pc-res">' + T('pc.search.none') + '</div>';
    return hits;
  }
  function toggleSearch(on){
    const s = $('pcSearch');
    s.hidden = on === undefined ? !s.hidden : !on;
    if (!s.hidden) { $('pcQ').focus(); $('pcQ').select(); }
  }
  function go(anchor){
    toggleSearch(false);
    location.hash = '#probe/' + anchor;
  }

  /* ── 딥링크 ── */
  function route(){
    const m = location.hash.match(/^#probe\/([^/]+)(?:\/(.+))?$/);
    if (!m) return false;
    let [, panel, id] = m; id = id ? decodeURIComponent(id) : '';
    if (panel === 'triggers') { if (cur === '') showPanel(safeGet() || 'milestones'); openDrawer('triggers', id, true); return true; }
    if (panel === 'report' && id) { const [r, s] = id.split(':'); repSel = { run: r, sec: s || '' }; showPanel('report'); scrollPanel(); return true; }
    if (panel === 'changelog') { showPanel('changelog', id); scrollPanel(); return true; }
    if (panel === 'fin') { showPanel('fin', id); if (id) { const row = $('pc-fin-' + id.split('|')[0]); if (row) row.scrollIntoView({ block: 'center' }); if (id.indexOf('|') > 0) openDrawer('fin', id, true); } else scrollPanel(); return true; }
    showPanel(panel);
    if (id && ['milestones', 'events', 'sources'].includes(panel)) {
      if (panel === 'events') { const el = $('pc-' + id); if (el) { el.classList.add('on'); el.scrollIntoView({ block: 'center' }); } }
      openDrawer(panel, id, true);
    } else scrollPanel();
    return true;
  }
  function scrollPanel(){ const el = root.querySelector('.pc-segs'); if (el) el.scrollIntoView({ behavior: reduce() ? 'auto' : 'smooth', block: 'start' }); }

  /* ── 이벤트 ── */
  function onClick(ev){
    const t = ev.target.closest('[data-pc-go],[data-pc-open],[data-pc-panel],[data-pc-mf],[data-pc-ek],[data-pc-evmore],[data-pc-run],[data-pc-sec],[data-pc-anchor],[data-pc-step]');
    if (!t || !root.contains(t)) { if (ev.target.id === 'pcScrim') closeDrawer(); return; }
    const ds = t.dataset;
    if (ds.pcGo) { if (ds.pcAxis !== undefined) mf = { axis: ds.pcAxis, status: '', year: '' }; showPanel(ds.pcGo, ds.pcRow || ''); if (ds.pcRow) { const r = $('pc-fin-' + ds.pcRow); if (r) r.scrollIntoView({ block: 'center' }); } else scrollPanel(); return; }
    if (ds.pcOpen) { openDrawer(ds.pcOpen, ds.pcId); return; }
    if (ds.pcPanel) { showPanel(ds.pcPanel); history.replaceState(null, '', '#probe/' + ds.pcPanel); return; }
    if (ds.pcMf) { mf[ds.pcMf] = ds.v; showPanel('milestones'); return; }
    if (ds.pcEk !== undefined) { evKind = ds.pcEk; evMore = false; showPanel('events'); return; }
    if (ds.pcEvmore) { evMore = true; showPanel('events'); return; }
    if (ds.pcRun) { repSel = { run: ds.pcRun, sec: '' }; showPanel('report'); return; }
    if (ds.pcSec) { repSel.sec = ds.pcSec; showPanel('report'); history.replaceState(null, '', '#probe/report/' + repSel.run + ':' + ds.pcSec); const b = $('pcRepBody'); if (b) b.scrollIntoView({ behavior: reduce() ? 'auto' : 'smooth', block: 'start' }); return; }
    if (ds.pcAnchor) { go(ds.pcAnchor); return; }
    if (ds.pcStep) step(Number(ds.pcStep));
  }
  function active(){ return root && document.body.contains(root) && root.offsetParent !== null; }
  function onKey(ev){
    if (!active()) return;
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName || '')) || ev.target.isContentEditable;
    if (ev.key === 'Escape') { if (dKind) { closeDrawer(); ev.preventDefault(); } else if (!$('pcSearch').hidden) toggleSearch(false); return; }
    if (typing) {
      if (ev.target.id === 'pcQ' && ev.key === 'Enter') { const f = $('pcResults').querySelector('.pc-res.on[data-pc-anchor]'); if (f) go(f.dataset.pcAnchor); ev.preventDefault(); }
      return;
    }
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.key === '/') { toggleSearch(true); ev.preventDefault(); return; }
    if (dKind && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) { step(ev.key === 'ArrowRight' ? 1 : -1); ev.preventDefault(); return; }
    const n = Number(ev.key);
    if (n >= 1 && n <= panelIds().length) { const id = panelIds()[n - 1]; showPanel(id); history.replaceState(null, '', '#probe/' + id); }
  }
  let bound = false;
  function init(){
    D = (typeof DATA !== 'undefined' && DATA.probe) || null;
    R = (typeof DATA !== 'undefined' && DATA.probe_reports) || [];
    root = $('pcRoot');
    if (!D || !root) return;
    root.addEventListener('click', onClick);
    $('pcScrim').addEventListener('click', closeDrawer);
    $('pcDrawerX').addEventListener('click', closeDrawer);
    $('pcSearchBtn').addEventListener('click', () => toggleSearch());
    let tm = null;
    $('pcQ').addEventListener('input', e => { clearTimeout(tm); const v = e.target.value; tm = setTimeout(() => search(v), 80); });
    if (!bound) { document.addEventListener('keydown', onKey); window.addEventListener('hashchange', () => { if (active()) route(); }); bound = true; }
    cur = '';
    if (!route()) showPanel(safeGet() || 'milestones');
  }
  return { init, search, reEsc, route };
})();

/* 🛰 무인 탐사선 — 본문은 **빌드 시점에 이미 필터를 통과한 정적 HTML** 이다.
   여기서 판단층 파일을 fetch 하지 않는다: 클라이언트가 원문을 긁을 수 있으면
   준법 필터가 있으나 마나다. 이 함수는 만들어진 것을 꽂기만 한다. */
function renderAgent(){
  const host = document.getElementById('obsBody');
  const html = DATA.agent || '';
  host.innerHTML = html ||
    '<div class="obs-note">' + T('obs.agent_empty') + '</div>';
  // 옛 공유 링크(#agent-2026-09)는 관제실 보고서 패널로 옮겨 연다
  const h = location.hash.replace('#', '');
  if (h.indexOf('agent-') === 0) history.replaceState(null, '', '#probe/report/' + h.slice(6) + ':s0');
  if (html) PC.init();
  const tb = document.querySelector('.obs-tabs');
  if (tb && html && location.hash.indexOf('#probe/') !== 0) tb.scrollIntoView({block: 'start'});
}

/* i18n-keys: col.* */
function renderColumns(){
  const cols = (DATA.columns || []);
  if (!cols.length) { document.getElementById('obsBody').innerHTML =
    '<div class="obs-note">' + T('col.empty') + '</div>'; return; }
  // 아코디언 — 연표가 먼저, 전문은 클릭. 기본은 최신 1편만 펼침.
  // 비주얼(col-viz)은 detail 안으로 들어간다: 접힌 목록은 날짜·유형·제목만 남아야
  // '언제 무슨 관측이 있었나'라는 시간의 축이 보인다.
  // 목차 — 필독 해부실의 '해부 목록'을 그대로 쓴다(공용 .ud-index-*, 신규 CSS 없음).
  // 링크라서 클릭하면 해시가 바뀌고, 기존 해시 처리기(openFromHash)가 펼치고 스크롤한다
  // — 이미 뿌려진 #log-{colSeed} 공유 링크와 같은 경로다.
  // 앵커(colSlug)는 **원문 제목·날짜**로 만든다(c.slug) — 번역 제목으로 만들면 언어마다 공유 링크가 갈라진다.
  const toc = '<div class="ud-index"><div class="ud-index-title">' + T('col.toc', {n: cols.length}) + '</div>' +
    cols.map(c => '<a class="ud-index-row" href="#' + colSlug(c) + '">' +
      '<span class="ud-index-date">' + esc(c.date) + '</span>' +
      TX(c.title) + '</a>').join('') + '</div>';
  document.getElementById('obsBody').innerHTML = toc + cols.map((c, i) => {
    const open = (i === 0);
    return '<div class="col-card ud-acc'+(open?' open':'')+'" id="col-'+i+'" data-log="'+colSlug(c)+'">'+
      '<button class="ud-acc-head" onclick="toggleCol('+i+')" aria-expanded="'+open+'" aria-controls="colbody-'+i+'">'+
        '<span class="ud-acc-meta">'+
          '<span class="col-date">'+esc(c.date)+'</span>'+
          '<span class="col-kind">'+esc(colKind(c))+'</span>'+
        '</span>'+
        '<span class="ud-acc-title">'+TX(c.title)+'</span>'+
        '<span class="ud-acc-caret" aria-hidden="true">▸</span>'+
      '</button>'+
      '<div class="ud-acc-detail" id="colbody-'+i+'">'+
        '<div class="col-summary">'+TX(c.summary)+'</div>'+
        '<div class="col-viz">'+makeColViz(c)+'</div>'+
        '<div class="col-share">'+
          '<button onclick="copyColLink(event,'+i+')">🔗 '+T('col.copy_link')+'</button>'+
          '<button onclick="copyColText(event,'+i+')">📄 '+T('col.copy_text')+'</button>'+
          dissectBtn(c)+
        '</div>'+
        '<div class="col-body">'+TXB(c.body)+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
  openFromHash();
}

// 칼럼 유형 표식 — 고정 위치에서 종류가 한눈에 잡히게. 유형(signal·weekly·deep)은 빌드가
// 원문 제목에서 판정해 c.kind 로 싣는다(번역 제목으로 판정하지 않는다).
// 이모지는 넣지 않는다: 신호 칼럼 제목이 이미 📡 로 시작해 두 번 찍힌다.
function colKind(c){
  const k = (c && c.kind) || ((((c && c.title) || '').indexOf('📡') === 0) ? 'signal' : 'deep');
  return T('col.kind.' + k);
}

// 🔬 해부실 연결 — 이 칼럼의 원문이 해부돼 있을 때만 버튼을 만든다.
// DATA.dissected = {원문 URL: 해부 id} (build_site.py가 translations.json에서 주입)
function dissectBtn(c){
  const id = c && c.url && (DATA.dissected || {})[c.url];
  if (!id) return '';
  return '<a class="dx-jump" href="research.html#dx-' + esc(id) + '" onclick="event.stopPropagation()"'+
    ' title="' + esc(T('col.dissect_tip')) + '">🔬 ' + T('col.dissect') + ' →</a>';
}

function colSlug(c){ return c.slug || ('log-' + colSeed((c.title || '') + (c.date || ''))); }

function colUrl(c){
  return location.origin + location.pathname.replace(/[^/]*$/, '') + 'observatory.html#' + colSlug(c);
}

async function copyToClip(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch(e) { window.prompt(T('col.copy_prompt'), text.slice(0, 2000)); return; }
  if (btn) { const orig = btn.textContent; btn.textContent = '✓ ' + T('col.copied'); setTimeout(() => { btn.textContent = orig; }, 1500); }
}

function copyColLink(ev, i){
  ev.stopPropagation();
  copyToClip(colUrl((DATA.columns || [])[i]), ev.target);
}

function copyColText(ev, i){
  ev.stopPropagation();
  const c = (DATA.columns || [])[i];
  const tmp = document.createElement('div'); tmp.innerHTML = c.body;
  tmp.querySelectorAll('svg, .col-chart').forEach(n => n.remove());
  tmp.querySelectorAll('h3').forEach(n => { n.textContent = '\n■ ' + n.textContent + '\n'; });
  const text = 'UNIVERTRIX ' + T('obs.tab.columns') + ' — ' + c.title + ' (' + c.date + ')\n' + colUrl(c) + '\n' +
    (tmp.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
  copyToClip(text, ev.target);
}

function setColOpen(card, open){
  if (!card) return;
  card.classList.toggle('open', open);
  const head = card.querySelector('.ud-acc-head');
  if (head) head.setAttribute('aria-expanded', String(open));
}
// 목차 클릭은 해시를 바꾼다 — 같은 처리기가 펼치고 스크롤한다 (경로를 둘로 만들지 않는다)
window.addEventListener('hashchange', openFromHash);

function openFromHash(){
  const h = location.hash.replace('#', '');
  if (!h.startsWith('log-')) return;
  const card = document.querySelector('.col-card[data-log="' + h + '"]');
  if (!card) return;
  // 링크로 들어온 편이 접혀 있으면 그 링크는 제 일을 못 한 것이다
  setColOpen(card, true);
  setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
}
// 독립 토글 — 두 관측을 나란히 놓고 비교해 읽을 수 있게 (기존 단일 모드에서 변경)
function toggleCol(i){
  const el = document.getElementById('col-'+i);
  if (el) setColOpen(el, !el.classList.contains('open'));
}

if (location.hash === '#agent' || location.hash.indexOf('#agent-') === 0 || location.hash.indexOf('#probe') === 0) {
  const btn = document.querySelector('.obs-tab[data-t="agent"]');
  if (btn) setObsTab('agent', btn); else renderAgent();
} else if (location.hash === '#legend') {
  const btn = document.querySelector('.obs-tab[data-t="legend"]');
  if (btn) setObsTab('legend', btn); else renderLegend();
} else if (location.hash === '#parallax') {
  const btn = document.querySelector('.obs-tab[data-t="parallax"]');
  if (btn) setObsTab('parallax', btn); else renderParallax();
} else if (location.hash && (location.hash.indexOf('#log-') === 0 || location.hash === '#columns')) {
  const btn = document.querySelector('.obs-tab[data-t="columns"]');
  if (btn) setObsTab('columns', btn); else renderColumns();
} else {
  renderSolar();
}
</script>
