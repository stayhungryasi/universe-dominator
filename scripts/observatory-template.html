<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{t:obs.title}}</title>
<meta name="description" content="{{t:obs.meta_desc}}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root, [data-theme="light"] {
  --bg: #FAF6EC; --bg-card: #FFFFFF; --header-bg: rgba(250, 246, 236, 0.95);
  --text: #1A2438; --text-secondary: #525F7E; --text-muted: #8590AA;
  --gold: #9C7A3A; --gold-bg: #F0E6CC;
  --line: #E8DFC9; --line-strong: #C9BC9A;
}
[data-theme="dark"] {
  --bg: #0A0E14; --bg-card: #1C2330; --header-bg: rgba(10, 14, 20, 0.95);
  --text: #FFFFFF; --text-secondary: #B5BFD6; --text-muted: #6F7E9E;
  --gold: #D4A658; --gold-bg: #2A2519;
  --line: #2A3142; --line-strong: #3A4458;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard Variable', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  font-feature-settings: 'tnum', 'ss01'; line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  min-height: 100vh; display: flex; flex-direction: column;
}
.container { max-width: 720px; margin: 0 auto; padding: 0 20px; width: 100%; }

.site-header { background: var(--header-bg); border-bottom: 1px solid var(--line); }
.site-header-inner { max-width: 720px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; color: var(--text); }
.brand a { text-decoration: none; color: inherit; display: flex; gap: 8px; align-items: center; }
.brand-star { color: var(--gold); }
.brand-tag { font-size: 13px; font-weight: 500; color: var(--text-muted); }
.header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.update-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: var(--gold-bg);
  border-radius: 100px; font-size: 12px; font-weight: 700;
  color: var(--gold); font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .update-badge { border: 1px solid rgba(212,166,88,0.3); }
.update-badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); animation: pulse 2s ease-in-out infinite;
}
[data-theme="dark"] .update-badge::before { box-shadow: 0 0 8px var(--gold); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.rate-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 12px; background: var(--bg-card);
  border: 1px solid var(--line); border-radius: 100px;
  font-size: 12px; font-weight: 700; color: var(--text-secondary);
  font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.rate-badge:hover { border-color: var(--gold); }
.rate-badge:hover #usdKrwDisplay, .rate-badge:hover .rate-badge-arrow { color: var(--gold); }
.rate-badge-arrow { font-size: 10px; margin-left: 2px; color: var(--text-muted); opacity: 0.7; transition: color 0.2s, opacity 0.2s; }
.rate-badge:hover .rate-badge-arrow { opacity: 1; }
.rate-badge #usdKrwDisplay { color: var(--text); font-weight: 800; }
@media (max-width: 480px) { .rate-badge { font-size: 11px; padding: 5px 10px; } .update-badge { font-size: 11px; padding: 5px 10px; } }
@media (max-width: 380px) { .update-badge::before { display: none; } }

.theme-toggle {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--bg-card);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
}
.theme-toggle svg { width: 18px; height: 18px; }
.icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: none; }
[data-theme="dark"] .icon-sun { display: inline; }

.site-nav { position: sticky; top: 0; z-index: 50; background: var(--header-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
.site-nav-inner { max-width: 720px; margin: 0 auto; display: flex; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
.site-nav-inner::-webkit-scrollbar { display: none; }
.nav-tab { flex-shrink: 0; padding: 14px 18px; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-muted); text-decoration: none; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
.nav-tab:hover { color: var(--text-secondary); }
.nav-tab.active { color: var(--text); border-bottom-color: var(--gold); }

main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 0; }

.placeholder-card {
  text-align: center;
  padding: 56px 32px;
  border: 1px dashed var(--line-strong);
  border-radius: 16px;
  background: var(--bg-card);
  max-width: 480px;
  width: 100%;
}
.placeholder-icon { font-size: 56px; margin-bottom: 16px; }
.placeholder-eyebrow {
  font-size: 11px; font-weight: 800; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
}
.placeholder-title {
  font-size: 30px; font-weight: 800; letter-spacing: -0.03em;
  color: var(--text); margin-bottom: 12px;
}
.placeholder-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.6; }
.placeholder-note { font-size: 12px; color: var(--text-muted); margin-top: 18px; }

.site-footer { padding: 24px 0 40px; border-top: 1px solid var(--line); text-align: center; }
.footer-brand { display: flex; justify-content: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text-secondary); }
.footer-link { color: var(--text-secondary); text-decoration: none; font-weight: 700; }
.footer-link:hover { color: var(--gold); }
.footer-divider { color: var(--text-muted); font-weight: 400; }

@media (max-width: 480px) { .nav-tab { padding: 12px 14px; font-size: 13px; } .placeholder-title { font-size: 24px; } }

/* ── 데이터 천문대 ── */
.obs-hero { padding: 36px 0 6px; }
.obs-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.14em; color: var(--gold); }
.obs-title { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 6px; }
.obs-desc { font-size: 14.5px; color: var(--text-secondary); margin-bottom: 18px; }
.obs-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
.obs-tab { padding: 9px 18px; border-radius: 100px; border: 1px solid var(--line); background: var(--bg-card); font-size: 13.5px; font-weight: 700; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
.obs-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.solar-wrap { background: #10141f; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; position: relative; }
.solar-wrap svg { display: block; width: 100%; height: auto; }
.solar-legend { font-size: 12px; color: var(--text-muted); margin-top: 10px; text-align: center; }
.solar-tip { position: absolute; pointer-events: none; background: rgba(20,25,40,0.95); color: #f5f1e6; border: 1px solid #9C7A3A; border-radius: 10px; padding: 8px 12px; font-size: 12.5px; display: none; max-width: 220px; z-index: 5; }
.solar-tip b { color: #d4b06a; }
.pl { cursor: pointer; }
.pl:hover { stroke: #ffd873; stroke-width: 2px; }
.col-viz { border-radius: 10px; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--line); line-height: 0; }
.col-viz svg { width: 100%; height: auto; display: block; }
/* 카드 구조·동작은 공용 .ud-acc-* (build_site 의 ud-accordion-v1). 여기엔 눈금만.
   동행 관측 에세이와 같은 문법을 쓴다 — 같은 것을 두 벌 구현하지 않는다. */
.col-card .ud-acc-title { font-size: 19px; line-height: 1.4; letter-spacing: -0.02em; }
.col-card .ud-acc-meta { font-size: 12px; font-weight: 800; letter-spacing: 0.04em; }
.col-date { color: var(--gold); }
.col-kind { color: var(--text-muted); }
.col-summary { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 14px; }
.col-body { font-size: 14.5px; line-height: 1.85; }
@media (max-width: 480px) { .col-card .ud-acc-title { font-size: 17px; } }
.col-chart { margin: 16px 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); line-height: 0; }
.col-chart svg { width: 100%; height: auto; display: block; }
.col-share { display: flex; gap: 8px; margin: 0 0 14px; }
.col-share button { padding: 6px 13px; border-radius: 100px; border: 1px solid var(--line); background: var(--bg); font-size: 12px; font-weight: 700; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
.col-share button:hover { border-color: var(--gold); color: var(--gold); }
/* 🔬 해부실 연결 버튼 — 복사 버튼과 같은 형태, 강조는 골드 테두리로 */
.col-share .dx-jump { display: inline-flex; align-items: center; padding: 6px 13px; border-radius: 100px; border: 1px solid var(--gold); background: var(--bg); font-size: 12px; font-weight: 800; color: var(--gold); text-decoration: none; white-space: nowrap; }
.col-share .dx-jump:hover { background: var(--gold); color: #fff; }
@media (max-width: 480px) { .col-share { flex-wrap: wrap; } }
.col-body h3 { font-size: 15.5px; margin: 18px 0 6px; color: var(--gold); }
.col-body p { margin: 0 0 10px; }
.map-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.map-chip { padding: 7px 13px; border-radius: 100px; border: 1px solid var(--line); background: var(--bg-card); font-size: 12.5px; font-weight: 700; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
.map-chip:hover { border-color: var(--gold); }
.map-chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.map-wrap { background: #10141f; border: 1px solid var(--line); border-radius: 16px; padding: 10px; position: relative; }
.map-grid { position: relative; width: 100%; height: 740px; }
.map-tile { position: absolute; overflow: hidden; border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #eef2ff; cursor: pointer; transition: filter 0.12s, box-shadow 0.12s; background-image: radial-gradient(circle at 32% 26%, rgba(255,255,255,0.09), rgba(0,0,0,0.12)); }
.map-tile:hover { filter: brightness(1.18); box-shadow: 0 0 0 1.5px #d4a63f, 0 0 14px rgba(212,166,63,0.35); z-index: 3; }
.map-tile .tk { font-weight: 800; line-height: 1.1; text-shadow: 0 1px 2px rgba(0,0,0,0.35); max-width: 96%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map-tile .pc { font-weight: 700; opacity: 0.9; }
.map-head { position: absolute; font-size: 10.5px; font-weight: 800; color: #8a94b8; letter-spacing: 0.06em; padding: 2px 4px; z-index: 2; text-shadow: 0 1px 2px #10141f; }
.map-legend { display: flex; justify-content: center; align-items: center; gap: 2px; margin-top: 10px; font-size: 11px; color: var(--text-muted); }
.map-legend span { padding: 3px 9px; border-radius: 4px; color: #fff; font-weight: 700; }
.obs-note { background: var(--bg-card); border: 1px dashed var(--line-strong); border-radius: 14px; padding: 40px 24px; text-align: center; color: var(--text-muted); font-size: 14px; }
/* ── 시차 관측 (버핏 멀티플 괴리) ── */
.px-notice { background: var(--bg-card); border: 1px solid var(--gold); border-radius: 14px; padding: 15px 19px; margin-bottom: 16px; font-size: 12.5px; line-height: 1.75; color: var(--text-secondary); }
.px-notice b { color: var(--gold); font-weight: 800; }
.px-asof { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
.px-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.px-stripnote { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.6; }
.px-zone { flex: 1 1 130px; background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; }
.px-zone .z-name { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--text-muted); }
.px-zone .z-n { font-size: 21px; font-weight: 800; margin-top: 2px; }
.px-zone.on { border-color: var(--gold); }
.px-zone.on .z-n { color: var(--gold); }
/* 유형 용어집 — 기본 펼침 */
.px-gloss { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 20px 6px; margin-bottom: 16px; }
.px-gloss > summary { cursor: pointer; font-size: 13.5px; font-weight: 800; padding: 12px 0; list-style: none; color: var(--text); }
.px-gloss > summary::-webkit-details-marker { display: none; }
.px-gloss > summary::before { content: '▾ '; color: var(--gold); font-weight: 800; }
.px-gloss:not([open]) > summary::before { content: '▸ '; }
.px-gloss dl { margin: 0 0 8px; }
.px-gloss dt { font-size: 13px; font-weight: 800; color: var(--gold); margin-top: 12px; }
.px-gloss dd { margin: 3px 0 0; font-size: 13px; line-height: 1.7; color: var(--text-secondary); }
.px-wrap { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; overflow-x: auto; }
.px-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.px-table th { text-align: left; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: var(--text-secondary); border-bottom: 1.5px solid var(--line-strong); padding: 13px 10px; white-space: nowrap; }
.px-table td { border-bottom: 1px solid var(--line); padding: 15px 10px; vertical-align: top; }
.px-table tr:last-child td { border-bottom: 0; }
.px-tk { font-weight: 800; white-space: nowrap; font-size: 14.5px; }
.px-name { font-size: 12.5px; color: var(--text-secondary); font-weight: 600; margin-top: 1px; }
.px-type { font-size: 13.5px; color: var(--text-secondary); }
.px-num { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 14.5px; font-weight: 700; }
.px-basis { display: inline-block; font-size: 11px; font-weight: 800; border-radius: 100px; padding: 2px 8px; border: 1px solid var(--line-strong); color: var(--text-secondary); margin-left: 5px; }
.px-eps { font-size: 12px; color: var(--text-secondary); margin-top: 4px; font-weight: 600; }
.px-gap { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 17px; }
.px-gap.hot { color: var(--gold); }
.px-gap.cold { color: var(--text-muted); }
.px-gap.none { color: var(--text-muted); font-weight: 700; }
.px-zonetag { font-size: 11.5px; font-weight: 700; color: var(--text-secondary); margin-top: 3px; }
.px-peak { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 800; white-space: nowrap;
  border: 1px solid var(--line-strong); border-radius: 100px; padding: 2px 8px; color: var(--text-muted); cursor: help; }
.px-spark { display: block; width: 86px; height: 22px; margin-top: 5px; }
.px-why { font-size: 13px; color: var(--text-secondary); line-height: 1.7; min-width: 230px; }
.px-hard { margin-top: 20px; }
.px-hard-title { font-size: 15px; font-weight: 800; margin-bottom: 3px; }
.px-hard-desc { font-size: 12.5px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.6; }
/* 레전드벤치마크 — 시차 관측의 자산(.px-*)을 그대로 쓰고, 여기서만 필요한 것만 더한다.
   새 색은 만들지 않는다: 양수는 액센트(--gold), 음수·미검정은 그라파이트(--text-muted). */
.lg-rates { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 16px; margin-bottom: 14px; font-size: 13.5px; color: var(--text-secondary); }
.lg-rates .r-k { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--text-muted); }
.lg-rates .r-v { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); }
.lg-rates .r-bar { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--gold); }
.lg-rates .r-sep { color: var(--line-strong); }
.lg-badge { display: inline-block; margin-left: 5px; font-size: 11px; font-weight: 800;
  white-space: nowrap; border: 1px solid var(--line-strong); border-radius: 100px;
  padding: 2px 8px; color: var(--text-muted); cursor: help; }
.lg-pos { color: var(--gold); }
.lg-neg { color: var(--text-muted); }
.lg-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; font-weight: 600; }
/* origin 표식 — 자동값에만 붙는다. 사람 값은 표식 없음이 곧 표식이다.
   신규 색을 만들지 않는다: 뮤트 텍스트 + 기존 테두리 토큰만 쓴다. */
.lg-auto { display: inline-block; margin-left: 5px; font-size: 10.5px; font-weight: 800;
  color: var(--text-muted); border: 1px solid var(--line-strong); border-radius: 100px;
  padding: 1px 6px; vertical-align: middle; cursor: help; }
.lg-zonetag { font-weight: 800; white-space: nowrap; font-size: 14.5px; }
.lg-watch { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px;
  padding: 15px 19px; margin: 16px 0; }
.lg-watch-title { font-size: 13.5px; font-weight: 800; margin-bottom: 8px; }
.lg-watch ul { margin: 0; padding-left: 18px; }
.lg-watch li { font-size: 13px; line-height: 1.85; color: var(--text-secondary); }
.lg-watch b { color: var(--gold); font-weight: 800; }
/* 존 요약 스트립 — 시차 관측의 .px-zone 을 그대로 쓰고 클릭만 얹는다 */
.px-zone.lg-pick { cursor: pointer; }
.px-zone .z-sub { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-top: 2px; }
.px-zone.lg-pick:hover { border-color: var(--gold); }
.px-zone.lg-on { border-color: var(--gold); }
.px-zone.lg-on .z-n { color: var(--gold); }
.lg-fold { width: 100%; text-align: left; margin-top: 14px; padding: 12px 16px;
  border: 1px dashed var(--line-strong); border-radius: 12px; background: var(--bg-card);
  font-family: inherit; font-size: 13.5px; font-weight: 800; color: var(--text-secondary);
  cursor: pointer; }
.lg-fold:hover { color: var(--text); }
.lg-price { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 800; }
/* 해부창 — 행을 누르면 그 아래 한 칸이 열린다. 새 색 없이 카드 배경만 쓴다. */
.px-table tr.lg-clickable { cursor: pointer; }
.px-table tr.lg-clickable:hover td { background: var(--bg-card); }
.lg-open td { padding-top: 0; padding-bottom: 0; }
.lg-dissect { padding: 14px 12px 18px; font-size: 13px; line-height: 1.8;
  color: var(--text-secondary); }
.lg-calc { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--text);
  background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 10px; overflow-x: auto; white-space: nowrap; }
.lg-fields { display: grid; grid-template-columns: 108px 1fr; gap: 4px 12px; }
.lg-fk { font-size: 12px; font-weight: 800; color: var(--text-muted); }
.lg-fv { font-size: 12.5px; }
@media (max-width: 480px) { .lg-fields { grid-template-columns: 92px 1fr; } }
.lg-gapto { font-size: 12px; color: var(--text-muted); font-weight: 700; margin-top: 2px; }
@media (max-width: 480px) {
  .lg-c-price { max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
}
/* 레전드 표 전용 고정 판형(2026-09-29 우측 잘림 수리) — .px-table 이 auto 판형이라 긴 비고가
   ROE·전환율 칸을 넓혀 버핏존을 px-wrap 밖으로 밀어냈다. 칸 폭은 colgroup 비율이 정하고
   셀 내용은 칸 안에서 줄바꿈한다. **모든 규칙은 .lg-table 로 한정** — 시차 관측 표는 공용
   .px-table 그대로다(공용 CSS 오염 금지). */
.px-table.lg-table { table-layout: fixed; }
.px-table.lg-table th, .px-table.lg-table td { overflow-wrap: anywhere; }
.px-table.lg-table th, .px-table.lg-table td.px-num, .px-table.lg-table .px-tk { white-space: normal; }
.px-table.lg-table .lg-price, .px-table.lg-table .lg-zonetag { white-space: nowrap; }

.pc-toc button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--text-secondary); font: inherit; font-size: 12.5px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }

.pc-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); z-index: 60; background: var(--bg-card); border-left: 1px solid var(--line-strong); box-shadow: -16px 0 40px rgba(0,0,0,.18); transform: translateX(105%); transition: transform .22s ease; display: flex; flex-direction: column; }
.pc-drawer.open { transform: none; }
.pc-scrim { position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.25); }
.pc-drawer-h { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.pc-drawer-t { flex: 1; font-size: 13px; font-weight: 800; color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-nav, .pc-x { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px; width: 30px; height: 28px; font: inherit; cursor: pointer; }
.pc-drawer-b { padding: 12px 16px 24px; overflow: auto; font-size: 13px; line-height: 1.7; color: var(--text-secondary); }
.pc-drawer-b h4 { font-size: 12px; font-weight: 800; color: var(--text); margin: 14px 0 4px; }
.pc-drawer-b a { color: var(--gold); word-break: break-all; }
.pc-pp { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 6px 0; }
.pc-pp .pc-bar { grid-column: 1 / -1; }
.pc-src-badge { display: inline-block; font-size: 10.5px; font-weight: 800; color: var(--gold); border: 1px solid var(--gold); border-radius: 999px; padding: 0 7px; margin-right: 6px; }
@media (max-width: 760px) {

     있었다(2026-09-29 실측). 레전드 표는 가로 스크롤로 전부 보여 준다. 고정 판형에서

<script>
const DATA = {{OBS_DATA}};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let solarRAF = null;

const OBS_DATA_TABS = ['columns', 'parallax', 'legend', 'agent'];
function setObsTab(t, btn){
  document.querySelectorAll('.obs-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  // 데이터 탭은 첫 화면에 내용을 담아야 한다 — 히어로를 접고 탭 바를 위로 붙인다(태양계·우주지도 제외)
  document.body.classList.toggle('obs-data', OBS_DATA_TABS.indexOf(t) >= 0);
  document.body.classList.toggle('pc-on', t === 'agent');
  // 한 줄 스크롤 탭 바(모바일)에서 고른 탭이 화면 밖에 있으면 보이게 — 세로 스크롤은 건드리지 않는다
  const bar = btn.parentNode;
  if (bar && bar.scrollWidth > bar.clientWidth) {
    const l = btn.offsetLeft - bar.offsetLeft, r = l + btn.offsetWidth;
    if (l < bar.scrollLeft || r > bar.scrollLeft + bar.clientWidth) bar.scrollLeft = Math.max(0, l - 16);
  }
  cleanupSolar();
  if (t === 'solar') renderSolar();
  else if (t === 'map') renderMap();
  else if (t === 'parallax') renderParallax();
  else if (t === 'legend') renderLegend();
  else if (t === 'agent') renderAgent();
  else renderColumns();
}

/* ── 오늘의 태양계 ── */
const FLAG_COLOR = { '🇺🇸': ['#a9bcf0','#5b74c4'], '🇹🇼': ['#7fe0cc','#2e9d87'], '🇰🇷': ['#ffd88a','#c99544'],
  '🇸🇦': ['#9fe89f','#4d9e4d'], '🇨🇳': ['#f2a0a0','#c05555'], '🇳🇱': ['#f0c9a0','#c48a4e'], '🇯🇵': ['#f0a9c8','#c45b8a'] };
const flagColor = f => FLAG_COLOR[f] || ['#c3b8f0','#7a6cc4'];

/* 짧은 이름 — 언어별 고유명사(삼성전자·엑슨모빌 등)는 이름 사전(data/i18n/names.json)이 UVX.short 로 싣는다 */
const SHORT_NAME = Object.assign({'GOOG':'Google','GOOGL':'Google','BRK-B':'Berkshire','2222.SR':'Aramco',
  'TSM':'TSMC','SPCX':'SpaceX','JPM':'JPMorgan',
  'LLY':'Eli Lilly','JNJ':'J&J','V':'Visa','MA':'Mastercard','MU':'Micron','AVGO':'Broadcom'}, UVX.short || {});
function shortName(s){
  if (SHORT_NAME[s.ticker]) return SHORT_NAME[s.ticker];
  let n = (s.name || '').replace(/\s*\(.*\)/, '').split(' ')[0];
  return (n && n.length <= 11) ? n : (n ? n.slice(0, 11) : s.ticker);
}

/* ══════════ 오늘의 태양계 — 진짜 3D (WebGL/Three.js) ══════════ */
let solar3d = null;  // {renderer, raf} 정리용

function loadThree(){
  return new Promise((res, rej) => {
    if (window.THREE) return res();
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    s.onload = () => res(); s.onerror = () => rej(new Error('three.js load failed'));
    document.head.appendChild(s);
  });
}

function cleanupSolar(){
  if (solar3d) {
    cancelAnimationFrame(solar3d.raf);
    try { solar3d.renderer.dispose(); } catch(e){}
    solar3d = null;
  }
  if (solarRAF) { cancelAnimationFrame(solarRAF); solarRAF = null; }
}

function renderSolar(){
  const stocks = (DATA.earth || []).slice(0, 20);
  if (!stocks.length) { document.getElementById('obsBody').innerHTML = '<div class="obs-note">' + T('obs.wait_data') + '</div>'; return; }
  document.getElementById('obsBody').innerHTML =
    '<div class="solar-wrap" id="s3wrap" style="height:' + (window.innerWidth < 700 ? 480 : 640) + 'px;position:relative;cursor:grab;touch-action:none">' +
      '<div id="s3load" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a94b8;font-size:14px;font-weight:700;z-index:4;background:#0a0d18">' + T('solar.loading') + '</div>' +
      '<div id="s3labels" style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>' +
      '<div class="solar-tip" id="solarTip"></div>' +
      '<div style="position:absolute;left:12px;bottom:10px;font-size:11px;color:#8a94b8;pointer-events:none">' + (('ontouchstart' in window) ? T('solar.hint_touch') : T('solar.hint_mouse')) + '</div>' +
    '</div>' +
    '<div class="solar-legend">' + T('solar.legend3d') + '</div>' +
    '<div class="solar-legend" style="margin-top:4px">' + T('solar.redrawn', {date: esc(DATA.fetched||'')}) + '</div>';
  loadThree().then(() => boot3d(stocks)).catch(() => renderSolarSVG());
}

/* 절차적 텍스처 — 코드로 만드는 행성 표면 */
function glowTex(color){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0, color); gr.addColorStop(0.35, color.replace(')',',0.45)').replace('rgb','rgba'));
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
function _hex(h){ const n = parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
const __texCache = {};
function planetTex(hi, lo, seed, rocky){
  const W = 256, Hh = 128;
  const c = document.createElement('canvas'); c.width = W; c.height = Hh;
  const g = c.getContext('2d');
  let s = (seed || 1) % 2147483646 + 1; const rnd = () => (s = (s*16807) % 2147483647) / 2147483647;
  const A = _hex(hi), B = _hex(lo);
  // 값 노이즈 (가로 순환 — 구에 감아도 이음매 없음)
  const GX = 32, GY = 17, grid = [];
  for (let i = 0; i < GX*GY; i++) grid.push(rnd());
  const gv = (x, y) => grid[(((y % GY) + GY) % GY) * GX + (((x % GX) + GX) % GX)];
  const sm = t => t*t*(3-2*t);
  const nz = (x, y) => { const x0 = Math.floor(x), y0 = Math.floor(y), fx = sm(x-x0), fy = sm(y-y0);
    return gv(x0,y0)*(1-fx)*(1-fy) + gv(x0+1,y0)*fx*(1-fy) + gv(x0,y0+1)*(1-fx)*fy + gv(x0+1,y0+1)*fx*fy; };
  const fbm = (x, y) => nz(x,y)*0.5 + nz(x*2.03, y*2.03)*0.28 + nz(x*4.1, y*4.1)*0.15 + nz(x*8.2, y*8.2)*0.07;
  const phase = rnd()*6.28, bands = 6 + Math.floor(rnd()*6);
  const img = g.createImageData(W, Hh), d = img.data;
  for (let y = 0; y < Hh; y++) {
    const v = y / Hh;
    const polar = 0.58 + 0.42*Math.sin(v*Math.PI);          // 극지방 어둡게
    for (let x = 0; x < W; x++) {
      const u = x / W;
      const n = fbm(u*GX*0.55, v*GY*0.55);
      let t;
      if (rocky) {
        t = n;                                               // 대륙형 얼룩
        t = t < 0.48 ? t*0.55 : 0.35 + (t-0.48)*1.35;
      } else {
        const warp = (fbm(u*GX*0.8 + 9.7, v*GY*0.8) - 0.5) * 0.16;  // 소용돌이 워프
        t = Math.sin((v + warp)*Math.PI*bands + phase)*0.5 + 0.5;    // 흐르는 줄무늬
        t = Math.pow(t, 1.25)*0.78 + n*0.22;
      }
      const i4 = (y*W + x) * 4;
      d[i4]   = (B[0] + (A[0]-B[0])*t) * polar;
      d[i4+1] = (B[1] + (A[1]-B[1])*t) * polar;
      d[i4+2] = (B[2] + (A[2]-B[2])*t) * polar;
      d[i4+3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  if (rocky) {  // 크레이터
    for (let i = 0; i < 30; i++) {
      const cx = rnd()*W, cy = Hh*0.12 + rnd()*Hh*0.76, r = rnd()*8 + 1.5;
      g.strokeStyle = 'rgba(8,10,20,0.35)'; g.lineWidth = 1.4;
      g.beginPath(); g.arc(cx, cy, r, 0, 6.3); g.stroke();
      g.fillStyle = 'rgba(255,255,255,0.10)';
      g.beginPath(); g.arc(cx - r*0.28, cy - r*0.28, r*0.55, 0, 6.3); g.fill();
    }
  } else if (rnd() > 0.45) {  // 대적점 폭풍
    const cx = rnd()*W, cy = Hh*(0.55 + rnd()*0.2);
    for (let k = 3; k >= 1; k--) {
      g.fillStyle = 'rgba(150,60,30,' + (0.10*k).toFixed(2) + ')';
      g.beginPath(); g.ellipse(cx, cy, 15*k, 7*k, -0.25, 0, 6.3); g.fill();
    }
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping;
  if (THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
  return t;
}
function ringTex(){
  const c = document.createElement('canvas'); c.width = 256; c.height = 1;
  const g = c.getContext('2d');
  let s = 99; const rnd = () => (s = (s*16807) % 2147483647) / 2147483647;
  for (let x = 0; x < 256; x++) {
    const a = (Math.sin(x*0.22)*0.5+0.5) * (0.25 + rnd()*0.5) * (x < 18 || x > 244 ? 0.15 : 1);
    g.fillStyle = 'rgba(216,201,160,' + a.toFixed(2) + ')';
    g.fillRect(x, 0, 1, 1);
  }
  return new THREE.CanvasTexture(c);
}
function milkyTex(){
  if (__texCache.milky) return __texCache.milky;
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#07090f'; g.fillRect(0, 0, 1024, 512);
  let s = 12345; const rnd = () => (s = (s*16807) % 2147483647) / 2147483647;
  // 은하수 띠 — 겹겹의 뿌연 발광 + 갈색 성간운
  for (let i = 0; i < 420; i++) {
    const t = i / 420, x = t*1024, y = 256 + Math.sin(t*Math.PI*2)*62 + (rnd()-0.5)*130;
    const r = rnd()*26 + 5;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    const warm = rnd() > 0.75;
    gr.addColorStop(0, warm ? 'rgba(185,135,90,0.12)' : 'rgba(175,190,235,0.12)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.3); g.fill();
  }
  // 대형 발광 성운 2점 (레퍼런스의 색 포인트)
  [[0.22, 0.38, 'rgba(210,120,60,0.16)', 150], [0.72, 0.6, 'rgba(110,140,230,0.13)', 180]].forEach(([fx, fy, col2, rr]) => {
    const gr2 = g.createRadialGradient(1024*fx, 512*fy, 0, 1024*fx, 512*fy, rr);
    gr2.addColorStop(0, col2); gr2.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr2; g.beginPath(); g.arc(1024*fx, 512*fy, rr, 0, 6.3); g.fill();
  });
  // 암흑 성운 줄기
  for (let i = 0; i < 70; i++) {
    const t = rnd(), x = t*1024, y = 256 + Math.sin(t*Math.PI*2)*56 + (rnd()-0.5)*46;
    g.fillStyle = 'rgba(5,6,10,0.16)';
    g.beginPath(); g.ellipse(x, y, rnd()*36+9, rnd()*9+3, rnd()*3, 0, 6.3); g.fill();
  }

      try { if (q.mesh.userData.realTex) throw 0;
        const key = q.seed + (q.rocky ? 'r' : 'g');
        const tex = __texCache[key] || (__texCache[key] = planetTex(q.hi, q.lo, q.seed, q.rocky));
        q.mesh.material.map = tex; q.mesh.material.bumpMap = tex;
        q.mesh.material.bumpScale = q.rocky ? 0.7 : 0.35;
        q.mesh.material.color.set(0xffffff);
        q.mesh.material.needsUpdate = true; } catch(e){}
    }
    // 진입 돌리 (2.2초) + 3초 무조작 시 자동 선회
    if (introT < 1) { introT = Math.min(1, introT + dt / 2200);
      const ease = 1 - Math.pow(1 - introT, 3);
      camDist = (introEnd + 490) - 490 * ease;
      camTheta += dt * 0.00018;
    } else if (!dragging && performance.now() - lastTouch > 3000) {
      camTheta += dt * 0.00006;
    }
    orbs.forEach(o => {
      o.a += o.s * dt * 0.06;
      o.mesh.position.set(Math.cos(o.a)*o.orbR, 0, Math.sin(o.a)*o.orbR);
      o.mesh.rotation.y += o.spin;
    });
    if (sunUni) sunUni.t.value = t * 0.001;
    const pulse = 1 + Math.sin(t/900)*0.05;
    glow1.scale.set(sunR*6.5*pulse, sunR*6.5*pulse, 1);
    camera.position.set(camDist*Math.sin(camPhi)*Math.cos(camTheta), camDist*Math.cos(camPhi), camDist*Math.sin(camPhi)*Math.sin(camTheta));
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    orbs.forEach(o => place(o.mesh, o.lab, o.r + 6));
    place(sunMesh, sunLab, sunR + 6);
    solar3d.raf = requestAnimationFrame(frame);
  }
  solar3d = { renderer, raf: requestAnimationFrame(frame) };
}

/* ── 우주 지도 (트리맵) ── */
function chgColor(chg){
  // 한국형 빛의 문법: 상승 = 금빛으로 타오름 · 하락 = 코발트로 얼어붙음 (한국 증시의 빨강/파랑 감각)
  if (chg === null || chg === undefined) return '#3a4157';
  const v = Math.max(-3, Math.min(3, chg)) / 3;
  const mix = (a, b, t) => Math.round(a + (b - a) * t);
  const base = [58, 65, 87];                          // 무풍 — 무채 슬레이트
  const to = v >= 0 ? [242, 186, 60] : [56, 110, 225]; // 발광 금빛 / 선명한 코발트
  const t = Math.pow(Math.abs(v), 0.72);
  return 'rgb(' + mix(base[0], to[0], t) + ',' + mix(base[1], to[1], t) + ',' + mix(base[2], to[2], t) + ')';
}
const chgText = chg => (chg !== null && chg >= 1.5) ? '#1c2333' : '#eef2ff';  // 밝은 금빛 위엔 남색 글씨

function squarify(items, x, y, w, h, out){
  // items: [{v, ...}] 내림차순 — 고전 squarified treemap
  if (!items.length) return;
  const total = items.reduce((s, i) => s + i.v, 0);
  let row = [], rest = items.slice(), best = Infinity;
  const vertical = w < h;
  const side = vertical ? w : h;
  while (rest.length) {
    const cand = row.concat([rest[0]]);
    const sum = cand.reduce((s, i) => s + i.v, 0);
    const area = sum / total * w * h;
    const thick = area / side;
    let worst = 0;
    cand.forEach(i => { const len = (i.v / sum) * side;
      worst = Math.max(worst, Math.max(thick / len, len / thick)); });
    if (worst <= best) { row = cand; rest.shift(); best = worst; }
    else break;
  }
  const sum = row.reduce((s, i) => s + i.v, 0);
  const thick = (sum / total * w * h) / side;
  let off = 0;
  row.forEach(i => {
    const len = (i.v / sum) * side;
    if (vertical) out.push({ ...i, x: x + off, y: y, w: len, h: thick });
    else out.push({ ...i, x: x, y: y + off, w: thick, h: len });
    off += len;
  });
  if (vertical) squarify(rest, x, y + thick, w, h - thick, out);
  else squarify(rest, x + thick, y, w - thick, h, out);
}

  const chips = [['all', T('map.all')], ['earth', '👑 ' + T('nav.home')], ['latent', '✦ ' + T('nav.latent')]]
    .concat(countries.map(g => ['g:' + g, flagOf(g) + ' ' + g]));
  const chipsHtml = '<div class="map-chips">' + chips.map(([k, label]) =>
    '<button class="map-chip' + (mapFilter === k ? ' active' : '') + '" onclick="setMapFilter(\'' + k + '\')">' + esc(label) + '</button>').join('') + '</div>';

  let tiles = all;
  if (mapFilter === 'earth') tiles = all.filter(t => t.e);
  else if (mapFilter === 'latent') tiles = all.filter(t => t.l);
  else if (mapFilter.startsWith('g:')) tiles = all.filter(t => t.g === mapFilter.slice(2));
  if (!tiles.length) tiles = all;
  const W = Math.min(document.getElementById('obsBody').clientWidth - 22, 1240) || 900, H = 740;
  // 국가 그룹: 시총 합 내림차순

  const glist = Object.values(groups).sort((a, b) => b.v - a.v);
  glist.forEach(g => g.items.sort((a, b) => b.v - a.v));
  // 1단계: 국가 블록 배치 → 2단계: 블록 내 종목 배치
  const gout = [];
  squarify(glist.map(g => ({ v: g.v, g })), 0, 0, W, H, gout);

    const inner = [];

      html += '<div class="map-head" style="left:' + (gb.x + 3) + 'px;top:' + gb.y + 'px">' + esc(gb.g.f + ' ' + T('map.cluster', {name: gb.g.name})) + '</div>';
    inner.forEach(t => {

      const big = t.w > 46 && t.h > 32, mid = t.w > 26 && t.h > 15;
      const fs = Math.max(8.5, Math.min(21, Math.sqrt(t.w * t.h) / 4.6, t.w / (label.length * 0.62)));
      html += '<div class="map-tile" style="left:' + (t.x + 1) + 'px;top:' + (t.y + 1) + 'px;width:' + Math.max(0, t.w - 2).toFixed(1) + 'px;height:' + Math.max(0, t.h - 2).toFixed(1) + 'px;background-color:' + chgColor(t.chg) + ';color:' + chgText(t.chg) + ';border-radius:' + (t.w > 40 ? 6 : 3) + 'px"' +
        ' data-tip="' + esc(t.n) + '|' + esc(t.f) + '|' + t.mc + '|' + (t.chg === null ? '' : t.chg) + '">' +
        (mid ? '<span class="tk" style="font-size:' + fs.toFixed(1) + 'px">' + esc(label) + '</span>' : '') +

  const wrap = document.querySelector('.map-wrap'), tip = document.getElementById('mapTip');
  wrap.addEventListener('mousemove', e => {
    const t = e.target.closest('.map-tile');
    if (t) {
      const [n, f, mc, chg] = t.dataset.tip.split('|');

  wrap.addEventListener('mouseleave', () => tip.style.display = 'none');

/* ── 관측일지 ── */
function colSeed(str){ let h = 2166136261;
  for (const ch of String(str||'')) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0; }

function makeColViz(c){
  const W = 800, H = 150;
  let seed = colSeed(c.title);
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let inner = '';
  const gid = 'cv' + colSeed(c.title) % 100000;
  let defs = '<defs><radialGradient id="'+gid+'sp" cx="50%" cy="30%" r="90%"><stop offset="0%" stop-color="#1b2244"/><stop offset="100%" stop-color="#0a0d18"/></radialGradient>' +
    '<radialGradient id="'+gid+'g"><stop offset="0%" stop-color="#ffd873"/><stop offset="60%" stop-color="#d4a63f"/><stop offset="100%" stop-color="#9c7a3a"/></radialGradient></defs>';
  inner += '<rect width="'+W+'" height="'+H+'" fill="url('+'#'+gid+'sp)"/>';
  for (let i = 0; i < 60; i++)
    inner += '<circle cx="'+(rnd()*W).toFixed(1)+'" cy="'+(rnd()*H).toFixed(1)+'" r="'+(rnd()*1.1+0.2).toFixed(2)+'" fill="#f5f1e6" opacity="'+(rnd()*0.5+0.15).toFixed(2)+'"/>';

  if (c.viz && c.viz.type === 'solar' && Array.isArray(c.viz.planets) && c.viz.planets.length) {
    // 주간 미니 태양계 — 그 주의 TOP 5 실데이터
    const ps = c.viz.planets.slice(0, 5);
    const maxMc = Math.max(...ps.map(p => p.mc || 1));
    const step = W / (ps.length + 1);
    ps.forEach((p, i) => {
      const x = step * (i + 1), r = 8 + Math.sqrt((p.mc || 1) / maxMc) * 26;
      inner += i === 0
        ? '<circle cx="'+x+'" cy="'+(H*0.44)+'" r="'+(r+6)+'" fill="url(#'+gid+'g)"/>'
        : '<circle cx="'+x+'" cy="'+(H*0.44)+'" r="'+r.toFixed(1)+'" fill="#8fa3d9" opacity="0.92"/>';
      inner += '<text x="'+x+'" y="'+(H-14)+'" text-anchor="middle" fill="#c8d0ea" font-size="11.5" font-weight="700" style="paint-order:stroke" stroke="#0a0d18" stroke-width="3">'+esc((p.n||'').split(' ')[0])+'</text>';
    });
  } else {
    const KINDS = { constellation: 0, nebula: 1, orbit: 2 };
    const kind = (c.viz && KINDS[c.viz.type] !== undefined) ? KINDS[c.viz.type] : colSeed(c.title) % 3;
    if (kind === 0) {
      // 별자리 — 별들을 잇는 금색 선, 가장 밝은 별 하나
      const pts = []; for (let i = 0; i < 7; i++) pts.push([60 + rnd()*(W-120), 25 + rnd()*(H-50)]);
      pts.sort((a,b)=>a[0]-b[0]);
      inner += '<polyline points="'+pts.map(p=>p[0].toFixed(0)+','+p[1].toFixed(0)).join(' ')+'" fill="none" stroke="#d4a63f" stroke-opacity="0.55" stroke-width="1.3"/>';
      pts.forEach((p,i)=>{ inner += '<circle cx="'+p[0].toFixed(0)+'" cy="'+p[1].toFixed(0)+'" r="'+(i===3?5:2.6)+'" fill="'+(i===3?'url(#'+gid+'g)':'#e6ebfa')+'"/>'; });
    } else if (kind === 1) {
      // 성운 — 겹치는 발광 타원
      const cols2 = ['#5a4a9e','#2e6d8a','#9c7a3a'];
      for (let i = 0; i < 3; i++)
        inner += '<ellipse cx="'+(W*(0.25+rnd()*0.5)).toFixed(0)+'" cy="'+(H*(0.3+rnd()*0.4)).toFixed(0)+'" rx="'+(120+rnd()*160).toFixed(0)+'" ry="'+(40+rnd()*50).toFixed(0)+'" fill="'+cols2[i]+'" opacity="0.22" transform="rotate('+((rnd()*40-20).toFixed(0))+')"/>';
      inner += '<circle cx="'+(W*0.5+((rnd()-0.5)*200)).toFixed(0)+'" cy="'+(H*0.5).toFixed(0)+'" r="4.5" fill="url(#'+gid+'g)"/>';
    } else {
      // 궤도 — 상승하는 행성
      for (let i = 1; i <= 4; i++)
        inner += '<ellipse cx="'+(W*0.28)+'" cy="'+(H*0.5)+'" rx="'+(i*72)+'" ry="'+(i*26)+'" fill="none" stroke="#4a5578" stroke-opacity="0.5" stroke-width="0.9" stroke-dasharray="1 6"/>';
      inner += '<circle cx="'+(W*0.28)+'" cy="'+(H*0.5)+'" r="17" fill="url(#'+gid+'g)"/>';
      inner += '<circle cx="'+(W*0.28 + 216)+'" cy="'+(H*0.5 - 55)+'" r="9" fill="#8fa3d9"/>';
      inner += '<path d="M '+(W*0.28+150)+' '+(H*0.72)+' Q '+(W*0.28+200)+' '+(H*0.45)+' '+(W*0.28+212)+' '+(H*0.5-48)+'" fill="none" stroke="#d4a63f" stroke-opacity="0.6" stroke-width="1.4" stroke-dasharray="3 4"/>';
    }
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+defs+inner+'</svg>';
}

/* ── 시차 관측 — 버핏 멀티플 괴리 (측정층: data/buffett.json) ──
   괴리 = 정당 MAX ÷ P/E − 1. 양수 = 정당선 아래. 판단층은 사람이 취재한 config. */
const PX_SKIP = ['too_hard', 'unlisted', 'float'];
/* 화면 이름은 전부 카탈로그(px.*)에서 — 이 구간에 한국어 상태값을 두지 않는다.
   유형·바구니는 빌드가 판단층 값에서 기계 id(type_id·basis_id)를 붙여 싣는다(build_site.buffett_view).
   i18n-keys: px.* */
const PX_ZONES = ['explore', 'commit', 'watch', 'over'];
function pxBasis(x){ return x.basis_id ? esc(T('px.basis.' + x.basis_id)) : TX(x.basis); }
function pxType(x){ return x.type_id ? esc(T('px.type.' + x.type_id)) : TX(x.type); }

/* 존 판정은 선행(forward)으로 잰 종목만 — 정당 MAX 가 선행 눈금이라
   후행 P/E 를 같은 자에 대면 전부 고평가로 쏠린다. 후행은 참고 수치로만 싣는다. */
function pxZoned(x){
  return x.zoned === true || (x.zoned === undefined && x.basis === 'forward');
}

function pxZone(gap, z){
  if (gap == null) return null;
  if (gap >= z.explore) return 'explore';
  if (gap >= z.commit) return 'commit';
  if (gap >= 0) return 'watch';
  return 'over';
}

function pxSpark(series){
  if (!series || series.length < 2) return '';   // 2점 미만이면 선을 그리지 않는다
  const W = 86, H = 22, P = 2;
  const gs = series.map(p => p.gap);
  const mn = Math.min(...gs), mx = Math.max(...gs), span = (mx - mn) || 1;
  const pts = series.map((p, i) => {
    const x = P + (W - 2 * P) * (i / (series.length - 1));
    const y = H - P - (H - 2 * P) * ((p.gap - mn) / span);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  const rising = gs[gs.length - 1] >= gs[0];
  return '<svg class="px-spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<polyline points="' + pts + '" fill="none" stroke="' + (rising ? 'var(--gold)' : 'var(--text-muted)') +
    '" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function pxPct(g){ return (g >= 0 ? '+' : '') + (g * 100).toFixed(0) + '%'; }

/* 배지 툴팁은 용어집 '⚠ 정점 주의' 항목과 같은 문장을 쓴다 — 두 곳이 어긋나면 안 된다
   (용어집 항목 = 이 문장 + 꼬리 한 문장) */
const PX_PEAK_TIP = T('px.peak_tip');

/* 유형 용어집 — 표를 읽기 전에 자(尺)의 눈금을 먼저 설명한다 */
const PX_GLOSSARY =
  '<details class="px-gloss" open><summary>' + T('px.gloss.title') + '</summary><dl>' +
  ['sees', 'toll', 'flight', 'cyclical', 'float', 'too_hard', 'uncovered'].map(k =>
    '<dt>' + T('px.gloss.' + k + '.dt') + '</dt><dd>' + T('px.gloss.' + k + '.dd') + '</dd>').join('') +
  '<dt>⚠ ' + T('px.peak') + '</dt><dd>' + PX_PEAK_TIP + ' ' + T('px.gloss.peak_tail') + '</dd>' +
  '</dl></details>';

function pxRow(x, z, hist){
  const zoned = pxZoned(x);
  const zone = zoned ? pxZone(x.gap, z) : null;   // 후행은 존을 매기지 않는다
  let cls = 'none', txt = '—';
  if (x.gap != null) {
    txt = pxPct(x.gap);
    cls = !zoned ? 'cold'
      : (zone === 'explore' || zone === 'commit') ? 'hot'
      : (zone === 'over') ? 'cold' : '';
  }
  const pe = x.pe != null ? UVX.dec(x.pe.toFixed(1)) : '—';
  return '<tr>' +
    '<td><div class="px-tk">' + esc(x.ticker) + '</div>' +
      '<div class="px-name">' + TX(x.name) + '</div></td>' +
    '<td class="px-type">' + pxType(x) + '</td>' +
    '<td class="px-num">' + pe +
      '<span class="px-basis">' + pxBasis(x) + '</span>' +
      (x.eps_asof ? '<div class="px-eps">EPS ' + TX(x.eps_asof) + '</div>' : '') +
      (x.note ? '<div class="px-eps">' + TX(lgNC(x.note_nc, x.note)) + '</div>' : '') + '</td>' +
    '<td class="px-num">' + (x.fair_max != null ? x.fair_max : '—') + '</td>' +
    '<td><span class="px-gap ' + cls + '">' + txt + '</span>' +
      (x.cyclical ? '<span class="px-peak" title="' + esc(PX_PEAK_TIP) + '">⚠ ' + T('px.peak') + '</span>' : '') +
      (zone ? '<div class="px-zonetag">' + T('px.zone.' + zone) + '</div>' : '') +
      pxSpark(hist[x.ticker]) + '</td>' +
    '<td class="px-why">' + TX(x.rationale) + '</td>' +
  '</tr>';
}

function renderParallax(){
  const b = (DATA.buffett) || {};
  const items = b.items || [];
  const host = document.getElementById('obsBody');
  if (!items.length) {
    host.innerHTML = '<div class="obs-note">' + T('px.empty') + '</div>';
    return;
  }
  const z = b.zones || { explore: 0.60, commit: 0.40 };
  const hist = b.history || {};
  const basket = items.filter(x => PX_SKIP.indexOf(x.basis) >= 0);
  const board = items.filter(x => PX_SKIP.indexOf(x.basis) < 0)
    .sort((a, c) => (c.gap == null ? -Infinity : c.gap) - (a.gap == null ? -Infinity : a.gap));
  const measured = board.filter(x => x.gap != null);
  const zonedItems = measured.filter(pxZoned);      // 존 집계는 선행만

  let html = '<div class="px-notice">' + T('px.notice_html') + '</div>';

  html += '<div class="px-asof">' + T('px.asof', {asof: esc(b.asof || '—'), label: esc(b.generated_label || '—'),
    e: Math.round(z.explore * 100), c: Math.round(z.commit * 100)}) + '</div>';

  html += '<div class="px-strip">' + PX_ZONES.map(n => {
    const c = zonedItems.filter(x => pxZone(x.gap, z) === n).length;
    const on = (n === 'explore' || n === 'commit') && c > 0;
    return '<div class="px-zone' + (on ? ' on' : '') + '">' +
      '<div class="z-name">' + T('px.zone.' + n) + (n === 'explore' ? ' +' + Math.round(z.explore * 100) + '%↑'
        : n === 'commit' ? ' +' + Math.round(z.commit * 100) + '%↑' : '') + '</div>' +
      '<div class="z-n">' + c + '<span style="font-size:12px;font-weight:700">' + T('px.unit', {n: c}) + '</span></div></div>';
  }).join('') + '</div>' +
  '<div class="px-stripnote">' + T('px.stripnote_html', {n: zonedItems.length, m: measured.length - zonedItems.length}) + '</div>';

  html += PX_GLOSSARY;

  html += '<div class="px-wrap"><table class="px-table"><thead><tr>' +
    '<th>' + T('px.th.ticker') + '</th><th>' + T('px.th.type') + '</th><th>P/E</th><th>' + T('px.th.fair') +
    '</th><th>' + T('px.th.gap') + '</th><th>' + T('px.th.why') + '</th>' +
    '</tr></thead><tbody>' +
    board.map(x => pxRow(x, z, hist)).join('') + '</tbody></table></div>';

  if (basket.length) {
    // 사유 설명은 실제로 담긴 바구니만 말한다 — 없는 사유를 적어두면 표와 어긋난다
    const present = ['too_hard', 'float', 'unlisted'].filter(k => basket.some(x => x.basis === k))
      .map(k => T('px.reason.' + k)).join(', ');
    html += '<div class="px-hard"><div class="px-hard-title">' + T('px.basket.title', {n: basket.length}) + '</div>' +
      '<div class="px-hard-desc">' + T('px.basket.desc', {reasons: present}) + '</div>' +
      '<div class="px-wrap"><table class="px-table"><thead><tr>' +
      '<th>' + T('px.th.ticker') + '</th><th>' + T('px.th.type') + '</th><th>' + T('px.th.reason') +
      '</th><th>' + T('px.th.why') + '</th></tr></thead><tbody>' +
      basket.map(x => '<tr><td><div class="px-tk">' + esc(x.ticker) + '</div>' +
        '<div class="px-name">' + TX(x.name) + '</div></td>' +
        '<td class="px-type">' + pxType(x) + '</td>' +
        '<td class="px-type">' + pxBasis(x) + '</td>' +
        '<td class="px-why">' + TX(x.rationale) + '</td></tr>').join('') +
      '</tbody></table></div></div>';
  }
  host.innerHTML = html;
}

/* ── 레전드벤치마크 (표시층) ──────────────────────────────────────────
   측정층 data/buffett.json 의 bench + 판단층에서 나른 DATA.legend 를 **표시만** 한다.
   여기서 새로 판정하지 않는다: 버핏존·쿠폰·ROE 는 측정층이 이미 매긴 값을 읽을 뿐이고,
   배지는 사람이 취재해 적어 넣은 칸(전환율·risk5·가드)을 그대로 비춘다. */
/* 존 이름 — 측정층의 기계 값(pass·prove_growth…)에서 화면 이름을 만든다(lg.zone.*).
   i18n-keys: lg.* nc.* */
/* 측정층 비고 — 코드(*_nc)가 있으면 그 언어 문장으로 만든다(fetch_buffett.render_nc 와 같은 규칙).
   코드가 없는 옛 측정값은 원문 문장(번역 전 — 화면이 원문 표식을 단다). */
function lgNC(nc, fallback){
  if (!Array.isArray(nc) || !nc.length) return fallback || '';
  return nc.map(p => {
    const code = p[0], prm = p[1] || {};
    if (code === '_raw') return String(prm.s || '');
    const q = {};
    Object.keys(prm).forEach(k => { q[k] = Array.isArray(prm[k]) ? prm[k].map(x => T('nc.item.' + x)).join('·') : prm[k]; });
    return T('nc.' + code, q);
  }).filter(Boolean).join(' · ');
}
const LG_ORDER = ['pass', 'prove_growth', 'bond_inferior', 'untested'];
function lgZoneName(k){ return T('lg.zone.' + (LG_ORDER.indexOf(k) >= 0 ? k : 'untested')); }
let lgFilter = null;        // 존 스트립 필터 (null = 전체)
let lgBlankOpen = false;    // 백지 그룹 접힘 상태 — 기본은 접힘
let lgOpenRow = null;       // 해부창이 열린 종목 (한 번에 하나)
/* 금리 라벨 — UST10·KTB10 은 원장 키(기계 이름)다. 화면 이름은 카탈로그(lg.rate.*)에서.
   한국·일본물은 아직 null 이라 안 뜨지만, 배선되는 날 같은 실수를 반복하지 않도록 함께 둔다. */
function lgRateName(k){ return T('lg.rate.' + String(k).toLowerCase()) || k; }

const LG_TIP = { pik: T('lg.tip.pik'), hard: T('lg.tip.hard'), peak: T('lg.tip.peak') };

/* 퍼센트 표기 — null 은 반드시 —. 0 으로 흘려보내지 않는다(못 잰 것과 0 은 다르다). */
function lgPct(v, digits){ return v == null ? '—' : UVX.dec((v * 100).toFixed(digits == null ? 1 : digits)) + '%'; }
function lgPp(v){ return v == null ? '—' : (v >= 0 ? '+' : '') + UVX.dec((v * 100).toFixed(1)) + 'p'; }

/* lg13f-begin — 버크셔 13F 다음 마감(순수 함수: 오늘 → {분기, 마감일, 남은 날}).
   13F 는 분기말 + 45일: 2/14(4분기분)·5/15(1분기분)·8/14(2분기분)·11/14(3분기분).
   마감일이 주말이면 월요일로, 연방 공휴일이면 다음 영업일로 민다(해당 월 공휴일만 최소 반영).
   2026-10-22 원천 대조 F4: 11/14 고정이었는데 2026-11-14 는 토요일 — 실제 마감은 11/16(월). */
function lg13F(today){
  const DUE = [[1, 14, 4], [4, 15, 1], [7, 14, 2], [10, 14, 3]];   // [월(0부터), 일, 대상 분기]
  const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const nth = (y, m, wd, n) => {           // m월의 n번째 wd요일
    const off = (wd - new Date(y, m, 1).getDay() + 7) % 7;
    return new Date(y, m, 1 + off + 7 * (n - 1));
  };
  const lastWd = (y, m, wd) => {           // m월의 마지막 wd요일
    const e = new Date(y, m + 1, 0);
    return new Date(y, m, e.getDate() - ((e.getDay() - wd + 7) % 7));
  };
  const holiday = d => {
    const y = d.getFullYear(), m = d.getMonth();
    const same = x => x.getMonth() === m && x.getDate() === d.getDate();
    if (m === 1) return same(nth(y, 1, 1, 3));                  // 대통령의 날: 2월 셋째 월요일
    if (m === 4) return same(lastWd(y, 4, 1));                  // 메모리얼 데이: 5월 마지막 월요일
    if (m === 10) {                                             // 재향군인의 날(대체 휴일)·추수감사절
      const v = new Date(y, 10, 11), w = v.getDay();
      const obs = w === 6 ? new Date(y, 10, 10) : w === 0 ? new Date(y, 10, 12) : v;
      return same(obs) || same(nth(y, 10, 4, 4));
    }
    return false;
  };
  const roll = d => {
    while (d.getDay() === 0 || d.getDay() === 6 || holiday(d)) {
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
    }
    return d;
  };
  for (let y = t0.getFullYear(); y <= t0.getFullYear() + 1; y++) {
    for (const [m, dd, q] of DUE) {
      const due = roll(new Date(y, m, dd));
      if (due >= t0) return { q: q, due: due, days: Math.round((due - t0) / 86400000) };
    }
  }
  return null;
}

/* 관찰 카드 한 줄 — 분기명·날짜·요일·D-day 를 전부 상태(lg13F)에서 만든다 */
function lg13FLine(today){
  const f = lg13F(today || new Date());
  if (!f) return '';
  const WD = T('lg.wd').split(',');
  const iso = f.due.getFullYear() + '-' + String(f.due.getMonth() + 1).padStart(2, '0') + '-' +
    String(f.due.getDate()).padStart(2, '0');
  const md = T('lg.md_wd', {md: UVX.md(iso), wd: WD[f.due.getDay()]});
  return T('lg.13f_line', {q: f.q, md: md, dday: f.days === 0 ? 'D-day' : 'D-' + f.days});
}
/* lg13f-end */

const LG_GLOSSARY =
  '<details class="px-gloss" open><summary>' + T('lg.gloss.title') + '</summary><dl>' +
  ['zone', 'pik', 'too_hard', 'pass_price'].map(k =>
    '<dt>' + T('lg.gloss.' + k + '.dt') + '</dt><dd>' + T('lg.gloss.' + k + '.dd') + '</dd>').join('') +
  '</dl></details>';

/* 비고 — 측정층의 note 문자열을 **그대로 뿌리지 않는다.**
   그 문장은 운영자·CI 로그를 위한 것이라 기계 필드명이 들어 있다.
   여기서는 그 문자열을 번역하는 게 아니라 **상태에서 다시 만든다**: 문자열을 매핑하면
   측정층이 새 사유를 추가하는 날 그 문장이 그대로 화면으로 새어 나온다.
   상태에서 만들면 모르는 상태는 빈 칸이 될지언정 내부 용어가 나갈 길이 없다. */
/* "자동" 라벨 — 그 칸을 기계가 채웠을 때만. 사람 값에는 아무 표식도 붙이지 않는다
   (표식이 없는 것이 사람이 적었다는 뜻이다). 자동값에 사람의 권위를 씌우지 않는 것이
   이 라벨의 존재 이유다 — 공시 추출·AI 판정은 틀릴 수 있고, 화면이 그 사실을 말해야 한다. */
/* 사업 확실성 ✕ — 판단층 유형에 '추정불가'가 들어 있거나(빌드가 uncertain 으로 싣는다) risk5 사업 확실성이 ✕ 인 종목.
   존(측정층)은 그대로 두고 **표시만** 가른다: 산술상 통과일 뿐 버핏 기준으론 추정 불가다(F6). */
function lgUncertain(x, j){
  return (x.uncertain === true || x.type_id === 'too_hard') || ((j || {}).cert === '✕');
}
const LG_ARITH_TIP = T('lg.tip.arith');
/* 상한 의존 — 가정 g 가 상한에 걸려 있다. 문구는 측정값(상한·요구 성장)에서 만든다 */
function lgCapTip(b){
  return T('lg.tip.cap', {g: lgPct(b.g_used, 0)}) +
    (b.required_g != null ? T('lg.tip.cap_req', {r: lgPct(b.required_g)}) : '');
}
const LG_WEAK_TIP = T('lg.tip.weak');
const LG_AUTO_TIP = T('lg.tip.auto');
function lgAuto(j, field){
  return ((j.origin || {})[field] === 'auto')
    ? '<span class="lg-auto" title="' + esc(LG_AUTO_TIP) + '">' + T('lg.auto') + '</span>' : '';
}

/* method 요약 — 어떤 자로 쟀는지 한 마디로. 원문 method 는 길고 태그명이 들어 있어
   그대로 쓰지 않는다(기계 필드명 화면 노출 금지 — 작업 규칙 8). 빌드가 method_id 를 붙인다. */
function lgMethodKo(j){
  return (j && j.method_id) ? T('lg.method.' + j.method_id) : '';
}

/* 정점 가드 — 쿠폰은 참고로 재되 존 판정만 보류한다(측정과 판정의 분리).
   근거 문장은 판단층 사람 칸에만 있다. 없으면 '미기재'라고 **상태에서** 말한다 —
   명단을 기계가 고치지 않는 대신, 근거가 비어 있다는 사실은 화면이 숨기지 않는다. */
function lgGuardNote(b, j){
  // 쿠폰이 안 섰으면 **무엇이 비어서**인지 이름으로 부른다(가드 탓으로 뭉개지 않는다)
  const miss = [];
  if (b.coupon10y == null) {
    if (b.eps_adj_ttm == null) miss.push(T('lg.miss.eps'));
    if (b.g_used == null) miss.push(T('lg.miss.g'));
  }
  const head = b.coupon10y != null
    ? T('lg.guard.ref', {c: lgPct(b.coupon10y)})
    : T('lg.guard.hold') + (miss.length ? T('lg.guard.nocoupon', {m: miss.join('·')}) : '');
  return head + (j.guard_reason ? '' : T('lg.guard.noreason'));
}

/* 버핏존 칸에는 존 + 경계 + 짧은 비고만. 값이 산출된 종목의 "기준 날짜·분기·출처" 줄은
   행 아래 비고 줄(lgBasisNote)로 간다 — 셀을 길게 늘려 칸을 넓히지 않게. */
function lgBasisNote(b, j){
  if (j.guard || b.guard || b.coupon10y == null) return '';
  const parts = [j.as_of, j.period].filter(Boolean);
  const how = lgMethodKo(j);
  if (how) parts.push(how);
  return parts.length ? T('lg.basis', {p: parts.join(' · ')}) : '';
}

function lgNote(b, j){
  if (j.guard || b.guard) return lgGuardNote(b, j);
  // 비영업 손익 왜곡 보류 — 측정층이 상태(비율)에서 만든 문장을 비춘다(F2)
  if (b.hold) return lgNC(b.note_nc, b.note);
  if (b.coupon10y != null) return '';             // 산출된 종목의 기준 줄은 비고 줄로
  // 이익 결측 사유는 측정층이 상태에서 만든 문장(eps_note)을 비춘다 — 플로트형·낡은 원장·
  // 수집 실패가 전부 '취재 대기' 한 줄로 뭉개지지 않게(legend-audit E)
  if (b.eps_adj_ttm == null) return lgNC(b.eps_note_nc, b.eps_note) || T('lg.note.eps_wait');
  if (b.g_used == null) return T('lg.note.g_wait');
  if (b.rate10y == null) return T('lg.note.rate_missing');
  return '';
}

/* 통과 가격 — "이 가격까지 내려오면 버핏존이 열린다".
   목표가가 아니라 지금 눈금(g 가정) 위의 산술이다. 1997 주주서한의 순매수자 관점:
   앞으로 살 사람에게 하락은 손실이 아니라 세일이다. 그 세일가를 미리 적어 두는 칸. */
function lgPassPrice(x, b){
  const pp = b.pass_price, cur = b.price;
  if (pp == null || cur == null || cur <= 0) return '<span class="lg-neg">—</span>';
  const cy = (x.currency === 'USD' || !x.currency) ? '$' : '';
  const tail = cy ? '' : ' ' + esc(x.currency || '');
  const money = cy + pp.toLocaleString(UVX.intl, {maximumFractionDigits: 2}) + tail;
  const diff = (pp - cur) / cur;
  if (b.zone_buffett === 'pass') {
    return '<span class="lg-price lg-pos">' + T('lg.pass_already') + '</span>' +
      '<div class="lg-gapto">' + T('lg.margin', {p: (diff * 100).toFixed(0)}) + '</div>';
  }
  return '<span class="lg-price">' + money + '</span>' +
    '<div class="lg-gapto">' + T('lg.vs_price', {p: (diff >= 0 ? '+' : '') + (diff * 100).toFixed(0)}) + '</div>';
}

/* 경계 — 판정선 가격에서 ±5% 안쪽. 판정을 바꾸지 않고 "선 위에 서 있다"는 사실만 말한다.
   문구는 측정층이 잰 상태(어느 선·여유 몇 %)에서 만든다. 선 이름을 매핑하는 게 아니라
   모르는 선이면 아무것도 적지 않는다 — 내부 이름이 화면으로 샐 길이 없다. */
const LG_LINES = ['pass', 'prove'];
function lgEdge(b){
  if (!b.borderline || b.edge_margin == null || LG_LINES.indexOf(b.edge_line) < 0) return '';
  const m = b.edge_margin, line = T('lg.line.' + b.edge_line);
  const txt = Math.abs(m) < 0.0005 ? T('lg.edge.eq', {line: line})
    : T(m > 0 ? 'lg.edge.above' : 'lg.edge.below', {line: line, p: UVX.dec((Math.abs(m) * 100).toFixed(1))});
  return '<span class="lg-auto" title="' + esc(T('lg.edge.tip')) + '">' + T('lg.edge.badge') + '</span>' +
    '<div class="lg-sub">' + esc(txt) + '</div>';
}

/* ROE 칸 — 값이 있으면 값과 출처 표식, 없으면 **왜 없는지**(측정층이 상태에서 만든
   roe_note 를 그대로 비춘다 — 여기서 사유를 다시 해석하면 규칙이 두 벌이 된다).
   ROE 는 있는데 그 시장 국채가 미배선이면 비교만 못 한 것이므로 ROE 자체는 보여 준다. */
const LG_UNADJ_TIP = T('lg.tip.unadj');
function lgRoeCell(b, j){
  const roe = b.roe_minus_2x10y;
  const tag = (b.roe_unadjusted
      ? '<span class="lg-auto" title="' + esc(LG_UNADJ_TIP) + '">' + T('lg.unadj') + '</span>' : '') +
    (b.roe_from_human ? '' : lgAuto(j, 'roe_tangible'));
  if (roe != null) return lgPp(roe) + tag;
  return '—';
}
/* ROE 칸의 원인 비고 — 셀이 아니라 **행 아래 비고 줄**로 보낸다. 긴 문장이 셀 안에 있으면
   그 칸이 넓어져 버핏존(결론)을 표 밖으로 밀어냈다(2026-09-29, 1090px 에서 절반 잘림). */
function lgRoeNote(b){
  if (b.roe_minus_2x10y != null) return '';
  if (b.roe_tangible != null) return T('lg.roe.norate', {r: lgPct(b.roe_tangible)});
  return lgNC(b.roe_note_nc, b.roe_note);
}

/* 계산 전개 — 결론만 보여주면 눈금을 못 되짚는다. 한 줄로 전 과정을 편다. */
function lgCalcLine(b){
  if (b.coupon10y == null || b.ey == null) return '';
  const bar = b.rate10y == null ? null : 3 * (b.rate10y / 100);
  return T('lg.calc', {ey: lgPct(b.ey), g: lgPct(b.g_used), c: lgPct(b.coupon10y), bar: lgPct(bar)});
}

/* 필드별 출처 — 취재 우선순위가 한눈에 보이게. 사람 값은 '취재', 자동은 '자동',
   빈 칸은 '—'. 무엇을 취재하면 이 종목이 판정에 이르는지가 이 표에서 읽힌다. */
const LG_FIELDS = ['eps_adj_ttm', 'roe_tangible', 'eps_adj_ttm_human', 'roe_tangible_human',
                   'g_forward', 'g_cagr3y', 'cagr3y_human', 'conversion', 'risk5', 'franchise',
                   'capalloc', 'owner_earnings'];
function lgOriginKo(v){ return v === 'human' ? T('lg.origin.human') : v === 'auto' ? T('lg.origin.auto') : '—'; }

function lgDissect(x, j){
  const b = x.bench || {};
  const og = j.origin || {};
  const calc = lgCalcLine(b);
  let h = '<div class="lg-dissect">';
  const guarded = j.guard || b.guard;
  if (guarded) h += '<div class="lg-sub">' + esc(lgGuardNote(b, j)) +
    (j.guard_reason ? T('lg.guard_reason') + TX(j.guard_reason) : '') + '</div>';
  if (calc && (guarded || b.hold)) h += '<div class="lg-calc">' + T('lg.calc_ref', {calc: esc(calc)}) + '</div>';
  else if (calc) h += '<div class="lg-calc">' + esc(calc) + '</div>';
  // 계산이 안 서면 **왜 안 서는지**를 그 자리에서 말한다. 측정층이 상태에서 만든
  // 문구(bench.note)를 그대로 비춘다 — 여기서 사유를 다시 해석하면 규칙이 두 벌이 되고,
  // 새 결측 상태가 생기는 날 화면만 옛말을 한다(2026-09-05 '10년물 없음' 오표기).
  else h += '<div class="lg-calc">' + T('lg.calc_none') +
    (b.note ? ' — ' + TX(lgNC(b.note_nc, b.note)) : T('lg.calc_none_hint')) + '</div>';
  h += '<div class="lg-fields">';
  LG_FIELDS.forEach(f => {
    h += '<div class="lg-fk">' + T('lg.field.' + f) + '</div>' +
         '<div class="lg-fv">' + lgOriginKo(og[f]) + '</div>';
  });
  h += '</div>';
  const bits = [];
  if (j.method) bits.push(T('lg.measured') + ' ' + (lgMethodKo(j) ? esc(lgMethodKo(j)) : TX(j.method)));
  if (b.g_used != null) bits.push(T('lg.growth') + ' ' + lgPct(b.g_used) +
    (b.g_capped_from != null ? T('lg.before_cap', {g: lgPct(b.g_capped_from)}) : ''));
  if (j.as_of) bits.push(T('lg.basis', {p: esc(j.as_of)}));
  if (j.period) bits.push(TX(j.period));
  if (bits.length) h += '<div class="lg-sub" style="margin-top:10px">' +
    bits.join(' · ') + '</div>';
  return h + '</div>';
}

function lgRow(x, lg){
  const b = x.bench || {};
  const j = lg[x.ticker] || {};
  const zone = lgZoneName(b.zone_buffett);
  const roe = b.roe_minus_2x10y;
  const roeCls = roe == null ? '' : (roe >= 0 ? 'lg-pos' : 'lg-neg');

  // 쿠폰 칸 — g 가정을 반드시 병기한다. 가정을 감추면 숫자가 사실처럼 보인다.
  let coupon;
  if (j.guard || b.guard) {
    // 참고값 — 판정에 쓰지 않는다는 표식을 값 옆에 붙인다
    coupon = (b.coupon10y == null ? '<span class="lg-neg">—</span>'
              : '<span class="lg-neg">' + T('lg.coupon_ref', {c: lgPct(b.coupon10y)}) + '</span>') +
      '<span class="lg-badge" title="' + esc(LG_TIP.peak) + '">⚠ ' + T('px.peak') + '</span>';
  } else if (b.coupon10y == null) {
    coupon = '<span class="lg-neg">—</span>';
  } else if (b.hold) {
    // 판정 보류(비영업 손익 왜곡 의심) — 쿠폰은 참고값. 판정에 쓰지 않는다는 표식을 붙인다
    coupon = '<span class="lg-neg">' + T('lg.coupon_ref', {c: lgPct(b.coupon10y)}) + '</span>' + lgAuto(j, 'eps_adj_ttm') +
      '<div class="lg-sub">g ' + lgPct(b.g_used) + '</div>';
  } else {
    // g 표기 — 캡을 씌웠으면 **원값을 함께 적는다**(감춘 조정은 조정이 아니다)
    const gTxt = (b.g_capped_from != null)
      ? T('lg.g_capped', {g: lgPct(b.g_used), f: lgPct(b.g_capped_from)})
      : T('lg.g_fwd', {g: lgPct(b.g_used)});
    coupon = lgPct(b.coupon10y) + lgAuto(j, 'eps_adj_ttm') +
      '<div class="lg-sub">' + gTxt + '</div>';
  }

  // 배지는 자동값으로도 붙되 "자동" 라벨을 동반한다 — 기계가 매긴 too hard 를
  // 사람이 매긴 것처럼 보이게 두면, 근거 없는 판정에 권위가 생긴다.
  const badges =
    ((j.conv != null && j.conv < 0)
      ? '<span class="lg-badge" title="' + esc(LG_TIP.pik) + '">PIK</span>' +
        lgAuto(j, 'conversion') : '') +
    ((j.cert === '✕')
      ? '<span class="lg-badge" title="' + esc(LG_TIP.hard) + '">too hard</span>' +
        lgAuto(j, 'risk5') : '');

  const open = (lgOpenRow === x.ticker);
  const detail = open
    ? '<tr class="lg-open"><td colspan="6">' + lgDissect(x, j) + '</td></tr>' : '';
  // 비고 줄 — 긴 원인 문장·기준 줄은 셀이 아니라 행 바로 아래 한 줄(colspan)로.
  // 칸 이름을 앞에 붙여 어느 칸의 사유인지 잃지 않는다. (쉬운 해석도 이 방식으로 들어온다)
  const tk = esc(x.ticker);
  const notes = [];
  const roeN = lgRoeNote(b);
  if (roeN) notes.push(T('lg.note.roe') + roeN);
  if (j.conv == null && b.conv_note) notes.push(T('lg.note.conv') + lgNC(b.conv_note_nc, b.conv_note));
  if (j.conv != null && b.conv_check_note) notes.push(T('lg.note.conv') + lgNC(b.conv_check_note_nc, b.conv_check_note));
  const basis = lgBasisNote(b, j);
  if (basis) notes.push(basis);
  const noteRow = notes.length
    ? '<tr class="lg-note-row lg-clickable" onclick="lgToggleRow(\'' + tk + '\')"><td colspan="6">' +
      notes.map(n => '<span class="lg-note">' + TX(n) + '</span>').join('') + '</td></tr>' : '';
  return '<tr class="lg-clickable' + (notes.length ? ' lg-hasnote' : '') +
    '" onclick="lgToggleRow(\'' + tk + '\')">' +
    '<td><div class="px-tk">' + esc(x.ticker) + badges + '</div>' +
      '<div class="px-name">' + TX(x.name) + '</div></td>' +
    '<td class="px-num ' + roeCls + '">' + lgRoeCell(b, j) + '</td>' +
    '<td class="px-num">' + coupon + '</td>' +
    // 전환율 — 자동은 C안(캐펙스 전액) 단독. 없으면 셀에는 '—' 만, **왜 없는지**는 비고 줄에
    // (측정층 conv_note 가 상태에서 만든 문장 — 감가상각 기준으로 메우지 않는다)
    '<td class="px-num lg-c-conv">' + (j.conv == null
      ? '—' : lgPct(j.conv, 0) + lgAuto(j, 'conversion')) + '</td>' +
    '<td class="px-num lg-c-price">' + lgPassPrice(x, b) + '</td>' +
    '<td><span class="lg-zonetag">' + zone + '</span>' +
      // 과거 실적으로 교차 검증되지 않은 가정 위의 판정 — 화면이 그렇게 말한다
      (b.g_weak ? '<span class="lg-auto" title="' + esc(LG_WEAK_TIP) + '">' + T('lg.weak') + '</span>' : '') +
      // 사업 확실성 ✕ 인데 산술상 통과 — 존은 측정층 그대로, 표식만(F6)
      ((b.zone_buffett === 'pass' && lgUncertain(x, j))
        ? '<span class="lg-auto" title="' + esc(LG_ARITH_TIP) + '">' + T('lg.arith') + '</span>' : '') +
      // 가정 g 가 상한에 걸린 판정 — 가격이 요구하는 성장을 툴팁에(F6)
      ((b.g_capped_from != null && b.coupon10y != null && !(j.guard || b.guard) && !b.hold)
        ? '<span class="lg-auto" title="' + esc(lgCapTip(b)) + '">' + T('lg.capdep') + '</span>' : '') +
      lgEdge(b) +
      (function(){ const n = lgNote(b, j);
        return n ? '<div class="lg-sub">' + TX(n) + '</div>' : ''; })() + '</td>' +
  '</tr>' + noteRow + detail;
}

function renderLegend(){
  const b = (DATA.buffett) || {};
  const items = b.items || [];
  const host = document.getElementById('obsBody');
  if (!items.length) {
    host.innerHTML = '<div class="obs-note">' + T('lg.empty') + '</div>';
    return;
  }
  const lg = DATA.legend || {};
  const rates = b.rates || {};

  let html = '<div class="px-notice">' + T('lg.notice_html') + '</div>';

  // 눈금 스트립 — 미배선 국채(KTB·JGB)는 null 이면 아예 적지 않는다.
  // 0 으로 채우면 '금리 0%' 라는 거짓말이 되고, 표기하면 있는 척이 된다.
  const parts = [];
  const bar = rates.UST10 == null ? null : rates.UST10 * 3;
  parts.push('<span class="r-k">' + lgRateName('UST10') + '</span> <span class="r-v">' +
    (rates.UST10 == null ? '—' : UVX.dec(rates.UST10.toFixed(2)) + '%') + '</span>');
  ['KTB10', 'JGB10'].forEach(k => {
    if (rates[k] != null) parts.push('<span class="r-k">' + lgRateName(k) + '</span> ' +
      '<span class="r-v">' + UVX.dec(rates[k].toFixed(2)) + '%</span>');
  });
  parts.push('<span class="r-k">' + T('lg.hurdle') + '</span> <span class="r-bar">' +
    (bar == null ? '—' : UVX.dec(bar.toFixed(1)) + '%') + '</span>');
  html += '<div class="lg-rates">' + parts.join('<span class="r-sep">·</span>') + '</div>';
  // 관측 위치 금리 렌즈(단계 4) — ko 한국 10년물 · ja 일본 10년물. 배선됐으면 참고값으로, 아니면 미배선을 밝힌다.
  // 존 판정 자체는 모든 언어가 같은 기준(UST10)이다 — 렌즈는 보는 위치만 바꾸고 판정을 바꾸지 않는다.
  const lensKey = ({ko: 'KTB10', ja: 'JGB10'})[UVX.lang];
  if (lensKey) {
    const lv = rates[lensKey];
    html += '<div class="px-asof lg-lens">' + (lv != null
      ? T('lg.lens.wired', {local: esc(lgRateName(lensKey)), v: UVX.dec(Number(lv).toFixed(2)) + '%', base: esc(lgRateName('UST10'))})
      : T('lg.lens.unwired', {local: esc(lgRateName(lensKey)), base: esc(lgRateName('UST10'))})) + '</div>';
  }

  // 판단층 기준일 = 사람 값·자동 값 중 최신 갱신일. 둘을 함께 적는다 — 자동이 매일
  // 갱신돼도 사람 취재가 오래됐으면 그 사실 역시 보여야 한다(자동에 사람 권위를 씌우지 않는다).
  // (시차 관측 탭의 기준일은 그대로 사람 파일 asof 다 — 정당 MAX 는 사람만 적는 값이다)
  const lm = DATA.legend_meta || {};
  const asofTxt = lm.latest
    ? T('lg.asof_pair', {latest: lm.latest, auto: lm.auto || '—', human: lm.human || '—'})
    : (b.asof || '—');
  html += '<div class="px-asof">' + T('lg.asof', {asof: esc(asofTxt), label: esc(b.generated_label || '—')}) +
    (rates.source ? T('lg.asof_src', {s: esc(rates.source)}) : '') +
    (rates.as_of ? ' (' + esc(rates.as_of) + ')' : '') + '</div>';

  // 존 요약 스트립 — 시차 관측과 같은 4칸. 칸을 누르면 보드가 그 판정만 남긴다.
  // 숨기는 장치가 아니라 **소음을 접는** 장치다: 합계는 언제나 전 종목이다.
  const tally = {};
  LG_ORDER.forEach(k => { tally[k] = 0; });
  let passUncertain = 0;      // 통과 중 사업 확실성 ✕ — 헤드라인에서 분리해 말한다(F6)
  items.forEach(x => {
    const z = ((x.bench || {}).zone_buffett) || 'untested';
    tally[z] = (tally[z] || 0) + 1;
    if (z === 'pass' && lgUncertain(x, lg[x.ticker])) passUncertain++;
  });
  html += '<div class="px-strip">' + LG_ORDER.map(k =>
    '<div class="px-zone lg-pick' + (lgFilter === k ? ' lg-on' : '') +
    '" onclick="lgSetFilter(\'' + k + '\')" role="button" tabindex="0">' +
    '<div class="z-name">' + lgZoneName(k) + '</div>' +
    '<div class="z-n">' + tally[k] + '<span style="font-size:12px;font-weight:700">' + T('px.unit', {n: tally[k]}) + '</span>' +
    '</div>' + ((k === 'pass' && passUncertain)
      ? '<div class="z-sub" title="' + esc(LG_ARITH_TIP) + '">' + T('lg.pass_uncertain', {n: passUncertain}) + '</div>' : '') +
    '</div>').join('') + '</div>' +
    '<div class="px-stripnote">' + T('lg.total', {n: items.length}) +
    (lgFilter ? T('lg.filtering_html', {z: lgZoneName(lgFilter)}) +
       '<a href="#legend" onclick="lgSetFilter(null);return false;">' + T('lg.show_all') + '</a>' : '') +
    '</div>';

  // 버크셔 관찰 카드 — 스트립 바로 아래. 고정 3줄이고 13F 줄은 오늘 기준으로 계산한다.
  html += '<div class="lg-watch"><div class="lg-watch-title">🔭 ' + T('lg.watch.title') + '</div><ul>' +
    '<li>' + lg13FLine() + '</li>' +
    '<li>' + T('lg.watch.capex_html') + '</li>' +
    '<li>' + T('lg.watch.cloud_html') + '</li>' +
    '</ul></div>';

  html += LG_GLOSSARY;

  // 판정이 있는 종목이 위, 백지(미검정·정점주의)는 아래 접힘 그룹으로.
  // 접는 것이지 숨기는 것이 아니다 — 눌러서 펼치면 34종이 다 있다.
  const judged = [], blank = [];
  items.forEach(x => {
    const z = ((x.bench || {}).zone_buffett) || 'untested';
    if (lgFilter && z !== lgFilter) return;
    (z === 'untested' ? blank : judged).push(x);
  });
  judged.sort((a, c) => LG_ORDER.indexOf((a.bench || {}).zone_buffett) -
                        LG_ORDER.indexOf((c.bench || {}).zone_buffett));

  // 고정 판형 — 칸 폭을 내용이 아니라 이 비율이 정한다(합 100%). 버핏존이 결론이라 가장 넓다.
  const head = '<div class="px-wrap"><table class="px-table lg-table"><colgroup>' +
    '<col style="width:15%"><col style="width:12%"><col style="width:17%">' +
    '<col style="width:11%"><col style="width:13%"><col style="width:32%"></colgroup><thead><tr>' +
    '<th>' + T('lg.th.stock') + '</th><th>' + T('lg.th.roe') + '</th><th>' + T('lg.th.coupon') + '</th>' +
    '<th class="lg-c-conv">' + T('lg.th.conv') + '</th><th class="lg-c-price">' + T('lg.th.price') + '</th>' +
    '<th>' + T('lg.th.zone') + '</th></tr></thead><tbody>';
  if (judged.length) {
    html += head + judged.map(x => lgRow(x, lg)).join('') + '</tbody></table></div>';
  }
  if (blank.length) {
    html += '<button class="lg-fold" onclick="lgToggleBlank()">' +
      (lgBlankOpen ? '▾' : '▸') + ' ' + T('lg.fold', {n: blank.length}) +
      (lgBlankOpen ? '' : T('lg.fold_hint')) + '</button>';
    if (lgBlankOpen) {
      html += head + blank.map(x => lgRow(x, lg)).join('') + '</tbody></table></div>';
    }
  }
  // coupon10y 스파크라인 자리 — 히스토리가 2주쯤 쌓인 뒤에 넣는다(점 2개로는 선이
  // 아니라 착시다). 자리만 표시해 두고 데이터가 모이면 여기에 붙인다.

  host.innerHTML = html;
}

function lgSetFilter(z){
  lgFilter = (lgFilter === z) ? null : z;
  renderLegend();
}

function lgToggleRow(tk){
  lgOpenRow = (lgOpenRow === tk) ? null : tk;
  renderLegend();
}

function lgToggleBlank(){
  lgBlankOpen = !lgBlankOpen;
  renderLegend();
}
