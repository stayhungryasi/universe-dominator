<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데이터 천문대 · UNIVERTRIX</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root, [data-theme="light"] {
  --bg: #FAF6EC; --bg-card: #FFFFFF; --header-bg: rgba(250, 246, 236, 0.95);
  --text: #1A2438; --text-secondary: #525F7E; --text-muted: #8590AA;
  --gold: #9C7A3A; --gold-bg: #F0E6CC;
  --line: #E8DFC9; --line-strong: #C9BC9A;
}
[data-theme="dark"] {
  --bg: #0A0E14; --bg-card: #1C2330; --header-bg: rgba(10, 14, 20, 0.95);
  --text: #FFFFFF; --text-secondary: #B5BFD6; --text-muted: #6F7E9E;
  --gold: #D4A658; --gold-bg: #2A2519;
  --line: #2A3142; --line-strong: #3A4458;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard Variable', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  font-feature-settings: 'tnum', 'ss01'; line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  min-height: 100vh; display: flex; flex-direction: column;
}
.container { max-width: 720px; margin: 0 auto; padding: 0 20px; width: 100%; }

.site-header { background: var(--header-bg); border-bottom: 1px solid var(--line); }
.site-header-inner { max-width: 720px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; color: var(--text); }
.brand a { text-decoration: none; color: inherit; display: flex; gap: 8px; align-items: center; }
.brand-star { color: var(--gold); }
.brand-tag { font-size: 13px; font-weight: 500; color: var(--text-muted); }
.header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.update-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: var(--gold-bg);
  border-radius: 100px; font-size: 12px; font-weight: 700;
  color: var(--gold); font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .update-badge { border: 1px solid rgba(212,166,88,0.3); }
.update-badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); animation: pulse 2s ease-in-out infinite;
}
[data-theme="dark"] .update-badge::before { box-shadow: 0 0 8px var(--gold); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.rate-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 12px; background: var(--bg-card);
  border: 1px solid var(--line); border-radius: 100px;
  font-size: 12px; font-weight: 700; color: var(--text-secondary);
  font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.rate-badge:hover { border-color: var(--gold); }
.rate-badge:hover #usdKrwDisplay, .rate-badge:hover .rate-badge-arrow { color: var(--gold); }
.rate-badge-arrow { font-size: 10px; margin-left: 2px; color: var(--text-muted); opacity: 0.7; transition: color 0.2s, opacity 0.2s; }
.rate-badge:hover .rate-badge-arrow { opacity: 1; }
.rate-badge #usdKrwDisplay { color: var(--text); font-weight: 800; }
@media (max-width: 480px) { .rate-badge { font-size: 11px; padding: 5px 10px; } .update-badge { font-size: 11px; padding: 5px 10px; } }
@media (max-width: 380px) { .update-badge::before { display: none; } }

.theme-toggle {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--bg-card);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
}
.theme-toggle svg { width: 18px; height: 18px; }
.icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: none; }
[data-theme="dark"] .icon-sun { display: inline; }

.site-nav { position: sticky; top: 0; z-index: 50; background: var(--header-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
.site-nav-inner { max-width: 720px; margin: 0 auto; display: flex; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
.site-nav-inner::-webkit-scrollbar { display: none; }
.nav-tab { flex-shrink: 0; padding: 14px 18px; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-muted); text-decoration: none; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
.nav-tab:hover { color: var(--text-secondary); }
.nav-tab.active { color: var(--text); border-bottom-color: var(--gold); }

main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 0; }

.placeholder-card {
  text-align: center;
  padding: 56px 32px;
  border: 1px dashed var(--line-strong);
  border-radius: 16px;
  background: var(--bg-card);
  max-width: 480px;
  width: 100%;
}
.placeholder-icon { font-size: 56px; margin-bottom: 16px; }
.placeholder-eyebrow {
  font-size: 11px; font-weight: 800; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
}
.placeholder-title {
  font-size: 30px; font-weight: 800; letter-spacing: -0.03em;
  color: var(--text); margin-bottom: 12px;
}
.placeholder-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.6; }
.placeholder-note { font-size: 12px; color: var(--text-muted); margin-top: 18px; }

.site-footer { padding: 24px 0 40px; border-top: 1px solid var(--line); text-align: center; }
.footer-brand { display: flex; justify-content: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text-secondary); }
.footer-link { color: var(--text-secondary); text-decoration: none; font-weight: 700; }
.footer-link:hover { color: var(--gold); }
.footer-divider { color: var(--text-muted); font-weight: 400; }

@media (max-width: 480px) { .nav-tab { padding: 12px 14px; font-size: 13px; } .placeholder-title { font-size: 24px; } }

/* ── 데이터 천문대 ── */
.obs-hero { padding: 36px 0 6px; }
.obs-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.14em; color: var(--gold); }
.obs-title { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 6px; }
.obs-desc { font-size: 14.5px; color: var(--text-secondary); margin-bottom: 18px; }
.obs-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
.obs-tab { padding: 9px 18px; border-radius: 100px; border: 1px solid var(--line); background: var(--bg-card); font-size: 13.5px; font-weight: 700; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
.obs-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.solar-wrap { background: #10141f; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; position: relative; }
.solar-wrap svg { display: block; width: 100%; height: auto; }
.solar-legend { font-size: 12px; color: var(--text-muted); margin-top: 10px; text-align: center; }
.solar-tip { position: absolute; pointer-events: none; background: rgba(20,25,40,0.95); color: #f5f1e6; border: 1px solid #9C7A3A; border-radius: 10px; padding: 8px 12px; font-size: 12.5px; display: none; max-width: 220px; z-index: 5; }
.solar-tip b { color: #d4b06a; }
.pl { cursor: pointer; }
.pl:hover { stroke: #ffd873; stroke-width: 2px; }
.col-viz { border-radius: 10px; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--line); line-height: 0; }
.col-viz svg { width: 100%; height: auto; display: block; }
.col-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; margin-bottom: 14px; cursor: pointer; transition: border-color 0.15s; }
.col-card:hover { border-color: var(--gold); }
.col-card.open { cursor: default; }
.col-date { font-size: 12px; color: var(--gold); font-weight: 800; letter-spacing: 0.06em; }
.col-title { font-size: 18px; font-weight: 800; margin: 4px 0 6px; }
.col-summary { font-size: 13.5px; color: var(--text-secondary); }
.col-body { display: none; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 14px; font-size: 14.5px; line-height: 1.85; }
.col-card.open .col-body { display: block; }
.col-chart { margin: 16px 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); line-height: 0; }
.col-chart svg { width: 100%; height: auto; display: block; }
.col-share { display: flex; gap: 8px; margin: 0 0 14px; }
.col-share button { padding: 6px 13px; border-radius: 100px; border: 1px solid var(--line); background: var(--bg); font-size: 12px; font-weight: 700; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
.col-share button:hover { border-color: var(--gold); color: var(--gold); }
.col-body h3 { font-size: 15.5px; margin: 18px 0 6px; color: var(--gold); }
.col-body p { margin: 0 0 10px; }
.map-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.map-chip { padding: 7px 13px; border-radius: 100px; border: 1px solid var(--line); background: var(--bg-card); font-size: 12.5px; font-weight: 700; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
.map-chip:hover { border-color: var(--gold); }
.map-chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.map-wrap { background: #10141f; border: 1px solid var(--line); border-radius: 16px; padding: 10px; position: relative; }
.map-grid { position: relative; width: 100%; height: 740px; }
.map-tile { position: absolute; overflow: hidden; border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #eef2ff; cursor: pointer; transition: filter 0.12s, box-shadow 0.12s; background-image: radial-gradient(circle at 32% 26%, rgba(255,255,255,0.09), rgba(0,0,0,0.12)); }
.map-tile:hover { filter: brightness(1.18); box-shadow: 0 0 0 1.5px #d4a63f, 0 0 14px rgba(212,166,63,0.35); z-index: 3; }
.map-tile .tk { font-weight: 800; line-height: 1.1; text-shadow: 0 1px 2px rgba(0,0,0,0.35); max-width: 96%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map-tile .pc { font-weight: 700; opacity: 0.9; }
.map-head { position: absolute; font-size: 10.5px; font-weight: 800; color: #8a94b8; letter-spacing: 0.06em; padding: 2px 4px; z-index: 2; text-shadow: 0 1px 2px #10141f; }
.map-legend { display: flex; justify-content: center; align-items: center; gap: 2px; margin-top: 10px; font-size: 11px; color: var(--text-muted); }
.map-legend span { padding: 3px 9px; border-radius: 4px; color: #fff; font-weight: 700; }
.obs-note { background: var(--bg-card); border: 1px dashed var(--line-strong); border-radius: 14px; padding: 40px 24px; text-align: center; color: var(--text-muted); font-size: 14px; }
</style>
<style>
/* 헤더 모바일 일관성 + 실시간 날짜·시계 (전 페이지 공통 — build_site.py 주입) */
@media (max-width: 480px) {
  .site-header-inner { flex-wrap: wrap; }
  .brand { flex-shrink: 0; }
}
.update-badge .ud-clock { margin-left: 6px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
/* UNIVERTRIX 로고 (build_site.py 주입) */
.brand.ud-logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
/* ── UNIVERTRIX 종합 로고 (오로라×궤도×호흡×서예) ── */
.uvx{display:inline-flex;align-items:center;gap:13px;text-decoration:none}
.uvx-lat{position:relative;display:inline-block}
.uvx-word{font-size:20px;letter-spacing:.3em;font-weight:400;line-height:1;
  background:linear-gradient(95deg,var(--text) 12%,var(--gold) 46%,var(--aurora2) 62%,var(--text) 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-variation-settings:'wght' 528}
.uvx-orbit{position:absolute;inset:-12px -11px -8px -7px;width:calc(100% + 18px);height:calc(100% + 20px);pointer-events:none;overflow:visible}
.uvx-orbit path{stroke:var(--gold);opacity:.9}
.uvx-orbit circle{fill:var(--aurora2)}
.uvx-kr{font-family:'Nanum Brush Script',cursive;font-size:26px;line-height:1;padding-left:13px;border-left:1px solid var(--text-muted);white-space:nowrap;
  background:linear-gradient(95deg,var(--text) 10%,var(--gold) 42%,var(--aurora2) 60%,var(--text) 90%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent}
@media(prefers-reduced-motion:no-preference){
  .uvx-word{animation:uvbreath 6s ease-in-out infinite}
  .uvx-kr{animation:krbreath 6s ease-in-out infinite}
  @keyframes uvbreath{0%,100%{font-variation-settings:'wght' 340}50%{font-variation-settings:'wght' 800}}
  @keyframes krbreath{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
}
[data-theme="dark"] .uvx-word{filter:drop-shadow(0 0 13px rgba(139,147,255,.4))}
[data-theme="dark"] .uvx-kr{filter:drop-shadow(0 0 11px rgba(139,147,255,.35))}
@media(max-width:760px){.uvx{gap:9px}.uvx-word{font-size:15.5px;letter-spacing:.22em}.uvx-kr{font-size:20px;padding-left:9px}.uvx-orbit{inset:-9px -8px -6px -5px}}
.ud-logo-word .v { color: var(--gold); }
@media (max-width: 480px) { .ud-logo-word { font-size: 13.5px; letter-spacing: 0.16em; } .ud-logo-mark { height: 22px; } }

/* ud-hdr-refine-v2 — 상태 스트립 통합: 배지 3개 → 계기판 캡슐 하나 */
.site-header-inner { padding: 15px 20px; }
.header-right {
  gap: 0; background: var(--bg-card); border: 1px solid var(--line);
  border-radius: 100px; padding: 3px 5px 3px 4px; align-items: center;
  box-shadow: 0 1px 2px rgba(28,35,51,0.04);
}
.header-right .update-badge {
  background: transparent; border: none; border-radius: 0;
  padding: 5px 13px; color: var(--text-secondary);
}
[data-theme="dark"] .header-right .update-badge { border: none; }
.header-right .update-badge .ud-clock { color: var(--gold); font-weight: 800; }
.header-right .rate-badge {
  background: transparent; border: none; border-radius: 0;
  border-left: 1px solid var(--line); padding: 5px 13px;
}
.header-right .rate-badge:hover { border-color: var(--line); }
.header-right .rate-badge:hover #usdKrwDisplay, .header-right .rate-badge:hover .rate-badge-arrow { color: var(--gold); }
.header-right .theme-toggle {
  width: 34px; height: 30px; border: none; border-radius: 0 100px 100px 0;
  border-left: 1px solid var(--line); background: transparent; margin-left: 0;
}
.header-right .theme-toggle:hover { color: var(--gold); }
@media (max-width: 480px) {
  .header-right { padding: 2px 3px 2px 2px; }
  .header-right .update-badge, .header-right .rate-badge { padding: 4px 9px; }
}

/* ud-hdr-refine-v4 — 아이보리 복원: 헤더는 본문과 한 몸, 세련됨은 디테일에서.
   (한때 페이지에 주입됐던 v3 네이비 블록을 아래 리셋이 캐스케이드로 무력화한다) */
.site-header { background: var(--header-bg); border-bottom: none; position: relative; }
.site-header::after { content: none; }
.site-header .ud-logo, .site-header .ud-logo-word { color: var(--text); }
.site-header .ud-logo-word { letter-spacing: 0.2em; }
.site-header .ud-logo-word .v { color: var(--gold); }
.site-header .ud-logo-mark { --gold: #9C7A3A; }
[data-theme="dark"] .site-header .ud-logo-mark { --gold: #D4A658; }
.site-header .header-right {
  background: var(--bg-card); border-color: var(--line);
  box-shadow: 0 1px 2px rgba(28,35,51,0.05);
}
.site-header .update-badge, .site-header .update-badge .ud-date { color: var(--text-secondary); }
.site-header .update-badge .ud-clock { color: var(--gold); }
.site-header .update-badge::before { background: var(--gold); box-shadow: none; }
[data-theme="dark"] .site-header .update-badge::before { box-shadow: 0 0 8px var(--gold); }
.site-header .rate-badge { color: var(--text-secondary); border-left-color: var(--line); }
.site-header .rate-badge #usdKrwDisplay { color: var(--text); }
.site-header .rate-badge:hover #usdKrwDisplay, .site-header .rate-badge:hover .rate-badge-arrow { color: var(--gold); }
.site-header .theme-toggle { color: var(--text-secondary); border-left-color: var(--line); }
.site-header .theme-toggle:hover { color: var(--gold); }
/* 헤더+메뉴 = 하나의 아이보리 존, 경계는 메뉴 아래 은은한 골드 헤어라인 한 줄 */
.site-nav { border-bottom: 1px solid var(--line); }
.site-nav::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent 8%, rgba(156,122,58,0.38), transparent 92%);
}
[data-theme="dark"] .site-nav::after {
  background: linear-gradient(90deg, transparent 8%, rgba(212,166,88,0.3), transparent 92%);
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var badge = document.querySelector('.update-badge');
  if (!badge) return;
  badge.innerHTML = '<span class="ud-date"></span><span class="ud-clock"></span>';
  var dt = badge.querySelector('.ud-date');
  var clk = badge.querySelector('.ud-clock');
  function tick() {
    var now = new Date();
    dt.textContent = now.toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' }).replace(/-/g, '.');
    clk.textContent = now.toLocaleTimeString('en-GB', { hour12: false, timeZone: 'Asia/Seoul' });
  }
  tick();
  setInterval(tick, 1000);
});
</script>
<style id="wide-fix">.container{max-width:1280px}</style>

<style id="ud-aurora-global-v1">
/* ud-aurora-global-v1 — 전 페이지 오로라 팔레트 통일 (build_site 주입 · 멱등)
   토큰 리맵이므로 각 페이지 기존 컴포넌트가 자동으로 새 팔레트를 입는다 */
:root, [data-theme="light"] {
  --bg:#FBFBFC; --bg-card:#F5F5F7; --bg-hover:#ECECF0;
  --text:#16181D; --text-secondary:#4A4E58; --text-muted:#7E828B;
  --gold:#565CE8; --gold-bg:rgba(86,92,232,0.08); --aurora2:#3EC8D8;
  --line:#E8E9EC; --line-strong:#D8DAE0; --up:#565CE8;
  --header-bg:rgba(251,251,252,0.92);
  --tab-active-bg:var(--text); --tab-active-text:var(--bg);
  --toggle-icon-color:var(--text);
}
[data-theme="dark"] {
  --bg:#0A0B0F; --bg-card:#12141B; --bg-hover:#191C25;
  --text:#F4F5F8; --text-secondary:#C3C7D1; --text-muted:#7C8290;
  --gold:#8B93FF; --gold-bg:rgba(139,147,255,0.10); --aurora2:#4FE0EF;
  --line:#1E2027; --line-strong:#2A2D38; --up:#8B93FF;
  --header-bg:rgba(10,11,15,0.92);
  --tab-active-bg:var(--gold); --tab-active-text:var(--bg);
  --toggle-icon-color:var(--gold);
}
/* ── 정렬 통일: 헤더·메뉴·본문을 같은 1080px 기둥에 ── */
.site-header-inner{max-width:1080px !important;margin:0 auto !important;padding:14px 20px !important;display:flex;align-items:center;justify-content:space-between;gap:12px}
.site-nav-inner{max-width:1080px !important;margin:0 auto !important;padding:0 20px !important;justify-content:space-between}
/* 첫/끝 탭의 내부 패딩만큼 광학 보정 — 탭 '글자'가 로고 좌변·캡슐 우변과 정렬 */
.site-nav-inner .nav-tab:first-child{margin-left:-14px}
.site-nav-inner .nav-tab:last-child{margin-right:-14px}
@media(max-width:860px){.site-nav-inner{justify-content:flex-start}.site-nav-inner .nav-tab:first-child,.site-nav-inner .nav-tab:last-child{margin:0}}
.container{max-width:1080px !important}

/* 메뉴 하단 헤어라인: 골드 → 오로라 */
.site-nav::after{background:linear-gradient(90deg,transparent 8%,rgba(86,92,232,.35),rgba(62,200,216,.35),transparent 92%) !important}
[data-theme="dark"] .site-nav::after{background:linear-gradient(90deg,transparent 8%,rgba(139,147,255,.4),rgba(79,224,239,.4),transparent 92%) !important}
</style>

</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a class="brand ud-logo uvx" href="index.html" aria-label="UNIVERTRIX 홈">
      <span class="uvx-lat"><span class="uvx-word">UNIVERTRIX</span>
        <svg class="uvx-orbit" viewBox="0 0 300 60" preserveAspectRatio="none" fill="none" aria-hidden="true">

 — 반도체 행성계의 질량 재편성", "summary": "NVIDIA가 태양의 자리를 지키는 가운데, 한반도 반도체 행성들이 주간 상승률 상위를 점유하며 우주 질서에 변화의 신호를 보내다.", "body": "<h3>태양의 안정, 행성계의 요동</h3><p>8월 15일 현재 우주의 질서는 여전히 NVIDIA의 손에 있다. 시가총액 5.45조 달러로 태양의 자리를 지킨 지 이번 주간 동안 왕좌의 변화는 없었다. Apple(4.46조), Alphabet(4.2조), Microsoft(3.68조), Amazon(2.83조)으로 이어지는 상위 5개 행성의 배치도 전 주와 동일하다. 우주의 중심은 안정적이지만, 그 주변부에서는 급격한 운동이 감지되고 있다.</p><h3>동방 반도체 행성들의 약진</h3><p>이번 주 가장 눈에 띄는 현상은 한반도 반도체 행성들의 집중적 상승이다. 삼성전자는 18.3%, SK하이닉스는 15.2% 상승률을 기록했으며, Micron Technology도 10.7% 오르며 그 뒤를 따랐다. 메모리 반도체 산업에 대한 우주적 관심이 재편성되는 모습이다. 동시에 Broadcom(-8.2%), Amazon(-4.3%), Berkshire Hathaway(-4.2%)는 주간 하강의 궤도를 그렸다.</p><h3>우주 지형도의 변동</h3><p>행성계의 진출입에도 움직임이 있었다. ASML이 우주 관측 범위에 새로이 진입했으며, Visa는 관측 범위를 벗어났다. 보다 주목할 점은 잠재적 신진 행성 Delta Electronics의 출현과 KIOXIA Holdings Corporation(모멘텀 849), Seagate Technology(525), Sandisk(416)로 이어지는 상승 모멘텀의 계층이다. 반도체와 저장 매체 행성들이 미래의 질서 변화를 예고하고 있다.</p><p>우주는 계속 돈다. 이번 주간 관측을 통해 드러난 것은 태양의 안정성 속에서도 주변부 행성들의 질량 재편성이 진행 중이라는 점이다. 기록되는 각 수치들은 미래 우주 질서의 밑그림이 될 것이다.</p><div class=\"col-chart\"><svg viewBox=\"0 0 700 310\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"wg2\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop offset=\"0%\" stop-color=\"#9c7a3a\"/><stop offset=\"100%\" stop-color=\"#f2ba3c\"/></linearGradient></defs><rect width=\"700\" height=\"310\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"19\" font-weight=\"800\">이번 주의 별 — 타오른 별과 식은 별</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12.5\" font-weight=\"600\">지구 TOP 20 주간 시총 증감률 상·하위</text><text x=\"26\" y=\"95\" fill=\"#e6ebfa\" font-size=\"13\" font-weight=\"800\">삼성전자</text><rect x=\"200\" y=\"80\" width=\"380\" height=\"20\" rx=\"6\" fill=\"url(#wg2)\"/><text x=\"590\" y=\"95\" fill=\"#fff\" font-size=\"14.5\" font-weight=\"800\">+18.3%</text><text x=\"26\" y=\"128\" fill=\"#e6ebfa\" font-size=\"13\" font-weight=\"800\">SK하이닉스</text><rect x=\"200\" y=\"113\" width=\"316\" height=\"20\" rx=\"6\" fill=\"url(#wg2)\"/><text 점진적으로 이완될 가능성을 시사합니다.", "body": "<h3>무슨 일이 일어났나</h3><p>알리바바는 Qwen 3.8 27B 오픈소스 AI 모델을 공개했습니다. 이 발표는 Hacker News에서 300 이상의 높은 점수(824점)를 기록하며 실리콘밸리 개발자 커뮤니티의 주목을 받았습니다. 모델은 Hugging Face를 통해 누구나 접근할 수 있으며, FP8 양자화 형식으로 배포되어 엣지 디바이스와 로컬 환경에서의 배포가 용이합니다.</p><h3>내용 해부</h3><p>Qwen 3.8 27B는 매개변수 규모 27억 개의 경량 언어모델입니다. 오픈소스 공개는 두 가지 차원에서 의미가 있습니다. 첫째, 개발자가 클라우드 API 의존 없이 로컬과 엣지 환경에서 모델을 직접 배포·최적화할 수 있게 합니다. 둘째, 알리바바 같은 대형 클라우드 기업이 생태계 주도권을 확보하기 위해 오픈소스 전략을 강화하고 있음을 드러냅니다. FP8 양자화는 메모리 점유를 절감하면서도 성능 손실을 최소화하는 기술로, 모바일·임베디드 환경에서의 실용성을 높입니다.</p><h3>왜 중요한가</h3><p>과거 몇 년간 AI 시장은 OpenAI의 ChatGPT 계열 API와 Anthropic의 Claude가 사실상 독점하는 구조였습니다. 그러나 메타(Llama), 구글(Gemma), 그리고 이제 알리바바(Qwen)에 이르기까지 경량 오픈소스 모델이 연쇄적으로 공개되면서 '프론티어 모델'의 독점성이 급격히 약화되고 있습니다. 이는 두 가지 산업 변화를 의미합니다.</p><p>첫째, 자본집약적 대규모 학습에서 '효율성'의 경쟁으로 무게중심이 이동합니다. 27B 규모의 모델로도 대부분의 실무 태스크를 처리할 수 있다면, 기업들은 더 이상 억 달러대 API 비용을 감수할 필요가 없습니다. 둘째, 엣지·로컬 배포의 활성화는 데이터 프라이버시와 저지연 처리를 중시하는 기업 고객들의 선택지를 크게 확대합니다. 금융·의료·제조 등 규제가 엄격한 산업에서 이런 수요는 특히 압니다.</p><h3>우주지배자 관측 포인트</h3><p>이번 신호는 AI 시장의 '위성화' 경향을 가속화합니다. 지금까지 OpenAI(Microsoft 진영)와 Anthropic이 차지하던 중력장이 메타·구글·알리바바 같은 대형 기술 회사들의 오픈소스 진출로 분산되고 있습니다. 클라우드 기업들의 입장에서 오픈소스는 자신의 인프라(AWS, 알리바바 클라우드, Google Cloud)로의 사용자 유입을 유도하는 전략입니다.</p><p>시총 관점에서는 AI 칩(NVIDIA 계열), 추론 최적화 솔루션, 엣지 배포 소프트웨어 제공사들의 상대적 가치가 재평가될 가능성이 있습니다. 추정컨대, 클라우드 기반 API 의존도가 낮아질수록 API 수익 모델에 기댄 기업들의 성장률은 완만해질 수 있습니다. 반면 모델 최적화·양자화·컴파일 기술을 보유한 기업들의 B2B 수요는 증가할 것으로 예상됩니다.</p><p>알리바바가 중국 기업이라는 점도 간과할 수 없습니다. 지정학적 기술 분할이 심화되는 상황에서, 중국 기업의 오픈소스 모델 공개는 '기술 자율성' 담론을 강화하며 글로벌 공급망의 지배 구조 재편을 암시합니다.</p><h3>한 줄 마무리</h3><p>경량 오픈소스 모델의 연쇄 공개는 AI 시장의 독점 구도를 단기에는 안 부순다 해도, 중장기적으로 API 중심의 수익 모델 우위가 예전 같지 않음을 신호합니다.</p><div class=\"col-chart\"><svg viewBox=\"0 0 700 300\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"sg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#f2ba3c\"/><stop offset=\"100%\" stop-color=\"#9c7a3a\"/></linearGradient></defs><rect width=\"700\" height=\"300\" fill=\"#10141f\"/><text x=\ 프론티어 모델을 공개했으며, 저렴한 가격과 높은 접근성이 글로벌 AI 경쟁 판도를 재편하는 신호로 작용하고 있습니다.", "body": "<h3>무슨 일이 일어났나 — 사실 요약</h3><p>2026년 8월 12일 DeepSeek는 대규모 혼합 전문가(Mixture-of-Experts) 구조의 프론티어 모델 'DeepSeek V4 Pro 0813'을 정식 출시했습니다. OpenRouter 플랫폼 기준으로 입력 토큰 $0.435, 출력 토큰 $0.87(100만 토큰당)의 가격책정 전략으로 공개되었으며, Hacker News에서 300점 이상의 지지도를 기록하며 실리콘밸리의 핵심 신호로 포착되었습니다. 1백만 토큰의 컨텍스트 윈도우를 지원하는 이 모델은 OpenAI 호환 API 형식으로 제공되어 기존 개발 생태계와의 호환성을 강화했습니다.</p><h3>내용 해부 — 핵심 주장·기술·수치</h3><p>DeepSeek V4 Pro 0813의 가격 책정은 현재 글로벌 프론티어 모델 시장에서 매우 공격적입니다. 동급 성능의 클로드(Claude)나 GPT 계열 모델 대비 입력 토큰 가격이 현저히 낮으며, 이는 중국 개발팀이 추구하는 '성능-비용 효율성' 전략의 핵심입니다. 혼합 전문가 구조는 필요한 매개변수만 활성화하여 추론 속도와 에너지 효율을 극대화하는 기술로, 업계에서 입증된 방식입니다. OpenRouter의 벤치마크 데이터에 따르면 이 모델은 표준화된 평가에서 상위권 성능을 달성했으며, 도구 호출(Tool Calling)과 구조화된 출력(Structured Outputs)을 지원하여 프로덕션 워크로드에 즉시 적용 가능합니다.</p><h3>왜 중요한가 — 산업 판도와 AI 시대 준비</h3><p>이 신호가 중요한 이유는 기술 수렴(Technology Convergence)과 지정학적 경쟁 심화라는 두 층위에서 읽힙니다. 첫째, 중국 개발팀이 OpenAI와 Anthropic이 독점해온 프론티어 모델 성능대에 진입했다는 것은 기술 격차가 더 이상 미국 진영의 확실한 자산이 아님을 의미합니다. 둘째, 저가격 진입전략은 개발자·스타트업·기업들의 선택지를 근본적으로 확대하며, 이는 AI 인프라 시장의 가격 경쟁을 가속화할 전망입니다. 개인 개발자 관점에서는 고성능 모델에 대한 진입장벽이 낮아지는 기회이며, 엔터프라이즈 관점에서는 공급자 다변화를 통한 의존도 감소 가능성을 열어줍니다.</p><h3>우주지배자 관측 포인트 — 시총 순위표와 가치사슬 파장</h3><p>이 신호는 '행성의 위상 지형도'를 재구성하는 조짐으로 관측됩니다. OpenAI와 Anthropic이 점유해온 프론티어 모델 시장에서 DeepSeek의 진입은 미국 AI 행성들의 프리미엄 가격대에 대한 경쟁 압력을 높이고 있습니다. 추정하건대, 향후 분기마다 성능 대비 가격의 우위가 더욱 중요한 시장 신호로 작용할 가능성이 높으며, 이는 클라우드 컴퓨팅 인프라 제공자(NVIDIA, AWS 등)와 API 중개 플랫폼(OpenRouter 같은 벤더들)의 역할이 더욱 중요해진다는 뜻입니다. 동시에 프론티어 모델 개발사의 가치 평가는 기술 독점성 약화에 따른 재검토 국면을 맞을 수 있습니다.</p><p>또한 이 신호는 '중국 AI 행성의 질량 증가'라는 우주적 차원의 변화를 암시합니다. 단순한 기술 추격(Catch-up)을 넘어 성능-가격 프론티어에서의 경쟁 가능성이 입증되었으며, 이는 향후 투자 자본의 지정학적 배분에도 영향을 미칠 전망입니다. 추정이지만, 프론티어 모델의 다중 공급원화는 중기적으로 AI 생태계의 건강성을 높일 수 있는 한편, 단기적으로는 1위 행성의 시총 프리미엄을 흠식할 가능성이 있습니다.</p><h3>신호 수신의 함의</h3><p>DeepSeek V4 Pro 0813의 공개는 '기술 혁신의 주무대가 단일 지역에 집중되지 않음'을 다시 한 번 명확히 하는 이정표입니다. Hacker News에서 300점 이상이라는 높은 점수는 글로벌 개발자 커뮤니티가 이를 단순한 추격 모델이 아닌 '실질적 대안'으로 인정했음을 의미합니다. 가격 정책(입력 $0.435, 출력 $0.87)과 컨텍스트 윈도우(1M 토큰) 사양은 프로덕션 환경에서의 실제 경제성 계산을 가능하게 하며, OpenAI 호환 API는 채택 마찰을 최소화합니다. 이러한 전술적 설계들은 단순히 기술 수준을 추월하려는 것이 아닌, 시장에서의 실질적 영향력 확대를 겨냥한 전략으로 읽힙니다.</p><p>AI 시대를 대비하는 관찰자들은 이 신호를 '기술 수렴의 속도 가속화'로 해석해야 합니다. 추정이지만 향후 12~24개월 내 프론티어 모델의 성능 격차는 더욱 좁혀질 것이며, 이는 기술 차별화보다 **생태계·통합·비용 효율성**이 경쟁의 중심축이 될 것임을 시사합니다. 한국의 AI 정책 입안자와 투자자들도 이러한 판도 변화를 정확히 읽고 대응 전략을 수립해야 할 시점입니다.</p><div class=\"col-chart\"><svg viewBox=\"0 0 700 300\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"sg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#f2ba3c\"/><stop offset=\"100%\" stop-color=\"#9c7a3a\"/></linearGradient></defs><rect width=\"700\" height=\"300\" fill=\"#10141f\"/><text x=\"26\" y=\"34\" fill=\"#f2ba3c\" font-size=\"18\" font-weight=\"800\">DeepSeek V4 Pro 0813 API 가격 책정</text><text x=\"26\" y=\"56\" fill=\"#8a94b8\" font-size=\"12\" font-weight=\"600\">입력 및 출력 토큰당 가격(100만 토큰 기준, 달러)</text><line x1=\"26\" y1=\"244\" x2=\"674\" y2=\"244\" stroke=\"#3a4568\"/><rect x=\"158\" y=\"161\" width=\"74\" height=\"83\" rx=\"7\" fill=\"url(#sg)\"/><text x=\"195\" y=\"151\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"15.5\" font-weight=\"800\">0.435$</text><text x=\"195\" y=\"265\" text-anchor=\"middle\" fill=\"#c8d0ea\" font-size=\"11.5\" font-weight=\"700\">입력 토큰</text><rect x=\"468\" y=\"78\" width=\"74\" height=\"166\" rx=\"7\" fill=\"url(#sg)\"/><text x=\"505\" y=\"68\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"15.5\" font-weight=\"800\">0.87$</text><text x=\"505\" y=\"265\" text-anchor=\"middle\" fill=\"#c8d0ea\" font-size=\"11.5\" font-weight=\"700\">출력 토큰</text><text x=\"26\" y=\"286\" fill=\"#5a648a\" font-size=\"10\">자료: 원문 기사에서 추출 (자동)</text><text x=\"674\" y=\"286\" text-anchor=\"end\" fill=\"#9c7a3a\" font-size=\"11.5\" font-weight=\"800\">UNIVERTRIX · univertrix.com</text></svg></div><div class=\"col-chart\"><svg viewBox=\"0 0 700 300\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"sg\" x1=\"0\" y1=\"0\ 묵은 결함을 발견했습니다. 이 버그로 인해 총 19건의 데이터베이스 손상이 발생했으며, 각 사건마다 해당 샤드의 제어 평면이 중단되어 사용자들의 기기 연결과 관리 기능이 일시적으로 마비되었습니다.</p><h3>내용 해부 — 핵심 주장·기술·수치</h3><p>Tailscale은 2022년부터 SQLite를 주 데이터베이스로 채택했습니다. 단일 쓰기자 구조로 설계된 이 아키텍처는 SQLite의 권장 사용 방식이었고, 대규모 배포 환경에서도 안정적으로 작동하는 것으로 알려졌습니다. 그러나 지난해 8월 S3 백업에 저장된 데이터베이스에서 무결성 손상이 보고되면서 상황이 반전되었습니다.</p><p>초기 사건들에서는 복구에 1시간 이상 소요되었으나, 반복된 발생으로 대응 절차가 점진적으로 가속화되었습니다. 6개월간 19건의 부패 사건이 연쇄적으로 발생하는 동안, 영향받은 샤드의 모든 테일넷은 제어 평면이 전면 차단되었습니다. 새로운 기기가 접속할 수 없었고, 웹 기반 관리 콘솔과 API 접근도 불가능했습니다. 중요한 점은 전체 샤드와 테일넷의 대다수가 영향을 받지 않았음에도 불구하고, 반복되는 상태 페이지 공지로 인한 신뢰도 침식이 광범위하게 발생했다는 것입니다.</p><p>데이터 손실 측면에서는 제한적이었습니다. 제어 평면이 보유한 정보는 메타데이터와 기기 구성만 해당되며, 개인 암호화 키나 네트워크 트래픽 데이터는 포함되지 않았습니다. 그러나 기기 추가나 설정 변경 사항이 일부 지속되지 않았고, 메타데이터 재입력이 필요했습니다.</p><h3>왜 중요한가 — 산업 판도와 의미</h3><p>이번 사건은 '지루한 기술'으로 평가받는 레거시 소프트웨어의 심각한 취약성이 AI 시대 인프라의 가장 중요한 자산인 신뢰성을 어떻게 훼손할 수 있는지 보여줍니다. SQLite는 간단함과 안정성으로 널리 신뢰받지만, 16년간 발견되지 않은 결함이 존재할 수 있다는 사실은 당연해 보이는 기술 선택에도 끊임없는 감시가 필요함을 증명합니다.</p><p>클라우드 인프라 기업들의 경쟁은 이제 기능의 풍부함에서 신뢰성과 투명성으로 이동하고 있습니다. Tailscale이 이 문제를 공개적으로 상세 기록하고 근본 원인까지 규명하여 공개한 것은, 기업들이 단순히 사건 자체보다 그에 대응하는 성숙도로 평가받는 시대임을 의미합니다. 아마존·마이크로소프트 같은 태양급 기업들이 제어하는 대형 클라우드 플랫폼도 이러한 기본 감시 체계를 강화해야 한다는 신호를 전달합니다.</p><h3>우주지배자 관측 포인트 — 가치사슬의 파장</h3><p>현재 시가총액 상위권을 차지한 메가테크 기업들은 '신뢰성'을 차별화 요소로 마케팅하고 있습니다. 추정으로, 이번 같은 사건은 중견 인프라 기업들의 고객 유지율과 신규 계약 체결에 직접적인 영향을 미칠 가능성이 높습니다. 동시에 데이터베이스·보안 감시 솔루션을 제공하는 업체들의 가치도 상승할 것으로 보입니다.</p><p>반도체·클라우드 부문 기업들도 영향을 받습니다. SQLite 같은 임베디드 데이터베이스는 IoT, 엣지 컴퓨팅, AI 워크로드 연결 같은 차세대 인프라의 핵심 계층입니다. 레거시 기술의 결함이 반복될수록, 기업들은 오픈소스 감시 강화에 투자하거나 자체 솔루션으로 마이그레이션할 유인이 커집니다. 가치사슬 상에서 '검증과 감시'를 담당하는 기업들의 전략적 중요성이 강화될 것으로 추정됩니다.</p><p>AI 시대 개인 투자자 관점에서는, 단순한 성장성보다 운영 안정성과 투명성 공개 습관이 있는 기업을 선별하는 것이 필수 역량이 되었습니다. Tailscale 같은 기업의 사건 대응 기록은 기업 문화와 엔지니어링 성숙도를 평가하는 지표가 됩니다.</p><p>신뢰성 기반 클라우드 인프라 경쟁은 기술 우월성보다 투명한 결함 대응으로 차별성을 만드는 단계로 진입했습니다.</p><div class=\"col-chart\"><svg viewBox=\"0 0 700 300\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"sg\" x1=\"0\" y1=\"0\" x2=\
