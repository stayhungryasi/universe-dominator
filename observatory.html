  const sun = stocks[0], planets = stocks.slice(1);
  const maxMc = sun.mc;
  const rOf = mc => 6 + Math.pow(mc / maxMc, 0.58) * 34;
  const sunR = 60;
  const orbitBase = sunR + 46, orbitStep = 31;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0d18, 0.00055);
  const camera = new THREE.PerspectiveCamera(45, W/H, 1, 6000);
  // 화면비 반응형 카메라 거리: 세로 폰(좁은 화면)은 수평 시야가 좁아지므로
  // 그만큼 멀리서 시작해야 태양계 전체가 담긴다 (PC 4:3 기준 660)
  const fitK = Math.min(1.75, Math.max(1, (4 / 3) / (W / H)));
  const introEnd = Math.min(1080, Math.round(660 * fitK));
  const maxDist = Math.max(1100, introEnd + 250);
  let camTheta = 0.35, camPhi = 1.12, camDist = introEnd - 20;
  let introT = 0;                // 진입 연출 진행도 (0→1)
  let lastTouch = performance.now();  // 마지막 조작 시각 (자동 선회용)
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));  // 레티나 4K 선명도
  renderer.setSize(W, H);
  renderer.setClearColor(0x07090f);
  if (THREE.ACESFilmicToneMapping !== undefined) {
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
  }
  if (THREE.sRGBEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
  wrap.insertBefore(renderer.domElement, wrap.firstChild);

  // 조명 — 태양이 진짜 광원
  scene.add(new THREE.AmbientLight(0x2a3350, 0.9));
  const sunLight = new THREE.PointLight(0xffe6b0, 2.1, 0, 2);
  scene.add(sunLight);

  const texQueue = [];
  // 실사 텍스처 풀 — 종목마다 서로 다른 행성 얼굴 (파일이 없으면 해당 항목만 절차적 폴백)
  const GAS_POOL = ['jupiter.jpg', 'saturn.jpg', 'uranus.jpg', 'neptune.jpg', 'venus_atm.jpg', 'gas1.jpg', 'gas2.jpg', 'ice1.jpg'];
  const ROCK_POOL = ['mars.jpg', 'mercury.jpg', 'venus.jpg', 'ceres.jpg', 'makemake.jpg', 'haumea.jpg', 'eris.jpg', 'moon.jpg', 'rock1.jpg', 'rock2.jpg'];
  // 실제 태양계 순서 — 2위부터 안쪽 궤도: 수성→금성→지구→화성→목성→토성→천왕성→해왕성→왜소행성들
  const SOLAR_ORDER = ['mercury.jpg', 'venus.jpg', 'earth.jpg', 'mars.jpg', 'jupiter.jpg',
    'saturn.jpg', 'uranus.jpg', 'neptune.jpg', 'ceres.jpg', 'moon.jpg', 'eris.jpg',
    'haumea.jpg', 'makemake.jpg', 'venus_atm.jpg', 'gas1.jpg', 'rock1.jpg', 'gas2.jpg',
    'rock2.jpg', 'ice1.jpg'];
  const __usedTex = new Set();
  function pickRealTex(pool, seed){
    for (let k = 0; k < pool.length; k++) {
      const name = pool[(seed + k) % pool.length];
      if (!__usedTex.has(name)) { __usedTex.add(name); return name; }
    }
    return pool[seed % pool.length];
  }
  // ── 실사 텍스처 (assets/textures/ 에 파일이 있으면 자동 승격, 없으면 절차적 폴백) ──
  const REAL_TEX_BASE = 'assets/textures/';
  const texLoader = new THREE.TextureLoader();
  function loadReal(name, onOk){
    texLoader.load(REAL_TEX_BASE + name, t => {
      if (THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
      onOk(t);
    }, undefined, () => {});  // 실패 시 침묵 — 절차적 유지
  }
  // 은하수 배경 — 먼저 단색으로 즉시, 텍스처는 뒤이어 장착
  const sky = new THREE.Mesh(new THREE.SphereGeometry(2800, 48, 32),
    new THREE.MeshBasicMaterial({ color: 0x0a0d1a, side: THREE.BackSide }));
  sky.material.fog = false;
  sky.rotation.z = 0.42;
  scene.add(sky);
  // ★ v11.3 배경 확정: 구체에 어떤 텍스처도 씌우지 않는다 (부장님 판정 2회 확정).
  //   절차적 은하수(milkyTex)의 발광 원 420개가 구체 확대로 '뿌연 블롭' 오염의 진범.
  //   깔끔한 우주 = 민무늬 심연(#0a0d1a) + 별 입자만. milkyTex·실사 milky 모두 봉인.
  // setTimeout(() => { try { sky.material.map = milkyTex(); sky.material.color.set(0xffffff); sky.material.needsUpdate = true; } catch(e){} }, 30);
  // ★ 은하수 배경은 절차적 고정 — 실사 milky.jpg는 2K를 구체 안에서 ~5배 확대해
  //   사진 별들이 거대 블롭으로 번짐 (2026-08-08 배경 오염 사고). 행성 실사는 유지.
  // loadReal('milky.jpg', t => { sky.material.map = t; sky.material.color.set(0xffffff); sky.material.needsUpdate = true; });

  // 별밭 — 원형 소프트 입자 (사각형 아티팩트 제거), 카메라 항로 바깥(1700+)에 배치
  const starSprite = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.25, 'rgba(255,250,235,0.85)');
    gr.addColorStop(0.6, 'rgba(230,235,255,0.25)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();
  // 별밭 배치·크기를 fitK로 함께 스케일 → 카메라:별껍질 거리 비율이 기기 무관 동일
  // (모바일은 카메라가 멀리 물러나므로, 별도 같이 밀어야 PC와 같은 안정적 우주가 된다)
  [[2000, 1900 * fitK, 3.8 * fitK, 0.8], [700, 2600 * fitK, 6 * fitK, 0.5]].forEach(([n, rad, size, op]) => {
    const pos = new Float32Array(n*3);
    for (let i = 0; i < n; i++) {
      const u = Math.random()*2-1, t = Math.random()*Math.PI*2, rr = rad + Math.random()*900*fitK;
      const sq = Math.sqrt(1-u*u);
      pos[i*3] = rr*sq*Math.cos(t); pos[i*3+1] = rr*u; pos[i*3+2] = rr*sq*Math.sin(t);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
      map: starSprite, color: 0xffffff, size, transparent: true, opacity: op,
      sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending })));
  });

  // 태양 — 발광 코어 + 이중 광륜
  const sunUni = { t: { value: 0 } };
  let sunMat;
  try {
    sunMat = new THREE.ShaderMaterial({
      uniforms: sunUni,
      vertexShader: 'varying vec3 vP; varying vec3 vNv; void main(){ vP = position; vNv = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: [
        'varying vec3 vP; varying vec3 vNv; uniform float t;',
        'float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }',
        'float noise(vec3 p){ vec3 i = floor(p); vec3 f = fract(p); f = f*f*(3.0-2.0*f);',
        '  return mix(mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x), mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),',
        '    mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x), mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z); }',
        'float fbm(vec3 p){ float v = 0.0; float a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.07; a *= 0.5; } return v; }',
        'void main(){',
        '  vec3 p = normalize(vP) * 3.2;',
        '  float n = fbm(p + vec3(t*0.055, t*0.04, t*0.05)) + 0.45 * fbm(p*2.6 - vec3(t*0.085, 0.0, t*0.06));',
        '  vec3 deep = vec3(0.66, 0.22, 0.02); vec3 mid = vec3(1.0, 0.60, 0.10); vec3 hot = vec3(1.0, 0.95, 0.74);',
        '  vec3 col = mix(deep, mid, smoothstep(0.34, 0.72, n)) * 1.25;',
        '  col = mix(col, hot, smoothstep(0.95, 1.35, n));',
        '  float rim = pow(1.0 - abs(vNv.z), 2.2);',
        '  col += rim * vec3(1.0, 0.55, 0.12) * 0.8;',
        '  gl_FragColor = vec4(col, 1.0); }'
      ].join('\n')
    });
  } catch(e) { sunMat = new THREE.MeshBasicMaterial({ map: sunTex() }); }
  const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(sunR, 64, 48), sunMat);
  loadReal('sun.jpg', t => { sunMesh.material = new THREE.MeshBasicMaterial({ map: t }); });
  sunMesh.userData.i = 0; scene.add(sunMesh);
  const glowM = new THREE.SpriteMaterial({ map: glowTex('rgb(255,240,200)'), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
  const glow0 = new THREE.Sprite(glowM); glow0.material.opacity = 1; glow0.scale.set(sunR*3.4, sunR*3.4, 1); scene.add(glow0);
  const glow1 = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex('rgb(255,205,95)'), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.85 }));
  glow1.scale.set(sunR*7, sunR*7, 1); scene.add(glow1);
  const glow2 = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex('rgb(255,170,60)'), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.45 }));
  glow2.scale.set(sunR*13, sunR*13, 1); scene.add(glow2);

  // 행성들
  const bodies = [sunMesh];
  const orbs = planets.map((p, i) => {
    const r = rOf(p.mc);
    const [hi, lo] = flagColor(p.flag);
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(r, 48, 32),
      new THREE.MeshStandardMaterial({ color: new THREE.Color(lo), roughness: 0.92, metalness: 0.04 }));
    mesh.userData.i = i + 1;
    scene.add(mesh); bodies.push(mesh);
    texQueue.push({ mesh, hi, lo, seed: colSeed(p.ticker), rocky: r < 13 });
    const realName = SOLAR_ORDER[i] || pickRealTex(r >= 15 ? GAS_POOL : ROCK_POOL, colSeed(p.ticker));
    loadReal(realName, t => {
      mesh.material.map = t; mesh.material.bumpMap = null;
      mesh.material.color.set(0xffffff); mesh.material.needsUpdate = true;
      mesh.userData.realTex = true;
    });
    if (i === 5 || i === 6) {  // 토성·천왕성 궤도 — 실사 고리
      const geo = new THREE.RingGeometry(r*1.45, r*2.15, 96);
      const pos = geo.attributes.position, uv = geo.attributes.uv, v3 = new THREE.Vector3();
      const inR = r*1.45, outR = r*2.15;
      for (let k = 0; k < pos.count; k++) {
        v3.fromBufferAttribute(pos, k);
        uv.setXY(k, (v3.length() - inR) / (outR - inR), 0.5);
      }
      const ring = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
        map: ringTex(), transparent: true, opacity: i === 5 ? 0.9 : 0.35, side: THREE.DoubleSide, depthWrite: false }));
      loadReal('ring.png', t => { ring.material.map = t; ring.material.needsUpdate = true; });
      ring.rotation.x = i === 5 ? Math.PI/2.35 : Math.PI/2.05;
      mesh.add(ring);
    }
    const orbR = orbitBase + orbitStep*(i+1);  // 궤도 반경 (궤도선은 표시하지 않음 — 행성이 주인공)
    // 라벨 (HTML — 항상 선명)
    const lab = document.createElement('div');
    lab.style.cssText = 'position:absolute;transform:translate(-50%,0);text-align:center;pointer-events:none;text-shadow:0 1px 4px #0a0d18,0 0 8px #0a0d18;line-height:1.25;white-space:nowrap';
    lab.innerHTML = '<span style="color:#e6ebfa;font-weight:800;font-size:12.5px">'+esc(shortName(p))+'</span>' +
      (i < 8 ? '<br><span style="color:#93a0c6;font-weight:700;font-size:10.5px">'+(p.mc>=1000?'$'+(p.mc/1000).toFixed(2)+'T':'$'+Math.round(p.mc)+'B')+'</span>' : '');
    document.getElementById('s3labels').appendChild(lab);
    return { mesh, lab, r, orbR, a: (i*137.5)*Math.PI/180, s: 0.0022/(1+i*0.22), spin: 0.002+Math.random()*0.004 };
  });
  // 태양 라벨
  const sunLab = document.createElement('div');
  sunLab.style.cssText = 'position:absolute;transform:translate(-50%,0);text-align:center;pointer-events:none;text-shadow:0 1px 4px #0a0d18;line-height:1.3;white-space:nowrap';
  sunLab.innerHTML = '<span style="color:#ffd873;font-weight:800;font-size:15px">'+esc(shortName(sun))+'</span><br><span style="color:#d4b06a;font-weight:700;font-size:11.5px">$'+(sun.mc/1000).toFixed(2)+'T</span>';
  document.getElementById('s3labels').appendChild(sunLab);

  // 조작 — 드래그 회전 · 휠 줌 · 호버 툴팁
  const tip = document.getElementById('solarTip');
  const ray = new THREE.Raycaster(), mouseV = new THREE.Vector2();
  let dragging = false, px = 0, py = 0, hovered = null;
  wrap.addEventListener('mousedown', e => { dragging = true; lastTouch = performance.now(); px = e.clientX; py = e.clientY; wrap.style.cursor = 'grabbing'; });
  window.addEventListener('mouseup', () => { dragging = false; wrap.style.cursor = 'grab'; });
  wrap.addEventListener('mousemove', e => {
    const rect = wrap.getBoundingClientRect();
    if (dragging) {
      lastTouch = performance.now();
      camTheta -= (e.clientX - px) * 0.005; camPhi -= (e.clientY - py) * 0.004;
      camPhi = Math.max(0.35, Math.min(1.45, camPhi)); px = e.clientX; py = e.clientY;
    }
    mouseV.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouseV.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    ray.setFromCamera(mouseV, camera);
    const hit = ray.intersectObjects(bodies)[0];
    if (hit) {
      const s = stocks[hit.object.userData.i];
      tip.style.display = 'block';
      tip.style.left = Math.min(e.clientX - rect.left + 14, rect.width - 230) + 'px';
      tip.style.top = (e.clientY - rect.top + 14) + 'px';
      tip.innerHTML = '<b>'+esc(s.name)+'</b> '+esc(s.flag||'')+'<br>'+(s.mc>=1000?'$'+(s.mc/1000).toFixed(2)+'T':'$'+Math.round(s.mc)+'B')+(s.desc?'<br>'+esc(s.desc):'');
      if (hovered && hovered !== hit.object && hovered.material.emissive) hovered.material.emissive.setHex(0x000000);
      hovered = hit.object;
      if (hovered.material.emissive) hovered.material.emissive.setHex(0x33290f);
    } else {
      tip.style.display = 'none';
      if (hovered && hovered.material.emissive) hovered.material.emissive.setHex(0x000000);
      hovered = null;
    }
  });
  wrap.addEventListener('wheel', e => { e.preventDefault(); lastTouch = performance.now();
    camDist = Math.max(320, Math.min(maxDist, camDist + e.deltaY * 0.5)); }, { passive: false });

  // ── 모바일 터치: 한 손가락 회전 · 두 손가락 핀치 줌 · 짧은 탭 = 행성 정보 ──
  function probeTip(cx, cy){
    const rect = wrap.getBoundingClientRect();
    mouseV.x = ((cx - rect.left) / rect.width) * 2 - 1;
    mouseV.y = -((cy - rect.top) / rect.height) * 2 + 1;
    ray.setFromCamera(mouseV, camera);
    const hit = ray.intersectObjects(bodies)[0];
    if (hit) {
      const s = stocks[hit.object.userData.i];
      tip.style.display = 'block';
      tip.style.left = Math.max(6, Math.min(cx - rect.left - 60, rect.width - 230)) + 'px';
      tip.style.top = Math.max(6, cy - rect.top - 90) + 'px';
      tip.innerHTML = '<b>'+esc(s.name)+'</b> '+esc(s.flag||'')+'<br>'+(s.mc>=1000?'$'+(s.mc/1000).toFixed(2)+'T':'$'+Math.round(s.mc)+'B')+(s.desc?'<br>'+esc(s.desc):'');
    } else {
      tip.style.display = 'none';
    }
  }
  let pinchD = 0, tapX = 0, tapY = 0, tapT = 0, tapMoved = false;
  wrap.addEventListener('touchstart', e => {
    lastTouch = performance.now();
    if (e.touches.length === 1) {
      dragging = true; tapMoved = false;
      px = e.touches[0].clientX; py = e.touches[0].clientY;
      tapX = px; tapY = py; tapT = performance.now();
    } else if (e.touches.length === 2) {
      dragging = false; tapMoved = true;
      pinchD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                          e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });
  wrap.addEventListener('touchmove', e => {
    e.preventDefault();  // 캔버스 위에서는 페이지 스크롤 대신 우주가 움직인다
    lastTouch = performance.now();
    if (e.touches.length === 1 && dragging) {
      const x = e.touches[0].clientX, y = e.touches[0].clientY;
      if (Math.abs(x - tapX) + Math.abs(y - tapY) > 8) tapMoved = true;
      camTheta -= (x - px) * 0.005; camPhi -= (y - py) * 0.004;
      camPhi = Math.max(0.35, Math.min(1.45, camPhi)); px = x; py = y;
    } else if (e.touches.length === 2) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                           e.touches[0].clientY - e.touches[1].clientY);
      if (pinchD > 0 && d > 0) {
        camDist = Math.max(320, Math.min(maxDist, camDist * (pinchD / d)));
      }
      pinchD = d;
    }
  }, { passive: false });
  wrap.addEventListener('touchend', e => {
    lastTouch = performance.now();
    if (e.touches.length === 0) {
      dragging = false;
      if (!tapMoved && performance.now() - tapT < 350) probeTip(tapX, tapY);
    } else if (e.touches.length === 1) {
      dragging = true; tapMoved = true;
      px = e.touches[0].clientX; py = e.touches[0].clientY;
    }
    pinchD = 0;
  }, { passive: true });

  const v = new THREE.Vector3();
  function place(mesh, lab, yOff){
    v.copy(mesh.position); v.y -= yOff; v.project(camera);
    if (v.z > 1) { lab.style.display = 'none'; return; }
    lab.style.display = '';
    lab.style.left = ((v.x*0.5+0.5)*W) + 'px';
    lab.style.top = ((-v.y*0.5+0.5)*H) + 'px';
    lab.style.opacity = Math.max(0.45, 1.15 - mesh.position.distanceTo(camera.position)/1400).toFixed(2);
  }
  let t0 = 0, firstFrame = true;
  function frame(t){
    const dt = Math.min(50, t - t0); t0 = t;
    if (firstFrame) { firstFrame = false; const ld = document.getElementById('s3load'); if (ld) ld.remove(); }
    // 텍스처 지연 장착 — 프레임당 1개씩 (첫 화면을 막지 않음)
    if (texQueue.length) {
      const q = texQueue.shift();
      try { if (q.mesh.userData.realTex) throw 0;
        const key = q.seed + (q.rocky ? 'r' : 'g');
        const tex = __texCache[key] || (__texCache[key] = planetTex(q.hi, q.lo, q.seed, q.rocky));
        q.mesh.material.map = tex; q.mesh.material.bumpMap = tex;
        q.mesh.material.bumpScale = q.rocky ? 0.7 : 0.35;
        q.mesh.material.color.set(0xffffff);
        q.mesh.material.needsUpdate = true; } catch(e){}
    }
    // 진입 돌리 (2.2초) + 3초 무조작 시 자동 선회
    if (introT < 1) { introT = Math.min(1, introT + dt / 2200);
      const ease = 1 - Math.pow(1 - introT, 3);
      camDist = (introEnd + 490) - 490 * ease;
      camTheta += dt * 0.00018;
    } else if (!dragging && performance.now() - lastTouch > 3000) {
      camTheta += dt * 0.00006;
    }
    orbs.forEach(o => {
      o.a += o.s * dt * 0.06;
      o.mesh.position.set(Math.cos(o.a)*o.orbR, 0, Math.sin(o.a)*o.orbR);
      o.mesh.rotation.y += o.spin;
    });
    if (sunUni) sunUni.t.value = t * 0.001;
    const pulse = 1 + Math.sin(t/900)*0.05;
    glow1.scale.set(sunR*6.5*pulse, sunR*6.5*pulse, 1);
    camera.position.set(camDist*Math.sin(camPhi)*Math.cos(camTheta), camDist*Math.cos(camPhi), camDist*Math.sin(camPhi)*Math.sin(camTheta));
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    orbs.forEach(o => place(o.mesh, o.lab, o.r + 6));
    place(sunMesh, sunLab, sunR + 6);
    solar3d.raf = requestAnimationFrame(frame);
  }
  solar3d = { renderer, raf: requestAnimationFrame(frame) };
}

/* ── 우주 지도 (트리맵) ── */
function chgColor(chg){
  // 한국형 빛의 문법: 상승 = 금빛으로 타오름 · 하락 = 코발트로 얼어붙음 (한국 증시의 빨강/파랑 감각)
  if (chg === null || chg === undefined) return '#3a4157';
  const v = Math.max(-3, Math.min(3, chg)) / 3;
  const mix = (a, b, t) => Math.round(a + (b - a) * t);
  const base = [58, 65, 87];                          // 무풍 — 무채 슬레이트
  const to = v >= 0 ? [242, 186, 60] : [56, 110, 225]; // 발광 금빛 / 선명한 코발트
  const t = Math.pow(Math.abs(v), 0.72);
  return 'rgb(' + mix(base[0], to[0], t) + ',' + mix(base[1], to[1], t) + ',' + mix(base[2], to[2], t) + ')';
}
const chgText = chg => (chg !== null && chg >= 1.5) ? '#1c2333' : '#eef2ff';  // 밝은 금빛 위엔 남색 글씨

function squarify(items, x, y, w, h, out){
  // items: [{v, ...}] 내림차순 — 고전 squarified treemap
  if (!items.length) return;
  const total = items.reduce((s, i) => s + i.v, 0);
  let row = [], rest = items.slice(), best = Infinity;
  const vertical = w < h;
  const side = vertical ? w : h;
  while (rest.length) {
    const cand = row.concat([rest[0]]);
    const sum = cand.reduce((s, i) => s + i.v, 0);
    const area = sum / total * w * h;
    const thick = area / side;
    let worst = 0;
    cand.forEach(i => { const len = (i.v / sum) * side;
      worst = Math.max(worst, Math.max(thick / len, len / thick)); });
    if (worst <= best) { row = cand; rest.shift(); best = worst; }
    else break;
  }
  const sum = row.reduce((s, i) => s + i.v, 0);
  const thick = (sum / total * w * h) / side;
  let off = 0;
  row.forEach(i => {
    const len = (i.v / sum) * side;
    if (vertical) out.push({ ...i, x: x + off, y: y, w: len, h: thick });
    else out.push({ ...i, x: x, y: y + off, w: thick, h: len });
    off += len;
  });
  if (vertical) squarify(rest, x, y + thick, w, h - thick, out);
  else squarify(rest, x + thick, y, w - thick, h, out);
}

let mapFilter = 'all';

function renderMap(){
  const all = (DATA.tiles || []).filter(t => t.mc > 0);

  all.forEach(t => { gTotals[t.g] = (gTotals[t.g] || 0) + t.mc; });
  const countries = Object.entries(gTotals).sort((a, b) => b[1] - a[1]).map(([g]) => g);
  const flagOf = g => (all.find(t => t.g === g) || {}).f || '';
  const chips = [['all', '전체'], ['earth', '👑 우주지배자'], ['latent', '✦ 잠재지배자']]
    .concat(countries.map(g => ['g:' + g, flagOf(g) + ' ' + g]));
  const chipsHtml = '<div class="map-chips">' + chips.map(([k, label]) =>
    '<button class="map-chip' + (mapFilter === k ? ' active' : '') + '" onclick="setMapFilter(\'' + k + '\')">' + esc(label) + '</button>').join('') + '</div>';

  let tiles = all;
  if (mapFilter === 'earth') tiles = all.filter(t => t.e);
  else if (mapFilter === 'latent') tiles = all.filter(t => t.l);
  else if (mapFilter.startsWith('g:')) tiles = all.filter(t => t.g === mapFilter.slice(2));

  const glist = Object.values(groups).sort((a, b) => b.v - a.v);
  glist.forEach(g => g.items.sort((a, b) => b.v - a.v));
  // 1단계: 국가 블록 배치 → 2단계: 블록 내 종목 배치

    const inner = [];

    if (gb.w > 46 && gb.h > 26)

    inner.forEach(t => {

      const fs = Math.max(8.5, Math.min(21, Math.sqrt(t.w * t.h) / 4.6, t.w / (label.length * 0.62)));

        ' data-tip="' + esc(t.n) + '|' + esc(t.f) + '|' + t.mc + '|' + (t.chg === null ? '' : t.chg) + '">' +
        (mid ? '<span class="tk" style="font-size:' + fs.toFixed(1) + 'px">' + esc(label) + '</span>' : '') +

    '<div class="solar-legend">빛날수록 상승, 가라앉을수록 하락 — 칸 크기 = 시가총액 · ' + subtitle + ' (' + esc(DATA.fetched || '') + ' 관측)</div>';

    } else tip.style.display = 'none';
  });
  wrap.addEventListener('mouseleave', () => tip.style.display = 'none');

/* ── 관측일지 ── */
function colSeed(str){ let h = 2166136261;
  for (const ch of String(str||'')) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0; }

function makeColViz(c){
  const W = 800, H = 150;
  let seed = colSeed(c.title);
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let inner = '';
  const gid = 'cv' + colSeed(c.title) % 100000;
  let defs = '<defs><radialGradient id="'+gid+'sp" cx="50%" cy="30%" r="90%"><stop offset="0%" stop-color="#1b2244"/><stop offset="100%" stop-color="#0a0d18"/></radialGradient>' +
    '<radialGradient id="'+gid+'g"><stop offset="0%" stop-color="#ffd873"/><stop offset="60%" stop-color="#d4a63f"/><stop offset="100%" stop-color="#9c7a3a"/></radialGradient></defs>';
  inner += '<rect width="'+W+'" height="'+H+'" fill="url('+'#'+gid+'sp)"/>';
  for (let i = 0; i < 60; i++)
    inner += '<circle cx="'+(rnd()*W).toFixed(1)+'" cy="'+(rnd()*H).toFixed(1)+'" r="'+(rnd()*1.1+0.2).toFixed(2)+'" fill="#f5f1e6" opacity="'+(rnd()*0.5+0.15).toFixed(2)+'"/>';

  if (c.viz && c.viz.type === 'solar' && Array.isArray(c.viz.planets) && c.viz.planets.length) {
    // 주간 미니 태양계 — 그 주의 TOP 5 실데이터
    const ps = c.viz.planets.slice(0, 5);
    const maxMc = Math.max(...ps.map(p => p.mc || 1));
    const step = W / (ps.length + 1);
    ps.forEach((p, i) => {
      const x = step * (i + 1), r = 8 + Math.sqrt((p.mc || 1) / maxMc) * 26;
      inner += i === 0
        ? '<circle cx="'+x+'" cy="'+(H*0.44)+'" r="'+(r+6)+'" fill="url(#'+gid+'g)"/>'
        : '<circle cx="'+x+'" cy="'+(H*0.44)+'" r="'+r.toFixed(1)+'" fill="#8fa3d9" opacity="0.92"/>';
      inner += '<text x="'+x+'" y="'+(H-14)+'" text-anchor="middle" fill="#c8d0ea" font-size="11.5" font-weight="700" style="paint-order:stroke" stroke="#0a0d18" stroke-width="3">'+esc((p.n||'').split(' ')[0])+'</text>';
    });
  } else {
    const KINDS = { constellation: 0, nebula: 1, orbit: 2 };
    const kind = (c.viz && KINDS[c.viz.type] !== undefined) ? KINDS[c.viz.type] : colSeed(c.title) % 3;
    if (kind === 0) {
      // 별자리 — 별들을 잇는 금색 선, 가장 밝은 별 하나
      const pts = []; for (let i = 0; i < 7; i++) pts.push([60 + rnd()*(W-120), 25 + rnd()*(H-50)]);
      pts.sort((a,b)=>a[0]-b[0]);
      inner += '<polyline points="'+pts.map(p=>p[0].toFixed(0)+','+p[1].toFixed(0)).join(' ')+'" fill="none" stroke="#d4a63f" stroke-opacity="0.55" stroke-width="1.3"/>';
      pts.forEach((p,i)=>{ inner += '<circle cx="'+p[0].toFixed(0)+'" cy="'+p[1].toFixed(0)+'" r="'+(i===3?5:2.6)+'" fill="'+(i===3?'url(#'+gid+'g)':'#e6ebfa')+'"/>'; });
    } else if (kind === 1) {
      // 성운 — 겹치는 발광 타원
      const cols2 = ['#5a4a9e','#2e6d8a','#9c7a3a'];
      for (let i = 0; i < 3; i++)
        inner += '<ellipse cx="'+(W*(0.25+rnd()*0.5)).toFixed(0)+'" cy="'+(H*(0.3+rnd()*0.4)).toFixed(0)+'" rx="'+(120+rnd()*160).toFixed(0)+'" ry="'+(40+rnd()*50).toFixed(0)+'" fill="'+cols2[i]+'" opacity="0.22" transform="rotate('+((rnd()*40-20).toFixed(0))+')"/>';
      inner += '<circle cx="'+(W*0.5+((rnd()-0.5)*200)).toFixed(0)+'" cy="'+(H*0.5).toFixed(0)+'" r="4.5" fill="url(#'+gid+'g)"/>';
    } else {
      // 궤도 — 상승하는 행성
      for (let i = 1; i <= 4; i++)
        inner += '<ellipse cx="'+(W*0.28)+'" cy="'+(H*0.5)+'" rx="'+(i*72)+'" ry="'+(i*26)+'" fill="none" stroke="#4a5578" stroke-opacity="0.5" stroke-width="0.9" stroke-dasharray="1 6"/>';
      inner += '<circle cx="'+(W*0.28)+'" cy="'+(H*0.5)+'" r="17" fill="url(#'+gid+'g)"/>';
      inner += '<circle cx="'+(W*0.28 + 216)+'" cy="'+(H*0.5 - 55)+'" r="9" fill="#8fa3d9"/>';
      inner += '<path d="M '+(W*0.28+150)+' '+(H*0.72)+' Q '+(W*0.28+200)+' '+(H*0.45)+' '+(W*0.28+212)+' '+(H*0.5-48)+'" fill="none" stroke="#d4a63f" stroke-opacity="0.6" stroke-width="1.4" stroke-dasharray="3 4"/>';
    }
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+defs+inner+'</svg>';
}

/* ── 시차 관측 — 버핏 멀티플 괴리 (측정층: data/buffett.json) ──
   괴리 = 정당 MAX ÷ P/E − 1. 양수 = 정당선 아래. 판단층은 사람이 취재한 config. */
const PX_SKIP = ['too_hard', 'unlisted', 'float'];
const PX_BASIS = { forward: '선행', trailing: '후행 참고', '미취재': '미취재',
                   too_hard: '추정불가', unlisted: '비상장', float: '플로트형' };
const PX_ZONES = ['탐색', '본격', '관망', '고평가'];

/* 존 판정은 선행(forward)으로 잰 종목만 — 정당 MAX 가 선행 눈금이라
   후행 P/E 를 같은 자에 대면 전부 고평가로 쏠린다. 후행은 참고 수치로만 싣는다. */
function pxZoned(x){
  return x.zoned === true || (x.zoned === undefined && x.basis === 'forward');
}

function pxZone(gap, z){
  if (gap == null) return null;
  if (gap >= z.explore) return '탐색';
  if (gap >= z.commit) return '본격';
  if (gap >= 0) return '관망';
  return '고평가';
}

function pxSpark(series){
  if (!series || series.length < 2) return '';   // 2점 미만이면 선을 그리지 않는다
  const W = 86, H = 22, P = 2;
  const gs = series.map(p => p.gap);
  const mn = Math.min(...gs), mx = Math.max(...gs), span = (mx - mn) || 1;
  const pts = series.map((p, i) => {
    const x = P + (W - 2 * P) * (i / (series.length - 1));
    const y = H - P - (H - 2 * P) * ((p.gap - mn) / span);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  const rising = gs[gs.length - 1] >= gs[0];
  return '<svg class="px-spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<polyline points="' + pts + '" fill="none" stroke="' + (rising ? 'var(--gold)' : 'var(--text-muted)') +
    '" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function pxPct(g){ return (g >= 0 ? '+' : '') + (g * 100).toFixed(0) + '%'; }

/* 유형 용어집 — 표를 읽기 전에 자(尺)의 눈금을 먼저 설명한다 */
const PX_GLOSSARY =
  '<details class="px-gloss" open><summary>유형 용어집 — 이 표의 눈금 읽는 법</summary><dl>' +
  '<dt>씨즈형</dt><dd>간판만 바꿔도 월세가 오르는 건물. 초콜릿 가게 하나(씨즈캔디)가 이익을 16배 불리는 동안 ' +
    '쓴 증축비는 고작 3,200만 달러 — 보통 건물이면 4억 달러짜리 공사였다. 건물주가 할 일은 가격표를 새로 붙이는 것뿐.</dd>' +
  '<dt>통행료형</dt><dd>모두가 건너야 하는 다리. 다리 주인은 공사를 안 해도 통행량이 늘 때마다 돈을 번다 (ASML·Arm). ' +
    '문제는 이런 다리가 세상에 몇 개 없다는 것.</dd>' +
  '<dt>플라이트세이프티형</dt><dd>월세는 잘 나오는데, 올리려면 매번 크레인을 불러야 하는 건물 (TSMC·릴리). ' +
    '우량하지만 번 돈의 상당분이 다시 공사판으로 들어간다.</dd>' +
  '<dt>시클리컬</dt><dd>월세를 건물주가 아니라 날씨(경기)가 정하는 건물 (메모리·은행·에너지). ' +
    '호황엔 월세 3배, 불황엔 공실. 그래서 괴리는 보여주되 존에는 올리지 않는다.</dd>' +
  '<dt>플로트형</dt><dd>월세가 아니라 세입자들이 맡긴 보증금을 공짜로 굴려서 버는 건물주 (버크셔). ' +
    '월세 장부(P/E)만 보면 영원히 싸 보이니, 이 시차계로는 재지 않는다.</dd>' +
  '<dt>추정불가(too hard)</dt><dd>10년 뒤 월세 칸이 백지인 건물. 나쁜 건물이라서가 아니라, 아무도 그 칸을 ' +
    '자신 있게 못 적는 것 (버핏: 그 경우 모든 투입은 투기다). 낙제가 아니라 "모른다"는 정직.</dd>' +
  '<dt>미취재</dt><dd>아직 감정평가사(취재)가 안 다녀간 건물. 실적 시즌에 선행 EPS를 채우면 눈금이 생긴다.</dd>' +
  '<dt>⚠ 정점 주의</dt><dd>시클리컬 전용 경고등. 정점 이익으로 나눈 P/E는 바닥처럼 보이는 천장이다 — ' +
    '하이닉스가 4.8배로 "가장 싸 보이는" 순간이 사이클의 꼭대기일 수 있다. 표의 배지가 이것.</dd>' +
  '</dl></details>';

/* 배지 툴팁은 용어집 '⚠ 정점 주의' 항목과 같은 문장을 쓴다 — 두 곳이 어긋나면 안 된다 */
const PX_PEAK_TIP = '시클리컬 전용 경고등. 정점 이익으로 나눈 P/E는 바닥처럼 보이는 천장이다 — ' +
  '하이닉스가 4.8배로 "가장 싸 보이는" 순간이 사이클의 꼭대기일 수 있다.';

function pxRow(x, z, hist){
  const zoned = pxZoned(x);
  const zone = zoned ? pxZone(x.gap, z) : null;   // 후행은 존을 매기지 않는다
  let cls = 'none', txt = '—';
  if (x.gap != null) {
    txt = pxPct(x.gap);
    cls = !zoned ? 'cold'
      : (zone === '탐색' || zone === '본격') ? 'hot'
      : (zone === '고평가') ? 'cold' : '';
  }
  const pe = x.pe != null ? x.pe.toFixed(1) : '—';
  return '<tr>' +
    '<td><div class="px-tk">' + esc(x.ticker) + '</div>' +
      '<div class="px-name">' + esc(x.name) + '</div></td>' +
    '<td class="px-type">' + esc(x.type) + '</td>' +
    '<td class="px-num">' + pe +
      '<span class="px-basis">' + esc(PX_BASIS[x.basis] || x.basis) + '</span>' +
      (x.eps_asof ? '<div class="px-eps">EPS ' + esc(x.eps_asof) + '</div>' : '') +
      (x.note ? '<div class="px-eps">' + esc(x.note) + '</div>' : '') + '</td>' +
    '<td class="px-num">' + (x.fair_max != null ? x.fair_max : '—') + '</td>' +
    '<td><span class="px-gap ' + cls + '">' + txt + '</span>' +
      (x.cyclical ? '<span class="px-peak" title="' + esc(PX_PEAK_TIP) + '">⚠ 정점 주의</span>' : '') +
      (zone ? '<div class="px-zonetag">' + zone + '</div>' : '') +
      pxSpark(hist[x.ticker]) + '</td>' +
    '<td class="px-why">' + esc(x.rationale) + '</td>' +
  '</tr>';
}

function renderParallax(){
  const b = (DATA.buffett) || {};
  const items = b.items || [];
  const host = document.getElementById('obsBody');
  if (!items.length) {
    host.innerHTML = '<div class="obs-note">시차 관측 준비 중 — 첫 측정이 끝나면 이곳에 괴리가 실립니다.</div>';
    return;
  }
  const z = b.zones || { explore: 0.60, commit: 0.40 };
  const hist = b.history || {};
  const basket = items.filter(x => PX_SKIP.indexOf(x.basis) >= 0);
  const board = items.filter(x => PX_SKIP.indexOf(x.basis) < 0)
    .sort((a, c) => (c.gap == null ? -Infinity : c.gap) - (a.gap == null ? -Infinity : a.gap));
  const measured = board.filter(x => x.gap != null);
  const zonedItems = measured.filter(pxZoned);      // 존 집계는 선행만

  let html = '<div class="px-notice"><b>버핏 프레임의 관측 실험입니다 — 투자 권유가 아닙니다.</b> ' +
    '정당 멀티플(정당 MAX)은 검증된 수치가 아니라 <b>주관적 추정</b>이며, 괴리는 그 추정에 오늘 시세를 대입한 ' +
    '산술 결과일 뿐입니다. 정당 MAX는 <b>선행</b> 눈금으로 매긴 자이므로, 존 판정과 아래 집계는 선행 기준으로 ' +
    '측정한 종목만 셉니다 — 후행(실적 EPS) 수치는 같은 자에 댈 수 없어 <b>참고 수치</b>로만 싣습니다. ' +
    'EPS 추정 기준일은 표에 함께 적었습니다. 어떤 항목도 매수·매도 신호가 아닙니다.</div>';

  html += '<div class="px-asof">판단층 기준일 ' + esc(b.asof || '—') +
    ' · 측정 ' + esc(b.generated_label || '—') + ' KST · 매일 3회 자동 측정 (예약 full) · ' +
    '탐색선 +' + Math.round(z.explore * 100) + '% / 본격선 +' + Math.round(z.commit * 100) + '%</div>';

  html += '<div class="px-strip">' + PX_ZONES.map(n => {
    const c = zonedItems.filter(x => pxZone(x.gap, z) === n).length;
    const on = (n === '탐색' || n === '본격') && c > 0;
    return '<div class="px-zone' + (on ? ' on' : '') + '">' +
      '<div class="z-name">' + n + (n === '탐색' ? ' +' + Math.round(z.explore * 100) + '%↑'
        : n === '본격' ? ' +' + Math.round(z.commit * 100) + '%↑' : '') + '</div>' +
      '<div class="z-n">' + c + '<span style="font-size:12px;font-weight:700">종</span></div></div>';
  }).join('') + '</div>' +
  '<div class="px-stripnote"><b>존 판정은 비시클리컬·선행 기준만.</b> 집계 대상 ' + zonedItems.length + '종 — ' +
  '나머지 ' + (measured.length - zonedItems.length) + '종(후행 참고 · 시클리컬)은 눈금이 달라 존을 매기지 않습니다.</div>';

  html += PX_GLOSSARY;

  html += '<div class="px-wrap"><table class="px-table"><thead><tr>' +
    '<th>티커</th><th>유형</th><th>P/E</th><th>정당 MAX</th><th>괴리</th><th>근거</th>' +
    '</tr></thead><tbody>' +
    board.map(x => pxRow(x, z, hist)).join('') + '</tbody></table></div>';

  if (basket.length) {
    // 사유 설명은 실제로 담긴 바구니만 말한다 — 없는 사유를 적어두면 표와 어긋난다
    const reasons = { too_hard: '10년 뒤 월세를 적을 수 없는 별(추정불가)',
                      float: '매력이 월세가 아니라 보증금인 별(플로트형)',
                      unlisted: '시세 자체가 없는 별(비상장)' };
    const present = Object.keys(reasons).filter(k => basket.some(x => x.basis === k))
      .map(k => reasons[k]).join(', ');
    html += '<div class="px-hard"><div class="px-hard-title">too hard 바구니 — ' + basket.length + '종</div>' +
      '<div class="px-hard-desc">낙제가 아니라 원칙입니다. ' + present + ' — 이 자로는 재지 않습니다. ' +
      '재지 못한다는 사실을 적어두는 것이 억지로 숫자를 만드는 것보다 정직합니다.</div>' +
      '<div class="px-wrap"><table class="px-table"><thead><tr>' +
      '<th>티커</th><th>유형</th><th>사유</th><th>근거</th></tr></thead><tbody>' +
      basket.map(x => '<tr><td><div class="px-tk">' + esc(x.ticker) + '</div>' +
        '<div class="px-name">' + esc(x.name) + '</div></td>' +
        '<td class="px-type">' + esc(x.type) + '</td>' +
        '<td class="px-type">' + esc(PX_BASIS[x.basis] || x.basis) + '</td>' +
        '<td class="px-why">' + esc(x.rationale) + '</td></tr>').join('') +
      '</tbody></table></div></div>';
  }
  host.innerHTML = html;
}

function renderColumns(){
  const cols = (DATA.columns || []);
  if (!cols.length) { document.getElementById('obsBody').innerHTML =
    '<div class="obs-note">첫 관측일지를 준비 중입니다 — 곧 기록이 시작됩니다.</div>'; return; }
  // 아코디언 — 연표가 먼저, 전문은 클릭. 기본은 최신 1편만 펼침.
  // 비주얼(col-viz)은 detail 안으로 들어간다: 접힌 목록은 날짜·유형·제목만 남아야
  // '언제 무슨 관측이 있었나'라는 시간의 축이 보인다.
  document.getElementById('obsBody').innerHTML = cols.map((c, i) => {
    const open = (i === 0);
    return '<div class="col-card ud-acc'+(open?' open':'')+'" id="col-'+i+'" data-log="'+colSlug(c)+'">'+
      '<button class="ud-acc-head" onclick="toggleCol('+i+')" aria-expanded="'+open+'" aria-controls="colbody-'+i+'">'+
        '<span class="ud-acc-meta">'+
          '<span class="col-date">'+esc(c.date)+'</span>'+
          '<span class="col-kind">'+esc(colKind(c))+'</span>'+
        '</span>'+
        '<span class="ud-acc-title">'+esc(c.title)+'</span>'+
        '<span class="ud-acc-caret" aria-hidden="true">▸</span>'+
      '</button>'+
      '<div class="ud-acc-detail" id="colbody-'+i+'">'+
        '<div class="col-summary">'+esc(c.summary)+'</div>'+
        '<div class="col-viz">'+makeColViz(c)+'</div>'+
        '<div class="col-share">'+
          '<button onclick="copyColLink(event,'+i+')">🔗 링크 복사</button>'+
          '<button onclick="copyColText(event,'+i+')">📄 본문 복사</button>'+
          dissectBtn(c)+
        '</div>'+
        '<div class="col-body">'+c.body+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
  openFromHash();
}

// 칼럼 유형 표식 — 고정 위치에서 종류가 한눈에 잡히게.
// 이모지는 넣지 않는다: 신호 칼럼 제목이 이미 📡 로 시작해 두 번 찍힌다.
function colKind(c){
  const t = (c && c.title) || '';
  if (t.indexOf('📡') === 0) return '신호';
  if (t.indexOf('주간 관측') >= 0) return '주간';
  return '심층';
}

// 🔬 해부실 연결 — 이 칼럼의 원문이 해부돼 있을 때만 버튼을 만든다.
// DATA.dissected = {원문 URL: 해부 id} (build_site.py가 translations.json에서 주입)
function dissectBtn(c){
  const id = c && c.url && (DATA.dissected || {})[c.url];
  if (!id) return '';
  return '<a class="dx-jump" href="research.html#dx-' + esc(id) + '" onclick="event.stopPropagation()"'+
    ' title="이 신호 원문의 문단별 한국어 브리핑">🔬 해부실에서 보기 →</a>';
}

function colSlug(c){ return 'log-' + colSeed((c.title || '') + (c.date || '')); }

function colUrl(c){
  return location.origin + location.pathname.replace(/[^/]*$/, '') + 'observatory.html#' + colSlug(c);
}

async function copyToClip(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch(e) { window.prompt('아래 내용을 복사하세요 (Ctrl+C):', text.slice(0, 2000)); return; }
  if (btn) { const orig = btn.textContent; btn.textContent = '✓ 복사됨'; setTimeout(() => { btn.textContent = orig; }, 1500); }
}

function copyColLink(ev, i){
  ev.stopPropagation();
  copyToClip(colUrl((DATA.columns || [])[i]), ev.target);
}

function copyColText(ev, i){
  ev.stopPropagation();
  const c = (DATA.columns || [])[i];
  const tmp = document.createElement('div'); tmp.innerHTML = c.body;
  tmp.querySelectorAll('svg, .col-chart').forEach(n => n.remove());
  tmp.querySelectorAll('h3').forEach(n => { n.textContent = '\n■ ' + n.textContent + '\n'; });
  const text = 'UNIVERTRIX 관측일지 — ' + c.title + ' (' + c.date + ')\n' + colUrl(c) + '\n' +
    (tmp.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
  copyToClip(text, ev.target);
}

function setColOpen(card, open){
  if (!card) return;
  card.classList.toggle('open', open);
  const head = card.querySelector('.ud-acc-head');
  if (head) head.setAttribute('aria-expanded', String(open));
}
function openFromHash(){
  const h = location.hash.replace('#', '');
  if (!h.startsWith('log-')) return;
  const card = document.querySelector('.col-card[data-log="' + h + '"]');
  if (!card) return;
  // 링크로 들어온 편이 접혀 있으면 그 링크는 제 일을 못 한 것이다
  setColOpen(card, true);
  setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
}
// 독립 토글 — 두 관측을 나란히 놓고 비교해 읽을 수 있게 (기존 단일 모드에서 변경)
function toggleCol(i){
  const el = document.getElementById('col-'+i);
  if (el) setColOpen(el, !el.classList.contains('open'));
}

if (location.hash === '#parallax') {
  const btn = document.querySelector('.obs-tab[data-t="parallax"]');
  if (btn) setObsTab('parallax', btn); else renderParallax();
} else if (location.hash && (location.hash.indexOf('#log-') === 0 || location.hash === '#columns')) {
  const btn = document.querySelector('.obs-tab[data-t="columns"]');
  if (btn) setObsTab('columns', btn); else renderColumns();
} else {
  renderSolar();
}
</script>
<!-- uv-presence -->
<script type="module">
(async () => {
  try {
    const cfg = await (await fetch('data/firebase_config.json?v=' + Date.now())).json();
    if (!cfg || !cfg.apiKey) return;
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const { getFirestore, doc, setDoc, collection, query, where, Timestamp, serverTimestamp, getCountFromServer } =
      await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const db = getFirestore(initializeApp(cfg, 'presence'));

    let pid = localStorage.getItem('uv_pid');
    if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem('uv_pid', pid); }

    const beat = () => setDoc(doc(db, 'presence', pid), { t: serverTimestamp() }).catch(() => {});
    const count = async () => {
      try {
        const cutoff = Timestamp.fromMillis(Date.now() - 2 * 60 * 1000);
        const snap = await getCountFromServer(query(collection(db, 'presence'), where('t', '>', cutoff)));
        const n = snap.data().count;
        if (n > 0) {
          let el = document.getElementById('uvPresence');
          if (!el) {
            const ft = document.querySelector('.site-footer') || document.querySelector('footer');
            if (!ft) return;
            el = document.createElement('div');
            el.id = 'uvPresence';
            el.style.cssText = 'margin-top:8px;font-size:12px;color:var(--text-muted,#8a8577);';
            ft.appendChild(el);
          }
          el.innerHTML = '<span style="color:var(--gold,#9C7A3A)">✦</span> 지금 ' + n + '명이 우주를 관측 중';
        }
      } catch (e) {}
    };
    await beat(); await count();
    setInterval(beat, 60 * 1000 + Math.floor(Math.random() * 5000));
    setInterval(count, 60 * 1000 + Math.floor(Math.random() * 5000));
  } catch (e) {}
})();
</script>
