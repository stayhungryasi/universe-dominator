      tip.style.top = (e.clientY - rect.top + 14) + 'px';
      tip.innerHTML = '<b>'+esc(s.name)+'</b> '+esc(s.flag||'')+'<br>'+(s.mc>=1000?'$'+(s.mc/1000).toFixed(2)+'T':'$'+Math.round(s.mc)+'B')+(s.desc?'<br>'+esc(s.desc):'');
      if (hovered && hovered !== hit.object && hovered.material.emissive) hovered.material.emissive.setHex(0x000000);
      hovered = hit.object;
      if (hovered.material.emissive) hovered.material.emissive.setHex(0x33290f);
    } else {
      tip.style.display = 'none';
      if (hovered && hovered.material.emissive) hovered.material.emissive.setHex(0x000000);
      hovered = null;
    }
  });
  wrap.addEventListener('wheel', e => { e.preventDefault(); lastTouch = performance.now();
    camDist = Math.max(320, Math.min(maxDist, camDist + e.deltaY * 0.5)); }, { passive: false });

  // ── 모바일 터치: 한 손가락 회전 · 두 손가락 핀치 줌 · 짧은 탭 = 행성 정보 ──
  function probeTip(cx, cy){
    const rect = wrap.getBoundingClientRect();
    mouseV.x = ((cx - rect.left) / rect.width) * 2 - 1;
    mouseV.y = -((cy - rect.top) / rect.height) * 2 + 1;
    ray.setFromCamera(mouseV, camera);
    const hit = ray.intersectObjects(bodies)[0];
    if (hit) {
      const s = stocks[hit.object.userData.i];
      tip.style.display = 'block';
      tip.style.left = Math.max(6, Math.min(cx - rect.left - 60, rect.width - 230)) + 'px';
      tip.style.top = Math.max(6, cy - rect.top - 90) + 'px';
      tip.innerHTML = '<b>'+esc(s.name)+'</b> '+esc(s.flag||'')+'<br>'+(s.mc>=1000?'$'+(s.mc/1000).toFixed(2)+'T':'$'+Math.round(s.mc)+'B')+(s.desc?'<br>'+esc(s.desc):'');
    } else {
      tip.style.display = 'none';
    }
  }
  let pinchD = 0, tapX = 0, tapY = 0, tapT = 0, tapMoved = false;
  wrap.addEventListener('touchstart', e => {
    lastTouch = performance.now();
    if (e.touches.length === 1) {
      dragging = true; tapMoved = false;
      px = e.touches[0].clientX; py = e.touches[0].clientY;
      tapX = px; tapY = py; tapT = performance.now();
    } else if (e.touches.length === 2) {
      dragging = false; tapMoved = true;
      pinchD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                          e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });
  wrap.addEventListener('touchmove', e => {
    e.preventDefault();  // 캔버스 위에서는 페이지 스크롤 대신 우주가 움직인다

      if (Math.abs(x - tapX) + Math.abs(y - tapY) > 8) tapMoved = true;
      camTheta -= (x - px) * 0.005; camPhi -= (y - py) * 0.004;
      camPhi = Math.max(0.35, Math.min(1.45, camPhi)); px = x; py = y;
    } else if (e.touches.length === 2) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                           e.touches[0].clientY - e.touches[1].clientY);
      if (pinchD > 0 && d > 0) {
        camDist = Math.max(320, Math.min(maxDist, camDist * (pinchD / d)));
      }
      pinchD = d;
    }
  }, { passive: false });
  wrap.addEventListener('touchend', e => {
    lastTouch = performance.now();
    if (e.touches.length === 0) {
      dragging = false;
      if (!tapMoved && performance.now() - tapT < 350) probeTip(tapX, tapY);
    } else if (e.touches.length === 1) {
      dragging = true; tapMoved = true;
      px = e.touches[0].clientX; py = e.touches[0].clientY;
    }
    pinchD = 0;
  }, { passive: true });

  const v = new THREE.Vector3();
  function place(mesh, lab, yOff){
    v.copy(mesh.position); v.y -= yOff; v.project(camera);
    if (v.z > 1) { lab.style.display = 'none'; return; }
    lab.style.display = '';

  }
  let t0 = 0, firstFrame = true;
  function frame(t){
    const dt = Math.min(50, t - t0); t0 = t;
    if (firstFrame) { firstFrame = false; const ld = document.getElementById('s3load'); if (ld) ld.remove(); }
    // 텍스처 지연 장착 — 프레임당 1개씩 (첫 화면을 막지 않음)
    if (texQueue.length) {
      const q = texQueue.shift();
      try { if (q.mesh.userData.realTex) throw 0;
        const key = q.seed + (q.rocky ? 'r' : 'g');
        const tex = __texCache[key] || (__texCache[key] = planetTex(q.hi, q.lo, q.seed, q.rocky));
        q.mesh.material.map = tex; q.mesh.material.bumpMap = tex;
        q.mesh.material.bumpScale = q.rocky ? 0.7 : 0.35;
        q.mesh.material.color.set(0xffffff);
        q.mesh.material.needsUpdate = true; } catch(e){}
    }
    // 진입 돌리 (2.2초) + 3초 무조작 시 자동 선회
    if (introT < 1) { introT = Math.min(1, introT + dt / 2200);

      camDist = (introEnd + 490) - 490 * ease;
      camTheta += dt * 0.00018;
    } else if (!dragging && performance.now() - lastTouch > 3000) {
      camTheta += dt * 0.00006;
    }
    orbs.forEach(o => {
      o.a += o.s * dt * 0.06;
      o.mesh.position.set(Math.cos(o.a)*o.orbR, 0, Math.sin(o.a)*o.orbR);
      o.mesh.rotation.y += o.spin;
    });
    if (sunUni) sunUni.t.value = t * 0.001;
    const pulse = 1 + Math.sin(t/900)*0.05;
    glow1.scale.set(sunR*6.5*pulse, sunR*6.5*pulse, 1);
    camera.position.set(camDist*Math.sin(camPhi)*Math.cos(camTheta), camDist*Math.cos(camPhi), camDist*Math.sin(camPhi)*Math.sin(camTheta));
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    orbs.forEach(o => place(o.mesh, o.lab, o.r + 6));
    place(sunMesh, sunLab, sunR + 6);
    solar3d.raf = requestAnimationFrame(frame);
  }
  solar3d = { renderer, raf: requestAnimationFrame(frame) };
}

      o.g.setAttribute('opacity', (0.72 + depth * 0.28).toFixed(2));
      const nowFront = sin >= 0;
      if (nowFront !== o.inFront) { (nowFront ? front : back).appendChild(o.g); o.inFront = nowFront; }
    });
    solarRAF = requestAnimationFrame(step);
  };
  step();
}

/* ── 우주 지도 (트리맵) ── */
function chgColor(chg){
  // 한국형 빛의 문법: 상승 = 금빛으로 타오름 · 하락 = 코발트로 얼어붙음 (한국 증시의 빨강/파랑 감각)
  if (chg === null || chg === undefined) return '#3a4157';
  const v = Math.max(-3, Math.min(3, chg)) / 3;
  const mix = (a, b, t) => Math.round(a + (b - a) * t);
  const base = [58, 65, 87];                          // 무풍 — 무채 슬레이트
  const to = v >= 0 ? [242, 186, 60] : [56, 110, 225]; // 발광 금빛 / 선명한 코발트
  const t = Math.pow(Math.abs(v), 0.72);
  return 'rgb(' + mix(base[0], to[0], t) + ',' + mix(base[1], to[1], t) + ',' + mix(base[2], to[2], t) + ')';
}
const chgText = chg => (chg !== null && chg >= 1.5) ? '#1c2333' : '#eef2ff';  // 밝은 금빛 위엔 남색 글씨

function squarify(items, x, y, w, h, out){
  // items: [{v, ...}] 내림차순 — 고전 squarified treemap
  if (!items.length) return;
  const total = items.reduce((s, i) => s + i.v, 0);
  let row = [], rest = items.slice(), best = Infinity;
  const vertical = w < h;
  const side = vertical ? w : h;
  while (rest.length) {
    const cand = row.concat([rest[0]]);
    const sum = cand.reduce((s, i) => s + i.v, 0);
    const area = sum / total * w * h;
    const thick = area / side;
    let worst = 0;
    cand.forEach(i => { const len = (i.v / sum) * side;
      worst = Math.max(worst, Math.max(thick / len, len / thick)); });
    if (worst <= best) { row = cand; rest.shift(); best = worst; }
    else break;
  }
  const sum = row.reduce((s, i) => s + i.v, 0);
  const thick = (sum / total * w * h) / side;
  let off = 0;
  row.forEach(i => {
    const len = (i.v / sum) * side;
    if (vertical) out.push({ ...i, x: x + off, y: y, w: len, h: thick });
    else out.push({ ...i, x: x, y: y + off, w: thick, h: len });
    off += len;
  });
  if (vertical) squarify(rest, x, y + thick, w, h - thick, out);
  else squarify(rest, x + thick, y, w - thick, h, out);
}

let mapFilter = 'all';
function setMapFilter(f){ mapFilter = f; renderMap(); }

function renderMap(){
  const all = (DATA.tiles || []).filter(t => t.mc > 0);
  if (!all.length) { document.getElementById('obsBody').innerHTML = '<div class="obs-note">지도 데이터 대기 중입니다.</div>'; return; }
  // 필터 칩 구성: 전체 · 우주지배자 · 잠재지배자 · 국가별(시총순)
  const gTotals = {};
  all.forEach(t => { gTotals[t.g] = (gTotals[t.g] || 0) + t.mc; });
  const countries = Object.entries(gTotals).sort((a, b) => b[1] - a[1]).map(([g]) => g);
  const flagOf = g => (all.find(t => t.g === g) || {}).f || '';
  const chips = [['all', '전체'], ['earth', '👑 우주지배자'], ['latent', '✦ 잠재지배자']]
    .concat(countries.map(g => ['g:' + g, flagOf(g) + ' ' + g]));
  const chipsHtml = '<div class="map-chips">' + chips.map(([k, label]) =>
    '<button class="map-chip' + (mapFilter === k ? ' active' : '') + '" onclick="setMapFilter(\'' + k + '\')">' + esc(label) + '</button>').join('') + '</div>';

  let tiles = all;
  if (mapFilter === 'earth') tiles = all.filter(t => t.e);
  else if (mapFilter === 'latent') tiles = all.filter(t => t.l);
  else if (mapFilter.startsWith('g:')) tiles = all.filter(t => t.g === mapFilter.slice(2));
  if (!tiles.length) tiles = all;
  const W = Math.min(document.getElementById('obsBody').clientWidth - 22, 1240) || 900, H = 740;
  // 국가 그룹: 시총 합 내림차순
  const groups = {};
  tiles.forEach(t => { (groups[t.g] = groups[t.g] || { name: t.g, f: t.f, v: 0, items: [] }); groups[t.g].v += t.mc; groups[t.g].items.push({ ...t, v: t.mc }); });
  const glist = Object.values(groups).sort((a, b) => b.v - a.v);
  glist.forEach(g => g.items.sort((a, b) => b.v - a.v));
  // 1단계: 국가 블록 배치 → 2단계: 블록 내 종목 배치
  const gout = [];
  squarify(glist.map(g => ({ v: g.v, g })), 0, 0, W, H, gout);
  let html = '';
  gout.forEach(gb => {
    const inner = [];
    squarify(gb.g.items, gb.x + 1, gb.y + 14, gb.w - 2, gb.h - 15, inner);
    if (gb.w > 46 && gb.h > 26)
      html += '<div class="map-head" style="left:' + (gb.x + 3) + 'px;top:' + gb.y + 'px">' + esc(gb.g.f + ' ' + gb.g.name + ' 성단') + '</div>';
    inner.forEach(t => {
      const label = (typeof shortName === 'function') ? shortName({ ticker: t.t, name: t.n }) : t.t;
      const big = t.w > 46 && t.h > 32, mid = t.w > 26 && t.h > 15;
      const fs = Math.max(8.5, Math.min(21, Math.sqrt(t.w * t.h) / 4.6, t.w / (label.length * 0.62)));
      html += '<div class="map-tile" style="left:' + (t.x + 1) + 'px;top:' + (t.y + 1) + 'px;width:' + Math.max(0, t.w - 2).toFixed(1) + 'px;height:' + Math.max(0, t.h - 2).toFixed(1) + 'px;background-color:' + chgColor(t.chg) + ';color:' + chgText(t.chg) + ';border-radius:' + (t.w > 40 ? 6 : 3) + 'px"' +
        ' data-tip="' + esc(t.n) + '|' + esc(t.f) + '|' + t.mc + '|' + (t.chg === null ? '' : t.chg) + '">' +
        (mid ? '<span class="tk" style="font-size:' + fs.toFixed(1) + 'px">' + esc(label) + '</span>' : '') +
        (big && t.chg !== null ? '<span class="pc" style="font-size:' + Math.max(8.5, fs * 0.66).toFixed(1) + 'px">' + (t.chg > 0 ? '+' : '') + t.chg + '%</span>' : '') +
      '</div>';
    });
  });
  const scale = [-3, -2, -1, 0, 1, 2, 3].map(v =>
    '<span style="background:' + chgColor(v) + ';color:' + chgText(v) + ';border-radius:100px">' + (v > 0 ? '+' : '') + v + '%</span>').join('');
  const subtitle = mapFilter === 'earth' ? '👑 우주지배자 — 지구 TOP 20'
    : mapFilter === 'latent' ? '✦ 잠재지배자 — 30~200위권 모멘텀 후보'
    : mapFilter.startsWith('g:') ? flagOf(mapFilter.slice(2)) + ' ' + mapFilter.slice(2) + ' 성단 상세'
    : '8개 권역 통합';
  document.getElementById('obsBody').innerHTML = chipsHtml +
    '<div class="map-wrap"><div class="map-grid" style="height:' + H + 'px">' + html + '</div>' +
    '<div class="solar-tip" id="mapTip"></div></div>' +
    '<div class="map-legend">' + scale + '</div>' +
    '<div class="solar-legend">빛날수록 상승, 가라앉을수록 하락 — 칸 크기 = 시가총액 · ' + subtitle + ' (' + esc(DATA.fetched || '') + ' 관측)</div>';
  const wrap = document.querySelector('.map-wrap'), tip = document.getElementById('mapTip');
  wrap.addEventListener('mousemove', e => {
    const t = e.target.closest('.map-tile');
    if (t) {
      const [n, f, mc, chg] = t.dataset.tip.split('|');
      const rect = wrap.getBoundingClientRect();
      tip.style.display = 'block';
      tip.style.left = Math.min(e.clientX - rect.left + 14, rect.width - 230) + 'px';
      tip.style.top = (e.clientY - rect.top + 14) + 'px';
      tip.innerHTML = '<b>' + esc(n) + '</b> ' + esc(f) + '<br>' + (mc >= 1000 ? '$' + (mc / 1000).toFixed(2) + 'T' : '$' + Math.round(mc) + 'B') +
        (chg !== '' ? '<br>전일 대비 ' + (chg > 0 ? '+' : '') + chg + '%' : '<br>전일 비교 데이터 없음');
    } else tip.style.display = 'none';
  });
  wrap.addEventListener('mouseleave', () => tip.style.display = 'none');
}

/* ── 관측일지 ── */
function colSeed(str){ let h = 2166136261;
  for (const ch of String(str||'')) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0; }

function makeColViz(c){
  const W = 800, H = 150;
  let seed = colSeed(c.title);
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let inner = '';
  const gid = 'cv' + colSeed(c.title) % 100000;
  let defs = '<defs><radialGradient id="'+gid+'sp" cx="50%" cy="30%" r="90%"><stop offset="0%" stop-color="#1b2244"/><stop offset="100%" stop-color="#0a0d18"/></radialGradient>' +
    '<radialGradient id="'+gid+'g"><stop offset="0%" stop-color="#ffd873"/><stop offset="60%" stop-color="#d4a63f"/><stop offset="100%" stop-color="#9c7a3a"/></radialGradient></defs>';
  inner += '<rect width="'+W+'" height="'+H+'" fill="url('+'#'+gid+'sp)"/>';
  for (let i = 0; i < 60; i++)
    inner += '<circle cx="'+(rnd()*W).toFixed(1)+'" cy="'+(rnd()*H).toFixed(1)+'" r="'+(rnd()*1.1+0.2).toFixed(2)+'" fill="#f5f1e6" opacity="'+(rnd()*0.5+0.15).toFixed(2)+'"/>';

  if (c.viz && c.viz.type === 'solar' && Array.isArray(c.viz.planets) && c.viz.planets.length) {
    // 주간 미니 태양계 — 그 주의 TOP 5 실데이터
    const ps = c.viz.planets.slice(0, 5);
    const maxMc = Math.max(...ps.map(p => p.mc || 1));
    const step = W / (ps.length + 1);
    ps.forEach((p, i) => {
      const x = step * (i + 1), r = 8 + Math.sqrt((p.mc || 1) / maxMc) * 26;
      inner += i === 0
        ? '<circle cx="'+x+'" cy="'+(H*0.44)+'" r="'+(r+6)+'" fill="url(#'+gid+'g)"/>'
        : '<circle cx="'+x+'" cy="'+(H*0.44)+'" r="'+r.toFixed(1)+'" fill="#8fa3d9" opacity="0.92"/>';
      inner += '<text x="'+x+'" y="'+(H-14)+'" text-anchor="middle" fill="#c8d0ea" font-size="11.5" font-weight="700" style="paint-order:stroke" stroke="#0a0d18" stroke-width="3">'+esc((p.n||'').split(' ')[0])+'</text>';
    });
  } else {
    const KINDS = { constellation: 0, nebula: 1, orbit: 2 };
    const kind = (c.viz && KINDS[c.viz.type] !== undefined) ? KINDS[c.viz.type] : colSeed(c.title) % 3;
    if (kind === 0) {
      // 별자리 — 별들을 잇는 금색 선, 가장 밝은 별 하나
      const pts = []; for (let i = 0; i < 7; i++) pts.push([60 + rnd()*(W-120), 25 + rnd()*(H-50)]);
      pts.sort((a,b)=>a[0]-b[0]);
      inner += '<polyline points="'+pts.map(p=>p[0].toFixed(0)+','+p[1].toFixed(0)).join(' ')+'" fill="none" stroke="#d4a63f" stroke-opacity="0.55" stroke-width="1.3"/>';
      pts.forEach((p,i)=>{ inner += '<circle cx="'+p[0].toFixed(0)+'" cy="'+p[1].toFixed(0)+'" r="'+(i===3?5:2.6)+'" fill="'+(i===3?'url(#'+gid+'g)':'#e6ebfa')+'"/>'; });
    } else if (kind === 1) {
      // 성운 — 겹치는 발광 타원
      const cols2 = ['#5a4a9e','#2e6d8a','#9c7a3a'];
      for (let i = 0; i < 3; i++)
        inner += '<ellipse cx="'+(W*(0.25+rnd()*0.5)).toFixed(0)+'" cy="'+(H*(0.3+rnd()*0.4)).toFixed(0)+'" rx="'+(120+rnd()*160).toFixed(0)+'" ry="'+(40+rnd()*50).toFixed(0)+'" fill="'+cols2[i]+'" opacity="0.22" transform="rotate('+((rnd()*40-20).toFixed(0))+')"/>';
      inner += '<circle cx="'+(W*0.5+((rnd()-0.5)*200)).toFixed(0)+'" cy="'+(H*0.5).toFixed(0)+'" r="4.5" fill="url(#'+gid+'g)"/>';
    } else {
      // 궤도 — 상승하는 행성
      for (let i = 1; i <= 4; i++)
        inner += '<ellipse cx="'+(W*0.28)+'" cy="'+(H*0.5)+'" rx="'+(i*72)+'" ry="'+(i*26)+'" fill="none" stroke="#4a5578" stroke-opacity="0.5" stroke-width="0.9" stroke-dasharray="1 6"/>';
      inner += '<circle cx="'+(W*0.28)+'" cy="'+(H*0.5)+'" r="17" fill="url(#'+gid+'g)"/>';
      inner += '<circle cx="'+(W*0.28 + 216)+'" cy="'+(H*0.5 - 55)+'" r="9" fill="#8fa3d9"/>';
      inner += '<path d="M '+(W*0.28+150)+' '+(H*0.72)+' Q '+(W*0.28+200)+' '+(H*0.45)+' '+(W*0.28+212)+' '+(H*0.5-48)+'" fill="none" stroke="#d4a63f" stroke-opacity="0.6" stroke-width="1.4" stroke-dasharray="3 4"/>';
    }
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+defs+inner+'</svg>';
}

function renderColumns(){
  const cols = (DATA.columns || []);
  if (!cols.length) { document.getElementById('obsBody').innerHTML =
    '<div class="obs-note">첫 관측일지를 준비 중입니다 — 곧 기록이 시작됩니다.</div>'; return; }
  document.getElementById('obsBody').innerHTML = cols.map((c, i) =>
    '<div class="col-card" id="col-'+i+'" data-log="'+colSlug(c)+'" onclick="toggleCol('+i+')">'+
      '<div class="col-viz">'+makeColViz(c)+'</div>'+
      '<div class="col-date">'+esc(c.date)+'</div>'+
      '<div class="col-title">'+esc(c.title)+'</div>'+
      '<div class="col-summary">'+esc(c.summary)+'</div>'+
      '<div class="col-body">'+
        '<div class="col-share">'+
          '<button onclick="copyColLink(event,'+i+')">🔗 링크 복사</button>'+
          '<button onclick="copyColText(event,'+i+')">📄 본문 복사</button>'+
        '</div>'+c.body+'</div>'+
    '</div>').join('');
  openFromHash();
}

function colSlug(c){ return 'log-' + colSeed((c.title || '') + (c.date || '')); }

function colUrl(c){
  return location.origin + location.pathname.replace(/[^/]*$/, '') + 'observatory.html#' + colSlug(c);
}

async function copyToClip(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch(e) { window.prompt('아래 내용을 복사하세요 (Ctrl+C):', text.slice(0, 2000)); return; }
  if (btn) { const orig = btn.textContent; btn.textContent = '✓ 복사됨'; setTimeout(() => { btn.textContent = orig; }, 1500); }
}

function copyColLink(ev, i){
  ev.stopPropagation();
  copyToClip(colUrl((DATA.columns || [])[i]), ev.target);
}

function copyColText(ev, i){
  ev.stopPropagation();
  const c = (DATA.columns || [])[i];
  const tmp = document.createElement('div'); tmp.innerHTML = c.body;
  tmp.querySelectorAll('svg, .col-chart').forEach(n => n.remove());
  tmp.querySelectorAll('h3').forEach(n => { n.textContent = '\n■ ' + n.textContent + '\n'; });
  const text = 'UNIVERTRIX 관측일지 — ' + c.title + ' (' + c.date + ')\n' + colUrl(c) + '\n' +
    (tmp.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
  copyToClip(text, ev.target);
}

function openFromHash(){
  const h = location.hash.replace('#', '');
  if (!h.startsWith('log-')) return;
  const card = document.querySelector('.col-card[data-log="' + h + '"]');
  if (card) { card.classList.add('open'); setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80); }
}
function toggleCol(i){
  const el = document.getElementById('col-'+i);
  const was = el.classList.contains('open');
  document.querySelectorAll('.col-card.open').forEach(c=>c.classList.remove('open'));
  if (!was) el.classList.add('open');
}

if (location.hash && location.hash.indexOf('#log-') === 0) {
  const btn = document.querySelector('.obs-tab[data-t="columns"]');
  if (btn) setObsTab('columns', btn); else renderColumns();
} else {
  renderSolar();
}
</script>
<!-- uv-presence -->
<script type="module">
(async () => {
  try {
    const cfg = await (await fetch('data/firebase_config.json?v=' + Date.now())).json();
    if (!cfg || !cfg.apiKey) return;
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const { getFirestore, doc, setDoc, collection, query, where, Timestamp, serverTimestamp, getCountFromServer } =
      await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const db = getFirestore(initializeApp(cfg, 'presence'));

    let pid = localStorage.getItem('uv_pid');
    if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem('uv_pid', pid); }

    const beat = () => setDoc(doc(db, 'presence', pid), { t: serverTimestamp() }).catch(() => {});
    const count = async () => {
      try {
        const cutoff = Timestamp.fromMillis(Date.now() - 2 * 60 * 1000);
        const snap = await getCountFromServer(query(collection(db, 'presence'), where('t', '>', cutoff)));
        const n = snap.data().count;
        if (n > 0) {
          let el = document.getElementById('uvPresence');
          if (!el) {
            const ft = document.querySelector('.site-footer') || document.querySelector('footer');
            if (!ft) return;
            el = document.createElement('div');
            el.id = 'uvPresence';
            el.style.cssText = 'margin-top:8px;font-size:12px;color:var(--text-muted,#8a8577);';
            ft.appendChild(el);
          }
          el.innerHTML = '<span style="color:var(--gold,#9C7A3A)">✦</span> 지금 ' + n + '명이 우주를 관측 중';
        }
      } catch (e) {}
    };
    await beat(); await count();
    setInterval(beat, 60 * 1000 + Math.floor(Math.random() * 5000));
    setInterval(count, 60 * 1000 + Math.floor(Math.random() * 5000));
  } catch (e) {}
})();
</script>
