<style>
:root, [data-theme="light"] {
  --bg: #FAF6EC; --bg-card: #FFFFFF; --header-bg: rgba(250, 246, 236, 0.95);
  --text: #1A2438; --text-secondary: #525F7E; --text-muted: #8590AA;
  --gold: #9C7A3A; --gold-bg: #F0E6CC;
  --line: #E8DFC9; --line-strong: #C9BC9A;
}
[data-theme="dark"] {
  --bg: #0A0E14; --bg-card: #1C2330; --header-bg: rgba(10, 14, 20, 0.95);
  --text: #FFFFFF; --text-secondary: #B5BFD6; --text-muted: #6F7E9E;
  --gold: #D4A658; --gold-bg: #2A2519;
  --line: #2A3142; --line-strong: #3A4458;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard Variable', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  font-feature-settings: 'tnum', 'ss01'; line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  min-height: 100vh; display: flex; flex-direction: column;
}
.container { max-width: 720px; margin: 0 auto; padding: 0 20px; width: 100%; }

.site-header { background: var(--header-bg); border-bottom: 1px solid var(--line); }
.site-header-inner { max-width: 720px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; color: var(--text); }
.brand a { text-decoration: none; color: inherit; display: flex; gap: 8px; align-items: center; }
.brand-star { color: var(--gold); }
.brand-tag { font-size: 13px; font-weight: 500; color: var(--text-muted); }
.header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.update-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: var(--gold-bg);
  border-radius: 100px; font-size: 12px; font-weight: 700;
  color: var(--gold); font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .update-badge { border: 1px solid rgba(212,166,88,0.3); }
.update-badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); animation: pulse 2s ease-in-out infinite;
}
[data-theme="dark"] .update-badge::before { box-shadow: 0 0 8px var(--gold); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.rate-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 12px; background: var(--bg-card);
  border: 1px solid var(--line); border-radius: 100px;
  font-size: 12px; font-weight: 700; color: var(--text-secondary);
  font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.rate-badge:hover { border-color: var(--gold); }
.rate-badge:hover #usdKrwDisplay, .rate-badge:hover .rate-badge-arrow { color: var(--gold); }
.rate-badge-arrow { font-size: 10px; margin-left: 2px; color: var(--text-muted); opacity: 0.7; transition: color 0.2s, opacity 0.2s; }
.rate-badge:hover .rate-badge-arrow { opacity: 1; }
.rate-badge #usdKrwDisplay { color: var(--text); font-weight: 800; }
@media (max-width: 480px) { .rate-badge { font-size: 11px; padding: 5px 10px; } .update-badge { font-size: 11px; padding: 5px 10px; } }
@media (max-width: 380px) { .update-badge::before { display: none; } }

.theme-toggle {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--bg-card);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
}
.theme-toggle svg { width: 18px; height: 18px; }
.icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: none; }
[data-theme="dark"] .icon-sun { display: inline; }

.site-nav { position: sticky; top: 0; z-index: 50; background: var(--header-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
.site-nav-inner { max-width: 720px; margin: 0 auto; display: flex; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
.site-nav-inner::-webkit-scrollbar { display: none; }
.nav-tab { flex-shrink: 0; padding: 14px 18px; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-muted); text-decoration: none; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
.nav-tab:hover { color: var(--text-secondary); }
.nav-tab.active { color: var(--text); border-bottom-color: var(--gold); }

main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 0; }

.placeholder-card {
  text-align: center;
  padding: 56px 32px;
  border: 1px dashed var(--line-strong);
  border-radius: 16px;
  background: var(--bg-card);
  max-width: 480px;
  width: 100%;
}
.placeholder-icon { font-size: 56px; margin-bottom: 16px; }
.placeholder-eyebrow {
  font-size: 11px; font-weight: 800; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
}
.placeholder-title {
  font-size: 30px; font-weight: 800; letter-spacing: -0.03em;
  color: var(--text); margin-bottom: 12px;
}
.placeholder-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.6; }
.placeholder-note { font-size: 12px; color: var(--text-muted); margin-top: 18px; }

.site-footer { padding: 24px 0 40px; border-top: 1px solid var(--line); text-align: center; }
.footer-brand { display: flex; justify-content: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text-secondary); }
.footer-link { color: var(--text-secondary); text-decoration: none; font-weight: 700; }
.footer-link:hover { color: var(--gold); }
.footer-divider { color: var(--text-muted); font-weight: 400; }

@media (max-width: 480px) { .nav-tab { padding: 12px 14px; font-size: 13px; } .placeholder-title { font-size: 24px; } }

/* ── 데이터 천문대 ── */
.obs-hero { padding: 36px 0 6px; }
.obs-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.14em; color: var(--gold); }
.obs-title { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 6px; }
.obs-desc { font-size: 14.5px; color: var(--text-secondary); margin-bottom: 18px; }
.obs-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
.obs-tab { padding: 9px 18px; border-radius: 100px; border: 1px solid var(--line); background: var(--bg-card); font-size: 13.5px; font-weight: 700; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
.obs-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.solar-wrap { background: #10141f; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; position: relative; }
.solar-wrap svg { display: block; width: 100%; height: auto; }
.solar-legend { font-size: 12px; color: var(--text-muted); margin-top: 10px; text-align: center; }
.solar-tip { position: absolute; pointer-events: none; background: rgba(20,25,40,0.95); color: #f5f1e6; border: 1px solid #9C7A3A; border-radius: 10px; padding: 8px 12px; font-size: 12.5px; display: none; max-width: 220px; z-index: 5; }
.solar-tip b { color: #d4b06a; }
.pl { cursor: pointer; }
.pl:hover { stroke: #ffd873; stroke-width: 2px; }
.col-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; margin-bottom: 14px; cursor: pointer; transition: border-color 0.15s; }
.col-card:hover { border-color: var(--gold); }
.col-card.open { cursor: default; }
.col-date { font-size: 12px; color: var(--gold); font-weight: 800; letter-spacing: 0.06em; }
.col-title { font-size: 18px; font-weight: 800; margin: 4px 0 6px; }
.col-summary { font-size: 13.5px; color: var(--text-secondary); }
.col-body { display: none; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 14px; font-size: 14.5px; line-height: 1.85; }
.col-card.open .col-body { display: block; }
.col-body h3 { font-size: 15.5px; margin: 18px 0 6px; color: var(--gold); }
.col-body p { margin: 0 0 10px; }
.map-wrap { background: #10141f; border: 1px solid var(--line); border-radius: 16px; padding: 10px; position: relative; }
.map-grid { position: relative; width: 100%; height: 640px; }
.map-tile { position: absolute; overflow: hidden; border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #eef2ff; cursor: pointer; transition: filter 0.12s, box-shadow 0.12s; background-image: radial-gradient(circle at 32% 26%, rgba(255,255,255,0.09), rgba(0,0,0,0.12)); }
.map-tile:hover { filter: brightness(1.18); box-shadow: 0 0 0 1.5px #d4a63f, 0 0 14px rgba(212,166,63,0.35); z-index: 3; }
.map-tile .tk { font-weight: 800; line-height: 1.1; }
.map-tile .pc { font-weight: 700; opacity: 0.9; }
.map-head { position: absolute; font-size: 10.5px; font-weight: 800; color: #8a94b8; letter-spacing: 0.06em; padding: 2px 4px; z-index: 2; text-shadow: 0 1px 2px #10141f; }
.map-legend { display: flex; justify-content: center; align-items: center; gap: 2px; margin-top: 10px; font-size: 11px; color: var(--text-muted); }
.map-legend span { padding: 3px 9px; border-radius: 4px; color: #fff; font-weight: 700; }
.obs-note { background: var(--bg-card); border: 1px dashed var(--line-strong); border-radius: 14px; padding: 40px 24px; text-align: center; color: var(--text-muted); font-size: 14px; }
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var badge = document.querySelector('.update-badge');
  if (!badge) return;
  badge.innerHTML = '<span class="ud-date"></span><span class="ud-clock"></span>';
  var dt = badge.querySelector('.ud-date');
  var clk = badge.querySelector('.ud-clock');
  function tick() {
    var now = new Date();
    dt.textContent = now.toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' }).replace(/-/g, '.');
    clk.textContent = now.toLocaleTimeString('en-GB', { hour12: false, timeZone: 'Asia/Seoul' });
  }
  tick();
  setInterval(tick, 1000);
});
</script>

<script>
const savedTheme = localStorage.getItem('ud-theme');
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('ud-theme', next);
}
</script>

function shortName(s){
  if (SHORT_NAME[s.ticker]) return SHORT_NAME[s.ticker];
  let n = (s.name || '').replace(/\s*\(.*\)/, '').split(' ')[0];
  return (n && n.length <= 11) ? n : (n ? n.slice(0, 11) : s.ticker);
}

function renderSolar(){
  const stocks = (DATA.earth || []).slice(0, 20);
  if (!stocks.length) { document.getElementById('obsBody').innerHTML = '<div class="obs-note">데이터 수집 대기 중입니다.</div>'; return; }
  const sun = stocks[0], planets = stocks.slice(1);
  const W = 880, H = 660, cx = W/2, cy = H/2 + 10;
  const TILT = 0.62;  // 궤도 기울기 (관측 시점)
  const maxMc = sun.mc;
  const rOf = mc => 5 + Math.pow(mc / maxMc, 0.58) * 30;
  const sunR = 40;
  const orbitBase = sunR + 46, orbitStep = (W/2 - orbitBase - 36) / planets.length;
  const fmt = mc => mc >= 1000 ? '$' + (mc/1000).toFixed(2) + 'T' : '$' + Math.round(mc) + 'B';
  const halo = ' style="paint-order:stroke" stroke="#0a0d18" stroke-width="3.2"';

  let defs = '<defs>';
  defs += '<radialGradient id="space" cx="50%" cy="40%" r="82%"><stop offset="0%" stop-color="#1c2346"/><stop offset="55%" stop-color="#121729"/><stop offset="100%" stop-color="#080b14"/></radialGradient>';

  defs += '<radialGradient id="sunCore" cx="36%" cy="32%" r="85%"><stop offset="0%" stop-color="#fffbe8"/><stop offset="30%" stop-color="#ffd873"/><stop offset="70%" stop-color="#e0a93f"/><stop offset="100%" stop-color="#96691f"/></radialGradient>';
  defs += '<radialGradient id="sunGlow"><stop offset="0%" stop-color="#ffd873" stop-opacity="0.65"/><stop offset="42%" stop-color="#e0a93f" stop-opacity="0.2"/><stop offset="100%" stop-color="#e0a93f" stop-opacity="0"/></radialGradient>';
  defs += '<linearGradient id="flare" x1="0%" y1="50%" x2="100%" y2="50%"><stop offset="0%" stop-color="#ffd873" stop-opacity="0"/><stop offset="50%" stop-color="#fff0c8" stop-opacity="0.5"/><stop offset="100%" stop-color="#ffd873" stop-opacity="0"/></linearGradient>';
  defs += '<radialGradient id="shade" cx="74%" cy="74%" r="88%"><stop offset="0%" stop-color="#080b14" stop-opacity="0.6"/><stop offset="45%" stop-color="#080b14" stop-opacity="0.24"/><stop offset="100%" stop-color="#080b14" stop-opacity="0"/></radialGradient>';
  defs += '<radialGradient id="neb1"><stop offset="0%" stop-color="#5a4a9e" stop-opacity="0.26"/><stop offset="100%" stop-color="#5a4a9e" stop-opacity="0"/></radialGradient>';
  defs += '<radialGradient id="neb2"><stop offset="0%" stop-color="#2e6d8a" stop-opacity="0.2"/><stop offset="100%" stop-color="#2e6d8a" stop-opacity="0"/></radialGradient>';
  planets.forEach((p, i) => { const [hi, lo] = flagColor(p.flag);
    defs += '<radialGradient id="pg'+i+'" cx="32%" cy="28%" r="85%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="20%" stop-color="'+hi+'"/><stop offset="100%" stop-color="'+lo+'"/></radialGradient>';
    defs += '<clipPath id="pc'+i+'"><circle r="'+rOf(p.mc).toFixed(1)+'"/></clipPath>'; });
  defs += '</defs>';

  let svg = '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">' + defs;
  svg += '<rect width="'+W+'" height="'+H+'" fill="url(#space)"/>';
  svg += '<ellipse cx="'+(W*0.5)+'" cy="'+(H*0.5)+'" rx="'+(W*0.85)+'" ry="'+(H*0.22)+'" fill="url(#milky)" transform="rotate(-22 '+(W*0.5)+' '+(H*0.5)+')"/>';
  svg += '<ellipse cx="'+(W*0.16)+'" cy="'+(H*0.2)+'" rx="230" ry="150" fill="url(#neb1)"/>';
  svg += '<ellipse cx="'+(W*0.86)+'" cy="'+(H*0.83)+'" rx="270" ry="170" fill="url(#neb2)"/>';

  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const starCol = ['#f5f1e6','#f5f1e6','#f5f1e6','#cfe0ff','#ffe0c9'];
  for (let i = 0; i < 180; i++) {
    const x=(rnd()*W).toFixed(1), y=(rnd()*H).toFixed(1), r=(rnd()*1.3+0.2).toFixed(2), o=(rnd()*0.6+0.12).toFixed(2);
    const c = starCol[Math.floor(rnd()*starCol.length)];
    if (i % 5 === 0) {
      const dur=(rnd()*3+2).toFixed(1);
      svg += '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'"><animate attributeName="opacity" values="'+o+';0.04;'+o+'" dur="'+dur+'s" repeatCount="indefinite"/></circle>';
    } else svg += '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'" opacity="'+o+'"/>';
  }
  [[0,'M -40 60 L '+(W*0.55)+' '+(H*0.32),'11s'],[1,'M '+(W+40)+' '+(H*0.14)+' L '+(W*0.35)+' '+(H*0.62),'17s']].forEach(([k,path,dur]) => {
    svg += '<g opacity="0"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.86;0.9;1" dur="'+dur+'" repeatCount="indefinite"/>' +
      '<circle r="1.6" fill="#fff"><animateMotion path="'+path+'" dur="'+dur+'" repeatCount="indefinite"/></circle></g>';
  });

  // 기울어진 궤도 (타원)
  planets.forEach((p, i) => { const orbR = orbitBase + orbitStep*(i+1);
    svg += '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+orbR.toFixed(1)+'" ry="'+(orbR*TILT).toFixed(1)+'" fill="none" stroke="#4a5578" stroke-opacity="0.5" stroke-width="0.9" stroke-dasharray="1 6"/>'; });

  // 뒤층 → 태양 → 앞층 (행성이 태양 뒤로 실제로 돌아감)
  svg += '<g id="backLayer"></g>';
  let rays = '<g opacity="0.32"><animateTransform attributeName="transform" type="rotate" from="0 '+cx+' '+cy+'" to="360 '+cx+' '+cy+'" dur="120s" repeatCount="indefinite"/>';
  for (let k = 0; k < 12; k++) { const a = k * 30 * Math.PI/180, L = sunR*2.4;
    rays += '<polygon points="'+cx+','+cy+' '+(cx+Math.cos(a-0.045)*L)+','+(cy+Math.sin(a-0.045)*L)+' '+(cx+Math.cos(a+0.045)*L)+','+(cy+Math.sin(a+0.045)*L)+'" fill="#e0a93f" opacity="0.22"/>'; }

  svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(sunR*2.7)+'" fill="url(#sunGlow)"><animate attributeName="r" values="'+(sunR*2.7)+';'+(sunR*3.05)+';'+(sunR*2.7)+'" dur="5s" repeatCount="indefinite"/></circle>';

  svg += '<text x="'+cx+'" y="'+(cy+sunR+39)+'" text-anchor="middle" fill="#d4b06a" font-size="12" font-weight="700"'+halo+'>'+fmt(sun.mc)+'</text>';

  svg += '</svg>';

      [...new Set(planets.map(p=>p.flag).filter(f=>FLAG_COLOR[f]))].map(f =>
        '<span style="display:inline-flex;align-items:center;gap:4px;margin:0 7px"><span style="width:9px;height:9px;border-radius:50%;background:'+flagColor(f)[0]+';display:inline-block"></span>'+f+'</span>').join('') +
    '</div><div class="solar-legend" style="margin-top:4px">행성은 태양 뒤로도 돕니다 — 매일 아침 다시 그려집니다 ('+esc(DATA.fetched||'')+' 관측)</div>';

  const NS = 'http://www.w3.org/2000/svg';
  const back = document.getElementById('backLayer'), front = document.getElementById('frontLayer');
  const orbs = planets.map((p, i) => {
    const r = rOf(p.mc);
    const [hi] = flagColor(p.flag);
    const g = document.createElementNS(NS, 'g');
    let inner = '';
    if (i === 0) inner += '<ellipse rx="'+(r*1.8)+'" ry="'+(r*0.5)+'" fill="none" stroke="#d8c9a0" stroke-opacity="0.35" stroke-width="3.5" transform="rotate(-18)"/><ellipse rx="'+(r*1.8)+'" ry="'+(r*0.5)+'" fill="none" stroke="#f0e2c0" stroke-opacity="0.7" stroke-width="1.2" transform="rotate(-18)"/>';
    if (i < 3) inner += '<circle r="'+(r+2.5)+'" fill="none" stroke="'+hi+'" stroke-opacity="0.35" stroke-width="2"/>';
    inner += '<circle r="'+r.toFixed(1)+'" fill="url(#pg'+i+')" data-i="'+(i+1)+'" class="pl"/>';
    if (r > 15) inner += '<g clip-path="url(#pc'+i+')" pointer-events="none" opacity="0.16">' +
      '<ellipse cy="'+(-r*0.34)+'" rx="'+r+'" ry="'+(r*0.14)+'" fill="#0a0d18" transform="rotate(-8)"/>' +
      '<ellipse cy="'+(r*0.08)+'" rx="'+r+'" ry="'+(r*0.11)+'" fill="#ffffff" transform="rotate(-8)"/>' +
      '<ellipse cy="'+(r*0.44)+'" rx="'+r+'" ry="'+(r*0.13)+'" fill="#0a0d18" transform="rotate(-8)"/></g>';
    inner += '<circle r="'+r.toFixed(1)+'" fill="url(#shade)" pointer-events="none"/>';
    const fs = Math.max(10, Math.min(13, r*0.62));
    inner += '<text y="'+(r+13)+'" text-anchor="middle" fill="#e6ebfa" font-size="'+fs.toFixed(1)+'" font-weight="800"'+halo+'>'+esc(shortName(p))+'</text>';
    if (i < 8) inner += '<text y="'+(r+26)+'" text-anchor="middle" fill="#93a0c6" font-size="'+(fs*0.8).toFixed(1)+'" font-weight="700"'+halo+'>'+fmt(p.mc)+'</text>';
    g.innerHTML = inner;
    front.appendChild(g);
    return { g, orbR: orbitBase + orbitStep*(i+1), a: (i * 137.5) * Math.PI/180,
             s: 0.0010/(1+i*0.24), inFront: true };
  });

  const wrap = document.querySelector('.solar-wrap');
  const tip = document.getElementById('solarTip');
  const stocksAll = stocks;
  let paused = false;
  wrap.addEventListener('mousemove', e => {
    const t = e.target;
    if (t.classList && t.classList.contains('pl')) {
      const s = stocksAll[+t.dataset.i];
      const rect = wrap.getBoundingClientRect();
      tip.style.display = 'block';
      tip.style.left = Math.min(e.clientX - rect.left + 14, rect.width - 230) + 'px';
      tip.style.top = (e.clientY - rect.top + 14) + 'px';
      tip.innerHTML = '<b>'+esc(s.name)+'</b> '+esc(s.flag||'')+'<br>'+fmt(s.mc)+(s.desc?'<br>'+esc(s.desc):'');
      paused = true;
    } else { tip.style.display = 'none'; paused = false; }
  });
  wrap.addEventListener('mouseleave', () => { tip.style.display = 'none'; paused = false; });

  const step = () => {
    if (!paused) orbs.forEach(o => {
      o.a += o.s;
      const sin = Math.sin(o.a);
      const x = cx + o.orbR * Math.cos(o.a);
      const y = cy + o.orbR * TILT * sin;
      const depth = (sin + 1) / 2;                 // 0 = 맨 뒤, 1 = 맨 앞
      const sc = 0.72 + depth * 0.42;
      o.g.setAttribute('transform', 'translate('+x.toFixed(1)+','+y.toFixed(1)+') scale('+sc.toFixed(3)+')');
      o.g.setAttribute('opacity', (0.72 + depth * 0.28).toFixed(2));
      const nowFront = sin >= 0;
      if (nowFront !== o.inFront) { (nowFront ? front : back).appendChild(o.g); o.inFront = nowFront; }
    });
    solarRAF = requestAnimationFrame(step);
  };
  step();
}

/* ── 우주 지도 (트리맵) ── */
function chgColor(chg){
  // UNIVERTRIX 빛의 문법: 상승 = 항성처럼 금빛으로 빛남 · 하락 = 차가운 심청으로 가라앉음
  if (chg === null || chg === undefined) return '#262d47';
  const v = Math.max(-3, Math.min(3, chg)) / 3;
  const mix = (a, b, t) => Math.round(a + (b - a) * t);
  const base = [38, 45, 71];                       // 무풍 — 짙은 우주색
  const to = v >= 0 ? [212, 166, 63] : [21, 49, 94]; // 금빛 항성 / 심청 심연
  const t = Math.pow(Math.abs(v), 0.8);
  return 'rgb(' + mix(base[0], to[0], t) + ',' + mix(base[1], to[1], t) + ',' + mix(base[2], to[2], t) + ')';
}
const chgText = chg => (chg !== null && chg >= 1.5) ? '#1c2333' : '#eef2ff';  // 밝은 금빛 위엔 남색 글씨

function squarify(items, x, y, w, h, out){
  // items: [{v, ...}] 내림차순 — 고전 squarified treemap
  if (!items.length) return;
  const total = items.reduce((s, i) => s + i.v, 0);
  let row = [], rest = items.slice(), best = Infinity;
  const vertical = w < h;
  const side = vertical ? w : h;
  while (rest.length) {
    const cand = row.concat([rest[0]]);
    const sum = cand.reduce((s, i) => s + i.v, 0);
    const area = sum / total * w * h;
    const thick = area / side;
    let worst = 0;
    cand.forEach(i => { const len = (i.v / sum) * side;
      worst = Math.max(worst, Math.max(thick / len, len / thick)); });
    if (worst <= best) { row = cand; rest.shift(); best = worst; }
    else break;
  }
  const sum = row.reduce((s, i) => s + i.v, 0);
  const thick = (sum / total * w * h) / side;
  let off = 0;
  row.forEach(i => {
    const len = (i.v / sum) * side;
    if (vertical) out.push({ ...i, x: x + off, y: y, w: len, h: thick });
    else out.push({ ...i, x: x, y: y + off, w: thick, h: len });
    off += len;
  });
  if (vertical) squarify(rest, x, y + thick, w, h - thick, out);
  else squarify(rest, x + thick, y, w - thick, h, out);
}

function renderMap(){
  const tiles = (DATA.tiles || []).filter(t => t.mc > 0);
  if (!tiles.length) { document.getElementById('obsBody').innerHTML = '<div class="obs-note">지도 데이터 대기 중입니다.</div>'; return; }
  const W = Math.min(document.getElementById('obsBody').clientWidth - 22, 1100) || 900, H = 640;
  // 국가 그룹: 시총 합 내림차순
  const groups = {};
  tiles.forEach(t => { (groups[t.g] = groups[t.g] || { name: t.g, f: t.f, v: 0, items: [] }); groups[t.g].v += t.mc; groups[t.g].items.push({ ...t, v: t.mc }); });
  const glist = Object.values(groups).sort((a, b) => b.v - a.v);
  glist.forEach(g => g.items.sort((a, b) => b.v - a.v));
  // 1단계: 국가 블록 배치 → 2단계: 블록 내 종목 배치
  const gout = [];
  squarify(glist.map(g => ({ v: g.v, g })), 0, 0, W, H, gout);
  let html = '';
  gout.forEach(gb => {
    const inner = [];
    squarify(gb.g.items, gb.x + 1, gb.y + 14, gb.w - 2, gb.h - 15, inner);
    if (gb.w > 46 && gb.h > 26)
      html += '<div class="map-head" style="left:' + (gb.x + 3) + 'px;top:' + gb.y + 'px">' + esc(gb.g.f + ' ' + gb.g.name + ' 성단') + '</div>';
    inner.forEach(t => {
      const big = t.w > 52 && t.h > 34, mid = t.w > 34 && t.h > 22;
      const fs = Math.max(9, Math.min(20, Math.sqrt(t.w * t.h) / 5.2));
      html += '<div class="map-tile" style="left:' + (t.x + 1.5).toFixed(1) + 'px;top:' + (t.y + 1.5).toFixed(1) + 'px;width:' + Math.max(0, t.w - 3).toFixed(1) + 'px;height:' + Math.max(0, t.h - 3).toFixed(1) + 'px;background-color:' + chgColor(t.chg) + ';color:' + chgText(t.chg) + '"' +
        ' data-tip="' + esc(t.n) + '|' + esc(t.f) + '|' + t.mc + '|' + (t.chg === null ? '' : t.chg) + '">' +
        (mid ? '<span class="tk" style="font-size:' + fs + 'px">' + esc(t.t) + '</span>' : '') +
        (big && t.chg !== null ? '<span class="pc" style="font-size:' + Math.max(9, fs * 0.62) + 'px">' + (t.chg > 0 ? '+' : '') + t.chg + '%</span>' : '') +
      '</div>';
    });
  });
  const scale = [-3, -2, -1, 0, 1, 2, 3].map(v =>
    '<span style="background:' + chgColor(v) + ';color:' + chgText(v) + ';border-radius:100px">' + (v > 0 ? '+' : '') + v + '%</span>').join('');
  document.getElementById('obsBody').innerHTML =
    '<div class="map-wrap"><div class="map-grid" style="height:' + H + 'px">' + html + '</div>' +
    '<div class="solar-tip" id="mapTip"></div></div>' +
    '<div class="map-legend">' + scale + '</div>' +
    '<div class="solar-legend">빛날수록 상승, 가라앉을수록 하락 — 칸 크기 = 시가총액 · 국가별 성단 · 8개 권역 통합 (' + esc(DATA.fetched || '') + ' 관측)</div>';
  const wrap = document.querySelector('.map-wrap'), tip = document.getElementById('mapTip');
  wrap.addEventListener('mousemove', e => {
    const t = e.target.closest('.map-tile');
    if (t) {
      const [n, f, mc, chg] = t.dataset.tip.split('|');
      const rect = wrap.getBoundingClientRect();
      tip.style.display = 'block';
      tip.style.left = Math.min(e.clientX - rect.left + 14, rect.width - 230) + 'px';
      tip.style.top = (e.clientY - rect.top + 14) + 'px';
      tip.innerHTML = '<b>' + esc(n) + '</b> ' + esc(f) + '<br>' + (mc >= 1000 ? '$' + (mc / 1000).toFixed(2) + 'T' : '$' + Math.round(mc) + 'B') +
        (chg !== '' ? '<br>전일 대비 ' + (chg > 0 ? '+' : '') + chg + '%' : '<br>전일 비교 데이터 없음');
    } else tip.style.display = 'none';
  });
  wrap.addEventListener('mouseleave', () => tip.style.display = 'none');
}

/* ── 관측일지 ── */
function renderColumns(){
  const cols = (DATA.columns || []);
  if (!cols.length) { document.getElementById('obsBody').innerHTML =
    '<div class="obs-note">첫 관측일지를 준비 중입니다 — 곧 기록이 시작됩니다.</div>'; return; }
  document.getElementById('obsBody').innerHTML = cols.map((c, i) =>
    '<div class="col-card" id="col-'+i+'" onclick="toggleCol('+i+')">'+
      '<div class="col-date">'+esc(c.date)+'</div>'+
      '<div class="col-title">'+esc(c.title)+'</div>'+
      '<div class="col-summary">'+esc(c.summary)+'</div>'+
      '<div class="col-body">'+c.body+'</div>'+
    '</div>').join('');
}
function toggleCol(i){
  const el = document.getElementById('col-'+i);
  const was = el.classList.contains('open');
  document.querySelectorAll('.col-card.open').forEach(c=>c.classList.remove('open'));
  if (!was) el.classList.add('open');
}

renderSolar();
</script>

<script type="module">
(async () => {
  try {
    const cfg = await (await fetch('data/firebase_config.json?v=' + Date.now())).json();
    if (!cfg || !cfg.apiKey) return;
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const { getFirestore, doc, setDoc, collection, query, where, Timestamp, serverTimestamp, getCountFromServer } =
      await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const db = getFirestore(initializeApp(cfg, 'presence'));

    let pid = localStorage.getItem('uv_pid');
    if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem('uv_pid', pid); }

    const beat = () => setDoc(doc(db, 'presence', pid), { t: serverTimestamp() }).catch(() => {});
    const count = async () => {
      try {
        const cutoff = Timestamp.fromMillis(Date.now() - 2 * 60 * 1000);
        const snap = await getCountFromServer(query(collection(db, 'presence'), where('t', '>', cutoff)));
        const n = snap.data().count;
        if (n > 0) {
          let el = document.getElementById('uvPresence');
          if (!el) {
            const ft = document.querySelector('.site-footer') || document.querySelector('footer');
            if (!ft) return;
            el = document.createElement('div');
            el.id = 'uvPresence';
            el.style.cssText = 'margin-top:8px;font-size:12px;color:var(--text-muted,#8a8577);';
            ft.appendChild(el);
          }
          el.innerHTML = '<span style="color:var(--gold,#9C7A3A)">✦</span> 지금 ' + n + '명이 우주를 관측 중';
        }
      } catch (e) {}
    };
    await beat(); await count();
    setInterval(beat, 60 * 1000 + Math.floor(Math.random() * 5000));
    setInterval(count, 60 * 1000 + Math.floor(Math.random() * 5000));
  } catch (e) {}
})();
</script>
