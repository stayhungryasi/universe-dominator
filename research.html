<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리서치 · 우주지배자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root, [data-theme="light"] {
  --bg: #FAF6EC; --bg-card: #FFFFFF; --header-bg: rgba(250, 246, 236, 0.95);
  --text: #1A2438; --text-secondary: #525F7E; --text-muted: #8590AA;
  --gold: #9C7A3A; --gold-bg: #F0E6CC;
  --line: #E8DFC9; --line-strong: #C9BC9A;
}
[data-theme="dark"] {
  --bg: #0A0E14; --bg-card: #1C2330; --header-bg: rgba(10, 14, 20, 0.95);
  --text: #FFFFFF; --text-secondary: #B5BFD6; --text-muted: #6F7E9E;
  --gold: #D4A658; --gold-bg: #2A2519;
  --line: #2A3142; --line-strong: #3A4458;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard Variable', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  font-feature-settings: 'tnum', 'ss01'; line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  min-height: 100vh; display: flex; flex-direction: column;
}
.container { max-width: 720px; margin: 0 auto; padding: 0 20px; width: 100%; }

.site-header { background: var(--header-bg); border-bottom: 1px solid var(--line); }
.site-header-inner { max-width: 720px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; color: var(--text); }
.brand a { text-decoration: none; color: inherit; display: flex; gap: 8px; align-items: center; }
.brand-star { color: var(--gold); }
.brand-tag { font-size: 13px; font-weight: 500; color: var(--text-muted); }
.header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.update-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: var(--gold-bg);
  border-radius: 100px; font-size: 12px; font-weight: 700;
  color: var(--gold); font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .update-badge { border: 1px solid rgba(212,166,88,0.3); }
.update-badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); animation: pulse 2s ease-in-out infinite;
}
[data-theme="dark"] .update-badge::before { box-shadow: 0 0 8px var(--gold); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.rate-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 12px; background: var(--bg-card);
  border: 1px solid var(--line); border-radius: 100px;
  font-size: 12px; font-weight: 700; color: var(--text-secondary);
  font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.rate-badge:hover { border-color: var(--gold); }
.rate-badge:hover #usdKrwDisplay, .rate-badge:hover .rate-badge-arrow { color: var(--gold); }
.rate-badge-arrow { font-size: 10px; margin-left: 2px; color: var(--text-muted); opacity: 0.7; transition: color 0.2s, opacity 0.2s; }
.rate-badge:hover .rate-badge-arrow { opacity: 1; }
.rate-badge #usdKrwDisplay { color: var(--text); font-weight: 800; }
@media (max-width: 480px) { .rate-badge { font-size: 11px; padding: 5px 10px; } .update-badge { font-size: 11px; padding: 5px 10px; } }
@media (max-width: 380px) { .update-badge::before { display: none; } }

.theme-toggle {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--bg-card);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
}
.theme-toggle svg { width: 18px; height: 18px; }
.icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: none; }
[data-theme="dark"] .icon-sun { display: inline; }

.site-nav { position: sticky; top: 0; z-index: 50; background: var(--header-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
.site-nav-inner { max-width: 720px; margin: 0 auto; display: flex; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
.site-nav-inner::-webkit-scrollbar { display: none; }
.nav-tab { flex-shrink: 0; padding: 14px 18px; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-muted); text-decoration: none; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
.nav-tab:hover { color: var(--text-secondary); }
.nav-tab.active { color: var(--text); border-bottom-color: var(--gold); }

main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 0; }

.placeholder-card {
  text-align: center;
  padding: 56px 32px;
  border: 1px dashed var(--line-strong);
  border-radius: 16px;
  background: var(--bg-card);
  max-width: 480px;
  width: 100%;
}
.placeholder-icon { font-size: 56px; margin-bottom: 16px; }
.placeholder-eyebrow {
  font-size: 11px; font-weight: 800; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
}
.placeholder-title {
  font-size: 30px; font-weight: 800; letter-spacing: -0.03em;
  color: var(--text); margin-bottom: 12px;
}
.placeholder-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.6; }
.placeholder-note { font-size: 12px; color: var(--text-muted); margin-top: 18px; }

/* ── 리서치 목록 ── */
main.research-main { display: block; align-items: stretch; padding: 36px 0 60px; }
.page-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.page-title { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px; }
.page-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; }
.gen-label { font-size: 12px; color: var(--text-muted); margin-bottom: 22px; }
.group-tabs { display: flex; gap: 8px; margin: 18px 0 22px; }
.group-tab { padding: 8px 16px; border-radius: 100px; border: 1px solid var(--line); background: var(--bg-card); font-size: 13px; font-weight: 700; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
.group-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.stock-block { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; }
.stock-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.stock-rank { font-size: 12px; font-weight: 800; color: var(--gold); }
.stock-name { font-size: 16px; font-weight: 800; }
.stock-ticker { font-size: 12px; color: var(--text-muted); }
.art { display: block; padding: 9px 0; border-top: 1px solid var(--line); text-decoration: none; }
.art:hover .art-title { color: var(--gold); }
.art-title { font-size: 13.5px; font-weight: 600; color: var(--text); line-height: 1.45; transition: color 0.15s; }
.art-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
.art-orig { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; font-style: italic; }
.art-summary { margin: 7px 0 2px; padding-left: 2px; list-style: none; }
.art-summary li { font-size: 12.5px; color: var(--text-secondary); line-height: 1.55; padding-left: 12px; position: relative; margin-bottom: 3px; }
.art-summary li::before { content: ''; position: absolute; left: 0; top: 8px; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }
/* ── 주요일정 ── */
.cal-item { display: flex; align-items: flex-start; gap: 14px; background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
.cal-date { min-width: 76px; text-align: center; }
.cal-date .d { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.cal-date .dday { display: inline-block; margin-top: 3px; font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 100px; background: var(--gold-bg); color: var(--gold); }
.cal-date .dday.today { background: var(--gold); color: #fff; }
.cal-body { flex: 1; }
.cal-title { font-size: 13.5px; font-weight: 600; line-height: 1.5; }
.cal-type { display: inline-block; margin-top: 4px; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 100px; border: 1px solid var(--line); color: var(--text-muted); }
.cal-type.macro { border-color: var(--gold); color: var(--gold); }
.no-art { font-size: 12.5px; color: var(--text-muted); padding: 6px 0; }
@media (max-width: 480px) { .page-title { font-size: 24px; } .stock-block { padding: 14px 16px; } }

.site-footer { padding: 24px 0 40px; border-top: 1px solid var(--line); text-align: center; }
.footer-brand { display: flex; justify-content: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text-secondary); }
.footer-link { color: var(--text-secondary); text-decoration: none; font-weight: 700; }
.footer-link:hover { color: var(--gold); }
.footer-divider { color: var(--text-muted); font-weight: 400; }

/* ── 거인의 어깨 ── */
.guru-block { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; margin-bottom: 12px; cursor: pointer; transition: border-color 0.15s; }
.guru-block:hover { border-color: var(--gold); }
.guru-block.open { cursor: default; padding-bottom: 20px; }
.guru-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 2px; }
.guru-name { font-size: 17px; font-weight: 800; }
.guru-person { font-size: 13px; color: var(--gold); font-weight: 700; }
.guru-toggle { margin-left: auto; font-size: 12px; color: var(--text-muted); transition: transform 0.2s; }
.guru-block.open .guru-toggle { transform: rotate(180deg); }
.guru-tagline { font-size: 12.5px; color: var(--text-muted); }
.guru-body { display: none; }
.guru-block.open .guru-body { display: block; }
.guru-block.open .guru-tagline { margin-bottom: 10px; }
.guru-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; font-variant-numeric: tabular-nums; }
.guru-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.guru-rank { width: 22px; color: var(--text-muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.guru-issuer { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.guru-bar-wrap { flex: 0 0 90px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.guru-bar { height: 100%; background: var(--gold); border-radius: 3px; }
.guru-pct { width: 48px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; flex-shrink: 0; }
.guru-chg { width: 52px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-muted); flex-shrink: 0; }
.guru-chg.new { color: var(--gold); font-weight: 800; }
.guru-chg.up { color: #1a9850; }
.guru-chg.down { color: #d73027; }
.guru-exits { margin-top: 12px; font-size: 12.5px; color: var(--text-muted); }
.guru-exits b { color: var(--text-secondary); }
.guru-note { font-size: 12px; color: var(--text-muted); margin: 4px 0 18px; line-height: 1.6; }
@media (max-width: 520px) { .guru-bar-wrap { display: none; } .guru-chg { width: 44px; } }
@media (max-width: 480px) { .nav-tab { padding: 12px 14px; font-size: 13px; } .placeholder-title { font-size: 24px; } }
:root { --cal-blue: #2f62c9; --cal-blue-bg: rgba(47,98,201,0.10); --cal-wknd: rgba(0,0,0,0.045); }
[data-theme="dark"] { --cal-blue: #8fb0f5; --cal-blue-bg: rgba(56,110,225,0.2); --cal-wknd: #161b2b; }
</style>
<style>
/* 헤더 모바일 일관성 + 실시간 날짜·시계 (전 페이지 공통 — build_site.py 주입) */
@media (max-width: 480px) {
  .site-header-inner { flex-wrap: wrap; }
  .brand { flex-shrink: 0; }
}
.update-badge .ud-clock { margin-left: 6px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
/* UNIVERTRIX 로고 (build_site.py 주입) */
.brand.ud-logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
/* ── UNIVERTRIX 종합 로고 (오로라×궤도×호흡×서예) ── */
.uvx{display:inline-flex;align-items:center;gap:13px;text-decoration:none}
.uvx-lat{position:relative;display:inline-block}
.uvx-word{font-size:20px;letter-spacing:.3em;font-weight:400;line-height:1;
  background:linear-gradient(95deg,var(--text) 12%,var(--gold) 46%,var(--aurora2) 62%,var(--text) 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-variation-settings:'wght' 528}
.uvx-orbit{position:absolute;inset:-12px -11px -8px -7px;width:calc(100% + 18px);height:calc(100% + 20px);pointer-events:none;overflow:visible}
.uvx-orbit path{stroke:var(--gold);opacity:.9}
.uvx-orbit circle{fill:var(--aurora2)}
.uvx-kr{font-family:'Nanum Brush Script',cursive;font-size:26px;line-height:1;padding-left:13px;border-left:1px solid var(--text-muted);white-space:nowrap;
  background:linear-gradient(95deg,var(--text) 10%,var(--gold) 42%,var(--aurora2) 60%,var(--text) 90%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent}
@media(prefers-reduced-motion:no-preference){
  .uvx-word{animation:uvbreath 6s ease-in-out infinite}
  .uvx-kr{animation:krbreath 6s ease-in-out infinite}
  @keyframes uvbreath{0%,100%{font-variation-settings:'wght' 340}50%{font-variation-settings:'wght' 800}}
  @keyframes krbreath{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
}
[data-theme="dark"] .uvx-word{filter:drop-shadow(0 0 13px rgba(139,147,255,.4))}
[data-theme="dark"] .uvx-kr{filter:drop-shadow(0 0 11px rgba(139,147,255,.35))}
@media(max-width:760px){.uvx{gap:9px}.uvx-word{font-size:15.5px;letter-spacing:.22em}.uvx-kr{font-size:20px;padding-left:9px}.uvx-orbit{inset:-9px -8px -6px -5px}}
.ud-logo-word .v { color: var(--gold); }
@media (max-width: 480px) { .ud-logo-word { font-size: 13.5px; letter-spacing: 0.16em; } .ud-logo-mark { height: 22px; } }

/* ud-hdr-refine-v2 — 상태 스트립 통합: 배지 3개 → 계기판 캡슐 하나 */
.site-header-inner { padding: 15px 20px; }
.header-right {
  gap: 0; background: var(--bg-card); border: 1px solid var(--line);
  border-radius: 100px; padding: 3px 5px 3px 4px; align-items: center;
  box-shadow: 0 1px 2px rgba(28,35,51,0.04);
}
.header-right .update-badge {
  background: transparent; border: none; border-radius: 0;
  padding: 5px 13px; color: var(--text-secondary);
}
[data-theme="dark"] .header-right .update-badge { border: none; }
.header-right .update-badge .ud-clock { color: var(--gold); font-weight: 800; }
.header-right .rate-badge {
  background: transparent; border: none; border-radius: 0;
  border-left: 1px solid var(--line); padding: 5px 13px;
}
.header-right .rate-badge:hover { border-color: var(--line); }
.header-right .rate-badge:hover #usdKrwDisplay, .header-right .rate-badge:hover .rate-badge-arrow { color: var(--gold); }
.header-right .theme-toggle {
  width: 34px; height: 30px; border: none; border-radius: 0 100px 100px 0;
  border-left: 1px solid var(--line); background: transparent; margin-left: 0;
}
.header-right .theme-toggle:hover { color: var(--gold); }
@media (max-width: 480px) {
  .header-right { padding: 2px 3px 2px 2px; }
  .header-right .update-badge, .header-right .rate-badge { padding: 4px 9px; }
}

/* ud-hdr-refine-v4 — 아이보리 복원: 헤더는 본문과 한 몸, 세련됨은 디테일에서.
   (한때 페이지에 주입됐던 v3 네이비 블록을 아래 리셋이 캐스케이드로 무력화한다) */
.site-header { background: var(--header-bg); border-bottom: none; position: relative; }
.site-header::after { content: none; }
.site-header .ud-logo, .site-header .ud-logo-word { color: var(--text); }
.site-header .ud-logo-word { letter-spacing: 0.2em; }
.site-header .ud-logo-word .v { color: var(--gold); }
.site-header .ud-logo-mark { --gold: #9C7A3A; }
[data-theme="dark"] .site-header .ud-logo-mark { --gold: #D4A658; }
.site-header .header-right {
  background: var(--bg-card); border-color: var(--line);
  box-shadow: 0 1px 2px rgba(28,35,51,0.05);
}
.site-header .update-badge, .site-header .update-badge .ud-date { color: var(--text-secondary); }
.site-header .update-badge .ud-clock { color: var(--gold); }
.site-header .update-badge::before { background: var(--gold); box-shadow: none; }
[data-theme="dark"] .site-header .update-badge::before { box-shadow: 0 0 8px var(--gold); }
.site-header .rate-badge { color: var(--text-secondary); border-left-color: var(--line); }
.site-header .rate-badge #usdKrwDisplay { color: var(--text); }
.site-header .rate-badge:hover #usdKrwDisplay, .site-header .rate-badge:hover .rate-badge-arrow { color: var(--gold); }
.site-header .theme-toggle { color: var(--text-secondary); border-left-color: var(--line); }
.site-header .theme-toggle:hover { color: var(--gold); }
/* 헤더+메뉴 = 하나의 아이보리 존, 경계는 메뉴 아래 은은한 골드 헤어라인 한 줄 */
.site-nav { border-bottom: 1px solid var(--line); }
.site-nav::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent 8%, rgba(156,122,58,0.38), transparent 92%);
}
[data-theme="dark"] .site-nav::after {
  background: linear-gradient(90deg, transparent 8%, rgba(212,166,88,0.3), transparent 92%);
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var badge = document.querySelector('.update-badge');
  if (!badge) return;
  badge.innerHTML = '<span class="ud-date"></span><span class="ud-clock"></span>';
  var dt = badge.querySelector('.ud-date');
  var clk = badge.querySelector('.ud-clock');
  function tick() {
    var now = new Date();
    dt.textContent = now.toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' }).replace(/-/g, '.');
    clk.textContent = now.toLocaleTimeString('en-GB', { hour12: false, timeZone: 'Asia/Seoul' });
  }
  tick();
  setInterval(tick, 1000);
});
</script>

<style id="ud-aurora-global-v1">
/* ud-aurora-global-v1 — 전 페이지 오로라 팔레트 통일 (build_site 주입 · 멱등)
   토큰 리맵이므로 각 페이지 기존 컴포넌트가 자동으로 새 팔레트를 입는다 */
:root, [data-theme="light"] {
  --bg:#FBFBFC; --bg-card:#F5F5F7; --bg-hover:#ECECF0;
  --text:#16181D; --text-secondary:#4A4E58; --text-muted:#7E828B;
  --gold:#565CE8; --gold-bg:rgba(86,92,232,0.08); --aurora2:#3EC8D8;
  --line:#E8E9EC; --line-strong:#D8DAE0; --up:#565CE8;
  --header-bg:rgba(251,251,252,0.92);
  --tab-active-bg:var(--text); --tab-active-text:var(--bg);
  --toggle-icon-color:var(--text);
}
[data-theme="dark"] {
  --bg:#0A0B0F; --bg-card:#12141B; --bg-hover:#191C25;
  --text:#F4F5F8; --text-secondary:#C3C7D1; --text-muted:#7C8290;
  --gold:#8B93FF; --gold-bg:rgba(139,147,255,0.10); --aurora2:#4FE0EF;
  --line:#1E2027; --line-strong:#2A2D38; --up:#8B93FF;
  --header-bg:rgba(10,11,15,0.92);
  --tab-active-bg:var(--gold); --tab-active-text:var(--bg);
  --toggle-icon-color:var(--gold);
}
/* ── 정렬 통일: 헤더·메뉴·본문을 같은 1080px 기둥에 ── */

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(group) {
  const list = document.getElementById('list');
  const stocks = (DATA.stocks || []).filter(s => s.group === group);
  if (!stocks.length) {
    list.innerHTML = '<div class="no-art">수집된 리서치가 아직 없습니다 — 다음 자동 갱신을 기다려 주세요.</div>';
    return;
  }
  list.innerHTML = stocks.map(s => {
    const arts = (s.articles || []).map(a => {
      const hasKo = a.title_ko && a.title_ko !== a.title;
      const bullets = (a.summary_ko || []).map(b => '<li>' + esc(b) + '</li>').join('');
      return '<a class="art" href="' + esc(a.link) + '" target="_blank" rel="noopener">' +
        '<div class="art-title">' + esc(hasKo ? a.title_ko : a.title) + '</div>' +
        (hasKo ? '<div class="art-orig">' + esc(a.title) + '</div>' : '') +
        (bullets ? '<ul class="art-summary">' + bullets + '</ul>' : '') +
        '<div class="art-meta">' + esc(a.source) + (a.date_label ? ' · ' + esc(a.date_label) : '') + '</div>' +
      '</a>';
    }).join('');
    return '<div class="stock-block">' +
      '<div class="stock-head">' +
        (s.rank ? '<span class="stock-rank">' + esc(s.rank) + '위</span>' : '') +
        '<span class="stock-name">' + esc(s.name) + '</span>' +
        '<span class="stock-ticker">' + esc(s.ticker) + '</span>' +
      '</div>' +
      (arts || '<div class="no-art">최근 2주 내 수집된 기사 없음</div>') +
    '</div>';
  }).join('');
}

function calTimeline(evs){
  // 다가오는 2주 — 1주씩 두 줄 (오늘부터 14일)
  const W = 980, padL = 14, padT = 50, rowH = 198, H = padT + rowH*2 + 26;
  const colW = (W - padL*2) / 7;
  const day0 = new Date(); day0.setHours(0,0,0,0);
  const fmt = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const byDay = {};
  evs.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  const DOW = ['일','월','화','수','목','금','토'];
  let o = '';
  o += '<rect width="' + W + '" height="' + H + '" rx="14" fill="var(--bg-card)"/>';
  o += '<text x="20" y="30" fill="var(--gold)" font-size="16.5" font-weight="800">다가오는 2주 — 관측 캘린더</text>';
  o += '<text x="' + (W-20) + '" y="30" text-anchor="end" fill="var(--gold)" font-size="10.5" font-weight="800">UNIVERTRIX · univertrix.com</text>';
  let total = 0;
  for (let i = 0; i < 14; i++) {
    const d = new Date(day0.getTime() + i*86400000);
    const week = Math.floor(i / 7), col = i % 7;
    const x = padL + colW * col, top = padT + rowH * week, dow = d.getDay();
    const isToday = i === 0, isWknd = dow === 0 || dow === 6;
    if (isWknd) o += '<rect x="' + (x+2).toFixed(1) + '" y="' + top + '" width="' + (colW-4).toFixed(1) + '" height="' + (rowH-12) + '" fill="var(--cal-wknd)" rx="8"/>';
    if (isToday) o += '<rect x="' + (x+2).toFixed(1) + '" y="' + top + '" width="' + (colW-4).toFixed(1) + '" height="' + (rowH-12) + '" fill="var(--gold-bg, rgba(242,186,60,0.12))" stroke="var(--gold)" stroke-width="1.2" rx="8"/>';
    o += '<text x="' + (x+colW/2).toFixed(1) + '" y="' + (top+20) + '" text-anchor="middle" fill="' + (isToday ? 'var(--gold)' : 'var(--text)') + '" font-size="13.5" font-weight="800">' + (d.getMonth()+1) + '/' + d.getDate() + '</text>';
    o += '<text x="' + (x+colW/2).toFixed(1) + '" y="' + (top+36) + '" text-anchor="middle" fill="' + (isToday ? 'var(--gold)' : 'var(--text-muted)') + '" font-size="10.5" font-weight="700">' + (isToday ? '오늘' : DOW[dow]) + '</text>';
    const dayEvs = byDay[fmt(d)] || [];
    total += dayEvs.length;
    dayEvs.slice(0, 4).forEach((e, k) => {
      const y = top + 46 + k * 33;
      const isE = e.type === 'earnings';
      const label = String(e.ticker || (e.title || '').split(' ')[0]).slice(0, 8);
      o += '<rect x="' + (x+8).toFixed(1) + '" y="' + y + '" width="' + (colW-16).toFixed(1) + '" height="26" rx="7" fill="' + (isE ? 'var(--gold-bg, rgba(242,186,60,0.14))' : 'var(--cal-blue-bg)') + '" stroke="' + (isE ? 'var(--gold)' : 'var(--cal-blue)') + '" stroke-width="1"/>';
      o += '<text x="' + (x+colW/2).toFixed(1) + '" y="' + (y+17.5) + '" text-anchor="middle" fill="' + (isE ? 'var(--gold)' : 'var(--cal-blue)') + '" font-size="12" font-weight="800">' + esc(label) + '</text>';
    });
    if (dayEvs.length > 4)
      o += '<text x="' + (x+colW/2).toFixed(1) + '" y="' + (top+46+4*33+13) + '" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-weight="800">+' + (dayEvs.length-4) + '</text>';
  }
  o += '<text x="20" y="' + (H-8) + '" fill="var(--text-muted)" font-size="9.5">금빛 = 실적 발표 · 코발트 = 경제지표·기타 — 2주 내 ' + total + '건</text>';
  return '<div class="col-chart" style="margin:0 0 18px;border-radius:14px;overflow:hidden;border:1px solid var(--line);line-height:0">' +
    '<svg style="width:100%;height:auto;display:block" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' + o + '</svg></div>';
}

function renderCalendar() {
  const list = document.getElementById('list');
  const evs = (DATA.calendar && DATA.calendar.events) || [];
  if (!evs.length) {
    list.innerHTML = '<div class="no-art">수집된 일정이 아직 없습니다 — 다음 자동 갱신을 기다려 주세요.</div>';
    return;
  }
  const today = new Date(new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' }));
  const typeLabel = { macro: 'FOMC·매크로', earnings: '실적 발표', event: '이벤트' };
  list.innerHTML = calTimeline(evs) + evs.map(e => {
    const d = new Date(e.date);
    const diff = Math.round((d - today) / 86400000);
    const dday = diff === 0 ? 'TODAY' : (diff > 0 ? 'D-' + diff : 'D+' + Math.abs(diff));
    const md = (d.getMonth() + 1) + '/' + d.getDate();
    return '<div class="cal-item">' +
      '<div class="cal-date"><div class="d">' + md + '</div>' +
      '<span class="dday' + (diff === 0 ? ' today' : '') + '">' + dday + '</span></div>' +
      '<div class="cal-body"><div class="cal-title">' + esc(e.title) + '</div>' +
      '<span class="cal-type ' + esc(e.type || '') + '">' + (typeLabel[e.type] || '일정') + '</span></div>' +
    '</div>';
  }).join('');
}

function renderGurus() {
  const list = document.getElementById('list');

  if (!gs.length) {
    list.innerHTML = '<div class="no-art">거인 포트폴리오가 아직 수집되지 않았습니다 — 다음 자동 갱신을 기다려 주세요.</div>';

  }
  const note = '<div class="guru-note">SEC 13F 공시 기준 — 분기 1회 · 최대 45일 지연 공시 · 미국 상장 롱포지션만 포함됩니다. ' +
    '실제 현재 보유와 다를 수 있으며, 투자 권유가 아닙니다.' +
    (DATA.gurus.generated_label ? ' <span style="white-space:nowrap">(수집: ' + esc(DATA.gurus.generated_label) + ' KST)</span>' : '') + '</div>';
  list.innerHTML = note + gs.map((g, gi) => {

      else if (txt.startsWith('-')) cls = 'down';
      const bw = Math.min(100, (h.pct / (g.holdings[0].pct || 1)) * 100);
      return '<div class="guru-row">' +
        '<span class="guru-rank">' + (i + 1) + '</span>' +
        '<span class="guru-issuer">' + esc(h.name) + '</span>' +
        '<span class="guru-bar-wrap"><span class="guru-bar" style="width:' + bw + '%"></span></span>' +
        '<span class="guru-pct">' + h.pct + '%</span>' +
        '<span class="guru-chg ' + cls + '">' + esc(txt) + '</span>' +
      '</div>';
    }).join('');
    const exits = (g.exits && g.exits.length)
      ? '<div class="guru-exits"><b>전량 매도:</b> ' + g.exits.map(esc).join(' · ') + '</div>' : '';
    return '<div class="guru-block" id="guru-' + gi + '" onclick="toggleGuru(' + gi + ')">' +
      '<div class="guru-head"><span class="guru-name">' + esc(g.name_ko) + '</span>' +
      '<span class="guru-person">' + esc(g.person) + '</span>' +
      '<span class="guru-toggle">▼</span></div>' +
      '<div class="guru-tagline">' + esc(g.tagline) + '</div>' +
      '<div class="guru-body">' +
        '<div class="guru-meta">' + esc(g.period_label) + ' 보고 (공시 ' + esc(g.filed) + ') · 운용 $' +
          Number(g.total_b).toLocaleString() + 'B · ' + g.positions + '종목 중 TOP ' + (g.holdings || []).length +
          ' · 지분 증감은 전분기 대비</div>' +
        rows + exits +
      '</div>' +
    '</div>';
  }).join('');
}

function toggleGuru(gi) {
  const el = document.getElementById('guru-' + gi);
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.guru-block.open').forEach(b => b.classList.remove('open'));
  if (!wasOpen) { el.classList.add('open'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}

const TAG_COLOR = { '에세이': '#9c7a3a', '모델 발표': '#386ee1', '연구': '#2e9d87', '정책·규제': '#c05555', '투자·산업': '#7a6cc4', '기타': '#6a7390' };
function renderSignals(){

  const label = (DATA.signals && DATA.signals.generated_label) || '';
  if (!sg.length) { document.getElementById('list').innerHTML =
    '<div class="empty-note">📡 신호 관측소 가동 준비 중 — 첫 수집 후 이곳에 실리콘밸리의 고신호 담론·발표가 잡힙니다.</div>'; return; }
  let html = '<div class="gen-note" style="font-size:12px;color:var(--text-muted);margin-bottom:14px">해커뉴스 300점↑ 집단 주목 + AI 랩 공식 발표 — 매일 자동 포착' + (label ? ' (최근 수집: ' + esc(label) + ' KST)' : '') + '</div>';
  const now = Date.now();
  // 고정 기간: 추천수 1000↑ 초신성급 = 30일, 그 외 필독 = 7일
  const pinDays = x => ((x.points || 0) >= 1000 ? 30 : 7);
  const isRecent = x => { const d = new Date((x.captured || '').replace(' ', 'T')); return !isNaN(d) && (now - d.getTime()) < pinDays(x) * 86400000; };
  const pinned = sg.filter(x => x.pin && isRecent(x));
  // 표시 문턱: HN 신호는 추천수 400점 이상만 노출 (수집·보관은 300점부터 계속 —
  // 문턱만 낮추면 과거분도 재등장). 포인트 없는 공식 발표(RSS)와 필독 고정은 예외.
  const SHOW_MIN_POINTS = 400;
  const rest = sg.filter(x => !pinned.includes(x)
    && (x.points == null || x.points >= SHOW_MIN_POINTS));
  // 재배치: 고정(필독)은 최상단 유지, 그 안에서도·나머지도 추천수(▲) 많은 순.
  // 포인트 없는 공식 발표(RSS)는 동률(0점) 취급 — 같은 점수끼리는 최신 수집순.
  const byVotes = (a, b) => ((b.points || 0) - (a.points || 0))
    || String(b.captured || '').localeCompare(String(a.captured || ''));
  pinned.sort(byVotes);
  rest.sort(byVotes);
  const card = (x, pin) => {
    const tag = x.tag || '기타';
    return '<div class="article-card" style="cursor:auto' + (pin ? ';border:1.5px solid var(--gold)' : '') + '">' +
      (pin ? '<div style="font-size:10.5px;font-weight:800;color:var(--gold);margin-bottom:6px">📌 필독 신호 — 관제탑 지정</div>' : '') +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px">' +
      '<span style="font-size:10.5px;font-weight:800;border-radius:100px;padding:2px 9px;background:' + (TAG_COLOR[tag] || '#6a7390') + ';color:#fff">' + esc(tag) + '</span>' +
      (x.points ? '<span style="font-size:11px;color:var(--gold);font-weight:800">▲ ' + x.points + '</span>' : '') +
      '<span style="font-size:11px;color:var(--text-muted)">' + esc(x.source || '') + (x.captured ? ' · ' + esc(x.captured.slice(5, 16)) : '') + '</span></div>' +
      '<a href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit">' +
      '<div style="font-size:15.5px;font-weight:800;line-height:1.45">' + esc(x.ko || x.title) + '</div>' +
      (x.ko ? '<div style="font-size:12px;color:var(--text-muted);margin-top:2px">' + esc(x.title) + '</div>' : '') + '</a>' +
      (x.why ? '<div style="font-size:13px;color:var(--text-secondary);line-height:1.65;margin-top:8px;border-left:3px solid var(--gold);padding-left:10px">' + esc(x.why) + '</div>' : '') +
    '</div>';
  };
  if (pinned.length) html += pinned.map(x => card(x, true)).join('');
  html += rest.map(x => card(x, false)).join('');
  document.getElementById('list').innerHTML = html;
}

function setGroup(g, btn) {
  document.querySelectorAll('.group-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (g === 'calendar') renderCalendar(); else if (g === 'gurus') renderGurus(); else if (g === 'signals') renderSignals(); else render(g);
}

document.addEventListener('DOMContentLoaded', function () {
  if (DATA.generated_label) {
    document.getElementById('genLabel').textContent = '마지막 수집: ' + DATA.generated_label + ' KST';
  }
  render('universe');
});
</script>
<!-- uv-presence -->
<script type="module">
(async () => {
  try {
    const cfg = await (await fetch('data/firebase_config.json?v=' + Date.now())).json();
    if (!cfg || !cfg.apiKey) return;
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const { getFirestore, doc, setDoc, collection, query, where, Timestamp, serverTimestamp, getCountFromServer } =
      await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const db = getFirestore(initializeApp(cfg, 'presence'));

    let pid = localStorage.getItem('uv_pid');
    if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem('uv_pid', pid); }

    const beat = () => setDoc(doc(db, 'presence', pid), { t: serverTimestamp() }).catch(() => {});
    const count = async () => {
      try {
        const cutoff = Timestamp.fromMillis(Date.now() - 2 * 60 * 1000);
        const snap = await getCountFromServer(query(collection(db, 'presence'), where('t', '>', cutoff)));
        const n = snap.data().count;
        if (n > 0) {
          let el = document.getElementById('uvPresence');
          if (!el) {
            const ft = document.querySelector('.site-footer') || document.querySelector('footer');
            if (!ft) return;
            el = document.createElement('div');
            el.id = 'uvPresence';
            el.style.cssText = 'margin-top:8px;font-size:12px;color:var(--text-muted,#8a8577);';
            ft.appendChild(el);
          }
          el.innerHTML = '<span style="color:var(--gold,#9C7A3A)">✦</span> 지금 ' + n + '명이 우주를 관측 중';
        }
      } catch (e) {}
    };
    await beat(); await count();
    setInterval(beat, 60 * 1000 + Math.floor(Math.random() * 5000));
    setInterval(count, 60 * 1000 + Math.floor(Math.random() * 5000));
  } catch (e) {}
})();
</script>
