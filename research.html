const TAG_COLOR = { '에세이': '#9c7a3a', '모델 발표': '#386ee1', '연구': '#2e9d87', '정책·규제': '#c05555', '투자·산업': '#7a6cc4', '기타': '#6a7390' };
function renderSignals(){
  const sg = (DATA.signals && DATA.signals.signals) || [];
  const label = (DATA.signals && DATA.signals.generated_label) || '';
  if (!sg.length) { document.getElementById('list').innerHTML =
    '<div class="empty-note">📡 신호 관측소 가동 준비 중 — 첫 수집 후 이곳에 실리콘밸리의 고신호 담론·발표가 잡힙니다.</div>'; return; }
  let html = '<div class="gen-note" style="font-size:12px;color:var(--text-muted);margin-bottom:14px">해커뉴스 300점↑ 집단 주목 + AI 랩 공식 발표 — 매일 자동 포착' + (label ? ' (최근 수집: ' + esc(label) + ' KST)' : '') + '</div>';
  const now = Date.now();
  // 고정 기간: 추천수 1000↑ 초신성급 = 30일, 그 외 필독 = 7일
  const pinDays = x => ((x.points || 0) >= 1000 ? 30 : 7);
  const isRecent = x => { const d = new Date((x.captured || '').replace(' ', 'T')); return !isNaN(d) && (now - d.getTime()) < pinDays(x) * 86400000; };
  const pinned = sg.filter(x => x.pin && isRecent(x));
  // 표시 문턱: HN 신호는 추천수 400점 이상만 노출 (수집·보관은 300점부터 계속 —
  // 문턱만 낮추면 과거분도 재등장). 포인트 없는 공식 발표(RSS)와 필독 고정은 예외.
  const SHOW_MIN_POINTS = 400;
  const rest = sg.filter(x => !pinned.includes(x)
    && (x.points == null || x.points >= SHOW_MIN_POINTS));
  // 재배치: 고정(필독)은 최상단 유지, 그 안에서도·나머지도 추천수(▲) 많은 순.
  // 포인트 없는 공식 발표(RSS)는 동률(0점) 취급 — 같은 점수끼리는 최신 수집순.
  const byVotes = (a, b) => ((b.points || 0) - (a.points || 0))
    || String(b.captured || '').localeCompare(String(a.captured || ''));
  pinned.sort(byVotes);
  rest.sort(byVotes);
  const card = (x, pin) => {
    const tag = x.tag || '기타';
    return '<div class="sig-card' + (pin ? ' pin' : '') + '">' +
      (pin ? '<div class="sig-pin-label">📌 필독 신호 — 관제탑 지정</div>' : '') +
      '<div class="sig-meta">' +
      '<span class="sig-tag" style="background:' + (TAG_COLOR[tag] || '#6a7390') + '">' + esc(tag) + '</span>' +
      (x.points ? '<span class="sig-points">▲ ' + x.points + '</span>' : '') +
      '<span>' + esc(x.source || '') + (x.captured ? ' · ' + esc(x.captured.slice(5, 16)) : '') + '</span></div>' +
      '<a href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer" class="sig-link">' +
      '<div class="sig-title">' + esc(x.ko || x.title) + '</div>' +
      (x.ko ? '<div class="sig-title-en">' + esc(x.title) + '</div>' : '') + '</a>' +
      (x.why ? '<div class="sig-why">' + esc(x.why) + '</div>' : '') +
    '</div>';
  };
  if (pinned.length) html += pinned.map(x => card(x, true)).join('');
  html += rest.map(x => card(x, false)).join('');
  document.getElementById('list').innerHTML = html;
}

// 🔬 필독 해부실 — 필독 신호 원문의 문단별 한국어 브리핑 (전문 번역 아님)
const DX_NOTICE = '본 글은 원문의 논지를 재서술한 브리핑이며 전문 번역이 아닙니다.';
function renderDissect(){
  const items = (DATA.translations && DATA.translations.items) || [];
  const label = (DATA.translations && DATA.translations.generated_label) || '';
  if (!items.length) { document.getElementById('list').innerHTML =
    '<div class="empty-note">🔬 해부실 준비 중 — 필독 신호가 지정되면 원문을 문단별로 해부해 이곳에 싣습니다.</div>'; return; }
  let html = '<div class="gen-note" style="font-size:12px;color:var(--text-muted);margin-bottom:14px">필독 신호의 원문을 문단·섹션 단위로 재서술한 한국어 브리핑' + (label ? ' (최근 해부: ' + esc(label) + ' KST)' : '') + '</div>';
  html += '<div class="ud-index"><div class="ud-index-title">해부 목록 ' + items.length + '건</div>' +
    items.map(it => '<a class="ud-index-row" href="#dx-' + esc(it.id) + '">' +
      '<span class="ud-index-date">' + esc(it.date || '') + '</span>' +
      esc(it.ko_title || it.title) + '</a>').join('') + '</div>';
  const colLinks = (DATA.translations && DATA.translations.column_links) || {};
  html += items.map(it => {
    const secs = (it.sections || []).map(s =>
      '<div class="dx-sec"><h4>' + esc(s.h || '') + '</h4><p>' + esc(s.ko || '') + '</p></div>').join('');
    // 역방향 링크 — 이 원문으로 쓴 관측일지 칼럼이 있을 때만 (영구 슬러그 #log-)
    const slug = colLinks[it.id];
    return '<div class="dx-card" id="dx-' + esc(it.id) + '">' +
      '<div class="dx-meta"><span class="dx-badge">🔬 해부</span>' +
        '<span>' + esc(it.source || '') + (it.date ? ' · ' + esc(it.date) : '') + '</span></div>' +
      '<div class="dx-title">' + esc(it.ko_title || it.title) + '</div>' +
      (it.ko_title && it.title ? '<div class="dx-orig">' + esc(it.title) + '</div>' : '') +
      '<a class="dx-src" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">원문 읽기 ↗</a>' +
      '<div class="dx-actions">' +
        '<button onclick="dxCopyLink(event,\'' + esc(it.id) + '\')">🔗 링크 복사</button>' +
        (slug ? '<a href="observatory.html#' + esc(slug) + '">📄 칼럼 보기 →</a>' : '') +
      '</div>' +
      secs +
      (it.caveat ? '<div class="dx-caveat">⚠ ' + esc(it.caveat) + '</div>' : '') +
      '<div class="dx-notice">' + DX_NOTICE + ' 인용은 최소한으로 제한했으며, 정확한 표현·수치는 위 원문을 확인해 주십시오.</div>' +
    '</div>';
  }).join('');
  document.getElementById('list').innerHTML = html;
  openDissectFromHash();
}

// 해부 글 영구 링크 복사 — 관측일지 copyColLink와 같은 문법(복사 + 완료 피드백)
function dxCopyLink(ev, id){
  ev.preventDefault(); ev.stopPropagation();
  const btn = ev.target;
  const url = location.origin + location.pathname.replace(/[^/]*$/, '') + 'research.html#dx-' + id;
  const done = () => { const o = btn.textContent; btn.textContent = '✓ 복사됨'; setTimeout(() => { btn.textContent = o; }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done, () => window.prompt('아래 주소를 복사하세요 (Ctrl+C):', url));
  } else {
    window.prompt('아래 주소를 복사하세요 (Ctrl+C):', url);
  }
}

// #dx-… 진입 처리 — 관측일지 openFromHash와 동일 패턴
function openDissectFromHash(){
  const h = location.hash.replace('#', '');
  if (!h.startsWith('dx-')) return;
  const card = document.getElementById(h);
  if (card) setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
}

function setGroup(g, btn) {
  document.querySelectorAll('.group-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (g === 'calendar') renderCalendar(); else if (g === 'gurus') renderGurus(); else if (g === 'signals') renderSignals(); else if (g === 'dissect') renderDissect(); else render(g);
}

document.addEventListener('DOMContentLoaded', function () {
  if (DATA.generated_label) {
    document.getElementById('genLabel').textContent = '마지막 수집: ' + DATA.generated_label + ' KST';
  }
  // 해부실 딥링크 (#dx-…) — 관측일지 '해부실에서 보기'·해부 글 링크 복사가 이 경로로 들어온다
  // (관측일지의 #log- 진입 처리와 같은 패턴: 탭을 열면 렌더 끝에서 openDissectFromHash가 스크롤)
  if (location.hash && location.hash.indexOf('#dx-') === 0) {
    const btn = document.querySelector('.group-tab[data-g="dissect"]');
    if (btn) { setGroup('dissect', btn); return; }
    renderDissect();
    return;
  }
  // 순수 탭 해시 딥링크 (#signals·#dissect·#calendar·#gurus) — 메인 STAGE 3 버튼이 이 경로로 들어온다
  // #dx- 분기를 지난 뒤이므로 해부실 영구 슬러그와 충돌하지 않는다
  const tabHash = { '#signals': 'signals', '#dissect': 'dissect',
    '#calendar': 'calendar', '#gurus': 'gurus' }[location.hash];
  if (tabHash) {
    const btn = document.querySelector('.group-tab[data-g="' + tabHash + '"]');
    if (btn) { setGroup(tabHash, btn); return; }
  }
  render('universe');
});
</script>

<script type="module">
(async () => {
  try {
    const cfg = await (await fetch('data/firebase_config.json?v=' + Date.now())).json();
    if (!cfg || !cfg.apiKey) return;
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const { getFirestore, doc, setDoc, collection, query, where, Timestamp, serverTimestamp, getCountFromServer } =
      await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const db = getFirestore(initializeApp(cfg, 'presence'));

    let pid = localStorage.getItem('uv_pid');
    if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem('uv_pid', pid); }

    const beat = () => setDoc(doc(db, 'presence', pid), { t: serverTimestamp() }).catch(() => {});
    const count = async () => {
      try {
        const cutoff = Timestamp.fromMillis(Date.now() - 2 * 60 * 1000);
        const snap = await getCountFromServer(query(collection(db, 'presence'), where('t', '>', cutoff)));
        const n = snap.data().count;
        if (n > 0) {
          let el = document.getElementById('uvPresence');
          if (!el) {
            const ft = document.querySelector('.site-footer') || document.querySelector('footer');
            if (!ft) return;
            el = document.createElement('div');
            el.id = 'uvPresence';
            el.style.cssText = 'margin-top:8px;font-size:12px;color:var(--text-muted,#8a8577);';
            ft.appendChild(el);
          }
          el.innerHTML = '<span style="color:var(--gold,#9C7A3A)">✦</span> 지금 ' + n + '명이 우주를 관측 중';
        }
      } catch (e) {}
    };
    await beat(); await count();
    setInterval(beat, 60 * 1000 + Math.floor(Math.random() * 5000));
    setInterval(count, 60 * 1000 + Math.floor(Math.random() * 5000));
  } catch (e) {}
})();
</script>
