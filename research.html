든 일관된 경영 맥락이 유지됩니다."}, {"h": "문서 업로드와 컨텍스트 관리", "ko": "사용자는 웹 UI 또는 CLI를 통해 피치덱, 재무 모델, 전략 문서 등을 업로드할 수 있습니다. 업로드된 문서는 도메인별로 분류되어 벡터 저장소에 청킹되므로, 경영진 에이전트가 회사 특정 맥락에서 권장사항을 제시할 때 자동으로 참조됩니다. 이를 통해 일반적인 MBA 지식과 회사 고유의 상황을 결합한 맞춤형 조언을 생성합니다."}, {"h": "배포 및 환경 전략", "ko": "프로젝트는 Fly.io에 dev와 qa 두 환경을 구성합니다. main 브랜치로의 푸시/병합은 자동으로 dev 환경을 배포하고, qa 브랜치로의 명시적 승격은 qa 환경을 업데이트합니다. API는 영구 볼륨 위에 상태를 유지하는 단일 인스턴스로 실행되며(max_machines_running = 1), UI는 stateless 상태입니다. 이러한 구성은 스케줄러의 중복 실행을 방지하면서 안정적인 지속적 배포를 가능하게 합니다."}, {"h": "인증 및 보안", "ko": "배포된 UI는 Google 로그인과 이메일 허용 목록으로 보호되며, 공개 API는 UI 프록시와 FastAPI 백엔드 간 공유 비밀 헤더로 인증됩니다. Fly.io 배포 토큰, Anthropic API 키, 통합 서비스 토큰 등 런타임 시크릿은 환경 변수로 관리되며, GitHub Actions 워크플로우는 리포지토리 시크릿으로 저장된 앱별 토큰을 사용합니다. 사용자 접근 제어는 /people UI를 통해 관리됩니다."}, {"h": "온보딩과 커스터마이제이션", "ko": "첫 방문 시 사용자는 회사 프로필을 설정하는 마법사 프로세스를 거칩니다. 이 단계에서 구성된 회사 정보는 모든 후속 응답에 반영되어, 경영진 에이전트가 항상 조직의 구체적인 맥락 내에서 조언을 제공합니다. 온보딩은 상태 머신 기반으로 안정적이고 반복 가능하게 구현되었습니다."}, {"h": "설정과 모델 선택의 유연성", "ko": "필수 환경 변수는 ANTHROPIC_API_KEY뿐이며, 원하면 로컬 모델이나 OpenRouter 백엔드를 사용할 수도 있습니다. DEFAULT_MODEL은 Claude Sonnet 4.6(기본 경영진)으로 설정되고, 전략·재무·법률·이사회 역할은 더 강력한 Claude Opus 4.7을 선택적으로 사용합니다. 라우팅 모델로는 Claude Haiku를 사용하고, 이 모든 선택은 환경 변수로 쉽게 변경할 수 있습니다. 벡터 저장소, 에피소드 메모리 경로, 회사 프로필 경로도 설정 가능합니다."}, {"h": "오픈소스 프로젝트의 의미", "ko": "Apache 2.0 라이선스 하에 공개된 이 프로젝트는 개발자 커뮤니티가 경영진 자동화 기술에 직접 접근할 수 있게 합니다. 상세한 저장소 구조, 설치 가이드, 배포 문서가 제공되며, 자신의 인프라에서 독립적으로 실행할 수 있습니다. 이는 AI 기반 의사결정 시스템의 민주화를 시도하는 모습으로 해석될 수 있습니다."}], "caveat": "이 해부문은 GitHub 리포지토리의 README 기술 문서를 기반으로 하므로, 실제 시스템의 성능·정확성·운영상 실효성은 별도의 검증이 필요합니다."}, {"id": "3966433b8e10", "date": "2026-08-27", "title": "AWS Acquires DuckLabs", "ko_title": "AWS의 DuckLabs 인수, 오픈소스 데이터베이스 생태계 확대 전략", "source": "Hacker News 300+", "url": "https://ducklabs.com/news/2026/08/26/ducklabs-to-join-aws", "sections": [{"h": "인수 발표와 기본 방침", "ko": "DuckLabs가 AWS에 인수되며 9월 초부터 효력이 발생한다. 창립자 Mark Raasveldt와 Hannes Mühleisen은 팀이 암스테르담에 유지되면서 DuckDB, DuckLake, Quack 프로젝트를 계속 진행할 것이라고 밝혔다. AWS의 자원과 영향력이 이 기술을 더 많은 개발자와 조직에 전파하는 데 도움이 될 것으로 기대한다. 가장 중요한 점은 DuckDB와 Duck Stack의 다른 오픈소스 요소들이 MIT 라이선스 아래서 자유로운 상태로 유지되며, 비영리 DuckDB Foundation이 계속 프로젝트를 관리한다는 것이다."}, {"h": "DuckLabs 창립 5년의 여정과 성장", "ko": "DuckLabs는 5년 전 DuckDB 팀에 안정적인 거점을 제공하기 위해 설립됐다. 당시 DuckDB는 상업 계약 문의와 벤처캐피털의 투자 제안을 받고 있었지만, 창립자들은 부트스트래핑 방식으로 독립적으로 성장하는 길을 선택했다. 이 결정 덕분에 기술을 우선하면서 차분히 개발할 수 있었고, 암스테르담에 30명 이상의 팀을 꾸리게 됐다. 현재 하루 백만 회 이상의 다운로드를 기록하며 전 세계 개발자들이 데이터 탐색, 제품 개발, 교육, 연구 등 다양한 용도로 사용 중이다."}, {"h": "독립 운영의 한계와 AWS와의 협력 계기", "ko": "DuckDB의 성장이 가속화되면서 소규모 팀이 그 속도를 따라가기 어려워질 수 있다는 우려가 생겼다. 회사가 프로젝트의 병목이 될 가능성이 커진 것이다. 또한 판매, 지원, 운영 조직을 키우면 기술 개발과 오픈소스 커뮤니티 활동에 집중하기 어려워질 위험도 있었다. DuckLabs는 기존 모델로는 더 광범위한 사용자층에 도달하기 어렵다는 점을 깨달았다. AWS와는 이미 1년 이상 긴밀히 협력해 왔으며, 그 경험을 통해 DuckLabs의 기술력과 AWS의 인프라, 규모, 고객 기반을 결합할 가능성을 확인했다."}, {"h": "AWS 인수 후의 기술 방향과 기대", "ko": "DuckDB, DuckLake, Quack을 기반으로 새로운 세대의 데이터 서비스를 구축하는 것이 목표다. Duck Stack이 직접적으로든 간접적으로든 일상적으로 사용되는 플랫폼이 되도록 영향력을 확대하려고 한다. DuckLabs 팀은 기술 작업에 집중하면서도 이전에 불가능했던 규모로 운영할 수 있게 된다. 더 큰 문제를 해결하고 더 많은 사용자에게 기술을 전달할 기회가 열린다. AWS는 장기적으로 DuckDB와 커뮤니티 개발을 지원하겠다는 약속을 했다."}, {"h": "오픈소스 독립성 보장과 커뮤니티 신뢰", "ko": "인수 이후에도 DuckDB와 Duck Stack의 모든 오픈소스 요소는 MIT 라이선스 아래서 자유롭게 유지된다. DuckDB Foundation이 계속 이들 프로젝트를 관리하며 DuckLabs 팀도 암스테르담에서 개발을 이어간다. 오픈소스 프로젝트의 개방성이 DuckDB 성공의 중심이었던 만큼 그것이 미래에도 유지될 것이다. 커뮤니티의 신뢰를 지키는 것이 이 과정 전반에서 가장 중요한 고려 사항이었다."}, {"h": "기초 연구 조직과 교육 커뮤니티의 지지", "ko": "CWI 대표와 데이터베이스 아키텍처 연구 그룹 리더들이 이 인수를 긍정적으로 평가했다. DuckDB Foundation이 모든 오픈소스 IP를 보유하므로 공개 상태가 유지될 것이라는 점을 강조했다. 독일의 대학 교수는 DuckDB의 개방성과 수정 가능성이 데이터베이스 연구와 교육에 필수적이므로 오픈소스 상태 유지가 중요하다고 지적했다. 이들의 지지는 AWS가 기술 커뮤니티와 교육 생태계를 중시한다는 신호다."}, {"h": "향후 계획과 생태계 확대", "ko": "AWS 인수로 기술과 커뮤니티에 더 투자할 역량이 생긴다. DuckDB Foundation에 기술 자문 위원회를 설립해 커뮤니티 리더들이 기술 방향에 의견을 낼 수 있도록 할 계획이다. 또한 다른 개발자와 조직이 서명한 확장 프로그램이 DuckDB에서 실행될 수 있도록 확장 스택을 개방할 예정이다. 업계 전문가들은 Amazon의 후원이 DuckDB 생태계에 강한 추진력을 가져올 것이라고 평가했다."}, {"h": "공동 성장의 성과와 감사", "ko": "DuckDB의 성공은 DuckLabs 내부 팀만의 것이 아니라 사용자, 기여자, 버그 리포터, 확장 프로그램 개발자, 교육자, 제품 개발자 등 광범위한 커뮤니티의 협력 결과다. AWS 인수는 Duck Stack을 훨씬 더 많은 사용자에게 전달하면서도 그 핵심인 오픈소스 기술에 계속 투자할 수 있는 기회를 제공한다. 창립자들은 이 새로운 장을 시작하면서 처음부터 함께한 팀과 커뮤니티에 감사를 표현했다."}], "caveat": "이 글은 DuckLabs와 AWS의 공식 발표이므로, 인수 조건(금액, 구체적 계약 조항), 고용 보장, 실제 오픈소스 정책 실행 등에 대해서는 검증이 필요합니다."}, {"id": "e61f241d4e2e", "date": "2026-08-26", "title": "OpenAI Jalapeño: Better than Nvidia Blackwell", "ko_title": "OpenAI 할라페뇨 칩, 엔비디아 블랙웰 능가—AI 칩 시장 독점 구조 균열의 시작", "source": "Hacker News 300+", "url": "https://newsletter.semianalysis.com/p/openai-jalapeno-better-than-nvidia", "sections": [{"h": "OpenAI 자체 칩 개발, 16개월 만에 완성", "ko": "OpenAI가 할라페뇨라는 자체 설계 추론 칩을 핫칩스 컨퍼런스에서 공개했다. 브로드컴과의 파트너십 하에 LLM 추론 전용으로 설계된 이 칩은 2024년 중반부터 설계 작업을 시작해 약 16개월 만에 제조 테이프아웃에 도달했으니, 업계 표준을 크게 앞당긴 초고속 개발 주기다. 일반적으로 1세대 칩은 경쟁력이 떨어지지만, 할라페뇨는 예외로서 엔비디아·AMD·구글 칩을 압도하는 성능을 보이고 있으며, 이는 극도의 하드웨어-소프트웨어 코디자인의 결과다."}, {"h": "일반화된 추론 칩, 특정 모델 최적화 아님", "ko": "언론에서는 할라페뇨가 OpenAI 모델에만 특화되었다고 보도하지만, 이는 오해다. 실제로는 모든 종류의 AI 모델과 워크로드를 실행할 수 있는 범용 추론 칩이다. OpenAI 엔지니어들과 함께 실시한 InferenceX 벤치마크 테스트에서 이를 확인했고, 농담삼아 코덱스 프롬프트만으로 Doom 게임까지 이 칩에 포팅해 실행시켰다. 특정 부분에 과도하게 특화되지 않고 모든 시나리오에서 고성능을 내는 설계 철학을 따르고 있다."}, {"h": "전력 효율성에서 블랙웰 압도, 단 MTP 미적용", "ko": "할라페뇨는 전력 사용량당 토큰 처리량(perf/W) 지표에서 블랙웰을 거의 모든 시나리오에서 능가한다. 저지연 고처리량 모두에서 탁월한 성능을 보이는데, 주목할 점은 다중 토큰 예측(MTP) 기술을 적용하지 않은 상태라는 것이다. 반면 비교 대상 칩들은 각각 최적화된 MTP 구성을 사용했다. DeepSeek R1 모델에서 동시 접속 1명당 700개 토큰/초 이상의 상호작용성을 달성했고, 다른 모델들도 1,400개 토큰/초대에 도달했으며, GSM8k 평가에서는 엔비디아 칩과 동등한 결과를 얻었다."}, {"h": "성과 해석의 한계와 검증 필요성", "ko": "다만 몇 가지 주의점이 있다. 첫째, 모든 수치는 OpenAI가 제공한 것이며, InferenceX는 현장에서 검증했으나 전체 벤치마크 스위트나 AgentX 결과는 아직 없다. AgentX는 장문맥과 다중 턴 특성으로 실제 프로덕션 워크플로의 캐시 동작을 반영해 더 엄격한 테스트다. 둘째, 블랙웰과의 비교는 다소 불공정하다. 할라페뇨의 진정한 경쟁 상대는 같은 HBM4를 사용하는 베라 루빈이며, 루빈은 이미 고객에게 배송 중인 반면 할라페뇨는 아직 엔지니어링 샘플 단계다. 셋째, 테스트 모델이 최신 대형 모델이 아니다."}, {"h": "전력당 수익, 데이터센터의 핵심 제약 조건", "ko": "OpenAI가 전력 효율(perf/W)에 설계를 맞춘 이유는 간단하다. 현재 데이터센터는 예산이나 바닥 면적이 아닌 전력 공급량으로 제약을 받고 있기 때문이다. 젠슨 황은 2026년 컴퓨텍스에서 「1기가와트의 전력이 있으면 전력당 처리량이 수익이다」라고 강조했다. 데이터센터 운영자는 단순히 더 많은 전력을 구하기 어려운데, GPU 추가와 전력망 용량 증설이 전혀 다른 시간 척도로 진행되기 때문이다. 그래서 xAI의 콜로서스 2처럼 현장 자체 발전시설에 의존하게 된다."}, {"h": "루빈과의 직접 비교, TCO와 효율성 우위", "ko": "할라페뇨는 루빈과 비교해도 전력당 토큰 처리량에서 앞선다. 엔비디아와 코어위브가 공개한 루빈의 MTP 결과를 능가하며, 2025년 블랙웰 결과도 크게 초과한다. 전력 대비 총소유비용(TCO) 기준으로는 루빈과 거의 비슷하나, 할라페뇨는 단일 토큰 예측으로 이를 달성했다는 점이 중요하다. 루빈은 투기적 디코딩을 사용해 비용을 3~5배 감소시킨 상태다. 할라페뇨에 투기적 디코딩을 적용하면 비용 효율이 더욱 개선될 것이다."}, {"h": "프리필-디코드 미분리 구조, 유연성 택한 설계", "ko": "아키텍처 측면에서 할라페뇨는 프리필과 디코드를 별도 칩 풀로 분리하지 않았다. 초안 모델과 본 모델이 같은 칩과 패브릭을 공유하는 구조인데, 이는 이론적 효율성을 버리고 실제 운영 유연성을 택한 선택이다. 모델 개발 추세가 진화하면서 입력 토큰 대비 캐시 쓰기·읽기·출력 비율이 크게 변했기 때문에, 처음부터 고정된 비율의 이질적 프리필·디코드 실리콘을 할당하는 것은 장기적으로 비효율을 초래할 수 있다. 따라서 동질적 풀로 모든 상황에 좋은 성능을 내는 칩을 만드는 것이 더 나은 전략이었다."}, {"h": "B0 스텝, 25% 효율 개선 준비 중", "ko": "현재 공개된 수치는 A0 스텝핑 기준이며, 프로젝트 시작 9개월 만의 성과다. 이미 B0 스텝핑이 파운드리에서 제조 중인데, 이는 전력당 성능에서 약 25% 개선을 제공한다. B0 스텝은 TSMC N3P 공정에서 13.4 PFLOPs의 MXFP4 성능을 달성하는데, 루빈의 동등 크기 계산 다이가 17.5 PFLOPs의 NVFP4를 내므로 비교 가능한 수준이다. 할라페뇨의 TDP가 700W인 반면 루빈은 900~1,150W라는 점을 감안하면, 추론 전용이라는 설계 목표를 충분히 달성했다."}, {"h": "HBM4 채택, 업계 구도 변화의 신호", "ko": "할라페뇨는 HBM4 메모리를 탑재하며, 엔비디아·AMD 이후 조기 도입자 중 하나다. 이는 기존의 TPU나 트레이니움 프로그램까지 앞선 것이다. N3E 공정으로 만든 I/O 칩렛은 32레인 800G SerDes를 제공하는데, 24레인은 랙 내 스케일링, 8레인은 2,048 XPU 다중 랙 도메인 전역 스케일링에 쓰인다. PCIe Gen 5로 x86 호스트 CPU와 연결된다. 할라페뇨의 핵심 설계 원칙 중 하나가 HBM 대역폭의 최대 활용이라는 점에서, 이 메모리 선택은 아키텍처와의 완벽한 정합을 보여준다."}], "caveat": "모든 성능 수치는 OpenAI가 제공한 것이며, 아직 실제 프로덕션 환경의 장문맥·다중 턴 워크로드를 반영하는 AgentX 벤치마크 검증이 부족하고, A0 스텝핑 기준 데이터이므로 양산 단계 성능과는 차이가 있을 수 있다."}, {"id": "829e237a888d", "date": "2026-08-26", "title": "The full stack behind abundant intelligence", "ko_title": "AI 시대 경쟁력의 본질: 칩·소프트웨어·모델·제품의 통합 시스템", "source": "OpenAI", "url": "https://openai.com/index/the-full-stack-behind-abundant-intelligence", "sections": [{"h": "시스템 전체 개선을 통한 AI 진전", "ko": "OpenAI는 AI 발전이 개별 요소가 아니라 전체 시스템이 동시에 향상될 때 가장 빠르게 일어난다고 봅니다. 데이터센터와 칩부터 최첨단 모델, 개발자 플랫폼, 소비자·기업 제품, AI 네이티브 기기까지 모든 계층이 유기적으로 연결되어 각 층이 다음 층을 강화하는 구조를 추구합니다. 이는 전통적인 수직 구조가 아니라 피드백 루프를 통해 지속적으로 개선되는 생태계입니다."}, {"h": "소프트웨어와 하드웨어의 상호 강화", "ko": "OpenAI의 전략에서 소프트웨어와 하드웨어는 독립적이 아니라 상호작용합니다. 우수한 소프트웨어는 기존 하드웨어의 생산성을 높이고, 반대로 특정 워크로드를 위해 설계된 하드웨어는 속도와 효율성을 개선합니다. 더 강력한 모델은 더 나은 제품을 만들고, 이는 수요와 사용량 증가로 이어지며, 이 신호들이 다시 시스템으로 흘러들어와 전체를 개선하는 선순환을 만듭니다."}, {"h": "자체 추론 칩 Jalapeño의 성과", "ko": "OpenAI가 처음으로 공개한 자체 개발 추론 칩 Jalapeño는 InferenceX 벤치마크에서 주목할 성과를 냈습니다. 기업용 경쟁 시스템 대비 킬로와트당 더 높은 최고 처리량과 더 낮은 토큰 지연시간을 달성했으며, DeepSeek R1과 Kimi K2 같은 다양한 모델군에서도 우수한 성능을 보였습니다. 이는 OpenAI가 단순히 기존 칩에 의존하는 것을 넘어 자신의 추론 최적화에 특화된 하드웨어를 갖춘 것을 의미합니다."}, {"h": "통합 시스템 설계를 통한 통제와 경제성 확보", "ko": "모델, 서빙 소프트웨어, 칩, 메모리, 네트워크를 함께 개발함으로써 OpenAI는 처리량, 지연시간, 에너지 효율, 비용을 하나의 시스템으로 최적화할 수 있습니다. Jalapeño는 단순한 칩이 아니라 OpenAI가 모델 실행 방식과 서빙 경제성을 주도할 수 있도록 하는 전략적 자산입니다. 이제 OpenAI는 파트너 가속기와 함께 자체 반도체라는 신뢰할 수 있는 첫 번째 경로를 확보하여 각 워크로드에 최적의 비용으로 가장 강력한 시스템을 선택할 수 있는 유연성을 갖추었습니다."}, {"h": "워크로드별 요구사항과 Pareto 경계의 추구", "ko": "최첨단 훈련, 대규모 추론, 상시 작동 에이전트는 칩·소프트웨어·네트워크·전력·지연시간 측면에서 서로 다른 요구사항을 갖습니다. OpenAI의 목표는 각 워크로드마다 성능, 속도, 신뢰성, 효율성, 비용의 최적 조합을 찾는 것, 즉 Pareto 경계 위에 머물러 있으면서 기술이 진화할 때 함께 움직이는 것입니다. 이는 단일 칩 또는 제공자에 의존하는 것이 아니라 동적 포트폴리오 관리를 통해 달성됩니다."}, {"h": "다양한 파트너와의 차별화된 포트폴리오 전략", "ko": "Microsoft의 컴퓨팅과 NVIDIA의 칩이 OpenAI 성장의 기초였다면, 현재는 AWS, AMD, Broadcom, Cerebras, CoreWeave, Oracle, SB Energy, SoftBank 등으로 포트폴리오를 확장했습니다. 각 파트너는 클라우드 인프라, 가속 컴퓨팅, 저지연 추론, 데이터센터 개발, 에너지 공급 등 서로 다른 강점을 제공합니다. OpenAI는 성능이 중요한 곳에서는 프리미엄 시스템을 사용하고, 규모와 비용이 중요한 곳에서는 효율성을 우선시하며, 적절한 통합으로 시스템 전체를 개선할 수 있을 때는 자체 개발을 추진합니다."}, {"h": "데이터센터 설계와 Project Camellia의 의의", "ko": "OpenAI는 데이터센터도 전략적 지렛대로 활용합니다. 조지아주의 Project Camellia는 고객 워크로드에 맞춰 설계된 시설로, 지역 일자리 창출, 사업 지원, 폐쇄형 수계를 통한 절수, 독립 감시기관의 연간 감시까지 통합적으로 구현합니다. 이는 OpenAI가 단순히 성능만이 아니라 지역 사회와 환경, 투명성까지 고려한 인프라 전략을 펼치고 있음을 보여줍니다."}, {"h": "시스템 가치의 척도: 단위 연산당 지능", "ko": "OpenAI는 전체 시스템의 가치를 「단위 연산당 더 유용한 지능」으로 측정합니다. 더 나은 모델은 같은 결과에 더 적은 시도로 도달하고, 영리한 라우팅과 맥락 관리는 낭비를 줄이며, 최적화된 소프트웨어와 특화된 하드웨어는 속도와 에너지 효율을 높입니다. 예를 들어 GPT-5.6 Sol with max reasoning은 경쟁 모델보다 54% 적은 출력 토큰으로 높은 점수를 달성했으며, 이는 고객에게 더 빠른 결과, 더 의존할 수 있는 제품, 더 낮은 재시도율, 더 완성된 에이전트 워크플로우를 의미합니다."}, {"h": "효율 증가와 경제적 실용성의 확대", "ko": "지능이 더 강력해지고 저렴해질수록 더 많은 업무가 경제적으로 실행 가능해집니다. 회사들은 모든 고객에게 맞춤 분석을 제공하고, 모든 계약을 검토하고, 실시간 재무 시뮬레이션을 실행하고, 엔지니어가 더 많은 아이디어를 시험할 수 있게 됩니다. 이것이 제번스 역설입니다: 효율이 증가하면 더 많은 용도가 경제적으로 실질적이 되어 소비를 확대시키고 더 많은 완료된 업무, 더 나은 의사결정, 더 많은 출시 제품, 더 많은 수익 창출을 통해 새로운 경제 활동을 생성합니다."}, {"h": "OpenAI의 복합 성장 선순환", "ko": "OpenAI는 더 생산적인 연산과 더욱 경쟁적인 공급처를 통해 더 많은 고객을 더 낮은 비용으로 서빙할 수 있으며, 이 효율성 이득을 사용자에게 전달합니다. 성장은 연구, 인프라, 안전에 대한 계속된 투자를 자금 조달하고, 더 나은 기술이 더 나은 경제성을 만들고, 더 나은 경제성이 다음 진보의 물결을 자금 조달하며, 모든 이득이 전체 시스템을 더욱 강하게 만드는 구조를 형성합니다. 이것이 OpenAI의 복합 경쟁우위의 본질입니다."}], "caveat": "본 글은 OpenAI CFO의 기업 전략 설명이므로, 경쟁사 대비 기술적 우위나 시장 점유 확대 등의 주장이 회사의 관점에서 표현되었다는 점을 고려하여 읽기 바랍니다."}, {"id": "198147ad1e6e", "date": "2026-08-26", "title": "Apple introduces M6 and M5 Ultra", "ko_title": "애플 M6·M5 Ultra 칩 공개: 2nm 공정과 쿼드다이 아키텍처로 AI 성능 비약", "source": "Hacker News 300+", "url": "https://www.apple.com/newsroom/2026/08/apple-introduces-m6-and-m5-ultra-for-a-big-leap-in-performance-and-ai-compute/", "sections": [{"h": "M6와 M5 Ultra의 위치 정의", "ko": "애플이 신형 Mac mini에 탑재할 M6와 신형 Mac Studio에 탑재할 M5 Ultra를 공식 발표했다. M6는 애플의 첫 2나노미터 공정 칩으로, 일반 사용자부터 개발자·AI 애호가·기업까지 폭넓은 고객층을 대상으로 한다. M5 Ultra는 M 시리즈 역사상 처음으로 4개 다이를 연결한 쿼드다이 아키텍처를 채용하여 프로 워크플로우와 대규모 AI 모델 운영에 최적화되었다."}, {"h": "M6의 공정 기술과 신경망 엔진 강화", "ko": "M6는 2나노미터 공정으로 더 높은 트랜지스터 밀도를 달성하여 성능과 전력 효율을 동시에 개선했다. 특히 새로운 듀얼 16코어 신경 엔진은 이전 세대 대비 최대 2배의 피크 컴퓨트 성능을 제공하며, 온디바이스 AI 워크플로우 속도를 크게 높인다. 시스템 프레임워크가 두 엔진을 동시에 활용할 수 있어 애플리케이션들이 더 빠른 모델 실행을 경험할 수 있다."}, {"h": "M6 CPU: 12코어 구조로 멀티스레드 성능 1.2배 향상", "ko": "M6의 CPU는 M5 대비 2개 코어 추가되어 총 12개(슈퍼 2개, 퍼포먼스 4개, 이피션시 6개)로 구성되었다. M5 대비 단일 스레드 성능은 세계 최고 수준이며 멀티스레드는 1.2배, M1 대비 2.4배 빨라졌다. 슈퍼 코어가 단일 스레드 작업을 담당하고, 퍼포먼스 코어는 적은 전력으로 병렬 작업을 지원하며, 이피션시 코어는 백그라운드 작업을 처리하는 방식으로 산업 최고 수준의 와트당 성능을 구현한다."}, {"h": "M6 GPU: 12코어로 AI 연산 30% 향상, 게이밍 성능 강화", "ko": "M6의 12코어 GPU(M5 대비 2개 증가)는 각 코어에 신경 가속기를 탑재하여 AI 연산에서 M5 대비 30%, M1 대비 8배 이상의 피크 컴퓨트를 제공한다. 온디바이스 LLM과의 상호작용 시 프롬프트 처리 속도가 크게 향상되며, 기하학적 처리율 50% 증가와 동적 캐싱 업데이트를 통해 고사양 게임에서도 부드러운 프레임레이트와 생생한 그래픽을 구현한다."}, {"h": "M6 메모리: 32GB 통합 메모리와 1.7배 대역폭 증대", "ko": "M6는 최대 32GB 통합 메모리를 지원하여 복잡한 멀티태스킹과 온디바이스 LLM 실행이 가능하다. 메모리 대역폭은 170GB/s(M5 대비 10%, M1 대비 2.5배)로 확대되어 대용량 데이터 작업과 복잡한 개발 환경에서의 병렬 컴파일·파일 인덱싱 등을 빠르게 처리할 수 있다."}, {"h": "M5 Ultra의 쿼드다이 혁신과 UltraFusion 기술", "ko": "M5 Ultra는 UltraFusion 기술로 M5 Max 듀얼다이 칩 2개를 연결하여 M 시리즈 첫 쿼드다이 구조를 실현했다. 다이 간 대역폭을 4.4TB/s 이상으로 높이고 연결 밀도를 6배 강화하여 4개 다이가 하나의 통합 프로세서처럼 동작한다. 이는 매우 낮은 지연시간과 높은 대역폭 상호연결을 통해 구현된다."}, {"h": "M5 Ultra CPU·GPU: 엄청난 병렬 처리 능력", "ko": "M5 Ultra는 최대 36코어 CPU(슈퍼 12개, 퍼포먼스 24개)로 M3 Ultra 대비 단일 스레드 1.25배, 멀티스레드 1.3배 성능을 제공한다. GPU는 최대 80코어에 신경 가속기를 탑재하여 M3 Ultra 대비 AI 연산 4.5배, M1 Ultra 대비 6배 이상의 피크 컴퓨트를 달성한다. 두 번째 세대 동적 캐싱·메시 셰이딩·3세대 레이트레이싱으로 M3 Ultra 대비 40% 빠른 그래픽 성능을 제공한다."}, {"h": "M5 Ultra 메모리: 512GB 통합 메모리와 1.2TB/s 대역폭", "ko": "M5 Ultra는 최대 512GB의 대규모 통합 메모리와 1.2TB/s의 메모리 대역폭(M3 Ultra 대비 50% 증가)을 제공한다. 이를 통해 대규모 데이터셋을 온디바이스에 완전히 적재하고 토큰 초당 처리 속도를 높이며 수천억 개 파라미터의 대형 LLM을 완전히 로컬에서 운영할 수 있다. 고성능 미디어 엔진(H.264·HEVC·ProRes 인코딩·디코딩, AV1 디코딩)도 고해상도 비디오 편집에 최적화되어 있다."}, {"h": "개발자 도구와 온디바이스 AI 프레임워크 통합", "ko": "애플의 Core AI, Core ML, Metal, Xcode 등 개발 프레임워크가 M6의 듀얼 16코어 신경 엔진과 M5 Ultra의 512GB 메모리·1.2TB/s 대역폭을 직접 활용할 수 있도록 설계되었다. 개발자는 대형 AI 모델을 로컬에서 학습하고 미세 조정할 수 있으며, 프레임워크가 CPU·GPU·신경 엔진 전체에서 성능을 자동 최적화한다. 애플 자체 기초 모델, Apple Intelligence 기능, 또는 독점 AI 모델을 활용하여 완전히 온디바이스에서 강력한 AI 워크로드를 구축·실행할 수 있다."}], "caveat": "이 발표문은 애플의 공식 보도자료로, 제조사가 주장하는 성능 지표(1.2배, 2.4배 등)에 대한 독립적 검증이 아직 없으므로 실제 사용 환경에서의 성능은 별도 테스트가 필요하다."}, {"id": "d6b60cf6031d", "date": "2026-08-26", "title": "Dolly Parton has died", "ko_title": "컨트리 뮤직 전설 돌리 파튼, 80세로 별세", "source": "Hacker News 300+", "url": "https://www.theguardian.com/music/2026/aug/25/dolly-parton-country-singer-dead", "sections": [{"h": "음악 전설의 부고 및 삶의 궤적", "ko": "미국 컨트리 뮤직의 거장이자 배우, 자선사업가 돌리 파튼이 80세의 나이로 암으로 인한 별세를 맞이했다. 파튼의 조카 브라이언 시버가 인스타그램을 통해 사망 소식을 전했으며, 공식 성명에서 파튼은 「암과의 짧은 투병 끝에 용감하게 세상을 떠났다」고 밝혔다. 파튼은 낙관주의와 별이 되려는 어린 꿈으로 자신의 인생을 주도한 인물로, 그 바탕에는 테네시주의 작은 통나무집에서 시작한 가난한 어린 시절이 있었다."}, {"h": "작곡·노래 활동의 정점", "ko": "파튼은 조엘린, 아이 윌 올웨이즈 러브 유, 나인 투 파이브 등 20세기 최고의 노래들을 작곡한 뛰어난 싱어송라이터였다. 그의 노래는 생생한 스토리텔링, 감정의 깊이, 선율의 강함으로 특징 지어졌으며, 미국 컨트리 차트 1위곡 25곡, 앨범 47장이 톱10에 오르는 기록을 세웠다. 1980년 나인 투 파이브로 팝 차트 1위를 기록하며 대중음악으로도 영역을 확장했고, 휘트니 휴스턴이 보디가드 사운드트랙으로 재녹음한 아이 윌 올웨이즈 러브 유는 지금까지 여성 가수의 베스트셀링 싱글로 약 2천만 장이 팔렸다."}, {"h": "배우로서의 경력과 다재다능한 활동", "ko": "파튼은 음악뿐 아니라 영화배우로도 활약했으며, 나인 투 파이브, 텍사스 최고의 작은 창녀집, 라이너스톤, 강철 목련 등 여러 영화에 출연해 골든글로브상에 두 차례 노미네이트됐다. 1987년 엠미루 해리스, 린다 론슈타트와 함께한 트리오 앨범은 그래미 올해의 앨범상 유일한 노미네이션을 받았고, 이후에도 타미 와이넷, 로레타 린 등과의 협업을 통해 컨트리 음악의 위상을 높였다. 1980년대와 1990년대 활발한 연기 활동 외에도, 그는 자신의 화려한 외모와 기지 넘치는 말투로 대중 문화의 아이콘으로 자리 잡았다."}, {"h": "사업가로서의 성공과 기업 확장", "ko": "파튼은 음악과 배우 활동만이 아니라 영리한 사업가이기도 했다. 전 매니저 샌디 갤린과 함께 영화·텔레비전 제작사 샌달라를 설립해 버피 더 뱀파이어 슬레이어와 미스 콩게니얼리티 같은 히트작을 제작했다. 1986년에는 테네시주 실버달러 시티에 지분을 투자해 돌리우드로 이름을 바꾼 후 규모를 두 배로 늘렸고, 이후 돌리우드 브랜드의 스파, 펜션 단지, 극장 레스토랑, 워터파크 등을 개설하며 관광산업을 확장했다."}, {"h": "문해력 교육에 집중한 자선 활동", "ko": "파튼은 1988년 돌리우드 재단을 설립해 대학 장학금 수여와 고등학교 중퇴 방지 사업으로 시작했다. 1995년 시작한 상상의 도서관 프로젝트는 다섯 살까지 매달 나이대별 도서를 모든 아이에게 배송하는 사업으로, 전국 규모로 확대되었고 2006년부터는 국제적으로 확장되어 현재 미국, 캐나다, 호주, 영국, 아일랜드에서 연간 약 2천5백만 권을 배포하고 있다. 파튼은 「아버지가 글을 읽고 쓸 수 없어 얼마나 힘들어했는지 봤다」며 자신의 활동 동기를 설명했으며, 2022년 제프 베이조스가 재단에 1억 달러를 기부하는 등 거액의 투자를 받았다."}, {"h": "보건·사회정의 분야의 선행", "ko": "파튼의 자선활동은 문해력 교육을 넘어 다양한 사회 문제에 미쳤다. 2003년 독수리 보호 기금을 설립했고, 조카의 백혈병 치료를 받은 밴더빌트 대학 의료센터에 기부해 2020년 코로나 백신 연구에 1백만 달러를 후원해 결국 모더나 백신 개발의 기초가 되었다. 2006년 세비어 카운티 병원 개원에 50만 달러를 기부했고, 2016년 스모키산 산불 피해자를 위한 구호 활동을 조직했으며, HIV/에이즈 자선 음반 제작에 참여했다. 또한 흑인평등운동과 트랜스젠더 권리를 지지하며 북캐롤라이나 화장실법 제정에 반대하는 목소리를 냈다."}, {"h": "50년 결혼생활과 마지막 시기", "ko": "파튼은 1966년 칼 딘과 결혼해 거의 60년을 함께한 남편을 2025년에 잃었으며, 결혼 50주년을 맞아 2016년 재혼식을 올렸다. 2026년 5월 건강상 문제로 라스베이거스 공연을 취소했고, 2023년 록스타 앨범을 발표하며 음악 활동을 계속하다가 결국 별세했다. 동시에 브로드웨이 뮤지컬 공연이 예정되어 있었으며, 파튼의 유산은 음악, 영화, 자선사업 전 영역에서 지워지지 않는 족적을 남겼다."}], "caveat": "본 기사는 부고 기사로 개인적 삶과 업적을 정리하는 글이며, UNIVERTRIX의 'AI 시대 대비' 선별 방침과는 직접적 연관이 없으므로 컨텍스트상 참고용으로만 고려되어야 한다."}, {"id": "a10515ed86a4", "date": "2026-08-25", "title": "How Europe is killing makers and micro-entrepreneurs", "ko_title": "EU 포장 규제가 메이커와 소규모 창업자 생태계를 위협하는 방식", "source": "Hacker News 300+", "url": "https://lectronz.com/u/lectronz/articles/how-europe-is-killing-makers-and-micro-entrepreneurs", "sections": [{"h": "Lectronz 플랫폼의 정체성과 역할", "ko": "렉트로니즈는 오픈소스 하드웨어 메이커와 DIY 전자제품 창작자들을 위한 마켓플레이스입니다. 플랫폼의 판매자 대부분은 대규모 공장이나 자금력 있는 스타트업이 아니라 여유 공간, 차고, 작은 작업실에서 활동하는 엔지니어, 독립 설계자, 하드웨어 애호가들입니다. 일부는 자신의 제품으로 생계를 유지하지만 매년 소량만 판매하거나 단순히 유용한 것을 만들어 커뮤니티와 공유하려는 사람도 있습니다. 이런 소규모 실험 중 일부가 실제 사업으로 성장하며, 많은 성공적인 기업들도 처음엔 이런 작은 규모에서 시작했습니다."}, {"h": "EU 포장 규제의 등장과 기본 취지", "ko": "EU의 새로운 포장 및 포장폐기물 규정(PPWR)은 2026년 8월 12일부터 적용되며, 확대생산자책임(EPR) 제도를 통해 포장 폐기물을 줄이고 규칙을 통일하려는 목표를 가집니다. EPR의 기본 원리는 시장에 포장을 투입하는 기업이 수거와 재활용 비용을 분담해야 한다는 합리적 개념입니다. 메이커들 입장에서도 제품 배송에 사용된 상자, 봉투, 플라스틱 백 등에 책임을 지는 것 자체는 수용할 수 있는 아이디어입니다."}, {"h": "파편화된 규제 구조의 문제점", "ko": "하지만 PPWR은 단일한 유럽 시스템을 만들지 않고 기존의 각국 단위 규제 체계를 유지합니다. EU 전역 고객에게 직접 판매하는 사업자는 포장폐기물이 발생하는 모든 회원국에서 별도로 등록하고 의무를 이행해야 합니다. 대규모 기업에겐 사업비용의 일부일 뿐이지만, 각국별 소량 판매 마이크로비즈니스에겐 실제 포장 무게에 비해 행정 부담과 비용이 극도로 불균형합니다."}, {"h": "그리스 엔지니어의 사례를 통한 구체적 계산", "ko": "25유로짜리 오픈소스 센서 보드를 설계한 그리스 엔지니어가 첫해에 독일 5개, 프랑스 2개, 오스트리아 2개, 벨기에 1개를 판매한다면, 정전기 방지 백과 쿠션 봉투로 각 제품당 약 50그램의 포장을 사용하게 됩니다. 이 엔지니어는 네 개국의 포장폐기물 생산자가 되었고, 각국의 현재 수수료와 규제 준수 비용을 합산하면 프랑스 110유로 등록료와 190~300유로 인증 대리인 비용, 벨기에 50~100유로와 250~450유로 대리인 비용, 독일 약 200유로, 오스트리아 250유로와 약 100유로 대리인 비용이 들어 연간 1150유로에 달합니다. 실제 반 킬로그램의 포장에 대한 환경 기여도는 수십 센트 수준이지만, 이를 추적하는 행정 비용은 수천 유로에 달한다는 역설이 발생합니다."}, {"h": "전 회원국 판매 시 규모의 경제학적 비현실성", "ko": "만약 그리스 엔지니어가 27개 회원국 모두에 판매하려 한다면 채산성을 맞추기 위해 첫해부터 수천 개를 판매해야 합니다. 혁신은 종종 큰 기업이 아니라 적은 자본으로 시작한 소규모 사업에서 나오며, 성공한 많은 기업들도 10개, 100개, 1000개 판매 규모를 점진적으로 거쳐 성장했습니다. 렉트로니즈의 경우 지난해 일부 판매자는 수백 개 상품을 팔았지만 절반 이상이 10개 미만의 주문을 받았으며, 이는 창작자들이 자유롭게 아이디어를 실험하는 마켓플레이스의 본질입니다. 심지어 실패한 제품도 커뮤니티와 공유될 때 다른 창작자의 성장을 도우며 연쇄적 혁신을 촉발합니다."}, {"h": "규제가 초래할 생태계 축소와 정책의 모순", "ko": "이 EPR 규제는 EU의 혁신 공간 자체를 위협합니다. EU 정책입안자들은 유럽의 혁신 부족을 경고하면서도 마이크로기업과 중소기업에 불균형한 진입장벽을 만드는 규제로 혁신 발현을 어렵게 하고 있으며, 이는 아마존, 테무, 이베이 같은 대형 플레이어만 존속할 수 있는 환경을 조성합니다. 렉트로니즈는 거래의 5%를 수수료로 받지만 초기 5건은 면제하며, 다년간의 노력 끝에 2026년 새 판매자 급증으로 겨우 한 명 월급 정도를 벌 수 있게 되었습니다. 저자는 이를 다음 아마존이 되기 위해 만든 게 아니라 독립 하드웨어 창작자들을 위해 설계한 마켓플레이스로 구축했으나, 규제가 많은 판매자를 유럽시장에서 몰아낼 경우 렉트로니즈 자체도 지속 불가능해질 수 있다는 우려를 드러냅니다."}, {"h": "역설적 대응: EU 판매보다 미국 판매가 유리한 상황", "ko": "규제가 엄격히 적용될 경우 메이커의 단기 대응책은 간단합니다. EU 판매를 중단하고 비EU 시장, 특히 미국으로만 판매하는 것이 더 경제적입니다. 프랑스 마이크로기업자에게 미국으로 배송하는 것이 인접한 독일이나 벨기에로 배송하는 것보다 합리적이 된다는 것은 역설입니다. 미국 관세가 있어도 이 수학식은 변하지 않습니다. 물론 미국 한정 판매는 모든 판매자에게 실행 가능한 해법이 아니며, 유럽 경제 자체에도 손실입니다."}, {"h": "제안된 해결책 세 가지", "ko": "저자는 실현 가능한 세 가지 해결책을 제시합니다. 첫째, 일정 폐기물 규모 또는 연 매출 미만의 소규모 판매자와 마이크로기업을 국경 간 포장 의무에서 면제하는 기준을 설정하는 것입니다. 둘째, 판매자들이 한 곳에서 등록·보고·결제할 수 있는 중앙화된 EU 포털을 만드는 것으로, 이는 기존 부가가치세의 원스톱숍(OSS) 메커니즘과 유사하며 2026년 현재 근대적 오픈 API와 오픈소스 소프트웨어로 최대 자동화할 수 있습니다. 셋째, 렉트로니즈나 틴디 같은 마켓플레이스가 마이크로기업 집합을 단일 생산자로 등록하고 일괄 관리하도록 허용하되, 공통 API 표준으로 자동화를 돕는 방식입니다."}, {"h": "영향의 범위와 정책 반응의 시급성", "ko": "이 규제는 메이커뿐 아니라 온라인으로 창작물을 판매하는 예술가, EU 전역으로 수출하는 지역 전통 식품 생산자, 에츠 같은 플랫폼에서 일하는 공예가 등 수십만 명의 EU 마이크로비즈니스 생계에 영향을 미칩니다. 또한 EU 내 사업자뿐 아니라 EU 구매자에게 판매하는 모든 사업자를 규제합니다. 슬로바키아 예술가 제아네타 코나르치코바는 온라인 청원을 시작했으며, EU 집행위원회도 이 문제에 대한 공개 피드백 페이지를 운영 중입니다. EU 집행위는 2035년까지 인증 대리인 요건을 유예하는 방안을 제시했으나 아직 채택되지 않았으며, 이 결정이 투표·발효될 때까지 많은 소규모 사업이 폐업할 수 있습니다."}, {"h": "유럽 통합의 근본적 질문", "ko": "인증 대리인 요건 제거도 문제의 일부만 해결할 뿐이며, 이 같은 규제는 유럽 프로젝트 자체에 대한 신뢰를 훼손합니다. 단일시장이 마이크로기업에게 더 이상 작동하지 않는다면 EU의 존재 의의가 무엇인가 하는 질문을 던집니다. 렉트로니즈는 계속 전진하며 최선을 바라고 있으나, 정책입안자들이 이 문제의 긴급성을 이해하도록 지금 목소리를 높여야 한다고 호소합니다."}], "caveat": "이 글은 렉트로니즈 운영자의 관점으로 작성되었으므로, 규제 의도(폐기물 감소·순환경제)와 현실 적용 간 타협점에 대한 정부·환경 단체의 입장은 포함되지 않았습니다."}, {"id": "e19de7deb30d", "date": "2026-08-22", "title": "Kagi added a setting for removing paywalled links from search results", "ko_title": "검색엔진 Kagi, 페이월 링크 제외 옵션 추가…AI 시대 정보 접근성 재편", "source": "Hacker News 300+", "url": "https://kagi.com/changelog#11296", "sections": [{"h": "주식 위젯 개선과 페이월 제외 기능 추가", "ko": "Kagi는 8월 21일 스톡 위젯을 재설계했는데, 개별 주식뿐 아니라 상장지수펀드(ETF) 정보도 표시하고 시간대별 가격 차트에 애니메이션을 추가해 변동성을 직관적으로 파악할 수 있게 했다. 이와 함께 사용자가 검색 결과에서 유료 기사(페이월) 링크를 자동으로 제외하는 설정을 추가했다. 이 기능은 뉴스 산업에서 페이월 모델이 확산하는 가운데 사용자 선택권을 강화하는 움직임으로 읽힌다."}, {"h": "Assistant 채팅 기능 다각화와 스레드 관리 강화", "ko": "Assistant의 메시지 렌더링이 링크, 마크다운, 라텍스를 지원하도록 개선되었다. 사용자는 모든 스레드를 검색하고 최신순 또는 알파벳순으로 정렬할 수 있으며, '/' 명령어로 폴더별 필터링도 가능해졌다. 임시 스레드의 보관 기간을 24시간, 7일, 30일 중 선택할 수 있는 옵션도 추가되었고, 대시보드 설정 UI는 더 간결하게 개선되었다."}, {"h": "검색 기능 세부 개선과 API 안정성 버그 수정", "ko": "렌즈 기반 검색 페이지의 직접 URL이 숫자 대신 이름을 사용하도록 변경되어 가독성이 높아졌다. 키보드 단축키가 수정 키와 함께 눌렸을 때는 트리거되지 않도록 했다. 동시에 상류 연결 오류, 페이지 타임아웃 시 배치 데이터 손실, 통화 변환 위젯의 공식 명칭 미처리 등 기술적 버그들을 개별적으로 해결했다."}, {"h": "모바일 Assistant 앱 출시와 사용자 피드백 체계 정비", "ko": "Kagi는 iOS와 안드로이드용 네이티브 Assistant 앱을 출시해 사용자가 휴대폰에서 질문, 웹 탐색, 파일 작업, 심층 연구를 수행할 수 있게 했다. 모바일 앱의 첫 단계라며 향후 개선을 예고했다. Assistant 메시지 위에 마우스를 올려 썸스다운 버튼으로 피드백 양식을 열 수 있게 했고, 보고된 내용은 30일 후 자동 삭제된다는 투명성 정책을 명시했다. 설정에서 전체 스레드 내보내기 및 일괄 삭제 기능도 추가했다."}, {"h": "AI 기능 완전 비활성화 옵션과 사용자 통제 강화", "ko": "7월 30일 발표에서 Kagi는 검색 결과 페이지 UI를 개선해 필터, 도메인 옵션, 메뉴들의 접근성과 명확성을 높였다. 다음 단계로 환율 변환 위젯을 추가하여 여행 계획이나 해외 쇼핑 시 사용자 편의를 높였다. 동시에 「AI 기능이 필요할 때만 있고, 필요 없을 때는 없어야 한다」는 철학 아래 설정/AI에서 AI 기능 접근을 완전히 비활성화할 수 있는 옵션을 추가했다. Kagi는 이 결정이 AI에 계속 투자하는 와중에도 사용자 통제권을 우선시한다는 신호라고 설명했다."}, {"h": "주사위 위젯 기능 확장과 검색 위젯 커스터마이징", "ko": "사용자 요청에 응해 주사위 위젯이 면의 개수를 자유롭게 설정할 수 있도록 개선되었고, 동전 던지기 기능도 추가되었다. 사용자가 원치 않는 위젯을 개별적으로 끌 수 있는 전환 스위치를 settings/more_search에 배치했으며, 각 토글에는 해당 위젯의 기능을 설명하는 링크를 포함시켜 이용자가 정보에 입각한 선택을 할 수 있도록 했다."}, {"h": "Orion 브라우저 1.1 메이저 업데이트와 컨테이너 기능", "ko": "Orion은 macOS용 1.1 버전을 출시했는데, 이는 역사상 가장 중요한 업데이트로 평가되며 170개 이상의 개선사항을 포함한다. Apple의 LiquidGlass와 달리 Orion은 컨테이너 기능을 도입했는데, 각 탭이 완전히 격리되어 같은 창에서 여러 계정으로 동일 사이트에 로그인할 수 있다. 투명 테두리, 단색, 그래디언트, 자동 색상 매칭 등 다양한 테두리 스타일을 제공하며, 사용자가 Apple의 디자인 언어에 맞춘 옵션을 선택할 수 있도록 했다. Orion은 무료이지만 사용자 데이터를 광고주에게 팔지 않는 독립성을 보장하는 지원 계획을 제공한다."}, {"h": "Kagi News/Translate 무료 서비스 일시 중단과 구독 전환", "ko": "Kagi News와 Kagi Translate는 예상을 뛰어넘는 성공으로 전 세계 사용자들이 자신의 언어로 스트레스 없이 뉴스를 읽고 주제를 추가할 수 있다는 점, 문맥 기반의 고품질 번역이라는 점에서 호평받았다. 그러나 이런 인기로 인해 무료 서비스의 운영 비용이 대폭 증가하자, Kagi는 일시적으로 번역 기능을 제거하고 원어와 영어만 남겨두었다. Kagi Translate는 향후 구독 기반 서비스로 전환하겠다고 공시했다."}, {"h": "각종 버그 수정과 기능 개선 (다중 이슈 통합)", "ko": "6월 16일 발표 이후 Kagi는 스포츠 스코어 위젯과 주사위 굴리기 기능을 추가해 검색 위젯 개선 작업을 시작했다. 스포츠 스코어는 검색 결과 옆 사이드바에 표시되어 경기일정, 실시간 점수, 최근 결과를 빠르게 확인할 수 있게 했다. 동시에 '@import' 검색 오류, 일부 렌즈 미작동, 안전 검색 온 상태에서 부적절한 결과 표시, 독일어 인터페이스에서 날씨 위젯 미작동 등 개별 이슈들을 해결했다."}], "caveat": "원문은 2026년 기준의 제품 업데이트 로그이므로, 현재 시점에서는 일부 기능의 상태가 변했을 수 있으며, Kagi의 구체적인 성능 개선이나 비용 절감 효과는 공개되지 않은 점을 고려해 읽어야 한다."}, {"id": "e2dc35a6be96", "date": "2026-08-21", "title": "AliExpress runs silent WebAudio fingerprinting that breaks Bluetooth multipoint", "ko_title": "알리익스프레스의 숨은 오디오 추적: 블루투스 멀티포인트를 방해하는 핑거프린팅 기술", "source": "Hacker News 300+", "url": "https://blog.laserphile.com/2026/08/aliexpress-webpage-keeping-multipoint.html", "sections": [{"h": "블루투스 멀티포인트 연결이 끊기는 이상 현상", "ko": "저자는 PC와 휴대폰에 동시 연결되는 블루투스 멀티포인트 헤드폰을 사용 중이었다. 정상적으로는 PC에서 오디오가 재생되면 휴대폰 오디오는 대기 상태지만, 알리익스프레스 페이지를 열면 휴대폰의 음악이 즉시 중단되었다. 탭을 닫으면 문제가 바로 해결되었고, 페이지 음소거나 브라우저·시스템 음소거는 효과가 없었다. 시각적으로 재생 중인 비디오나 음악이 없었으므로 관습적인 미디어 요소로는 원인을 파악할 수 없었다."}, {"h": "숨겨진 웹 오디오 컨텍스트 발견", "ko": "저자는 페이지가 로드된 후 몇 초 뒤에 문제가 발생한다는 점에 주목했다. 일반적인 미디어 요소 대신 웹 오디오 API를 감시하기로 결정했고, AudioContext 생성자를 래핑하여 오디오 처리 컨텍스트 생성을 추적했다. 알리익스프레스 홈페이지 로드 중에 두 개의 AudioContext 객체가 생성되었으며, 둘 다 running 상태로 전환되고 노드를 AudioContext.destination에 연결했다. 이 두 컨텍스트는 collina.js와 fireyejs.js라는 스크립트에서 비롯되었으며, 모두 알리바바의 브라우저 보안 및 악용 방지 도구(AWSC)로 보였다."}, {"h": "웹 오디오 핑거프린팅의 작동 원리", "ko": "두 스크립트는 심하게 난독화되어 있었지만, AI 분석으로 오디오 코드의 작동 방식을 파악할 수 있었다. 코드는 알려진 파형을 생성하고, 분석기로 브라우저의 오디오 처리를 거친 후 결과를 측정하며 주파수 데이터를 읽었다. 게인을 0으로 설정하여 사용자가 소리를 듣지 못하도록 했지만, 그래프는 여전히 시스템 오디오 대상에 연결되어 있었다. 최종 볼륨이 0이어도 그래프를 대상에 연결하면 브라우저가 적극적으로 처리하도록 강제했고, 저자의 경우 이것이 PC의 블루투스 오디오 경로를 활성 상태로 유지하여 멀티포인트 헤드폰이 휴대폰으로 깔끔하게 전환되지 못하게 방해했다."}, {"h": "포괄적인 브라우저·기기 지문 수집", "ko": "스크립트 묶음의 조사로 웹 오디오 테스트만이 아닌 광범위한 측정 기능을 발견했다. WebGL 렌더러 정보, 확장 기능, 셰이더 정밀도뿐만 아니라 결과를 직렬화하고 암호화하며 알리바바 원격 측정 서비스에 요청하고 fetch() 또는 sendBeacon()으로 데이터를 전송하는 코드가 있었다. 오디오 핑거프린팅은 브라우저 버전, 운영 체제, 오디오 라이브러리, 하드웨어의 미세한 차이가 동일한 신호에서 서로 다른 결과를 생성하기 때문에 작동한다. 이 기법은 단독으로는 기기를 고유하게 식별하기에 충분하지 않지만, 캔버스, WebGL, 하드웨어, 타이밍, 상호작용 데이터와 결합하면 훨씬 더 유용해진다."}, {"h": "알리익스프레스의 사용 목적 추정", "ko": "저자는 수집된 데이터가 서버에 도달한 후 어떻게 사용되는지 확인할 수 없었으며, 영구적인 기기 식별자로 쓰일 수도 있고 부정행위 또는 봇 탐지 점수의 한 입력값일 수도 있다고 추정했다. 알리익스프레스는 자동화되거나 의심스러운 클라이언트를 일반 쇼핑객과 구분하고, 사용자 브라우징 습관을 추적할 이유가 충분했다. 플랫폼은 계정 탈취, 가짜 계정, 자동 크롤링, 자동 구매, 결제 사기, 리뷰 조작, 쿠폰 악용 등과 싸워야 했고, 대부분의 대형 비즈니스처럼 사용자 행동 데이터를 마케팅에 활용했다. 쿠키는 삭제·복사·교체될 수 있어 신뢰할 수 없었으므로, 많은 독립적인 브라우저 측정으로 만들어진 핑거프린트가 더 조작하기 어려웠다."}, {"h": "부정행위 방지와 사용자 경험의 불일치", "ko": "상호작용 데이터는 브라우저가 사람인지 자동화 도구인지 판단하는 데도 도움이 될 수 있었으며, 알리익스프레스 관점에서는 부정행위를 줄이고 신뢰할 수 있는 고객을 CAPTCHA 없이 통과시킬 수 있었다. 그러나 저자는 쇼핑 홈페이지가 음성, 그래픽, WebRTC, 하드웨어, 모션 API 등을 몰래 가동하여 행동을 추적하는 것을 원하지 않았으며, 특히 음악을 차단하는 성가신 효과 때문에 더욱 그랬다. 저자가 이 문제에 주목하지 않았다면 알리익스프레스가 무엇을 하고 있는지 알아채지 못했을 것이다."}, {"h": "블로킹 규칙과 실제 효과", "ko": "저자는 두 가지 확인된 스크립트 계열을 차단하고 통제 캡처 중 AudioContext 객체나 대상 연결이 나타나지 않았는지 테스트했다. Firefox의 uBlock Origin 확장 프로그램을 사용하여 collina.js와 fireyejs.js 요청을 막는 맞춤형 규칙을 적용했고, 알리익스프레스 홈페이지는 계속 렌더링되었다. 이 규칙들은 의도적으로 좁게 설계되어 해당 두 스크립트 계열만 알리익스프레스에서 요청할 때만 차단했다. 저자는 미래에 이것이 작동하지 않을 수도 있다고 예상했다."}, {"h": "기술적 정당성과 실제 피해의 간극", "ko": "부정행위 방지 사용 사례는 이해할 수 있었지만, 이 구현에는 실제 문제가 있었다. 민감한 작업 전에 일반 쇼핑 홈페이지에서 실행되었고, 광범위한 기기 및 행동 측정을 수집했으며, 구현이 의도적으로 검사하기 어려웠고, 페이지가 라이브 오디오 처리 그래프를 시작했다는 가시적 표시가 없었다. 가장 중요하게는 실제 하드웨어 부작용이 발생했다. 침묵한 핑거프린팅 테스트가 블루투스 멀티포인트 전환에 방해했으면서도 브라우저의 음소거 기능은 무용지물이었다. 저자는 숨은 분석 또는 보안 기능이 오디오 경로를 강하게 장악하여 외부 기기 동작까지 바꿀 수 있다면 차단이 합당한 절충안이라고 봤다."}, {"h": "투명성 부재와 신뢰 문제", "ko": "저자는 알리익스프레스가 핑거프린트를 얼마나 오래 저장하거나 다른 알리바바 속성에 사용하는지 증명할 수 없었다. 클라이언트 코드는 광범위한 핑거프린팅 같은 측정이 수집되고 전송됨을 증명했지만, 서버 측 보관과 신원 연결은 브라우저에서 볼 수 없었다. 저자는 인터넷의 누구를 정말 신뢰할 수 있는지 의문을 제기했다."}, {"h": "결론: 문제 진단과 해결책", "ko": "알리익스프레스 홈페이지는 두 개의 실행 중인 웹 오디오 그래프를 알리바바의 난독화된 보안 스크립트에서 몰래 생성했다. 이 그래프는 광범위한 브라우저 핑거프린팅의 일부로 파형을 생성하고 분석했으며, 게인이 0인 노드를 통해 시스템 오디오 대상에 연결하여 사용자가 듣지 못하게 했다. 저자의 설정에서 이것은 PC의 블루투스 오디오 경로를 활성화 상태로 유지하여 멀티포인트 헤드폰이 휴대폰으로 돌아가지 못하게 방해했다. 탭 음소거는 기존 미디어 요소가 없어 작동하지 않았다. collina.js와 fireyejs.js를 위의 uBlock Origin 규칙으로 차단하면 숨겨진 오디오 컨텍스트 생성이 방지되어 알리익스프레스를 열람하면서도 음악을 방해받지 않고 들을 수 있었다."}], "caveat": "저자가 실험한 환경은 Firefox와 Chrome 일부 버전(다른 브라우저는 미검증)이며, 알리익스프레스의 의도와 데이터 사용 목적은 추정일 뿐 확실하지 않으므로 원문 링크와 Firefox 개발자 추가 분석을 함께 참고하여야 합니다."}, {"id": "af863cb3b215", "date": "2026-08-21", "title": "Patterns and problems in multiagent systems", "ko_title": "AI 에이전트 시스템의 협력과 붕괴 위험: 대규모 운영 환경의 숨은 문제들", "source": "Anthropic", "url": "https://www.anthropic.com/research/multiagent-systems", "sections": [{"h": "에이전트 시대의 도래와 제도의 불안정성", "ko": "AI 모델이 빠르게 진화하면서 에이전트들이 공유 코드베이스, 시장, 사회 시스템 같은 실제 환경에서 점점 더 많은 역할을 담당하게 되고 있다. 에이전트 간 상호작용이 대규모로 늘어나는 것은 이제 피할 수 없는 상황이다. 현재의 제도와 기관들은 인간의 감시 속도를 전제하고 인간에 의해 설계되었으므로, 에이전트의 속도와 효율성에 밀릴 가능성이 크다. 인간-AI 하이브리드 시스템도 생기겠지만, 속도나 비용에서 에이전트가 우월한 영역은 에이전트만의 영역으로 변할 수 있다. 문제는 에이전트 간 상호작용의 규모가 인간 간, 또는 인간-에이전트 간 상호작용을 능가하기 전에 그것이 잘 작동하기 위한 조건을 이해할 시간이 충분하지 않을 수 있다는 점이다."}, {"h": "에이전트의 능력과 취약점의 불균형", "ko": "에이전트는 인간과 본질적으로 다르다. 더 오래 작동하고, 방대한 정보를 즉시 파악하며, 어느 개인보다 광범위한 지식을 갖춘다. 그러나 동시에 거짓 정보 생성과 보상 해킹에 취약하며, 정렬(alignment) 분야의 진전에도 불구하고 복잡한 현실의 다중 에이전트 환경에서 에이전트의 행동이 어떻게 나타나는지 거의 알지 못한다. 더욱 중요한 것은 개별 에이전트 수준에서 무해해 보이는 행동 특성이 시스템 수준에서 축적되어 예기치 않은 전역적 실패를 초래할 수 있다는 점이다. Anthropic은 현재의 최첨단 모델에서 나타나는 행동 경향을 파악하고, 그것이 어떻게 예상치 못한 시스템 장애를 만드는지 보여줌으로써 이러한 위험을 완화하는 논의를 시작하려 한다."}, {"h": "진정한 다중 에이전트 시스템의 현 상태", "ko": "현재 진정한 의미의 다중 에이전트 시스템은 아직 초기 단계에 있다. 에이전트들은 도구 사용에 탁월했고, 다른 에이전트를 잘 정의된 입력(프롬프트)과 출력(응답, 산출물)을 가진 도구 호출로 취급할 수 있는 한 효율적으로 협력해왔다. 하지만 에이전트들이 현재 어려워하는 부분은 서로를 고유한 목표와 행동을 가진 오래 지속되는 동료로 대하는 것인데, 이 경우 명확한 위계질서가 없다. 자율 에이전트가 세상에 점점 더 널리 퍼지고 더욱 까다로운 환경에서 작동하게 되면서, 효과적인 조율 능력을 갖추는 것이 필수적이 되었다."}, {"h": "병렬화 가능한 문제에서의 에이전트 군집의 성과", "ko": "소프트웨어 취약점 탐지는 다중 에이전트 군집이 즉시 활용할 수 있는 문제의 좋은 예다. 기존 방식은 개별 에이전트를 개별 코드베이스(또는 파일/모듈)에 할당해 병렬로 취약점을 찾게 하는 것이다. Anthropic은 이와 다른 접근을 시도했는데, 45개의 에이전트 각각에 가상 머신과 협력을 위한 공유 포럼을 제공하고 동일한 프롬프트로 15개 오픈소스 프로젝트의 취약점을 찾게 했다. 에이전트들에게 서로의 발견을 동료 검토하게 하고, 별도의 중재 에이전트가 최종 판단을 내리도록 했다. 조율하는 군집은 2,700만 토큰 사용으로 266개 취약점을 찾았고, 독립적 병렬 에이전트는 650만 토큰으로 21개를 찾았다. 다만 군집이 찾은 취약점의 약 절반은 독립 에이전트가 탐색하도록 지정된 핵심 디렉터리 밖에 있었다. 핵심 디렉터리로 범위를 제한하면 두 방식의 효율성이 비슷해진다. 두 방식은 상호보완적이었는데, 공통으로 발견한 취약점은 12개에 불과했다. 군집 내 에이전트들은 자신들이 생각하기에 가장 효과적으로 취약점을 캘 수 있는 곳에 집중할 수 있었고, 도구를 스스로 개발해 특정 유형의 취약점 발견에 특화되었다."}, {"h": "상호 의존적 프로젝트에서의 조율 실패", "ko": "앞의 실험과 달리, 에이전트들이 서로의 작업에 직접 의존하게 되면 조율이 훨씬 어려워진다. 대규모 소프트웨어 엔지니어링 프로젝트는 진화 과정에서 복잡하고 동적인 상호의존성을 갖는다. 이를 테스트하기 위해 Anthropic은 여러 에이전트 군집에 12시간 동안 텍스트 기반 웹 게임을 개발하도록 지시했다. 각 에이전트는 가상 머신, 공유 포럼, 자체 호스팅 저장소에 접근할 수 있었고, 모델 세대와 에이전트 수를 달리했다. 세 가지 프롬프트 버전을 시도했는데(기본형, 구체적 역할 지정, CEO 위계 지정), 모두 유사한 결과를 낳았다. 모든 경우 결과 게임은 인간 속도로 작동하지 않았고, 인터페이스는 난해했으며, 학습 곡선이 가팔랐다. 현재 모델들은 이 영역에서 미각이 부족하며 인간의 상당한 지도가 필요하다."}, {"h": "모델 세대별 협력 방식의 극명한 차이", "ko": "최종 산출물의 품질은 일관되게 낮았지만, 테스트한 모델 세대들(Sonnet 4.6과 5, Opus 4.6과 4.8, Mythos Preview)은 놀라울 정도로 다른 방식으로 조율했다. 두 가지 주요 지표를 추적했다: 마스터 브랜치에 병합된 풀 리퀘스트(PR)의 비율, 그리고 에이전트 간 코드 공유 정도다. 초기 모델(Sonnet 4.6, Opus 4.6)은 조율이 매우 미흡했는데, PR 병합 비율이 매우 낮아 충돌이 많았고 결국 포기되었다. 더 최신 모델(Opus 4.8, Mythos Preview)은 이 문제를 해결했지만 거의 협력하지 않음으로써다. 각 에이전트가 파일에 대한 소유권을 높게 유지해 충돌을 줄였다. 오직 가장 최신 모델인 Sonnet 5만이 공유 자원에서 작업하면서도(코드 공유도 높음) 높은 PR 처리량을 유지했다."}, {"h": "저분산 현상과 시스템적 붕괴의 위험", "ko": "게임 개발 실험에서 보인 조율 부족은 인간의 조율 실패와 유사한 측면이 있지만, 에이전트 조율의 다른 실패 방식은 완전히 다르다. 에이전트는 개별적으로 '저분산'이다. 같은 상황에서 사람들은 훨씬 다양한 행동을 하겠지만, 에이전트들은 매우 유사한 행동을 한다. 맥락, 스캐폴딩, 기저 모델만 다를 뿐이다. 이 요소들이 같거나 유사하면 행동 공간이 매우 크더라도 에이전트들은 매우 유사하게 행동한다. 따라서 한 에이전트의 나쁜 결정이 많은 에이전트에 의해 반복될 가능성이 높고, 고립된 문제가 빠르게 시스템적 실패로 확대될 수 있다. 같은 모델로 만든 30개 에이전트 중 18개가 정확히 동일한 깃 브랜치명 'mvp-game-loop'를 만들었다. 에이전트들이 단편 소설을 창작하고 비평하는 실험에서도 여러 실행마다 다수의 에이전트가 'The Cartographer's Last Commission'이라는 제목을 붙였다."}, {"h": "동형성이 초래하는 위험의 사례들", "ko": "에이전트들이 뭔가 인상적인 것을 각각 만들도록 요청받았을 때, 절반 이상이 레이 트레이서나 자체 호스팅 컴파일러를 만들기로 결정했다. 서로 소통할 수 있었음에도 비슷한 프로젝트를 추진한 에이전트들은 비슷한 실패에 맞닥뜨렸다. 소통이 가능한 반복 죄수의 딜레마 게임에서도 모든 에이전트가 동일한 전략에 도달했고 동시에 배신해서 전체 보상을 망쳤다. 실제로 조율하는 에이전트들은 배경이 다르고 따라서 맥락도 다를 것이고, 모두 클로드일 필요도 없기 때문에 더 높은 분산을 보일 것이다. 하지만 많은 에이전트가 같은 상황에 직면할 때, 그들의 행동은 인간보다 훨씬 더 유사할 것으로 예상된다. 이것이 중요한 이유는, 모든 에이전트가 같은 배팅이나 위험-보상 트레이드오프를 선택하면 시스템은 갑작스러운 붕괴에 더 취약해진다는 점이다. 모든 에이전트가 자원 배분에 대해 유사한 결정을 내리면 급격한 자원 부족이 발생한다."}, {"h": "자원 관리에서의 동시성 문제", "ko": "에이전트들에게 대역폭이 제한된 시스템의 작업 큐를 관리하도록 요청한 실험이 이를 실증했다. 에이전트들이 조율할 다른 수단이 없을 때, 동시에 같은 방식으로 자원을 배분하려고 시도해 시스템 장애를 초래했다. 이는 멀티에이전트 시스템에서 저분산이 단순히 비효율 문제가 아니라 시스템 안정성을 위협하는 핵심 위험이라는 점을 보여준다."}], "caveat": "이 연구는 Anthropic의 자체 모델(Claude 계열)에 국한된 실험이며, 다른 제공자의 에이전트나 더 이질적인 에이전트 구성에서 결과가 일반화되는지 검증되지 않았습니다."}, {"id": "c992986a594f", "date": "2026-08-21", "title": "Aaron Swartz was prosecuted for scraping, while Meta does it without consequence", "ko_title": "AI 학습 데이터 수집의 이중 기준: Aaron Swartz 기소 vs Meta의 무관용", "source": "Hacker News 300+", "url": "https://blog.curiousquail.com/im-upset-again-about-a-co-creator-of-rss-being-prosecuted-for-something-meta-is-doing-with-little-consequence/", "sections": [{"h": "Aaron Swartz 사건: 과도한 법적 처벌", "ko": "RSS 프로토콜 공동 개발자 Aaron Swartz는 학술 논문 데이터베이스 JSTOR에서 약 70기가바이트의 학술논문을 다운로드한 혐의로 기소되었다. 당국은 그를 35년의 징역형, 100만 달러의 벌금, 자산 압류라는 극형에 처하려 했으며, 이러한 과도한 처벌의 압박 속에서 Swartz는 결국 극단적 선택을 하게 되었다. 저자는 이를 법 체계에 의한 실질적 '암살'로 표현하며 사회 전체의 도덕적 실패로 지적하고 있다."}, {"h": "Meta의 대규모 데이터 수집: 경미한 법적 책임", "ko": "대조적으로 Meta(구 Facebook)는 AI 모델 학습을 위해 약 80테라바이트 규모의 도서 데이터를 대량 수집했음에도 법적 결과는 미미하다. Meta는 향후 법원 소송에서 경미한 금전적 벌금 정도만 받을 가능성이 높으며, 그 사이에도 AI 모델로부터 계속 수익을 창출하고 있다. 이는 Swartz가 직면한 가혹한 처벌과 현격하게 대비된다."}, {"h": "두 사건의 근본적 목적 차이", "ko": "저자는 양자의 법적 처우 불균형을 단순한 규모 차이로만 봐서는 안 된다고 강조한다. Swartz의 행동은 지식의 보급과 학술 자료의 아카이빙을 목표로 했고, Meta의 수집은 독점적 상용 AI 모델 개발이라는 명백히 다른 목적에서 비롯되었다. 저자는 Meta의 기술이 「환경에 해를 끼치고」 CEO의 정신 건강을 해치면서 세계 최고 부자를 더욱 부자로 만드는 체계라고 비판한다."}, {"h": "저자의 개인적 분노와 행동주의적 입장", "ko": "저자는 직접 만나본 적 없는 Swartz를 대신해 분노하며, 이 감정을 어디로 표출할지 모를 정도로 깊은 좌절감을 드러낸다. 이러한 심정이 저자를 더욱 급진적인 입장으로 이동시키고 있음을 인정하고 있으며, 글의 결말에서는 풍자적으로 기술 억만장자들에 대한 근본적 변화 필요성을 암시한다."}], "caveat": "저자의 개인적 분노와 급진화된 관점이 강하게 드러나 있으므로, 두 사건의 법적·기술적 세부 사항은 원문의 출처 링크와 각 사건의 공식 기록을 통해 독립적으로 검증할 필요가 있습니다."}, {"id": "3d03f9d3b9ed", "date": "2026-08-20", "title": "A joke domain purchase turned in geopolitical warfare", "ko_title": "날씨풍선 추적 사이트가 군사 인프라 노출로 국제 분쟁에 휘말리다", "source": "Hacker News 300+", "url": "https://sprocketfox.io/xssfox/2026/08/19/sondehub-and-war/", "sections": [{"h": "취미로 시작된 기상풍선 추적 플랫폼", "ko": "저자는 2017년 호주의 아마추어 기상풍선 커뮤니티에 입문했고, 당시 멜버른과 애들레이드 지역의 라디오존데(기상풍선의 송신기) 추적 정보가 하브허브라는 웹사이트에만 올라왔다. 2018년 5월 라디오존데 데이터 필터링을 위한 도메인 하나를 장난삼아 등록한 것이 시작이었다. 초기에는 기존 사이트로 단순 리다이렉트하는 수준의 조크였으나, 기상풍선 발사 데이터를 점점 많이 수집하면서 플랫폼이 성장했다."}, {"h": "인프라 증설과 정부 기관의 데이터 요청", "ko": "2019년 기상풍선 추적 수요가 급증하면서 독립 플랫폼 구축이 필요해졌다. 이 과정에서 보험 청구, 라디오존데 낙하 추적 등을 이유로 정부 기관들이 데이터를 요청하기 시작했다. 역방향 예측 기술을 도입하여 풍선 발사 지점을 추적할 수 있게 되자, 저자는 의도하지 않게 군사 기지와 포병 진지 위치를 지도화하고 있었음을 깨달았다. 이에 정당한 요청이 있을 때만 발사 지점 정보를 삭제하는 정책을 수립했다."}, {"h": "풍선 추적 데이터의 군사적 활용 가능성 발견", "ko": "풍향 데이터는 날씨 예측뿐 아니라 포병 사거리 계산에도 쓰인다는 점을 깨달은 저자는 자신의 플랫폼이 군사 용도로 활용될 수 있음을 인식했다. 역방향 예측 시스템은 군사 함정까지 탐지했고, 우크라이나 전쟁 초기부터 관련 요청과 접근이 급증했다. 2023년 중국 정찰풍선 사건과 그 직후 미군 에임-9X 사이드와인더로 아마추어 풍선을 격추한 사건 이후 언론 노출이 늘어나면서 트래픽이 크게 증가했다."}, {"h": "API 대량 접근 공격과 우크라이나 군 추정 연락", "ko": "2024년 12월 예측 API에 대한 집중적인 접근 공격이 발생했는데, 단일 IP에서 비롯된 것으로 파악되었다. 저자는 우크라이나 군사 채팅 채널에 러시아어로 메시지를 보내 스크립트를 올바르게 실행하도록 협력을 요청했다. AWS는 지원하되 서비스 중단이나 차단으로 인한 피해를 최소화하도록 신중하게 대응했으며, 저자는 자체 예측 시스템 운영을 위한 도커 이미지를 공개했다. 이러한 조치는 해당 플랫폼이 실제 군사 작전에 이용되고 있다는 강한 시사를 담고 있다."}, {"h": "미 국방부의 데이터 요청과 대가 문제", "ko": "2025년 미 국방부 산하 국방정보보안실이 소네허브의 데이터를 요청했다. 저자는 처음에는 군사 지원을 꺼렸으나, 데이터가 이미 공개되어 있으므로 외부 기관이 활용할 바에는 인프라 유지비라도 받기로 방침을 바꿨다. 청구서를 제출했으나 국방부로부터 응답이나 결제가 없었으며, 저자는 해당 요청의 목적을 알 수 없었다. 이 사건은 공개 데이터가 국가 안보 문제로 전환되는 과정을 보여준다."}, {"h": "항공 안전 기관과 민간 협력", "ko": "2025년 9월 미국 국가교통안전위원회(NTSB)는 유타 지역의 특정 시간대 기상풍선 정보를 요청했고, 이후 윈드본 사의 상업용 풍선이 항공기와 충돌했을 가능성이 제기되었다. 소네허브가 제공한 데이터는 정확한 충돌 기체 파악에 도움이 되었으며, 윈드본은 시스템 개선 조치를 취했다. 또한 항공 관제탑 운영자들이 기상풍선과의 충돌 회피를 위해 사전 조율을 요청하는 등, 민간 항공 부문의 풍선 추적 필요성이 증대되었다."}, {"h": "GPS 간섭·스푸핑 탐지와 다양한 정부 기관 접촉", "ko": "소네허브는 의도하지 않게 광범위한 GPS 간섭과 스푸핑 활동을 탐지하고 있었다. 저자는 이러한 패턴이 목표 식별 용이성이나 특정 방식의 차량 충돌을 목적으로 할 수 있다고 추측했다. 시간이 지나면서 해군 항공전 센터, 공군 연구소, 국립해양대기청, 각종 기상 센터 등 미 정부의 여러 부처로부터 다양한 목적의 이메일과 문의가 들어왔으며, 저자는 이를 통해 자신의 취미 프로젝트가 얼마나 광범위한 이해관계자들에게 영향을 미치는지 인식하게 되었다."}, {"h": "장비 제조사의 전략적 비협조", "ko": "라디오존데 제조사 메테올라보르(Meteolabor AG)는 전략적 이유를 들어 호환성 검증을 위한 샘플 기기나 데이터 제공을 거부했다. 제조사는 자신의 송신기가 일정 시간 후 자동으로 종료되도록 설계되었음을 밝혔다. 이는 기술 스펙 공개가 가져올 보안 리스크를 우려한 조치로 해석되며, 민간 추적 플랫폼의 성장이 장비 제조 업계와 국방 부문 간의 이해 대립을 낳고 있음을 드러낸다."}], "caveat": "저자는 2024년 말부터의 사건을 회고록 형식으로 서술하고 있으며, 우크라이나 군 협력을 포함한 군사적 활용에 대해 추정과 시사(暗示)에 의존하고 있어 공식 확인이 필요합니다."}, {"id": "67636947efe0", "date": "2026-08-19", "title": "The Amazon tax", "ko_title": "아마존의 검색광고 시스템: 소비자에게 떠넘기는 숨은 비용", "source": "Hacker News 300+", "url": "https://seths.blog/2026/08/the-amazon-tax/", "sections": [{"h": "검색광고로 주당 10억 달러 수익하는 아마존", "ko": "저자는 아마존의 검색광고 수익 구조를 '법적 절도'라고 표현하며 그 규모를 지적합니다. 아마존은 매주 약 10억 달러의 광고 수익을 올리고 있으며, 이는 전 직원에게 3만 5천 달러씩 현금 보너스를 줄 수 있는 규모입니다. 이는 아마존이 광고 사업에서 얼마나 큰 이익을 창출하고 있는지를 보여주는 구체적인 수치 제시입니다."}, {"h": "광고는 검색을 악화시키는 메커니즘", "ko": "저자는 아마존 검색광고의 근본적인 문제를 분석합니다. 에어프라이어를 찾는 소비자의 경우, 아마존은 이미 가장 평가가 높고 반품률이 낮으며 가격이 가장 좋은 제품을 알고 있습니다. 광고의 목적은 소비자를 그 최고의 제품이 아닌 다른 제품으로 유도하는 것이므로, 결국 검색 결과를 왜곡하고 악화시킵니다. 이러한 구조 때문에 최고의 제품 판매자도 자신의 판매량을 지키기 위해 광고를 구매해야 하는 악순환이 생깁니다."}, {"h": "영점합 게임: 수요 창출이 아닌 파이 나누기", "ko": "전통적인 광고와 달리 검색광고는 시장 전체 수요를 증가시키지 않습니다. 특정 카테고리의 총 판매량은 고정되어 있고, 광고는 단지 판매자들 간의 점유율 경쟁만 일으킵니다. 심지어 한 연구는 검색광고가 있는 전자상거래 사이트가 광고가 없는 사이트보다 판매량이 더 적다고 주장합니다. 저자의 출판사가 테스트한 사례에서, '세스 고딘 결혼식 책'을 검색하는 소비자에게 광고를 보이는 데 클릭당 1달러를 지불하고 있습니다. 즉, 아마존은 이미 구매 의도가 있는 고객을 겨냥하는 광고를 판매자에게 팔고 있습니다."}, {"h": "광고 비용은 결국 소비자가 부담", "ko": "연 500억 달러 이상이 이러한 광고에 쓰이는데, 판매자들은 장기적으로 이 비용을 감당할 수 없습니다. 그 부담은 제품 가격 인상 또는 신제품 개발 의욕 저하라는 형태로 소비자에게 전가됩니다. 마케팅 효율성을 의도적으로 악화시키는 아마존의 광고 시스템은 결국 시장 전체의 효율성을 훼손합니다."}, {"h": "품질 저하와 검색 결과 왜곡의 악순환", "ko": "이 구조는 두 가지 부작용을 만듭니다. 첫째, 판매자들은 브랜드 평판보다 광고 예산이 중요해지자 저가의 품질 낮은 상품으로 전환하면서 광고 예산을 늘립니다. 둘째, 아마존과 같은 플랫폼은 유기 검색 결과를 의도적으로 악화시켜 판매자들이 더 많은 광고를 구매하도록 유인합니다. 이렇게 되면 플랫폼 자체가 검색 결과를 손상시키는 데 경제적 인센티브를 가지게 됩니다."}, {"h": "고객 중심성의 신화: 아마존의 변질", "ko": "과거 수십 년간 아마존은 상품 가격을 낮추고 유통망이 부족한 판매자들을 위해 문을 열어 소비자에게 실질적인 가치를 제공했습니다. 저자는 아마존이 이제 더 이상 「고객 중심」이라고 주장할 수 없다고 결론짓습니다. 자신들이 섬기겠다던 고객으로부터 조직적으로 가치를 추출하는 광고 시스템을 만들었기 때문입니다."}], "caveat": "저자는 확증 없는 추정(예: 광고가 유기 검색 결과에 장기 영향을 미친다는 '민간 속설')과 정책적 주장을 섞어 제시하므로, 경제학적 검증이 필요한 부분과 의견 부분을 구분하여 읽어야 합니다."}, {"id": "550006791bdd", "date": "2026-08-13", "title": "Tailscale Traces Database Corruption to 16y/o SQLite WAL-Reset Bug", "ko_title": "신뢰성 위기에서 16년 묵은 SQLite 버그 발굴까지: Tailscale의 데이터베이스 부패 사건", "source": "Hacker News 300+", "url": "https://tailscale.com/blog/sqlite-wal-reset-bug", "sections": [{"h": "안정성 위기의 시작과 심각성 인식", "ko": "Tailscale은 지난해 연말부터 서비스 가용성이 급격히 악화되었으며, 이는 상태 페이지에도 공개적으로 노출되었습니다. 여러 차례의 장애 대부분이 SQLite 데이터베이스 깊숙한 곳의 단 하나의 버그에서 비롯되었으며, 이를 추적하기 위해 수개월간의 집중적인 포렌식 작업이 필요했습니다. 회사는 고객에게 약속한 신뢰성 있는 서비스를 제공하지 못한 점을 명시적으로 인정하고, 발생 원인과 대응, 그리고 장기간 숨어있던 SQLite 버그의 발견 과정을 공개하기로 결정했습니다."}, {"h": "아키텍처: 단일 쓰기 설계와 SQLite 도입", "ko": "Tailscale의 제어 평면은 사용자 입장에서는 하나의 엔드포인트로 보이지만, 내부적으로는 여러 샤드(조정 서버)로 분산되어 있으며, 각 고객 네트워크(tailnet)는 한 번에 하나의 샤드에만 위치하면서도 다른 샤드로 유연하게 마이그레이션할 수 있습니다. 각 샤드는 해당 샤드의 모든 정보를 담은 SQLite 데이터베이스를 보유하고 있으며, 단 하나의 Go 프로세스가 배타적으로 접근하는 단일 쓰기 설계입니다. Tailscale은 2022년부터 SQLite를 주 데이터베이스로 채택했는데, 신뢰성 있고 널리 사용되는 기술이라는 이유에서였습니다."}, {"h": "백업 파이프라인과 첫 감지된 부패", "ko": "회사는 몇 분마다 데이터베이스의 완전한 스냅샷을 생성하여 S3 버킷에 업로드하는 백업 파이프라인을 운영했으며, 2023년 초부터 아무런 문제 없이 작동해왔습니다. 지난해 8월 이 S3 백업을 읽는 데이터 파이프라인에서 데이터베이스 오류를 보고했고, SQLite의 PRAGMA integrity_check 명령으로 실제 부패를 확인했습니다. 데이터베이스 부패는 이론상 가능하지만 정상 운영 중에는 매우 드문 현상입니다. 회사가 부패 데이터베이스를 복구하고 원인을 조사했지만, 명확한 답을 얻을 수 없었습니다."}, {"h": "반복되는 부패 사건과 영향 범위", "ko": "규모 있는 운영에서는 드문 사건도 빈번하게 발생할 수 있고, 실제로 6개월에 걸쳐 19건의 별도 부패 사건이 발생했습니다. 제어 평면이 다루는 것이 구성 데이터일 뿐이므로 부패로 인한 데이터 손실은 암호화 키나 네트워크 트래픽에 영향을 미치지 않았지만, 신규 장치 추가나 구성 변경이 지속되지 않는 문제가 생겼습니다. 부패가 발생할 때마다 데이터베이스를 복구하는 동안 영향받은 샤드의 제어 평면 전체가 중단되었으며, 초기에는 1시간 이상의 다운타임이 발생했습니다. 이 기간 중 새로 접속하는 장치는 통신할 수 없었고, 이미 연결된 장치들도 네트워크 변화를 감지할 수 없었으며, 웹 기반 관리 콘솔과 API 접근도 차단되었습니다."}, {"h": "신뢰성 저하와 조사의 어려움", "ko": "영향받은 고객이 소수라도 상태 페이지에 전체 장애로 공지되어, 실제 영향을 받지 않은 사용자들도 반복된 다운타임을 목격했고 신뢰가 동반하게 저하되었습니다. 초기부터 심각한 위협으로 인식한 회사는 막대한 엔지니어링 자원을 투입했으나 해결책을 찾기 어려웠습니다. 최근 변경사항을 검토해도 관련성이 없었고, 저수준 SQLite 상호작용 코드도 수년 전부터 안정적으로 작동해왔습니다. 부패 사건들 사이에 공통 요소를 찾을 수 없었으며, 특정 샤드, 고객, 네트워크 기능, 시간대, 부하 수준과도 무관했습니다. 재현 가능한 트리거 조건이 없어서 합성 환경에서의 버그 재현도 불가능했고, 결국 운영 환경에서 수동적인 포렌식 원격 측정을 배포하여 부패 현상을 직접 포착해야 했습니다."}, {"h": "예측 불가능한 발생 패턴과 전문가 지원", "ko": "부패 사건은 규칙적인 일정으로 발생하지 않아서, 때로는 몇 시간 간격이었고 때로는 몇 주 간격이었기 때문에 진행 상황을 예측하거나 추가 작업을 계획하기 어려웠습니다. 10월에서 12월 사이 6주간 부패 사건이 발생하지 않다가 크리스마스 무렵 다시 나타났습니다. 신속한 해결이 어렵다고 판단한 회사는 SQLite 개발자들과 전문 지원 계약을 체결했으며, 이는 탁월한 결정이었습니다. 이를 통해 심층적 전문성에 직접 접근할 수 있었고, 아키텍처와 장애에 대해 상세한 기술 논의를 나눌 수 있었습니다."}, {"h": "대응 조치와 우발적 발견", "ko": "Tailscale 엔지니어와 SQLite 핵심 개발자들은 깨진 POSIX 잠금, SQLite 메모리 오용, 멀티스레드 부정 사용 등 여러 이론을 맵핑했고, 매 장애 이후 더 많은 데이터를 수집하여 이론을 체계적으로 배제했습니다. 동시에 운영 중인 플랫폼을 유지하기 위해 자동화된 복구와 다운타임 최소화를 추진했으며, 특히 완전한 복구 없이 손실을 최소화하기 위해 트랜잭션 로깅 파이프라인을 구축했습니다. 이 파이프라인은 데이터베이스를 수정하는 모든 SQL 문을 별도 로그에 기록하여, SQLite의 직렬화 가능한 단일 쓰기 트랜잭션 특성을 활용해 완전히 선형적이고 결정적인 이력을 만들었습니다. 이 파이프라인의 의도치 않은 발견은 2건의 장애에서 트랜잭션 로그 재생이 실패했다는 점이었으며, 이는 하나의 트랜잭션이 기록하고 커밋한 데이터가 이후 트랜잭션에 보이지 않는다는 뜻으로, 오류 메시지 없이 쓰기가 사라진 불가능한 현상이었습니다."}, {"h": "SQLite 체크포인팅과 수동 제어의 의심", "ko": "SQLite 개발자들이 새로운 디버깅 도구를 개발하던 중, Tailscale도 버그가 체크포인팅 과정에 있을 것으로 의심했습니다. SQLite 데이터베이스는 작은 정보 블록인 '페이지'의 연결이며, 데이터베이스 업데이트 시 일부 페이지를 새 페이지로 교체해야 합니다. 성능과 동시성을 위해 Tailscale은 쓰기 선행 로깅(WAL) 모드로 SQLite를 실행하는데, 이는 새 페이지가 WAL 파일에 먼저 기록된 후 나중에 메인 데이터베이스 파일로 복사되는 방식입니다. 이 복사 과정을 '체크포인팅'이라 하는데, 대부분의 배포에서는 SQLite가 자동으로 결정하지만, Tailscale은 빠르고 일관된 백업을 위해 체크포인팅을 수동으로 제어하는 비표준 방식을 택했고, 이것이 잠재적 원인으로 의심받기 시작했습니다."}, {"h": "가상 파일시스템 계층의 추적과 버그 발견", "ko": "한 가지 실마리는 부패 사건 중 SQLite가 WAL 파일의 실제 페이지보다 더 많은 페이지를 복사했다고 보고했다는 점이었습니다. 예를 들어 WAL 파일에 10개 페이지가 있는데 20개 페이지가 메인 데이터베이스로 복사되었다면, 분명히 뭔가 잘못된 것입니다. 진단을 위해 SQLite 개발자들은 가상 파일시스템 계층을 추적하는 새 디버깅 도구를 만들었습니다. SQLite는 여러 계층으로 나뉘는데, 최상위는 SQL 파서와 코드 생성기, 그 아래는 페이저, 그리고 실제 디스크 쓰기를 담당하는 OS 인터페이스로 이루어져 있습니다. 새로운 도구인 tmstmpvfs 쉼(shim)은 가상 파일시스템을 감싸서 데이터베이스 변경에 대한 추적 정보와 로그를 기록했으며, SQLite 공개 저장소에서 소스코드를 확인할 수 있습니다. 회사가 이 쉼을 운영 환경에 배포했고, 다음 부패 사건이 발생했을 때 추가 로그 덕분에 SQLite 개발자들은 결국 버그를 찾아낼 수 있었습니다."}, {"h": "WAL-Reset 버그의 정체와 메커니즘", "ko": "발견된 버그는 체크포인팅과 쓰기 트랜잭션 사이의 드문 데이터 경쟁 조건(race condition)이었으며, SQLite 개발자들은 이를 「WAL-Reset 버그」라고 명명했습니다. 체크포인팅 중 정확한 시점에 쓰기가 발생하면, 체크포인팅 과정이 일부 페이지가 WAL에서 메인 데이터베이스로 복사되었다고 착각하게 되는데, 실제로는 복사되지 않았습니다. 그 페이지들은 메인 데이터베이스 파일에 절대 기록되지 않아 데이터가 영구적으로 손실되고, 손실된 페이지를 참조하는 인덱스 같은 다른 페이지가 메인 데이터베이스에 기록되면서 데이터베이스 파일이 부패하게 됩니다. 이 16년 묵은 버그는 단 하나의 시간 윈도우에서만 발생하는 매우 희귀한 조건이었기 때문에 지금까지 발견되지 않았던 것으로 추정됩니다."}], "caveat": "원문이 현재 진행형이므로 최종 수정 완료 여부와 공식 패치 일정은 원문 전문에서 확인이 필요합니다."}, {"id": "311d3f683fc6", "date": "2026-08-11", "title": "Muse Glimmer: 30B-parameter model optimized for always-on local agent workflows", "ko_title": "메타, 로컬 실행 가능한 30B 경량 에이전트 모델 뮤즈 글림머 공개", "source": "Hacker News 300+", "url": "https://research.meta.ai/blog/introducing-muse-glimmer-open-agentic-model", "sections": [{"h": "메타의 새로운 경량 오픈소스 모델 발표", "ko": "메타 슈퍼인텔리전스 랩스가 뮤즈 글림머(Muse Glimmer)를 공개했으며, 아파치 2.0 라이선스로 완전히 오픈소스화했습니다. 이 모델은 30억 개의 파라미터를 가진 경량 모델로, 맥이나 개인용 PC에서 소비자급 GPU 하나만으로 실행할 수 있도록 최적화되었습니다. 로컬 에이전트 운영, 함수 호출, 코딩 작업, 판사 역할의 대언어모델 평가 등 다양한 사용 사례를 지원하면서도 동급 모델들과 비교해 우수한 성능을 제공합니다."}, {"h": "클라우드 의존성 탈피의 필요성", "ko": "기초 모델들이 추론, 코드 생성, 도구 사용 등에서 높은 능력을 보였음에도, 대부분의 배포는 여전히 클라우드 인프라와 네트워크 접근에 의존합니다. 로컬에서 모델을 실행하면 인터넷 연결 여부와 관계없이 언제 어디서나 AI를 활용할 수 있다는 장점이 생깁니다. 오픈소스 커뮤니티는 적절하게 훈련된 소규모 모델이 특정 작업에서 최첨단 수준의 성능에 접근할 수 있음을 증명했으며, 뮤즈 글림머은 이러한 로컬 활용 사례를 겨냥하여 설계되었습니다."}, {"h": "개발자 접근성 극대화를 위한 오픈 공개", "ko": "메타는 메타의 오픈 AI 연구 전통을 이어 뮤즈 글림머의 가중치를 허깅페이스에 공개하고 개발자 문서를 함께 제공합니다. 이 모델은 개발자들이 이미 사용 중인 도구와 호환되도록 구축되었으며, llama.cpp, MLX, ExecuTorch 같은 플랫폼에서 최적화된 통합을 제공할 예정입니다. 이를 통해 다운로드 후 몇 분 내에 작동하는 에이전트를 구성할 수 있도록 목표합니다."}, {"h": "로컬 에이전트에 필요한 다층적 능력", "ko": "일정 관리, 메시지 작성, 파일 정리, 사용자 업무 패턴 학습 같은 기능을 하려면 개인 정보에 대한 깊은 접근이 필요합니다. 동시에 장기 실행 계획 수립, 정확한 도구 호출, 멀티모달 이해, 장기 맥락 메모리, 명령 준수 같은 여러 능력이 함께 작동해야 합니다. 뮤즈 글림머은 로컬 하드웨어의 메모리와 계산 제약 속에서 이런 능력들의 균형을 맞추도록 설계되었습니다."}, {"h": "컴팩트 설계와 지식 증류 기법", "ko": "메모리와 계산 제약을 충족하기 위해 메타는 간결한 아키텍처, 더 큰 교사 모델로부터 에이전트 추론 능력을 전이하는 새로운 증류 기법, 그리고 추론 최적화를 적용했습니다. 사전 훈련 단계에서는 더 큰 뮤즈 스파크 모델의 출력을 이용한 로짓 증류를 사용했고, 중간 훈련에서는 더 긴 문맥과 에이전트 중심의 데이터로 훈련했으며, 사후 훈련에서는 감독 학습과 강화학습을 결합했습니다."}, {"h": "에이전트 능력의 다면적 평가 체계", "ko": "뮤즈 글림머는 엔드투엔드 에이전트 작업 완수, 안정적인 도구 사용, 다단계 추론, 장애 복구, 멀티모달 입력·추론, 오케스트레이션 호환성, 조정 가능한 추론 강도, 100개 이상 언어 지원 등 여덟 가지 핵심 능력을 중심으로 훈련되고 평가됩니다. 각 항목은 실제 에이전트가 갖춰야 할 필수 요소들이며, 벤치마크로는 DeepSearch QA, MCP-Atlas, τ-Bench, SWE-Bench 등을 활용합니다."}, {"h": "메모리 효율과 속도 최적화 기술", "ko": "완전 정밀도의 30억 파라미터 모델은 55GB 이상의 메모리가 필요하지만, 양자화 기법으로 약 4비트 정밀도로 압축하여 20GB 미만으로 줄였습니다. 이는 24GB 또는 32GB 메모리 범위 내에서 모델의 작동 메모리, 이미지 이해용 인식 인코더, 추측적 디코딩 드래프터가 동시에 실행될 여유를 남깁니다. 또한 DFlash 기반의 경량 드래프터 모델을 사용하여 토큰을 한 번에 여러 개씩 제안하고 주 모델이 검증하는 방식으로, 표준 토큰별 생성보다 훨씬 빠른 텍스트 생성을 구현했습니다."}, {"h": "실제 하드웨어에서의 성능 검증", "ko": "메타는 맥북 M4-Max, M5-Max와 RTX-5090에서 양자화된 뮤즈 글림머와 드래프터의 속도를 측정했으며, 유연한 대화와 실시간 에이전트 상호작용을 지원할 만큼 충분히 빠른 성능을 확인했습니다. 모든 처리가 사용자 기기 내에서만 이루어지므로 개인정보 보호 측면에서도 우수합니다."}, {"h": "즉시 사용 가능한 배포 옵션 다양화", "ko": "뮤즈 글림머의 가중치는 허깅페이스에서 즉시 다운로드할 수 있으며, Ollama, LM Studio, Unsloth 같은 파트너 서비스를 통해 로컬 실행이 가능합니다. llama.cpp, ExecuTorch, MLX 같은 엣지 프레임워크로 배포하거나, vLLM, SGLang으로 대규모 운영할 수 있으며, Together AI, Fireworks AI, OpenRouter 같은 서비스로 빠르게 시작할 수도 있습니다. 추가로 PyTorch의 TorchTitan 기능으로 특정 사용 사례에 맞게 모델을 미세 조정할 수 있습니다."}, {"h": "생태계 파트너십과 지원 자원", "ko": "AMD, Arm, Dell, Intel, NVIDIA 등 주요 하드웨어 제조사들과의 협력으로 다양한 기기에서의 성능 최적화를 진행하고 있습니다. 메타는 개발자가 책임감 있게 뮤즈 글림머을 사용할 수 있도록 문서를 제공하며, 맞춤형 스캐폴딩 설정 가이드를 포함해 첫날부터 개인 에이전트를 구축하고 배포하기 쉽도록 지원합니다. 이는 메타의 장기적 오픈 AI 연구 전통을 에이전트 AI 분야로 확장하려는 시도입니다."}], "caveat": "메타의 주장과 벤치마크 결과는 아직 독립적인 제3자 검증을 거치지 않았으므로, 실제 프로덕션 환경에서의 성능은 별도 평가가 필요합니다."}, {"id": "52fa033e5f1f", "date": "2026-08-13", "title": "AI is removing the middle class of software engineering?", "ko_title": "AI 시대, 소프트웨어 엔지니어의 중산층이 사라지고 양극화가 심화되는가?", "source": "Hacker News 300+", "url": "https://blog.florianherrengt.com/ai-removing-middle-class-software-engineering.html", "sections": [{"h": "AI 이전: 견제와 품질 관리의 시대", "ko": "저자는 2020년의 상황으로부터 출발한다. 당시 시니어 엔지니어는 코드 리뷰와 아키텍처 관리로 프로젝트의 기술적 품질을 지키는 역할을 담당했다. 휴가 중 나타나는 무질서는 명백했지만, 그 피해의 규모는 인간이 만들 수 있는 속도에 의해 자연스럽게 제한되었다. 즉, 나쁜 결정이 누적되더라도 누군가는 그 과정을 감시하고 개입할 시간이 있었다."}, {"h": "AI 이후: 속도의 급격한 증가와 통제 불능", "ko": "2026년의 월요일 아침, 저자가 마주하는 것은 전혀 다른 광경이다. 팀원들이 금요일 이후 몇 주일 휴가 때 이루던 것보다 더 많은 코드 변화(수만 줄)를 지난 주말에 만들어낸다. AI 에이전트를 사용하면서 체계적인 설계 논의 없이 프롬프트 기반의 빠른 구현이 가능해진 것이다. 개발자는 자신이 무엇을 만들고 있는지 완전히 이해하지 못한 채, 프로덕션에 배포 가능한 코드를 쏟아낸다."}, {"h": "기술 부채의 가시적 성공과 숨겨진 위험", "ko": "겉으로는 모든 것이 작동한다. PR을 받아 테스트하면 어떤 형태로든 기능한다. 하지만 이것이 바로 함정이다. 팀원들은 계속 AI에 지시를 내려 같은 버그를 반복해서 고치려 하고, 그 과정에서 코드는 더욱 복잡해진다. 저자는 신용카드로 고급 자동차를 구매하는 사람에 비유한다. 부채는 보이지 않고 겉으로는 멋져 보일 뿐이다. 결국 시스템이 너무 얽혀서 누구도 그 안에 무엇이 있는지 알 수 없는 지경에 이른다."}, {"h": "엔지니어링 문화 붕괴와 의사결정의 손실", "ko": "이전에는 누군가는 반드시 시스템을 이해하고 있었고, 그 사람이 설명해줄 수 있었다. 지금은 개발자들이 스스로도 모르는 결정을 AI에 묻는다. 25,000줄 PR을 열어야 할 책임은 해당 개발자에게 있다. 코드를 검토하는 사람도 그 크기에 거절하지 않는다. Kafka를 추가한 사람도, 기능을 만든 사람도 그들의 선택을 정당화할 수 없다. 결국 누구도 자신의 결정을 진정으로 이해하지 못한 채 다음 단계로 넘어간다."}, {"h": "기술 부채 누적 속도의 급변", "ko": "기술 부채 자체가 나쁜 것은 아니다. 문제는 그것이 의도적 지름길이 되지 못한다는 점이다. 데이터베이스에 테이블을 추가하는 데는 10분이 걸리지만, 나중에 제거하려면 마이그레이션 계획과 운영 중단 회피 전략이 필요하다. AI 모델도 이를 완벽하게 해결하지 못한다. 그 사이에도 20개의 새로운 PR이 들어온다. 나쁜 결정을 하나 풀어헤칠 동안 다섯 개의 새로운 결정이 병합된다. 이전에도 이런 일은 있었지만, 구현의 어려움이 자연스러운 속도 제한이 되어줬다. 이제 그 제한이 사라졌다."}, {"h": "엔지니어 급여의 진짜 의미와 AI의 가치 역전", "ko": "런던과 샌프란시스코의 엔지니어가 6자리 급여를 받는 이유를 다시 생각해보자. 단순히 사양을 작동하는 코드로 변환하는 것만 필요하다면, 저비용 지역에서 이미 싸게 했을 것이다. 기술 대기업들이 여전히 최고의 인재에게 높은 급여를 제시하는 것은 의사결정과 복잡성 관리 능력을 원하기 때문이다. AI는 이 시장을 극단적으로 양극화시킬 것으로 예상된다. 좋은 엔지니어는 AI를 활용하여 훨씬 빠르게 움직이므로 더욱 가치 있어지고, 단순 구현 인력에 대한 필요성은 줄어든다. 동시에 나쁜 엔지니어는 고용하기 매우 비싸진다. 왜냐하면 그들의 실수가 이전보다 훨씬 큰 규모로, 빠르게 누적되기 때문이다."}, {"h": "속도와 검증 사이의 치명적 불균형", "ko": "저자가 지적하는 핵심은 속도의 차이다. AI 이전, 나쁜 엔지니어는 컴파일되지 않는 코드를 만들기도 했고, 뭔가 만들어도 시간이 오래 걸렸으며 피해 범위가 제한되었다. 지금은 오전 중에 10,000줄의 작동하는 코드를 만들 수 있다. 나쁜 결정이 이전에는 수개월에 걸쳐 누적되었다면, 이제 하루 오후에 누적된다. 그러나 코드를 검토하고 이해하는 속도는 변하지 않았다. 「프로세스를 개선하면 된다」는 반박은 문제를 놓친다. 코드 리뷰, 테스트, CI는 대량의 변화가 불가능했던 세상을 위해 설계되었다. 하루 10개의 PR을 리뷰할 수 없고, 100% 테스트 커버리지도 예상하지 못한 버그는 잡지 못한다."}, {"h": "생산성 착각과 실제 팀 생산력의 역설", "ko": "어떤 엔지니어가 하루에 10개의 PR을 열면 10배 생산적인가? 그렇지 않다. 만약 그 10개의 PR을 검토하고 이해하기 위해 3명의 엔지니어가 이틀을 써야 한다면, 결국 생산성을 다른 사람들에게 전가한 것이다. 특히 그들의 시간은 희소하고 교체하기 어렵다. PR 개수, 변경 줄 수, 완료된 기능은 생산성의 끔찍한 척도다. 개인의 숫자를 좋아 보이게 할 수 있지만 전체 팀의 처리량을 줄인다. 조직 문화가 티켓 수를 품질보다 우선시한다면, 신중한 엔지니어는 나쁜 직원처럼 보이고 성급한 엔지니어가 승진한다. 품질을 지키려고 해도 「독성적」이라는 낙인이 찍힐 수 있다."}, {"h": "책임감 있는 엔지니어의 역할과 AI 신뢰의 한계", "ko": "저자는 AI를 매일 사용하며 거부하지 않는다. 다만 문제를 인식하는 것과 도구를 쓰는 것은 별개라고 본다. 컴파일러는 코드의 의미를 보존하면서 다른 형태로 변환한다. 하지만 LLM은 의사결정을 내린다. 아키텍처를 선택하고, 추상화를 정하고, 시스템이 무엇을 해야 할지 결정한다. 배포 후 문제가 생기면, 자신의 변경을 이해하지 못한 채 나타나는 사람은 도움이 되지 않는다. 프로덕션이 깨질 때 필요한 것은 그 변화를 이해하는 엔지니어다. 좋은 엔지니어는 속도에도 타협과 유연성이 필요할 때를 안다. 하지만 실제 문제를 일으킬 것으로 보이면 목소리를 내야 한다. 그것이 직업이다."}, {"h": "지식 노동 전반으로 확대되는 양극화의 신호", "ko": "이 현상은 소프트웨어 엔지니어링에만 국한되지 않을 것이다. 모든 지식 노동에서 유사한 일이 벌어질 것으로 예상된다. AI는 최고의 인재를 매우 생산적으로 만들고, 나쁜 인재는 거의 고용 불가능하게 만든다. 이전에는 누군가가 나쁜 결정을 캐치할 확률이 있었다. 지금은 변화가 누구도 현실적으로 검토하거나 이해할 수 있는 속도보다 빨리 일어난다. 결과적으로 의사결정 능력이 있는 점점 작은 집단으로 자원이 집중될 가능성이 높다. 의사결정 능력이 없는 대다수는 저비용이거나 교체된다."}], "caveat": "본 글은 실제 프로덕션 사례보다는 저자의 우려 시나리오에 기초하고 있으며, AI 모델의 능력과 제약을 특정 시점의 기술 수준으로 평가하고 있으므로, 미래 예측으로 읽을 때는 저자의 관점이 전부가 아님을 고려하기 바랍니다."}, {"id": "fbdfaa10f2aa", "date": "2026-08-13", "title": "DeepSeek V4 Pro 0813", "ko_title": "DeepSeek V4 Pro 0813: 중국산 프론티어급 모델의 글로벌 공개", "source": "Hacker News 300+", "url": "https://openrouter.ai/deepseek/deepseek-v4-pro-0813", "sections": [{"h": "모델의 정체와 공식 출시", "ko": "DeepSeek이 대규모 혼합 전문가(MoE) 아키텍처 기반의 V4 Pro 모델을 정식 공개했습니다. 이는 단일 기업의 독점 모델이 아니라 여러 호스팅 업체를 통해 서빙되는 구조를 갖추고 있습니다. 사용자는 OpenRouter 같은 라우팅 플랫폼을 거쳐 동일한 모델에 접근하되, 비용·속도·정확도 중 우선순위를 선택하여 최적의 제공자로 자동 연결될 수 있습니다."}, {"h": "실제 사용자 비용과 가격 책정", "ko": "공시 가격과 실제 고객이 지불하는 평균 가격 사이에는 차이가 존재합니다. 토큰 캐싱과 대량 할인 같은 요소들이 실제 비용을 공식 요금보다 상당히 낮출 수 있다는 점을 사용자에게 투명하게 알립니다. 이는 장기·반복 사용을 고려하는 조직이 예산을 보다 정확하게 추정할 수 있도록 돕는 정보입니다."}, {"h": "성능 지표: 속도와 응답 시간", "ko": "모델의 실제 운영 성능은 세 가지 차원으로 측정됩니다. 처리량(초당 토큰 수)은 빠를수록, 지연시간(왕복 시간)은 낮을수록 좋으며, 첫 토큰 시간(화면에 결과가 나타나기까지의 대기 시간)도 짧을수록 사용자 경험이 우수합니다. 이 세 지표는 모델 선택 시 실무적 의사결정에 직결되는 핵심 지표들입니다."}, {"h": "가용성과 서비스 안정성", "ko": "지난 3일간 적어도 하나의 제공자가 요청에 응답한 비율을 가동률로, 추론 요청이 성공적으로 완료된 비율을 가용성으로 따로 추적합니다. OpenRouter는 지속적인 모니터링을 통해 한 제공자에 오류가 발생하면 차선의 제공자로 자동 전환하는 방식으로 서비스 신뢰도를 높입니다. 이는 엔터프라이즈 환경에서 요구되는 안정적 운영의 기초입니다."}, {"h": "벤치마크 성능 평가", "ko": "표준화된 평가 기준에 따른 모델의 점수가 공개되며, 백분위 순위를 통해 OpenRouter 플랫폼상 전체 모델 대비 상대적 위치를 확인할 수 있습니다. 이 수치들이 높을수록 우수한 성능을 의미하며, 사용자는 자신의 작업 특성에 맞는 모델을 객관적 데이터를 바탕으로 선택할 수 있습니다."}, {"h": "실제 운영 사례와 사용 패턴", "ko": "이 모델로 가장 많은 트래픽을 보내는 공개 애플리케이션들의 목록이 제공됩니다. 실제 프로덕션 워크로드가 어떤 모양인지, 그리고 어떤 사용 사례에 이 모델이 가장 적합한지를 시장 신호로 읽을 수 있습니다. 이는 기술 문서만으로는 알 수 없는 '현장의 신뢰'를 보여주는 실증적 증거입니다."}, {"h": "개발자 통합과 API 호환성", "ko": "모델 호출을 위한 즉시 사용 가능한 코드 샘플이 제공되며, OpenRouter의 API가 OpenAI 호환 설계를 따르므로 대부분의 기존 SDK가 기본 URL 변경만으로 작동합니다. 모델 간 전환 시에도 모델 식별자(slug) 부분만 수정하면 되므로 통합 비용이 매우 낮습니다. 이는 개발자가 다양한 모델을 실험적으로 비교할 수 있는 진입 장벽을 크게 낮춘 설계입니다."}, {"h": "도구 호출과 구조화된 출력 지원", "ko": "DeepSeek V4 Pro 0813이 도구 호출(tool calling)과 구조화된 출력(structured outputs)을 지원하는지 여부는 에이전트형 애플리케이션, 데이터 처리 파이프라인, API 연동 작업에서 중요한 기능 요구사항입니다. 원문에서는 이에 대한 구체적 답변을 별도 항목으로 제시하고 있으나, 상세 내용은 해당 페이지의 FAQ 섹션 확인이 필요합니다."}], "caveat": "이 해부는 OpenRouter 플랫폼의 모델 소개 페이지를 재서술한 것으로, 성능 평가와 가격 정보는 플랫폼에서 추적하는 데이터에 기반하며, 중립적 제3자 벤치마크와의 비교 검증이 필요합니다."}, {"id": "99bdd8b2cd62", "date": "2026-08-15", "title": "Why does Opus 5 feel worse to work with?", "ko_title": "Opus 5는 왜 체감상 약할까? 벤치마크 최적화와 실무 효용성의 괴리", "source": "Hacker News 300+", "url": "https://mun-logadan.github.io/why-does-opus-5-feel-worse/", "sections": [{"h": "Opus 5의 역설: 높은 능력, 떨어진 체감", "ko": "저자와 동료들은 Anthropic의 최신 모델인 Opus 5를 Opus 4.7, 4.8, Fable 같은 이전 버전들과 비교해 실무에서 사용하기 더 불편하다고 느낀다. 능력 자체로는 Opus 5가 앞선다는 점을 인정하지만, 벤치마크상 우위에도 불구하고 실제 작업 경험은 다른 모델들이 더 낫다는 역설을 제시한다. 이는 단순한 기술적 성능 저하가 아니라, 모델의 작동 특성 차이에서 비롯된 것으로 추정된다."}, {"h": "이전 모델들의 강점: 신중함과 독립성", "ko": "Opus 4.7, 4.8, Fable은 사용자의 세심한 개입과 감독을 덜 필요로 한다는 점에서 Opus 5와 구별된다. 저자는 이 차이가 모델의 작동 철학의 차이에서 비롯났다고 본다. 이전 모델들은 불명확한 상황에서 더 신중한 접근을 취하며, 사용자가 직접 개입하지 않아도 안정적인 결과를 낼 수 있도록 설계된 것으로 보인다."}, {"h": "두 가지 경쟁 목표의 충돌", "ko": "저자는 Anthropic과 현재 거대 AI 연구소들이 겪고 있는 두 가지 상충하는 목표를 지적한다. 하나는 자기 개선을 통해 AGI에 도달할 수 있는 모델을 만드는 것이고, 다른 하나는 벤치마크 성과를 극대화하는 것이다. 이 두 목표가 모델 개발에 동시에 영향을 미치면서 특정 특성을 강화하는 선택압이 작동하고 있다는 주장이다."}, {"h": "벤치마크의 구조적 특성과 그 영향", "ko": "벤치마크 과제들은 본질적으로 자기완결적이며, 외부 정보나 추가 설명 없이 명확한 정답을 가져야 한다. 저자는 벤치마크 성과 최적화가 모델로 하여금 애매함 속에서 대담한 가정을 내리도록 선택하게 한다고 지적한다. 이 과정에서 명확함을 추구하지 않고 확인을 구하는 경향은 벌칙을 받게 되는 구조가 만들어진다."}, {"h": "실무와 벤치마크의 근본적 차이", "ko": "현실의 코딩 작업에서는 맥락, 의도, 사업상 제약, 예산 제한 같은 정보를 모두 전달하기 거의 불가능하다. 따라서 불명확함과 선택의 순간은 피할 수 없는데, 저자가 원하는 것은 정확히 그런 상황에서 에이전트가 멈추고 확인을 요청하는 태도다. 벤치마크는 답이 정해진 문제를 푸는 능력을 측정하지만, 현실은 정해진 답이 없거나 여러 개인 경우가 대부분이고, 이때 대충 추측하는 모델은 실무에서 위험하다는 결론이다."}], "caveat": "저자의 주장은 개인적 경험과 동료들과의 대화에 기반한 것으로, 체계적 벤치마크 비교나 대규모 사용자 조사로 검증되지 않았습니다."}, {"id": "ddb75f2efe54", "date": "2026-08-15", "title": "Every Fucking Website (2020)", "ko_title": "웹사이트의 획일화: 플랫폼 종속성과 사용자 선택권 상실의 구조", "source": "Hacker News 300+", "url": "https://lxe.github.io/everywebsite/", "sections": [{"h": "위기 마케팅과 긴급성의 악용", "ko": "저자는 현대 웹사이트들이 외부 위기 상황을 마케팅 수단으로 전환하는 관행을 지적합니다. COVID-19 같은 대사건이 발생하면 대부분의 사이트가 관련 메시지를 배치하지만, 이는 실제 정보 제공보다는 기계적인 응답에 불과하다는 뜻입니다. 사용자가 그 콘텐츠를 읽을 가능성은 낮음에도 불구하고, 기업들은 사회적 책임감을 표현하는 것처럼 보이기 위해 이를 반복합니다."}, {"h": "할인 쿠폰과 가입 유도의 동일 패턴", "ko": "모든 웹사이트가 거의 같은 형식의 할인 제안을 사용합니다. 「10% 할인, 이메일 가입」 같은 구조는 이제 사용자가 당연히 기대하는 요소가 되었으며, 각 사이트가 독창적인 인센티브를 개발하는 대신 검증된 전환율 높은 템플릿을 반복합니다. 이는 웹 생태계 전체가 동일한 사용자 경험 공식을 추구하고 있음을 보여줍니다."}, {"h": "쿠키 정책과 법적 강제의 악순환", "ko": "EU와 캘리포니아의 규제로 인해 모든 웹사이트가 쿠키 동의 배너를 게시하도록 강제되었습니다. 문제는 각 사이트가 자체 방식으로 이를 구현하면서 사용자는 매번 다른 인터페이스를 마주하게 되고, 브라우저 차원의 통일된 설정이 불가능해진 점입니다. 저자는 이것이 실제로는 사용자의 선택을 제한하는 결과를 낳았으며, 법적 규제의 의도와 무관하게 플랫폼들의 일관된 강제 동의 방식만 확산되었다고 비판합니다."}], "caveat": "2020년에 작성된 에세이로, 현재 웹 환경의 변화(AI 콘텐츠 생성, 새로운 규제, 플랫폼 분화 등)는 반영하지 않으며, 저자의 주관적 관찰에 기반한 글이므로 정량적 데이터로 뒷받침된 학술적 분석이 아닙니다."}, {"id": "afb6d0b82506", "date": "2026-08-15", "title": "Qwen 3.8 27B", "ko_title": "Qwen 3.8 27B 공개: 알리바바의 경량 오픈소스 모델과 AI 생태계의 변화", "source": "Hacker News 300+", "url": "https://huggingface.co/Qwen/Qwen3.8-27B-FP8", "sections": [{"h": "원문의 기술적 구성 요소", "ko": "제시된 텍스트는 Qwen 모델의 채팅 템플릿(chat template)과 토크나이저 설정을 담은 기술 명세입니다. 이미지·비디오 입력을 처리하는 비전 토큰, 추론 난이도 조절(xhigh/medium/low), 도구 호출 기능 등이 포함되어 있습니다. 메시지 역할(system, user, assistant, tool)과 생각 토큰을 구분하는 구조로 다단계 상호작용을 지원합니다. Hacker News에서 300+ 추천을 받은 이 모델 공개는 단순한 기술 업데이트가 아니라 오픈소스 AI 접근성 경쟁의 신호입니다."}, {"h": "경량 모델 공개의 전략적 의미", "ko": "27B 규모의 모델을 FP8(저정밀도) 포맷으로 공개한 것은 엣지 디바이스와 로컬 환경에서의 AI 배포를 가능하게 합니다. 이는 클라우드 기반 API에 의존하던 기존 구조에서 벗어나 분산 배포 모델을 촉진합니다. 알리바바가 공개한 모델이 Hugging Face에서 직접 접근 가능하다는 점은 개발자의 진입장벽을 낮추는 전략입니다."}, {"h": "OpenAI·Anthropic 독점 구도 이완", "ko": "대규모 언어모델 시장에서 OpenAI와 Anthropic이 차지한 독점적 지위가 알리바바 같은 기업의 경량 오픈소스 모델 공개로 약화되고 있습니다. 개발자들이 폐쇄형 API 대신 로컬에서 실행 가능한 오픈소스를 선택할 수 있는 옵션이 늘어나면서, 프로프라이터리 모델의 가격 협상력이 감소할 가능성이 높아집니다."}, {"h": "해부 해석의 한계와 검증 필요성", "ko": "원문 본문은 기술 명세만 포함하고 있어 모델의 실제 성능 벤치마크, 추론 속도, 학습 데이터 구성 등 평가에 필수적인 정보가 없습니다. Hacker News 추천 수는 커뮤니티의 관심도를 반영하지만, 실제 산업 영향력이나 채택률은 별개의 문제입니다. 한줄평의 주장도 아직 추정(「경쟁이 심화되고 있으며」, 「신호입니다」)에 가까우므로, 출처 페이지의 전체 문맥과 성능 비교 자료를 참고해야 합니다."}], "caveat": "제공된 텍스트는 모델 명세만 있고 성능 지표·비교 분석·도입 사례가 없으므로, 실제 영향력 평가를 위해 Hugging Face 페이지의 벤치마크 결과와 Hacker News 원문 댓글 토론을 함께 검토할 필요가 있습니다."}, {"id": "ab1f720db0b9", "date": "2026-08-15", "title": "Google is making private AI practical with homomorphic encryption", "ko_title": "구글의 준동형암호 기술, 프라이빗 AI 실용화 단계로 진입", "source": "Hacker News 300+", "url": "https://blog.google/security/how-google-is-making-private-ai-practical-with-homomorphic-encryption/", "sections": [{"h": "프라이빗 AI의 핵심 도구 HEIR 공개", "ko": "구글이 프라이빗 컴퓨팅 툴킷에 새로 추가한 HEIR이라는 오픈소스 컴파일러를 발표했습니다. 이 도구는 암호화된 상태에서도 안전한 AI 추론을 가능하게 하는 기술입니다. AI의 성장으로 새로운 이점이 나타나면서도 프라이버시와 보안 사이의 균형을 맞춰야 한다는 과제가 생겼고, HEIR은 이를 해결하기 위한 구글의 답변입니다."}, {"h": "암호화와 기능성 사이의 오랜 딜레마", "ko": "기존의 엔드투엔드 암호화 같은 보안 방식은 사용자 데이터를 유출로부터 보호하지만, 스팸 탐지나 바이러스 검사처럼 데이터에 의존하는 서비스 기능을 제공할 수 없다는 문제를 안고 있습니다. 의료나 금융 같은 규제가 엄격한 산업에서는 이러한 위험을 더욱 꺼리며, 기관 간 데이터 공유도 법적으로 제한됩니다. 로컬 처리 같은 대안도 기기의 성능 한계와 서비스 제공자의 지적재산권 보호 필요성 때문에 완벽한 해법이 되지 못합니다."}, {"h": "준동형암호의 등장과 가능성", "ko": "준동형암호는 암호화된 데이터 위에서도 직접 계산을 수행할 수 있게 함으로써 이러한 트레이드오프 자체를 바꾸는 기술입니다. 클라우드 서버가 암호화된 데이터를 처리하고 암호화된 결과를 반환할 수 있으므로 실제 정보는 노출되지 않습니다. 예를 들어 클라우드 서비스가 사용자의 개인 정보를 볼 수 없으면서도 콘텐츠 추천을 제공할 수 있습니다. 준동형암호는 계산 비용이 상당하지만, 이를 기술적 불가능에서 경제적 비용 문제로 전환시키며, 그 비용은 빠르게 감소하는 추세입니다."}, {"h": "구글의 프라이버시 기술 역사와 HEIR의 위치", "ko": "구글은 차등 프라이버시, 프라이빗 집합 멤버십, 프라이빗 정보 검색 등 다양한 암호화 기술을 개발해왔으며, 이들은 모두 사용자 데이터 보호라는 목표로 수렴합니다. 준동형암호는 이 도구 상자에 추가되는 또 다른 강력한 기술입니다. 하드웨어 기반 솔루션과 달리 준동형암호는 순수하게 암호학적 보장만으로 강한 보안과 프라이버시를 제공합니다. 다만 기존 프로그램을 준동형암호 방식으로 효율적으로 변환하려면 암호학 전문가 팀이 필요했기에, 구글은 이 진입장벽을 낮추기 위해 HEIR을 개발했습니다."}, {"h": "HEIR 컴파일러의 설계와 비전", "ko": "HEIR은 준동형암호를 위한 오픈소스 컴파일러 도구모음이자 개발 플랫폼으로, 암호화되지 않은 데이터를 처리하는 미리 학습된 AI 모델을 암호화된 입력값에서 작동하도록 변환할 수 있습니다. 구글의 목표는 HEIR을 암호화 추론을 프로덕션 애플리케이션에 통합하는 원클릭 솔루션으로 만드는 것입니다. 2023년 의도 발표 이후 암호화 커뮤니티가 HEIR을 받아들였고, 구글은 준동형암호용 하드웨어 가속기를 개발하는 벨포트, 니오븀, 코르나미, 옵탈리시스 같은 기업들과 파트너십을 맺었습니다."}, {"h": "학계 협력과 연구 성과", "ko": "HEIR은 암호학자들이 자신의 최적화 연구에 집중하면서도 기존 인프라를 테스트, 벤치마킹, 비교에 활용할 수 있는 생산적인 연구 플랫폼으로 확립되었습니다. 조지아 공대, 카네기멜론, UC 산타바바라, 일리노이 공과대, 퍼듀, 에든버러 대학, 칭화 대학 등 여러 기관이 HEIR 위에서 연구하고 있으며, 현재까지 4편의 피어리뷰 논문이 HEIR을 기반으로 발표되었고 더 많은 논문이 준비 중입니다."}, {"h": "실제 적용 사례 네 가지", "ko": "구글은 준동형암호의 발전 정도를 보여주기 위해 HEIR로 컴파일된 네 가지 프라이빗 추론 애플리케이션을 공개했습니다. 첫째는 벨포트 랩스, LG, 뉴욕 대학과의 협력으로 사용자 정보 노출 없이 콘텐츠 추천을 제공하는 딥러닝 모델, 둘째는 니오븀과 hardshell.ai와의 협력으로 신용카드 부정 거래 탐지기, 셋째는 암호화된 네트워크 트래픽 이상 탐지 시스템 키츠네, 넷째는 벨포트 랩스와의 협력으로 오디오 녹음을 보호하면서 음성 명령어를 인식하는 핫워드 감지 모델입니다. 모든 사례는 단일 스레드 CPU 기준의 지연 시간을 공개하며 소스 코드도 깃허브에서 이용할 수 있습니다."}, {"h": "AI 시대 프라이버시 기술의 미래", "ko": "소프트웨어 산업이 AI로 인한 보안과 프라이버시 변화에 적응하면서, 구글의 연구팀은 준동형암호를 개발하기 쉽고, 실행 속도도 빠르며, 산업 전반에 널리 보급되도록 만드는 데 주력하고 있습니다. 이는 규제 위험을 낮추면서 기업용 생성형 AI의 채택을 가속하려는 장기 전략의 일환입니다."}], "caveat": "글에서 제시된 네 가지 애플리케이션의 성능 수치(지연 시간)가 본문에 명시되어 있지 않으므로, 원문의 공식 블로그나 깃허브 리포지토리에서 실제 벤치마크 결과를 직접 확인할 필요가 있습니다."}], "column_links": {"3966433b8e10": "log-1491541429", "d6b60cf6031d": "log-231463710", "a10515ed86a4": "log-528348452", "c992986a594f": "log-1917242275", "e19de7deb30d": "log-2473773771", "e2dc35a6be96": "log-2423754145", "3d03f9d3b9ed": "log-1496581969", "67636947efe0": "log-1378073528", "ddb75f2efe54": "log-4049924327", "99bdd8b2cd62": "log-809321530", "afb6d0b82506": "log-1046846530", "fbdfaa10f2aa": "log-395276510", "550006791bdd": "log-1258559650", "311d3f683fc6": "log-3119002283"}}};

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(group) {
  const list = document.getElementById('list');
  const stocks = (DATA.stocks || []).filter(s => s.group === group);
  if (!stocks.length) {
    list.innerHTML = '<div class="no-art">수집된 리서치가 아직 없습니다 — 다음 자동 갱신을 기다려 주세요.</div>';
    return;
  }
  list.innerHTML = stocks.map(s => {
    const arts = (s.articles || []).map(a => {
      const hasKo = a.title_ko && a.title_ko !== a.title;
      const bullets = (a.summary_ko || []).map(b => '<li>' + esc(b) + '</li>').join('');
      return '<a class="art" href="' + esc(a.link) + '" target="_blank" rel="noopener">' +
        '<div class="art-title">' + esc(hasKo ? a.title_ko : a.title) + '</div>' +
        (hasKo ? '<div class="art-orig">' + esc(a.title) + '</div>' : '') +
        (bullets ? '<ul class="art-summary">' + bullets + '</ul>' : '') +
        '<div class="art-meta">' + esc(a.source) + (a.date_label ? ' · ' + esc(a.date_label) : '') + '</div>' +
      '</a>';
    }).join('');
    return '<div class="stock-block">' +
      '<div class="stock-head">' +
        (s.rank ? '<span class="stock-rank">' + esc(s.rank) + '위</span>' : '') +
        '<span class="stock-name">' + esc(s.name) + '</span>' +
        '<span class="stock-ticker">' + esc(s.ticker) + '</span>' +
      '</div>' +
      (arts || '<div class="no-art">최근 2주 내 수집된 기사 없음</div>') +
    '</div>';
  }).join('');
}

function calTimeline(evs){
  // 다가오는 2주 — 1주씩 두 줄 (오늘부터 14일)
  const W = 980, padL = 14, padT = 50, rowH = 198, H = padT + rowH*2 + 26;
  const colW = (W - padL*2) / 7;
  const day0 = new Date(); day0.setHours(0,0,0,0);
  const fmt = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const byDay = {};
  evs.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  const DOW = ['일','월','화','수','목','금','토'];
  let o = '';
  o += '<rect width="' + W + '" height="' + H + '" rx="14" fill="var(--bg-card)"/>';
  o += '<text x="20" y="30" fill="var(--gold)" font-size="16.5" font-weight="800">다가오는 2주 — 관측 캘린더</text>';
  o += '<text x="' + (W-20) + '" y="30" text-anchor="end" fill="var(--gold)" font-size="10.5" font-weight="800">UNIVERTRIX · univertrix.com</text>';
  let total = 0;
  for (let i = 0; i < 14; i++) {
    const d = new Date(day0.getTime() + i*86400000);
    const week = Math.floor(i / 7), col = i % 7;
    const x = padL + colW * col, top = padT + rowH * week, dow = d.getDay();
    const isToday = i === 0, isWknd = dow === 0 || dow === 6;
    if (isWknd) o += '<rect x="' + (x+2).toFixed(1) + '" y="' + top + '" width="' + (colW-4).toFixed(1) + '" height="' + (rowH-12) + '" fill="var(--cal-wknd)" rx="8"/>';
    if (isToday) o += '<rect x="' + (x+2).toFixed(1) + '" y="' + top + '" width="' + (colW-4).toFixed(1) + '" height="' + (rowH-12) + '" fill="var(--gold-bg, rgba(242,186,60,0.12))" stroke="var(--gold)" stroke-width="1.2" rx="8"/>';
    o += '<text x="' + (x+colW/2).toFixed(1) + '" y="' + (top+20) + '" text-anchor="middle" fill="' + (isToday ? 'var(--gold)' : 'var(--text)') + '" font-size="13.5" font-weight="800">' + (d.getMonth()+1) + '/' + d.getDate() + '</text>';
    o += '<text x="' + (x+colW/2).toFixed(1) + '" y="' + (top+36) + '" text-anchor="middle" fill="' + (isToday ? 'var(--gold)' : 'var(--text-muted)') + '" font-size="10.5" font-weight="700">' + (isToday ? '오늘' : DOW[dow]) + '</text>';
    const dayEvs = byDay[fmt(d)] || [];
    total += dayEvs.length;
    dayEvs.slice(0, 4).forEach((e, k) => {
      const y = top + 46 + k * 33;
      const isE = e.type === 'earnings';
      const label = String(e.ticker || (e.title || '').split(' ')[0]).slice(0, 8);
      o += '<rect x="' + (x+8).toFixed(1) + '" y="' + y + '" width="' + (colW-16).toFixed(1) + '" height="26" rx="7" fill="' + (isE ? 'var(--gold-bg, rgba(242,186,60,0.14))' : 'var(--cal-blue-bg)') + '" stroke="' + (isE ? 'var(--gold)' : 'var(--cal-blue)') + '" stroke-width="1"/>';
      o += '<text x="' + (x+colW/2).toFixed(1) + '" y="' + (y+17.5) + '" text-anchor="middle" fill="' + (isE ? 'var(--gold)' : 'var(--cal-blue)') + '" font-size="12" font-weight="800">' + esc(label) + '</text>';
    });
    if (dayEvs.length > 4)
      o += '<text x="' + (x+colW/2).toFixed(1) + '" y="' + (top+46+4*33+13) + '" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-weight="800">+' + (dayEvs.length-4) + '</text>';
  }
  o += '<text x="20" y="' + (H-8) + '" fill="var(--text-muted)" font-size="9.5">금빛 = 실적 발표 · 코발트 = 경제지표·기타 — 2주 내 ' + total + '건</text>';
  return '<div class="col-chart" style="margin:0 0 18px;border-radius:14px;overflow:hidden;border:1px solid var(--line);line-height:0">' +
    '<svg style="width:100%;height:auto;display:block" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' + o + '</svg></div>';
}

function renderCalendar() {
  const list = document.getElementById('list');
  const evs = (DATA.calendar && DATA.calendar.events) || [];
  if (!evs.length) {
    list.innerHTML = '<div class="no-art">수집된 일정이 아직 없습니다 — 다음 자동 갱신을 기다려 주세요.</div>';
    return;
  }
  const today = new Date(new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' }));
  const typeLabel = { macro: 'FOMC·매크로', earnings: '실적 발표', event: '이벤트' };
  list.innerHTML = calTimeline(evs) + evs.map(e => {
    const d = new Date(e.date);
    const diff = Math.round((d - today) / 86400000);
    const dday = diff === 0 ? 'TODAY' : (diff > 0 ? 'D-' + diff : 'D+' + Math.abs(diff));
    const md = (d.getMonth() + 1) + '/' + d.getDate();
    return '<div class="cal-item">' +
      '<div class="cal-date"><div class="d">' + md + '</div>' +
      '<span class="dday' + (diff === 0 ? ' today' : '') + '">' + dday + '</span></div>' +
      '<div class="cal-body"><div class="cal-title">' + esc(e.title) + '</div>' +
      '<span class="cal-type ' + esc(e.type || '') + '">' + (typeLabel[e.type] || '일정') + '</span></div>' +
    '</div>';
  }).join('');
}

function renderGurus() {
  const list = document.getElementById('list');
  const gs = (DATA.gurus && DATA.gurus.gurus) || [];
  if (!gs.length) {
    list.innerHTML = '<div class="no-art">거인 포트폴리오가 아직 수집되지 않았습니다 — 다음 자동 갱신을 기다려 주세요.</div>';
    return;
  }
  const note = '<div class="guru-note">SEC 13F 공시 기준 — 분기 1회 · 최대 45일 지연 공시 · 미국 상장 롱포지션만 포함됩니다. ' +
    '실제 현재 보유와 다를 수 있으며, 투자 권유가 아닙니다.' +
    (DATA.gurus.generated_label ? ' <span style="white-space:nowrap">(수집: ' + esc(DATA.gurus.generated_label) + ' KST)</span>' : '') + '</div>';
  list.innerHTML = note + gs.map((g, gi) => {
    const rows = (g.holdings || []).map((h, i) => {
      let cls = '', txt = h.chg || '―';
      if (txt === 'NEW') { cls = 'new'; txt = '신규'; }
      else if (txt.startsWith('+')) cls = 'up';
      else if (txt.startsWith('-')) cls = 'down';
      const bw = Math.min(100, (h.pct / (g.holdings[0].pct || 1)) * 100);
      return '<div class="guru-row">' +
        '<span class="guru-rank">' + (i + 1) + '</span>' +
        '<span class="guru-issuer">' + esc(h.name) + '</span>' +
        '<span class="guru-bar-wrap"><span class="guru-bar" style="width:' + bw + '%"></span></span>' +
        '<span class="guru-pct">' + h.pct + '%</span>' +
        '<span class="guru-chg ' + cls + '">' + esc(txt) + '</span>' +
      '</div>';
    }).join('');
    const exits = (g.exits && g.exits.length)
      ? '<div class="guru-exits"><b>전량 매도:</b> ' + g.exits.map(esc).join(' · ') + '</div>' : '';
    return '<div class="guru-block" id="guru-' + gi + '" onclick="toggleGuru(' + gi + ')">' +
      '<div class="guru-head"><span class="guru-name">' + esc(g.name_ko) + '</span>' +
      '<span class="guru-person">' + esc(g.person) + '</span>' +
      '<span class="guru-toggle">▼</span></div>' +
      '<div class="guru-tagline">' + esc(g.tagline) + '</div>' +
      '<div class="guru-body">' +
        '<div class="guru-meta">' + esc(g.period_label) + ' 보고 (공시 ' + esc(g.filed) + ') · 운용 $' +
          Number(g.total_b).toLocaleString() + 'B · ' + g.positions + '종목 중 TOP ' + (g.holdings || []).length +
          ' · 지분 증감은 전분기 대비</div>' +
        rows + exits +
      '</div>' +
    '</div>';
  }).join('');
}

function toggleGuru(gi) {
  const el = document.getElementById('guru-' + gi);
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.guru-block.open').forEach(b => b.classList.remove('open'));
  if (!wasOpen) { el.classList.add('open'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}

const TAG_COLOR = { '에세이': '#9c7a3a', '모델 발표': '#386ee1', '연구': '#2e9d87', '정책·규제': '#c05555', '투자·산업': '#7a6cc4', '기타': '#6a7390' };
function renderSignals(){
  const sg = (DATA.signals && DATA.signals.signals) || [];
  const label = (DATA.signals && DATA.signals.generated_label) || '';
  if (!sg.length) { document.getElementById('list').innerHTML =
    '<div class="empty-note">📡 신호 관측소 가동 준비 중 — 첫 수집 후 이곳에 실리콘밸리의 고신호 담론·발표가 잡힙니다.</div>'; return; }
  let html = '<div class="gen-note" style="font-size:12px;color:var(--text-muted);margin-bottom:14px">해커뉴스 300점↑ 집단 주목 + AI 랩 공식 발표 — 매일 자동 포착' + (label ? ' (최근 수집: ' + esc(label) + ' KST)' : '') + '</div>';
  const now = Date.now();
  // 고정 기간: 추천수 1000↑ 초신성급 = 30일, 그 외 필독 = 7일
  const pinDays = x => ((x.points || 0) >= 1000 ? 30 : 7);
  const isRecent = x => { const d = new Date((x.captured || '').replace(' ', 'T')); return !isNaN(d) && (now - d.getTime()) < pinDays(x) * 86400000; };
  const pinned = sg.filter(x => x.pin && isRecent(x));
  // 표시 문턱: HN 신호는 추천수 400점 이상만 노출 (수집·보관은 300점부터 계속 —
  // 문턱만 낮추면 과거분도 재등장). 포인트 없는 공식 발표(RSS)와 필독 고정은 예외.
  const SHOW_MIN_POINTS = 400;
  const rest = sg.filter(x => !pinned.includes(x)
    && (x.points == null || x.points >= SHOW_MIN_POINTS));
  // 재배치: 고정(필독)은 최상단 유지, 그 안에서도·나머지도 추천수(▲) 많은 순.
  // 포인트 없는 공식 발표(RSS)는 동률(0점) 취급 — 같은 점수끼리는 최신 수집순.
  const byVotes = (a, b) => ((b.points || 0) - (a.points || 0))
    || String(b.captured || '').localeCompare(String(a.captured || ''));
  pinned.sort(byVotes);
  rest.sort(byVotes);
  const card = (x, pin) => {
    const tag = x.tag || '기타';
    return '<div class="sig-card' + (pin ? ' pin' : '') + '">' +
      (pin ? '<div class="sig-pin-label">📌 필독 신호 — 관제탑 지정</div>' : '') +
      '<div class="sig-meta">' +
      '<span class="sig-tag" style="background:' + (TAG_COLOR[tag] || '#6a7390') + '">' + esc(tag) + '</span>' +
      (x.points ? '<span class="sig-points">▲ ' + x.points + '</span>' : '') +
      '<span>' + esc(x.source || '') + (x.captured ? ' · ' + esc(x.captured.slice(5, 16)) : '') + '</span></div>' +
      '<a href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer" class="sig-link">' +
      '<div class="sig-title">' + esc(x.ko || x.title) + '</div>' +
      (x.ko ? '<div class="sig-title-en">' + esc(x.title) + '</div>' : '') + '</a>' +
      (x.why ? '<div class="sig-why">' + esc(x.why) + '</div>' : '') +
    '</div>';
  };
  if (pinned.length) html += pinned.map(x => card(x, true)).join('');
  html += rest.map(x => card(x, false)).join('');
  document.getElementById('list').innerHTML = html;
}

// 🔬 필독 해부실 — 필독 신호 원문의 문단별 한국어 브리핑 (전문 번역 아님)
const DX_NOTICE = '본 글은 원문의 논지를 재서술한 브리핑이며 전문 번역이 아닙니다.';
function renderDissect(){
  const items = (DATA.translations && DATA.translations.items) || [];
  const label = (DATA.translations && DATA.translations.generated_label) || '';
  if (!items.length) { document.getElementById('list').innerHTML =
    '<div class="empty-note">🔬 해부실 준비 중 — 필독 신호가 지정되면 원문을 문단별로 해부해 이곳에 싣습니다.</div>'; return; }
  let html = '<div class="gen-note" style="font-size:12px;color:var(--text-muted);margin-bottom:14px">필독 신호의 원문을 문단·섹션 단위로 재서술한 한국어 브리핑' + (label ? ' (최근 해부: ' + esc(label) + ' KST)' : '') + '</div>';
  html += '<div class="ud-index"><div class="ud-index-title">해부 목록 ' + items.length + '건</div>' +
    items.map(it => '<a class="ud-index-row" href="#dx-' + esc(it.id) + '">' +
      '<span class="ud-index-date">' + esc(it.date || '') + '</span>' +
      esc(it.ko_title || it.title) + '</a>').join('') + '</div>';
  const colLinks = (DATA.translations && DATA.translations.column_links) || {};
  html += items.map(it => {
    const secs = (it.sections || []).map(s =>
      '<div class="dx-sec"><h4>' + esc(s.h || '') + '</h4><p>' + esc(s.ko || '') + '</p></div>').join('');
    // 역방향 링크 — 이 원문으로 쓴 관측일지 칼럼이 있을 때만 (영구 슬러그 #log-)
    const slug = colLinks[it.id];
    return '<div class="dx-card" id="dx-' + esc(it.id) + '">' +
      '<div class="dx-meta"><span class="dx-badge">🔬 해부</span>' +
        '<span>' + esc(it.source || '') + (it.date ? ' · ' + esc(it.date) : '') + '</span></div>' +
      '<div class="dx-title">' + esc(it.ko_title || it.title) + '</div>' +
      (it.ko_title && it.title ? '<div class="dx-orig">' + esc(it.title) + '</div>' : '') +
      '<a class="dx-src" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">원문 읽기 ↗</a>' +
      '<div class="dx-actions">' +
        '<button onclick="dxCopyLink(event,\'' + esc(it.id) + '\')">🔗 링크 복사</button>' +
        (slug ? '<a href="observatory.html#' + esc(slug) + '">📄 칼럼 보기 →</a>' : '') +
      '</div>' +
      secs +
      (it.caveat ? '<div class="dx-caveat">⚠ ' + esc(it.caveat) + '</div>' : '') +
      '<div class="dx-notice">' + DX_NOTICE + ' 인용은 최소한으로 제한했으며, 정확한 표현·수치는 위 원문을 확인해 주십시오.</div>' +
    '</div>';
  }).join('');
  document.getElementById('list').innerHTML = html;
  openDissectFromHash();
}

// 해부 글 영구 링크 복사 — 관측일지 copyColLink와 같은 문법(복사 + 완료 피드백)
function dxCopyLink(ev, id){
  ev.preventDefault(); ev.stopPropagation();
  const btn = ev.target;
  const url = location.origin + location.pathname.replace(/[^/]*$/, '') + 'research.html#dx-' + id;
  const done = () => { const o = btn.textContent; btn.textContent = '✓ 복사됨'; setTimeout(() => { btn.textContent = o; }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done, () => window.prompt('아래 주소를 복사하세요 (Ctrl+C):', url));
  } else {
    window.prompt('아래 주소를 복사하세요 (Ctrl+C):', url);
  }
}

// #dx-… 진입 처리 — 관측일지 openFromHash와 동일 패턴
function openDissectFromHash(){
  const h = location.hash.replace('#', '');
  if (!h.startsWith('dx-')) return;
  const card = document.getElementById(h);
  if (card) setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
}

function setGroup(g, btn) {
  document.querySelectorAll('.group-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (g === 'calendar') renderCalendar(); else if (g === 'gurus') renderGurus(); else if (g === 'signals') renderSignals(); else if (g === 'dissect') renderDissect(); else render(g);
}

document.addEventListener('DOMContentLoaded', function () {
  if (DATA.generated_label) {
    document.getElementById('genLabel').textContent = '마지막 수집: ' + DATA.generated_label + ' KST';
  }
  // 해부실 딥링크 (#dx-…) — 관측일지 '해부실에서 보기'·해부 글 링크 복사가 이 경로로 들어온다
  // (관측일지의 #log- 진입 처리와 같은 패턴: 탭을 열면 렌더 끝에서 openDissectFromHash가 스크롤)
  if (location.hash && location.hash.indexOf('#dx-') === 0) {
    const btn = document.querySelector('.group-tab[data-g="dissect"]');
    if (btn) { setGroup('dissect', btn); return; }
    renderDissect();
    return;
  }
  // 순수 탭 해시 딥링크 (#signals·#dissect·#calendar·#gurus) — 메인 STAGE 3 버튼이 이 경로로 들어온다
  // #dx- 분기를 지난 뒤이므로 해부실 영구 슬러그와 충돌하지 않는다
  const tabHash = { '#signals': 'signals', '#dissect': 'dissect',
    '#calendar': 'calendar', '#gurus': 'gurus' }[location.hash];
  if (tabHash) {
    const btn = document.querySelector('.group-tab[data-g="' + tabHash + '"]');
    if (btn) { setGroup(tabHash, btn); return; }
  }
  render('universe');
});
</script>
<!-- uv-presence -->
<script type="module">
(async () => {
  try {
    const cfg = await (await fetch('data/firebase_config.json?v=' + Date.now())).json();
    if (!cfg || !cfg.apiKey) return;
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const { getFirestore, doc, setDoc, collection, query, where, Timestamp, serverTimestamp, getCountFromServer } =
      await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const db = getFirestore(initializeApp(cfg, 'presence'));

    let pid = localStorage.getItem('uv_pid');
    if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem('uv_pid', pid); }

    const beat = () => setDoc(doc(db, 'presence', pid), { t: serverTimestamp() }).catch(() => {});
    const count = async () => {
      try {
        const cutoff = Timestamp.fromMillis(Date.now() - 2 * 60 * 1000);
        const snap = await getCountFromServer(query(collection(db, 'presence'), where('t', '>', cutoff)));
        const n = snap.data().count;
        if (n > 0) {
          let el = document.getElementById('uvPresence');
          if (!el) {
            const ft = document.querySelector('.site-footer') || document.querySelector('footer');
            if (!ft) return;
            el = document.createElement('div');
            el.id = 'uvPresence';
            el.style.cssText = 'margin-top:8px;font-size:12px;color:var(--text-muted,#8a8577);';
            ft.appendChild(el);
          }
          el.innerHTML = '<span style="color:var(--gold,#9C7A3A)">✦</span> 지금 ' + n + '명이 우주를 관측 중';
        }
      } catch (e) {}
    };
    await beat(); await count();
    setInterval(beat, 60 * 1000 + Math.floor(Math.random() * 5000));
    setInterval(count, 60 * 1000 + Math.floor(Math.random() * 5000));
  } catch (e) {}
})();
</script>
