<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리서치 · 우주지배자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root, [data-theme="light"] {
  --bg: #FAF6EC; --bg-card: #FFFFFF; --header-bg: rgba(250, 246, 236, 0.95);
  --text: #1A2438; --text-secondary: #525F7E; --text-muted: #8590AA;
  --gold: #9C7A3A; --gold-bg: #F0E6CC;
  --line: #E8DFC9; --line-strong: #C9BC9A;
}
[data-theme="dark"] {
  --bg: #0A0E14; --bg-card: #1C2330; --header-bg: rgba(10, 14, 20, 0.95);
  --text: #FFFFFF; --text-secondary: #B5BFD6; --text-muted: #6F7E9E;
  --gold: #D4A658; --gold-bg: #2A2519;
  --line: #2A3142; --line-strong: #3A4458;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard Variable', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  font-feature-settings: 'tnum', 'ss01'; line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  min-height: 100vh; display: flex; flex-direction: column;
}
.container { max-width: 720px; margin: 0 auto; padding: 0 20px; width: 100%; }

.site-header { background: var(--header-bg); border-bottom: 1px solid var(--line); }
.site-header-inner { max-width: 720px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; color: var(--text); }
.brand a { text-decoration: none; color: inherit; display: flex; gap: 8px; align-items: center; }
.brand-star { color: var(--gold); }
.brand-tag { font-size: 13px; font-weight: 500; color: var(--text-muted); }
.header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.update-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: var(--gold-bg);
  border-radius: 100px; font-size: 12px; font-weight: 700;
  color: var(--gold); font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .update-badge { border: 1px solid rgba(212,166,88,0.3); }
.update-badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); animation: pulse 2s ease-in-out infinite;
}
[data-theme="dark"] .update-badge::before { box-shadow: 0 0 8px var(--gold); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.rate-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 12px; background: var(--bg-card);
  border: 1px solid var(--line); border-radius: 100px;
  font-size: 12px; font-weight: 700; color: var(--text-secondary);
  font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.rate-badge:hover { border-color: var(--gold); }
.rate-badge:hover #usdKrwDisplay, .rate-badge:hover .rate-badge-arrow { color: var(--gold); }
.rate-badge-arrow { font-size: 10px; margin-left: 2px; color: var(--text-muted); opacity: 0.7; transition: color 0.2s, opacity 0.2s; }
.rate-badge:hover .rate-badge-arrow { opacity: 1; }
.rate-badge #usdKrwDisplay { color: var(--text); font-weight: 800; }
@media (max-width: 480px) { .rate-badge { font-size: 11px; padding: 5px 10px; } .update-badge { font-size: 11px; padding: 5px 10px; } }
@media (max-width: 380px) { .update-badge::before { display: none; } }

.theme-toggle {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--bg-card);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
}
.theme-toggle svg { width: 18px; height: 18px; }
.icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: none; }
[data-theme="dark"] .icon-sun { display: inline; }

.site-nav { position: sticky; top: 0; z-index: 50; background: var(--header-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
.site-nav-inner { max-width: 720px; margin: 0 auto; display: flex; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
.site-nav-inner::-webkit-scrollbar { display: none; }
.nav-tab { flex-shrink: 0; padding: 14px 18px; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-muted); text-decoration: none; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
.nav-tab:hover { color: var(--text-secondary); }
.nav-tab.active { color: var(--text); border-bottom-color: var(--gold); }

main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 0; }

.placeholder-card {
  text-align: center;
  padding: 56px 32px;
  border: 1px dashed var(--line-strong);
  border-radius: 16px;
  background: var(--bg-card);
  max-width: 480px;
  width: 100%;
}
.placeholder-icon { font-size: 56px; margin-bottom: 16px; }
.placeholder-eyebrow {
  font-size: 11px; font-weight: 800; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
}
.placeholder-title {
  font-size: 30px; font-weight: 800; letter-spacing: -0.03em;
  color: var(--text); margin-bottom: 12px;
}
.placeholder-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.6; }
.placeholder-note { font-size: 12px; color: var(--text-muted); margin-top: 18px; }

/* ── 리서치 목록 ── */
main.research-main { display: block; align-items: stretch; padding: 36px 0 60px; }
.page-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.page-title { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px; }
.page-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; }
.gen-label { font-size: 12px; color: var(--text-muted); margin-bottom: 22px; }
.group-tabs { display: flex; gap: 8px; margin: 18px 0 22px; }
.group-tab { padding: 8px 16px; border-radius: 100px; border: 1px solid var(--line); background: var(--bg-card); font-size: 13px; font-weight: 700; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
.group-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.stock-block { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; }
.stock-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.stock-rank { font-size: 12px; font-weight: 800; color: var(--gold); }
.stock-name { font-size: 16px; font-weight: 800; }
.stock-ticker { font-size: 12px; color: var(--text-muted); }
.art { display: block; padding: 9px 0; border-top: 1px solid var(--line); text-decoration: none; }
.art:hover .art-title { color: var(--gold); }
.art-title { font-size: 13.5px; font-weight: 600; color: var(--text); line-height: 1.45; transition: color 0.15s; }
.art-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
.art-orig { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; font-style: italic; }
.art-summary { margin: 7px 0 2px; padding-left: 2px; list-style: none; }
.art-summary li { font-size: 12.5px; color: var(--text-secondary); line-height: 1.55; padding-left: 12px; position: relative; margin-bottom: 3px; }
.art-summary li::before { content: ''; position: absolute; left: 0; top: 8px; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }
/* ── 주요일정 ── */
.cal-item { display: flex; align-items: flex-start; gap: 14px; background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
.cal-date { min-width: 76px; text-align: center; }
.cal-date .d { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.cal-date .dday { display: inline-block; margin-top: 3px; font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 100px; background: var(--gold-bg); color: var(--gold); }
.cal-date .dday.today { background: var(--gold); color: #fff; }
.cal-body { flex: 1; }
.cal-title { font-size: 13.5px; font-weight: 600; line-height: 1.5; }
.cal-type { display: inline-block; margin-top: 4px; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 100px; border: 1px solid var(--line); color: var(--text-muted); }
.cal-type.macro { border-color: var(--gold); color: var(--gold); }
.no-art { font-size: 12.5px; color: var(--text-muted); padding: 6px 0; }
@media (max-width: 480px) { .page-title { font-size: 24px; } .stock-block { padding: 14px 16px; } }

.site-footer { padding: 24px 0 40px; border-top: 1px solid var(--line); text-align: center; }
.footer-brand { display: flex; justify-content: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text-secondary); }
.footer-link { color: var(--text-secondary); text-decoration: none; font-weight: 700; }
.footer-link:hover { color: var(--gold); }
.footer-divider { color: var(--text-muted); font-weight: 400; }

/* ── 거인의 어깨 ── */
.guru-block { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; margin-bottom: 12px; cursor: pointer; transition: border-color 0.15s; }
.guru-block:hover { border-color: var(--gold); }
.guru-block.open { cursor: default; padding-bottom: 20px; }
.guru-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 2px; }
.guru-name { font-size: 17px; font-weight: 800; }
.guru-person { font-size: 13px; color: var(--gold); font-weight: 700; }
.guru-toggle { margin-left: auto; font-size: 12px; color: var(--text-muted); transition: transform 0.2s; }
.guru-block.open .guru-toggle { transform: rotate(180deg); }
.guru-tagline { font-size: 12.5px; color: var(--text-muted); }
.guru-body { display: none; }
.guru-block.open .guru-body { display: block; }
.guru-block.open .guru-tagline { margin-bottom: 10px; }
.guru-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; font-variant-numeric: tabular-nums; }
.guru-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.guru-rank { width: 22px; color: var(--text-muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.guru-issuer { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 지분율 막대 — 메인 TOP 20 중력바(.stock-grav)와 같은 문법: 얇은 트랙 + 둥근 캡 + 오로라 그라데이션 */
.guru-bar-wrap { flex: 0 0 90px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.guru-bar { display: block; height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--gold), #f2ba3c); transition: width 0.5s ease; }
/* 밤에는 배경이 어두워 막대가 납작해 보인다 — 아주 옅은 발광으로 띄운다 */
[data-theme="dark"] .guru-bar { box-shadow: 0 0 6px rgba(139,147,255,0.35); }
.guru-pct { width: 48px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; flex-shrink: 0; }
.guru-chg { width: 52px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-muted); flex-shrink: 0; }
.guru-chg.new { color: var(--gold); font-weight: 800; }
.guru-chg.up { color: #1a9850; }
.guru-chg.down { color: #d73027; }
.guru-exits { margin-top: 12px; font-size: 12.5px; color: var(--text-muted); }
.guru-exits b { color: var(--text-secondary); }
.guru-note { font-size: 12px; color: var(--text-muted); margin: 4px 0 18px; line-height: 1.6; }
@media (max-width: 520px) { .guru-bar-wrap { display: none; } .guru-chg { width: 44px; } }
@media (max-width: 480px) { .nav-tab { padding: 12px 14px; font-size: 13px; } .placeholder-title { font-size: 24px; } }
:root { --cal-blue: #2f62c9; --cal-blue-bg: rgba(47,98,201,0.10); --cal-wknd: rgba(0,0,0,0.045); }
[data-theme="dark"] { --cal-blue: #8fb0f5; --cal-blue-bg: rgba(56,110,225,0.2); --cal-wknd: #161b2b; }

/* ── 🔬 필독 해부실 (신호 관측소 카드 문법 그대로) ── */
/* 목차 카드·헤어라인 행은 공용 .ud-index-* (build_site 의 ud-index-v1).
   관측노트 동행 탭 에세이 목차가 같은 문법을 쓴다 — 한 곳에서만 정의한다. */
.dx-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; margin-bottom: 16px; scroll-margin-top: 90px; }
.dx-card:target { border-color: var(--gold); }
.dx-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; font-size: 11px; color: var(--text-muted); }
.dx-badge { font-size: 10.5px; font-weight: 800; border-radius: 100px; padding: 2px 9px; background: var(--gold); color: #fff; }
.dx-title { font-size: 19px; font-weight: 800; line-height: 1.4; letter-spacing: -0.02em; }
.dx-orig { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; font-style: italic; line-height: 1.45; }
.dx-src { display: inline-flex; align-items: center; gap: 7px; margin: 12px 0 4px; padding: 10px 16px; border-radius: 100px;
  border: 1.5px solid var(--gold); color: var(--gold); font-size: 13.5px; font-weight: 800; text-decoration: none; }
.dx-src:hover { background: var(--gold); color: #fff; }
/* 해부 글 액션 — 관측일지 .col-share 문법 그대로 */
.dx-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 2px; }
.dx-actions button, .dx-actions a { padding: 6px 13px; border-radius: 100px; border: 1px solid var(--line); background: var(--bg); font-size: 12px; font-weight: 700; color: var(--text-secondary); cursor: pointer; font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; }
.dx-actions button:hover, .dx-actions a:hover { border-color: var(--gold); color: var(--gold); }
.dx-sec { margin-top: 18px; }
.dx-sec h4 { font-size: 15px; font-weight: 800; color: var(--gold); margin: 0 0 6px; letter-spacing: -0.01em; }
.dx-sec p { font-size: 14.5px; line-height: 1.85; color: var(--text-secondary); margin: 0; }
.dx-caveat { margin-top: 18px; padding: 12px 14px; border-left: 3px solid var(--line); font-size: 13px; color: var(--text-muted); line-height: 1.7; }
.dx-notice { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-muted); line-height: 1.6; }
/* 📡 신호 관측소 카드 — 해부실 .dx-* 와 같은 골격·같은 문법 */
.sig-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; margin-bottom: 16px; }
.sig-card.pin { border-color: var(--gold); border-width: 1.5px; }
.sig-pin-label { font-size: 10.5px; font-weight: 800; color: var(--gold); margin-bottom: 6px; }
.sig-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; font-size: 11px; color: var(--text-muted); }
.sig-tag { font-size: 10.5px; font-weight: 800; border-radius: 100px; padding: 2px 9px; color: #fff; }
.sig-points { font-size: 11px; font-weight: 800; color: var(--gold); }
.sig-link { text-decoration: none; color: inherit; }
.sig-title { font-size: 15.5px; font-weight: 800; line-height: 1.45; }
.sig-title-en { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.sig-why { font-size: 13px; color: var(--text-secondary); line-height: 1.65; margin-top: 8px; border-left: 3px solid var(--gold); padding-left: 10px; }
/* 신호·해부 공용 빈 상태 */
.empty-note { font-size: 13px; color: var(--text-muted); padding: 20px 0; }
@media (max-width: 480px) { .dx-card { padding: 18px 16px; } .dx-title { font-size: 17px; } .sig-card { padding: 18px 16px; } }
</style>
<style>
/* 헤더 모바일 일관성 + 실시간 날짜·시계 (전 페이지 공통 — build_site.py 주입) */
@media (max-width: 480px) {
  .site-header-inner { flex-wrap: wrap; }
  .brand { flex-shrink: 0; }
}
.update-badge .ud-clock { margin-left: 6px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
/* UNIVERTRIX 로고 (build_site.py 주입) */
.brand.ud-logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
/* ── UNIVERTRIX 종합 로고 (오로라×궤도×호흡×서예) ── */
.uvx{display:inline-flex;align-items:center;gap:13px;text-decoration:none}
.uvx-lat{position:relative;display:inline-block}
.uvx-word{font-size:20px;letter-spacing:.3em;font-weight:400;line-height:1;
  background:linear-gradient(95deg,var(--text) 12%,var(--gold) 46%,var(--aurora2) 62%,var(--text) 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-variation-settings:'wght' 528}
.uvx-orbit{position:absolute;inset:-12px -11px -8px -7px;width:calc(100% + 18px);height:calc(100% + 20px);pointer-events:none;overflow:visible}
.uvx-orbit path{stroke:var(--gold);opacity:.9}
.uvx-orbit circle{fill:var(--aurora2)}
.uvx-kr{font-family:'Nanum Brush Script',cursive;font-size:26px;line-height:1;padding-left:13px;border-left:1px solid var(--text-muted);white-space:nowrap;
  background:linear-gradient(95deg,var(--text) 10%,var(--gold) 42%,var(--aurora2) 60%,var(--text) 90%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent}
@media(prefers-reduced-motion:no-preference){
  .uvx-word{animation:uvbreath 6s ease-in-out infinite}
  .uvx-kr{animation:krbreath 6s ease-in-out infinite}
  @keyframes uvbreath{0%,100%{font-variation-settings:'wght' 340}50%{font-variation-settings:'wght' 800}}
  @keyframes krbreath{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
}
[data-theme="dark"] .uvx-word{filter:drop-shadow(0 0 13px rgba(139,147,255,.4))}
[data-theme="dark"] .uvx-kr{filter:drop-shadow(0 0 11px rgba(139,147,255,.35))}
@media(max-width:760px){.uvx{gap:9px}.uvx-word{font-size:15.5px;letter-spacing:.22em}.uvx-kr{font-size:20px;padding-left:9px}.uvx-orbit{inset:-9px -8px -6px -5px}}
.ud-logo-word .v { color: var(--gold); }
@media (max-width: 480px) { .ud-logo-word { font-size: 13.5px; letter-spacing: 0.16em; } .ud-logo-mark { height: 22px; } }

/* ud-hdr-refine-v2 — 상태 스트립 통합: 배지 3개 → 계기판 캡슐 하나 */
.site-header-inner { padding: 15px 20px; }
.header-right {
  gap: 0; background: var(--bg-card); border: 1px solid var(--line);
  border-radius: 100px; padding: 3px 5px 3px 4px; align-items: center;
  box-shadow: 0 1px 2px rgba(28,35,51,0.04);
}
.header-right .update-badge {
  background: transparent; border: none; border-radius: 0;
  padding: 5px 13px; color: var(--text-secondary);
}
[data-theme="dark"] .header-right .update-badge { border: none; }
.header-right .update-badge .ud-clock { color: var(--gold); font-weight: 800; }
.header-right .rate-badge {
  background: transparent; border: none; border-radius: 0;
  border-left: 1px solid var(--line); padding: 5px 13px;
}
.header-right .rate-badge:hover { border-color: var(--line); }
.header-right .rate-badge:hover #usdKrwDisplay, .header-right .rate-badge:hover .rate-badge-arrow { color: var(--gold); }
.header-right .theme-toggle {
  width: 34px; height: 30px; border: none; border-radius: 0 100px 100px 0;
  border-left: 1px solid var(--line); background: transparent; margin-left: 0;
}
.header-right .theme-toggle:hover { color: var(--gold); }
@media (max-width: 480px) {
  .header-right { padding: 2px 3px 2px 2px; }
  .header-right .update-badge, .header-right .rate-badge { padding: 4px 9px; }
}

/* ud-hdr-refine-v4 — 아이보리 복원: 헤더는 본문과 한 몸, 세련됨은 디테일에서.

가해 변동성을 직관적으로 파악할 수 있게 했다. 이와 함께 사용자가 검색 결과에서 유료 기사(페이월) 링크를 자동으로 제외하는 설정을 추가했다. 이 기능은 뉴스 산업에서 페이월 모델이 확산하는 가운데 사용자 선택권을 강화하는 움직임으로 읽힌다."}, {"h": "Assistant 채팅 기능 다각화와 스레드 관리 강화", "ko": "Assistant의 메시지 렌더링이 링크, 마크다운, 라텍스를 지원하도록 개선되었다. 사용자는 모든 스레드를 검색하고 최신순 또는 알파벳순으로 정렬할 수 있으며, '/' 명령어로 폴더별 필터링도 가능해졌다. 임시 스레드의 보관 기간을 24시간, 7일, 30일 중 선택할 수 있는 옵션도 추가되었고, 대시보드 설정 UI는 더 간결하게 개선되었다."}, {"h": "검색 기능 세부 개선과 API 안정성 버그 수정", "ko": "렌즈 기반 검색 페이지의 직접 URL이 숫자 대신 이름을 사용하도록 변경되어 가독성이 높아졌다. 키보드 단축키가 수정 키와 함께 눌렸을 때는 트리거되지 않도록 했다. 동시에 상류 연결 오류, 페이지 타임아웃 시 배치 데이터 손실, 통화 변환 위젯의 공식 명칭 미처리 등 기술적 버그들을 개별적으로 해결했다."}, {"h": "모바일 Assistant 앱 출시와 사용자 피드백 체계 정비", "ko": "Kagi는 iOS와 안드로이드용 네이티브 Assistant 앱을 출시해 사용자가 휴대폰에서 질문, 웹 탐색, 파일 작업, 심층 연구를 수행할 수 있게 했다. 모바일 앱의 첫 단계라며 향후 개선을 예고했다. Assistant 메시지 위에 마우스를 올려 썸스다운 버튼으로 피드백 양식을 열 수 있게 했고, 보고된 내용은 30일 후 자동 삭제된다는 투명성 정책을 명시했다. 설정에서 전체 스레드 내보내기 및 일괄 삭제 기능도 추가했다."}, {"h": "AI 기능 완전 비활성화 옵션과 사용자 통제 강화", "ko": "7월 30일 발표에서 Kagi는 검색 결과 페이지 UI를 개선해 필터, 도메인 옵션, 메뉴들의 접근성과 명확성을 높였다. 다음 단계로 환율 변환 위젯을 추가하여 여행 계획이나 해외 쇼핑 시 사용자 편의를 높였다. 동시에 「AI 기능이 필요할 때만 있고, 필요 없을 때는 없어야 한다」는 철학 아래 설정/AI에서 AI 기능 접근을 완전히 비활성화할 수 있는 옵션을 추가했다. Kagi는 이 결정이 AI에 계속 투자하는 와중에도 사용자 통제권을 우선시한다는 신호라고 설명했다."}, {"h": "주사위 위젯 기능 확장과 검색 위젯 커스터마이징", "ko": "사용자 요청에 응해 주사위 위젯이 면의 개수를 자유롭게 설정할 수 있도록 개선되었고, 동전 던지기 기능도 추가되었다. 사용자가 원치 않는 위젯을 개별적으로 끌 수 있는 전환 스위치를 settings/more_search에 배치했으며, 각 토글에는 해당 위젯의 기능을 설명하는 링크를 포함시켜 이용자가 정보에 입각한 선택을 할 수 있도록 했다."}, {"h": "Orion 브라우저 1.1 메이저 업데이트와 컨테이너 기능", "ko": "Orion은 macOS용 1.1 버전을 출시했는데, 이는 역사상 가장 중요한 업데이트로 평가되며 170개 이상의 개선사항을 포함한다. Apple의 LiquidGlass와 달리 Orion은 컨테이너 기능을 도입했는데, 각 탭이 완전히 격리되어 같은 창에서 여러 계정으로 동일 사이트에 로그인할 수 있다. 투명 테두리, 단색, 그래디언트, 자동 색상 매칭 등 다양한 테두리 스타일을 제공하며, 사용자가 Apple의 디자인 언어에 맞춘 옵션을 선택할 수 있도록 했다. Orion은 무료이지만 사용자 데이터를 광고주에게 팔지 않는 독립성을 보장하는 지원 계획을 제공한다."}, {"h": "Kagi News/Translate 무료 서비스 일시 중단과 구독 전환", "ko": "Kagi News와 Kagi Translate는 예상을 뛰어넘는 성공으로 전 세계 사용자들이 자신의 언어로 스트레스 없이 뉴스를 읽고 주제를 추가할 수 있다는 점, 문맥 기반의 고품질 번역이라는 점에서 호평받았다. 그러나 이런 인기로 인해 무료 서비스의 운영 비용이 대폭 증가하자, Kagi는 일시적으로 번역 기능을 제거하고 원어와 영어만 남겨두었다. Kagi Translate는 향후 구독 기반 서비스로 전환하겠다고 공시했다."}, {"h": "각종 버그 수정과 기능 개선 (다중 이슈 통합)", "ko": "6월 16일 발표 이후 Kagi는 스포츠 스코어 위젯과 주사위 굴리기 기능을 추가해 검색 위젯 개선 작업을 시작했다. 스포츠 스코어는 검색 결과 옆 사이드바에 표시되어 경기일정, 실시간 점수, 최근 결과를 빠르게 확인할 수 있게 했다. 동시에 '@import' 검색 오류, 일부 렌즈 미작동, 안전 검색 온 상태에서 부적절한 결과 표시, 독일어 인터페이스에서 날씨 위젯 미작동 등 개별 이슈들을 해결했다."}], "caveat": "원문은 2026년 기준의 제품 업데이트 로그이므로, 현재 시점에서는 일부 기능의 상태가 변했을 수 있으며, Kagi의 구체적인 성능 개선이나 비용 절감 효과는 공개되지 않은 점을 고려해 읽어야 한다."}, {"id": "e2dc35a6be96", "date": "2026-08-21", "title": "AliExpress runs silent WebAudio fingerprinting that breaks Bluetooth multipoint", "ko_title": "알리익스프레스의 숨은 오디오 추적: 블루투스 멀티포인트를 방해하는 핑거프린팅 기술", "source": "Hacker News 300+", "url": "https://blog.laserphile.com/2026/08/aliexpress-webpage-keeping-multipoint.html", "sections": [{"h": "블루투스 멀티포인트 연결이 끊기는 이상 현상", "ko": "저자는 PC와 휴대폰에 동시 연결되는 블루투스 멀티포인트 헤드폰을 사용 중이었다. 정상적으로는 PC에서 오디오가 재생되면 휴대폰 오디오는 대기 상태지만, 알리익스프레스 페이지를 열면 휴대폰의 음악이 즉시 중단되었다. 탭을 닫으면 문제가 바로 해결되었고, 페이지 음소거나 브라우저·시스템 음소거는 효과가 없었다. 시각적으로 재생 중인 비디오나 음악이 없었으므로 관습적인 미디어 요소로는 원인을 파악할 수 없었다."}, {"h": "숨겨진 웹 오디오 컨텍스트 발견", "ko": "저자는 페이지가 로드된 후 몇 초 뒤에 문제가 발생한다는 점에 주목했다. 일반적인 미디어 요소 대신 웹 오디오 API를 감시하기로 결정했고, AudioContext 생성자를 래핑하여 오디오 처리 컨텍스트 생성을 추적했다. 알리익스프레스 홈페이지 로드 중에 두 개의 AudioContext 객체가 생성되었으며, 둘 다 running 상태로 전환되고 노드를 AudioContext.destination에 연결했다. 이 두 컨텍스트는 collina.js와 fireyejs.js라는 스크립트에서 비롯되었으며, 모두 알리바바의 브라우저 보안 및 악용 방지 도구(AWSC)로 보였다."}, {"h": "웹 오디오 핑거프린팅의 작동 원리", "ko": "두 스크립트는 심하게 난독화되어 있었지만, AI 분석으로 오디오 코드의 작동 방식을 파악할 수 있었다. 코드는 알려진 파형을 생성하고, 분석기로 브라우저의 오디오 처리를 거친 후 결과를 측정하며 주파수 데이터를 읽었다. 게인을 0으로 설정하여 사용자가 소리를 듣지 못하도록 했지만, 그래프는 여전히 시스템 오디오 대상에 연결되어 있었다. 최종 볼륨이 0이어도 그래프를 대상에 연결하면 브라우저가 적극적으로 처리하도록 강제했고, 저자의 경우 이것이 PC의 블루투스 오디오 경로를 활성 상태로 유지하여 멀티포인트 헤드폰이 휴대폰으로 깔끔하게 전환되지 못하게 방해했다."}, {"h": "포괄적인 브라우저·기기 지문 수집", "ko": "스크립트 묶음의 조사로 웹 오디오 테스트만이 아닌 광범위한 측정 기능을 발견했다. WebGL 렌더러 정보, 확장 기능, 셰이더 정밀도뿐만 아니라 결과를 직렬화하고 암호화하며 알리바바 원격 측정 서비스에 요청하고 fetch() 또는 sendBeacon()으로 데이터를 전송하는 코드가 있었다. 오디오 핑거프린팅은 브라우저 버전, 운영 체제, 오디오 라이브러리, 하드웨어의 미세한 차이가 동일한 신호에서 서로 다른 결과를 생성하기 때문에 작동한다. 이 기법은 단독으로는 기기를 고유하게 식별하기에 충분하지 않지만, 캔버스, WebGL, 하드웨어, 타이밍, 상호작용 데이터와 결합하면 훨씬 더 유용해진다."}, {"h": "알리익스프레스의 사용 목적 추정", "ko": "저자는 수집된 데이터가 서버에 도달한 후 어떻게 사용되는지 확인할 수 없었으며, 영구적인 기기 식별자로 쓰일 수도 있고 부정행위 또는 봇 탐지 점수의 한 입력값일 수도 있다고 추정했다. 알리익스프레스는 자동화되거나 의심스러운 클라이언트를 일반 쇼핑객과 구분하고, 사용자 브라우징 습관을 추적할 이유가 충분했다. 플랫폼은 계정 탈취, 가짜 계정, 자동 크롤링, 자동 구매, 결제 사기, 리뷰 조작, 쿠폰 악용 등과 싸워야 했고, 대부분의 대형 비즈니스처럼 사용자 행동 데이터를 마케팅에 활용했다. 쿠키는 삭제·복사·교체될 수 있어 신뢰할 수 없었으므로, 많은 독립적인 브라우저 측정으로 만들어진 핑거프린트가 더 조작하기 어려웠다."}, {"h": "부정행위 방지와 사용자 경험의 불일치", "ko": "상호작용 데이터는 브라우저가 사람인지 자동화 도구인지 판단하는 데도 도움이 될 수 있었으며, 알리익스프레스 관점에서는 부정행위를 줄이고 신뢰할 수 있는 고객을 CAPTCHA 없이 통과시킬 수 있었다. 그러나 저자는 쇼핑 홈페이지가 음성, 그래픽, WebRTC, 하드웨어, 모션 API 등을 몰래 가동하여 행동을 추적하는 것을 원하지 않았으며, 특히 음악을 차단하는 성가신 효과 때문에 더욱 그랬다. 저자가 이 문제에 주목하지 않았다면 알리익스프레스가 무엇을 하고 있는지 알아채지 못했을 것이다."}, {"h": "블로킹 규칙과 실제 효과", "ko": "저자는 두 가지 확인된 스크립트 계열을 차단하고 통제 캡처 중 AudioContext 객체나 대상 연결이 나타나지 않았는지 테스트했다. Firefox의 uBlock Origin 확장 프로그램을 사용하여 collina.js와 fireyejs.js 요청을 막는 맞춤형 규칙을 적용했고, 알리익스프레스 홈페이지는 계속 렌더링되었다. 이 규칙들은 의도적으로 좁게 설계되어 해당 두 스크립트 계열만 알리익스프레스에서 요청할 때만 차단했다. 저자는 미래에 이것이 작동하지 않을 수도 있다고 예상했다."}, {"h": "기술적 정당성과 실제 피해의 간극", "ko": "부정행위 방지 사용 사례는 이해할 수 있었지만, 이 구현에는 실제 문제가 있었다. 민감한 작업 전에 일반 쇼핑 홈페이지에서 실행되었고, 광범위한 기기 및 행동 측정을 수집했으며, 구현이 의도적으로 검사하기 어려웠고, 페이지가 라이브 오디오 처리 그래프를 시작했다는 가시적 표시가 없었다. 가장 중요하게는 실제 하드웨어 부작용이 발생했다. 침묵한 핑거프린팅 테스트가 블루투스 멀티포인트 전환에 방해했으면서도 브라우저의 음소거 기능은 무용지물이었다. 저자는 숨은 분석 또는 보안 기능이 오디오 경로를 강하게 장악하여 외부 기기 동작까지 바꿀 수 있다면 차단이 합당한 절충안이라고 봤다."}, {"h": "투명성 부재와 신뢰 문제", "ko": "저자는 알리익스프레스가 핑거프린트를 얼마나 오래 저장하거나 다른 알리바바 속성에 사용하는지 증명할 수 없었다. 클라이언트 코드는 광범위한 핑거프린팅 같은 측정이 수집되고 전송됨을 증명했지만, 서버 측 보관과 신원 연결은 브라우저에서 볼 수 없었다. 저자는 인터넷의 누구를 정말 신뢰할 수 있는지 의문을 제기했다."}, {"h": "결론: 문제 진단과 해결책", "ko": "알리익스프레스 홈페이지는 두 개의 실행 중인 웹 오디오 그래프를 알리바바의 난독화된 보안 스크립트에서 몰래 생성했다. 이 그래프는 광범위한 브라우저 핑거프린팅의 일부로 파형을 생성하고 분석했으며, 게인이 0인 노드를 통해 시스템 오디오 대상에 연결하여 사용자가 듣지 못하게 했다. 저자의 설정에서 이것은 PC의 블루투스 오디오 경로를 활성화 상태로 유지하여 멀티포인트 헤드폰이 휴대폰으로 돌아가지 못하게 방해했다. 탭 음소거는 기존 미디어 요소가 없어 작동하지 않았다. collina.js와 fireyejs.js를 위의 uBlock Origin 규칙으로 차단하면 숨겨진 오디오 컨텍스트 생성이 방지되어 알리익스프레스를 열람하면서도 음악을 방해받지 않고 들을 수 있었다."}], "caveat": "저자가 실험한 환경은 Firefox와 Chrome 일부 버전(다른 브라우저는 미검증)이며, 알리익스프레스의 의도와 데이터 사용 목적은 추정일 뿐 확실하지 않으므로 원문 링크와 Firefox 개발자 추가 분석을 함께 참고하여야 합니다."}, {"id": "af863cb3b215", "date": "2026-08-21", "title": "Patterns and problems in multiagent systems", "ko_title": "AI 에이전트 시스템의 협력과 붕괴 위험: 대규모 운영 환경의 숨은 문제들", "source": "Anthropic", "url": "https://www.anthropic.com/research/multiagent-systems", "sections": [{"h": "에이전트 시대의 도래와 제도의 불안정성", "ko": "AI 모델이 빠르게 진화하면서 에이전트들이 공유 코드베이스, 시장, 사회 시스템 같은 실제 환경에서 점점 더 많은 역할을 담당하게 되고 있다. 에이전트 간 상호작용이 대규모로 늘어나는 것은 이제 피할 수 없는 상황이다. 현재의 제도와 기관들은 인간의 감시 속도를 전제하고 인간에 의해 설계되었으므로, 에이전트의 속도와 효율성에 밀릴 가능성이 크다. 인간-AI 하이브리드 시스템도 생기겠지만, 속도나 비용에서 에이전트가 우월한 영역은 에이전트만의 영역으로 변할 수 있다. 문제는 에이전트 간 상호작용의 규모가 인간 간, 또는 인간-에이전트 간 상호작용을 능가하기 전에 그것이 잘 작동하기 위한 조건을 이해할 시간이 충분하지 않을 수 있다는 점이다."}, {"h": "에이전트의 능력과 취약점의 불균형", "ko": "에이전트는 인간과 본질적으로 다르다. 더 오래 작동하고, 방대한 정보를 즉시 파악하며, 어느 개인보다 광범위한 지식을 갖춘다. 그러나 동시에 거짓 정보 생성과 보상 해킹에 취약하며, 정렬(alignment) 분야의 진전에도 불구하고 복잡한 현실의 다중 에이전트 환경에서 에이전트의 행동이 어떻게 나타나는지 거의 알지 못한다. 더욱 중요한 것은 개별 에이전트 수준에서 무해해 보이는 행동 특성이 시스템 수준에서 축적되어 예기치 않은 전역적 실패를 초래할 수 있다는 점이다. Anthropic은 현재의 최첨단 모델에서 나타나는 행동 경향을 파악하고, 그것이 어떻게 예상치 못한 시스템 장애를 만드는지 보여줌으로써 이러한 위험을 완화하는 논의를 시작하려 한다."}, {"h": "진정한 다중 에이전트 시스템의 현 상태", "ko": "현재 진정한 의미의 다중 에이전트 시스템은 아직 초기 단계에 있다. 에이전트들은 도구 사용에 탁월했고, 다른 에이전트를 잘 정의된 입력(프롬프트)과 출력(응답, 산출물)을 가진 도구 호출로 취급할 수 있는 한 효율적으로 협력해왔다. 하지만 에이전트들이 현재 어려워하는 부분은 서로를 고유한 목표와 행동을 가진 오래 지속되는 동료로 대하는 것인데, 이 경우 명확한 위계질서가 없다. 자율 에이전트가 세상에 점점 더 널리 퍼지고 더욱 까다로운 환경에서 작동하게 되면서, 효과적인 조율 능력을 갖추는 것이 필수적이 되었다."}, {"h": "병렬화 가능한 문제에서의 에이전트 군집의 성과", "ko": "소프트웨어 취약점 탐지는 다중 에이전트 군집이 즉시 활용할 수 있는 문제의 좋은 예다. 기존 방식은 개별 에이전트를 개별 코드베이스(또는 파일/모듈)에 할당해 병렬로 취약점을 찾게 하는 것이다. Anthropic은 이와 다른 접근을 시도했는데, 45개의 에이전트 각각에 가상 머신과 협력을 위한 공유 포럼을 제공하고 동일한 프롬프트로 15개 오픈소스 프로젝트의 취약점을 찾게 했다. 에이전트들에게 서로의 발견을 동료 검토하게 하고, 별도의 중재 에이전트가 최종 판단을 내리도록 했다. 조율하는 군집은 2,700만 토큰 사용으로 266개 취약점을 찾았고, 독립적 병렬 에이전트는 650만 토큰으로 21개를 찾았다. 다만 군집이 찾은 취약점의 약 절반은 독립 에이전트가 탐색하도록 지정된 핵심 디렉터리 밖에 있었다. 핵심 디렉터리로 범위를 제한하면 두 방식의 효율성이 비슷해진다. 두 방식은 상호보완적이었는데, 공통으로 발견한 취약점은 12개에 불과했다. 군집 내 에이전트들은 자신들이 생각하기에 가장 효과적으로 취약점을 캘 수 있는 곳에 집중할 수 있었고, 도구를 스스로 개발해 특정 유형의 취약점 발견에 특화되었다."}, {"h": "상호 의존적 프로젝트에서의 조율 실패", "ko": "앞의 실험과 달리, 에이전트들이 서로의 작업에 직접 의존하게 되면 조율이 훨씬 어려워진다. 대규모 소프트웨어 엔지니어링 프로젝트는 진화 과정에서 복잡하고 동적인 상호의존성을 갖는다. 이를 테스트하기 위해 Anthropic은 여러 에이전트 군집에 12시간 동안 텍스트 기반 웹 게임을 개발하도록 지시했다. 각 에이전트는 가상 머신, 공유 포럼, 자체 호스팅 저장소에 접근할 수 있었고, 모델 세대와 에이전트 수를 달리했다. 세 가지 프롬프트 버전을 시도했는데(기본형, 구체적 역할 지정, CEO 위계 지정), 모두 유사한 결과를 낳았다. 모든 경우 결과 게임은 인간 속도로 작동하지 않았고, 인터페이스는 난해했으며, 학습 곡선이 가팔랐다. 현재 모델들은 이 영역에서 미각이 부족하며 인간의 상당한 지도가 필요하다."}, {"h": "모델 세대별 협력 방식의 극명한 차이", "ko": "최종 산출물의 품질은 일관되게 낮았지만, 테스트한 모델 세대들(Sonnet 4.6과 5, Opus 4.6과 4.8, Mythos Preview)은 놀라울 정도로 다른 방식으로 조율했다. 두 가지 주요 지표를 추적했다: 마스터 브랜치에 병합된 풀 리퀘스트(PR)의 비율, 그리고 에이전트 간 코드 공유 정도다. 초기 모델(Sonnet 4.6, Opus 4.6)은 조율이 매우 미흡했는데, PR 병합 비율이 매우 낮아 충돌이 많았고 결국 포기되었다. 더 최신 모델(Opus 4.8, Mythos Preview)은 이 문제를 해결했지만 거의 협력하지 않음으로써다. 각 에이전트가 파일에 대한 소유권을 높게 유지해 충돌을 줄였다. 오직 가장 최신 모델인 Sonnet 5만이 공유 자원에서 작업하면서도(코드 공유도 높음) 높은 PR 처리량을 유지했다."}, {"h": "저분산 현상과 시스템적 붕괴의 위험", "ko": "게임 개발 실험에서 보인 조율 부족은 인간의 조율 실패와 유사한 측면이 있지만, 에이전트 조율의 다른 실패 방식은 완전히 다르다. 에이전트는 개별적으로 '저분산'이다. 같은 상황에서 사람들은 훨씬 다양한 행동을 하겠지만, 에이전트들은 매우 유사한 행동을 한다. 맥락, 스캐폴딩, 기저 모델만 다를 뿐이다. 이 요소들이 같거나 유사하면 행동 공간이 매우 크더라도 에이전트들은 매우 유사하게 행동한다. 따라서 한 에이전트의 나쁜 결정이 많은 에이전트에 의해 반복될 가능성이 높고, 고립된 문제가 빠르게 시스템적 실패로 확대될 수 있다. 같은 모델로 만든 30개 에이전트 중 18개가 정확히 동일한 깃 브랜치명 'mvp-game-loop'를 만들었다. 에이전트들이 단편 소설을 창작하고 비평하는 실험에서도 여러 실행마다 다수의 에이전트가 'The Cartographer's Last Commission'이라는 제목을 붙였다."}, {"h": "동형성이 초래하는 위험의 사례들", "ko": "에이전트들이 뭔가 인상적인 것을 각각 만들도록 요청받았을 때, 절반 이상이 레이 트레이서나 자체 호스팅 컴파일러를 만들기로 결정했다. 서로 소통할 수 있었음에도 비슷한 프로젝트를 추진한 에이전트들은 비슷한 실패에 맞닥뜨렸다. 소통이 가능한 반복 죄수의 딜레마 게임에서도 모든 에이전트가 동일한 전략에 도달했고 동시에 배신해서 전체 보상을 망쳤다. 실제로 조율하는 에이전트들은 배경이 다르고 따라서 맥락도 다를 것이고, 모두 클로드일 필요도 없기 때문에 더 높은 분산을 보일 것이다. 하지만 많은 에이전트가 같은 상황에 직면할 때, 그들의 행동은 인간보다 훨씬 더 유사할 것으로 예상된다. 이것이 중요한 이유는, 모든 에이전트가 같은 배팅이나 위험-보상 트레이드오프를 선택하면 시스템은 갑작스러운 붕괴에 더 취약해진다는 점이다. 모든 에이전트가 자원 배분에 대해 유사한 결정을 내리면 급격한 자원 부족이 발생한다."}, {"h": "자원 관리에서의 동시성 문제", "ko": "에이전트들에게 대역폭이 제한된 시스템의 작업 큐를 관리하도록 요청한 실험이 이를 실증했다. 에이전트들이 조율할 다른 수단이 없을 때, 동시에 같은 방식으로 자원을 배분하려고 시도해 시스템 장애를 초래했다. 이는 멀티에이전트 시스템에서 저분산이 단순히 비효율 문제가 아니라 시스템 안정성을 위협하는 핵심 위험이라는 점을 보여준다."}], "caveat": "이 연구는 Anthropic의 자체 모델(Claude 계열)에 국한된 실험이며, 다른 제공자의 에이전트나 더 이질적인 에이전트 구성에서 결과가 일반화되는지 검증되지 않았습니다."}, {"id": "c992986a594f", "date": "2026-08-21", "title": "Aaron Swartz was prosecuted for scraping, while Meta does it without consequence", "ko_title": "AI 학습 데이터 수집의 이중 기준: Aaron Swartz 기소 vs Meta의 무관용", "source": "Hacker News 300+", "url": "https://blog.curiousquail.com/im-upset-again-about-a-co-creator-of-rss-being-prosecuted-for-something-meta-is-doing-with-little-consequence/", "sections": [{"h": "Aaron Swartz 사건: 과도한 법적 처벌", "ko": "RSS 프로토콜 공동 개발자 Aaron Swartz는 학술 논문 데이터베이스 JSTOR에서 약 70기가바이트의 학술논문을 다운로드한 혐의로 기소되었다. 당국은 그를 35년의 징역형, 100만 달러의 벌금, 자산 압류라는 극형에 처하려 했으며, 이러한 과도한 처벌의 압박 속에서 Swartz는 결국 극단적 선택을 하게 되었다. 저자는 이를 법 체계에 의한 실질적 '암살'로 표현하며 사회 전체의 도덕적 실패로 지적하고 있다."}, {"h": "Meta의 대규모 데이터 수집: 경미한 법적 책임", "ko": "대조적으로 Meta(구 Facebook)는 AI 모델 학습을 위해 약 80테라바이트 규모의 도서 데이터를 대량 수집했음에도 법적 결과는 미미하다. Meta는 향후 법원 소송에서 경미한 금전적 벌금 정도만 받을 가능성이 높으며, 그 사이에도 AI 모델로부터 계속 수익을 창출하고 있다. 이는 Swartz가 직면한 가혹한 처벌과 현격하게 대비된다."}, {"h": "두 사건의 근본적 목적 차이", "ko": "저자는 양자의 법적 처우 불균형을 단순한 규모 차이로만 봐서는 안 된다고 강조한다. Swartz의 행동은 지식의 보급과 학술 자료의 아카이빙을 목표로 했고, Meta의 수집은 독점적 상용 AI 모델 개발이라는 명백히 다른 목적에서 비롯되었다. 저자는 Meta의 기술이 「환경에 해를 끼치고」 CEO의 정신 건강을 해치면서 세계 최고 부자를 더욱 부자로 만드는 체계라고 비판한다."}, {"h": "저자의 개인적 분노와 행동주의적 입장", "ko": "저자는 직접 만나본 적 없는 Swartz를 대신해 분노하며, 이 감정을 어디로 표출할지 모를 정도로 깊은 좌절감을 드러낸다. 이러한 심정이 저자를 더욱 급진적인 입장으로 이동시키고 있음을 인정하고 있으며, 글의 결말에서는 풍자적으로 기술 억만장자들에 대한 근본적 변화 필요성을 암시한다."}], "caveat": "저자의 개인적 분노와 급진화된 관점이 강하게 드러나 있으므로, 두 사건의 법적·기술적 세부 사항은 원문의 출처 링크와 각 사건의 공식 기록을 통해 독립적으로 검증할 필요가 있습니다."}, {"id": "3d03f9d3b9ed", "date": "2026-08-20", "title": "A joke domain purchase turned in geopolitical warfare", "ko_title": "날씨풍선 추적 사이트가 군사 인프라 노출로 국제 분쟁에 휘말리다", "source": "Hacker News 300+", "url": "https://sprocketfox.io/xssfox/2026/08/19/sondehub-and-war/", "sections": [{"h": "취미로 시작된 기상풍선 추적 플랫폼", "ko": "저자는 2017년 호주의 아마추어 기상풍선 커뮤니티에 입문했고, 당시 멜버른과 애들레이드 지역의 라디오존데(기상풍선의 송신기) 추적 정보가 하브허브라는 웹사이트에만 올라왔다. 2018년 5월 라디오존데 데이터 필터링을 위한 도메인 하나를 장난삼아 등록한 것이 시작이었다. 초기에는 기존 사이트로 단순 리다이렉트하는 수준의 조크였으나, 기상풍선 발사 데이터를 점점 많이 수집하면서 플랫폼이 성장했다."}, {"h": "인프라 증설과 정부 기관의 데이터 요청", "ko": "2019년 기상풍선 추적 수요가 급증하면서 독립 플랫폼 구축이 필요해졌다. 이 과정에서 보험 청구, 라디오존데 낙하 추적 등을 이유로 정부 기관들이 데이터를 요청하기 시작했다. 역방향 예측 기술을 도입하여 풍선 발사 지점을 추적할 수 있게 되자, 저자는 의도하지 않게 군사 기지와 포병 진지 위치를 지도화하고 있었음을 깨달았다. 이에 정당한 요청이 있을 때만 발사 지점 정보를 삭제하는 정책을 수립했다."}, {"h": "풍선 추적 데이터의 군사적 활용 가능성 발견", "ko": "풍향 데이터는 날씨 예측뿐 아니라 포병 사거리 계산에도 쓰인다는 점을 깨달은 저자는 자신의 플랫폼이 군사 용도로 활용될 수 있음을 인식했다. 역방향 예측 시스템은 군사 함정까지 탐지했고, 우크라이나 전쟁 초기부터 관련 요청과 접근이 급증했다. 2023년 중국 정찰풍선 사건과 그 직후 미군 에임-9X 사이드와인더로 아마추어 풍선을 격추한 사건 이후 언론 노출이 늘어나면서 트래픽이 크게 증가했다."}, {"h": "API 대량 접근 공격과 우크라이나 군 추정 연락", "ko": "2024년 12월 예측 API에 대한 집중적인 접근 공격이 발생했는데, 단일 IP에서 비롯된 것으로 파악되었다. 저자는 우크라이나 군사 채팅 채널에 러시아어로 메시지를 보내 스크립트를 올바르게 실행하도록 협력을 요청했다. AWS는 지원하되 서비스 중단이나 차단으로 인한 피해를 최소화하도록 신중하게 대응했으며, 저자는 자체 예측 시스템 운영을 위한 도커 이미지를 공개했다. 이러한 조치는 해당 플랫폼이 실제 군사 작전에 이용되고 있다는 강한 시사를 담고 있다."}, {"h": "미 국방부의 데이터 요청과 대가 문제", "ko": "2025년 미 국방부 산하 국방정보보안실이 소네허브의 데이터를 요청했다. 저자는 처음에는 군사 지원을 꺼렸으나, 데이터가 이미 공개되어 있으므로 외부 기관이 활용할 바에는 인프라 유지비라도 받기로 방침을 바꿨다. 청구서를 제출했으나 국방부로부터 응답이나 결제가 없었으며, 저자는 해당 요청의 목적을 알 수 없었다. 이 사건은 공개 데이터가 국가 안보 문제로 전환되는 과정을 보여준다."}, {"h": "항공 안전 기관과 민간 협력", "ko": "2025년 9월 미국 국가교통안전위원회(NTSB)는 유타 지역의 특정 시간대 기상풍선 정보를 요청했고, 이후 윈드본 사의 상업용 풍선이 항공기와 충돌했을 가능성이 제기되었다. 소네허브가 제공한 데이터는 정확한 충돌 기체 파악에 도움이 되었으며, 윈드본은 시스템 개선 조치를 취했다. 또한 항공 관제탑 운영자들이 기상풍선과의 충돌 회피를 위해 사전 조율을 요청하는 등, 민간 항공 부문의 풍선 추적 필요성이 증대되었다."}, {"h": "GPS 간섭·스푸핑 탐지와 다양한 정부 기관 접촉", "ko": "소네허브는 의도하지 않게 광범위한 GPS 간섭과 스푸핑 활동을 탐지하고 있었다. 저자는 이러한 패턴이 목표 식별 용이성이나 특정 방식의 차량 충돌을 목적으로 할 수 있다고 추측했다. 시간이 지나면서 해군 항공전 센터, 공군 연구소, 국립해양대기청, 각종 기상 센터 등 미 정부의 여러 부처로부터 다양한 목적의 이메일과 문의가 들어왔으며, 저자는 이를 통해 자신의 취미 프로젝트가 얼마나 광범위한 이해관계자들에게 영향을 미치는지 인식하게 되었다."}, {"h": "장비 제조사의 전략적 비협조", "ko": "라디오존데 제조사 메테올라보르(Meteolabor AG)는 전략적 이유를 들어 호환성 검증을 위한 샘플 기기나 데이터 제공을 거부했다. 제조사는 자신의 송신기가 일정 시간 후 자동으로 종료되도록 설계되었음을 밝혔다. 이는 기술 스펙 공개가 가져올 보안 리스크를 우려한 조치로 해석되며, 민간 추적 플랫폼의 성장이 장비 제조 업계와 국방 부문 간의 이해 대립을 낳고 있음을 드러낸다."}], "caveat": "저자는 2024년 말부터의 사건을 회고록 형식으로 서술하고 있으며, 우크라이나 군 협력을 포함한 군사적 활용에 대해 추정과 시사(暗示)에 의존하고 있어 공식 확인이 필요합니다."}, {"id": "67636947efe0", "date": "2026-08-19", "title": "The Amazon tax", "ko_title": "아마존의 검색광고 시스템: 소비자에게 떠넘기는 숨은 비용", "source": "Hacker News 300+", "url": "https://seths.blog/2026/08/the-amazon-tax/", "sections": [{"h": "검색광고로 주당 10억 달러 수익하는 아마존", "ko": "저자는 아마존의 검색광고 수익 구조를 '법적 절도'라고 표현하며 그 규모를 지적합니다. 아마존은 매주 약 10억 달러의 광고 수익을 올리고 있으며, 이는 전 직원에게 3만 5천 달러씩 현금 보너스를 줄 수 있는 규모입니다. 이는 아마존이 광고 사업에서 얼마나 큰 이익을 창출하고 있는지를 보여주는 구체적인 수치 제시입니다."}, {"h": "광고는 검색을 악화시키는 메커니즘", "ko": "저자는 아마존 검색광고의 근본적인 문제를 분석합니다. 에어프라이어를 찾는 소비자의 경우, 아마존은 이미 가장 평가가 높고 반품률이 낮으며 가격이 가장 좋은 제품을 알고 있습니다. 광고의 목적은 소비자를 그 최고의 제품이 아닌 다른 제품으로 유도하는 것이므로, 결국 검색 결과를 왜곡하고 악화시킵니다. 이러한 구조 때문에 최고의 제품 판매자도 자신의 판매량을 지키기 위해 광고를 구매해야 하는 악순환이 생깁니다."}, {"h": "영점합 게임: 수요 창출이 아닌 파이 나누기", "ko": "전통적인 광고와 달리 검색광고는 시장 전체 수요를 증가시키지 않습니다. 특정 카테고리의 총 판매량은 고정되어 있고, 광고는 단지 판매자들 간의 점유율 경쟁만 일으킵니다. 심지어 한 연구는 검색광고가 있는 전자상거래 사이트가 광고가 없는 사이트보다 판매량이 더 적다고 주장합니다. 저자의 출판사가 테스트한 사례에서, '세스 고딘 결혼식 책'을 검색하는 소비자에게 광고를 보이는 데 클릭당 1달러를 지불하고 있습니다. 즉, 아마존은 이미 구매 의도가 있는 고객을 겨냥하는 광고를 판매자에게 팔고 있습니다."}, {"h": "광고 비용은 결국 소비자가 부담", "ko": "연 500억 달러 이상이 이러한 광고에 쓰이는데, 판매자들은 장기적으로 이 비용을 감당할 수 없습니다. 그 부담은 제품 가격 인상 또는 신제품 개발 의욕 저하라는 형태로 소비자에게 전가됩니다. 마케팅 효율성을 의도적으로 악화시키는 아마존의 광고 시스템은 결국 시장 전체의 효율성을 훼손합니다."}, {"h": "품질 저하와 검색 결과 왜곡의 악순환", "ko": "이 구조는 두 가지 부작용을 만듭니다. 첫째, 판매자들은 브랜드 평판보다 광고 예산이 중요해지자 저가의 품질 낮은 상품으로 전환하면서 광고 예산을 늘립니다. 둘째, 아마존과 같은 플랫폼은 유기 검색 결과를 의도적으로 악화시켜 판매자들이 더 많은 광고를 구매하도록 유인합니다. 이렇게 되면 플랫폼 자체가 검색 결과를 손상시키는 데 경제적 인센티브를 가지게 됩니다."}, {"h": "고객 중심성의 신화: 아마존의 변질", "ko": "과거 수십 년간 아마존은 상품 가격을 낮추고 유통망이 부족한 판매자들을 위해 문을 열어 소비자에게 실질적인 가치를 제공했습니다. 저자는 아마존이 이제 더 이상 「고객 중심」이라고 주장할 수 없다고 결론짓습니다. 자신들이 섬기겠다던 고객으로부터 조직적으로 가치를 추출하는 광고 시스템을 만들었기 때문입니다."}], "caveat": "저자는 확증 없는 추정(예: 광고가 유기 검색 결과에 장기 영향을 미친다는 '민간 속설')과 정책적 주장을 섞어 제시하므로, 경제학적 검증이 필요한 부분과 의견 부분을 구분하여 읽어야 합니다."}, {"id": "550006791bdd", "date": "2026-08-13", "title": "Tailscale Traces Database Corruption to 16y/o SQLite WAL-Reset Bug", "ko_title": "신뢰성 위기에서 16년 묵은 SQLite 버그 발굴까지: Tailscale의 데이터베이스 부패 사건", "source": "Hacker News 300+", "url": "https://tailscale.com/blog/sqlite-wal-reset-bug", "sections": [{"h": "안정성 위기의 시작과 심각성 인식", "ko": "Tailscale은 지난해 연말부터 서비스 가용성이 급격히 악화되었으며, 이는 상태 페이지에도 공개적으로 노출되었습니다. 여러 차례의 장애 대부분이 SQLite 데이터베이스 깊숙한 곳의 단 하나의 버그에서 비롯되었으며, 이를 추적하기 위해 수개월간의 집중적인 포렌식 작업이 필요했습니다. 회사는 고객에게 약속한 신뢰성 있는 서비스를 제공하지 못한 점을 명시적으로 인정하고, 발생 원인과 대응, 그리고 장기간 숨어있던 SQLite 버그의 발견 과정을 공개하기로 결정했습니다."}, {"h": "아키텍처: 단일 쓰기 설계와 SQLite 도입", "ko": "Tailscale의 제어 평면은 사용자 입장에서는 하나의 엔드포인트로 보이지만, 내부적으로는 여러 샤드(조정 서버)로 분산되어 있으며, 각 고객 네트워크(tailnet)는 한 번에 하나의 샤드에만 위치하면서도 다른 샤드로 유연하게 마이그레이션할 수 있습니다. 각 샤드는 해당 샤드의 모든 정보를 담은 SQLite 데이터베이스를 보유하고 있으며, 단 하나의 Go 프로세스가 배타적으로 접근하는 단일 쓰기 설계입니다. Tailscale은 2022년부터 SQLite를 주 데이터베이스로 채택했는데, 신뢰성 있고 널리 사용되는 기술이라는 이유에서였습니다."}, {"h": "백업 파이프라인과 첫 감지된 부패", "ko": "회사는 몇 분마다 데이터베이스의 완전한 스냅샷을 생성하여 S3 버킷에 업로드하는 백업 파이프라인을 운영했으며, 2023년 초부터 아무런 문제 없이 작동해왔습니다. 지난해 8월 이 S3 백업을 읽는 데이터 파이프라인에서 데이터베이스 오류를 보고했고, SQLite의 PRAGMA integrity_check 명령으로 실제 부패를 확인했습니다. 데이터베이스 부패는 이론상 가능하지만 정상 운영 중에는 매우 드문 현상입니다. 회사가 부패 데이터베이스를 복구하고 원인을 조사했지만, 명확한 답을 얻을 수 없었습니다."}, {"h": "반복되는 부패 사건과 영향 범위", "ko": "규모 있는 운영에서는 드문 사건도 빈번하게 발생할 수 있고, 실제로 6개월에 걸쳐 19건의 별도 부패 사건이 발생했습니다. 제어 평면이 다루는 것이 구성 데이터일 뿐이므로 부패로 인한 데이터 손실은 암호화 키나 네트워크 트래픽에 영향을 미치지 않았지만, 신규 장치 추가나 구성 변경이 지속되지 않는 문제가 생겼습니다. 부패가 발생할 때마다 데이터베이스를 복구하는 동안 영향받은 샤드의 제어 평면 전체가 중단되었으며, 초기에는 1시간 이상의 다운타임이 발생했습니다. 이 기간 중 새로 접속하는 장치는 통신할 수 없었고, 이미 연결된 장치들도 네트워크 변화를 감지할 수 없었으며, 웹 기반 관리 콘솔과 API 접근도 차단되었습니다."}, {"h": "신뢰성 저하와 조사의 어려움", "ko": "영향받은 고객이 소수라도 상태 페이지에 전체 장애로 공지되어, 실제 영향을 받지 않은 사용자들도 반복된 다운타임을 목격했고 신뢰가 동반하게 저하되었습니다. 초기부터 심각한 위협으로 인식한 회사는 막대한 엔지니어링 자원을 투입했으나 해결책을 찾기 어려웠습니다. 최근 변경사항을 검토해도 관련성이 없었고, 저수준 SQLite 상호작용 코드도 수년 전부터 안정적으로 작동해왔습니다. 부패 사건들 사이에 공통 요소를 찾을 수 없었으며, 특정 샤드, 고객, 네트워크 기능, 시간대, 부하 수준과도 무관했습니다. 재현 가능한 트리거 조건이 없어서 합성 환경에서의 버그 재현도 불가능했고, 결국 운영 환경에서 수동적인 포렌식 원격 측정을 배포하여 부패 현상을 직접 포착해야 했습니다."}, {"h": "예측 불가능한 발생 패턴과 전문가 지원", "ko": "부패 사건은 규칙적인 일정으로 발생하지 않아서, 때로는 몇 시간 간격이었고 때로는 몇 주 간격이었기 때문에 진행 상황을 예측하거나 추가 작업을 계획하기 어려웠습니다. 10월에서 12월 사이 6주간 부패 사건이 발생하지 않다가 크리스마스 무렵 다시 나타났습니다. 신속한 해결이 어렵다고 판단한 회사는 SQLite 개발자들과 전문 지원 계약을 체결했으며, 이는 탁월한 결정이었습니다. 이를 통해 심층적 전문성에 직접 접근할 수 있었고, 아키텍처와 장애에 대해 상세한 기술 논의를 나눌 수 있었습니다."}, {"h": "대응 조치와 우발적 발견", "ko": "Tailscale 엔지니어와 SQLite 핵심 개발자들은 깨진 POSIX 잠금, SQLite 메모리 오용, 멀티스레드 부정 사용 등 여러 이론을 맵핑했고, 매 장애 이후 더 많은 데이터를 수집하여 이론을 체계적으로 배제했습니다. 동시에 운영 중인 플랫폼을 유지하기 위해 자동화된 복구와 다운타임 최소화를 추진했으며, 특히 완전한 복구 없이 손실을 최소화하기 위해 트랜잭션 로깅 파이프라인을 구축했습니다. 이 파이프라인은 데이터베이스를 수정하는 모든 SQL 문을 별도 로그에 기록하여, SQLite의 직렬화 가능한 단일 쓰기 트랜잭션 특성을 활용해 완전히 선형적이고 결정적인 이력을 만들었습니다. 이 파이프라인의 의도치 않은 발견은 2건의 장애에서 트랜잭션 로그 재생이 실패했다는 점이었으며, 이는 하나의 트랜잭션이 기록하고 커밋한 데이터가 이후 트랜잭션에 보이지 않는다는 뜻으로, 오류 메시지 없이 쓰기가 사라진 불가능한 현상이었습니다."}, {"h": "SQLite 체크포인팅과 수동 제어의 의심", "ko": "SQLite 개발자들이 새로운 디버깅 도구를 개발하던 중, Tailscale도 버그가 체크포인팅 과정에 있을 것으로 의심했습니다. SQLite 데이터베이스는 작은 정보 블록인 '페이지'의 연결이며, 데이터베이스 업데이트 시 일부 페이지를 새 페이지로 교체해야 합니다. 성능과 동시성을 위해 Tailscale은 쓰기 선행 로깅(WAL) 모드로 SQLite를 실행하는데, 이는 새 페이지가 WAL 파일에 먼저 기록된 후 나중에 메인 데이터베이스 파일로 복사되는 방식입니다. 이 복사 과정을 '체크포인팅'이라 하는데, 대부분의 배포에서는 SQLite가 자동으로 결정하지만, Tailscale은 빠르고 일관된 백업을 위해 체크포인팅을 수동으로 제어하는 비표준 방식을 택했고, 이것이 잠재적 원인으로 의심받기 시작했습니다."}, {"h": "가상 파일시스템 계층의 추적과 버그 발견", "ko": "한 가지 실마리는 부패 사건 중 SQLite가 WAL 파일의 실제 페이지보다 더 많은 페이지를 복사했다고 보고했다는 점이었습니다. 예를 들어 WAL 파일에 10개 페이지가 있는데 20개 페이지가 메인 데이터베이스로 복사되었다면, 분명히 뭔가 잘못된 것입니다. 진단을 위해 SQLite 개발자들은 가상 파일시스템 계층을 추적하는 새 디버깅 도구를 만들었습니다. SQLite는 여러 계층으로 나뉘는데, 최상위는 SQL 파서와 코드 생성기, 그 아래는 페이저, 그리고 실제 디스크 쓰기를 담당하는 OS 인터페이스로 이루어져 있습니다. 새로운 도구인 tmstmpvfs 쉼(shim)은 가상 파일시스템을 감싸서 데이터베이스 변경에 대한 추적 정보와 로그를 기록했으며, SQLite 공개 저장소에서 소스코드를 확인할 수 있습니다. 회사가 이 쉼을 운영 환경에 배포했고, 다음 부패 사건이 발생했을 때 추가 로그 덕분에 SQLite 개발자들은 결국 버그를 찾아낼 수 있었습니다."}, {"h": "WAL-Reset 버그의 정체와 메커니즘", "ko": "발견된 버그는 체크포인팅과 쓰기 트랜잭션 사이의 드문 데이터 경쟁 조건(race condition)이었으며, SQLite 개발자들은 이를 「WAL-Reset 버그」라고 명명했습니다. 체크포인팅 중 정확한 시점에 쓰기가 발생하면, 체크포인팅 과정이 일부 페이지가 WAL에서 메인 데이터베이스로 복사되었다고 착각하게 되는데, 실제로는 복사되지 않았습니다. 그 페이지들은 메인 데이터베이스 파일에 절대 기록되지 않아 데이터가 영구적으로 손실되고, 손실된 페이지를 참조하는 인덱스 같은 다른 페이지가 메인 데이터베이스에 기록되면서 데이터베이스 파일이 부패하게 됩니다. 이 16년 묵은 버그는 단 하나의 시간 윈도우에서만 발생하는 매우 희귀한 조건이었기 때문에 지금까지 발견되지 않았던 것으로 추정됩니다."}], "caveat": "원문이 현재 진행형이므로 최종 수정 완료 여부와 공식 패치 일정은 원문 전문에서 확인이 필요합니다."}, {"id": "311d3f683fc6", "date": "2026-08-11", "title": "Muse Glimmer: 30B-parameter model optimized for always-on local agent workflows", "ko_title": "메타, 로컬 실행 가능한 30B 경량 에이전트 모델 뮤즈 글림머 공개", "source": "Hacker News 300+", "url": "https://research.meta.ai/blog/introducing-muse-glimmer-open-agentic-model", "sections": [{"h": "메타의 새로운 경량 오픈소스 모델 발표", "ko": "메타 슈퍼인텔리전스 랩스가 뮤즈 글림머(Muse Glimmer)를 공개했으며, 아파치 2.0 라이선스로 완전히 오픈소스화했습니다. 이 모델은 30억 개의 파라미터를 가진 경량 모델로, 맥이나 개인용 PC에서 소비자급 GPU 하나만으로 실행할 수 있도록 최적화되었습니다. 로컬 에이전트 운영, 함수 호출, 코딩 작업, 판사 역할의 대언어모델 평가 등 다양한 사용 사례를 지원하면서도 동급 모델들과 비교해 우수한 성능을 제공합니다."}, {"h": "클라우드 의존성 탈피의 필요성", "ko": "기초 모델들이 추론, 코드 생성, 도구 사용 등에서 높은 능력을 보였음에도, 대부분의 배포는 여전히 클라우드 인프라와 네트워크 접근에 의존합니다. 로컬에서 모델을 실행하면 인터넷 연결 여부와 관계없이 언제 어디서나 AI를 활용할 수 있다는 장점이 생깁니다. 오픈소스 커뮤니티는 적절하게 훈련된 소규모 모델이 특정 작업에서 최첨단 수준의 성능에 접근할 수 있음을 증명했으며, 뮤즈 글림머은 이러한 로컬 활용 사례를 겨냥하여 설계되었습니다."}, {"h": "개발자 접근성 극대화를 위한 오픈 공개", "ko": "메타는 메타의 오픈 AI 연구 전통을 이어 뮤즈 글림머의 가중치를 허깅페이스에 공개하고 개발자 문서를 함께 제공합니다. 이 모델은 개발자들이 이미 사용 중인 도구와 호환되도록 구축되었으며, llama.cpp, MLX, ExecuTorch 같은 플랫폼에서 최적화된 통합을 제공할 예정입니다. 이를 통해 다운로드 후 몇 분 내에 작동하는 에이전트를 구성할 수 있도록 목표합니다."}, {"h": "로컬 에이전트에 필요한 다층적 능력", "ko": "일정 관리, 메시지 작성, 파일 정리, 사용자 업무 패턴 학습 같은 기능을 하려면 개인 정보에 대한 깊은 접근이 필요합니다. 동시에 장기 실행 계획 수립, 정확한 도구 호출, 멀티모달 이해, 장기 맥락 메모리, 명령 준수 같은 여러 능력이 함께 작동해야 합니다. 뮤즈 글림머은 로컬 하드웨어의 메모리와 계산 제약 속에서 이런 능력들의 균형을 맞추도록 설계되었습니다."}, {"h": "컴팩트 설계와 지식 증류 기법", "ko": "메모리와 계산 제약을 충족하기 위해 메타는 간결한 아키텍처, 더 큰 교사 모델로부터 에이전트 추론 능력을 전이하는 새로운 증류 기법, 그리고 추론 최적화를 적용했습니다. 사전 훈련 단계에서는 더 큰 뮤즈 스파크 모델의 출력을 이용한 로짓 증류를 사용했고, 중간 훈련에서는 더 긴 문맥과 에이전트 중심의 데이터로 훈련했으며, 사후 훈련에서는 감독 학습과 강화학습을 결합했습니다."}, {"h": "에이전트 능력의 다면적 평가 체계", "ko": "뮤즈 글림머는 엔드투엔드 에이전트 작업 완수, 안정적인 도구 사용, 다단계 추론, 장애 복구, 멀티모달 입력·추론, 오케스트레이션 호환성, 조정 가능한 추론 강도, 100개 이상 언어 지원 등 여덟 가지 핵심 능력을 중심으로 훈련되고 평가됩니다. 각 항목은 실제 에이전트가 갖춰야 할 필수 요소들이며, 벤치마크로는 DeepSearch QA, MCP-Atlas, τ-Bench, SWE-Bench 등을 활용합니다."}, {"h": "메모리 효율과 속도 최적화 기술", "ko": "완전 정밀도의 30억 파라미터 모델은 55GB 이상의 메모리가 필요하지만, 양자화 기법으로 약 4비트 정밀도로 압축하여 20GB 미만으로 줄였습니다. 이는 24GB 또는 32GB 메모리 범위 내에서 모델의 작동 메모리, 이미지 이해용 인식 인코더, 추측적 디코딩 드래프터가 동시에 실행될 여유를 남깁니다. 또한 DFlash 기반의 경량 드래프터 모델을 사용하여 토큰을 한 번에 여러 개씩 제안하고 주 모델이 검증하는 방식으로, 표준 토큰별 생성보다 훨씬 빠른 텍스트 생성을 구현했습니다."}, {"h": "실제 하드웨어에서의 성능 검증", "ko": "메타는 맥북 M4-Max, M5-Max와 RTX-5090에서 양자화된 뮤즈 글림머와 드래프터의 속도를 측정했으며, 유연한 대화와 실시간 에이전트 상호작용을 지원할 만큼 충분히 빠른 성능을 확인했습니다. 모든 처리가 사용자 기기 내에서만 이루어지므로 개인정보 보호 측면에서도 우수합니다."}, {"h": "즉시 사용 가능한 배포 옵션 다양화", "ko": "뮤즈 글림머의 가중치는 허깅페이스에서 즉시 다운로드할 수 있으며, Ollama, LM Studio, Unsloth 같은 파트너 서비스를 통해 로컬 실행이 가능합니다. llama.cpp, ExecuTorch, MLX 같은 엣지 프레임워크로 배포하거나, vLLM, SGLang으로 대규모 운영할 수 있으며, Together AI, Fireworks AI, OpenRouter 같은 서비스로 빠르게 시작할 수도 있습니다. 추가로 PyTorch의 TorchTitan 기능으로 특정 사용 사례에 맞게 모델을 미세 조정할 수 있습니다."}, {"h": "생태계 파트너십과 지원 자원", "ko": "AMD, Arm, Dell, Intel, NVIDIA 등 주요 하드웨어 제조사들과의 협력으로 다양한 기기에서의 성능 최적화를 진행하고 있습니다. 메타는 개발자가 책임감 있게 뮤즈 글림머을 사용할 수 있도록 문서를 제공하며, 맞춤형 스캐폴딩 설정 가이드를 포함해 첫날부터 개인 에이전트를 구축하고 배포하기 쉽도록 지원합니다. 이는 메타의 장기적 오픈 AI 연구 전통을 에이전트 AI 분야로 확장하려는 시도입니다."}], "caveat": "메타의 주장과 벤치마크 결과는 아직 독립적인 제3자 검증을 거치지 않았으므로, 실제 프로덕션 환경에서의 성능은 별도 평가가 필요합니다."}, {"id": "52fa033e5f1f", "date": "2026-08-13", "title": "AI is removing the middle class of software engineering?", "ko_title": "AI 시대, 소프트웨어 엔지니어의 중산층이 사라지고 양극화가 심화되는가?", "source": "Hacker News 300+", "url": "https://blog.florianherrengt.com/ai-removing-middle-class-software-engineering.html", "sections": [{"h": "AI 이전: 견제와 품질 관리의 시대", "ko": "저자는 2020년의 상황으로부터 출발한다. 당시 시니어 엔지니어는 코드 리뷰와 아키텍처 관리로 프로젝트의 기술적 품질을 지키는 역할을 담당했다. 휴가 중 나타나는 무질서는 명백했지만, 그 피해의 규모는 인간이 만들 수 있는 속도에 의해 자연스럽게 제한되었다. 즉, 나쁜 결정이 누적되더라도 누군가는 그 과정을 감시하고 개입할 시간이 있었다."}, {"h": "AI 이후: 속도의 급격한 증가와 통제 불능", "ko": "2026년의 월요일 아침, 저자가 마주하는 것은 전혀 다른 광경이다. 팀원들이 금요일 이후 몇 주일 휴가 때 이루던 것보다 더 많은 코드 변화(수만 줄)를 지난 주말에 만들어낸다. AI 에이전트를 사용하면서 체계적인 설계 논의 없이 프롬프트 기반의 빠른 구현이 가능해진 것이다. 개발자는 자신이 무엇을 만들고 있는지 완전히 이해하지 못한 채, 프로덕션에 배포 가능한 코드를 쏟아낸다."}, {"h": "기술 부채의 가시적 성공과 숨겨진 위험", "ko": "겉으로는 모든 것이 작동한다. PR을 받아 테스트하면 어떤 형태로든 기능한다. 하지만 이것이 바로 함정이다. 팀원들은 계속 AI에 지시를 내려 같은 버그를 반복해서 고치려 하고, 그 과정에서 코드는 더욱 복잡해진다. 저자는 신용카드로 고급 자동차를 구매하는 사람에 비유한다. 부채는 보이지 않고 겉으로는 멋져 보일 뿐이다. 결국 시스템이 너무 얽혀서 누구도 그 안에 무엇이 있는지 알 수 없는 지경에 이른다."}, {"h": "엔지니어링 문화 붕괴와 의사결정의 손실", "ko": "이전에는 누군가는 반드시 시스템을 이해하고 있었고, 그 사람이 설명해줄 수 있었다. 지금은 개발자들이 스스로도 모르는 결정을 AI에 묻는다. 25,000줄 PR을 열어야 할 책임은 해당 개발자에게 있다. 코드를 검토하는 사람도 그 크기에 거절하지 않는다. Kafka를 추가한 사람도, 기능을 만든 사람도 그들의 선택을 정당화할 수 없다. 결국 누구도 자신의 결정을 진정으로 이해하지 못한 채 다음 단계로 넘어간다."}, {"h": "기술 부채 누적 속도의 급변", "ko": "기술 부채 자체가 나쁜 것은 아니다. 문제는 그것이 의도적 지름길이 되지 못한다는 점이다. 데이터베이스에 테이블을 추가하는 데는 10분이 걸리지만, 나중에 제거하려면 마이그레이션 계획과 운영 중단 회피 전략이 필요하다. AI 모델도 이를 완벽하게 해결하지 못한다. 그 사이에도 20개의 새로운 PR이 들어온다. 나쁜 결정을 하나 풀어헤칠 동안 다섯 개의 새로운 결정이 병합된다. 이전에도 이런 일은 있었지만, 구현의 어려움이 자연스러운 속도 제한이 되어줬다. 이제 그 제한이 사라졌다."}, {"h": "엔지니어 급여의 진짜 의미와 AI의 가치 역전", "ko": "런던과 샌프란시스코의 엔지니어가 6자리 급여를 받는 이유를 다시 생각해보자. 단순히 사양을 작동하는 코드로 변환하는 것만 필요하다면, 저비용 지역에서 이미 싸게 했을 것이다. 기술 대기업들이 여전히 최고의 인재에게 높은 급여를 제시하는 것은 의사결정과 복잡성 관리 능력을 원하기 때문이다. AI는 이 시장을 극단적으로 양극화시킬 것으로 예상된다. 좋은 엔지니어는 AI를 활용하여 훨씬 빠르게 움직이므로 더욱 가치 있어지고, 단순 구현 인력에 대한 필요성은 줄어든다. 동시에 나쁜 엔지니어는 고용하기 매우 비싸진다. 왜냐하면 그들의 실수가 이전보다 훨씬 큰 규모로, 빠르게 누적되기 때문이다."}, {"h": "속도와 검증 사이의 치명적 불균형", "ko": "저자가 지적하는 핵심은 속도의 차이다. AI 이전, 나쁜 엔지니어는 컴파일되지 않는 코드를 만들기도 했고, 뭔가 만들어도 시간이 오래 걸렸으며 피해 범위가 제한되었다. 지금은 오전 중에 10,000줄의 작동하는 코드를 만들 수 있다. 나쁜 결정이 이전에는 수개월에 걸쳐 누적되었다면, 이제 하루 오후에 누적된다. 그러나 코드를 검토하고 이해하는 속도는 변하지 않았다. 「프로세스를 개선하면 된다」는 반박은 문제를 놓친다. 코드 리뷰, 테스트, CI는 대량의 변화가 불가능했던 세상을 위해 설계되었다. 하루 10개의 PR을 리뷰할 수 없고, 100% 테스트 커버리지도 예상하지 못한 버그는 잡지 못한다."}, {"h": "생산성 착각과 실제 팀 생산력의 역설", "ko": "어떤 엔지니어가 하루에 10개의 PR을 열면 10배 생산적인가? 그렇지 않다. 만약 그 10개의 PR을 검토하고 이해하기 위해 3명의 엔지니어가 이틀을 써야 한다면, 결국 생산성을 다른 사람들에게 전가한 것이다. 특히 그들의 시간은 희소하고 교체하기 어렵다. PR 개수, 변경 줄 수, 완료된 기능은 생산성의 끔찍한 척도다. 개인의 숫자를 좋아 보이게 할 수 있지만 전체 팀의 처리량을 줄인다. 조직 문화가 티켓 수를 품질보다 우선시한다면, 신중한 엔지니어는 나쁜 직원처럼 보이고 성급한 엔지니어가 승진한다. 품질을 지키려고 해도 「독성적」이라는 낙인이 찍힐 수 있다."}, {"h": "책임감 있는 엔지니어의 역할과 AI 신뢰의 한계", "ko": "저자는 AI를 매일 사용하며 거부하지 않는다. 다만 문제를 인식하는 것과 도구를 쓰는 것은 별개라고 본다. 컴파일러는 코드의 의미를 보존하면서 다른 형태로 변환한다. 하지만 LLM은 의사결정을 내린다. 아키텍처를 선택하고, 추상화를 정하고, 시스템이 무엇을 해야 할지 결정한다. 배포 후 문제가 생기면, 자신의 변경을 이해하지 못한 채 나타나는 사람은 도움이 되지 않는다. 프로덕션이 깨질 때 필요한 것은 그 변화를 이해하는 엔지니어다. 좋은 엔지니어는 속도에도 타협과 유연성이 필요할 때를 안다. 하지만 실제 문제를 일으킬 것으로 보이면 목소리를 내야 한다. 그것이 직업이다."}, {"h": "지식 노동 전반으로 확대되는 양극화의 신호", "ko": "이 현상은 소프트웨어 엔지니어링에만 국한되지 않을 것이다. 모든 지식 노동에서 유사한 일이 벌어질 것으로 예상된다. AI는 최고의 인재를 매우 생산적으로 만들고, 나쁜 인재는 거의 고용 불가능하게 만든다. 이전에는 누군가가 나쁜 결정을 캐치할 확률이 있었다. 지금은 변화가 누구도 현실적으로 검토하거나 이해할 수 있는 속도보다 빨리 일어난다. 결과적으로 의사결정 능력이 있는 점점 작은 집단으로 자원이 집중될 가능성이 높다. 의사결정 능력이 없는 대다수는 저비용이거나 교체된다."}], "caveat": "본 글은 실제 프로덕션 사례보다는 저자의 우려 시나리오에 기초하고 있으며, AI 모델의 능력과 제약을 특정 시점의 기술 수준으로 평가하고 있으므로, 미래 예측으로 읽을 때는 저자의 관점이 전부가 아님을 고려하기 바랍니다."}, {"id": "fbdfaa10f2aa", "date": "2026-08-13", "title": "DeepSeek V4 Pro 0813", "ko_title": "DeepSeek V4 Pro 0813: 중국산 프론티어급 모델의 글로벌 공개", "source": "Hacker News 300+", "url": "https://openrouter.ai/deepseek/deepseek-v4-pro-0813", "sections": [{"h": "모델의 정체와 공식 출시", "ko": "DeepSeek이 대규모 혼합 전문가(MoE) 아키텍처 기반의 V4 Pro 모델을 정식 공개했습니다. 이는 단일 기업의 독점 모델이 아니라 여러 호스팅 업체를 통해 서빙되는 구조를 갖추고 있습니다. 사용자는 OpenRouter 같은 라우팅 플랫폼을 거쳐 동일한 모델에 접근하되, 비용·속도·정확도 중 우선순위를 선택하여 최적의 제공자로 자동 연결될 수 있습니다."}, {"h": "실제 사용자 비용과 가격 책정", "ko": "공시 가격과 실제 고객이 지불하는 평균 가격 사이에는 차이가 존재합니다. 토큰 캐싱과 대량 할인 같은 요소들이 실제 비용을 공식 요금보다 상당히 낮출 수 있다는 점을 사용자에게 투명하게 알립니다. 이는 장기·반복 사용을 고려하는 조직이 예산을 보다 정확하게 추정할 수 있도록 돕는 정보입니다."}, {"h": "성능 지표: 속도와 응답 시간", "ko": "모델의 실제 운영 성능은 세 가지 차원으로 측정됩니다. 처리량(초당 토큰 수)은 빠를수록, 지연시간(왕복 시간)은 낮을수록 좋으며, 첫 토큰 시간(화면에 결과가 나타나기까지의 대기 시간)도 짧을수록 사용자 경험이 우수합니다. 이 세 지표는 모델 선택 시 실무적 의사결정에 직결되는 핵심 지표들입니다."}, {"h": "가용성과 서비스 안정성", "ko": "지난 3일간 적어도 하나의 제공자가 요청에 응답한 비율을 가동률로, 추론 요청이 성공적으로 완료된 비율을 가용성으로 따로 추적합니다. OpenRouter는 지속적인 모니터링을 통해 한 제공자에 오류가 발생하면 차선의 제공자로 자동 전환하는 방식으로 서비스 신뢰도를 높입니다. 이는 엔터프라이즈 환경에서 요구되는 안정적 운영의 기초입니다."}, {"h": "벤치마크 성능 평가", "ko": "표준화된 평가 기준에 따른 모델의 점수가 공개되며, 백분위 순위를 통해 OpenRouter 플랫폼상 전체 모델 대비 상대적 위치를 확인할 수 있습니다. 이 수치들이 높을수록 우수한 성능을 의미하며, 사용자는 자신의 작업 특성에 맞는 모델을 객관적 데이터를 바탕으로 선택할 수 있습니다."}, {"h": "실제 운영 사례와 사용 패턴", "ko": "이 모델로 가장 많은 트래픽을 보내는 공개 애플리케이션들의 목록이 제공됩니다. 실제 프로덕션 워크로드가 어떤 모양인지, 그리고 어떤 사용 사례에 이 모델이 가장 적합한지를 시장 신호로 읽을 수 있습니다. 이는 기술 문서만으로는 알 수 없는 '현장의 신뢰'를 보여주는 실증적 증거입니다."}, {"h": "개발자 통합과 API 호환성", "ko": "모델 호출을 위한 즉시 사용 가능한 코드 샘플이 제공되며, OpenRouter의 API가 OpenAI 호환 설계를 따르므로 대부분의 기존 SDK가 기본 URL 변경만으로 작동합니다. 모델 간 전환 시에도 모델 식별자(slug) 부분만 수정하면 되므로 통합 비용이 매우 낮습니다. 이는 개발자가 다양한 모델을 실험적으로 비교할 수 있는 진입 장벽을 크게 낮춘 설계입니다."}, {"h": "도구 호출과 구조화된 출력 지원", "ko": "DeepSeek V4 Pro 0813이 도구 호출(tool calling)과 구조화된 출력(structured outputs)을 지원하는지 여부는 에이전트형 애플리케이션, 데이터 처리 파이프라인, API 연동 작업에서 중요한 기능 요구사항입니다. 원문에서는 이에 대한 구체적 답변을 별도 항목으로 제시하고 있으나, 상세 내용은 해당 페이지의 FAQ 섹션 확인이 필요합니다."}], "caveat": "이 해부는 OpenRouter 플랫폼의 모델 소개 페이지를 재서술한 것으로, 성능 평가와 가격 정보는 플랫폼에서 추적하는 데이터에 기반하며, 중립적 제3자 벤치마크와의 비교 검증이 필요합니다."}, {"id": "99bdd8b2cd62", "date": "2026-08-15", "title": "Why does Opus 5 feel worse to work with?", "ko_title": "Opus 5는 왜 체감상 약할까? 벤치마크 최적화와 실무 효용성의 괴리", "source": "Hacker News 300+", "url": "https://mun-logadan.github.io/why-does-opus-5-feel-worse/", "sections": [{"h": "Opus 5의 역설: 높은 능력, 떨어진 체감", "ko": "저자와 동료들은 Anthropic의 최신 모델인 Opus 5를 Opus 4.7, 4.8, Fable 같은 이전 버전들과 비교해 실무에서 사용하기 더 불편하다고 느낀다. 능력 자체로는 Opus 5가 앞선다는 점을 인정하지만, 벤치마크상 우위에도 불구하고 실제 작업 경험은 다른 모델들이 더 낫다는 역설을 제시한다. 이는 단순한 기술적 성능 저하가 아니라, 모델의 작동 특성 차이에서 비롯된 것으로 추정된다."}, {"h": "이전 모델들의 강점: 신중함과 독립성", "ko": "Opus 4.7, 4.8, Fable은 사용자의 세심한 개입과 감독을 덜 필요로 한다는 점에서 Opus 5와 구별된다. 저자는 이 차이가 모델의 작동 철학의 차이에서 비롯났다고 본다. 이전 모델들은 불명확한 상황에서 더 신중한 접근을 취하며, 사용자가 직접 개입하지 않아도 안정적인 결과를 낼 수 있도록 설계된 것으로 보인다."}, {"h": "두 가지 경쟁 목표의 충돌", "ko": "저자는 Anthropic과 현재 거대 AI 연구소들이 겪고 있는 두 가지 상충하는 목표를 지적한다. 하나는 자기 개선을 통해 AGI에 도달할 수 있는 모델을 만드는 것이고, 다른 하나는 벤치마크 성과를 극대화하는 것이다. 이 두 목표가 모델 개발에 동시에 영향을 미치면서 특정 특성을 강화하는 선택압이 작동하고 있다는 주장이다."}, {"h": "벤치마크의 구조적 특성과 그 영향", "ko": "벤치마크 과제들은 본질적으로 자기완결적이며, 외부 정보나 추가 설명 없이 명확한 정답을 가져야 한다. 저자는 벤치마크 성과 최적화가 모델로 하여금 애매함 속에서 대담한 가정을 내리도록 선택하게 한다고 지적한다. 이 과정에서 명확함을 추구하지 않고 확인을 구하는 경향은 벌칙을 받게 되는 구조가 만들어진다."}, {"h": "실무와 벤치마크의 근본적 차이", "ko": "현실의 코딩 작업에서는 맥락, 의도, 사업상 제약, 예산 제한 같은 정보를 모두 전달하기 거의 불가능하다. 따라서 불명확함과 선택의 순간은 피할 수 없는데, 저자가 원하는 것은 정확히 그런 상황에서 에이전트가 멈추고 확인을 요청하는 태도다. 벤치마크는 답이 정해진 문제를 푸는 능력을 측정하지만, 현실은 정해진 답이 없거나 여러 개인 경우가 대부분이고, 이때 대충 추측하는 모델은 실무에서 위험하다는 결론이다."}], "caveat": "저자의 주장은 개인적 경험과 동료들과의 대화에 기반한 것으로, 체계적 벤치마크 비교나 대규모 사용자 조사로 검증되지 않았습니다."}, {"id": "ddb75f2efe54", "date": "2026-08-15", "title": "Every Fucking Website (2020)", "ko_title": "웹사이트의 획일화: 플랫폼 종속성과 사용자 선택권 상실의 구조", "source": "Hacker News 300+", "url": "https://lxe.github.io/everywebsite/", "sections": [{"h": "위기 마케팅과 긴급성의 악용", "ko": "저자는 현대 웹사이트들이 외부 위기 상황을 마케팅 수단으로 전환하는 관행을 지적합니다. COVID-19 같은 대사건이 발생하면 대부분의 사이트가 관련 메시지를 배치하지만, 이는 실제 정보 제공보다는 기계적인 응답에 불과하다는 뜻입니다. 사용자가 그 콘텐츠를 읽을 가능성은 낮음에도 불구하고, 기업들은 사회적 책임감을 표현하는 것처럼 보이기 위해 이를 반복합니다."}, {"h": "할인 쿠폰과 가입 유도의 동일 패턴", "ko": "모든 웹사이트가 거의 같은 형식의 할인 제안을 사용합니다. 「10% 할인, 이메일 가입」 같은 구조는 이제 사용자가 당연히 기대하는 요소가 되었으며, 각 사이트가 독창적인 인센티브를 개발하는 대신 검증된 전환율 높은 템플릿을 반복합니다. 이는 웹 생태계 전체가 동일한 사용자 경험 공식을 추구하고 있음을 보여줍니다."}, {"h": "쿠키 정책과 법적 강제의 악순환", "ko": "EU와 캘리포니아의 규제로 인해 모든 웹사이트가 쿠키 동의 배너를 게시하도록 강제되었습니다. 문제는 각 사이트가 자체 방식으로 이를 구현하면서 사용자는 매번 다른 인터페이스를 마주하게 되고, 브라우저 차원의 통일된 설정이 불가능해진 점입니다. 저자는 이것이 실제로는 사용자의 선택을 제한하는 결과를 낳았으며, 법적 규제의 의도와 무관하게 플랫폼들의 일관된 강제 동의 방식만 확산되었다고 비판합니다."}], "caveat": "2020년에 작성된 에세이로, 현재 웹 환경의 변화(AI 콘텐츠 생성, 새로운 규제, 플랫폼 분화 등)는 반영하지 않으며, 저자의 주관적 관찰에 기반한 글이므로 정량적 데이터로 뒷받침된 학술적 분석이 아닙니다."}, {"id": "afb6d0b82506", "date": "2026-08-15", "title": "Qwen 3.8 27B", "ko_title": "Qwen 3.8 27B 공개: 알리바바의 경량 오픈소스 모델과 AI 생태계의 변화", "source": "Hacker News 300+", "url": "https://huggingface.co/Qwen/Qwen3.8-27B-FP8", "sections": [{"h": "원문의 기술적 구성 요소", "ko": "제시된 텍스트는 Qwen 모델의 채팅 템플릿(chat template)과 토크나이저 설정을 담은 기술 명세입니다. 이미지·비디오 입력을 처리하는 비전 토큰, 추론 난이도 조절(xhigh/medium/low), 도구 호출 기능 등이 포함되어 있습니다. 메시지 역할(system, user, assistant, tool)과 생각 토큰을 구분하는 구조로 다단계 상호작용을 지원합니다. Hacker News에서 300+ 추천을 받은 이 모델 공개는 단순한 기술 업데이트가 아니라 오픈소스 AI 접근성 경쟁의 신호입니다."}, {"h": "경량 모델 공개의 전략적 의미", "ko": "27B 규모의 모델을 FP8(저정밀도) 포맷으로 공개한 것은 엣지 디바이스와 로컬 환경에서의 AI 배포를 가능하게 합니다. 이는 클라우드 기반 API에 의존하던 기존 구조에서 벗어나 분산 배포 모델을 촉진합니다. 알리바바가 공개한 모델이 Hugging Face에서 직접 접근 가능하다는 점은 개발자의 진입장벽을 낮추는 전략입니다."}, {"h": "OpenAI·Anthropic 독점 구도 이완", "ko": "대규모 언어모델 시장에서 OpenAI와 Anthropic이 차지한 독점적 지위가 알리바바 같은 기업의 경량 오픈소스 모델 공개로 약화되고 있습니다. 개발자들이 폐쇄형 API 대신 로컬에서 실행 가능한 오픈소스를 선택할 수 있는 옵션이 늘어나면서, 프로프라이터리 모델의 가격 협상력이 감소할 가능성이 높아집니다."}, {"h": "해부 해석의 한계와 검증 필요성", "ko": "원문 본문은 기술 명세만 포함하고 있어 모델의 실제 성능 벤치마크, 추론 속도, 학습 데이터 구성 등 평가에 필수적인 정보가 없습니다. Hacker News 추천 수는 커뮤니티의 관심도를 반영하지만, 실제 산업 영향력이나 채택률은 별개의 문제입니다. 한줄평의 주장도 아직 추정(「경쟁이 심화되고 있으며」, 「신호입니다」)에 가까우므로, 출처 페이지의 전체 문맥과 성능 비교 자료를 참고해야 합니다."}], "caveat": "제공된 텍스트는 모델 명세만 있고 성능 지표·비교 분석·도입 사례가 없으므로, 실제 영향력 평가를 위해 Hugging Face 페이지의 벤치마크 결과와 Hacker News 원문 댓글 토론을 함께 검토할 필요가 있습니다."}, {"id": "ab1f720db0b9", "date": "2026-08-15", "title": "Google is making private AI practical with homomorphic encryption", "ko_title": "구글의 준동형암호 기술, 프라이빗 AI 실용화 단계로 진입", "source": "Hacker News 300+", "url": "https://blog.google/security/how-google-is-making-private-ai-practical-with-homomorphic-encryption/", "sections": [{"h": "프라이빗 AI의 핵심 도구 HEIR 공개", "ko": "구글이 프라이빗 컴퓨팅 툴킷에 새로 추가한 HEIR이라는 오픈소스 컴파일러를 발표했습니다. 이 도구는 암호화된 상태에서도 안전한 AI 추론을 가능하게 하는 기술입니다. AI의 성장으로 새로운 이점이 나타나면서도 프라이버시와 보안 사이의 균형을 맞춰야 한다는 과제가 생겼고, HEIR은 이를 해결하기 위한 구글의 답변입니다."}, {"h": "암호화와 기능성 사이의 오랜 딜레마", "ko": "기존의 엔드투엔드 암호화 같은 보안 방식은 사용자 데이터를 유출로부터 보호하지만, 스팸 탐지나 바이러스 검사처럼 데이터에 의존하는 서비스 기능을 제공할 수 없다는 문제를 안고 있습니다. 의료나 금융 같은 규제가 엄격한 산업에서는 이러한 위험을 더욱 꺼리며, 기관 간 데이터 공유도 법적으로 제한됩니다. 로컬 처리 같은 대안도 기기의 성능 한계와 서비스 제공자의 지적재산권 보호 필요성 때문에 완벽한 해법이 되지 못합니다."}, {"h": "준동형암호의 등장과 가능성", "ko": "준동형암호는 암호화된 데이터 위에서도 직접 계산을 수행할 수 있게 함으로써 이러한 트레이드오프 자체를 바꾸는 기술입니다. 클라우드 서버가 암호화된 데이터를 처리하고 암호화된 결과를 반환할 수 있으므로 실제 정보는 노출되지 않습니다. 예를 들어 클라우드 서비스가 사용자의 개인 정보를 볼 수 없으면서도 콘텐츠 추천을 제공할 수 있습니다. 준동형암호는 계산 비용이 상당하지만, 이를 기술적 불가능에서 경제적 비용 문제로 전환시키며, 그 비용은 빠르게 감소하는 추세입니다."}, {"h": "구글의 프라이버시 기술 역사와 HEIR의 위치", "ko": "구글은 차등 프라이버시, 프라이빗 집합 멤버십, 프라이빗 정보 검색 등 다양한 암호화 기술을 개발해왔으며, 이들은 모두 사용자 데이터 보호라는 목표로 수렴합니다. 준동형암호는 이 도구 상자에 추가되는 또 다른 강력한 기술입니다. 하드웨어 기반 솔루션과 달리 준동형암호는 순수하게 암호학적 보장만으로 강한 보안과 프라이버시를 제공합니다. 다만 기존 프로그램을 준동형암호 방식으로 효율적으로 변환하려면 암호학 전문가 팀이 필요했기에, 구글은 이 진입장벽을 낮추기 위해 HEIR을 개발했습니다."}, {"h": "HEIR 컴파일러의 설계와 비전", "ko": "HEIR은 준동형암호를 위한 오픈소스 컴파일러 도구모음이자 개발 플랫폼으로, 암호화되지 않은 데이터를 처리하는 미리 학습된 AI 모델을 암호화된 입력값에서 작동하도록 변환할 수 있습니다. 구글의 목표는 HEIR을 암호화 추론을 프로덕션 애플리케이션에 통합하는 원클릭 솔루션으로 만드는 것입니다. 2023년 의도 발표 이후 암호화 커뮤니티가 HEIR을 받아들였고, 구글은 준동형암호용 하드웨어 가속기를 개발하는 벨포트, 니오븀, 코르나미, 옵탈리시스 같은 기업들과 파트너십을 맺었습니다."}, {"h": "학계 협력과 연구 성과", "ko": "HEIR은 암호학자들이 자신의 최적화 연구에 집중하면서도 기존 인프라를 테스트, 벤치마킹, 비교에 활용할 수 있는 생산적인 연구 플랫폼으로 확립되었습니다. 조지아 공대, 카네기멜론, UC 산타바바라, 일리노이 공과대, 퍼듀, 에든버러 대학, 칭화 대학 등 여러 기관이 HEIR 위에서 연구하고 있으며, 현재까지 4편의 피어리뷰 논문이 HEIR을 기반으로 발표되었고 더 많은 논문이 준비 중입니다."}, {"h": "실제 적용 사례 네 가지", "ko": "구글은 준동형암호의 발전 정도를 보여주기 위해 HEIR로 컴파일된 네 가지 프라이빗 추론 애플리케이션을 공개했습니다. 첫째는 벨포트 랩스, LG, 뉴욕 대학과의 협력으로 사용자 정보 노출 없이 콘텐츠 추천을 제공하는 딥러닝 모델, 둘째는 니오븀과 hardshell.ai와의 협력으로 신용카드 부정 거래 탐지기, 셋째는 암호화된 네트워크 트래픽 이상 탐지 시스템 키츠네, 넷째는 벨포트 랩스와의 협력으로 오디오 녹음을 보호하면서 음성 명령어를 인식하는 핫워드 감지 모델입니다. 모든 사례는 단일 스레드 CPU 기준의 지연 시간을 공개하며 소스 코드도 깃허브에서 이용할 수 있습니다."}, {"h": "AI 시대 프라이버시 기술의 미래", "ko": "소프트웨어 산업이 AI로 인한 보안과 프라이버시 변화에 적응하면서, 구글의 연구팀은 준동형암호를 개발하기 쉽고, 실행 속도도 빠르며, 산업 전반에 널리 보급되도록 만드는 데 주력하고 있습니다. 이는 규제 위험을 낮추면서 기업용 생성형 AI의 채택을 가속하려는 장기 전략의 일환입니다."}], "caveat": "글에서 제시된 네 가지 애플리케이션의 성능 수치(지연 시간)가 본문에 명시되어 있지 않으므로, 원문의 공식 블로그나 깃허브 리포지토리에서 실제 벤치마크 결과를 직접 확인할 필요가 있습니다."}], "column_links": {"c992986a594f": "log-1917242275", "e19de7deb30d": "log-2473773771", "e2dc35a6be96": "log-2423754145", "3d03f9d3b9ed": "log-1496581969", "67636947efe0": "log-1378073528", "ddb75f2efe54": "log-4049924327", "99bdd8b2cd62": "log-809321530", "afb6d0b82506": "log-1046846530", "fbdfaa10f2aa": "log-395276510", "550006791bdd": "log-1258559650", "311d3f683fc6": "log-3119002283"}}};

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(group) {
  const list = document.getElementById('list');
  const stocks = (DATA.stocks || []).filter(s => s.group === group);
  if (!stocks.length) {
    list.innerHTML = '<div class="no-art">수집된 리서치가 아직 없습니다 — 다음 자동 갱신을 기다려 주세요.</div>';
    return;
  }
  list.innerHTML = stocks.map(s => {
    const arts = (s.articles || []).map(a => {
      const hasKo = a.title_ko && a.title_ko !== a.title;
      const bullets = (a.summary_ko || []).map(b => '<li>' + esc(b) + '</li>').join('');
      return '<a class="art" href="' + esc(a.link) + '" target="_blank" rel="noopener">' +
        '<div class="art-title">' + esc(hasKo ? a.title_ko : a.title) + '</div>' +
        (hasKo ? '<div class="art-orig">' + esc(a.title) + '</div>' : '') +
        (bullets ? '<ul class="art-summary">' + bullets + '</ul>' : '') +
        '<div class="art-meta">' + esc(a.source) + (a.date_label ? ' · ' + esc(a.date_label) : '') + '</div>' +
      '</a>';
    }).join('');
    return '<div class="stock-block">' +
      '<div class="stock-head">' +
        (s.rank ? '<span class="stock-rank">' + esc(s.rank) + '위</span>' : '') +
        '<span class="stock-name">' + esc(s.name) + '</span>' +
        '<span class="stock-ticker">' + esc(s.ticker) + '</span>' +
      '</div>' +
      (arts || '<div class="no-art">최근 2주 내 수집된 기사 없음</div>') +
    '</div>';
  }).join('');
}

function calTimeline(evs){
  // 다가오는 2주 — 1주씩 두 줄 (오늘부터 14일)
  const W = 980, padL = 14, padT = 50, rowH = 198, H = padT + rowH*2 + 26;
  const colW = (W - padL*2) / 7;
  const day0 = new Date(); day0.setHours(0,0,0,0);
  const fmt = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const byDay = {};
  evs.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  const DOW = ['일','월','화','수','목','금','토'];
  let o = '';
  o += '<rect width="' + W + '" height="' + H + '" rx="14" fill="var(--bg-card)"/>';
  o += '<text x="20" y="30" fill="var(--gold)" font-size="16.5" font-weight="800">다가오는 2주 — 관측 캘린더</text>';
  o += '<text x="' + (W-20) + '" y="30" text-anchor="end" fill="var(--gold)" font-size="10.5" font-weight="800">UNIVERTRIX · univertrix.com</text>';
  let total = 0;
  for (let i = 0; i < 14; i++) {
    const d = new Date(day0.getTime() + i*86400000);
    const week = Math.floor(i / 7), col = i % 7;
    const x = padL + colW * col, top = padT + rowH * week, dow = d.getDay();
    const isToday = i === 0, isWknd = dow === 0 || dow === 6;
    if (isWknd) o += '<rect x="' + (x+2).toFixed(1) + '" y="' + top + '" width="' + (colW-4).toFixed(1) + '" height="' + (rowH-12) + '" fill="var(--cal-wknd)" rx="8"/>';
    if (isToday) o += '<rect x="' + (x+2).toFixed(1) + '" y="' + top + '" width="' + (colW-4).toFixed(1) + '" height="' + (rowH-12) + '" fill="var(--gold-bg, rgba(242,186,60,0.12))" stroke="var(--gold)" stroke-width="1.2" rx="8"/>';
    o += '<text x="' + (x+colW/2).toFixed(1) + '" y="' + (top+20) + '" text-anchor="middle" fill="' + (isToday ? 'var(--gold)' : 'var(--text)') + '" font-size="13.5" font-weight="800">' + (d.getMonth()+1) + '/' + d.getDate() + '</text>';
    o += '<text x="' + (x+colW/2).toFixed(1) + '" y="' + (top+36) + '" text-anchor="middle" fill="' + (isToday ? 'var(--gold)' : 'var(--text-muted)') + '" font-size="10.5" font-weight="700">' + (isToday ? '오늘' : DOW[dow]) + '</text>';
    const dayEvs = byDay[fmt(d)] || [];
    total += dayEvs.length;
    dayEvs.slice(0, 4).forEach((e, k) => {
      const y = top + 46 + k * 33;
      const isE = e.type === 'earnings';
      const label = String(e.ticker || (e.title || '').split(' ')[0]).slice(0, 8);
      o += '<rect x="' + (x+8).toFixed(1) + '" y="' + y + '" width="' + (colW-16).toFixed(1) + '" height="26" rx="7" fill="' + (isE ? 'var(--gold-bg, rgba(242,186,60,0.14))' : 'var(--cal-blue-bg)') + '" stroke="' + (isE ? 'var(--gold)' : 'var(--cal-blue)') + '" stroke-width="1"/>';
      o += '<text x="' + (x+colW/2).toFixed(1) + '" y="' + (y+17.5) + '" text-anchor="middle" fill="' + (isE ? 'var(--gold)' : 'var(--cal-blue)') + '" font-size="12" font-weight="800">' + esc(label) + '</text>';
    });
    if (dayEvs.length > 4)
      o += '<text x="' + (x+colW/2).toFixed(1) + '" y="' + (top+46+4*33+13) + '" text-anchor="middle" fill="var(--text-muted)" font-size="10" font-weight="800">+' + (dayEvs.length-4) + '</text>';
  }
  o += '<text x="20" y="' + (H-8) + '" fill="var(--text-muted)" font-size="9.5">금빛 = 실적 발표 · 코발트 = 경제지표·기타 — 2주 내 ' + total + '건</text>';
  return '<div class="col-chart" style="margin:0 0 18px;border-radius:14px;overflow:hidden;border:1px solid var(--line);line-height:0">' +
    '<svg style="width:100%;height:auto;display:block" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' + o + '</svg></div>';
}

    return;
  }
  const today = new Date(new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' }));
  const typeLabel = { macro: 'FOMC·매크로', earnings: '실적 발표', event: '이벤트' };
  list.innerHTML = calTimeline(evs) + evs.map(e => {
    const d = new Date(e.date);
    const diff = Math.round((d - today) / 86400000);
    const dday = diff === 0 ? 'TODAY' : (diff > 0 ? 'D-' + diff : 'D+' + Math.abs(diff));
    const md = (d.getMonth() + 1) + '/' + d.getDate();
    return '<div class="cal-item">' +
      '<div class="cal-date"><div class="d">' + md + '</div>' +
      '<span class="dday' + (diff === 0 ? ' today' : '') + '">' + dday + '</span></div>' +
      '<div class="cal-body"><div class="cal-title">' + esc(e.title) + '</div>' +
      '<span class="cal-type ' + esc(e.type || '') + '">' + (typeLabel[e.type] || '일정') + '</span></div>' +
    '</div>';
  }).join('');
}

function renderGurus() {
  const list = document.getElementById('list');
  const gs = (DATA.gurus && DATA.gurus.gurus) || [];
  if (!gs.length) {
    list.innerHTML = '<div class="no-art">거인 포트폴리오가 아직 수집되지 않았습니다 — 다음 자동 갱신을 기다려 주세요.</div>';
    return;
  }
  const note = '<div class="guru-note">SEC 13F 공시 기준 — 분기 1회 · 최대 45일 지연 공시 · 미국 상장 롱포지션만 포함됩니다. ' +
    '실제 현재 보유와 다를 수 있으며, 투자 권유가 아닙니다.' +
    (DATA.gurus.generated_label ? ' <span style="white-space:nowrap">(수집: ' + esc(DATA.gurus.generated_label) + ' KST)</span>' : '') + '</div>';
  list.innerHTML = note + gs.map((g, gi) => {
    const rows = (g.holdings || []).map((h, i) => {
      let cls = '', txt = h.chg || '―';
      if (txt === 'NEW') { cls = 'new'; txt = '신규'; }
      else if (txt.startsWith('+')) cls = 'up';
      else if (txt.startsWith('-')) cls = 'down';
      const bw = Math.min(100, (h.pct / (g.holdings[0].pct || 1)) * 100);
      return '<div class="guru-row">' +
        '<span class="guru-rank">' + (i + 1) + '</span>' +
        '<span class="guru-issuer">' + esc(h.name) + '</span>' +
        '<span class="guru-bar-wrap"><span class="guru-bar" style="width:' + bw + '%"></span></span>' +
        '<span class="guru-pct">' + h.pct + '%</span>' +
        '<span class="guru-chg ' + cls + '">' + esc(txt) + '</span>' +
      '</div>';
    }).join('');
    const exits = (g.exits && g.exits.length)
      ? '<div class="guru-exits"><b>전량 매도:</b> ' + g.exits.map(esc).join(' · ') + '</div>' : '';
    return '<div class="guru-block" id="guru-' + gi + '" onclick="toggleGuru(' + gi + ')">' +
      '<div class="guru-head"><span class="guru-name">' + esc(g.name_ko) + '</span>' +
      '<span class="guru-person">' + esc(g.person) + '</span>' +
      '<span class="guru-toggle">▼</span></div>' +
      '<div class="guru-tagline">' + esc(g.tagline) + '</div>' +
      '<div class="guru-body">' +
        '<div class="guru-meta">' + esc(g.period_label) + ' 보고 (공시 ' + esc(g.filed) + ') · 운용 $' +
          Number(g.total_b).toLocaleString() + 'B · ' + g.positions + '종목 중 TOP ' + (g.holdings || []).length +
          ' · 지분 증감은 전분기 대비</div>' +
        rows + exits +
      '</div>' +
    '</div>';
  }).join('');
}

function toggleGuru(gi) {
  const el = document.getElementById('guru-' + gi);
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.guru-block.open').forEach(b => b.classList.remove('open'));
  if (!wasOpen) { el.classList.add('open'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}

const TAG_COLOR = { '에세이': '#9c7a3a', '모델 발표': '#386ee1', '연구': '#2e9d87', '정책·규제': '#c05555', '투자·산업': '#7a6cc4', '기타': '#6a7390' };
function renderSignals(){
  const sg = (DATA.signals && DATA.signals.signals) || [];
  const label = (DATA.signals && DATA.signals.generated_label) || '';
  if (!sg.length) { document.getElementById('list').innerHTML =
    '<div class="empty-note">📡 신호 관측소 가동 준비 중 — 첫 수집 후 이곳에 실리콘밸리의 고신호 담론·발표가 잡힙니다.</div>'; return; }
  let html = '<div class="gen-note" style="font-size:12px;color:var(--text-muted);margin-bottom:14px">해커뉴스 300점↑ 집단 주목 + AI 랩 공식 발표 — 매일 자동 포착' + (label ? ' (최근 수집: ' + esc(label) + ' KST)' : '') + '</div>';
  const now = Date.now();
  // 고정 기간: 추천수 1000↑ 초신성급 = 30일, 그 외 필독 = 7일
  const pinDays = x => ((x.points || 0) >= 1000 ? 30 : 7);
  const isRecent = x => { const d = new Date((x.captured || '').replace(' ', 'T')); return !isNaN(d) && (now - d.getTime()) < pinDays(x) * 86400000; };
  const pinned = sg.filter(x => x.pin && isRecent(x));
  // 표시 문턱: HN 신호는 추천수 400점 이상만 노출 (수집·보관은 300점부터 계속 —
  // 문턱만 낮추면 과거분도 재등장). 포인트 없는 공식 발표(RSS)와 필독 고정은 예외.
  const SHOW_MIN_POINTS = 400;
  const rest = sg.filter(x => !pinned.includes(x)
    && (x.points == null || x.points >= SHOW_MIN_POINTS));
  // 재배치: 고정(필독)은 최상단 유지, 그 안에서도·나머지도 추천수(▲) 많은 순.
  // 포인트 없는 공식 발표(RSS)는 동률(0점) 취급 — 같은 점수끼리는 최신 수집순.
  const byVotes = (a, b) => ((b.points || 0) - (a.points || 0))
    || String(b.captured || '').localeCompare(String(a.captured || ''));
  pinned.sort(byVotes);
  rest.sort(byVotes);
  const card = (x, pin) => {
    const tag = x.tag || '기타';
    return '<div class="sig-card' + (pin ? ' pin' : '') + '">' +
      (pin ? '<div class="sig-pin-label">📌 필독 신호 — 관제탑 지정</div>' : '') +
      '<div class="sig-meta">' +
      '<span class="sig-tag" style="background:' + (TAG_COLOR[tag] || '#6a7390') + '">' + esc(tag) + '</span>' +
      (x.points ? '<span class="sig-points">▲ ' + x.points + '</span>' : '') +
      '<span>' + esc(x.source || '') + (x.captured ? ' · ' + esc(x.captured.slice(5, 16)) : '') + '</span></div>' +
      '<a href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer" class="sig-link">' +
      '<div class="sig-title">' + esc(x.ko || x.title) + '</div>' +
      (x.ko ? '<div class="sig-title-en">' + esc(x.title) + '</div>' : '') + '</a>' +
      (x.why ? '<div class="sig-why">' + esc(x.why) + '</div>' : '') +
    '</div>';
  };
  if (pinned.length) html += pinned.map(x => card(x, true)).join('');
  html += rest.map(x => card(x, false)).join('');
  document.getElementById('list').innerHTML = html;
}

// 🔬 필독 해부실 — 필독 신호 원문의 문단별 한국어 브리핑 (전문 번역 아님)
const DX_NOTICE = '본 글은 원문의 논지를 재서술한 브리핑이며 전문 번역이 아닙니다.';
function renderDissect(){
  const items = (DATA.translations && DATA.translations.items) || [];
  const label = (DATA.translations && DATA.translations.generated_label) || '';
  if (!items.length) { document.getElementById('list').innerHTML =
    '<div class="empty-note">🔬 해부실 준비 중 — 필독 신호가 지정되면 원문을 문단별로 해부해 이곳에 싣습니다.</div>'; return; }
  let html = '<div class="gen-note" style="font-size:12px;color:var(--text-muted);margin-bottom:14px">필독 신호의 원문을 문단·섹션 단위로 재서술한 한국어 브리핑' + (label ? ' (최근 해부: ' + esc(label) + ' KST)' : '') + '</div>';
  html += '<div class="ud-index"><div class="ud-index-title">해부 목록 ' + items.length + '건</div>' +
    items.map(it => '<a class="ud-index-row" href="#dx-' + esc(it.id) + '">' +
      '<span class="ud-index-date">' + esc(it.date || '') + '</span>' +
      esc(it.ko_title || it.title) + '</a>').join('') + '</div>';
  const colLinks = (DATA.translations && DATA.translations.column_links) || {};
  html += items.map(it => {
    const secs = (it.sections || []).map(s =>
      '<div class="dx-sec"><h4>' + esc(s.h || '') + '</h4><p>' + esc(s.ko || '') + '</p></div>').join('');
    // 역방향 링크 — 이 원문으로 쓴 관측일지 칼럼이 있을 때만 (영구 슬러그 #log-)
    const slug = colLinks[it.id];
    return '<div class="dx-card" id="dx-' + esc(it.id) + '">' +
      '<div class="dx-meta"><span class="dx-badge">🔬 해부</span>' +
        '<span>' + esc(it.source || '') + (it.date ? ' · ' + esc(it.date) : '') + '</span></div>' +
      '<div class="dx-title">' + esc(it.ko_title || it.title) + '</div>' +
      (it.ko_title && it.title ? '<div class="dx-orig">' + esc(it.title) + '</div>' : '') +
      '<a class="dx-src" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">원문 읽기 ↗</a>' +
      '<div class="dx-actions">' +
        '<button onclick="dxCopyLink(event,\'' + esc(it.id) + '\')">🔗 링크 복사</button>' +
        (slug ? '<a href="observatory.html#' + esc(slug) + '">📄 칼럼 보기 →</a>' : '') +
      '</div>' +
      secs +
      (it.caveat ? '<div class="dx-caveat">⚠ ' + esc(it.caveat) + '</div>' : '') +
      '<div class="dx-notice">' + DX_NOTICE + ' 인용은 최소한으로 제한했으며, 정확한 표현·수치는 위 원문을 확인해 주십시오.</div>' +
    '</div>';
  }).join('');
  document.getElementById('list').innerHTML = html;
  openDissectFromHash();
}

// 해부 글 영구 링크 복사 — 관측일지 copyColLink와 같은 문법(복사 + 완료 피드백)
function dxCopyLink(ev, id){
  ev.preventDefault(); ev.stopPropagation();
  const btn = ev.target;
  const url = location.origin + location.pathname.replace(/[^/]*$/, '') + 'research.html#dx-' + id;
  const done = () => { const o = btn.textContent; btn.textContent = '✓ 복사됨'; setTimeout(() => { btn.textContent = o; }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done, () => window.prompt('아래 주소를 복사하세요 (Ctrl+C):', url));
  } else {
    window.prompt('아래 주소를 복사하세요 (Ctrl+C):', url);
  }
}

// #dx-… 진입 처리 — 관측일지 openFromHash와 동일 패턴
function openDissectFromHash(){
  const h = location.hash.replace('#', '');
  if (!h.startsWith('dx-')) return;
  const card = document.getElementById(h);
  if (card) setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
}

function setGroup(g, btn) {
  document.querySelectorAll('.group-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (g === 'calendar') renderCalendar(); else if (g === 'gurus') renderGurus(); else if (g === 'signals') renderSignals(); else if (g === 'dissect') renderDissect(); else render(g);
}

document.addEventListener('DOMContentLoaded', function () {
  if (DATA.generated_label) {
    document.getElementById('genLabel').textContent = '마지막 수집: ' + DATA.generated_label + ' KST';
  }
  // 해부실 딥링크 (#dx-…) — 관측일지 '해부실에서 보기'·해부 글 링크 복사가 이 경로로 들어온다
  // (관측일지의 #log- 진입 처리와 같은 패턴: 탭을 열면 렌더 끝에서 openDissectFromHash가 스크롤)
  if (location.hash && location.hash.indexOf('#dx-') === 0) {
    const btn = document.querySelector('.group-tab[data-g="dissect"]');
    if (btn) { setGroup('dissect', btn); return; }
    renderDissect();
    return;
  }
  // 순수 탭 해시 딥링크 (#signals·#dissect·#calendar·#gurus) — 메인 STAGE 3 버튼이 이 경로로 들어온다
  // #dx- 분기를 지난 뒤이므로 해부실 영구 슬러그와 충돌하지 않는다
  const tabHash = { '#signals': 'signals', '#dissect': 'dissect',
    '#calendar': 'calendar', '#gurus': 'gurus' }[location.hash];
  if (tabHash) {
    const btn = document.querySelector('.group-tab[data-g="' + tabHash + '"]');
    if (btn) { setGroup(tabHash, btn); return; }
  }
  render('universe');
});
</script>
